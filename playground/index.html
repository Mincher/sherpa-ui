<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sherpa UI Playground</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/styles/index.css">
  <script type="module" src="../components/index.js"></script>
  <link rel="stylesheet" href="./playground.css">
</head>
<body>
  <!-- Main playground shell -->
  <div class="playground-shell">
    <!-- Header -->
    <header class="playground-header">
      <div class="playground-logo">
        <h1>Sherpa UI Playground</h1>
        <sherpa-tag data-status="info">Interactive</sherpa-tag>
      </div>
      <sherpa-toolbar class="playground-actions">
        <sherpa-button
          data-variant="secondary"
          data-size="sm"
          id="share-btn"
          data-label="Copy shareable link">
          <i slot="icon-before" class="fa-solid fa-share-nodes"></i>
          Share
        </sherpa-button>
        <sherpa-button
          data-variant="secondary"
          data-size="sm"
          id="reset-btn"
          data-label="Reset to defaults">
          <i slot="icon-before" class="fa-solid fa-rotate-right"></i>
          Reset
        </sherpa-button>
        <sherpa-button
          data-variant="secondary"
          data-size="sm"
          id="copy-code-btn"
          data-label="Copy code to clipboard">
          <i slot="icon-before" class="fa-solid fa-copy"></i>
          Copy Code
        </sherpa-button>
      </sherpa-toolbar>
    </header>

    <!-- Main content area with 3-column grid -->
    <div class="playground-main">
      <!-- Left Sidebar: Component Selector & Controls -->
      <sherpa-container class="playground-sidebar">
        <sherpa-container-header>
          Component Selector
        </sherpa-container-header>

        <div class="sidebar-content">
          <!-- Component Selector -->
          <div class="control-group">
            <label class="control-label" for="component-selector">Select Component</label>
            <select id="component-selector" class="component-select">
              <option value="">Choose a component...</option>
            </select>
          </div>

          <!-- Attribute Controls (shown when component selected) -->
          <sherpa-container
            id="controls-container"
            data-variant="flat"
            style="display: none; margin-top: 1rem;">
            <sherpa-container-header>
              Attributes
            </sherpa-container-header>
            <div id="attribute-controls" class="controls-list"></div>
          </sherpa-container>

          <!-- Slot Controls (shown when component has slots) -->
          <sherpa-container
            id="slots-container"
            data-variant="flat"
            style="display: none; margin-top: 1rem;">
            <sherpa-container-header>
              Slots
            </sherpa-container-header>
            <div id="slot-controls" class="controls-list"></div>
          </sherpa-container>
        </div>
      </sherpa-container>

      <!-- Center: Code Editor & Preview -->
      <div class="playground-center">
        <!-- Code Editor Panel -->
        <sherpa-panel data-variant="bordered" class="code-panel">
          <sherpa-container-header slot="header">
            HTML Code
          </sherpa-container-header>
          <textarea
            id="code-editor"
            class="code-editor"
            spellcheck="false"
            placeholder="Select a component to get started..."></textarea>
        </sherpa-panel>

        <!-- Live Preview Panel -->
        <sherpa-panel data-variant="bordered" class="preview-panel">
          <sherpa-container-header slot="header">
            Live Preview
            <sherpa-switch
              slot="actions"
              id="dark-mode-toggle"
              data-label="Dark Mode"
              data-size="sm">
            </sherpa-switch>
          </sherpa-container-header>
          <div id="preview-container" class="preview-container">
            <sherpa-empty-state
              data-icon="fa-code"
              data-heading="No Component Selected"
              data-description="Select a component from the dropdown to see a live preview">
            </sherpa-empty-state>
          </div>
        </sherpa-panel>
      </div>

      <!-- Right Sidebar: API Documentation -->
      <sherpa-container class="playground-api">
        <sherpa-container-header>
          API Documentation
        </sherpa-container-header>

        <div id="api-docs" class="api-docs-content">
          <sherpa-empty-state
            data-icon="fa-book"
            data-heading="No Component Selected"
            data-description="Select a component to view its API documentation">
          </sherpa-empty-state>
        </div>
      </sherpa-container>
    </div>
  </div>

  <!-- Load playground logic -->
  <script type="module" src="./playground.js"></script>
</body>
</html>
