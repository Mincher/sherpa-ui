<!doctype html>
<html lang="en" data-theme="apex-2-purple">
  <head>
    <title>Sherpa UI — Design System</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Open+Sans:wght@400;600;700&family=Source+Code+Pro:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Syntax highlighting -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link href="/css/styles/index.css" rel="stylesheet" />
    <link href="/docs/docs.css" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100dvh; overflow: hidden; }
    </style>
  </head>
  <body>

    <!-- ── App shell ────────────────────────────────────────────────────── -->
    <div class="docs-shell">

      <!-- Left — full-height nav -->
      <sherpa-nav
        id="docs-nav-panel"
        data-src-html="/docs/nav.html"
        data-track-recents="false"
      ></sherpa-nav>

      <!-- Right — layout view with embedded view header -->
      <sherpa-layout-view id="docs-view" data-fill="parent" data-heading="Sherpa UI">

        <!-- Appearance controls forwarded to the view header's view-selection area -->
        <sherpa-input-select
          slot="header-actions"
          id="theme-select"
          data-size="small"
          data-label="Theme"
          data-layout="horizontal"
        ></sherpa-input-select>
        <sherpa-input-select
          slot="header-actions"
          id="mode-select"
          data-size="small"
          data-label="Mode"
          data-layout="horizontal"
        ></sherpa-input-select>
        <sherpa-input-select
          slot="header-actions"
          id="density-select"
          data-size="small"
          data-label="Density"
          data-layout="horizontal"
        ></sherpa-input-select>

        <!-- Router outlet -->
        <main id="docs-outlet" aria-live="polite" aria-label="Documentation content">
          <!-- Page content injected by router.js -->
        </main>

      </sherpa-layout-view>
    </div>

    <script type="module" src="/components/index.js"></script>
    <script type="module" src="/docs/router.js"></script>
  </body>
</html>
