<!doctype html>
<html lang="en">
  <head>
    <title>Sherpa UI — Component Playground</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Open+Sans:wght@400;600;700&family=Source+Code+Pro:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link href="css/styles/index.css" rel="stylesheet" />
    <link
      id="sherpa-theme"
      rel="stylesheet"
      href="/css/styles/sherpa-theme-apex-2-core.css"
    />
    <style>
      /* Minimal layout shell — chrome is composed from sherpa-* components. */
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: var(--sherpa-typeface-open-sans-style-name, "Open Sans"), Arial, sans-serif;
        font-size: var(--sherpa-fonts-scale-base, 14px);
        color: var(--sherpa-text-default-body, #333);
        background: var(--sherpa-surface-app-product-bg-default, #f5f5f5);
        display: flex;
        flex-direction: column;
      }

      .playground-layout {
        display: flex;
        flex: 1;
        min-height: 0;
      }

      .playground-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        overflow: auto;
        padding: var(--sherpa-space-md, 16px);
        gap: var(--sherpa-space-md, 16px);
      }

      #preview-container {
        min-height: 160px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #preview-container > * { flex-shrink: 0; }

      #component-list-panel {
        flex: 1;
        min-height: 0;
      }

      /* Wider rails so input controls and labels have room to breathe. */
      #sidebar-section,
      #controls-section { --_section-width: 360px; }

      .controls-section + .controls-section { margin-top: var(--sherpa-space-lg, 24px); }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: var(--sherpa-space-2xs, 4px);
        margin-bottom: var(--sherpa-space-sm, 12px);
      }

      .control-group > sherpa-input-text,
      .control-group > sherpa-input-number,
      .control-group > sherpa-input-select { width: 100%; }

      /* Switch row: label on the left, switch on the right. */
      .control-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--sherpa-space-sm, 12px);
        padding: var(--sherpa-space-2xs, 4px) 0;
      }

      .control-row-text {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .control-row-label {
        font-weight: var(--sherpa-font-weight-semibold, 600);
        color: var(--sherpa-text-default-label, #1a1a1f);
        font-size: var(--sherpa-fonts-scale-base, 14px);
        line-height: 1.3;
        word-break: break-word;
      }

      .control-row-description {
        font-size: var(--sherpa-fonts-scale-sm, 12px);
        color: var(--sherpa-text-default-secondary, #6a6a75);
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <!-- Site header -->
    <sherpa-view-header
      id="site-header"
      data-label="Sherpa UI Component Playground"
    ></sherpa-view-header>

    <!-- Main layout -->
    <div class="playground-layout">
      <!-- Sidebar: left content-section housing a searchable list-panel -->
      <sherpa-content-section
        id="sidebar-section"
        data-position="left"
        data-heading="Components"
        data-restore-label="Components"
      >
        <sherpa-list-panel
          id="component-list-panel"
          data-match="sherpa-list-item"
          data-empty="No components match"
        ></sherpa-list-panel>
      </sherpa-content-section>

      <!-- Main content -->
      <main class="playground-main">
        <sherpa-empty-state
          id="empty-state"
          data-label="Select a component"
          data-description="Pick a component from the sidebar to preview it here."
          data-illustration="empty"
        ></sherpa-empty-state>

        <div id="content-area" hidden>
          <sherpa-section-header
            id="preview-title-header"
            data-label="Component Preview"
            data-divider
          ></sherpa-section-header>
          <sherpa-card id="preview-card" data-elevation="sm">
            <div id="preview-container"></div>
          </sherpa-card>
        </div>
      </main>

      <!-- Controls: right content-section, minimisable to a strip -->
      <sherpa-content-section
        id="controls-section"
        data-position="right"
        data-heading="Controls"
        data-restore-label="Controls"
      >
        <div id="controls-content"></div>
      </sherpa-content-section>
    </div>

    <script type="module">
      // ── Eagerly load sherpa components used in the playground chrome ──
      import "./components/sherpa-view-header/sherpa-view-header.js";
      import "./components/sherpa-content-section/sherpa-content-section.js";
      import "./components/sherpa-list-panel/sherpa-list-panel.js";
      import "./components/sherpa-list/sherpa-list.js";
      import "./components/sherpa-list-item/sherpa-list-item.js";
      import "./components/sherpa-empty-state/sherpa-empty-state.js";
      import "./components/sherpa-card/sherpa-card.js";
      import "./components/sherpa-section-header/sherpa-section-header.js";
      import "./components/sherpa-input-text/sherpa-input-text.js";
      import "./components/sherpa-input-number/sherpa-input-number.js";
      import "./components/sherpa-input-select/sherpa-input-select.js";
      import "./components/sherpa-switch/sherpa-switch.js";
      import "./components/sherpa-button/sherpa-button.js";
      import "./components/sherpa-message/sherpa-message.js";

      // ═══════════════════════════════════════════════════════════
      // COMPONENT LIST & METADATA
      // ═══════════════════════════════════════════════════════════

      const COMPONENTS = [
        { tag: "sherpa-footer", category: "Layout & Navigation", label: "Footer" },
        { tag: "sherpa-nav", category: "Layout & Navigation", label: "Nav" },
        { tag: "sherpa-nav-item", category: "Layout & Navigation", label: "Nav Item" },
        { tag: "sherpa-nav-promo", category: "Layout & Navigation", label: "Nav Promo" },
        { tag: "sherpa-view-header", category: "Layout & Navigation", label: "View Header" },
        { tag: "sherpa-section-header", category: "Layout & Navigation", label: "Section Header" },
        { tag: "sherpa-container", category: "Layout & Navigation", label: "Container" },
        { tag: "sherpa-container-header", category: "Layout & Navigation", label: "Container Header" },
        { tag: "sherpa-container-pdf-exporter", category: "Layout & Navigation", label: "Container PDF Exporter" },
        { tag: "sherpa-layout-grid", category: "Layout & Navigation", label: "Layout Grid" },
        { tag: "sherpa-toolbar", category: "Layout & Navigation", label: "Toolbar" },

        { tag: "sherpa-data-grid", category: "Data Visualization", label: "Data Grid" },
        { tag: "sherpa-barchart", category: "Data Visualization", label: "Bar Chart" },
        { tag: "sherpa-donut-chart", category: "Data Visualization", label: "Donut Chart" },
        { tag: "sherpa-gauge-chart", category: "Data Visualization", label: "Gauge Chart" },
        { tag: "sherpa-line-chart", category: "Data Visualization", label: "Line Chart" },
        { tag: "sherpa-metric", category: "Data Visualization", label: "Metric" },
        { tag: "sherpa-sparkline", category: "Data Visualization", label: "Sparkline" },
        { tag: "sherpa-chart-legend", category: "Data Visualization", label: "Chart Legend" },
        { tag: "sherpa-key-value-list", category: "Data Visualization", label: "Key-Value List" },

        { tag: "sherpa-button", category: "Controls", label: "Button" },
        { tag: "sherpa-switch", category: "Controls", label: "Switch" },
        { tag: "sherpa-stepper", category: "Controls", label: "Stepper" },
        { tag: "sherpa-tag", category: "Controls", label: "Tag" },
        { tag: "sherpa-pagination", category: "Controls", label: "Pagination" },
        { tag: "sherpa-slider", category: "Controls", label: "Slider" },
        { tag: "sherpa-progress-bar", category: "Controls", label: "Progress Bar" },
        { tag: "sherpa-progress-tracker", category: "Controls", label: "Progress Tracker" },

        { tag: "sherpa-input-text", category: "Inputs", label: "Text Input" },
        { tag: "sherpa-input-number", category: "Inputs", label: "Number Input" },
        { tag: "sherpa-input-password", category: "Inputs", label: "Password Input" },
        { tag: "sherpa-input-search", category: "Inputs", label: "Search Input" },
        { tag: "sherpa-input-select", category: "Inputs", label: "Select Input" },
        { tag: "sherpa-input-date", category: "Inputs", label: "Date Input" },
        { tag: "sherpa-input-date-range", category: "Inputs", label: "Date Range Input" },
        { tag: "sherpa-input-time", category: "Inputs", label: "Time Input" },
        { tag: "sherpa-input-checkbox", category: "Inputs", label: "Checkbox Input" },
        { tag: "sherpa-input-checkbox-group", category: "Inputs", label: "Checkbox Group" },
        { tag: "sherpa-input-radio", category: "Inputs", label: "Radio Input" },
        { tag: "sherpa-input-radio-group", category: "Inputs", label: "Radio Group" },
        { tag: "sherpa-input-tag", category: "Inputs", label: "Tag Input" },
        { tag: "sherpa-file-upload", category: "Inputs", label: "File Upload" },

        { tag: "sherpa-dialog", category: "Feedback & Overlays", label: "Dialog" },
        { tag: "sherpa-toast", category: "Feedback & Overlays", label: "Toast" },
        { tag: "sherpa-tooltip", category: "Feedback & Overlays", label: "Tooltip" },
        { tag: "sherpa-message", category: "Feedback & Overlays", label: "Message" },
        { tag: "sherpa-empty-state", category: "Feedback & Overlays", label: "Empty State" },
        { tag: "sherpa-menu", category: "Feedback & Overlays", label: "Menu" },
        { tag: "sherpa-menu-item", category: "Feedback & Overlays", label: "Menu Item" },
        { tag: "sherpa-popover", category: "Feedback & Overlays", label: "Popover" },
        { tag: "sherpa-callout", category: "Feedback & Overlays", label: "Callout" },
        { tag: "sherpa-accordion", category: "Feedback & Overlays", label: "Accordion" },
        { tag: "sherpa-tabs", category: "Feedback & Overlays", label: "Tabs" },
        { tag: "sherpa-list", category: "Feedback & Overlays", label: "List" },
        { tag: "sherpa-list-item", category: "Feedback & Overlays", label: "List Item" },
        { tag: "sherpa-list-panel", category: "Feedback & Overlays", label: "List Panel" },

        { tag: "sherpa-card", category: "Content", label: "Card" },
        { tag: "sherpa-icon", category: "Content", label: "Icon" },
        { tag: "sherpa-filter-bar", category: "Content", label: "Filter Bar" },
        { tag: "sherpa-section-nav", category: "Content", label: "Section Nav" },
        { tag: "sherpa-transfer-list", category: "Content", label: "Transfer List" },
        { tag: "sherpa-product-bar", category: "Content", label: "Product Bar" },
        { tag: "sherpa-product-bar-v2", category: "Content", label: "Product Bar V2" },
        { tag: "sherpa-loader", category: "Content", label: "Loader" },
        { tag: "sherpa-ai-panel", category: "Content", label: "AI Panel" },
        { tag: "sherpa-chat-message", category: "Content", label: "Chat Message" },
        { tag: "sherpa-prompt-composer", category: "Content", label: "Prompt Composer" },
        { tag: "sherpa-content-section", category: "Content", label: "Content Section" },
        { tag: "sherpa-node", category: "Content", label: "Node" },
        { tag: "sherpa-node-canvas", category: "Content", label: "Node Canvas" },
        { tag: "sherpa-node-header", category: "Content", label: "Node Header" },
        { tag: "sherpa-node-row", category: "Content", label: "Node Row" },
        { tag: "sherpa-node-socket", category: "Content", label: "Node Socket" },
        { tag: "sherpa-scheduler", category: "Content", label: "Scheduler" },
        { tag: "sherpa-panel", category: "Content", label: "Panel" },
      ];

      // ═══════════════════════════════════════════════════════════
      // METADATA CACHE & JSDoc PARSER
      // ═══════════════════════════════════════════════════════════

      const metadataCache = new Map();

      function parseJSDoc(jsContent) {
        const metadata = { attributes: [], slots: [], events: [] };

        const attrRegex = /@attr\s+\{([^}]+)\}\s+(\[?[^\]\s]+\]?)\s+—\s+(.+?)(?=\n|$)/g;
        let match;
        while ((match = attrRegex.exec(jsContent)) !== null) {
          let [, type, name, description] = match;
          name = name.replace(/[\[\]]/g, "").trim();
          metadata.attributes.push({
            name,
            type: type.trim(),
            description: description.trim(),
          });
        }

        const slotRegex = /@slot\s+(?:\[([^\]]+)\])?(?:\s+—\s+(.+?))?(?=\n|$)/g;
        while ((match = slotRegex.exec(jsContent)) !== null) {
          const [, name, description] = match;
          metadata.slots.push({
            name: name ? name.trim() : "",
            description: description ? description.trim() : "",
          });
        }

        const firesRegex = /@fires\s+([^\s]+)\s+—\s+(.+?)(?=\n|$)/g;
        while ((match = firesRegex.exec(jsContent)) !== null) {
          const [, eventName, description] = match;
          metadata.events.push({
            name: eventName.trim(),
            description: description.trim(),
          });
        }

        return metadata;
      }

      async function getComponentMetadata(tag) {
        if (metadataCache.has(tag)) return metadataCache.get(tag);
        try {
          const response = await fetch(`components/${tag}/${tag}.js`);
          if (!response.ok) throw new Error(`Failed to fetch ${tag}`);
          const metadata = parseJSDoc(await response.text());
          metadataCache.set(tag, metadata);
          return metadata;
        } catch (error) {
          console.warn(`Could not load metadata for ${tag}:`, error);
          return { attributes: [], slots: [], events: [] };
        }
      }

      // ═══════════════════════════════════════════════════════════
      // UI INITIALIZATION
      // ═══════════════════════════════════════════════════════════

      const componentListPanel = document.getElementById("component-list-panel");
      const emptyState         = document.getElementById("empty-state");
      const contentArea        = document.getElementById("content-area");
      const previewTitleHeader = document.getElementById("preview-title-header");
      const previewContainer   = document.getElementById("preview-container");
      const controlsContent    = document.getElementById("controls-content");

      let currentComponent = null;
      let currentInstance  = null;
      let eventLog         = [];
      const MAX_EVENTS     = 50;

      // Build sidebar list-panel content as a sherpa-list of sherpa-list-items
      function populateSidebar() {
        const list = document.createElement("sherpa-list");
        list.dataset.variant = "divided";

        COMPONENTS.forEach((component) => {
          const item = document.createElement("sherpa-list-item");
          item.dataset.label       = component.label;
          item.dataset.description = `<${component.tag}>`;
          item.dataset.interactive = "";
          item.dataset.tag         = component.tag;
          list.appendChild(item);
        });

        componentListPanel.appendChild(list);
      }

      populateSidebar();

      // sherpa-list-item dispatches `list-item-click` (bubbles + composed).
      componentListPanel.addEventListener("list-item-click", (e) => {
        const itemEl = e.composedPath().find(
          (n) => n instanceof HTMLElement && n.tagName === "SHERPA-LIST-ITEM"
        );
        if (itemEl?.dataset.tag) selectComponent(itemEl.dataset.tag);
      });

      // ═══════════════════════════════════════════════════════════
      // COMPONENT SELECTION & PREVIEW
      // ═══════════════════════════════════════════════════════════

      async function selectComponent(tag) {
        currentComponent = tag;
        eventLog = [];

        componentListPanel.querySelectorAll("sherpa-list-item").forEach((item) => {
          item.toggleAttribute("data-active", item.dataset.tag === tag);
        });

        emptyState.hidden  = true;
        contentArea.hidden = false;

        const component = COMPONENTS.find((c) => c.tag === tag);
        previewTitleHeader.dataset.label = `${component.label}  <${tag}>`;

        const metadata = await getComponentMetadata(tag);
        await createComponentPreview(tag, metadata);
        renderControls(metadata);

        sessionStorage.setItem("selectedComponent", tag);
      }

      async function createComponentPreview(tag, metadata) {
        previewContainer.innerHTML = "";

        try {
          await import(`./components/${tag}/${tag}.js`);
          currentInstance = document.createElement(tag);

          // Pre-populate every non-boolean attribute with a sensible test
          // value so the preview shows real content out of the gate.
          metadata.attributes.forEach((attr) => {
            if (attr.type === "boolean") return;
            const sample = sampleValueFor(attr, tag);
            if (sample !== null && sample !== "") {
              setHostAttr(attr.name, sample, currentInstance);
            }
          });

          if (metadata.slots.some((s) => !s.name) && !currentInstance.textContent) {
            currentInstance.textContent = "Sample content";
          }

          previewContainer.appendChild(currentInstance);
        } catch (error) {
          console.error(`Failed to create component ${tag}:`, error);
          const msg = document.createElement("sherpa-message");
          msg.dataset.status = "critical";
          msg.dataset.label  = `Error loading component: ${error.message}`;
          previewContainer.appendChild(msg);
        }
      }

      // ── Sample value heuristic per attribute ──
      // Returns a representative test value to prefill into the preview
      // (and into the matching control input).
      function sampleValueFor(attr, tag) {
        const name = attr.name.replace(/^data-/, "");

        if (attr.type.includes("enum")) {
          const m = attr.description.match(/([a-z0-9-]+(?:\s*\|\s*[a-z0-9-]+)*)/);
          if (m) return m[1].split("|").map((o) => o.trim())[0];
          return "";
        }
        if (attr.type === "number") {
          if (/min/.test(name)) return "0";
          if (/max/.test(name)) return "100";
          if (/step/.test(name)) return "1";
          if (/count|span/.test(name)) return "3";
          return "42";
        }
        if (attr.type === "json") return "";

        // string
        if (/^icon/.test(name) || name === "icon") return "fa-solid fa-star";
        if (/illustration/.test(name)) return "empty";
        if (/heading|title/.test(name)) return "Sample heading";
        if (/description|helper|placeholder|small-print|empty/.test(name)) {
          return "Sample descriptive text.";
        }
        if (/label/.test(name)) return `Sample ${tag.replace(/^sherpa-/, "")}`;
        if (/value/.test(name)) return "Sample value";
        if (/name/.test(name)) return tag.replace(/^sherpa-/, "") + "-field";
        return `Sample ${name}`;
      }

      // ═══════════════════════════════════════════════════════════
      // CONTROLS PANEL RENDERING (uses sherpa form components)
      // ═══════════════════════════════════════════════════════════

      function dataKey(attrName) {
        return toCamelCase(attrName.replace(/^data-/, ""));
      }

      function setHostAttr(attr, rawValue, target = currentInstance) {
        if (!target) return;
        if (attr.startsWith("data-")) {
          target.dataset[dataKey(attr)] = rawValue;
        } else {
          target.setAttribute(attr, rawValue);
        }
      }

      function makeSectionHeader(label) {
        const header = document.createElement("sherpa-section-header");
        header.dataset.label        = label;
        header.dataset.headingLevel = "tertiary";
        return header;
      }

      // Helper: read the host attribute's current value from the preview.
      function readHostAttr(attrName, target = currentInstance) {
        if (!target) return "";
        if (attrName.startsWith("data-")) {
          return target.dataset[dataKey(attrName)] ?? "";
        }
        return target.getAttribute(attrName) ?? "";
      }

      // Helper: build a labeled row (label + description) used for switches
      // and other controls that don't carry their own label slot.
      function makeControlRow(labelText, descriptionText, controlEl) {
        const row = document.createElement("div");
        row.className = "control-row";

        const text = document.createElement("div");
        text.className = "control-row-text";

        const label = document.createElement("span");
        label.className = "control-row-label";
        label.textContent = labelText;
        text.appendChild(label);

        if (descriptionText) {
          const desc = document.createElement("span");
          desc.className = "control-row-description";
          desc.textContent = descriptionText;
          text.appendChild(desc);
        }

        row.appendChild(text);
        row.appendChild(controlEl);
        return row;
      }

      function renderControls(metadata) {
        controlsContent.innerHTML = "";

        // ── Attributes ────────────────────────────────────────
        if (metadata.attributes.length > 0) {
          const section = document.createElement("div");
          section.className = "controls-section";
          section.appendChild(makeSectionHeader("Attributes"));

          metadata.attributes.forEach((attr) => {
            const group = document.createElement("div");
            group.className = "control-group";

            const currentValue = readHostAttr(attr.name);
            const sample = sampleValueFor(attr, currentComponent);

            if (attr.type === "boolean") {
              const sw = document.createElement("sherpa-switch");
              sw.dataset.state = currentInstance?.hasAttribute(attr.name) ? "on" : "off";
              sw.addEventListener("change", (e) => {
                if (!currentInstance) return;
                currentInstance.toggleAttribute(attr.name, e.detail.checked);
                sessionStorage.setItem(
                  `${currentComponent}_${attr.name}`,
                  e.detail.checked
                );
              });
              section.appendChild(makeControlRow(attr.name, attr.description, sw));
              return;
            }

            if (attr.type.includes("enum")) {
              const select = document.createElement("sherpa-input-select");
              select.dataset.label = attr.name;

              const m = attr.description.match(/([a-z0-9-]+(?:\s*\|\s*[a-z0-9-]+)*)/);
              const opts = m ? m[1].split("|").map((o) => o.trim()) : [];
              opts.forEach((opt) => {
                const o = document.createElement("option");
                o.value = opt;
                o.textContent = opt;
                if (opt === (currentValue || sample)) o.selected = true;
                select.appendChild(o);
              });
              if (currentValue || sample) {
                select.setAttribute("value", currentValue || sample);
              }

              const onSelectChange = (e) => {
                const value = e?.detail?.value ?? select.value ?? "";
                setHostAttr(attr.name, value);
                sessionStorage.setItem(`${currentComponent}_${attr.name}`, value);
              };
              select.addEventListener("change", onSelectChange);
              group.appendChild(select);
            } else if (attr.type === "number") {
              const input = document.createElement("sherpa-input-number");
              input.dataset.label = attr.name;
              input.setAttribute("placeholder", attr.description);
              if (currentValue || sample) input.setAttribute("value", currentValue || sample);

              const onNumChange = (e) => {
                const value = e?.detail?.value ?? input.value ?? "";
                setHostAttr(attr.name, value);
                sessionStorage.setItem(`${currentComponent}_${attr.name}`, value);
              };
              input.addEventListener("input", onNumChange);
              input.addEventListener("change", onNumChange);
              group.appendChild(input);
            } else if (attr.type === "json") {
              const input = document.createElement("sherpa-input-text");
              input.dataset.label = `${attr.name} (JSON)`;
              input.setAttribute("placeholder", "JSON array or object");
              if (currentValue) input.setAttribute("value", currentValue);
              input.addEventListener("change", (e) => {
                const value = e?.detail?.value ?? input.value ?? "";
                try {
                  JSON.parse(value);
                  setHostAttr(attr.name, value);
                  sessionStorage.setItem(`${currentComponent}_${attr.name}`, value);
                } catch (err) {
                  alert("Invalid JSON: " + err.message);
                }
              });
              group.appendChild(input);
            } else {
              const input = document.createElement("sherpa-input-text");
              input.dataset.label = attr.name;
              input.setAttribute("placeholder", attr.description);
              if (currentValue || sample) input.setAttribute("value", currentValue || sample);

              const onTextChange = (e) => {
                const value = e?.detail?.value ?? input.value ?? "";
                setHostAttr(attr.name, value);
                sessionStorage.setItem(`${currentComponent}_${attr.name}`, value);
              };
              input.addEventListener("input", onTextChange);
              input.addEventListener("change", onTextChange);
              group.appendChild(input);
            }

            section.appendChild(group);
          });

          controlsContent.appendChild(section);
        }

        // ── Slots ─────────────────────────────────────────────
        if (metadata.slots.length > 0) {
          const section = document.createElement("div");
          section.className = "controls-section";
          section.appendChild(makeSectionHeader("Slots"));

          metadata.slots.forEach((slot) => {
            const group = document.createElement("div");
            group.className = "control-group";

            const input = document.createElement("sherpa-input-text");
            input.dataset.label = slot.name ? `Slot: ${slot.name}` : "Default slot";
            input.setAttribute("placeholder", slot.description || "HTML content");
            if (!slot.name) input.setAttribute("value", "Sample content");

            input.addEventListener("change", (e) => {
              const value = e?.detail?.value ?? input.getAttribute("value") ?? "";
              if (!currentInstance) return;
              if (slot.name) {
                const existing = currentInstance.querySelector(`[slot="${slot.name}"]`);
                if (existing) {
                  existing.innerHTML = value;
                } else {
                  const div = document.createElement("div");
                  div.slot = slot.name;
                  div.innerHTML = value;
                  currentInstance.appendChild(div);
                }
              } else {
                currentInstance.innerHTML = value;
              }
              sessionStorage.setItem(
                `${currentComponent}_slot_${slot.name || "default"}`,
                value
              );
            });

            group.appendChild(input);
            section.appendChild(group);
          });

          controlsContent.appendChild(section);
        }

        // ── Events ────────────────────────────────────────────
        if (metadata.events.length > 0) {
          const section = document.createElement("div");
          section.className = "controls-section";
          section.appendChild(makeSectionHeader("Event Log"));

          metadata.events.forEach((event) => {
            currentInstance?.addEventListener(event.name, (e) => {
              logEvent(event.name, e.detail);
            });
          });

          const clearBtn = document.createElement("sherpa-button");
          clearBtn.dataset.label     = "Clear log";
          clearBtn.dataset.variant   = "tertiary";
          clearBtn.dataset.size      = "small";
          clearBtn.dataset.iconStart = "\uf2ed"; // fa-trash
          clearBtn.addEventListener("button-click", () => {
            eventLog = [];
            updateEventLog();
          });
          section.appendChild(clearBtn);

          const logList = document.createElement("sherpa-list");
          logList.id              = "event-log-list";
          logList.dataset.variant = "divided";
          logList.dataset.density = "compact";
          logList.dataset.empty   = "No events yet";
          section.appendChild(logList);

          controlsContent.appendChild(section);
          updateEventLog();
        }
      }

      function logEvent(eventName, detail) {
        const timestamp = new Date().toLocaleTimeString();
        eventLog.unshift({ timestamp, name: eventName, detail: detail || {} });
        if (eventLog.length > MAX_EVENTS) eventLog.pop();
        updateEventLog();
      }

      function updateEventLog() {
        const list = document.getElementById("event-log-list");
        if (!list) return;
        list.innerHTML = "";
        eventLog.forEach((entry) => {
          const item = document.createElement("sherpa-list-item");
          item.dataset.label       = entry.name;
          item.dataset.description = entry.timestamp;
          item.dataset.icon        = "fa-solid fa-bolt";
          list.appendChild(item);
        });
      }

      // ═══════════════════════════════════════════════════════════
      // UTILITIES
      // ═══════════════════════════════════════════════════════════

      function toCamelCase(str) {
        return str.replace(/(-[a-z])/g, (g) => g[1].toUpperCase());
      }

      // ═══════════════════════════════════════════════════════════
      // STATE RESTORATION
      // ═══════════════════════════════════════════════════════════

      const savedComponent = sessionStorage.getItem("selectedComponent");
      if (savedComponent && COMPONENTS.find((c) => c.tag === savedComponent)) {
        selectComponent(savedComponent);
      }
    </script>
  </body>
</html>
