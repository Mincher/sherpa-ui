      * {

      }

      html,

        padding: 0;
        height: 100%;
      }

        background: var(--sherpa-surface-container-default, #fff);
        border-bottom: 1px solid var(--sherpa-border-container-default, #e0e0e0);
        padding: 16px 24px;
        flex-shrink: 0;
      }

      .site-header h1 {
        font-family: var(--sherpa-fonts-context-brand, "Manrope"), sans-serif;
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--sherpa-text-default-heading, #222);
        margin: 0;
      }

      .playground-layout {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* ═══════════════════════════════════════════════════════════
         SIDEBAR — fixed left, scrollable component list
         ═══════════════════════════════════════════════════════════ */

      .playground-sidebar {
        width: 280px;
        background: var(--sherpa-surface-container-default, #fff);
        border-right: 1px solid var(--sherpa-border-container-default, #e0e0e0);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }

      .sidebar-search {
        padding: 12px 12px;
        border-bottom: 1px solid var(--sherpa-border-container-default, #e0e0e0);
        flex-shrink: 0;
      }

      .sidebar-search input {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid var(--sherpa-border-container-default, #e0e0e0);
        border-radius: 4px;
        font-size: 0.875rem;
        font-family: inherit;
        background: var(--sherpa-surface-app-product-bg-default, #f5f5f5);
      }

      .sidebar-search input:focus {
        outline: none;
        border-color: var(--sherpa-border-context-info-default, #0066cc);
        background: var(--sherpa-surface-container-default, #fff);
      }

      .sidebar-list {
        flex: 1;
        overflow-y: auto;
        list-style: none;
        margin: 0;
        padding: 8px 0;
      }

      .sidebar-item {
        padding: 0;
        margin: 0;
      }

      .sidebar-link {
        display: block;
        padding: 10px 12px;
        color: var(--sherpa-text-default-body, #333);
        text-decoration: none;
        font-size: 0.875rem;
        cursor: pointer;
        transition: background 0.15s ease;
        border-left: 3px solid transparent;
      }

      .sidebar-link:hover {
        background: var(--sherpa-surface-app-product-bg-default, #f5f5f5);
      }

      .sidebar-link.active {
        background: var(--sherpa-surface-control-primary-default, #e6f0ff);
        border-left-color: var(--sherpa-border-context-info-default, #0066cc);
        color: var(--sherpa-text-context-info-default, #0066cc);
        font-weight: 600;
      }

      .sidebar-link .tag-name {
        display: block;
        font-family:
          var(--sherpa-typeface-source-code-pro-style-name, "Source Code Pro"),
          monospace;
        font-size: 0.75rem;
        font-weight: 400;
        color: var(--sherpa-text-default-secondary, #666);
        margin-top: 4px;
      }

      .sidebar-link.active .tag-name {
        color: var(--sherpa-text-context-info-default, #0066cc);
      }

      /* ═══════════════════════════════════════════════════════════
         MAIN CONTENT — scrollable preview + controls
         ═══════════════════════════════════════════════════════════ */

      .playground-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .playground-empty {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1;
        text-align: center;
        color: var(--sherpa-text-default-secondary, #666);
      }

      .playground-empty-icon {

        opacity: 0.5;
      }

      .playground-content {
        display: flex;
        flex-direction: column;
        flex: 1;
        overflow: hidden;

      .playground-preview-area {

      // METADATA CACHE & JSDoc PARSER
      // ═══════════════════════════════════════════════════════════

      const metadataCache = new Map();

      // Parse JSDoc from JS file content to extract @attr, @slot, @fires
      function parseJSDoc(jsContent) {
        const metadata = {
          attributes: [],
          slots: [],
          events: [],
        };

        // Extract @attr lines: @attr {type} name — description
        // Strip brackets from name if present: [data-name] -> data-name
        const attrRegex = /@attr\s+\{([^}]+)\}\s+(\[?[^\]\s]+\]?)\s+—\s+(.+?)(?=\n|$)/g;
        let match;
        while ((match = attrRegex.exec(jsContent)) !== null) {
          let [, type, name, description] = match;
          // Remove brackets from name if present
          name = name.replace(/[\[\]]/g, "").trim();
          metadata.attributes.push({
            name: name,
            type: type.trim(),
            description: description.trim(),
          });
        }

        // Extract @slot lines: @slot [name] — description
        const slotRegex = /@slot\s+(?:\[([^\]]+)\])?(?:\s+—\s+(.+?))?(?=\n|$)/g;
        while ((match = slotRegex.exec(jsContent)) !== null) {
          const [, name, description] = match;
          metadata.slots.push({
            name: name ? name.trim() : "",
            description: description ? description.trim() : "",
          });
        }

        // Extract @fires lines: @fires event-name — description
        const firesRegex = /@fires\s+([^\s]+)\s+—\s+(.+?)(?=\n|$)/g;
        while ((match = firesRegex.exec(jsContent)) !== null) {
          const [, eventName, description] = match;
          metadata.events.push({
            name: eventName.trim(),
            description: description.trim(),
          });
        }

        return metadata;
      }

      // Fetch and parse component metadata
      async function getComponentMetadata(tag) {
        if (metadataCache.has(tag)) {
          return metadataCache.get(tag);
        }

        try {
          const path = `components/${tag}/${tag}.js`;
          const response = await fetch(path);
          if (!response.ok) throw new Error(`Failed to fetch ${path}`);

          const jsContent = await response.text();
          const metadata = parseJSDoc(jsContent);
          metadataCache.set(tag, metadata);
          return metadata;
        } catch (error) {
          console.warn(`Could not load metadata for ${tag}:`, error);
          return { attributes: [], slots: [], events: [] };
        }
      }

      const previewTitle = document.getElementById("preview-title");
      const previewContainer = document.getElementById("preview-container");
      const controlsContent = document.getElementById("controls-content");

      let currentComponent = null;
      let currentInstance = null;
      let eventLog = [];
      const MAX_EVENTS = 50;

      // Populate sidebar
      function populateSidebar(filter = "") {
        componentList.innerHTML = "";
        const filtered = COMPONENTS.filter(
          (c) =>
            c.tag.toLowerCase().includes(filter.toLowerCase()) ||
            c.label.toLowerCase().includes(filter.toLowerCase())
        );

        filtered.forEach((component) => {
          const li = document.createElement("li");
          li.className = "sidebar-item";

          const a = document.createElement("a");
          a.className = "sidebar-link";
          a.dataset.tag = component.tag;
          a.innerHTML = `${component.label}<span class="tag-name">&lt;${component.tag}&gt;</span>`;

          a.addEventListener("click", (e) => {
            e.preventDefault();
            selectComponent(component.tag);
          });

          li.appendChild(a);
          componentList.appendChild(li);
        });
      }

      populateSidebar();

      // Search
      searchInput.addEventListener("input", (e) => {
        populateSidebar(e.target.value);
      });

      // ═══════════════════════════════════════════════════════════
      // COMPONENT SELECTION & PREVIEW
      // ═══════════════════════════════════════════════════════════

      async function selectComponent(tag) {
        currentComponent = tag;
        eventLog = [];

        // Update sidebar highlight
        document.querySelectorAll(".sidebar-link").forEach((link) => {
          link.classList.remove("active");
          if (link.dataset.tag === tag) {
            link.classList.add("active");
          }
        });

        // Show content area
        emptyState.style.display = "none";
        contentArea.style.display = "flex";

        // Update title
        const component = COMPONENTS.find((c) => c.tag === tag);
        previewTitle.textContent = `${component.label} <${tag}>`;

        // Load metadata
        const metadata = await getComponentMetadata(tag);

        // Create and insert component
        await createComponentPreview(tag, metadata);

        // Render controls
        renderControls(metadata);

        // Save state
        sessionStorage.setItem("selectedComponent", tag);
      }

      async function createComponentPreview(tag, metadata) {
        // Clear previous instance
        previewContainer.innerHTML = "";

        try {
          // Import component module
          await import(`./components/${tag}/${tag}.js`);

          // Create instance
          currentInstance = document.createElement(tag);

          // Set sensible defaults based on metadata
          metadata.attributes.forEach((attr) => {
            if (attr.type === "boolean") {
              // Don't set boolean attrs by default
            } else if (attr.type.includes("enum")) {
              // Parse enum options
              const optionsMatch = attr.description.match(
                /([a-z-]+(?:\s*\|\s*[a-z-]+)*)/
              );
              if (optionsMatch) {
                const options = optionsMatch[1].split("|").map((o) => o.trim());
                currentInstance.dataset[toCamelCase(attr.name)] = options[0];
              }
            } else if (attr.type === "string" && attr.name.includes("label")) {
              currentInstance.dataset[toCamelCase(attr.name)] = `Sample ${attr.name}`;
            }
          });

          // Add some default content for slots
          if (metadata.slots.length > 0) {
            const defaultSlot = metadata.slots.find((s) => !s.name);
            if (defaultSlot) {
              currentInstance.textContent = "Sample content";
            }
          }

          previewContainer.appendChild(currentInstance);
        } catch (error) {
          console.error(`Failed to create component ${tag}:`, error);
          previewContainer.innerHTML = `<p style="color: red;">Error loading component: ${error.message}</p>`;
        }
      }

      // ═══════════════════════════════════════════════════════════
      // CONTROLS PANEL RENDERING
      // ═══════════════════════════════════════════════════════════

      function renderControls(metadata) {
        controlsContent.innerHTML = "";

        // Attributes
        if (metadata.attributes.length > 0) {
          const attrSection = document.createElement("div");
          attrSection.className = "controls-section";

          const title = document.createElement("div");
          title.className = "controls-section-title";
          title.textContent = "Attributes";
          attrSection.appendChild(title);

          metadata.attributes.forEach((attr) => {
            const group = document.createElement("div");
            group.className = "control-group";

            const label = document.createElement("label");
            label.className = "control-label";
            label.textContent = attr.name;

            group.appendChild(label);

            if (attr.type === "boolean") {
              const wrapper = document.createElement("div");
              wrapper.className = "control-checkbox-wrapper";

              const checkbox = document.createElement("input");
              checkbox.type = "checkbox";
              checkbox.className = "control-checkbox";
              checkbox.dataset.attrName = attr.name;

              checkbox.addEventListener("change", (e) => {
                if (currentInstance) {
                  currentInstance.toggleAttribute(attr.name, e.target.checked);
                  sessionStorage.setItem(
                    `${currentComponent}_${attr.name}`,
                    e.target.checked
                  );
                }
              });

              wrapper.appendChild(checkbox);
              wrapper.appendChild(
                document.createTextNode(attr.description.split(" ")[0])
              );
              group.appendChild(wrapper);
            } else if (attr.type.includes("enum")) {
              const select = document.createElement("select");
              select.className = "control-input";
              select.dataset.attrName = attr.name;

              // Parse enum options from description: "primary | secondary | tertiary"
              const optionsMatch = attr.description.match(
                /([a-z0-9-]+(?:\s*\|\s*[a-z0-9-]+)*)/
              );
              if (optionsMatch) {
                const options = optionsMatch[1]
                  .split("|")
                  .map((o) => o.trim());
                options.forEach((opt) => {
                  const option = document.createElement("option");
                  option.value = opt;
                  option.textContent = opt;
                  select.appendChild(option);
                });
              }

              select.addEventListener("change", (e) => {
                if (currentInstance) {
                  currentInstance.dataset[toCamelCase(attr.name)] = e.target.value;
                  sessionStorage.setItem(
                    `${currentComponent}_${attr.name}`,
                    e.target.value
                  );
                }
              });

              group.appendChild(select);
            } else if (attr.type === "number") {
              const input = document.createElement("input");
              input.type = "number";
              input.className = "control-input";
              input.dataset.attrName = attr.name;
              input.placeholder = attr.description;

              input.addEventListener("change", (e) => {
                if (currentInstance) {
                  currentInstance.dataset[toCamelCase(attr.name)] = e.target.value;
                  sessionStorage.setItem(
                    `${currentComponent}_${attr.name}`,
                    e.target.value
                  );
                }
              });

              group.appendChild(input);
            } else if (attr.type === "json") {
              const textarea = document.createElement("textarea");
              textarea.className = "control-input";
              textarea.dataset.attrName = attr.name;
              textarea.placeholder = "JSON array or object";

              textarea.addEventListener("change", (e) => {
                if (currentInstance) {
                  try {
                    JSON.parse(e.target.value);
                    currentInstance.dataset[toCamelCase(attr.name)] = e.target.value;
                    sessionStorage.setItem(
                      `${currentComponent}_${attr.name}`,
                      e.target.value
                    );
                  } catch (err) {
                    alert("Invalid JSON: " + err.message);
                    textarea.focus();
                  }
                }
              });

              group.appendChild(textarea);
            } else {
              // string
              const input = document.createElement("input");
              input.type = "text";
              input.className = "control-input";
              input.dataset.attrName = attr.name;
              input.placeholder = attr.description;

              input.addEventListener("change", (e) => {
                if (currentInstance) {
                  currentInstance.dataset[toCamelCase(attr.name)] = e.target.value;
                  sessionStorage.setItem(
                    `${currentComponent}_${attr.name}`,
                    e.target.value
                  );
                }
              });

              group.appendChild(input);
            }

            attrSection.appendChild(group);
          });

          controlsContent.appendChild(attrSection);
        }

        // Slots
        if (metadata.slots.length > 0) {
          const slotSection = document.createElement("div");
          slotSection.className = "controls-section";

          const title = document.createElement("div");
          title.className = "controls-section-title";
          title.textContent = "Slots";
          slotSection.appendChild(title);

          metadata.slots.forEach((slot) => {
            const group = document.createElement("div");
            group.className = "control-group";

            const label = document.createElement("label");
            label.className = "control-label";
            label.textContent = slot.name ? `Slot: ${slot.name}` : "Default slot";
            group.appendChild(label);

            const textarea = document.createElement("textarea");
            textarea.className = "control-input";
            textarea.placeholder = "HTML content";
            textarea.value = slot.name
              ? ""
              : "Sample content";

            textarea.addEventListener("change", (e) => {
              if (currentInstance) {
                if (slot.name) {
                  // Named slot
                  const existing = currentInstance.querySelector(
                    `[slot="${slot.name}"]`
                  );
                  if (existing) {
                    existing.innerHTML = e.target.value;
                  } else {
                    const div = document.createElement("div");
                    div.slot = slot.name;
                    div.innerHTML = e.target.value;
                    currentInstance.appendChild(div);
                  }
                } else {
                  // Default slot
                  currentInstance.innerHTML = e.target.value;
                }
                sessionStorage.setItem(
                  `${currentComponent}_slot_${slot.name || "default"}`,
                  e.target.value
                );
              }
            });

            group.appendChild(textarea);
            slotSection.appendChild(group);
          });

          controlsContent.appendChild(slotSection);
        }

        // Events
        if (metadata.events.length > 0) {
          const eventSection = document.createElement("div");
          eventSection.className = "controls-section";

          const title = document.createElement("div");
          title.className = "controls-section-title";
          title.textContent = "Event Log";
          eventSection.appendChild(title);

          // Attach event listeners
          metadata.events.forEach((event) => {
            if (currentInstance) {
              currentInstance.addEventListener(event.name, (e) => {
                logEvent(event.name, e.detail);
              });
            }
          });

          // Event log display
          const logContainer = document.createElement("div");
          logContainer.className = "control-group";

          const clearBtn = document.createElement("button");
          clearBtn.className = "controls-button";
          clearBtn.textContent = "Clear log";
          clearBtn.addEventListener("click", () => {
            eventLog = [];
            updateEventLog();
          });

          logContainer.appendChild(clearBtn);

          const logDisplay = document.createElement("div");
          logDisplay.className = "event-log";
          logDisplay.id = "event-log";

          logContainer.appendChild(logDisplay);
          eventSection.appendChild(logContainer);
          controlsContent.appendChild(eventSection);

          updateEventLog();
        }
      }

      function logEvent(eventName, detail) {
        const timestamp = new Date().toLocaleTimeString();
        eventLog.unshift({
          timestamp,
          name: eventName,
          detail: detail || {},
        });

        if (eventLog.length > MAX_EVENTS) {
          eventLog.pop();
        }

        updateEventLog();
      }

      function updateEventLog() {
        const logDisplay = document.getElementById("event-log");
        if (!logDisplay) return;

        if (eventLog.length === 0) {
          logDisplay.innerHTML =
            '<div class="event-log-entry event-log-empty">No events yet</div>';
        } else {
          logDisplay.innerHTML = eventLog
            .map(
              (e) =>
                `<div class="event-log-entry"><strong>${e.timestamp}</strong> — ${e.name}</div>`
            )
            .join("");
        }
      }

      // ═══════════════════════════════════════════════════════════
      // UTILITIES
      // ═══════════════════════════════════════════════════════════

      function toCamelCase(str) {
        return str.replace(/(-[a-z])/g, (g) => g[1].toUpperCase());
      }

      // ═══════════════════════════════════════════════════════════
      // STATE RESTORATION
      // ═══════════════════════════════════════════════════════════

      // Restore previous selection on page load
      const savedComponent = sessionStorage.getItem("selectedComponent");
      if (savedComponent && COMPONENTS.find((c) => c.tag === savedComponent)) {
        selectComponent(savedComponent);
      }
    </script>
  </body>
</html>
