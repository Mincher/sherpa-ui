<!doctype html>
<!-- The preview's page: the app shell as a new app has it, with one Context.
     page.js starts it; its server answers with a CSP that runs no inline script. -->
<html lang="en" data-theme="sherpa" data-mode="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sherpa preview</title>
  <link rel="stylesheet" href="/dist/styles/tokens/tokens.css" />
  <link rel="stylesheet" href="/dist/styles/tokens/page.css" />
  <script type="module" src="/preview/page.js"></script>
</head>
<body>
  <sherpa-router data-params="context view"></sherpa-router>
  <sherpa-provider>
    <sherpa-app-shell>
      <sherpa-nav slot="nav"></sherpa-nav>
      <sherpa-app-header slot="header">
        <sherpa-quick-filter-toolbar slot="filters" data-type="view" data-scope="view"
                                     data-locked data-reset-on-populate></sherpa-quick-filter-toolbar>
      </sherpa-app-header>
      <sherpa-outlet id="context-root"></sherpa-outlet>
    </sherpa-app-shell>
  </sherpa-provider>
</body>
</html>
