name: Tokens Sync Check

on:
  schedule:
    # Run every Monday at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  check-tokens:
    name: Check Figma Tokens Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check token file age
        id: check
        run: |
          # Check if figma-variables.json exists
          if [ ! -f "figma-tokens/figma-variables.json" ]; then
            echo "status=missing" >> $GITHUB_OUTPUT
            echo "age_days=N/A" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get last modification time (days ago)
          if [[ "$OSTYPE" == "darwin"* ]]; then
            # macOS
            AGE_DAYS=$(( ( $(date +%s) - $(stat -f %m figma-tokens/figma-variables.json) ) / 86400 ))
          else
            # Linux
            AGE_DAYS=$(( ( $(date +%s) - $(stat -c %Y figma-tokens/figma-variables.json) ) / 86400 ))
          fi

          echo "age_days=$AGE_DAYS" >> $GITHUB_OUTPUT

          # Warn if tokens are older than 30 days
          if [ $AGE_DAYS -gt 30 ]; then
            echo "status=stale" >> $GITHUB_OUTPUT
          else
            echo "status=fresh" >> $GITHUB_OUTPUT
          fi

          echo "Tokens are $AGE_DAYS days old"

      - name: Create issue if tokens are stale
        if: steps.check.outputs.status == 'stale' || steps.check.outputs.status == 'missing'
        uses: actions/github-script@v7
        with:
          script: |
            const age = '${{ steps.check.outputs.age_days }}';
            const status = '${{ steps.check.outputs.status }}';
            
            let title, body;
            
            if (status === 'missing') {
              title = '🔴 Figma tokens file missing';
              body = `## Figma Tokens Missing

The \`figma-tokens/figma-variables.json\` file is missing from the repository.

**Action Required:**
1. Run \`npm run tokens:extract\` to fetch tokens from Figma
2. Commit the generated file
3. Run \`npm run tokens:generate\` to update CSS files

**Impact:**
- Design tokens are not in sync with Figma
- CSS generation may fail or use outdated values

**Related Files:**
- \`figma-tokens/figma-variables.json\` (missing)
- \`figma-tokens/alias-snapshot.json\` (fallback)
              `;
            } else {
              title = `⚠️  Figma tokens are ${age} days old`;
              body = `## Figma Tokens Need Updating

The design tokens in \`figma-tokens/figma-variables.json\` are **${age} days old** and may be out of sync with Figma.

**Action Required:**
1. Run \`npm run tokens:extract\` to fetch latest tokens from Figma
2. Review changes: \`git diff figma-tokens/figma-variables.json\`
3. If changes exist:
   - Run \`npm run tokens:generate\` to update CSS
   - Review generated CSS changes
   - Create a PR with token updates
4. If no changes: Close this issue

**Impact:**
- Design tokens may drift from Figma source of truth
- Visual inconsistencies may appear in components
- New design system changes won't be reflected

**Last Updated:** ${age} days ago

**Related Files:**
- \`figma-tokens/figma-variables.json\` (${age} days old)
- \`css/styles/sherpa-themes.css\` (generated)
- \`css/styles/sherpa-overrides.css\` (generated)
              `;
            }

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'tokens-sync'
            });

            if (issues.data.length === 0) {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['tokens-sync', 'design-system', 'maintenance']
              });
              console.log('Created new tokens-sync issue');
            } else {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                title: title,
                body: body
              });
              console.log('Updated existing tokens-sync issue');
            }

      - name: Summary
        run: |
          echo "## Tokens Sync Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.check.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Age:** ${{ steps.check.outputs.age_days }} days" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check.outputs.status }}" == "fresh" ]; then
            echo "✅ Tokens are up to date" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  Tokens need updating - issue created" >> $GITHUB_STEP_SUMMARY
          fi
