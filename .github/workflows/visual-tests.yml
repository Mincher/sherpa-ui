name: Visual Regression Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'components/**'
      - 'css/**'
      - 'test/visual/**'
      - 'playwright.config.js'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Visual Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run visual regression tests
        run: npm run test:visual
        continue-on-error: true
        id: visual-tests

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-report
          path: test/visual/report/
          retention-days: 30

      - name: Upload baseline screenshots (on main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ github.sha }}
          path: test/visual/__screenshots__/
          retention-days: 90

      - name: Upload failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-failures-${{ github.sha }}
          path: |
            test/visual/__screenshots__/**/*-actual.png
            test/visual/__screenshots__/**/*-diff.png
          retention-days: 7

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Read test results
            let comment = '## 🎨 Visual Regression Test Results\n\n';

            if ('${{ steps.visual-tests.outcome }}' === 'success') {
              comment += '✅ All visual tests passed! No regressions detected.\n\n';
            } else {
              comment += '⚠️ Visual differences detected. Please review:\n\n';
              comment += '1. Download the `visual-test-report` artifact\n';
              comment += '2. Open `index.html` to see visual diffs\n';
              comment += '3. If changes are intentional, update baselines:\n';
              comment += '   ```bash\n';
              comment += '   npm run test:visual:update\n';
              comment += '   git add test/visual/__screenshots__/\n';
              comment += '   git commit -m "Update visual baselines"\n';
              comment += '   ```\n';
            }

            comment += '\n[View full test report in artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if tests failed
        if: steps.visual-tests.outcome == 'failure'
        run: exit 1

  # Optional: Matrix testing across multiple OS/Node versions
  test-matrix:
    name: Visual Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual tests (chromium only)
        run: npx playwright test --project=chromium-light-base

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-tests-${{ matrix.os }}-node${{ matrix.node }}
          path: test/visual/report/
          retention-days: 7
