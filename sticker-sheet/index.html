<!doctype html>
<html lang="en" data-theme="apex-2-core" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sherpa UI — Sandbox</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/styles/index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <script type="module" src="/dist/components/index.js"></script>

  <style>
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--sherpa-fonts-context-brand, "Inter", system-ui, sans-serif);
      background: var(--sherpa-surface-app-background-default, #fff);
      color: var(--sherpa-content-default-body, #2e2e33);
    }

    /* A gallery tile's inner rhythm. */
    .tile-section { margin-block-start: var(--sherpa-space-sm, 12px); }
    .tile-section:first-child { margin-block-start: 0; }
    .tile-label {
      font-size: var(--sherpa-fonts-scale-xs, 10px);
      font-weight: var(--sherpa-font-weight-semibold, 600);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--sherpa-content-default-secondary, #6a6a75);
      margin-block-end: var(--sherpa-space-2xs, 4px);
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--sherpa-space-xs, 8px);
    }
    .col { display: flex; flex-direction: column; gap: var(--sherpa-space-xs, 8px); }

    /* Settings panel (nav Settings mode). */
    .settings-group { display: flex; flex-direction: column; gap: var(--sherpa-space-3xs, 2px); margin-block-end: var(--sherpa-space-sm, 12px); }
    .settings-group > .tile-label { margin-block-end: var(--sherpa-space-2xs, 4px); }
    .settings-row { display: flex; flex-wrap: wrap; gap: var(--sherpa-space-2xs, 4px); }
    .swatch {
      inline-size: 16px; block-size: 16px; border-radius: 999px;
      border: 1px solid var(--sherpa-border-container-default, #d5d5dc);
      display: inline-block; margin-inline-end: var(--sherpa-space-2xs, 4px); vertical-align: middle;
    }
  </style>
</head>
<body>

<sherpa-app-shell>

  <!-- ══ Navigation (default template + Settings mode with the theme switcher) ══ -->
  <sherpa-nav slot="nav" data-src-html="/sticker-sheet/nav.html" data-active-target="dashboard">
    <!-- Settings-mode content: appearance controls, slotted into the secondary list -->
    <div slot="settings" class="settings-panel">
      <div class="settings-group">
        <div class="tile-label">Theme</div>
        <div class="settings-row" id="theme-row">
          <sherpa-button data-size="small" data-variant="primary"  class="theme-btn" data-theme-value="apex-2-core"   data-label="Core"></sherpa-button>
          <sherpa-button data-size="small" data-variant="tertiary" class="theme-btn" data-theme-value="apex-2-purple" data-label="Purple"></sherpa-button>
          <sherpa-button data-size="small" data-variant="tertiary" class="theme-btn" data-theme-value="apex-2-teal"   data-label="Teal"></sherpa-button>
          <sherpa-button data-size="small" data-variant="tertiary" class="theme-btn" data-theme-value="apex-2-blue"   data-label="Blue"></sherpa-button>
          <sherpa-button data-size="small" data-variant="tertiary" class="theme-btn" data-theme-value="classic"       data-label="Classic"></sherpa-button>
        </div>
      </div>
      <div class="settings-group">
        <div class="tile-label">Mode</div>
        <div class="settings-row" id="mode-row">
          <sherpa-button data-size="small" data-variant="primary"  class="mode-btn" data-mode-value="light" data-icon-start="fa-solid fa-sun"    data-label="Light"></sherpa-button>
          <sherpa-button data-size="small" data-variant="tertiary" class="mode-btn" data-mode-value="dark"  data-icon-start="fa-solid fa-moon"   data-label="Dark"></sherpa-button>
          <sherpa-button data-size="small" data-variant="tertiary" class="mode-btn" data-mode-value="hc"    data-icon-start="fa-solid fa-circle-half-stroke" data-label="Contrast"></sherpa-button>
        </div>
      </div>
      <div class="settings-group">
        <div class="tile-label">Density</div>
        <div class="settings-row" id="density-row">
          <sherpa-button data-size="small" data-variant="tertiary" class="density-btn" data-density-value="compact"     data-label="Compact"></sherpa-button>
          <sherpa-button data-size="small" data-variant="primary"  class="density-btn" data-density-value="base"        data-label="Base"></sherpa-button>
          <sherpa-button data-size="small" data-variant="tertiary" class="density-btn" data-density-value="comfortable" data-label="Comfortable"></sherpa-button>
        </div>
      </div>
    </div>
  </sherpa-nav>

  <!-- ══ App header ══ -->
  <sherpa-app-header
    slot="app-header"
    class="app-header"
    data-label="Component Sandbox"
    data-show-favorite
    data-info
  >
    <span slot="app-actions" style="display:flex;align-items:center;gap:4px">
      <sherpa-button data-type="icon" data-variant="tertiary" data-size="small" data-icon-start="fa-solid fa-wand-magic-sparkles" aria-label="AI" title="AI"></sherpa-button>
      <sherpa-button data-type="icon" data-variant="tertiary" data-size="small" data-icon-start="fa-solid fa-bell" aria-label="Notifications" title="Notifications"></sherpa-button>
      <sherpa-button data-type="icon" data-variant="tertiary" data-size="small" data-icon-start="fa-solid fa-gear" id="header-settings" aria-label="Settings" title="Theme & appearance settings"></sherpa-button>
    </span>
    <sherpa-quick-filter-toolbar slot="filters" class="app-filters" data-type="view"></sherpa-quick-filter-toolbar>
  </sherpa-app-header>

  <!-- ══ Main layout — 12-column grid of component-family tiles ══ -->
  <sherpa-layout-grid data-pad data-row-height="64px">

    <sherpa-view-header slot="view-header" data-label="All components" data-description="A live, themeable gallery. Open the gear (or nav Settings) to switch theme, mode, and density."></sherpa-view-header>

    <sherpa-message slot="banner" data-status="info" data-label="Themeable sandbox" data-value="Every tile below re-themes live. Try the appearance controls in the nav Settings panel."></sherpa-message>

    <!-- ── Buttons ── -->
    <sherpa-container data-col-span="6" data-row-span="4" id="tile-buttons">
      <sherpa-container-header slot="header" data-title="Buttons"></sherpa-container-header>
      <div class="tile-section">
        <div class="tile-label">Variants</div>
        <div class="row">
          <sherpa-button data-variant="primary" data-label="Primary"></sherpa-button>
          <sherpa-button data-variant="secondary" data-label="Secondary"></sherpa-button>
          <sherpa-button data-variant="tertiary" data-label="Tertiary"></sherpa-button>
        </div>
      </div>
      <div class="tile-section">
        <div class="tile-label">Sizes</div>
        <div class="row">
          <sherpa-button data-variant="primary" data-size="2x-small" data-label="2xs"></sherpa-button>
          <sherpa-button data-variant="primary" data-size="x-small" data-label="xs"></sherpa-button>
          <sherpa-button data-variant="primary" data-size="small" data-label="sm"></sherpa-button>
          <sherpa-button data-variant="primary" data-size="base" data-label="base"></sherpa-button>
          <sherpa-button data-variant="primary" data-size="large" data-label="lg"></sherpa-button>
        </div>
      </div>
      <div class="tile-section">
        <div class="tile-label">Icon &amp; state</div>
        <div class="row">
          <sherpa-button data-variant="primary" data-icon-start="fa-solid fa-plus" data-label="Add"></sherpa-button>
          <sherpa-button data-variant="secondary" data-icon-end="fa-solid fa-chevron-down" data-label="Options"></sherpa-button>
          <sherpa-button data-variant="tertiary" data-type="icon" data-icon-start="fa-solid fa-ellipsis" aria-label="More"></sherpa-button>
          <sherpa-button data-variant="primary" disabled data-label="Disabled"></sherpa-button>
        </div>
      </div>
    </sherpa-container>

    <!-- ── Selection controls ── -->
    <sherpa-container data-col-span="6" data-row-span="4" id="tile-selection">
      <sherpa-container-header slot="header" data-title="Selection"></sherpa-container-header>
      <div class="tile-section">
        <div class="tile-label">Checkbox &amp; radio</div>
        <div class="row" style="gap:16px">
          <label class="sherpa-check-label"><input type="checkbox" class="sherpa-check" checked><span class="sherpa-check-text">Checked</span></label>
          <label class="sherpa-check-label"><input type="checkbox" class="sherpa-check"><span class="sherpa-check-text">Unchecked</span></label>
          <label class="sherpa-check-label"><input type="radio" name="r" class="sherpa-check" checked><span class="sherpa-check-text">Radio A</span></label>
          <label class="sherpa-check-label"><input type="radio" name="r" class="sherpa-check"><span class="sherpa-check-text">Radio B</span></label>
        </div>
      </div>
      <div class="tile-section">
        <div class="tile-label">Switch &amp; slider</div>
        <div class="row" style="gap:16px">
          <sherpa-switch data-state="on"></sherpa-switch>
          <sherpa-switch></sherpa-switch>
          <sherpa-slider style="flex:1;min-width:160px" data-value="60"></sherpa-slider>
        </div>
      </div>
    </sherpa-container>

    <!-- ── Inputs ── -->
    <sherpa-container data-col-span="6" data-row-span="4" id="tile-inputs">
      <sherpa-container-header slot="header" data-title="Inputs"></sherpa-container-header>
      <div class="col">
        <sherpa-input-text data-label="Full name" data-placeholder="Ada Lovelace"></sherpa-input-text>
        <sherpa-input-text data-label="Email" data-placeholder="you@example.com" data-icon-start="fa-solid fa-envelope"></sherpa-input-text>
        <sherpa-input-tag data-label="Tags" id="input-tag-demo"></sherpa-input-tag>
      </div>
    </sherpa-container>

    <!-- ── Chips, tags, badges ── -->
    <sherpa-container data-col-span="6" data-row-span="4" id="tile-chips">
      <sherpa-container-header slot="header" data-title="Tags &amp; chips"></sherpa-container-header>
      <div class="tile-section">
        <div class="tile-label">Tag colours</div>
        <div class="row">
          <sherpa-tag data-color="purple" data-label="Purple"></sherpa-tag>
          <sherpa-tag data-color="cyan" data-label="Cyan"></sherpa-tag>
          <sherpa-tag data-color="green" data-label="Green"></sherpa-tag>
          <sherpa-tag data-color="orange" data-label="Orange"></sherpa-tag>
          <sherpa-tag data-color="grey" data-label="Grey"></sherpa-tag>
        </div>
      </div>
      <div class="tile-section">
        <div class="tile-label">Quick filter chips</div>
        <div class="row">
          <sherpa-quick-filter data-label="Region" data-value="EMEA"></sherpa-quick-filter>
          <sherpa-quick-filter data-label="Owner" data-value="Me" data-active></sherpa-quick-filter>
          <sherpa-quick-filter data-type="ai" data-label="AI suggestion"></sherpa-quick-filter>
        </div>
      </div>
    </sherpa-container>

    <!-- ── Feedback ── -->
    <sherpa-container data-col-span="6" data-row-span="4" id="tile-feedback">
      <sherpa-container-header slot="header" data-title="Feedback"></sherpa-container-header>
      <div class="col">
        <sherpa-callout data-status="info" data-label="Heads up" data-value="This is an informational callout."></sherpa-callout>
        <sherpa-callout data-status="success" data-label="Saved" data-value="Your changes were saved."></sherpa-callout>
        <div class="tile-section">
          <div class="tile-label">Toasts</div>
          <div class="row">
            <sherpa-button data-size="small" data-variant="secondary" id="toast-info" data-label="Info"></sherpa-button>
            <sherpa-button data-size="small" data-variant="secondary" id="toast-success" data-label="Success"></sherpa-button>
            <sherpa-button data-size="small" data-variant="secondary" id="toast-warning" data-label="Warning"></sherpa-button>
            <sherpa-button data-size="small" data-variant="secondary" id="toast-critical" data-label="Error"></sherpa-button>
          </div>
        </div>
      </div>
    </sherpa-container>

    <!-- ── Navigation / tabs ── -->
    <sherpa-container data-col-span="6" data-row-span="4" id="tile-nav">
      <sherpa-container-header slot="header" data-title="Tabs &amp; breadcrumbs"></sherpa-container-header>
      <div class="col">
        <sherpa-breadcrumbs data-items='[{"label":"Home","href":"#"},{"label":"Analytics","href":"#"},{"label":"Dashboard"}]'></sherpa-breadcrumbs>
        <sherpa-tabs data-active-tab="0">
          <div data-tab-label="Overview">Overview panel</div>
          <div data-tab-label="Activity">Activity panel</div>
          <div data-tab-label="Settings">Settings panel</div>
        </sherpa-tabs>
      </div>
    </sherpa-container>

    <!-- ── Progress ── -->
    <sherpa-container data-col-span="6" data-row-span="3" id="tile-progress">
      <sherpa-container-header slot="header" data-title="Progress"></sherpa-container-header>
      <div class="col">
        <sherpa-progress-bar data-value="42"></sherpa-progress-bar>
        <sherpa-progress-bar data-value="78"></sherpa-progress-bar>
        <div class="row"><sherpa-loader data-label="Loading…"></sherpa-loader></div>
      </div>
    </sherpa-container>

    <!-- ── Key / value ── -->
    <sherpa-container data-col-span="6" data-row-span="3" id="tile-kv">
      <sherpa-container-header slot="header" data-title="Key / value"></sherpa-container-header>
      <sherpa-key-value-list id="kv-demo"></sherpa-key-value-list>
    </sherpa-container>

    <!-- ── JSON-defined tile (built at runtime by renderElement) ── -->
    <div id="tile-json-mount" data-col-span="6" data-row-span="3"></div>

    <!-- ── Data grid (full width) ── -->
    <sherpa-container data-col-span="12" data-row-span="5" id="tile-grid">
      <sherpa-container-header slot="header" data-title="Data grid"></sherpa-container-header>
      <sherpa-data-grid id="grid-demo" data-selectable></sherpa-data-grid>
    </sherpa-container>

  </sherpa-layout-grid>

</sherpa-app-shell>

<!-- Overlays / dialogs live at body scope -->
<sherpa-dialog id="dialog-demo" data-size="medium" data-label="Example dialog">
  <sherpa-container-header slot="header" data-title="Example dialog"></sherpa-container-header>
  <p>A composed dialog using the design tokens. It re-themes with the rest of the app.</p>
  <div slot="footer" style="display:flex;gap:8px;justify-content:flex-end">
    <sherpa-button data-variant="tertiary" data-label="Cancel" id="dialog-cancel"></sherpa-button>
    <sherpa-button data-variant="primary" data-label="Confirm"></sherpa-button>
  </div>
</sherpa-dialog>

<script type="module" src="/sticker-sheet/sandbox.js"></script>
</body>
</html>
