<!--
  sticker-sheet/nav.html — Navigation template for the Sherpa UI sandbox.

  Header (logo + product name + search), a Dashboard item, a Components section
  listing the gallery tiles, and the secondary Settings list (data-mode="settings")
  holding the theme/mode/density switcher slotted from the host via slot="settings".
  Clicking the nav Settings item (or the header gear) swaps this in; the back
  button or a primary item returns to the list.
-->
<div class="sherpa-nav-root" data-pinned="false" data-mode="default" data-searchable>

  <!-- Header -->
  <header class="nav-header">
    <div class="nav-toolbar">
      <svg class="nav-logo" viewBox="0 0 18 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 0H3.80301L12.9974 9.83439V13.9026H9.19381L4.59663 8.98333V13.9002H0V0ZM8.39098 4.91692H12.9876V0H8.39098V4.91692Z" fill="currentColor"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M12.9974 9.83439H17.594V4.91689H8.40023L12.9974 9.83439Z" fill="#C046FF"/>
      </svg>
      <span class="nav-product-name text-heading-lg">Sherpa UI</span>
      <div class="nav-toolbar-actions">
        <sherpa-button class="nav-pin-btn" data-variant="tertiary" data-size="small" data-icon-start="&#xf08d;" title="Pin navigation" aria-label="Pin navigation"></sherpa-button>
      </div>
    </div>

    <!-- Search (filters both primary and settings lists) -->
    <div class="nav-search" role="search">
      <sherpa-nav-item class="nav-search-icon" data-nav-target="search" data-icon="fa-solid fa-magnifying-glass" tabindex="0" role="button" aria-label="Search">Search</sherpa-nav-item>
      <sherpa-input-search class="nav-search-input" placeholder="Filter…" aria-label="Filter navigation"></sherpa-input-search>
    </div>

    <!-- Dashboard -->
    <sherpa-nav-item data-nav-target="home" data-item-id="dashboard" data-icon="fa-solid fa-table-cells-large" data-route="#tile-buttons" tabindex="0" role="button" aria-label="Dashboard">Dashboard</sherpa-nav-item>
  </header>

  <!-- Primary sections -->
  <div class="nav-sections" role="tree">
    <div class="nav-group" data-group-index="1">
      <details class="nav-section" data-section-id="components" open>
        <summary>
          <sherpa-nav-item data-variant="section" data-icon="fa-solid fa-shapes">Components</sherpa-nav-item>
        </summary>
        <sherpa-nav-item data-variant="child" data-item-id="buttons"   data-route="#tile-buttons"   tabindex="0" role="button">Buttons</sherpa-nav-item>
        <sherpa-nav-item data-variant="child" data-item-id="selection" data-route="#tile-selection" tabindex="0" role="button">Selection</sherpa-nav-item>
        <sherpa-nav-item data-variant="child" data-item-id="inputs"    data-route="#tile-inputs"    tabindex="0" role="button">Inputs</sherpa-nav-item>
        <sherpa-nav-item data-variant="child" data-item-id="chips"     data-route="#tile-chips"     tabindex="0" role="button">Tags &amp; chips</sherpa-nav-item>
        <sherpa-nav-item data-variant="child" data-item-id="feedback"  data-route="#tile-feedback"  tabindex="0" role="button">Feedback</sherpa-nav-item>
        <sherpa-nav-item data-variant="child" data-item-id="tabs"      data-route="#tile-nav"       tabindex="0" role="button">Tabs</sherpa-nav-item>
        <sherpa-nav-item data-variant="child" data-item-id="progress"  data-route="#tile-progress"  tabindex="0" role="button">Progress</sherpa-nav-item>
        <sherpa-nav-item data-variant="child" data-item-id="kv"        data-route="#tile-kv"        tabindex="0" role="button">Key / value</sherpa-nav-item>
        <sherpa-nav-item data-variant="child" data-item-id="grid"      data-route="#tile-grid"      tabindex="0" role="button">Data grid</sherpa-nav-item>
      </details>
    </div>
  </div>

  <!-- Secondary Settings list (shown only in data-mode="settings") -->
  <div class="nav-settings" role="tree" aria-label="Settings navigation">
    <div class="nav-settings-header">
      <sherpa-button class="nav-settings-back" data-type="icon" data-variant="tertiary" data-size="small" data-icon-start="fa-solid fa-arrow-left" aria-label="Leave settings"></sherpa-button>
      <span class="nav-settings-title text-label-group">SETTINGS</span>
    </div>
    <div class="nav-settings-list">
      <slot name="settings" data-accepts="nav,control,html"></slot>
    </div>
  </div>

  <!-- Footer: the Settings toggle -->
  <footer class="nav-footer">
    <sherpa-nav-item data-nav-target="settings" data-icon="fa-solid fa-gear" tabindex="0" role="button" aria-label="Settings">Settings</sherpa-nav-item>
  </footer>

  <!-- Cloning templates required by SherpaNav -->
  <template class="nav-item-tpl">
    <sherpa-nav-item data-variant="child" tabindex="0" role="button"></sherpa-nav-item>
  </template>
  <template class="badge-tpl">
    <sherpa-tag slot="badge" data-status="success"></sherpa-tag>
  </template>
</div>
