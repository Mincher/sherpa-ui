<!--
  app-shell — Standard application shell layout.

  Provides the structural frame for a full-page application:
    • Sidebar navigation (sherpa-nav)
    • Product bar (sherpa-product-bar-v2)
    • Main content area composed with sherpa-layout-grid

  Components: sherpa-app-shell, sherpa-nav, sherpa-product-bar-v2,
              sherpa-layout-grid, sherpa-view-header, sherpa-quick-filter-toolbar

  Customisation:
    • Add nav items to sherpa-nav (via data-src-html or light-DOM children)
    • Set data-label on sherpa-view-header for the page title
    • Put the page inside <sherpa-layout-grid data-content="static" data-fill="viewport">
    • Put the view header in the grid's slot="view-header"
    • Put side rails in slot="side-panel-start" and slot="side-panel-end"
    • Put the page body in the grid's default slot
    • Add data-global to sherpa-quick-filter-toolbar for global filtering
    • Set data-preset-filters on sherpa-quick-filter-toolbar for auto-created presets

  Layout classes:
    .sherpa-app-layout        — Grid shell: sidebar nav + main area
    .sherpa-main-content      — Flex column for the main area
    .sherpa-view-header-group — Wrapper for view-header + global filter bar
    .sherpa-scroll-under      — Sticky header with scroll-activated bg + shadow
    .sherpa-main-content-slot — Scrollable viewport for the content grid
    <sherpa-layout-grid>      — Responsive 12-col grid
-->

<template id="app-shell"
  data-pattern-category="layouts"
  data-pattern-status="stable"
  data-pattern-components="sherpa-nav, sherpa-view-header, sherpa-quick-filter-toolbar">

  <style>
    /* Scaffolding scoped to this template — only stamped once per page. */
    .sherpa-app-layout {
      --nav-column-width: calc(var(--sherpa-space-default) * 3);
      display: grid;
      grid-template-columns: var(--nav-column-width) 1fr;
      min-height: 100vh;
      height: 100vh;
    }
    .sherpa-app-layout:has(sherpa-nav[data-pinned="true"]) {
      --nav-column-width: 320px;
    }
    .sherpa-main-content {
      grid-column: 2;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
      overflow: hidden;
    }
    .sherpa-main-content-slot {
      flex: 1;
      min-height: 0;
      overflow: auto;
      container-type: scroll-state;
      container-name: main-scroller;
    }
    .sherpa-main-content-slot > sherpa-layout-grid {
      width: 100%;
      min-height: 100%;
    }
  </style>

  <div class="sherpa-app-layout">
    <sherpa-nav slot="nav" data-pinned="false" data-editable data-searchable></sherpa-nav>

    <div class="sherpa-main-content">
      <header class="sherpa-view-header-group sherpa-scroll-under">
        <sherpa-view-header slot="view-header" data-label=""></sherpa-view-header>
      </header>

      <div class="sherpa-main-content-slot">
        <sherpa-layout-grid data-content="static" data-fill="viewport" data-pad data-gap="base">
          <!-- Page body goes in the default slot -->
        </sherpa-layout-grid>
      </div>
    </div>
  </div>
</template>
