<!--
  view-with-rails — Body-content view bounded to the viewport with
  optional left/right side rails and a scrolling content column.

  Uses sherpa-layout-grid in static (non-grid) mode. Provides:
    • Slotted view header (sherpa-view-header)
    • Left rail (filters / list navigation) — sticky search, scrolls
      independently
    • Right rail (details / inspector) — scrolls independently
    • Centre content column — scrolls independently

  The whole region is clamped to 100dvh so the rails stay anchored
  while the user scrolls within any one column. The page is responsible
  for ensuring the layout's flex ancestors don't grow past the viewport
  — typically:
      html, body { height: 100dvh; overflow: hidden; }

  Components: sherpa-layout-grid, sherpa-view-header, sherpa-panel,
              sherpa-data-grid, sherpa-key-value-list

  Customisation:
    • slot="view-header" on sherpa-view-header sets the heading
    • data-content="static" opts out of the CSS grid (stacks vertically)
    • data-pad / data-gap for the content column
    • Either rail may be omitted by removing the slotted sherpa-panel
    • Use slot="search" on the rail's sherpa-panel for a sticky
      search bar pinned to the top of that rail
-->

<template id="view-with-rails"
  data-pattern-category="layouts"
  data-pattern-status="stable"
  data-pattern-components="sherpa-layout-grid, sherpa-view-header, sherpa-panel, sherpa-data-grid">

  <sherpa-layout-grid data-content="static" data-fill="viewport" data-pad data-gap="base">

    <sherpa-view-header slot="view-header" data-label="Devices">
      <sherpa-toolbar slot="actions">
        <sherpa-button data-label="Add" data-variant="primary" data-icon-start="&#xf067;"></sherpa-button>
      </sherpa-toolbar>
    </sherpa-view-header>

    <!-- Left rail: searchable filter / navigation list -->
    <sherpa-panel
      slot="side-panel-start"
      data-bordered
      data-position="left"
      data-heading="Filters"
      data-restore-label="Filters"
      data-search
      data-search-match="sherpa-list-item"
      data-empty="No filters match"
      data-expanded>
      <sherpa-list>
        <sherpa-list-item data-label="All devices"></sherpa-list-item>
        <sherpa-list-item data-label="Online"></sherpa-list-item>
        <sherpa-list-item data-label="Offline"></sherpa-list-item>
        <sherpa-list-item data-label="Needs attention"></sherpa-list-item>
      </sherpa-list>
    </sherpa-panel>

    <!-- Centre content -->
    <sherpa-filter-bar></sherpa-filter-bar>
    <sherpa-data-grid></sherpa-data-grid>
    <sherpa-pagination></sherpa-pagination>

    <!-- Right rail: details / inspector -->
    <sherpa-panel
      slot="side-panel-end"
      data-bordered
      data-position="right"
      data-heading="Details"
      data-restore-label="Details"
      data-expanded>
      <sherpa-key-value-list></sherpa-key-value-list>
    </sherpa-panel>

  </sherpa-layout-grid>
</template>
