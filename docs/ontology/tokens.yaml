Button::button-size/height:
  id: Button::button-size/height
  kind: variable
  tier: component
  resolvedType: FLOAT
  role: space
  scope:
    - WIDTH_HEIGHT
  purpose: A spacing step.
  whenToUse: As a gap, padding, or size.
  whenNOT: Not a colour or radius.
  aliasedFrom:
    xl: Core::size/2xl
    xs: Core::size/sm
    sm: Core::size/md
    md: Core::size/lg
    3xl: Core::size/4xl
    2xs: Core::size/xs
    2xl: Core::size/3xl
  consumedBy: []
  seeAlso: []
  caveat: >-
    A Button MUST bind its height/icon to this (and padding/gap to button-space/*, label font to
    button-font/*). NEVER HUG a button height or hard-set pixels — that severs the size system. Set
    the size by pinning the Button collection MODE (2xs…3xl) on the instance; the bound vars
    re-value per mode.
