Status::status-content/tertiary:
  id: Status::status-content/tertiary
  kind: variable
  tier: component
  resolvedType: COLOR
  role: content
  scope:
    - SHAPE_FILL
    - TEXT_FILL
    - STROKE_COLOR
  purpose: Ink for text or an icon.
  whenToUse: As text colour, or to ink an icon glyph.
  whenNOT: Never as a surface fill behind content.
  aliasedFrom:
    passthrough: Style (Sherpa)::content/tertiary/base
    info: Style (Sherpa)::content/tertiary/on-color-subtle
    critical: Style (Sherpa)::content/tertiary/on-color-subtle
    warning: Style (Sherpa)::content/tertiary/on-color-subtle
    urgent: Style (Sherpa)::content/tertiary/on-color-subtle
    success: Style (Sherpa)::content/tertiary/on-color-subtle
  consumedBy: []
  seeAlso: []
  caveat: >-
    DO NOT bind a control label (button/tag text) to this directly — under a status pin it resolves
    to the ON-COLOR (light) ink meant for text on a SATURATED fill, so a secondary/tertiary control
    (light surface) gets invisible light-on-light text. This was the sherpa-button bug (FIXED:
    repointed to control-content/default). Control LABELS are NOT status-tinted — bind
