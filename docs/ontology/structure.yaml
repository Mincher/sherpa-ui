_note: >-
  Structural ontology — collections, their mode axes, and extensions. Human-authored purposes pushed
  to Figma collection/mode descriptions. Variables get a short role line (see
  build-var-descriptions). Tiers: reference (Primitives, Core) → semantic (Style) → component
  (Control, Status, Container, Button, Switch, Input, Navigation, Badge) → override (Elevation,
  Color Sets, Snapping, Layout, Data Viz, Typography + extensions + density).
collections:
  Primitives:
    tier: reference
    purpose: >-
      Raw values — the base palette, spacing, and effect numbers everything else aliases FROM.
      Reference-only: never bind a Primitive directly in a component.
    modeAxis: single value
  Core:
    tier: reference
    purpose: >-
      The named ramps (color/space/size/border/fonts) semantic tokens alias from. Reference-only;
      bind Style or a component collection instead.
    modeAxis: single value
  Style (Sherpa):
    tier: semantic
    purpose: >-
      The semantic layer — surface/content/border/status/app roles resolved for light & dark. The
      meaning layer components alias into.
    modeAxis: light / dark (mode = colour theme)
  Control:
    tier: component
    purpose: >-
      Geometry + look for interactive controls (button, tag, input, switch). Modes are the look
      tiers.
    modeAxis: default / primary / secondary / tertiary (look tier)
  Status:
    tier: component
    purpose: >-
      Fill/border/content of any status-aware component. Modes are the status states; passthrough =
      neutral (no status).
    modeAxis: passthrough / info / critical / warning / urgent / success
  Container:
    tier: component
    purpose: >-
      Geometry + surface for containers (card, panel, dialog, callout). Modes are the container
      tiers.
    modeAxis: default / secondary / tertiary (tier)
  Button:
    tier: component
    purpose: >-
      Button size scale — height, padding, gap, icon, and label font shrink per size. Modes are the
      seven sizes.
    modeAxis: 2xs / xs / sm / md / xl / 2xl / 3xl (size)
  Switch:
    tier: component
    purpose: Switch geometry + track/knob colour. Modes are the two styles.
    modeAxis: standard (rectangular, ON/OFF) / simple (pill)
  Input:
    tier: component
    purpose: Input field border + validation state. Mode = whether validation styling is active.
    modeAxis: default / validation
  Navigation:
    tier: component
    purpose: Nav container surface/size/space + boolean visibility flags. Modes are the nav states.
    modeAxis: default / collapsed / hover / pinned / settings
  Badge:
    tier: component
    purpose: Overlay count/dot indicator surface/border/content. Modes are the badge colour treatments.
    modeAxis: default / brand / accent
  Elevation:
    tier: override
    purpose: >-
      Drop-shadow offset/blur/spread/colour, bound on a component base. Mode = elevation level;
      passthrough = no shadow.
    modeAxis: passthrough / sm / md / lg
  Color Sets:
    tier: override
    purpose: >-
      Hue-tinted surface/border/content for categorical/branded containers. Mode = the hue;
      passthrough = neutral.
    modeAxis: >-
      passthrough / 11 hues (violet, purple, teal, cyan, blue, periwinkle, amber, pink, magenta,
      green, grey)
  Snapping:
    tier: override
    purpose: >-
      Per-corner radius + edge gap for seamless component groups (joined toolbars, segmented
      controls). Mode = which edge is snapped.
    modeAxis: passthrough / right-edge / all-edges / left-edge / bottom-edge / top-edge / isolated
  Layout (Grid):
    tier: override
    purpose: Responsive layout-grid column counts + gaps. Modes are the breakpoints.
    modeAxis: mobile / tablet / desktop / wide
  Data Viz:
    tier: override
    purpose: >-
      Chart series colours — categorical, sequential ramps, and divergent pairs. Mode = the palette
      family.
    modeAxis: categorical / sequential/* / divergent/*
  Typography:
    tier: override
    purpose: >-
      Text numerics (size, line-height, letter-spacing, family, weight) per text style. Mode = the
      text style.
    modeAxis: h1…h5 / default|emphasised|light × lg…2xs (text style)
extensions:
  Saturated:
    parent: Status
    purpose: >-
      Re-values Status with more saturated fills — the bolder status treatment. Same status modes as
      the parent.
  Border Only:
    parent: Status
    purpose: >-
      Re-values Status as outline-only (transparent surface, coloured border). The ghost/outline
      status treatment.
  Saturated (Color Sets):
    parent: Color Sets
    purpose: Re-values Color Sets with more saturated hues. Same hue modes as the parent.
  brand:
    parent: Typography
    purpose: Re-values Typography with the brand typeface. Same text-style modes.
  monospaced:
    parent: Typography
    purpose: >-
      Re-values Typography with the monospace family — for code, numeric values. Same text-style
      modes.
  hero:
    parent: Typography
    purpose: Re-values Typography at hero scale — oversized display type. Same text-style modes.
  compact:
    parent: Core
    purpose: Re-values Core spacing tighter — the compact density. Bind via density switch.
  comfortable:
    parent: Core
    purpose: Re-values Core spacing looser — the comfortable density.
  Calendar Day:
    parent: Layout (Grid)
    purpose: Calendar day-grid columns/gaps (7-col) per breakpoint.
  Calendar Month:
    parent: Layout (Grid)
    purpose: Calendar month-grid columns/gaps (3-col) per breakpoint.
  Calendar Year:
    parent: Layout (Grid)
    purpose: Calendar year-grid columns/gaps (3-col) per breakpoint.
_modeNote: >-
  Figma modes carry no description field — mode purpose lives here (repo) and is summarised on each
  collection description (Mode = …).
modes:
  Status:
    passthrough: Neutral — no status tint
    info: Informational (blue)
    critical: Error/destructive (red)
    warning: Caution (amber)
    urgent: High-priority alert
    success: Positive/complete (green)
  Control:
    default: Neutral control look
    primary: Primary action (accent fill)
    secondary: Secondary (outline)
    tertiary: Tertiary (ghost/text)
  Container:
    default: Base surface
    secondary: Secondary tier
    tertiary: Tertiary tier
  Elevation:
    passthrough: No shadow
    sm: Subtle lift
    md: Floating
    lg: High elevation
  Button:
    2xs: 8px type
    xs: 10px type
    sm: 14px type
    md: default
    xl: large
    2xl: larger
    3xl: largest
  Color Sets:
    passthrough: Neutral
    _: 11 hues re-tint surface/border/content
  Data Viz:
    categorical: Distinct series hues
    _: sequential/* single-hue ramps, divergent/* two-pole pairs
