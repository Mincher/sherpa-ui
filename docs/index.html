<!doctype html>
<html lang="en" data-theme="apex-2-purple">
  <head>
    <title>Sherpa UI — Design System</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Open+Sans:wght@400;600;700&family=Source+Code+Pro:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link href="/css/styles/index.css" rel="stylesheet" />
    <link href="/docs/docs.css" rel="stylesheet" />
    <style>
      html, body {
        height: 100dvh;
        min-height: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>

    <!-- ── Site header ──────────────────────────────────────────────────── -->
    <sherpa-view-header
      id="docs-header"
      data-label="Sherpa UI"
    ></sherpa-view-header>

    <!-- ── Appearance toolbar ───────────────────────────────────────────── -->
    <sherpa-toolbar id="appearance-toolbar" data-density="compact" aria-label="Appearance">
      <sherpa-button
        slot="leading"
        id="playground-btn"
        data-variant="tertiary"
        data-size="small"
        data-label="Playground"
        data-icon-start="fa-solid fa-flask"
        title="Open Component Playground"
      ></sherpa-button>
      <sherpa-input-select
        slot="trailing"
        id="theme-select"
        data-size="small"
        data-label="Theme"
        data-layout="inline"
      ></sherpa-input-select>
      <sherpa-input-select
        slot="trailing"
        id="mode-select"
        data-size="small"
        data-label="Mode"
        data-layout="inline"
      ></sherpa-input-select>
      <sherpa-input-select
        slot="trailing"
        id="density-select"
        data-size="small"
        data-label="Density"
        data-layout="inline"
      ></sherpa-input-select>
    </sherpa-toolbar>

    <!-- ── Main layout ──────────────────────────────────────────────────── -->
    <sherpa-layout-view data-fill="viewport" data-pad data-gap="base">

      <!-- Left sidebar — component navigation -->
      <sherpa-content-section
        slot="side-panel-start"
        id="nav-section"
        data-position="left"
        data-heading="Design System"
        data-restore-label="Navigation"
        data-flush
      >
        <sherpa-list-panel
          id="docs-nav-panel"
          data-match="sherpa-list-item"
          data-empty="No results"
        >
          <!-- Navigation items injected by router.js -->
        </sherpa-list-panel>
      </sherpa-content-section>

      <!-- Centre — router outlet -->
      <main id="docs-outlet" aria-live="polite" aria-label="Documentation content">
        <!-- Page content injected by router.js -->
      </main>

    </sherpa-layout-view>

    <script type="module" src="/components/index.js"></script>
    <script type="module" src="/docs/router.js"></script>
  </body>
</html>
