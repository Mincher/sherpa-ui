<!--
  docs/pages/category.html — Category page partial.
  Fetched by router.js, cloned into #docs-outlet.

  Dynamic regions are populated by JS via these hooks:
    [data-region="header"]           — sherpa-section-header (data-label / description set per route)
    [data-region="component-cards"]  — host for cloned component cards
    [data-region="empty"]            — sherpa-empty-state, shown when no items
    template.component-card-tpl      — cloning prototype for one card
-->
<div class="docs-page docs-category-page">

  <p class="docs-page-subtitle" data-region="header-description"></p>

  <div class="docs-card-grid" data-region="component-cards" aria-label="Components in this category"></div>

  <sherpa-empty-state
    data-region="empty"
    data-label="No components in this category"
    hidden
  ></sherpa-empty-state>

  <template class="component-card-tpl">
    <sherpa-card
      data-interactive="true"
      data-elevation="sm"
      tabindex="0"
      role="link"
    ></sherpa-card>
  </template>

</div>
