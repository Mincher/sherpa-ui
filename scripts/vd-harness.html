<!doctype html>
<!--
  vd-harness.html — visual-diff render harness.

  Mounts ONE sherpa-* component (from dist) with a small set of representative
  attrs/children, so scripts/visual-diff.mjs can screenshot it beside the Figma
  export. Not shipped — a dev tool. Served by scripts/visual-diff.mjs's static server.
-->
<html lang="en" data-theme="sherpa" data-mode="light">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/dist/styles/tokens/tokens.css" />
  <script type="module" src="/dist/index.js"></script>
  <style>
    html, body { margin: 0; background: #fff; }
    #stage { display: inline-block; padding: 16px; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script type="module">
    // Representative sample markup per component. Keep close to a Figma default variant.
    // The value can be an array of variant snippets (rendered stacked) to show states.
    // 42 static-renderable components (the 11 populate()-driven ones — barchart,
    // breadcrumbs, chart-legend, data-grid, donut-chart, key-value-list, line-chart,
    // progress-step-tracker, quick-filter-toolbar, transfer-list, tabs-strip — are
    // handled in a later pass once populate() samples are wired).
    const SAMPLES = {
      'sherpa-accordion': ['<sherpa-accordion data-heading="Section title" data-description="Optional secondary line">Disclosure body content.</sherpa-accordion>',
                           '<sherpa-accordion data-heading="Open by default" open>This body is visible because the panel is open.</sherpa-accordion>'],
      'sherpa-app-header': ['<sherpa-app-header data-heading="Dashboard" data-icon="▦" data-notifications="3"></sherpa-app-header>'],
      'sherpa-button': ['<sherpa-button data-label="Button" data-icon-start="✓"></sherpa-button>',
                        '<sherpa-button data-look="saturated" data-label="Primary"></sherpa-button>',
                        '<sherpa-button data-look="transparent" data-label="Tertiary"></sherpa-button>'],
      'sherpa-calendar': ['<sherpa-calendar data-type="single" data-view="day" data-value="2026-09-08"></sherpa-calendar>'],
      'sherpa-callout': ['<sherpa-callout data-status="info" data-heading="Heads up">A callout message.</sherpa-callout>',
                         '<sherpa-callout data-status="success" data-heading="Saved" data-dismissible>Your changes were saved.</sherpa-callout>'],
      'sherpa-chat-message': ['<sherpa-chat-message data-type="assistant" data-name="Assistant" data-timestamp="09:41">How can I help you today?</sherpa-chat-message>',
                              '<sherpa-chat-message data-type="user" data-name="You" data-timestamp="09:42">Summarise the report.</sherpa-chat-message>'],
      'sherpa-chip': ['<sherpa-chip data-icon="●">Chip</sherpa-chip>',
                      '<sherpa-chip data-icon="●" data-dismissible>Dismissible</sherpa-chip>'],
      'sherpa-code-block': ['<sherpa-code-block data-language="bash" data-line-numbers data-code="npm run build\nnpm test"></sherpa-code-block>'],
      'sherpa-container': ['<sherpa-container data-elevation="sm" data-padding="base"><div slot="header">Card header</div>Card body content.<div slot="footer">Footer actions</div></sherpa-container>'],
      'sherpa-container-footer': ['<sherpa-container-footer data-align="end"><sherpa-button data-label="Cancel"></sherpa-button><sherpa-button data-look="saturated" data-label="Save"></sherpa-button></sherpa-container-footer>'],
      'sherpa-container-header': ['<sherpa-container-header data-heading="Container header" data-description="Secondary description" data-icon="▦" data-dismissible></sherpa-container-header>',
                                  '<sherpa-container-header data-variant="panel" data-heading="Panel title" data-collapsible></sherpa-container-header>'],
      'sherpa-dialog': ['<sherpa-dialog open data-heading="Dialog title">Dialog body content.<div slot="footer"><sherpa-button data-label="Cancel"></sherpa-button><sherpa-button data-look="saturated" data-label="Confirm"></sherpa-button></div></sherpa-dialog>'],
      'sherpa-empty-state': ['<sherpa-empty-state data-illustration="empty" data-heading="Nothing here yet" data-description="Create your first item to get started." data-small-print="Need help? See the docs."><sherpa-button slot="action" data-look="saturated" data-label="Create item"></sherpa-button></sherpa-empty-state>'],
      'sherpa-file-upload': ['<sherpa-file-upload data-label="Upload files" data-helper="Drag and drop or browse" data-max-size="4 MB" data-accept="image/*,.pdf" data-multiple></sherpa-file-upload>'],
      'sherpa-gauge-chart': ['<sherpa-gauge-chart data-value="30" data-label="30GB" data-caption="30GB of 60GB used" data-min="0" data-max="100"></sherpa-gauge-chart>'],
      'sherpa-grid-cell': ['<sherpa-grid-cell data-type="cell">Cell value</sherpa-grid-cell>',
                           '<sherpa-grid-cell data-type="header" data-has-checkbox data-has-actions data-sort-direction="asc">Column</sherpa-grid-cell>'],
      'sherpa-input-text': ['<sherpa-input-text data-label="Email" data-description="We\'ll never share it." placeholder="you@example.com"></sherpa-input-text>',
                            '<sherpa-input-text data-label="Name" data-error="This field is required." required></sherpa-input-text>'],
      'sherpa-list': ['<sherpa-list data-variant="default"><sherpa-list-item data-label="First row" data-description="Row description"></sherpa-list-item><sherpa-list-item data-label="Second row" data-current></sherpa-list-item></sherpa-list>'],
      'sherpa-list-item': ['<sherpa-list-item data-label="List item" data-description="Secondary text" data-icon="●" data-interactive></sherpa-list-item>',
                           '<sherpa-list-item data-label="Selected item" data-selectable data-selected data-current></sherpa-list-item>'],
      'sherpa-loader': ['<sherpa-loader data-size="md"><span slot="label">Loading…</span></sherpa-loader>'],
      'sherpa-metric': ['<sherpa-metric data-label="Revenue" data-value="$48.2k" data-delta="+12.5%" data-trend="up"></sherpa-metric>',
                        '<sherpa-metric data-label="Churn" data-value="2.1%" data-delta="-0.4%" data-trend="down"></sherpa-metric>'],
      'sherpa-nav-item': ['<sherpa-nav-item data-icon="▦" data-label="Dashboard" data-current></sherpa-nav-item>',
                          '<sherpa-nav-item data-icon="✉" data-label="Inbox" data-badge="12" data-expandable></sherpa-nav-item>'],
      'sherpa-nav-section': ['<sherpa-nav-section data-label="Workspace"></sherpa-nav-section>'],
      'sherpa-overlay-panel': ['<sherpa-overlay-panel open data-icon="▦" data-title="Panel title" data-dismissible data-collapsible><div slot="description">Secondary metadata</div>Panel body content.<div slot="footer"><sherpa-button data-label="Cancel"></sherpa-button><sherpa-button data-look="saturated" data-label="Apply"></sherpa-button></div></sherpa-overlay-panel>'],
      'sherpa-pagination': ['<sherpa-pagination data-page="1" data-total-pages="12" data-page-size="25" data-rows-options="10,25,50"></sherpa-pagination>'],
      'sherpa-panel': ['<sherpa-panel data-heading="Panel heading">Panel body content.<div slot="footer">Footer actions</div></sherpa-panel>'],
      'sherpa-progress-bar': ['<sherpa-progress-bar value="60" data-label="Uploading"></sherpa-progress-bar>',
                              '<sherpa-progress-bar data-indeterminate data-label="Working…"></sherpa-progress-bar>'],
      'sherpa-prompt-composer': ['<sherpa-prompt-composer data-placeholder="Ask anything…"></sherpa-prompt-composer>'],
      'sherpa-quick-filter': ['<sherpa-quick-filter data-type="default" data-label="Status" data-icon-start="▽" data-count="3" data-menu></sherpa-quick-filter>',
                              '<sherpa-quick-filter data-type="ai" data-label="AI filter" data-current></sherpa-quick-filter>'],
      'sherpa-section-header': ['<sherpa-section-header data-heading="Section header" data-divider><div slot="description">Optional description line</div><sherpa-button slot="actions" data-label="Action"></sherpa-button></sherpa-section-header>'],
      'sherpa-select-card': ['<sherpa-select-card data-label="Card title" data-description="Helper line under the title" data-select-mode="radio" name="plan" value="a">Card body content.</sherpa-select-card>',
                             '<sherpa-select-card data-label="Selected card" data-description="This one is picked" data-selected data-select-mode="checkbox" value="b">Card body content.</sherpa-select-card>'],
      'sherpa-select-checkbox': ['<sherpa-select-checkbox data-label="Checkbox" data-description="Optional helper line"></sherpa-select-checkbox>',
                                 '<sherpa-select-checkbox data-label="Checked" checked></sherpa-select-checkbox>'],
      'sherpa-select-group': ['<sherpa-select-group data-label="Choose one" data-description="Pick a single option"><sherpa-select-radio slot="options" name="grp" value="a" data-label="Option A"></sherpa-select-radio><sherpa-select-radio slot="options" name="grp" value="b" data-label="Option B"></sherpa-select-radio></sherpa-select-group>'],
      'sherpa-select-radio': ['<sherpa-select-radio data-label="Radio" data-description="Optional helper line" name="r"></sherpa-select-radio>',
                              '<sherpa-select-radio data-label="Selected" name="r" checked></sherpa-select-radio>'],
      'sherpa-slider': ['<sherpa-slider data-label="Volume" min="0" max="100" value="40" data-show-value></sherpa-slider>'],
      'sherpa-sparkline': ['<sherpa-sparkline data-values="10,25,15,30,22,34,28,40"></sherpa-sparkline>',
                           '<sherpa-sparkline data-variant="bar" data-values="10,25,15,30,22,34,28,40"></sherpa-sparkline>'],
      'sherpa-switch': ['<sherpa-switch></sherpa-switch>',
                        '<sherpa-switch checked></sherpa-switch>',
                        '<sherpa-switch data-style="simple" checked></sherpa-switch>'],
      'sherpa-tag': ['<sherpa-tag data-icon="●">Label</sherpa-tag>',
                     '<sherpa-tag data-status="success" data-icon="●" data-dismissible>Active</sherpa-tag>',
                     '<sherpa-tag data-type="dot" data-status="critical"></sherpa-tag>'],
      'sherpa-toast': ['<sherpa-toast data-status="success" data-heading="Saved" data-value="3 items updated" data-action="Undo" data-duration="0"></sherpa-toast>'],
      'sherpa-toolbar': ['<sherpa-toolbar data-variant="bordered"><div slot="leading"><sherpa-section-header data-heading="Toolbar title"></sherpa-section-header></div><div slot="trailing"><sherpa-button data-type="icon" data-icon-start="⋯"></sherpa-button></div></sherpa-toolbar>'],
      'sherpa-tooltip': ['<sherpa-tooltip data-text="Tooltip text" data-placement="top"><sherpa-button data-label="Hover me"></sherpa-button></sherpa-tooltip>'],
    };

    async function mount(name) {
      const stage = document.getElementById('stage');
      stage.innerHTML = '';
      await customElements.whenDefined(name).catch(() => {});
      const snippets = SAMPLES[name] || [`<${name}></${name}>`];
      const wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex;flex-direction:column;gap:12px;align-items:flex-start';
      wrap.innerHTML = snippets.join('\n');
      stage.appendChild(wrap);
      // wait a beat for shadow render
      await Promise.all([...stage.querySelectorAll('*')].map(el => el.rendered).filter(Boolean));
      window.__mounted = true;
    }
    window.__mount = mount;
    const name = new URLSearchParams(location.search).get('c');
    if (name) mount(name);
  </script>
</body>
</html>
