_note: >-
  code component (sherpa-*) ↔ Figma page/node name. The names DIFFER — this is the authoritative
  bridge. status: matched = both exist and agree; no-figma = code has no Figma component; figma-only
  (see figmaOnly[]) = Figma has no code; needs-rebuild = both exist but the code is legacy and
  predates/diverges from the current Figma (rebuild to match). tier: top-level (default) |
  sub-component = an atomic building block of a parent, not a standalone product (Figma name may be
  dot-prefixed).
