figmaOnly:
  - figma: Banner
    note: no code component yet — full-width status banner
  - figma: Chip
    note: no code component — status-tinted pill (sherpa-tag covers the neutral case)
  - figma: Select Card
    note: no code component — selectable gallery card
  - figma: Badge
    note: no code component — overlay count/dot indicator
  - figma: Menu
    note: no code component — elevated List (composition)
  - figma: View Header
    note: no code component — overlaps app-header
  - figma: Time Picker
    note: placeholder in Figma; folded into calendar in code
  - figma: .Grid Selection Column
    tier: sub-component
    note: >-
      sub-component of Data Grid; pinned selection column — folded into sherpa-grid-column
      (data-pinned=left, data-type=selection) in code, no separate element
  - figma: .Grid Actions Column
    tier: sub-component
    note: >-
      sub-component of Data Grid; pinned actions column — folded into sherpa-grid-column
      (data-pinned=right, data-type=actions) in code, no separate element
  - figma: Calendar
    note: >-
      composition-covered — sherpa-calendar renders the date Grid + Time Picker; no standalone code
      element binds Calendar directly
  - figma: Chart Legend
    note: >-
      composition-covered — sherpa-chart-legend binds the atomic Legend Item; the composed Chart
      Legend is assembled from Legend Items
  - figma: Checkbox Indicator
    tier: sub-component
    note: >-
      atomic checkbox box — used inside Select Checkbox + grid selection cells; no standalone code
      element
  - figma: Radio Indicator
    tier: sub-component
    note: atomic radio dot — used inside Select Radio; no standalone code element
  - figma: Calendar Button
    tier: sub-component
    note: atomic day cell/button of Calendar (Grid); no standalone code element
  - figma: Chart Axis
    tier: sub-component
    note: atomic axis of a chart (Data Field); no standalone code element
  - figma: File Item
    tier: sub-component
    note: atomic file row of File Uploader; no standalone code element
  - figma: .Grid Column Filter
    tier: sub-component
    note: >-
      per-column filter row (magnifier + value + sort/menu); rendered inline by sherpa-data-grid, no
      separate code element
  - figma: .Grid Selection Cell
    tier: sub-component
    note: >-
      selection cell (checkbox/radio) for the pinned selection column; rendered inline by
      sherpa-data-grid
  - figma: .Grid Action Cell
    tier: sub-component
    note: row-actions cell for the pinned actions column; rendered inline by sherpa-data-grid
  - figma: .Grid Group Band
    tier: sub-component
    note: row-grouping band (toggle + group name); rendered inline by sherpa-data-grid
