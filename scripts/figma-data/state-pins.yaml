# A component STATE is a Style MODE pin, as Figma pins it on the instance.
#   '&…'  the host, then any descendant       value: mode | look | look/mode
# Generated by scripts/project-tokens.mjs: a host STATE pin into
# src/core/sherpa-style-modes.css; a part's pin and a bare '&' into the
# component's own sheet. TRAP T-a-state-colour-binds-the-style-mode

sherpa-data-grid:
  # A sorted or filtered column is FLAGGED with data-status="active"; its chips
  # carry the on-state, so the heading itself stays default.
  '& .head-cell[data-status]': default
  # The row-action Button pins Transparent=default; its menu rows are Menu List
  # Items, also Transparent. A danger row takes the critical mode of that look.
  '& .actions-trigger': transparent
  '& .action-item': transparent
  '& .action-item[data-danger]': transparent/critical
  # The group count is a Badge, which pins Style=default.
  '& .group-count': default
  # A cell's filter chip, ON: it takes the value off, so it reads as Discard. Will, TODO 416
  '& .cell-filter[data-current]': critical

sherpa-quick-filter:
  # Filter Chip (atom) instances pin Style=active when on — re-pointable by a page
  # as --sherpa-filter-on-*, so every chip follows: bar, panel, grid heading.
  # Will, TODO 353. TRAP T-a-pin-a-page-can-re-point
  # A PERSISTENT chip — the View chip, a picker — is always on, so it wears no
  # on look, active or green. Will, TODO 432.
  '&[data-current]:not([data-persistent])': active @filter-on
  # …and one that cannot be toggled — the View chip, a chart's Primary: both halves,
  # while it holds one; its field half keeps the default fill. Will, TODOs 667, 697
  '&[data-current][data-persistent]:not([disabled]) :is(.body, .caret)': active @filter-on
  # On but holding no values — the contradiction reads as a warning.
  '&[data-current][data-filters-nothing]': warning
  # ON BY A PRESET: a downstream chip or value, blue, and its tip says which. Will, TODO 521
  '&[data-by-preset]': info
  '&[data-current][data-by-preset]': info
  # SOLOED: every other filter in its scope is off while it is; its icon says so.
  # Will, TODO 690 (D2 A: info, refined in Figma later). TRAP T-a-solo-is-a-draft-of-one-tab
  '&[data-solo]': info
  '&[data-current][data-solo]': info
  # …and a value it leaves out, in a field it holds: refused. Will, TODO 601
  '&[data-held-out]': inactive
  '&[data-current][data-held-out]': inactive
  # An ADVANCED chip takes no pin of its own: it is ON, so it is active, as a
  # Simple one. Will, 2026-09-30 (TODO 156). TRAP T-a-conditioned-chip-reads-as-active
  # PENDING: changed, not yet applied — the WARNING look, whatever it was. It
  # turns on only once applied. Will, 2026-10-22 (TODO 406; it was no fill, TODO 46).
  # TRAP T-a-pending-chip-reads-as-a-warning
  '&[data-pending]': warning
  '&[data-current][data-pending]': warning
  # …and a DRAFT in its own open menu: the chip says so itself. TODO 415
  '&:state(drafting)': warning
  # FAILED: its data could not be fetched — a system error, not 0 matches.
  # After pending, so it wins. Will, 2026-10-22 (TODO 411).
  '&[data-failed]': critical
  '&[data-current][data-failed]': critical

  # The view took this field; reads as inactive, keeps its value. ON too: the :not
  # gives it the weight of `&[data-current]`, and a preset holding it stays blue. Will, TODO 611
  '&[data-superseded]:not([data-by-preset])': inactive
  '&[disabled]': inactive
  # Ruled out by the other filters: greyed and refused. Will, TODO 174.
  # TRAP T-a-ruled-out-value-is-greyed
  '&[data-unavailable]': inactive
  # The count is a Badge, which pins Style=default in Figma — never the on tint.
  '& .count': default
  # A SECTION's heading is the field's name: its values say its state, so its menu
  # button keeps the default look. TODO 425
  '&[data-layout="section"] .caret': default

sherpa-menu:
  # Every Menu variant pins Style=default, so a menu slotted into an ON chip
  # does not inherit its mode.
  '&': default
  # The Advanced (f(x)) button, ON, wears the filters' on colour, as the chip
  # does — re-pointed with it by --sherpa-filter-on-*. Will, TODO 468
  '& .use-advanced[aria-pressed="true"]': active @filter-on

# A grid cell's TAG — a native button wearing the filter chip's look, so a class
# key, on its blocks: ON, the filters' on colours, re-pointed with them; its field
# held by the View, inactive. Will, TODO 490
.cell-tag:
  '&[data-current]': active @filter-on
  '&[data-superseded]': inactive
  # …or by a preset on. Will, TODO 601
  '&[data-held-out]': inactive

# A MENU ROW — a Menu List Item, slotted light DOM, so a class key: it lives in
# its menu's tree, not the menu's shadow root. One the filters before it rule out
# is INACTIVE, ticked or not: the context limits it. Will, 2026-10-20.
# TRAP T-a-ruled-out-value-is-greyed
.menu-row:
  '&[data-unavailable]': inactive
  # A value a preset on holds: blue, ticked and refused. Will, TODO 521
  '&[data-by-preset]': info
  # The place the reader is on, as a current nav row wears it. TODO 600
  '&[aria-current]': active

sherpa-button:
  # A look is the button's own pin, as a nested Figma Button pins its look.
  '&[data-look="transparent"]': transparent
  '&[data-look="saturated"]': saturated
  # PRESSED — a toggle button that is ON, the same mode an open menu wears.
  '&[aria-pressed="true"]': active
  '&[aria-pressed="true"][data-look="transparent"]': transparent/active
  '&[aria-pressed="true"][data-look="saturated"]': saturated/active
  # Menu open — the active mode of its own look.
  '&[data-open]': active
  '&[data-open][data-look="transparent"]': transparent/active
  '&[data-open][data-look="saturated"]': saturated/active
  '&[disabled]': inactive
  '&[disabled][data-look="transparent"]': transparent/inactive
  '&[disabled][data-look="saturated"]': saturated/inactive
  # The badge is a Badge instance pinned Style=default — never the button's tint.
  '& .badge-value': default

# A native <button class="sherpa-button"> wears the Button's look, so it takes the
# Button's pins — on the same blocks, never its own. TRAP T-a-native-wears-the-button-class
.sherpa-button:
  '&[data-look="transparent"]': transparent
  '&[data-look="saturated"]': saturated
  '&[aria-pressed="true"]': active
  '&[aria-pressed="true"][data-look="transparent"]': transparent/active
  '&[aria-pressed="true"][data-look="saturated"]': saturated/active
  '&:disabled': inactive
  '&:disabled[data-look="transparent"]': transparent/inactive
  '&:disabled[data-look="saturated"]': saturated/inactive

sherpa-nav-item:
  # Navigation Item pins Transparent=default at its root. A promo is its own
  # bordered card, in the default look.
  '&:not([data-type="promo"])': transparent
  # SELECTED: the Default look's Active mode — its edge and a solid fill; the
  # Transparent look's tint alone was far too low contrast. Will, TODO 498
  '&[data-current]': active
  '&[disabled]': transparent/inactive
  # Its Tag instance pins Saturated=success; the dot is Indicator, Style=active.
  '& .badge': saturated/success
  '&[disabled] .badge': saturated/inactive
  '& .dot': active
  '& .promo-icon': active

sherpa-list-item:
  # Menu List Item pins Transparent=default at its root.
  '&': transparent
  # The current row pins Transparent=active, as Figma does.
  '&[data-current] .row': transparent/active
  '&[disabled] .row': inactive
  # The leading control pins Style=default in Figma.
  '& .checkbox': default

sherpa-tabs:
  # Each Tab pins Transparent=default; the current tab takes the ACTIVE mode, so
  # its reserved underline draws the active border.
  '& .tab': transparent
  '& .tab[data-current]': active

sherpa-calendar-cell:
  # A day pins Transparent=default; a selected day or range pins Style=active.
  '&': transparent
  '&[data-state="selected"]': active
  '&[data-state="range-start"]': active
  '&[data-state="range-mid"]': active
  '&[data-state="range-end"]': active

sherpa-node:
  # No Figma component yet (TODO 78). The card pins Style=default; the selected node, active.
  '&': default
  '&[data-current]': active
  # A portal of the picked portal's name, In or Out: it looks picked. TODO 779
  '&[data-linked]': active
  # What reached it that it cannot use: the warning mode, picked or not; a run's step wins. TODO 764
  '&[data-warning]': warning
  # LIT by its step as a run goes (plan 695 N2): running info, failed critical,
  # skipped inactive; done keeps the default. Will may restyle them.
  '&[data-step="running"]': info
  '&[data-step="failed"]': critical
  '&[data-step="skipped"]': inactive
  # A SOCKET pins its own type's mode, whatever its node does (a picked or running
  # node changes nothing): value info, object active, boolean success, any default.
  # The True socket is a boolean; False is critical, last so it wins. Will, 713 D5, D6
  '&[data-input-socket="value"] .socket-in': info
  '&[data-input-socket="object"] .socket-in': active
  '&[data-input-socket="boolean"] .socket-in': success
  '&[data-input-socket="any"] .socket-in': default
  '&[data-output-socket="value"] .socket-out': info
  '&[data-output-socket="object"] .socket-out': active
  '&[data-output-socket="boolean"] .socket-out': success
  '&[data-branches] .header .socket-out': success
  '&[data-branches] .socket-false': critical

sherpa-node-frame:
  # No Figma component yet (TODO 778). The frame pins Style=default; picked, active, as a picked node is.
  '&': default
  '&[data-current]': active

sherpa-node-row:
  '&[data-input-socket="value"] .socket-in': info
  '&[data-input-socket="object"] .socket-in': active
  '&[data-input-socket="boolean"] .socket-in': success
  '&[data-input-socket="any"] .socket-in': default
  '&[data-output-socket="value"] .socket-out': info
  '&[data-output-socket="object"] .socket-out': active
  '&[data-output-socket="boolean"] .socket-out': success

sherpa-notifications:
  # No Figma component. The unread pip wears the active mode's border.
  '& .notification-pip': active

# A tip is its own surface: it pins Style=default, so a chart in a status tile
# (a metric's sparkline) does not paint its tip in the status colour.
sherpa-sparkline:
  '& .sherpa-tip': default

sherpa-barchart:
  '& .sherpa-tip': default

sherpa-line-chart:
  '& .sherpa-tip': default

sherpa-radial-chart:
  '& .sherpa-tip': default

sherpa-gauge-chart:
  '& .sherpa-tip': default
  # Figma pins Style=default on the grey remainder segment (segment-4).
  '& .zone[data-rest]': default

sherpa-tooltip:
  # The bubble only — a host pin would also strip the status from the trigger.
  '& .bubble': default

sherpa-accordion:
  # Accordion pins Style=default at its root.
  '&': default

sherpa-quick-filter-toolbar:
  # Its filter Switch is off: every chip it stopped reads inactive.
  # TRAP T-the-filter-switch-keeps-what-it-turned-off
  '&:state(filters-off) .chips': inactive
  # A scope SHUT with a chip on inside: its header wears the chips' on fill, and
  # follows a page's re-point. Shut, its body is hidden; its badge and buttons keep
  # their own. Will, TODO 494 · TRAP T-a-shut-scope-wears-its-chips-fill
  '&:state(chips-on) sherpa-accordion.scope:not([open])': active @filter-on
  '& .scope-tip': default
  '& .actions-zone': default

sherpa-app-header:
  # The notification count is a Badge instance pinned Saturated=default.
  '& .notif-badge': saturated

sherpa-chip:
  # Figma inactive: the surface greys out, the label keeps its ink.
  '&[disabled]': inactive

sherpa-code-block:
  # The copy control is a Button instance pinned Transparent=default.
  '& .copy': transparent
  # No copied state in Figma; the tick reads as success (Will, A, 2026-11-03).
  '&:state(copied) .copied-label': success

sherpa-container:
  # Container pins Style=default at its root.
  '&': default

sherpa-dialog:
  # Dialog pins Style=default at its root. A data-status on the host still wins
  # (attribute beats tag), so the critical confirm dialog keeps working.
  '&': default

sherpa-input-text:
  # Input Field (atom) pins Style=default; its State=error pins Style=critical.
  '&': default
  '&[data-error]': critical
  # No Figma disabled design: the inactive mode.
  '&[disabled]': inactive
  # The validation bar pins Saturated=critical.
  '& .message': saturated/critical

sherpa-metric:
  # Figma pins the tile Style=success for a rise. The trend IS the status, so a
  # bare data-trend still colours the delta, the shadow and the sparkline.
  '&[data-trend="up"]': success
  '&[data-trend="down"]': critical

sherpa-overlay-panel:
  # Overlay Panel pins Style=default at its root.
  '&': default

sherpa-pagination:
  # Both Input Field instances pin Style=default in Figma.
  '& .rows': default
  '& .page-input': default
  '&[disabled] .rows': inactive
  '&[disabled] .page-input': inactive

sherpa-panel:
  # Panel pins Style=default at its root.
  '&': default

sherpa-progress-bar:
  # Figma has no disabled variant; inactive is the repo's disabled mode and
  # resolves to the old #b3b3c3 fill and track.
  '&[disabled]': inactive

sherpa-progress-step-tracker:
  # Figma pins Saturated=default on the done step (step 1 of Progress Steps).
  '& .step[data-state="done"]': saturated

sherpa-prompt-composer:
  # No disabled variant in Figma; the form takes the inactive mode. Its buttons
  # are disabled too, and pin their own look's inactive.
  '&[disabled]': inactive

sherpa-select-card:
  # Select Card pins nothing. No Figma disabled design: the inactive mode.
  '&[disabled]': inactive

sherpa-select-checkbox:
  # Checkbox (Atom) pins Style=default, so a status around it never tints the box.
  '& .control': default
  # No Figma design: the inactive mode greys box and indicator; the tick goes dark.
  '&[disabled] .control': inactive

sherpa-select-radio:
  # Radio (Atom) pins nothing. No Figma disabled design: the circle takes inactive.
  '&[disabled] .control': inactive

sherpa-slider:
  # No Figma disabled design: the inactive mode.
  '&[disabled]': inactive
  # Its Input Field (atom) instance pins Style=default.
  '& .value-input': default
  '&[disabled] .value-input': inactive

sherpa-switch:
  # Value=off pins Style=default at the root; Value=on pins Saturated=success.
  '&': default
  '&[checked]': saturated/success
  # No Figma disabled design: the inactive mode of each look.
  '&[disabled]': inactive
  '&[checked][disabled]': saturated/inactive

sherpa-transfer-list:
  # No disabled design in Figma; inactive greys the pane surface, as the old rule did.
  '&[disabled]': inactive
