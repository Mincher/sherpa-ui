<!--
  sherpa-canvas — a REAL <canvas> its slotted elements are DRAWN into, where the engine draws HTML in a canvas (Chrome
  157 on): each stays a live element — its fields take focus and typing, a press where it is drawn reaches it — drawn at
  its own place (its `--x`, `--y`) through the view its attributes set. Where the engine does not, the same elements lay
  out on a plain layer the view moves. Will, 2026-11-11 (plan 852). TRAP T-a-canvas-draws-live-html

  Public API:
    data-x     the view's pan across, in px (default 0)
    data-y     the view's pan down, in px (default 0)
    data-zoom  the view's scale (default 1)

  Slots:
    (default)  what it draws: each element at its --x and --y

  Fires: nothing.
-->
<template id="default">
  <div class="surface" part="surface"><slot data-accepts="content"></slot></div>
</template>
<template id="drawn">
  <canvas class="surface" part="surface" content="drawable"><slot data-accepts="content"></slot></canvas>
</template>
