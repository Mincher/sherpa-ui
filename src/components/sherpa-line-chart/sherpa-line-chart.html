<!--
  sherpa-line-chart — a line/area chart over a numeric series.

  populate({ labels, series }) writes polyline points + area path into the inline
  <svg> (viewBox 0 0 100 100, preserveAspectRatio none, so it stretches).

  Public API:
    data-label       chart title
    data-type     line (default) | area
    data-min / data-max   y-scale bounds (else derived)
    data-axis-label  y-axis caption (shown when set)
    data-x-axis-label  x-axis caption (shown when set)
    data-ticks       number of y gridlines/values (default 4)

  Slots:
    title   — heading above the chart (data-accepts: text, inline)
    legend  — a <sherpa-chart-legend> for the series. Horizontal → below the plot;
              vertical → beside it. (data-accepts: chart-legend)

  Fires: nothing — display only.
-->
<template id="default">
  <figure class="chart-figure" part="figure">
    <figcaption class="chart-header" part="header">
      <span class="title"><slot name="title"></slot></span>
    </figcaption>
    <div class="chart-body">
      <span class="axis-label axis-label-y" part="axis-label"></span>
      <div class="y-axis" part="y-axis" aria-hidden="true"></div>

      <div class="plot" part="plot" role="img" aria-label="Line chart">
        <svg class="svg" part="svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <g class="grid"></g>
          <g class="series-layer"></g>
        </svg>
        <!--
          Hover dots are real HTML buttons, NOT the polyline's vertices: an SVG
          element cannot be a CSS anchor in Chromium — anchor-name is accepted and
          silently never resolves, so the tip lands in the viewport corner.
        -->
        <div class="hotspots" part="hotspots"></div>

        <div class="x-axis" part="x-axis"></div>
        <span class="axis-label axis-label-x" part="x-axis-label"></span>
      </div>
    </div>

    <!-- The legend belongs to the CHART, not the card around it. -->
    <slot name="legend"></slot>
  </figure>

  <!-- One y value + its tick rule. -->
  <template class="ytick-tpl">
    <span class="y-tick"><span class="y-value"></span></span>
  </template>

  <!--
    Series <g>/<path>/<polyline> are built in the TS via createElementNS — SVG
    cloned from an HTML template lands in the wrong namespace and paints nothing.
  -->
  <template class="xlabel-tpl">
    <span class="x-label"></span>
  </template>

  <!--
    TWO SIBLINGS, cloned together — a dot and its tip.

    The tip must NOT be inside the dot or any positioned wrapper: an
    `position: absolute` ancestor breaks anchor positioning for a `position: fixed`
    tip, dropping it to that box's corner. The dot must be absolute to sit on its
    data point, so the tip stays in the static .hotspots layer and finds it by
    anchor name. `.chart-mark:hover + .chart-tip` pairs them.
  -->
  <template class="hotspot-tpl">
    <button class="hotspot chart-mark" type="button" tabindex="-1"></button>
    <span class="chart-tip" role="tooltip">
      <span class="chart-tip-label"></span>
      <span class="chart-tip-value"></span>
    </span>
  </template>
</template>
