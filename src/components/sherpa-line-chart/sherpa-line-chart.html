<!--
  sherpa-line-chart — a line/area chart over a numeric series.

  populate({ labels, series }) — one or more series of numbers over shared x
  labels. The JS computes SVG coordinates and writes the polyline points + area
  path into an inline <svg> (viewBox 0 0 100 100, preserveAspectRatio none, so it
  stretches). Colour is categorical per series. data-variant=area fills under the
  line.

  The Y AXIS matches the Figma "Chart Axis" (Orientation=vertical): value labels
  with a tick marker between each pair, drawn with a 0.5px style-border/base rule.
  The x labels already existed; an axis caption can now sit beside either.
  Axis text is content/size/base 14 on line-height/base 20, content/body/+1.

  Public API:
    data-label       chart title
    data-variant     line (default) | area
    data-min / data-max   y-scale bounds (else derived)
    data-axis-label  y-axis caption (shown when set)
    data-x-axis-label  x-axis caption (shown when set)
    data-ticks       number of y gridlines/values (default 4)

  Slots:
    title   — heading above the chart (data-accepts: text, inline)
    legend  — a <sherpa-chart-legend> for the series. Horizontal → below the plot;
              vertical → beside it. (data-accepts: chart-legend)

  Fires: nothing — display only.
-->
<template id="default">
  <figure class="chart-figure" part="figure">
    <figcaption class="chart-header" part="header">
      <span class="title"><slot name="title"></slot></span>
    </figcaption>
    <div class="chart-body">
      <span class="axis-label axis-label-y" part="axis-label"></span>
      <div class="y-axis" part="y-axis" aria-hidden="true"></div>

      <div class="plot" part="plot" role="img" aria-label="Line chart">
        <svg class="svg" part="svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <g class="grid"></g>
          <g class="series-layer"></g>
        </svg>
        <!--
          HOVER DOTS — one per data point, per series, and the tooltip anchors.

          Real HTML buttons, NOT the SVG polyline's vertices: an SVG element
          cannot be a CSS anchor in Chromium (anchor-name is accepted and silently
          never resolves, so the tip lands in the viewport corner).

          The TS already computes every point as an x/y PERCENTAGE of the plot for
          the polyline, so a dot reuses those two numbers directly — one source of
          truth for where a point sits, and it follows the plot at any size with
          nothing measured and no resize handler.
        -->
        <div class="hotspots" part="hotspots"></div>

        <div class="x-axis" part="x-axis"></div>
        <span class="axis-label axis-label-x" part="x-axis-label"></span>
      </div>
    </div>

    <!-- The legend belongs to the CHART, not to the card around it — the same
         rule sherpa-donut-chart already follows for its own. A HORIZONTAL legend
         sits BELOW the plot (this slot, in the host's flex column); a VERTICAL one
         sits BESIDE it, which the CSS switches to a two-column grid on. -->
    <slot name="legend"></slot>
  </figure>

  <!-- One y value + its tick rule (see the barchart for the same prototype). -->
  <template class="ytick-tpl">
    <span class="y-tick"><span class="y-value"></span></span>
  </template>

  <!--
    Series <g>/<path>/<polyline> are built in the TS via createElementNS (SVG
    elements can't be cloned from an HTML template — they'd land in the wrong
    namespace). This is data-driven structural DOM, which the golden rules allow.
  -->
  <template class="xlabel-tpl">
    <span class="x-label"></span>
  </template>

  <!-- One data point's hover dot + tooltip. The JS sets --_x / --_y (percentages
       of the plot, the same pair the polyline uses) and the text. -->
  <!--
    TWO SIBLINGS, cloned together — a dot and its tip.

    The tip must NOT be inside the dot, and not inside a positioned wrapper
    either. An `position: absolute` ancestor breaks anchor positioning for a
    `position: fixed` tip: proved it in isolation, where a tip inside a static
    layer places above its mark correctly while the same tip inside an absolute
    box drops to that box's own corner. The dot has to be absolute to sit on its
    data point, so the tip lives OUTSIDE it, in the static .hotspots layer, and
    finds it by anchor name. `.chart-mark:hover + .chart-tip` pairs them.
  -->
  <template class="hotspot-tpl">
    <button class="hotspot chart-mark" type="button" tabindex="-1"></button>
    <span class="chart-tip" role="tooltip">
      <span class="chart-tip-label"></span>
      <span class="chart-tip-value"></span>
    </span>
  </template>
</template>
