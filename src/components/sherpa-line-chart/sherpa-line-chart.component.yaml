# sherpa-line-chart — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-line-chart.{thin.yaml,html,css,ts}. The MECHANICAL surface only —
# props (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# Validated by schemas/component.v1.json; round-trips via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-line-chart
$description: a line/area chart over one or more numeric series.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  root:
    el: div
    class: chart-header
    part: header
    children:
      - el: span
        class: title
        slot: title
props:
  - $type: prop
    name: data-label
    type: string
    kind: style
    description: chart title
  - $type: prop
    name: data-max
    type: string
    kind: content
    description: y-scale bounds (else derived)
  - $type: prop
    name: data-min
    type: string
    kind: content
    description: y-scale bounds (else derived)
  - $type: prop
    name: data-variant
    type: enum
    kind: content
    values:
      - line
      - area
    description: line  | area
states:
  - $type: state
    name: not-area
    selector: ":host(:not([data-variant=\"area\"]))"
events:
  - $type: event
    name: nothing
    bubbles: true
    composed: true
tokens:
  title.font-size: "{sherpa.font-size-body-base}"
  title.font-weight: "{sherpa.font-weight-semibold}"
  title.color: "{sherpa.theme-content-body-base}"
  line.stroke: "{sherpa.categorical-1}"
  area.fill: "{sherpa.categorical-1}"
  x-axis.margin-block-start: "{sherpa.display-space-2xs}"
  x-axis.font-size: "{sherpa.font-size-body-small}"
  x-axis.color: "{sherpa.theme-content-body-1}"
$extensions:
  sherpa:
    figmaName: Data Field
    category: chart
    variantAxes:
      - name: Orientation
        values:
          - vertical
          - horizontal
