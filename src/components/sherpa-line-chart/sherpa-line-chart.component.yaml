# sherpa-line-chart — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-line-chart.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-line-chart
$description: a line/area chart over one or more numeric series.
element:
  $type: element
  tag: figure
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: figure
      class: chart-figure
      part: figure
      children:
        - el: figcaption
          class: chart-header
          part: header
          children:
            - el: span
              class: title
              slot: title
        - el: div
          class: chart-body
          children:
            - el: span
              class: axis-label axis-label-y
              part: axis-label
            - el: div
              class: y-axis
              part: y-axis
              attrs:
                aria-hidden: "true"
            - el: div
              class: plot
              part: plot
              attrs:
                role: img
                aria-label: Line chart
              children:
                - el: svg
                  class: svg
                  part: svg
                  attrs:
                    viewBox: 0 0 100 100
                    preserveAspectRatio: none
                    aria-hidden: "true"
                  children:
                    - el: g
                      class: grid
                    - el: g
                      class: series-layer
                - el: div
                  class: hotspots
                  part: hotspots
                - el: div
                  class: x-axis
                  part: x-axis
                - el: span
                  class: axis-label axis-label-x
                  part: x-axis-label
        - slot: legend
    - el: template
      class: ytick-tpl
      children:
        - el: span
          class: y-tick sherpa-truncate
          children:
            - el: span
              class: y-value
props:
  - $type: prop
    name: data-axis-label
    type: string
    observed: false
    kind: content
    description: y-axis caption (shown when set)
  - $type: prop
    name: data-max
    type: string
    observed: true
    kind: style
    description: y-scale bounds (else derived)
  - $type: prop
    name: data-min
    type: string
    observed: true
    kind: style
    description: y-scale bounds (else derived)
  - $type: prop
    name: data-ticks
    type: string
    observed: true
    kind: style
    default: "4"
    description: number of y gridlines/values
  - $type: prop
    name: data-type
    type: enum
    observed: true
    kind: style
    values:
      - line
      - area
    description: line  | area
  - $type: prop
    name: data-x-axis-label
    type: string
    observed: false
    kind: content
    description: x-axis caption (shown when set)
states:
  - $type: state
    name: vertical
    selector: ":host([data-legend=\"vertical\"])"
  - $type: state
    name: has-y-axis
    selector: ":host([data-has-y-axis])"
  - $type: state
    name: axis-label
    selector: ":host([data-axis-label])"
  - $type: state
    name: x-axis-label
    selector: ":host([data-x-axis-label])"
  - $type: state
    name: not-area
    selector: ":host(:not([data-type=\"area\"]))"
  - $type: state
    name: focus-visible
    selector: .hotspot:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (hiddenSeries). See $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: >-
      callable from a view definition's state block (setSeriesHidden). See
      $extensions.sherpa.methods.
tokens:
  title.font-size: "{sherpa.font-size-body-base}"
  title.font-weight: "{sherpa.font-weight-semibold}"
  title.color: "{sherpa.theme-content-body-base}"
  plot.border-block-end: "{sherpa.display-mode-border-width-base}"
  line.stroke: "{sherpa.data-viz-series-1}"
  area.fill: "{sherpa.data-viz-series-1}"
  x-axis.margin-block-start: "{sherpa.display-mode-space-2xs}"
  axis-label-y.margin-inline-end: "{sherpa.display-mode-space-2xs}"
  y-axis.inline-size: "{sherpa.display-mode-size-lg}"
  y-axis.padding-inline-end: "{sherpa.display-mode-space-sm}"
  y-axis.border-inline-end: "{sherpa.border-right}"
  y-axis.font-weight: "{sherpa.font-weight-regular}"
  axis-label.color: "{sherpa.theme-content-body-1}"
  axis-label.font-size: "{sherpa.font-size-body-base}"
  axis-label.font-weight: "{sherpa.font-weight-regular}"
  axis-label.line-height: "{sherpa.theme-content-line-height-base}"
  axis-label-x.margin-block-start: "{sherpa.display-mode-space-2xs}"
  hotspot.inline-size: "{sherpa.display-mode-size-sm}"
  hotspot.block-size: "{sherpa.display-mode-size-sm}"
$extensions:
  sherpa:
    figmaName: Data Field
    methods:
      - $type: method
        name: setSeriesHidden
        args: "index: number, hidden = true"
        description: Show or hide one series. Hiding re-renders — the axis rescales to what is
    category: chart
    variantAxes:
      - name: Orientation
        values:
          - vertical
          - horizontal
    jsProps:
      - name: hiddenSeries
        type: string
        access: read-write
