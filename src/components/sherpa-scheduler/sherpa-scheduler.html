<!--
  sherpa-scheduler — a recurrence / frequency picker.

  A frequency select drives which sub-field rows are shown; CSS owns that
  conditional visibility off data-frequency. The frequency select and the
  numeric fields are composed sherpa components; date/time/weekday inputs are
  native.

  Public API:
    data-frequency  once | hourly | daily | weekly | monthly (default weekly)
    value           property: SchedulePayload (getter/setter)

  Fires: schedule-change — detail: { value }
-->
<template id="default">
  <div class="fields" part="fields">
    <div class="row row-frequency">
      <sherpa-input-select class="freq-select" data-label="Frequency"></sherpa-input-select>
    </div>

    <!-- Once: date + time -->
    <div class="row row-once">
      <label class="native-field">
        <span class="native-label">Date</span>
        <input class="native-control date-once" type="date" />
      </label>
      <label class="native-field">
        <span class="native-label">Time</span>
        <input class="native-control time-once" type="time" />
      </label>
    </div>

    <!-- Hourly: every N hours -->
    <div class="row row-hourly">
      <sherpa-input-number
        class="hourly-interval"
        data-label="Every (hours)"
        data-min="1"
        value="1"
      ></sherpa-input-number>
    </div>

    <!-- Daily / Weekly / Monthly: time-of-day -->
    <div class="row row-time">
      <label class="native-field">
        <span class="native-label">At</span>
        <input class="native-control time-of-day" type="time" />
      </label>
    </div>

    <!-- Weekly: weekday toggles (Quartz convention Su=1 … Sa=7) -->
    <div class="row row-weekly">
      <fieldset class="weekdays" part="weekdays">
        <legend class="native-label">Days of week</legend>
        <label class="weekday"><input class="weekday-input" type="checkbox" value="1" /><span>Su</span></label>
        <label class="weekday"><input class="weekday-input" type="checkbox" value="2" /><span>Mo</span></label>
        <label class="weekday"><input class="weekday-input" type="checkbox" value="3" /><span>Tu</span></label>
        <label class="weekday"><input class="weekday-input" type="checkbox" value="4" /><span>We</span></label>
        <label class="weekday"><input class="weekday-input" type="checkbox" value="5" /><span>Th</span></label>
        <label class="weekday"><input class="weekday-input" type="checkbox" value="6" /><span>Fr</span></label>
        <label class="weekday"><input class="weekday-input" type="checkbox" value="7" /><span>Sa</span></label>
      </fieldset>
    </div>

    <!-- Monthly: day-of-month -->
    <div class="row row-monthly">
      <sherpa-input-number
        class="monthly-day"
        data-label="Day of month"
        data-min="1"
        data-max="31"
        value="1"
      ></sherpa-input-number>
    </div>
  </div>
</template>
