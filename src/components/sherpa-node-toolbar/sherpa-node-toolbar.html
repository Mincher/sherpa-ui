<!--
  sherpa-node-toolbar — a graph editor's tools, one object of icon buttons: Save, Undo and
  Redo, then the Zip tie tool, Save as Custom Node, Arrange nodes, Unfurl graph, Fetch, Play, Pause, Stop and Frame nodes, then the view's Collapse all and Hide unconnected. It floats in a canvas's `toolbar` slot, in the look of the canvas's own controls.
  Will, TODOs 560, 569, 836. TRAP T-an-edit-is-a-step

  Public API:
    data-can-save   Save can be pressed (default off: Save is a placeholder until a host wants it)
    data-can-undo   Undo can be pressed; written by the editor that owns the history
    data-can-redo   Redo can be pressed
    data-can-tie    The Zip tie tool can be pressed; written by the editor
    data-can-group  Save as Custom Node can be pressed: two or more nodes are picked; written by the editor
    data-can-arrange  Arrange nodes can be pressed: two or more nodes are picked; written by the editor
    data-can-unfurl  Unfurl graph can be pressed: the graph has two or more nodes and can be changed; written by the editor
    data-can-fetch  Fetch can be pressed: a path joins a Source to an Output; written by the editor
    data-can-play   Play can be pressed: the same; written by the editor
    data-cached     Rows are cached: Fetch reads Refetch; written by the editor
    data-fetching   A fetch is queued or running: its button shows it is busy, a second press is blocked; written by the editor
    data-simulating A simulation is queued or running: Play waits, Pause and Stop can be pressed; written by the editor
    data-paused     A simulation is paused at its node: Play goes on, Pause is off; written by the editor
    data-route-why   Why Fetch and Play cannot be pressed, in words: their tip says it; written by the editor
    data-can-frame  Frame nodes can be pressed: two or more nodes are picked; written by the editor
    data-tie        The Zip tie tool is on; written by the editor, shown as pressed
    data-picked-connections  How many connectors are picked; written by the editor, said in the Tie tool's tip
    data-can-collapse   Collapse all can be pressed: the graph has a node; written by the editor
    data-collapsed      Every node is collapsed: Collapse all shows as pressed, and expands them; written by the editor
    data-can-hide       Hide unconnected can be pressed: a node is collapsed; written by the editor
    data-hide-unconnected  Collapsed nodes hide the sockets no connection joins: shown as pressed; written by the editor
    data-can-lanes      Swimlanes can be pressed: the workflow takes them; written by the editor
    data-can-zoom-picked  Zoom to selection can be pressed: a node is picked; written by the editor
    data-can-zoom-fit   Zoom to fit can be pressed: the graph has a node; written by the editor
    data-lanes          The workflow has swimlanes: shown as pressed; written by the editor

  Slots:
    (none)

  Fires:
    toolbar-select — a tool was pressed. detail: { action: 'save' | 'undo' | 'redo' | 'tie' | 'group' | 'arrange' | 'unfurl' | 'fetch' | 'play' | 'pause' | 'stop' | 'frame' | 'collapse' | 'hide' | 'lanes' }
-->
<template id="default">
  <!-- Four sections, each a button group, with a small divider between them: the data (Fetch, then Play, Pause, Stop), the history (Undo, Redo, Save),
       the graph's shape (Zip tie, Save as Custom Node, Arrange, Unfurl, Frame), and the view (Collapse all, Hide unconnected, Swimlanes, Zoom to selection, Zoom to fit). -->
  <span class="tools" part="tools" role="toolbar" aria-label="Editor">
    <sherpa-group class="section" part="section">
      <sherpa-button class="fetch" data-type="icon" data-icon-start="cloud" data-action="fetch"
                     aria-label="Fetch data" data-tip="Fetch data" disabled></sherpa-button>
      <sherpa-button class="play" data-type="icon" data-icon-start="play" data-action="play"
                     aria-label="Simulate" data-tip="Simulate" disabled></sherpa-button>
      <sherpa-button class="pause" data-type="icon" data-icon-start="pause" data-action="pause"
                     aria-label="Pause simulation" data-tip="Pause simulation" disabled></sherpa-button>
      <sherpa-button class="stop" data-type="icon" data-icon-start="stop" data-action="stop"
                     aria-label="Stop simulation" data-tip="Stop simulation" disabled></sherpa-button>
    </sherpa-group>
    <span class="divider" part="divider" role="separator" aria-orientation="vertical"></span>
    <sherpa-group class="section" part="section">
      <sherpa-button class="undo" data-type="icon" data-icon-start="arrow-rotate-left" data-action="undo"
                     aria-label="Undo" data-tip="Undo (Ctrl+Z)" disabled></sherpa-button>
      <sherpa-button class="redo" data-type="icon" data-icon-start="arrow-rotate-right" data-action="redo"
                     aria-label="Redo" data-tip="Redo (Shift+Ctrl+Z)" disabled></sherpa-button>
      <sherpa-button class="save" data-type="icon" data-icon-start="floppy-disk" data-action="save"
                     aria-label="Save" data-tip="Save" disabled></sherpa-button>
    </sherpa-group>
    <span class="divider" part="divider" role="separator" aria-orientation="vertical"></span>
    <sherpa-group class="section" part="section">
      <sherpa-button class="tie" data-type="icon" data-icon-start="zip-tie" data-action="tie"
                     aria-label="Zip tie" data-tip="Zip tie (T)" aria-pressed="false" disabled></sherpa-button>
      <sherpa-button class="group" data-type="icon" data-icon-start="group" data-action="group"
                     aria-label="Save as Custom Node" data-tip="Save as Custom Node (Ctrl+G)" disabled></sherpa-button>
      <sherpa-button class="arrange" data-type="icon" data-icon-start="arrange" data-action="arrange"
                     aria-label="Arrange nodes" data-tip="Arrange nodes" disabled></sherpa-button>
      <sherpa-button class="unfurl" data-type="icon" data-icon-start="unfurl" data-action="unfurl"
                     aria-label="Unfurl graph" data-tip="Unfurl graph" disabled></sherpa-button>
      <sherpa-button class="frame" data-type="icon" data-icon-start="frame" data-action="frame"
                     aria-label="Frame nodes" data-tip="Frame nodes (Shift+S)" disabled></sherpa-button>
    </sherpa-group>
    <span class="divider" part="divider" role="separator" aria-orientation="vertical"></span>
    <sherpa-group class="section" part="section">
      <sherpa-button class="collapse" data-type="icon" data-icon-start="density-compact" data-action="collapse"
                     aria-label="Collapse all nodes" data-tip="Collapse all nodes" aria-pressed="false" disabled></sherpa-button>
      <sherpa-button class="hide" data-type="icon" data-icon-start="hide" data-action="hide"
                     aria-label="Hide unconnected sockets" data-tip="Hide unconnected sockets" aria-pressed="false" disabled></sherpa-button>
      <sherpa-button class="lanes" data-type="icon" data-icon-start="list" data-action="lanes"
                     aria-label="Swimlanes" data-tip="Swimlanes" aria-pressed="false" disabled></sherpa-button>
      <sherpa-button class="zoom-picked" data-type="icon" data-icon-start="magnifying-glass" data-action="zoom-picked"
                     aria-label="Zoom to selection" data-tip="Zoom to selection (F)" disabled></sherpa-button>
      <sherpa-button class="zoom-fit" data-type="icon" data-icon-start="fullscreen" data-action="zoom-fit"
                     aria-label="Zoom to fit" data-tip="Zoom to fit (F)" disabled></sherpa-button>
    </sherpa-group>
  </span>
</template>
