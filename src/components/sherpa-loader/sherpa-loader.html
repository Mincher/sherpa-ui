<!--
  sherpa-loader — an animated loading indicator. CSS-only off data-* on the host.

  Public API:
    data-size         sm | md | lg   (spinner diameter; default md)
    data-orientation  horizontal (default) | vertical
    data-panel        render a solid surface background behind the loader (boolean)

  Slots:
    label — loading text shown beside (or below) the spinner

  Fires: nothing.
-->
<template id="default">
  <div class="spinner" aria-hidden="true"></div>
  <slot name="label" class="label"></slot>
</template>
