# sherpa-loader — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-loader.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-loader
$description: an animated loading indicator.
element:
  $type: element
  tag: div
  attributes:
    aria-hidden: "true"
  provides: []
templates:
  - default
anatomy:
  root:
    el: div
    class: spinner
    attrs:
      aria-hidden: "true"
props:
  - $type: prop
    name: data-orientation
    type: enum
    kind: style
    values:
      - horizontal
      - vertical
    description: horizontal  | vertical
  - $type: prop
    name: data-panel
    type: boolean
    kind: style
    default: false
    description: render a solid surface background behind the loader
  - $type: prop
    name: data-size
    type: enum
    kind: style
    values:
      - sm
      - md
      - lg
    default: md
    description: sm | md | lg   (spinner diameter; default md)
states:
  - $type: state
    name: panel
    selector: ":host([data-panel])"
  - $type: state
    name: vertical
    selector: ":host([data-orientation=\"vertical\"])"
  - $type: state
    name: sm
    selector: ":host([data-size=\"sm\"])"
  - $type: state
    name: lg
    selector: ":host([data-size=\"lg\"])"
tokens:
  label.line-height: "{sherpa.theme-content-line-height-base}"
  spinner.border-radius: "{sherpa.display-mode-border-rounding-full}"
  spinner.border-width: "{sherpa.theme-surface-default-2}"
$extensions:
  sherpa:
    figmaName: Loading Spinner (atom)
    category: control
    variantAxes:
      - name: Size
        values:
          - lg
          - md
          - sm
    booleanProps:
      - hasLabel
