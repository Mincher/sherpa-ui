<!--
  sherpa-metric-group — one row of 1 to 4 metrics, across every column of the layout grid.

  Public API:
    data-sticky   it sticks to the top of its scroll box while its grid shows; stuck, its metrics join

  Slots:
    (default) — 1 to 4 sherpa-metric

  Fires: nothing.
-->
<template id="default">
  <slot data-accepts="item"></slot>
</template>
