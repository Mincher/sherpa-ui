<!--
  sherpa-breadcrumbs — a navigation trail.

  A chevron separator before every crumb after the first; CSS hides the first.

  Public API: (content-driven — no host data-* required)

  Fires: breadcrumb-select — detail: { index, label, href }
-->
<template id="default">
  <nav class="trail" part="trail" aria-label="Breadcrumb">
    <ol class="crumbs" part="crumbs" role="list"></ol>
  </nav>

  <!-- no id: the base parser must not treat this prototype as a template -->
  <template class="crumb-tpl">
    <li class="crumb" role="listitem" data-index="data-index">
      <i class="separator sherpa-icon-box" aria-hidden="true"></i>
      <a class="link" part="link" data-text="label"></a>
    </li>
  </template>
</template>
