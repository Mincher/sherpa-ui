$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-breadcrumbs
$description: a navigation trail.
element:
  $type: element
  tag: nav
  attributes:
    aria-label: Breadcrumb
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: nav
      class: trail
      part: trail
      attrs:
        aria-label: Breadcrumb
      children:
        - el: ol
          class: crumbs
          part: crumbs
          attrs:
            role: list
    - el: template
      class: crumb-tpl
      children:
        - el: li
          class: crumb
          attrs:
            role: listitem
            data-index: data-index
          children:
            - el: a
              class: link
              part: link
              attrs:
                data-text: label
states:
  - $type: state
    name: focus-visible
    selector: .link:focus-visible
events:
  - $type: event
    name: breadcrumb-select
    bubbles: true
    composed: true
    detail:
      href: string
      index: unknown
      label: unknown
    trigger:
      "on": click
      node: .crumbs
tokens:
  crumbs.gap: "{sherpa.display-mode-space-xs}"
  crumb.gap: "{sherpa.display-mode-space-xs}"
  link.color: "{sherpa.theme-content-link-1}"
  link.font-weight: "{sherpa.font-weight-regular}"
  link.line-height: "{sherpa.theme-content-line-height-small}"
  link.border-radius: "{sherpa.display-mode-border-rounding-sm}"
$extensions:
