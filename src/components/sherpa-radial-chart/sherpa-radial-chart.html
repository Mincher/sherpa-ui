<!--
  sherpa-radial-chart — a donut / pie / arc for part-to-whole data.

  Public API:
    data-type   donut (default) | pie   (pie fills to the centre, no hole)
    data-label     centre big text
    data-sublabel  centre small text
    data-inner     hole size, a FRACTION of the outer radius (0–1). A pie
                   ignores it — a pie has no hole by definition.
    data-sweep-start  where the arc begins, clockwise degrees from 12 o'clock
    data-sweep     how far it runs, in degrees. 360 (default) is a full ring;
                   a gauge is this ring stopped short — start 270, sweep 180.

  Slots: legend — an optional legend beside the ring.

  Fires: slice-click — a slice is clicked. detail: { index, label, value }
-->
<template id="default">
  <figure class="layout" part="layout">
    <div class="ring-wrap">
      <svg class="ring" part="ring" viewBox="0 0 100 100" role="img"
           aria-label="Donut chart" preserveAspectRatio="xMidYMid meet">
        <g class="slices"></g>
      </svg>
      <!-- An SVG element cannot be a CSS anchor in Chromium: anchor-name is
           accepted, silently never resolves, and the tip lands in the viewport
           corner. Hence these HTML anchor points. -->
      <div class="hotspots" part="hotspots"></div>

      <div class="centre">
        <span class="value" part="value"></span>
        <span class="sub" part="sub"></span>
      </div>
    </div>
    <slot name="legend"></slot>
  </figure>

  <!--
    WRAPPED IN AN <svg> on purpose: without it the parser builds an
    HTMLUnknownElement that clones, appends and reports its attributes without
    error, and paints nothing.
  -->
  <template class="slice-tpl">
    <svg><path class="slice" /></svg>
  </template>

  <!--
    Per slice: a zero-size anchor point plus its tooltip. JS sets --_angle; CSS
    trig places the point on the ring. The tip is a SIBLING, never a descendant
    of a positioned box — an absolutely-placed ancestor breaks anchor
    positioning for a fixed tip.
  -->
  <template class="hotspot-tpl">
    <span class="hotspot chart-anchor-point"></span>
    <span class="chart-tip" role="tooltip">
      <span class="chart-tip-label"></span>
      <span class="chart-tip-value"></span>
    </span>
  </template>
</template>
