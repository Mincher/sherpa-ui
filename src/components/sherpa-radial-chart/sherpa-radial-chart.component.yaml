# sherpa-radial-chart — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-radial-chart.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-radial-chart
$description: a donut / pie / arc for part-to-whole data.
element:
  $type: element
  tag: figure
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: figure
      class: layout
      part: layout
      children:
        - el: div
          class: ring-wrap
          children:
            - el: svg
              class: ring
              part: ring
              attrs:
                viewBox: 0 0 100 100
                role: img
                aria-label: Donut chart
                preserveAspectRatio: xMidYMid meet
              children:
                - el: g
                  class: slices
            - el: div
              class: hotspots
              part: hotspots
            - el: div
              class: centre
              children:
                - el: span
                  class: value
                  part: value
                - el: span
                  class: sub
                  part: sub
        - slot: legend
    - el: template
      class: slice-tpl
      children:
        - el: svg
          children:
            - el: path
              class: slice
props:
  - $type: prop
    name: data-aggregate
    type: enum
    observed: false
    kind: style
    values:
      - count
      - sum
      - mean
      - min
      - max
      - distinct
    description: count  | sum | mean | min | max | distinct, per value
  - $type: prop
    name: data-field
    type: string
    observed: false
    kind: style
    description: the number that aggregate reads
  - $type: prop
    name: data-inner
    type: string
    observed: true
    kind: style
    description: >-
      hole size, a FRACTION of the outer radius (0–1). A pie ignores it — a pie has no hole by
      definition.
  - $type: prop
    name: data-label
    type: string
    observed: true
    kind: style
    description: centre big text
  - $type: prop
    name: data-segment-field
    type: string
    observed: false
    kind: style
    description: "ASKED of its provider: one slice per value of this field"
  - $type: prop
    name: data-sublabel
    type: string
    observed: true
    kind: style
    description: centre small text
  - $type: prop
    name: data-sweep
    type: string
    observed: true
    kind: style
    description: >-
      how far it runs, in degrees. 360  is a full ring; a gauge is this ring stopped short — start
      270, sweep 180.
  - $type: prop
    name: data-sweep-start
    type: string
    observed: true
    kind: style
    description: where the arc begins, clockwise degrees from 12 o'clock
  - $type: prop
    name: data-type
    type: enum
    observed: true
    kind: style
    values:
      - donut
      - pie
    description: donut  | pie   (pie fills to the centre, no hole)
states:
  - $type: state
    name: pie
    selector: ":host([data-type=\"pie\"])"
  - $type: state
    name: not-has-legend
    selector: ":host(:not([data-has-legend]))"
  - $type: state
    name: focus-visible
    selector: .slice:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (slices). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: slice-click
    bubbles: true
    composed: true
    detail:
      index: unknown
      label: unknown
      value: unknown
tokens:
  layout.gap: "{sherpa.display-mode-space-lg}"
  slice.fill: "{sherpa.data-viz-series-1}"
  slice.stroke: "{sherpa.data-viz-series-1}"
  value.font-size: "{sherpa.theme-content-size-h1}"
  value.font-weight: "{sherpa.font-weight-regular}"
  value.line-height: "{sherpa.theme-content-line-height-h1}"
  value.letter-spacing: "{sherpa.theme-content-letter-spacing-h1}"
  value.color: "{sherpa.theme-content-body-base}"
  sub.font-size: "{sherpa.font-size-body-xs}"
  sub.line-height: "{sherpa.theme-content-line-height-xs}"
  sub.color: "{sherpa.theme-content-body-1}"
$extensions:
  sherpa:
    figmaName: Donut Chart
    category: chart
    jsProps:
      - name: slices
        type: string
        access: read
