# sherpa-layout-grid — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-layout-grid.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-layout-grid
$description: the layout grid a view places its content on.
templates:
  - default
anatomy:
  root:
    slot: ""
props:
  - $type: prop
    name: data-col-count
    type: string
    observed: false
    kind: style
    description: override the breakpoint's column count (1|2|3|4|5|6|8|10|12)
  - $type: prop
    name: data-grow
    type: string
    observed: false
    kind: style
    description: "on a CHILD: the item that takes the remaining height"
  - $type: prop
    name: data-row-count
    type: string
    observed: false
    kind: style
    description: set an explicit row count (1|2|3|4|5|6|8|10|12)
  - $type: prop
    name: data-rows
    type: string
    observed: false
    kind: style
    description: >-
      fit — rows hug their content and one child takes the rest | fixed — every row is one grid row
      tall
$extensions:
  sherpa:
    figmaName: Layout Grid
    category: layout
    divergence:
      note: >-
        2026-09-23: reintroduced, named `sherpa-layout-grid` rather than `sherpa-grid` so it cannot
        be read as a data grid. A `sherpa-layout-grid` component was removed 2026-08-14 for having
        no Figma counterpart; the `.sherpa-grid` CSS utility stayed and is projected from Figma's
        `layout` variable collection (columns, gaps, padding, row height, breakpoints). This element
        does NOT re-declare those tracks — the host wears the `.sherpa-grid` class so a
        re-projection reaches it unchanged, and its children stay in the light DOM so every
        `.sherpa-grid > [data-col-span]` rule still matches. What the element adds is `--_fit-rows`
        for `data-rows="fit"`, which CSS cannot compute and an app previously had to wire by hand
        with `bindFitGrid`. A `sherpa-layout-canvas` is planned alongside it. NEEDS CONFIRMING:
        whether a Layout Grid COMPONENT exists in Figma, or whether this is chrome like App Shell.
        `figmaName` is provisional until then.
