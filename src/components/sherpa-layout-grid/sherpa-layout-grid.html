<!--
  sherpa-layout-grid — the layout grid a view places its content on.

  The TRACKS are the projected Figma layout tokens, which live in tokens.css as
  `.sherpa-grid` — the host wears that class rather than copying the rules, so a
  re-projection reaches the component with no code change.
  TRAP T-a-document-class-cannot-reach-a-shadow-root

  Children stay in the LIGHT DOM, so every `.sherpa-grid > [data-col-span]` rule
  applies to them unchanged. A `<div class="sherpa-grid">` still works; this
  element adds the one thing markup cannot do — the fit row count.

  Public API:
    data-col-count   override the breakpoint's column count (1|2|3|4|5|6|8|10|12)
    data-row-count   set an explicit row count (1|2|3|4|5|6|8|10|12)
    data-rows        fit — rows hug their content and one child takes the rest
                   | fixed — every row is one grid row tall
    data-grow        on a CHILD: the item that takes the remaining height
-->
<template id="default">
  <!-- The base class writes `data-has-content-slot` here. Nothing reads it on a
       layout element: a grid with no children is still a grid. -->
  <slot></slot>
</template>
