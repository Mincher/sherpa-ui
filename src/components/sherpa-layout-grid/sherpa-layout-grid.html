<!--
  sherpa-layout-grid — the layout grid a view places its content on.

  The TRACKS are the projected Figma layout tokens, which live in tokens.css as
  `.sherpa-grid` — the host wears that class rather than copying the rules, so a
  re-projection reaches the component with no code change.
  TRAP T-a-document-class-cannot-reach-a-shadow-root

  Children stay in the LIGHT DOM, so every `.sherpa-grid > [data-col-span]` rule
  applies to them unchanged. A `<div class="sherpa-grid">` still works; this
  element adds the one thing markup cannot do — each child's grouped position.

  Public API:
    data-col-count   override the breakpoint's column count (1|2|3|4|5|6|8|10|12)
    data-row-count   set an explicit row count (1–12); a fit grid needs it
    data-rows        fit — every row one grid row tall, and the LAST row takes the rest
                   | fixed — every row is one grid row tall
    data-resizable   draw a handle in each gutter, to resize the children by
                   dragging or by the keys. TRAP T-a-gutter-moves-a-line
    data-grow        on a CHILD: the item that takes the remaining height
    data-min-row-span  on a CHILD: 1–12, the fewest rows a drag may leave it;
                   a child without one is not row-resizable
    data-col-span-8 / data-col-span-12  on a CHILD: a dragged width, counted, read
                   only at that column count; only the grid (or a host putting
                   a layout back) writes it
    data-row-span-8 / data-row-span-12  on a CHILD: the same, for its rows.
                   TRAP T-a-dragged-layout-is-kept-per-column-count

  Fires:
    layout-change — a child was resized from a gutter, dragged or by the keys. detail: { layout }
-->
<template id="default">
  <!-- The base class writes `data-has-content-slot` here. Nothing reads it on a
       layout element: a grid with no children is still a grid. -->
  <!-- The gutter handles: positioned, so never a grid item. BEFORE the slot, so
       they come first in tab order, as one group, not after every card. -->
  <div class="handles" part="handles"></div>
  <slot></slot>
  <!-- A SIBLING of .handles: a re-stamp empties that container. -->
  <template class="handle-tpl">
    <div class="handle" part="handle" role="separator" tabindex="0"
      data-attr-aria-orientation="orientation" data-attr-aria-label="label" data-attr-data-key="key"></div>
  </template>
</template>
