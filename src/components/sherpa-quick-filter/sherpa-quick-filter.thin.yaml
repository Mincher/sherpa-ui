name: sherpa-quick-filter
figmaName: Quick Filter Chip
category: control
description: a toggleable filter chip for toolbars.
props:
  data-label:
    kind: content
  data-count:
    kind: visibility
slots:
  '':
    accepts: []
    description: ''
events:
  quick-filter-click:
    $verbatim:
      trigger:
        'on': click
        node: .chip
parts:
  - chip
  - count
  - caret
tokens:
  chip:core-space-2xs: core-space-2xs
  chip:core-space-3xs: core-space-3xs
  chip:core-space-sm: core-space-sm
  chip:core-size-xl: core-size-xl
  chip:control-border-width: control-border-width
  chip:border-interactive-inactive: border-interactive-inactive
  chip:core-border-rounding-full: core-border-rounding-full
  chip:surface-primary-base: surface-primary-base
  chip:content-tertiary-base: content-tertiary-base
  chip:core-fonts-scale-base: core-fonts-scale-base
  chip:core-fonts-weight-500: core-fonts-weight-500
  chip:core-fonts-weight-600: core-fonts-weight-600
  count:core-size-sm: core-size-sm
  count:core-space-3xs: core-space-3xs
  count:control-border-width: control-border-width
  count:badge-border-default: badge-border-default
  count:core-border-rounding-full: core-border-rounding-full
  count:badge-surface-default: badge-surface-default
  count:badge-content-default: badge-content-default
  count:core-fonts-scale-sm: core-fonts-scale-sm
  count:core-fonts-weight-600: core-fonts-weight-600
  chip:content-inactive-base: content-inactive-base
  chip:surface-interactive-inactive: surface-interactive-inactive
figmaVerbatim:
  _status: matched
  figmaName: Quick Filter Chip
  nodeType: COMPONENT_SET
  built: true
  variantAxes:
    - name: State
      values:
        - default
  booleanProps:
    - hasBadge
    - hasContent
    - hasIcon
    - hasMenu
  textProps:
    - label
  instanceProps: []
  modePins: {}
  figmaEvents:
    - quick-filter-click
    - quick-filter-menu-open
    - quick-filter-dismiss
    - quick-filter-ai-accept
