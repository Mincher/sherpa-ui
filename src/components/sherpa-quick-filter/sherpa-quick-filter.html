<!--
  sherpa-quick-filter — a filter chip used in toolbars. Figma "Filter Chip (atom)"
  (154:3904), State axis simple | menu.

  The menu is a real <sherpa-menu> slotted into [slot=menu], using the native
  popover API. Placement is measured off the caret: a CSS anchor name cannot
  cross the shadow boundary between them.

      <sherpa-quick-filter data-label="Region" data-menu>
        <sherpa-menu slot="menu" data-heading="Region" data-select="multiple">
          <label><input type="checkbox" value="emea" /> EMEA</label>
          <label><input type="checkbox" value="apac" /> APAC</label>
        </sherpa-menu>
      </sherpa-quick-filter>

  Public API:
    data-type       default | ai | populated | jump
                    `jump` is a JUMP TO chip, not a filter: never on. Its menu
                    lists places on the page, filled by populate([{ value, label }]);
                    a pick scrolls the element whose id is `value` into view.
    data-current    selected/on state (boolean)
    data-label      chip text (or use the default slot). Rewritten to
                    "Field: Value" while exactly ONE menu value is picked;
                    two or more revert to the field name plus the count badge.
    data-icon-start leading icon — an icon name (Figma default is a funnel)
    data-indicator  show the leading status dot (Figma "Indicator (atom)", opt-in)
    data-count      leading count chip (shown when present). A menu sets it
                    only at TWO or more picked values — at one the label already
                    names the value, so a "1" badge would be noise.
                    Hovering the badge reveals .count-tip ABOVE it, listing the
                    chosen values. The bubble is a local copy of the
                    sherpa-tooltip look rather than a nested instance: the badge
                    lives in this shadow root, so a light-DOM wrapper component
                    cannot reach it. Reveal is pure CSS on .count-wrap:hover.
    data-conditioned written BY the chip when its menu is answering with
                    CONDITIONS rather than ticks. Reads as `info`, not the
                    plain on-tint. TRAP T-a-conditioned-chip-reads-as-info
    data-panelled   a FILTER PANEL is drawing this field instead, so the bar
                    hides the chip — two controls over one field make a reader
                    guess which is in force. Written by the host.
                    TRAP T-the-view-chip-stays-on-the-header
    data-menu       Figma State=menu — snap on the caret button
    data-icon-only  the chip reduced to JUST its menu button — a 24 square with
                    a funnel. Body, count, indicator and value label are all
                    hidden in CSS. For a filter affordance whose field is named
                    elsewhere (a data-grid column header).
    data-persistent a SELECTOR rather than a toggle: always on, and never
                    "empty". Set by sherpa-quick-filter-toolbar from a filter
                    definition's `persistent` flag. The view chip is the case —
                    you are always in SOME view, so the amber "on but filtering
                    by nothing" state is one it cannot be in.
    data-kind       WHAT THIS CHIP IS: group | sort. Both ARRANGE rows rather
                    than choosing them, so they have no values to be empty of,
                    and both own their gesture — group toggles, sort cycles
                    asc / desc / off — and report it themselves. "Organise" is
                    not a kind; it is a heading a panel may draw above the two.
                    TRAP T-a-chip-knows-what-kind-it-is
    data-column     which column a group or sort chip arranges by, for a host
                    that draws the choice without a menu. A menu, where there is
                    one, is the answer.
    data-direction  asc | desc — which way a sort chip POINTS. `data-current`
                    says whether it runs, so a suspended sort resumes the way it
                    was. TRAP T-off-is-not-forgotten

  Slots:
    (default)  the chip label
    menu       a <sherpa-menu> of values for this field

  Fires:
    quick-filter-click  — the chip body is toggled. detail: { active }
    quick-filter-change — the menu selection changed. detail: { values: string[] }
    jump-select — a jump row was picked, and its target scrolled into view. detail: { value, label }
-->
<template id="default">
  <div class="chip" part="chip">
    <!-- Sibling of the buttons, not a wrapper: wrapping would break every
         :host(…) .body rule. data-anchor points it at the whole chip;
         data-floating puts it in the top layer, since the toolbar's chip run
         clips and an absolutely-positioned bubble was cut off. -->
    <sherpa-tooltip class="count-wrap" data-floating data-anchor=".chip"></sherpa-tooltip>
    <button class="body sherpa-border-corners" part="body" type="button">
      <span class="indicator" part="indicator" aria-hidden="true"></span>
      <!-- role=img so the aria-label is announced: no role = no accessible name. -->
      <span class="count" part="count" role="img"></span>
      <span class="icon sherpa-icon-box" part="icon" aria-hidden="true"></span>
      <span class="label" part="label"><slot></slot></span>
    </button>

    <button class="caret" part="caret" type="button" aria-haspopup="menu" aria-expanded="false"
            aria-label="Choose values">
      <!-- The SELECTED value, not the field. Empty when nothing is picked. -->
      <span class="caret-label sherpa-truncate" part="caret-label"></span>
      <!-- Class hook: an icon-only chip overrides the glyph in CSS
           (:host([data-icon-only]) .caret-glyph::before), not in JS. -->
      <i class="caret-glyph sherpa-icon-box" data-icon="triangle-down" aria-hidden="true"></i>
      <!-- An icon-only chip shows a funnel instead; CSS picks, JS never swaps. -->
      <i class="caret-funnel sherpa-icon-box" data-icon="filter" aria-hidden="true"></i>
      <!-- An icon-only chip with data-icon-start shows that glyph here instead.
           JS writes the FA class (#syncText); CSS picks which <i> is visible. -->
      <span class="caret-icon sherpa-icon-box" part="caret-icon" aria-hidden="true"></span>
    </button>

    <span class="menu-slot"><slot name="menu"></slot></span>

    <!-- A jump row, cloned into the slotted menu. No `slot`: rows go in the
         menu's DEFAULT slot, and a row carrying one is never projected. -->
    <template class="jump-item-tpl"><button class="jump-item" type="button"></button></template>
  </div>
</template>
