# sherpa-quick-filter — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-quick-filter.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-quick-filter
$description: a filter chip used in toolbars. Figma "Filter Chip (atom)" (154:3904), State axis simple | menu.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  root:
    el: div
    class: chip
    part: chip
    children:
      - el: sherpa-tooltip
        class: count-wrap
        attrs:
          data-floating: ""
          data-anchor: .chip
      - el: button
        class: body sherpa-border-corners
        part: body
        attrs:
          type: button
        children:
          - el: span
            class: indicator
            part: indicator
            attrs:
              aria-hidden: "true"
          - el: span
            class: count
            part: count
            attrs:
              role: img
          - el: span
            class: swatch
            part: swatch
            attrs:
              aria-hidden: "true"
          - el: span
            class: icon sherpa-icon-box
            part: icon
            attrs:
              aria-hidden: "true"
          - el: span
            class: label
            part: label
            slot: ""
      - el: button
        class: caret
        part: caret
        attrs:
          type: button
          aria-haspopup: dialog
          aria-expanded: "false"
          aria-label: Choose values
        children:
          - el: span
            class: caret-label sherpa-truncate
            part: caret-label
          - el: i
            class: caret-glyph sherpa-icon-box
            attrs:
              data-icon: triangle-down
              aria-hidden: "true"
          - el: i
            class: caret-funnel sherpa-icon-box
            attrs:
              data-icon: filter
              aria-hidden: "true"
          - el: span
            class: caret-icon sherpa-icon-box
            part: caret-icon
            attrs:
              aria-hidden: "true"
      - el: span
        class: menu-slot
        slot: menu
      - el: template
        class: jump-item-tpl
        children:
          - el: button
            class: jump-item
            attrs:
              type: button
props:
  - $type: prop
    name: aria-label
    type: string
    observed: true
    description: the name of a chip that shows no label. Its tooltip says it. TRAP T-a-chip-says-its-own-answer
  - $type: prop
    name: asc
    type: string
    observed: false
    description: >-
      and report it themselves. "Organise" is not a kind; it is a heading a panel may draw above the
      two. TRAP T-a-chip-knows-what-kind-it-is
  - $type: prop
    name: data-column
    type: string
    observed: false
    kind: style
    description: >-
      which column a group or sort chip arranges by, for a host that draws the choice without a
      menu. A menu, where there is one, is the answer.
  - $type: prop
    name: data-condition
    type: string
    observed: false
    kind: style
    description: >-
      written BY the chip: simple | advanced — which condition it holds, absent when it holds none.
      No colour follows it: an Advanced chip is active, as a Simple one. TRAP
      T-a-conditioned-chip-reads-as-active
  - $type: prop
    name: data-count
    type: string
    observed: false
    kind: content
    description: >-
      leading count chip (shown when present). A menu sets it only at TWO or more picked values — at
      one the label already names the value, so a "1" badge would be noise. Hovering the badge
      reveals .count-tip ABOVE it, listing the chosen values. The bubble is a local copy of the
      sherpa-tooltip look rather than a nested instance: the badge lives in this shadow root, so a
      light-DOM wrapper component cannot reach it. Reveal is pure CSS on .count-wrap:hover.
  - $type: prop
    name: data-current
    type: boolean
    observed: true
    kind: style
    default: false
    description: selected/on state
  - $type: prop
    name: data-direction
    type: enum
    observed: false
    kind: style
    values:
      - asc
      - desc
    description: >-
      asc | desc — which way a sort chip POINTS. `data-current` says whether it runs, so a suspended
      sort resumes the way it was. TRAP T-off-is-not-forgotten
  - $type: prop
    name: data-edited
    type: string
    observed: false
    kind: style
    description: >-
      a saved filter changed and not saved: the pending look, still counted. TRAP
      T-a-saved-filter-keeps-its-edit
  - $type: prop
    name: data-icon
    type: string
    observed: false
    kind: style
    description: start leading icon — an FA class list (Figma default is a funnel)
  - $type: prop
    name: data-icon-only
    type: string
    observed: false
    kind: style
    description: >-
      the chip reduced to JUST its menu button — a 24 square with a funnel. Body, count, indicator
      and value label are all hidden in CSS. For a filter affordance whose field is named elsewhere
      (a data-grid column header).
  - $type: prop
    name: data-icon-start
    type: string
    observed: true
    kind: style
    description: leading icon — an icon name (Figma default is a funnel)
  - $type: prop
    name: data-indicator
    type: string
    observed: false
    kind: style
    description: show the leading status dot (Figma "Indicator (atom)", opt-in)
  - $type: prop
    name: data-kind
    type: string
    observed: false
    kind: style
    description: >-
      WHAT THIS CHIP IS: group | sort | advanced. Group and sort ARRANGE rows rather than choosing
      them, so they have no values to be empty of, and both own their gesture — group toggles, sort
      cycles asc / desc / off — and report it themselves. "Organise" is not a kind; it is a heading
      a panel may draw above the two. TRAP T-a-chip-knows-what-kind-it-is `advanced` with no filter
      menu is a SAVED filter: its answer is given, so the chip is a toggle that reads as Advanced.
      TRAP T-a-saved-filter-is-its-readings
  - $type: prop
    name: data-label
    type: string
    observed: true
    kind: style
    description: >-
      chip text (or use the default slot). Rewritten to "Field: Value" while exactly ONE menu value
      is picked; two or more revert to the field name plus the count badge.
  - $type: prop
    name: data-menu
    type: string
    observed: false
    kind: style
    default: false
    description: Figma State=menu — snap on the caret button
  - $type: prop
    name: data-panelled
    type: string
    observed: false
    kind: style
    description: >-
      a FILTER PANEL is drawing this field instead, so the bar hides the chip — two controls over
      one field make a reader guess which is in force. Written by the host. TRAP
      T-the-view-chip-stays-on-the-header
  - $type: prop
    name: data-pending
    type: string
    observed: false
    kind: style
    description: >-
      changed, not yet applied: the active edge, no fill. Written by the bar. TRAP
      T-a-pending-chip-has-no-fill
  - $type: prop
    name: data-persistent
    type: string
    observed: false
    kind: style
    description: >-
      a SELECTOR rather than a toggle: always on, and never "empty". Set by
      sherpa-quick-filter-toolbar from a filter definition's `persistent` flag. The view chip is the
      case — you are always in SOME view, so the amber "on but filtering by nothing" state is one it
      cannot be in.
  - $type: prop
    name: data-swatch
    type: string
    observed: false
    kind: style
    description: >-
      a data-viz series, from 1: the chip leads with that series' swatch, as a chart's legend does —
      one value of a chart's own filter. TRAP T-a-chart-scope-is-its-legend-field
  - $type: prop
    name: data-type
    type: enum
    observed: false
    kind: style
    values:
      - default
      - ai
      - populated
      - jump
    default: false
    description: >-
      default | ai | populated | jump `jump` is a JUMP TO chip, not a filter: never on. Its menu
      lists places on the page, filled by populate([{ value, label }]); a pick scrolls the element
      whose id is `value` into view.
  - $type: prop
    name: desc
    type: string
    observed: false
    description: >-
      and report it themselves. "Organise" is not a kind; it is a heading a panel may draw above the
      two. TRAP T-a-chip-knows-what-kind-it-is
states:
  - $type: state
    name: menu
    selector: ":host([data-menu])"
  - $type: state
    name: open
    selector: ":host([data-open])"
  - $type: state
    name: current
    selector: ":host([data-current])"
  - $type: state
    name: pending
    selector: ":host([data-pending])"
  - $type: state
    name: edited
    selector: ":host([data-edited])"
  - $type: state
    name: ai
    selector: ":host([data-type=\"ai\"])"
  - $type: state
    name: indicator
    selector: ":host([data-indicator])"
  - $type: state
    name: count
    selector: ":host([data-count])"
  - $type: state
    name: swatch
    selector: ":host([data-swatch])"
  - $type: state
    name: icon-start
    selector: ":host([data-icon-start])"
  - $type: state
    name: full-value
    selector: ":host([data-full-value])"
  - $type: state
    name: no-value
    selector: ":host([data-no-value])"
  - $type: state
    name: icon-only
    selector: ":host([data-icon-only])"
  - $type: state
    name: unsupported
    selector: ":host([data-unsupported])"
  - $type: state
    name: superseded
    selector: ":host([data-superseded])"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
  - $type: state
    name: focus-visible
    selector: .body:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: >-
      read/write JS properties (current, valueLabel, menu, values, reading, answered, column,
      direction, results). See $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: >-
      callable from a view definition's state block (clear, arrangeBy, toggleMenu, refresh). See
      $extensions.sherpa.methods.
events:
  - $type: event
    name: quick-filter-click
    bubbles: true
    composed: true
    detail:
      active: unknown
    trigger:
      "on": click
      node: .chip
  - $type: event
    name: quick-filter-change
    bubbles: true
    composed: true
    detail:
      scope: string
      values: unknown
  - $type: event
    name: jump-select
    bubbles: true
    composed: true
    detail:
      label: unknown
      value: unknown
  - $type: event
    name: group-change
    bubbles: true
    composed: true
    detail:
      field: unknown
  - $type: event
    name: sort-change
    bubbles: true
    composed: true
    detail:
      direction: string
      field: boolean
tokens:
  chip.block-size: "{sherpa.display-mode-size-lg}"
  body.gap: "{sherpa.display-mode-space-2xs}"
  body.padding-inline: "{sherpa.display-mode-space-2xs}"
  body.font-size: "{sherpa.font-size-body-base}"
  body.font-weight: "{sherpa.font-weight-regular}"
  body.line-height: "{sherpa.theme-content-line-height-base}"
  count.font-weight: "{sherpa.font-weight-semibold}"
  caret.min-inline-size: "{sherpa.display-mode-size-lg}"
  caret.gap: "{sherpa.display-mode-space-2xs}"
  caret.border-start-end-radius: "{sherpa.border-rounding-top-right}"
  caret.border-end-end-radius: "{sherpa.border-rounding-bottom-right}"
  caret.--_icon-size: "{sherpa.theme-content-size-base}"
  caret-label.font-size: "{sherpa.theme-content-size-base}"
  caret-label.line-height: "{sherpa.theme-content-line-height-base}"
$extensions:
  sherpa:
    figmaName: Filter Chip (atom)
    methods:
      - $type: method
        name: clear
        args: "op: FilterOp = DEFAULT_OP"
        description: >-
          clear(op) — EMPTY the chip, whatever answers it, and switch it off: a list's ticks, typing
          and rows, a number's two shapes, a date's days. SILENT. `op` is the condition a list goes
          back to.
      - $type: method
        name: arrangeBy
        args: "field: string, direction?: string | null"
        description: >-
          arrangeBy(field, direction) — steer a GROUP or SORT chip: its column, and for a sort which
          way. SILENT, like every steer. No field is OFF, and the chip keeps the column it had; a
          sort with `''` for its direction is suspended, and resumes ascending. The CHIP's own, so a
          bar and a panel follow the same attributes the same way.
      - $type: method
        name: toggleMenu
        args: "anchor?: HTMLElement"
        description: >-
          Open or shut this chip's menu — what a HOST calls to drive the chip from outside. It
          routes through the same light-dismiss-safe path a caret click takes, so an external opener
          cannot get the stuck-open behaviour back.
      - $type: method
        name: refresh
        args: ""
        description: >-
          refresh() — redraw the FACE (value, tip, badge, condition) off the menu, once its rows
          have filled. For a host that set the rows SILENTLY: a steer fires no menu event, so the
          chip never heard it and kept a stale face. Never on or off — that stays the host's.
    category: control
    variantAxes:
      - name: State
        values:
          - default
    booleanProps:
      - hasMenu
      - hasIcon
      - hasIndicator
      - hasLabel
    jsProps:
      - name: current
        type: string
        access: read-write
      - name: valueLabel
        type: string
        access: read-write
      - name: menu
        type: string
        access: read
      - name: values
        type: string
        access: read-write
      - name: reading
        type: string
        access: read-write
      - name: answered
        type: string
        access: read
      - name: column
        type: string
        access: read
      - name: direction
        type: string
        access: read
      - name: results
        type: string
        access: read-write
