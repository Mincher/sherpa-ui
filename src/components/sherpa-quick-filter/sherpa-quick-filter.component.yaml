# sherpa-quick-filter — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-quick-filter.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-quick-filter
$description: a toggleable filter chip for toolbars.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  root:
    el: div
    class: chip
    part: chip
    children:
      - el: button
        class: body
        part: body
        attrs:
          type: button
        children:
          - el: span
            class: indicator
            part: indicator
            attrs:
              aria-hidden: "true"
          - el: span
            class: count
            part: count
            attrs:
              aria-hidden: "true"
          - el: span
            class: icon
            part: icon
            attrs:
              aria-hidden: "true"
          - el: span
            class: label
            part: label
            slot: ""
      - el: button
        class: caret
        part: caret
        attrs:
          type: button
          aria-haspopup: menu
          aria-expanded: "false"
          aria-label: Choose values
        children:
          - el: i
            class: fa-solid fa-caret-down
            attrs:
              aria-hidden: "true"
      - el: span
        class: menu-slot
        slot: menu
props:
  - $type: prop
    name: data-count
    type: string
    kind: visibility
    description: leading count chip (shown when present)
  - $type: prop
    name: data-current
    type: boolean
    kind: style
    default: false
    description: selected/on state
  - $type: prop
    name: data-icon
    type: string
    kind: style
    description: start leading icon — an FA class list (Figma default is a funnel)
  - $type: prop
    name: data-icon-start
    type: string
    kind: content
    description: leading icon — an FA class list (Figma default is a funnel)
  - $type: prop
    name: data-indicator
    type: string
    kind: style
    description: show the leading status dot (Figma "Indicator (atom)", opt-in)
  - $type: prop
    name: data-label
    type: string
    kind: content
    description: chip text (or use the default slot)
  - $type: prop
    name: data-menu
    type: string
    kind: style
    default: false
    description: Figma State=menu — snap on the caret button
  - $type: prop
    name: data-type
    type: enum
    kind: style
    values:
      - default
      - ai
      - populated
    default: false
    description: default | ai | populated
states:
  - $type: state
    name: menu
    selector: ":host([data-menu])"
  - $type: state
    name: ai
    selector: ":host([data-type=\"ai\"])"
  - $type: state
    name: current
    selector: ":host([data-current])"
  - $type: state
    name: indicator
    selector: ":host([data-indicator])"
  - $type: state
    name: count
    selector: ":host([data-count])"
  - $type: state
    name: icon-start
    selector: ":host([data-icon-start])"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
  - $type: state
    name: focus-visible
    selector: .body:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (current, menu). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: quick-filter-click
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .chip
  - $type: event
    name: quick-filter-change
    bubbles: true
    composed: true
tokens:
  chip.block-size: "{sherpa.display-mode-size-lg}"
  body.gap: "{sherpa.display-mode-space-2xs}"
  body.padding-inline: "{sherpa.display-mode-space-2xs}"
  body.border-width: "{sherpa.display-mode-border-width-sm}"
  body.border-color: "{sherpa.style-border-base}"
  body.border-radius: "{sherpa.structure-rounding-top-left}"
  body.background: "{sherpa.style-surface-base}"
  body.color: "{sherpa.theme-content-body-1}"
  body.font-size: "{sherpa.font-size-body-base}"
  body.font-weight: "{sherpa.font-weight-regular}"
  body.line-height: "{sherpa.theme-content-line-height-base}"
  caret.inline-size: "{sherpa.display-mode-size-lg}"
  caret.border-width: "{sherpa.display-mode-border-width-sm}"
  caret.border-color: "{sherpa.style-border-base}"
  caret.border-start-end-radius: "{sherpa.structure-rounding-top-right}"
  caret.border-end-end-radius: "{sherpa.structure-rounding-bottom-right}"
  caret.background: "{sherpa.style-surface-base}"
  caret.color: "{sherpa.theme-content-body-1}"
  caret.font-size: "{sherpa.theme-content-size-small}"
$extensions:
  sherpa:
    figmaName: Filter Chip (atom)
    category: control
    variantAxes:
      - name: State
        values:
          - default
    booleanProps:
      - hasMenu
      - hasIcon
      - hasIndicator
      - hasLabel
    jsProps:
      - name: current
        type: string
        access: read-write
      - name: menu
        type: string
        access: read
