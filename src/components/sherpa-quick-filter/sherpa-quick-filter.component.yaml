# sherpa-quick-filter — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-quick-filter.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-quick-filter
$description: a toggleable filter chip for toolbars.
element:
  $type: element
  tag: button
  attributes:
    type: button
  provides:
    - click
    - keyboard
    - focus
    - disabled
templates:
  - default
anatomy:
  root:
    el: button
    class: chip
    part: chip
    attrs:
      type: button
    children:
      - el: span
        class: label
        slot: ""
      - el: span
        class: count
        part: count
        attrs:
          aria-hidden: "true"
      - el: span
        class: caret
        part: caret
        attrs:
          aria-hidden: "true"
props:
  - $type: prop
    name: data-count
    type: string
    kind: visibility
    description: badge number (shown when present)
  - $type: prop
    name: data-current
    type: boolean
    kind: style
    default: false
    description: selected/on state
  - $type: prop
    name: data-label
    type: string
    kind: content
    description: chip text (or use the default slot)
  - $type: prop
    name: data-menu
    type: boolean
    kind: style
    default: false
    description: show a dropdown-trigger caret
  - $type: prop
    name: data-type
    type: boolean
    kind: style
    default: false
    description: default | ai | populated data-current selected/on state
states:
  - $type: state
    name: ai
    selector: ":host([data-type=\"ai\"])"
  - $type: state
    name: current
    selector: ":host([data-current])"
  - $type: state
    name: count
    selector: ":host([data-count])"
  - $type: state
    name: menu
    selector: ":host([data-menu])"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
  - $type: state
    name: focus-visible
    selector: .chip:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (current). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: quick-filter-click
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .chip
tokens:
  chip.gap: "{sherpa.display-space-2xs}"
  chip.padding: "{sherpa.display-space-3xs}"
  chip.min-block-size: "{sherpa.display-size-xl}"
  chip.border-width: "{sherpa.style-border-width}"
  chip.border-color: "{sherpa.style-border-base}"
  chip.border-radius: "{sherpa.display-border-rounding-full}"
  chip.background: "{sherpa.style-surface-base}"
  chip.color: "{sherpa.theme-content-body-2}"
  chip.font-size: "{sherpa.font-size-body-base}"
  chip.font-weight: "{sherpa.font-weight-medium}"
$extensions:
  sherpa:
    figmaName: Filter Chip (atom)
    category: control
    variantAxes:
      - name: State
        values:
          - default
    booleanProps:
      - hasMenu
      - hasIcon
      - hasIndicator
      - hasLabel
    jsProps:
      - name: current
        type: string
        access: read-write
