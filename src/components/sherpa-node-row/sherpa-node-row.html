<!--
  sherpa-node-row — one row of a sherpa-node: an input socket, a field and an
  output socket. Any of the three may be absent. Will, TODO 78.

  Public API:
    data-label          the row's name, when it has no field: a field names itself
    data-input-socket   an input socket on the start edge: value | object | boolean | any: an input is a D, its type in its ink
    data-output-socket  an output socket on the end edge: value (a circle) | object (a diamond) | boolean (a triangle)
    data-input-routed   a route joins the input: its socket is filled, else hollow
    data-output-routed  a route leaves the output: its socket is filled, else hollow
    data-input-many     the input takes several routes: its socket is a double height D

  Slots:
    (default)   the field: a sherpa-input-text — a text field, a select or a number

  Fires: nothing by itself. Its field fires its own events.
-->
<template id="default">
  <div class="row" part="row">
    <span class="label" part="label" data-text="data-label"></span>
    <slot data-accepts="input"></slot>
    <span class="socket socket-in sherpa-anchor" part="socket-in" aria-hidden="true"></span>
    <span class="tip tip-in sherpa-tip" popover="manual" part="tip" aria-hidden="true"><span class="name">Input:</span><span class="word w-value">a value</span><span class="word w-object">an object</span><span class="word w-boolean">a boolean</span><span class="word w-any">any type</span></span>
    <span class="socket socket-out sherpa-anchor" part="socket-out" aria-hidden="true"></span>
    <span class="tip tip-out sherpa-tip" popover="manual" part="tip" aria-hidden="true"><span class="name">Output:</span><span class="word w-value">a value</span><span class="word w-object">an object</span><span class="word w-boolean">a boolean</span></span>
  </div>
</template>
