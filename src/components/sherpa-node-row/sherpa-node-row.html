<!--
  sherpa-node-row — one row of a sherpa-node: an input socket, a field and an
  output socket. Any of the three may be absent. Will, TODO 78.

  Public API:
    data-label          the row's name, when it has no field: a field names itself
    data-input-socket   an input socket on the start edge: value (a circle) | object (a diamond)
    data-output-socket  an output socket on the end edge: value (a circle) | object (a diamond)

  Slots:
    (default)   the field: a sherpa-input-text — a text field, a select or a number

  Fires: nothing by itself. Its field fires its own events.
-->
<template id="default">
  <div class="row" part="row">
    <span class="label" part="label" data-text="data-label"></span>
    <slot data-accepts="input"></slot>
    <span class="socket socket-in" part="socket-in" aria-hidden="true"></span>
    <span class="socket socket-out" part="socket-out" aria-hidden="true"></span>
  </div>
</template>
