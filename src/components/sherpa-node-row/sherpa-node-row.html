<!--
  sherpa-node-row — one row of a sherpa-node: the node's three columns, an input
  socket's cell, its content (a label or a field) and an output socket's cell.
  Any of the three may be empty. Each socket stands in its SOCKET TAB, outside the card.
  Will, TODOs 78, 887.

  Public API:
    data-label          the row's name, when it has no field: a field names itself
    data-caption        what a run says of the row, at the end of its label's line ("43 rows"). Its host writes it
    data-input-socket   an input socket on the start edge: value | object | boolean | any: an input is a D, its type in its ink
    data-output-socket  an output socket on the end edge: value (a circle) | object (a diamond) | boolean (a circle)
    data-input-connected   a connection joins the input: its socket is filled, else hollow
    data-output-connected  a connection leaves the output: its socket is filled, else hollow
    data-input-many     the input takes several connections: its socket is a double height D
    data-property       a property: its label reads in the input value's own type
    data-idle           a property with nothing to say (no rows reach its node): hidden, unless a connection leaves it
    data-socket-name    the row's name, the first line of each socket's tip: a collapsed node shows no label
    data-socket-value   the row's value in words, a line of each socket's tip; unset, the line hides
    data-collapsed      its node is collapsed: its sockets stand in the node's stacks. Its host writes it
    data-input-at, data-output-at  its sockets' places in the node's stacks, from 0, collapsed. Its host writes them
    data-input-at-connected, data-output-at-connected  the same, among the connected only; unset, the socket is not connected

  Slots:
    (default)   the field: a sherpa-input-text — a text field, a select or a number

  Fires: nothing by itself. Its field fires its own events.
-->
<template id="default">
  <div class="row" part="row">
    <div class="content" part="content">
      <span class="head" part="head"><span class="label" part="label" data-text="data-label"></span><span class="caption" part="caption" data-text="data-caption"></span></span>
      <slot data-accepts="input"></slot>
    </div>
    <span class="socket-tab socket-tab-in sherpa-anchor" part="socket-tab-in" aria-hidden="true"><span class="socket socket-in" part="socket-in"><i class="core"></i></span></span>
    <span class="tip tip-in sherpa-tip" popover="manual" part="tip" aria-hidden="true"><span class="tip-line tip-socket" data-text="data-socket-name"></span><span class="tip-line tip-value"><span class="name">Value:</span> <span data-text="data-socket-value"></span></span><span class="tip-line"><span class="name">Input:</span> <span class="word w-value">a value</span><span class="word w-object">an object</span><span class="word w-boolean">a boolean</span><span class="word w-any">any type</span></span></span>
    <span class="socket-tab socket-tab-out sherpa-anchor" part="socket-tab-out" aria-hidden="true"><span class="socket socket-out" part="socket-out"><i class="core"></i></span></span>
    <span class="tip tip-out sherpa-tip" popover="manual" part="tip" aria-hidden="true"><span class="tip-line tip-socket" data-text="data-socket-name"></span><span class="tip-line tip-value"><span class="name">Value:</span> <span data-text="data-socket-value"></span></span><span class="tip-line"><span class="name">Output:</span> <span class="word w-value">a value</span><span class="word w-object">an object</span><span class="word w-boolean">a boolean</span></span></span>
  </div>
</template>
