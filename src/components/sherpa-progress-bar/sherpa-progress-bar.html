<!--
  sherpa-progress-bar — horizontal task-progress indicator, built on native <progress>.
  Fill/track are styled via the vendor pseudo-elements (::-webkit-progress-bar
  / -value, ::-moz-progress-bar); indeterminate = value removed, not set to 0.

  Public API:
    value               0–100 completion (native <progress value>); read/write
    data-indeterminate  animated sweep for unknown-duration work (boolean;
                        renders a native indeterminate <progress> — no value)
    data-label          accessible task label (shown above the bar; drives aria-label)
    data-status         critical | warning | success | info  (colours the fill)

  Slots: none — display-only. Fires: nothing.
-->
<template id="default">
  <span class="label" part="label"></span>
  <progress class="bar" part="bar" max="100" value="0"></progress>
</template>
