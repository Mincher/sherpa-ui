# sherpa-progress-bar — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-progress-bar.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-progress-bar
$description: a horizontal progress indicator for a single ongoing task.
element:
  $type: element
  tag: span
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: span
      class: label
      part: label
    - el: progress
      class: bar
      part: bar
      attrs:
        max: "100"
        value: "0"
props:
  - $type: prop
    name: data-indeterminate
    type: string
    kind: content
    default: false
    description: >-
      animated sweep for unknown-duration work (boolean; renders a native indeterminate <progress> —
      no value)
  - $type: prop
    name: data-label
    type: string
    kind: visibility
    description: accessible task label (shown above the bar; drives aria-label)
  - $type: prop
    name: data-status
    type: enum
    kind: style
    values:
      - critical
      - warning
      - success
      - info
    description: critical | warning | success | info  (colours the fill)
  - $type: prop
    name: data-value
    type: string
    kind: content
    description: 0–100 completion percentage (determinate)
  - $type: prop
    name: value
    type: string
    native: true
    description: 0–100 completion (native <progress value>); read/write
states:
  - $type: state
    name: label
    selector: ":host([data-label])"
  - $type: state
    name: indeterminate
    selector: ":host([data-indeterminate])"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (value). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: nothing
    bubbles: true
    composed: true
tokens:
  label.font-size: "{sherpa.font-size-body-base}"
  label.color: "{sherpa.theme-content-body-base}"
  bar.block-size: "{sherpa.display-space-2xs}"
  bar.border-radius: "{sherpa.display-border-rounding-full}"
$extensions:
  sherpa:
    figmaName: Progress Bar (atom)
    category: control
    jsProps:
      - name: value
        type: number
        description: the current percentage (read/write, clamped 0–100)
        access: read-write
