# sherpa-progress-bar — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-progress-bar.{thin.yaml,html,css,ts}. The MECHANICAL surface only —
# props (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# Validated by schemas/component.v1.json; round-trips via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-progress-bar
$description: a horizontal progress indicator for a single ongoing task.
element:
  $type: element
  tag: span
  provides: []
templates:
  - default
anatomy:
  root:
    el: span
    class: label
    part: label
props:
  - $type: prop
    name: data-indeterminate
    type: boolean
    kind: content
    default: false
    description: animated sweep for unknown-duration work
  - $type: prop
    name: data-label
    type: string
    kind: visibility
    description: accessible task label (shown above the bar; drives aria-label)
  - $type: prop
    name: data-status
    type: enum
    kind: style
    values:
      - critical
      - warning
      - success
      - info
    description: critical | warning | success | info  (colours the fill)
  - $type: prop
    name: data-value
    type: string
    kind: content
    description: 0–100 completion percentage (determinate)
states:
  - $type: state
    name: label
    selector: ":host([data-label])"
  - $type: state
    name: indeterminate
    selector: ":host([data-indeterminate])"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (value). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: nothing
    bubbles: true
    composed: true
tokens:
  label.font-size: "{sherpa.font-size-body-base}"
  label.color: "{sherpa.theme-content-body-base}"
  track.block-size: "{sherpa.display-space-2xs}"
  track.background: "{sherpa.theme-surface-default-1}"
  track.border-radius: "{sherpa.display-border-rounding-full}"
$extensions:
  sherpa:
    figmaName: Progress Bar (atom)
    category: control
    jsProps:
      - name: value
        type: number
        description: the current percentage (read/write, clamped 0–100)
        access: read-write
