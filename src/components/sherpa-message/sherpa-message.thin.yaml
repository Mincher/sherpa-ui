name: sherpa-message
figmaName: Message
category: container
description: a lightweight inline status strip.
props:
  data-label:
    kind: content
slots:
  '':
    accepts: []
    description: ''
events:
  message-dismiss:
    $verbatim:
      trigger:
        'on': click
        node: .close
parts:
  - icon
  - text
  - label
  - close
tokens:
  icon:size-icon-2xs: size-icon-2xs
  icon:status-surface-strong:
    override: status-surface-strong
  icon:status-info-color-5: status-info-color-5
  icon:content-title-on-color: content-title-on-color
  icon:core-fonts-weight-700: core-fonts-weight-700
  close:core-size-md: core-size-md
  close:core-space-2xs: core-space-2xs
  close:core-border-rounding-sm: core-border-rounding-sm
  close:status-text:
    override: status-text
  close:content-title-base: content-title-base
figmaVerbatim:
  _status: matched
  figmaName: Message
  nodeType: COMPONENT
  built: true
  variantAxes: []
  booleanProps:
    - hasClose
  textProps:
    - label
  instanceProps: []
  modePins:
    Status:
      mode: info
  figmaEvents:
    - close
    - action
