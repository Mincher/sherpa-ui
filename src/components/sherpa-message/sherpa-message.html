<!--
  sherpa-message — a lightweight inline status strip.

  A single-row status box: a leading status icon chip, the message text (slotted
  or from data-label), and an optional dismiss button. The status (info | success
  | warning | critical) is chosen by data-status; the whole strip fills with the
  status surface (via the [data-status] cascade) with a status border, status
  text, and a matching glyph in CSS. Lighter than sherpa-callout — one row, no
  stacked title.

  Public API:
    data-status       info (default) | success | warning | critical
    data-label        message text (rendered into .label; a slotted body wins)
    data-dismissible  show the close button (fires message-dismiss)

  Slots:
    (default) — the message body (reflects data-has-content; replaces data-label)

  Fires: message-dismiss
-->
<template id="default">
  <span class="icon" part="icon" aria-hidden="true"></span>
  <span class="text" part="text">
    <span class="label" part="label"></span>
    <slot></slot>
  </span>
  <button class="close" part="close" type="button" aria-label="Dismiss">
    <span aria-hidden="true">&#215;</span>
  </button>
</template>
