# sherpa-chat-message — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-chat-message.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-chat-message
$description: a single chat bubble for AI / messaging threads.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  root:
    el: div
    class: message
    part: message
    children:
      - el: span
        class: avatar
        part: avatar
        attrs:
          aria-hidden: "true"
        children:
          - slot: avatar
      - el: div
        class: stack
        children:
          - el: div
            class: meta
            part: meta
            children:
              - el: span
                class: author
                part: author
              - el: span
                class: time
                part: time
          - el: div
            class: bubble
            part: bubble
            children:
              - el: span
                class: content
              - slot: ""
props:
  - $type: prop
    name: data-author
    type: string
    kind: visibility
    description: optional author name shown above the bubble
  - $type: prop
    name: data-content
    type: string
    kind: content
    description: optional text body (the default slot overrides it when slotted)
  - $type: prop
    name: data-role
    type: enum
    kind: style
    values:
      - assistant
      - user
      - system
    description: assistant  | user (right, accent) | system (centred, muted)
  - $type: prop
    name: data-time
    type: string
    kind: visibility
    description: optional timestamp shown beside the author
states:
  - $type: state
    name: author
    selector: ":host([data-author])"
  - $type: state
    name: time
    selector: ":host([data-time])"
  - $type: state
    name: has-content
    selector: ":host([data-has-content])"
  - $type: state
    name: assistant
    selector: ":host([data-role=\"assistant\"])"
  - $type: state
    name: user
    selector: ":host([data-role=\"user\"])"
  - $type: state
    name: system
    selector: ":host([data-role=\"system\"])"
  - $type: state
    name: not-author
    selector: ":host(:not([data-author]))"
  - $type: state
    name: not-time
    selector: ":host(:not([data-time]))"
events:
  - $type: event
    name: nothing
    bubbles: true
    composed: true
tokens:
  message.grid-template-columns: "{sherpa.display-size-lg}"
  message.gap: "{sherpa.display-space-xs}"
  stack.gap: "{sherpa.display-space-2xs}"
  avatar.width: "{sherpa.display-size-lg}"
  avatar.height: "{sherpa.display-size-lg}"
  avatar.border-radius: "{sherpa.display-border-rounding-full}"
  avatar.color: "{sherpa.theme-content-body-base-fixed}"
  avatar.font-size: "{sherpa.font-size-body-small}"
  avatar.font-weight: "{sherpa.font-weight-semibold}"
  avatar-glyph.width: "{sherpa.theme-size-icon-2xs}"
  avatar-glyph.height: "{sherpa.theme-size-icon-2xs}"
  avatar-glyph.border-radius: "{sherpa.display-border-rounding-full}"
  meta.gap: "{sherpa.display-space-2xs}"
  meta.font-size: "{sherpa.font-size-body-small}"
  meta.color: "{sherpa.theme-content-body-1}"
  author.font-weight: "{sherpa.font-weight-medium}"
  time.color: "{sherpa.theme-content-body-1}"
  bubble.padding: "{sherpa.display-space-2xs}"
$extensions:
  sherpa:
    figmaName: Chat Message
    category: content
    variantAxes:
      - name: Type
        values:
          - received
          - sent
    booleanProps:
      - hasAvatar
