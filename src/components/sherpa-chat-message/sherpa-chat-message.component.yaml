# sherpa-chat-message — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-chat-message.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-chat-message
$description: a single chat bubble for AI / messaging threads.
element:
  $type: element
  tag: article
  provides: []
templates:
  - default
anatomy:
  root:
    el: article
    class: message
    part: message
    children:
      - el: span
        class: avatar
        part: avatar
        attrs:
          aria-hidden: "true"
        children:
          - slot: avatar
      - el: div
        class: stack
        children:
          - el: div
            class: bubble
            part: bubble
            children:
              - el: div
                class: meta
                part: meta
                children:
                  - el: span
                    class: author
                    part: author
                  - el: time
                    class: time
                    part: time
              - el: span
                class: content
              - slot: ""
props:
  - $type: prop
    name: data-author
    type: string
    kind: visibility
    description: optional author name shown above the bubble
  - $type: prop
    name: data-content
    type: string
    kind: content
    description: optional text body (the default slot overrides it when slotted)
  - $type: prop
    name: data-message
    type: string
    kind: content
    description: "optional text body (the default slot overrides it when slotted) (alias: data-content)"
  - $type: prop
    name: data-name
    type: string
    kind: content
    description: "optional author name shown above the bubble (alias: data-author)"
  - $type: prop
    name: data-time
    type: string
    kind: visibility
    description: optional timestamp shown beside the author
  - $type: prop
    name: data-timestamp
    type: string
    kind: content
    description: "optional timestamp shown beside the name (alias: data-time)"
  - $type: prop
    name: data-type
    type: enum
    kind: style
    values:
      - assistant
      - user
      - system
    description: assistant  | user (right, accent) | system (centred, muted)
states:
  - $type: state
    name: name
    selector: ":host([data-name])"
  - $type: state
    name: author
    selector: ":host([data-author])"
  - $type: state
    name: timestamp
    selector: ":host([data-timestamp])"
  - $type: state
    name: time
    selector: ":host([data-time])"
  - $type: state
    name: user
    selector: ":host([data-type=\"user\"])"
  - $type: state
    name: has-content
    selector: ":host([data-has-content])"
  - $type: state
    name: assistant
    selector: ":host([data-type=\"assistant\"])"
  - $type: state
    name: system
    selector: ":host([data-type=\"system\"])"
events:
  - $type: event
    name: nothing
    bubbles: true
    composed: true
tokens:
  message.grid-template-columns: "{sherpa.theme-content-size-base}"
  message.gap: "{sherpa.display-mode-space-xs}"
  avatar.inline-size: "{sherpa.theme-content-size-base}"
  avatar.block-size: "{sherpa.theme-content-size-base}"
  avatar.margin-block-start: "{sherpa.display-mode-space-xs}"
  avatar.color: "{sherpa.theme-content-body-1}"
  avatar.font-size: "{sherpa.theme-content-size-base}"
  meta.gap: "{sherpa.display-mode-space-xs}"
  meta.font-size: "{sherpa.font-size-body-small}"
  meta.line-height: "{sherpa.theme-content-line-height-small}"
  meta.color: "{sherpa.theme-content-body-1}"
  author.font-weight: "{sherpa.font-weight-regular}"
  time.font-size: "{sherpa.theme-content-size-xs}"
  time.line-height: "{sherpa.theme-content-line-height-xs}"
  bubble.gap: "{sherpa.display-mode-space-2xs}"
  bubble.padding: "{sherpa.display-mode-space-xs}"
  bubble.border-radius: "{sherpa.border-rounding-top-left}"
  bubble.line-height: "{sherpa.theme-content-line-height-base}"
$extensions:
  sherpa:
    figmaName: Chat Message
    category: content
    variantAxes:
      - name: Type
        values:
          - assistant
          - user
          - system
    booleanProps:
      - hasAvatar
