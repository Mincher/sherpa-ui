<!--
  sherpa-chat-message — a single chat bubble for AI / messaging threads.

  Public API:
    data-type       assistant (default, left, neutral) | user (right, accent) | system (centred, muted)
    data-name       optional author name shown above the bubble (alias: data-author)
    data-timestamp  optional timestamp shown beside the name (alias: data-time)
    data-message    optional text body (the default slot overrides it when slotted) (alias: data-content)

  Slots:
    avatar    — custom avatar content, replaces the default glyph (reflects data-has-avatar)
    (default) — bubble body content, overrides data-content

  Fires: nothing — a passive surface. Consumers wire their own controls.
-->
<template id="default">
  <article class="message" part="message">
    <span class="avatar sherpa-icon-box" part="avatar" aria-hidden="true">
      <slot name="avatar"><span class="avatar-glyph"></span></slot>
    </span>
    <div class="stack">
      <div class="bubble" part="bubble">
        <!-- Meta row is INSIDE the bubble, per Figma. -->
        <div class="meta" part="meta">
          <span class="author" part="author"></span>
          <time class="time" part="time"></time>
        </div>
        <span class="content"></span>
        <slot></slot>
      </div>
    </div>
  </article>
</template>
