<!--
  sherpa-outlet — where the route's Context is drawn. It is the app's main
  landmark, and its light DOM IS the Context: on each route change it loads the
  one app.json names, runs it, and tears the last one down.
  TRAP T-an-outlet-loads-the-context

      <sherpa-outlet id="context-root"></sherpa-outlet>
      outlet.start({ app, base, session, stores: () => ({ … }) });

  Public API: none — the JS API below drives it.

  JS API:
    start(options)      read app.json, load each Context's Views, then the route's Context
    context             the Context on screen
    settingsPage        the Settings page open over it, or null — ?settings=<name>
    viewsOf(context)    a Context's Views: its own, then the reader's saved ones
    firstView(context)  its first View, which the URL leaves out
    viewsReady          settles once every Context's own Views are in

  Slots:
    (default)   the Context's markup, put there by the outlet

  Parts:
    reach       the "Unable to reach data" banner over the top of the content

  Fires:
    context-change — detail: { context, view }
    context-markup — detail: { context, root, waitUntil }
    context-load — detail: { context, view }
    settings-open — detail: { page }
    settings-close — detail: { }
-->
<template id="default">
  <!-- UNABLE TO REACH DATA, floating over the top of the content: no height, so
       it never moves the Context (Will, W1 A). TRAP T-a-reach-banner-takes-no-room -->
  <div class="reach" part="reach">
    <sherpa-callout class="reach-unreached" data-status="warning" role="note" data-heading="Unable to reach data">
      <span>The last data is still shown, and may be out of date. <span class="reach-why"></span></span>
      <span class="reach-actions">
        <sherpa-button class="retry" data-size="sm" data-label="Retry"></sherpa-button>
        <sherpa-button class="dismiss" data-size="sm" data-look="transparent" data-label="Dismiss"></sherpa-button>
      </span>
    </sherpa-callout>
    <sherpa-callout class="reach-down" data-status="critical" role="alert" data-heading="Unable to reach data">
      <span>There is no data to show until it can be reached. <span class="reach-why"></span></span>
      <span class="reach-actions">
        <sherpa-button class="retry" data-size="sm" data-label="Retry"></sherpa-button>
        <sherpa-button class="dismiss" data-size="sm" data-look="transparent" data-label="Dismiss"></sherpa-button>
      </span>
    </sherpa-callout>
  </div>
  <div class="reach-say" role="status"></div>
  <div class="reach-after" tabindex="-1"></div>
  <slot data-accepts="content"></slot>
  <!-- Why it could not be reached, by the failure's kind. TRAP T-a-word-is-in-the-markup -->
  <template class="words">
    <span data-word="unreached">Unable to reach data. The last data is still shown, and may be out of date.</span>
    <span data-word="offline">The network could not be reached.</span>
    <span data-word="timeout">The server took too long to answer.</span>
    <span data-word="server">The server had a problem.</span>
  </template>
</template>
