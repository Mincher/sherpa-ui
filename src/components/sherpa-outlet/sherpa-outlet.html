<!--
  sherpa-outlet — where the route's Context is drawn. It is the app's main
  landmark, and its light DOM IS the Context: on each route change it loads the
  one app.json names, runs it, and tears the last one down.
  TRAP T-an-outlet-loads-the-context

      <sherpa-outlet id="context-root"></sherpa-outlet>
      outlet.start({ app, base, session, stores: () => ({ … }) });

  Public API: none — the JS API below drives it.

  JS API:
    start(options)      read app.json, load each Context's Views, then the route's Context
    context             the Context on screen
    settingsPage        the Settings page open over it, or null — ?settings=<name>
    viewsOf(context)    a Context's Views: its own, then the reader's saved ones
    firstView(context)  its first View, which the URL leaves out
    viewsReady          settles once every Context's own Views are in
    graph               the graph View on screen: { view, type, id, origin }, or null
    openGraph(id)       open an entity in it (none: its type's first); the URL follows
                        on a `query` graph View the graphs are the app's pages' Views,
                        `<page>/<view>`, each page opened on its View for its Query alone;
                        a toolbar's node-editor-open goes there
    savePageView(label?)  on a `query` graph View, save its page's View: over the
                        reader's own, or as a new one named, which it opens; its id
    deletePageView()    on a `query` graph View, delete the reader's own View open,
                        and open the page's first
    act(id, { keys, input })  run an act over the outlet's stores and shelf, as a press does;
                        its answer { done, undo } or { refused }, said by the caller; fires act-run
    actContext()        { stores, entities } an act runs over here, for a flow's steps; null before start
    checkAct(id, { keys, input })  why it would be refused, before the reader is asked: { refused } or {}

  Slots:
    (default)   the Context's markup, put there by the outlet
                its own `slot="context-header"` element goes up into the app
                shell's fixed region, and leaves with the Context

  Parts:
    reach       the "Unable to reach data" banner over the top of the content
    flow        the dialog a pressed act opens to ask its input: a field per step of its flow

  Fires:
    context-change — detail: { context, view }
    context-markup — detail: { context, root, waitUntil }
    context-load — detail: { context, view }
    settings-open — detail: { page }
    settings-close — detail: { }
    graph-change — the graph View's entity moved. detail: { graph, page? }, page on a `query` graph
    graph-new — New graph… was picked, a request: prevented, the app makes it. detail: { type }
    act-run — an act ran (pressed, or through act()), or was refused, or was undone: a page draws its change. detail: { id, keys, done?, refused?, undone? }
    act-input — a pressed act needs input, a request: prevented, the page asks it; else the outlet's dialog does. detail: { id, keys }
-->
<template id="default">
  <!-- UNABLE TO REACH DATA, floating over the top of the content: no height, so
       it never moves the Context (Will, W1 A). TRAP T-a-reach-banner-takes-no-room -->
  <div class="reach" part="reach">
    <sherpa-callout class="reach-unreached" data-type="banner" data-status="warning" role="note" data-heading="Unable to reach data">
      <span>The last data is still shown, and may be out of date. <span class="reach-why"></span></span>
      <span class="reach-actions">
        <sherpa-button class="retry" data-size="sm" data-label="Retry"></sherpa-button>
        <sherpa-button class="dismiss" data-size="sm" data-look="transparent" data-label="Dismiss"></sherpa-button>
      </span>
    </sherpa-callout>
    <sherpa-callout class="reach-down" data-type="banner" data-status="critical" role="alert" data-heading="Unable to reach data">
      <span>There is no data to show until it can be reached. <span class="reach-why"></span></span>
      <span class="reach-actions">
        <sherpa-button class="retry" data-size="sm" data-label="Retry"></sherpa-button>
        <sherpa-button class="dismiss" data-size="sm" data-look="transparent" data-label="Dismiss"></sherpa-button>
      </span>
    </sherpa-callout>
  </div>
  <div class="reach-say" role="status"></div>
  <div class="reach-after" tabindex="-1"></div>
  <slot data-accepts="content"></slot>
  <!-- A pressed act that needs input asks it here: a field per step of its flow, drawn from stepsOf (plan 964 N4). -->
  <sherpa-dialog class="flow" part="flow">
    <p class="flow-about"></p>
    <div class="flow-steps"></div>
    <p class="flow-said"></p>
    <sherpa-callout class="flow-refused" data-status="critical" role="alert"><span class="flow-refused-words"></span></sherpa-callout>
    <div class="flow-actions" slot="footer">
      <sherpa-button class="flow-cancel" data-look="transparent" data-label="Cancel"></sherpa-button>
      <sherpa-button class="flow-run" disabled></sherpa-button>
    </div>
  </sherpa-dialog>
  <!-- One field per kind of step: a pick of one or several is ONE dropdown. TRAP T-a-multi-select-is-one-row -->
  <template class="flow-text"><sherpa-input-text class="flow-step" data-attr-data-field="field" data-attr-data-label="label" data-attr-data-description="description"></sherpa-input-text></template>
  <template class="flow-number"><sherpa-input-text class="flow-step" data-type="number" data-attr-data-field="field" data-attr-data-label="label" data-attr-data-description="description"></sherpa-input-text></template>
  <template class="flow-one"><sherpa-input-text class="flow-step" data-type="select" data-attr-data-field="field" data-attr-data-label="label" data-attr-data-description="description"></sherpa-input-text></template>
  <template class="flow-many"><sherpa-input-text class="flow-step" data-type="select" multiple data-attr-data-field="field" data-attr-data-label="label" data-attr-data-description="description"></sherpa-input-text></template>
  <template class="flow-boolean"><sherpa-switch class="flow-step" data-attr-data-field="field" data-attr-data-label="label" data-attr-data-description="description"></sherpa-switch></template>
  <!-- Why it could not be reached, by the failure's kind. TRAP T-a-word-is-in-the-markup -->
  <template class="words">
    <span data-word="unreached">Unable to reach data. The last data is still shown, and may be out of date.</span>
    <span data-word="offline">The network could not be reached.</span>
    <span data-word="timeout">The server took too long to answer.</span>
    <span data-word="server">The server had a problem.</span>
    <!-- The row it draws for a "views" Context: the View chip, and a graph View's chip. -->
    <span data-word="view">View</span>
    <span data-word="presets">Presets</span>
    <span data-word="mine">My graphs</span>
    <span data-word="read-only">Read only</span>
    <span data-word="new-graph">New graph…</span>
    <span data-word="page">Page</span>
    <!-- A pressed act's toast: its Undo, and what it says once undone. -->
    <span data-word="undo">Undo</span>
    <span data-word="undone">Undone.</span>
    <span data-word="not-started">The app has not started, so it cannot do that yet.</span>
  </template>
</template>
