# sherpa-tabs — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-tabs.{thin.yaml,html,css,ts}. The MECHANICAL surface only —
# props (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# Validated by schemas/component.v1.json; round-trips via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-tabs
$description: a tabbed content switcher.
element:
  $type: element
  tag: div
  attributes:
    role: tablist
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: div
      class: strip
      part: tablist
      attrs:
        role: tablist
      children:
        - el: span
          class: tabs
        - el: span
          class: detail
          part: detail
          slot: detail
    - el: div
      class: panels
      part: panels
      slot: ""
    - el: template
      class: tab-tpl
      children:
        - el: button
          class: tab
          part: tab
          attrs:
            role: tab
            type: button
            tabindex: "-1"
            aria-selected: "false"
          children:
            - el: span
              class: label
props:
  - $type: prop
    name: data-active-id
    type: string
    kind: content
    description: id of the currently active tab / panel
states:
  - $type: state
    name: has-detail
    selector: ":host([data-has-detail])"
  - $type: state
    name: focus-visible
    selector: .tab:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (activeId). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: tab-change
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .tabs
tokens:
  detail.gap: "{sherpa.display-space-sm}"
  detail.padding-inline: "{sherpa.display-space-sm}"
  tab.gap: "{sherpa.display-space-sm}"
  tab.padding: "{sherpa.display-space-sm}"
  tab.font-size: "{sherpa.font-size-body-base}"
  tab.font-weight: "{sherpa.font-weight-semibold}"
  tab.line-height: "{sherpa.display-fonts-scale-xl}"
  tab.color: "{sherpa.theme-content-body-1}"
  panels.padding-block-start: "{sherpa.display-space-base}"
$extensions:
  sherpa:
    figmaName: Tab Group
    category: container
    jsProps:
      - name: activeId
        type: string
        description: currently active tab id (read/write)
        access: read-write
