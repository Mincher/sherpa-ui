# sherpa-tabs — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-tabs.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-tabs
$description: a tabbed content switcher.
element:
  $type: element
  tag: div
  attributes:
    role: tablist
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: div
      class: strip
      part: tablist
      attrs:
        role: tablist
      children:
        - el: span
          class: tabs
        - el: span
          class: detail
          part: detail
          slot: detail
    - el: div
      class: panels
      part: panels
      slot: ""
    - el: template
      class: tab-tpl
      children:
        - el: button
          class: tab
          part: tab
          attrs:
            role: tab
            type: button
            tabindex: "-1"
            aria-selected: "false"
            data-attr-data-id: id
          children:
            - el: span
              class: label
              attrs:
                data-text: label
props:
  - $type: prop
    name: data-current-id
    type: string
    observed: true
    kind: style
    description: — id of the currently active tab / panel
states:
  - $type: state
    name: has-detail
    selector: ":host([data-has-detail])"
  - $type: state
    name: focus-visible
    selector: .tab:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (currentId). See $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: callable from a view definition's state block (select). See $extensions.sherpa.methods.
events:
  - $type: event
    name: tab-change
    bubbles: true
    composed: true
    detail:
      id: unknown
    trigger:
      "on": click
      node: .tabs
tokens:
  strip.border-block-end: "{sherpa.border-bottom}"
  detail.gap: "{sherpa.display-mode-space-sm}"
  detail.padding-inline: "{sherpa.display-mode-space-sm}"
  tab.gap: "{sherpa.display-mode-space-xs}"
  tab.padding: "{sherpa.display-mode-space-sm}"
  tab.border-block-end: "{sherpa.display-mode-border-width-lg}"
  tab.margin-block-end: "{sherpa.display-mode-border-width-sm}"
  tab.font-size: "{sherpa.font-size-body-base}"
  tab.font-weight: "{sherpa.font-weight-regular}"
  tab.line-height: "{sherpa.display-mode-fonts-scale-xl}"
  tab.color: "{sherpa.theme-content-body-1}"
  panels.padding-block-start: "{sherpa.display-mode-space-base}"
$extensions:
  sherpa:
    figmaName: Tab Group
    methods:
      - $type: method
        name: select
        args: "id: string"
        description: Activate a tab by id (no-op if already active or unknown).
    category: container
    jsProps:
      - name: currentId
        type: string
        description: currently active tab id (read/write)
        access: read-write
