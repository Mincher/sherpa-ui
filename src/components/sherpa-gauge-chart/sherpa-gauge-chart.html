<!--
  sherpa-gauge-chart — a half-circle gauge for a single value on a 0–100 scale.
  Each band is a closed SVG path, as sherpa-radial-chart draws a slice, so the
  band itself is the hover target and the hollow centre is not hittable.

  Public API:
    data-value    number on the scale (drives the fill sweep + needle angle)
    data-label    the MIDPOINT tick above the arc. Defaults to the middle of the
                  scale — it is a TICK, like min and max, not the reading. It sits
                  at the top centre of the arc, which is the halfway point; the
                  NEEDLE is what reports the value.
    data-unit     suffix for all three scale ticks, e.g. "%" → 0% / 50% / 100%
    data-zones    threshold bands — "0-50:success,50-80:warning,80-100:critical"
                  (compact) OR a JSON array [{to,color}|{from,to,color}]. Colours
                  are status names (success|warning|urgent|critical|info) or any
                  CSS colour. Omit for the single-colour sweep.
    data-caption  caption text shown below the arc (e.g. "30GB of 60GB used")
    data-status   critical | warning | success | info  (single-colour fill)
    data-min / data-max   scale bounds shown beneath (default 0 / 100)
    data-aggregate  ASKED of its provider: count | sum | mean | min | max | distinct
    data-field      the number that aggregate reads

  Slots:
    title    — heading above the gauge (data-accepts: text, inline)
    legend   — a <sherpa-chart-legend> naming the zones. Horizontal → below the
               gauge; vertical → beside it. (data-accepts: chart-legend)
    caption  — rich caption below the gauge; overrides data-caption
               (data-accepts: text, inline)

  Fires: nothing — display only.
-->
<template id="default">
  <figure class="chart-figure" part="figure">
  <div class="chart-header" part="header">
    <span class="title"><slot name="title"></slot></span>
  </div>

  <!-- Wraps ring + scale + caption as ONE grid item, so a vertical legend can sit
       beside the gauge instead of becoming a fourth row of the host's column. -->
  <div class="chart-body">
  <!-- The value is a ROW above the arc, not a box inside .gauge: positioned over
       the ring it collided with the crown or the needle hub. -->
  <div class="centre">
    <span class="value" part="value"></span>
  </div>
  <!-- Positioning context for the tooltip layer, which is a SIBLING of the ring
       so a tip can escape the ring's box. -->
  <div class="gauge-wrap">
  <div class="gauge" part="gauge" role="img" aria-label="Gauge chart">
    <!--
      viewBox is the TOP HALF of a 100×100 space (SVG y grows downward) with the
      ring centred at (50,50), so nothing needs clipping.

      NO preserveAspectRatio="none" — the box is 2:1 and `none` would stretch the
      ring into an ellipse.
    -->
    <svg class="ring" part="ring" viewBox="0 0 100 50" aria-hidden="true">
      <!-- #renderArcs stamps every segment here, including the grey remainder.
           There is deliberately no separate full-length track. -->
      <g class="zones"></g>
    </svg>
    <div class="hub"><div class="needle" part="needle"></div></div>
    <div class="hub-cap" part="hub"></div>
  </div>

  <!-- Tooltip layer: one zero-size anchor point + one tip per zone. There are no
       visible markers; the reader hovers the band. -->
  <div class="hotspots" part="hotspots"></div>
  </div>
  <!-- ONE ROW: min, caption, max. A caption on its own row pushed the gauge up
       and left dead space beneath it. -->
  <div class="scale" part="scale">
    <span class="min"></span>
    <figcaption class="caption" part="caption"><slot name="caption"></slot></figcaption>
    <span class="max"></span>
  </div>
  </div>

  <!-- The legend belongs to the CHART, not the card around it. Horizontal sits
       below the gauge here; vertical is switched to a two-column grid by CSS. -->
  <slot name="legend"></slot>
  </figure>

  <!--
    One zone's segment. Wrapped in an <svg> so the HTML parser switches to the SVG
    namespace: a bare <path> parses as HTMLUnknownElement and paints nothing.
  -->
  <template class="zone-tpl">
    <svg><path class="zone" /></svg>
  </template>

  <!--
    One zone's anchor point + tooltip. JS sets --_angle, --_hue and the text.
    The anchor is a separate <span> because an SVG element cannot carry a CSS
    anchor-name in Chromium. The tip is its SIBLING — an absolutely-placed
    ancestor breaks anchor positioning for a fixed tip.
  -->
  <template class="hotspot-tpl">
    <span class="hotspot chart-anchor-point"></span>
    <span class="chart-tip" popover="manual" role="tooltip">
      <span class="chart-tip-label"></span>
      <span class="chart-tip-value"></span>
    </span>
  </template>
</template>
