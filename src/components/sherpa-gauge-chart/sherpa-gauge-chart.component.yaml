# sherpa-gauge-chart — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-gauge-chart.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-gauge-chart
$description: >-
  a half-circle gauge for a single value on a 0–100 scale. Each band is a closed SVG path, as
  sherpa-radial-chart draws a slice, so the band itself is the hover target and the hollow centre is
  not hittable.
element:
  $type: element
  tag: figure
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: figure
      class: chart-figure
      part: figure
      children:
        - el: div
          class: chart-header
          part: header
          children:
            - el: span
              class: title
              slot: title
        - el: div
          class: chart-body
          children:
            - el: div
              class: centre
              children:
                - el: span
                  class: value
                  part: value
            - el: div
              class: gauge-wrap
              children:
                - el: div
                  class: gauge
                  part: gauge
                  attrs:
                    role: img
                    aria-label: Gauge chart
                  children:
                    - el: svg
                      class: ring
                      part: ring
                      attrs:
                        viewBox: 0 0 100 50
                        aria-hidden: "true"
                      children:
                        - el: g
                          class: zones
                    - el: div
                      class: hub
                      children:
                        - el: div
                          class: needle
                          part: needle
                    - el: div
                      class: hub-cap
                      part: hub
                - el: div
                  class: hotspots
                  part: hotspots
            - el: div
              class: scale
              part: scale
              children:
                - el: span
                  class: min
                - el: figcaption
                  class: caption
                  part: caption
                  slot: caption
                - el: span
                  class: max
        - slot: legend
    - el: template
      class: zone-tpl
      children:
        - el: svg
          children:
            - el: path
              class: zone
props:
  - $type: prop
    name: data-aggregate
    type: string
    observed: false
    kind: style
    description: "ASKED of its provider: count | sum | mean | min | max | distinct"
  - $type: prop
    name: data-caption
    type: string
    observed: true
    kind: style
    description: caption text shown below the arc (e.g. "30GB of 60GB used")
  - $type: prop
    name: data-field
    type: string
    observed: false
    kind: style
    description: the number that aggregate reads
  - $type: prop
    name: data-label
    type: string
    observed: true
    kind: style
    description: the MIDPOINT tick above the arc. Defaults to the middle of the
  - $type: prop
    name: data-max
    type: string
    observed: true
    kind: style
    default: 0 / 100
    description: scale bounds shown beneath
  - $type: prop
    name: data-min
    type: string
    observed: true
    kind: style
    default: 0 / 100
    description: scale bounds shown beneath
  - $type: prop
    name: data-status
    type: enum
    observed: false
    kind: style
    values:
      - critical
      - warning
      - success
      - info
    description: critical | warning | success | info  (single-colour fill)
  - $type: prop
    name: data-unit
    type: string
    observed: true
    kind: style
    description: suffix for all three scale ticks, e.g. "%" → 0% / 50% / 100%
  - $type: prop
    name: data-value
    type: string
    observed: true
    kind: style
    description: number on the scale (drives the fill sweep + needle angle)
  - $type: prop
    name: data-zones
    type: string
    observed: true
    kind: style
    description: >-
      threshold bands — "0-50:success,50-80:warning,80-100:critical" (compact) OR a JSON array
      [{to,color}|{from,to,color}]. Colours are status names (success|warning|urgent|critical|info)
      or any CSS colour. Omit for the single-colour sweep.
states:
  - $type: state
    name: vertical
    selector: ":host([data-legend=\"vertical\"])"
  - $type: state
    name: caption
    selector: ":host([data-caption])"
  - $type: state
    name: has-caption
    selector: ":host([data-has-caption])"
  - $type: state
    name: focus-visible
    selector: .zone:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (value). See $extensions.sherpa.jsProps.
tokens:
  chart-body.gap: "{sherpa.theme-gap-sm}"
  needle.inline-size: "{sherpa.display-mode-border-width-base}"
  needle.background: "{sherpa.theme-content-body-2}"
  hub-cap.background: "{sherpa.style-content-base}"
  value.font-family: "{sherpa.font-family-mono}"
  value.font-size: "{sherpa.font-size-body-xs}"
  value.font-weight: "{sherpa.font-weight-regular}"
  value.line-height: "{sherpa.theme-content-line-height-xs}"
  value.color: "{sherpa.theme-content-body-1}"
  scale.gap: "{sherpa.theme-gap-sm}"
  scale.font-family: "{sherpa.font-family-mono}"
  scale.font-size: "{sherpa.font-size-body-xs}"
  scale.line-height: "{sherpa.theme-content-line-height-xs}"
  scale.color: "{sherpa.theme-content-body-1}"
  caption.font-size: "{sherpa.font-size-body-small}"
  caption.line-height: "{sherpa.theme-content-line-height-small}"
  caption.color: "{sherpa.theme-content-body-1}"
$extensions:
  sherpa:
    figmaName: Gauge Chart
    category: chart
    jsProps:
      - name: value
        type: string
        access: read-write
