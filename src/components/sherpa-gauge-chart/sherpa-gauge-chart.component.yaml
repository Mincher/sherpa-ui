# sherpa-gauge-chart — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-gauge-chart.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-gauge-chart
$description: a half-circle gauge for a single 0–100 value.
element:
  $type: element
  tag: figure
  provides: []
templates:
  - default
anatomy:
  root:
    el: figure
    class: chart-figure
    part: figure
    children:
      - el: div
        class: chart-header
        part: header
        children:
          - el: span
            class: title
            slot: title
      - el: div
        class: gauge
        part: gauge
        attrs:
          role: img
          aria-label: Gauge chart
        children:
          - el: div
            class: track
            part: track
          - el: div
            class: fill
            part: fill
          - el: div
            class: hub
            children:
              - el: div
                class: needle
                part: needle
          - el: div
            class: hub-cap
            part: hub
          - el: div
            class: centre
            children:
              - el: span
                class: value
                part: value
      - el: div
        class: scale
        part: scale
        children:
          - el: span
            class: min
          - el: span
            class: max
      - el: figcaption
        class: caption
        part: caption
        slot: caption
props:
  - $type: prop
    name: data-caption
    type: string
    kind: content
    description: caption text shown below the arc (e.g. "30GB of 60GB used")
  - $type: prop
    name: data-label
    type: string
    kind: content
    description: centre value label
  - $type: prop
    name: data-max
    type: string
    kind: content
    default: 0 / 100
    description: scale bounds shown beneath
  - $type: prop
    name: data-min
    type: string
    kind: content
    default: 0 / 100
    description: scale bounds shown beneath
  - $type: prop
    name: data-status
    type: enum
    kind: style
    values:
      - critical
      - warning
      - success
      - info
    description: critical | warning | success | info  (single-colour fill)
  - $type: prop
    name: data-value
    type: string
    kind: content
    description: number on the scale (drives the fill sweep + needle angle)
  - $type: prop
    name: data-zones
    type: string
    kind: content
    description: >-
      threshold bands — "0-50:success,50-80:warning,80-100:critical" (compact) OR a JSON array
      [{to,color}|{from,to,color}]. Colours are status names (success|warning|urgent|critical|info)
      or any CSS colour. Omit for the single-colour sweep.
states:
  - $type: state
    name: zones
    selector: ":host([data-zones])"
  - $type: state
    name: caption
    selector: ":host([data-caption])"
  - $type: state
    name: has-caption
    selector: ":host([data-has-caption])"
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (value). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: nothing
    bubbles: true
    composed: true
tokens:
  title.font-size: "{sherpa.font-size-body-base}"
  title.font-weight: "{sherpa.font-weight-semibold}"
  title.color: "{sherpa.theme-content-body-base}"
  track.background: "{sherpa.style-border-base}"
  needle.background: "{sherpa.theme-content-body-base}"
  hub-cap.background: "{sherpa.theme-content-body-base}"
  value.font-size: "{sherpa.font-size-heading-h1}"
  value.font-weight: "{sherpa.font-weight-bold}"
  value.color: "{sherpa.theme-content-body-base}"
  scale.font-size: "{sherpa.font-size-body-small}"
  scale.color: "{sherpa.theme-content-body-1}"
  caption.font-size: "{sherpa.font-size-body-small}"
  caption.color: "{sherpa.theme-content-body-1}"
$extensions:
  sherpa:
    figmaName: Gauge Chart
    category: chart
    jsProps:
      - name: value
        type: string
        access: read-write
