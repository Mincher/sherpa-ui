<!--
  sherpa-sparkline — a compact inline trend chart (line area or bars).

  A fixed set of 8 point slots (7 segments). JS supplies the raw values as
  --_v0..--_v7 plus --_min / --_range on the host; CSS normalises each value to
  0–100 with calc() and positions the shapes. Unused segments/points collapse
  from the host's data-len (CSS owns the visibility, not JS).

  Public API:
    data-values   — comma-separated or JSON array (e.g. "10,25,15,30")
    data-type  — line (default, area + stroke) | bar (flat-topped columns)

  Slots: none — display only.
  Fires: nothing.
-->
<template id="default">
  <div class="chart" part="chart" role="img" aria-label="Sparkline trend">
    <div class="shape" data-index="0">
      <span class="point" data-role="start" data-index="0"></span>
      <span class="point" data-role="end" data-index="1"></span>
    </div>
    <div class="shape" data-index="1">
      <span class="point" data-role="start" data-index="1"></span>
      <span class="point" data-role="end" data-index="2"></span>
    </div>
    <div class="shape" data-index="2">
      <span class="point" data-role="start" data-index="2"></span>
      <span class="point" data-role="end" data-index="3"></span>
    </div>
    <div class="shape" data-index="3">
      <span class="point" data-role="start" data-index="3"></span>
      <span class="point" data-role="end" data-index="4"></span>
    </div>
    <div class="shape" data-index="4">
      <span class="point" data-role="start" data-index="4"></span>
      <span class="point" data-role="end" data-index="5"></span>
    </div>
    <div class="shape" data-index="5">
      <span class="point" data-role="start" data-index="5"></span>
      <span class="point" data-role="end" data-index="6"></span>
    </div>
    <div class="shape" data-index="6">
      <span class="point" data-role="start" data-index="6"></span>
      <span class="point" data-role="end" data-index="7"></span>
    </div>

    <!--
      HOVER DOTS — one per data point, and the tooltip ANCHORS.

      They are real HTML divs, not SVG: an SVG element cannot be a CSS anchor in
      Chromium (anchor-name is accepted and then never resolves — the tip drops to
      the viewport corner). As HTML they position themselves from the SAME
      --_vN / --_min / --_range bridge the shapes use, in percentages of the
      chart's own box, so calc() keeps them correct at any size with no JS
      measuring and no re-layout on resize.

      Each dot's tooltip is its SIBLING, never its child: an
      absolutely-positioned mark BREAKS anchor positioning for a `position: fixed`
      descendant, so a nested tip drops to the dot's own corner instead of sitting
      above it. The .chart-tip rules in core/sherpa-base.css do the placement.
    -->
    <div class="hotspots" part="hotspots" aria-hidden="true">
      <button class="hotspot chart-mark" type="button" data-index="0" tabindex="-1"></button>
      <span class="chart-tip" role="tooltip" data-index="0"><span class="chart-tip-value"></span></span>
      <button class="hotspot chart-mark" type="button" data-index="1" tabindex="-1"></button>
      <span class="chart-tip" role="tooltip" data-index="1"><span class="chart-tip-value"></span></span>
      <button class="hotspot chart-mark" type="button" data-index="2" tabindex="-1"></button>
      <span class="chart-tip" role="tooltip" data-index="2"><span class="chart-tip-value"></span></span>
      <button class="hotspot chart-mark" type="button" data-index="3" tabindex="-1"></button>
      <span class="chart-tip" role="tooltip" data-index="3"><span class="chart-tip-value"></span></span>
      <button class="hotspot chart-mark" type="button" data-index="4" tabindex="-1"></button>
      <span class="chart-tip" role="tooltip" data-index="4"><span class="chart-tip-value"></span></span>
      <button class="hotspot chart-mark" type="button" data-index="5" tabindex="-1"></button>
      <span class="chart-tip" role="tooltip" data-index="5"><span class="chart-tip-value"></span></span>
      <button class="hotspot chart-mark" type="button" data-index="6" tabindex="-1"></button>
      <span class="chart-tip" role="tooltip" data-index="6"><span class="chart-tip-value"></span></span>
      <button class="hotspot chart-mark" type="button" data-index="7" tabindex="-1"></button>
      <span class="chart-tip" role="tooltip" data-index="7"><span class="chart-tip-value"></span></span>
    </div>
  </div>
</template>
