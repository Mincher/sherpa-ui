<!--
  sherpa-sparkline — a compact inline trend chart (line area or bars).

  JS stamps a shape per value pair and a dot per value, each with its own
  numbers, and sets --_min and --_range on the host; CSS does the rest.

  Public API:
    data-values   — comma-separated or JSON array (e.g. "10,25,15,30")
    data-type  — line (default, area + stroke) | bar (flat-topped columns)

  Slots: none — display only.
  Fires: nothing.
-->
<template id="default">
  <div class="chart" part="chart" role="img" aria-label="Sparkline trend">
    <div class="shapes"></div>
    <!--
      Hover dots + tooltip anchors. HTML, not SVG: an SVG element accepts
      anchor-name and never resolves it in Chromium, so the tip lands in the
      viewport corner. Each tip is its dot's SIBLING — an absolutely-positioned
      mark breaks anchor positioning for a `position: fixed` descendant.
    -->
    <div class="hotspots" part="hotspots" aria-hidden="true"></div>
  </div>

  <!-- no id: prototypes, one per adjacent value pair and one per value -->
  <template class="shape-tpl">
    <div class="shape">
      <span class="point" data-role="start"></span>
      <span class="point" data-role="end"></span>
    </div>
  </template>
  <template class="hotspot-tpl">
    <span class="hotspot sherpa-anchor"></span>
    <span class="sherpa-tip" popover="manual" role="tooltip"><span class="sherpa-tip-value" data-text="text"></span></span>
  </template>
</template>
