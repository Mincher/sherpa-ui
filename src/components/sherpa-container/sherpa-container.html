<!--
  sherpa-container — base surface card: header / content / footer slots,
  plus loading / empty / error states.

  Public API:
    data-elevation  none (default) | sm | md | lg
    data-loading    show the loading overlay (ratified boolean-verb state)
    data-padding    none | sm | base (default) | lg
    data-rows       4 | 6 | 8 | 10 | 12 — a FIXED height of N layout-grid rows.
                    The body's content fills it, so a chart draws into the whole
                    card and a data grid scrolls inside it instead of the card
                    growing with the data.
    data-fill       with data-rows AND several body children: only the child
                    marked data-grow takes the spare height; the rest keep their
                    natural size. A records card is a toolbar, a filter bar, the
                    GRID, then the pager — the grid grows, the pager stays put.
                    Not needed for the common one-child card.

  No data-state attribute: slotting empty / error shows that overlay, via the
  base class reflecting data-has-{slot}.

  Slots:
    (default) — the card body
    header    — header region (reflects data-has-header)
    footer    — footer region (reflects data-has-footer)
    loading   — loading content (has a default spinner); shown by data-loading
    empty     — empty-state content; slotting it shows the empty overlay (data-has-empty)
    error     — error-state content; slotting it shows the error overlay (data-has-error)

  Fires: nothing by itself — it's a surface. Consumers wire their own controls.
-->
<template id="default">
  <header class="header" part="header">
    <slot name="header"></slot>
  </header>

  <div class="body" part="body">
    <slot></slot>
  </div>

  <footer class="footer" part="footer">
    <slot name="footer"></slot>
  </footer>

  <div class="state" role="status" aria-live="polite" part="state">
    <slot name="loading" class="state-loading">
      <span class="spinner" aria-label="Loading"></span>
    </slot>
    <slot name="empty" class="state-empty">
      <span class="state-text">Nothing to show yet.</span>
    </slot>
    <slot name="error" class="state-error">
      <span class="state-text">Something went wrong.</span>
    </slot>
  </div>
</template>
