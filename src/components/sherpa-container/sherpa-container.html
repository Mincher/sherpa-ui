<!--
  sherpa-container — base surface card: header / content / footer slots,
  plus loading / empty / error states.

  Public API:
    data-elevation  none (default) | sm | md | lg
    data-loading    show the loading overlay (ratified boolean-verb state)
    data-state      empty | no-matches | error — empty and error show their default
                    content IN PLACE of the body; no matches covers nothing, so the
                    card's own filters stay in reach. Written by the provider.
                    TRAP T-a-container-shows-its-datas-state
    data-error          the error's own words, under its heading
    data-keep-content  a state never replaces the body: loading is a bar under the
                    header and the body is locked; a failure or no data is a banner
                    above it, and no matches has none. Written by the provider. Will, TODO 59.
    data-padding    none | sm | md | lg | xl — one scale on both axes; unset is the card's own (lg)
    data-row-span       1–12 — a FIXED height of N layout-grid rows.
                    The body's content fills it, so a chart draws into the whole
                    card and a data grid scrolls inside it instead of the card
                    growing with the data.
    data-fill       with data-row-span AND several body children: only the child
                    marked data-grow takes the spare height; the rest keep their
                    natural size. A records card is a toolbar, a filter bar, the
                    GRID, then the pager — the grid grows, the pager stays put.
                    Not needed for the common one-child card.

  Slotting empty / error shows that overlay too, via the base class reflecting
  a `has-<slot>` state; a slotted one replaces the default content.

  Slots:
    (default) — the card body
    header    — header region (reflects has-header)
    footer    — footer region (reflects has-footer)
    loading   — loading content (has a default spinner); shown by data-loading
    empty     — empty-state content; slotting it shows the empty overlay (has-empty)
    error     — error-state content; slotting it shows the error overlay (has-error)

  Fires:
    data-refresh  — Retry, on an error
    state-dismiss — Dismiss, on an error: the overlay goes, the last data stays
-->
<template id="default">
  <header class="header" part="header">
    <slot name="header" data-accepts="header"></slot>
  </header>

  <!-- KEEP THE CONTENT: a failure or no data as a banner, the body still shown. TODO 59 -->
  <div class="banner" part="banner">
    <sherpa-callout class="banner-error" data-status="critical" data-heading="The data could not load">
      <span><span class="error-message"></span> The last data is still shown.</span>
      <span class="banner-actions">
        <sherpa-button class="retry" data-size="sm" data-look="saturated">Retry</sherpa-button>
        <sherpa-button class="dismiss" data-size="sm">Dismiss</sherpa-button>
      </span>
    </sherpa-callout>
    <sherpa-callout class="banner-empty" data-status="info" data-heading="No data yet">
      <span>There is nothing here yet.</span>
    </sherpa-callout>
  </div>

  <div class="body" part="body">
    <sherpa-progress-bar class="loading-bar" part="loading-bar" data-indeterminate aria-label="Loading"></sherpa-progress-bar>
    <slot data-accepts="content"></slot>
  </div>

  <footer class="footer" part="footer">
    <slot name="footer" data-accepts="footer"></slot>
  </footer>

  <div class="state" role="status" aria-live="polite" part="state">
    <!-- Each state's DEFAULT content, composed; a slotted one replaces it.
         TRAP T-a-container-shows-its-datas-state -->
    <slot name="loading" class="state-loading" data-accepts="content">
      <sherpa-loader data-orientation="vertical"><span slot="label">Loading…</span></sherpa-loader>
    </slot>
    <slot name="empty" class="state-empty" data-accepts="content">
      <sherpa-empty-state class="empty-default" data-illustration="data" data-size="sm"
                          data-heading="No data yet" data-description="There is nothing here yet."></sherpa-empty-state>
    </slot>
    <slot name="error" class="state-error" data-accepts="content">
      <sherpa-empty-state class="error-default" data-illustration="error" data-size="sm"
                          data-heading="The data could not load">
        <span class="error-message"></span>
        <!-- RETRY resolves it, so it is the CTA; Dismiss does not. -->
        <sherpa-button slot="actions" class="retry" data-look="saturated">Retry</sherpa-button>
        <sherpa-button slot="actions" class="dismiss">Dismiss</sherpa-button>
      </sherpa-empty-state>
    </slot>
  </div>
</template>
