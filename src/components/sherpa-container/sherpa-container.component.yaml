# sherpa-container — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-container.{thin.yaml,html,css,ts}. The MECHANICAL surface only —
# props (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# Validated by schemas/component.v1.json; round-trips via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-container
$description: the base card surface.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: div
      class: header
      part: header
      slot: header
    - el: div
      class: body
      part: body
      slot: ""
    - el: div
      class: footer
      part: footer
      slot: footer
    - el: div
      class: state
      part: state
      slot: error
      attrs:
        role: status
        aria-live: polite
props:
  - $type: prop
    name: data-elevation
    type: enum
    kind: style
    values:
      - none
      - sm
      - md
      - lg
    description: none  | sm | md | lg
  - $type: prop
    name: data-padding
    type: enum
    kind: style
    values:
      - none
      - sm
      - base
      - lg
    description: none | sm | base  | lg
  - $type: prop
    name: data-state
    type: enum
    kind: style
    values:
      - loading
      - empty
      - error
    description: loading | empty | error   (shows the matching overlay)
  - $type: prop
    name: data-variant
    type: enum
    kind: style
    values:
      - fill
      - fit
    description: fill  | fit (hugs content)
states:
  - $type: state
    name: violet
    selector: ":host([data-color-set=\"violet\"])"
  - $type: state
    name: teal
    selector: ":host([data-color-set=\"teal\"])"
  - $type: state
    name: blue
    selector: ":host([data-color-set=\"blue\"])"
  - $type: state
    name: green
    selector: ":host([data-color-set=\"green\"])"
  - $type: state
    name: amber
    selector: ":host([data-color-set=\"amber\"])"
  - $type: state
    name: red
    selector: ":host([data-color-set=\"red\"])"
  - $type: state
    name: fill
    selector: ":host([data-variant=\"fill\"])"
  - $type: state
    name: fit
    selector: ":host([data-variant=\"fit\"])"
  - $type: state
    name: sm
    selector: ":host([data-elevation=\"sm\"])"
  - $type: state
    name: md
    selector: ":host([data-elevation=\"md\"])"
  - $type: state
    name: lg
    selector: ":host([data-elevation=\"lg\"])"
  - $type: state
    name: none
    selector: ":host([data-padding=\"none\"])"
  - $type: state
    name: sm
    selector: ":host([data-padding=\"sm\"])"
  - $type: state
    name: lg
    selector: ":host([data-padding=\"lg\"])"
  - $type: state
    name: has-header
    selector: ":host([data-has-header])"
  - $type: state
    name: has-footer
    selector: ":host([data-has-footer])"
  - $type: state
    name: state
    selector: ":host([data-state])"
  - $type: state
    name: loading
    selector: ":host([data-state=\"loading\"])"
  - $type: state
    name: empty
    selector: ":host([data-state=\"empty\"])"
  - $type: state
    name: error
    selector: ":host([data-state=\"error\"])"
events:
  - $type: event
    name: nothing
    bubbles: true
    composed: true
tokens:
  state.background: "{sherpa.style-surface-base}"
  state-text.color: "{sherpa.theme-content-body-1}"
  state-text.font-size: "{sherpa.font-size-body-base}"
  spinner.border-width: "{sherpa.style-border-base}"
  spinner.border-block-start-color: "{sherpa.theme-content-active-base}"
$extensions:
  sherpa:
    figmaName: Container
    category: container
    variantAxes:
      - name: Type
        values:
          - default
          - dialog
          - panel
          - overlay-panel
          - accordion
    booleanProps:
      - expanded
    divergence:
      note: >-
        2026-08-26: 1 Figma component → many HTML elements. The single "Container" COMPONENT_SET
        (Type=default|dialog|panel|overlay-panel|accordion) already carries all variants in Figma,
        but those Type values are DISTINCT HTML elements with their own native behaviour/a11y — a
        code component per Type maps in via figmaName "Container" (same 1:many pattern as Input
        Field; see sherpa-input-text _divergence.oneToMany).
      oneToMany:
        figmaComponent: Container
        note: >-
          Type variant = which HTML element. Already built as variants in Figma; code splits per
          element.
        types:
          - figmaType: default
            html: <div> / <section>
            codeComponent: sherpa-container
          - figmaType: dialog
            html: <dialog>
            codeComponent: sherpa-dialog
          - figmaType: panel
            html: <section> / <aside>
            codeComponent: sherpa-panel
          - figmaType: overlay-panel
            html: <aside> (overlay)
            codeComponent: sherpa-overlay-panel
          - figmaType: accordion
            html: <details> / <summary>
            codeComponent: sherpa-accordion
