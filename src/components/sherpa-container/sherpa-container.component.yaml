# sherpa-container — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-container.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-container
$description: the base card surface.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: div
      class: header
      part: header
      slot: header
    - el: div
      class: body
      part: body
      slot: ""
    - el: div
      class: footer
      part: footer
      slot: footer
    - el: div
      class: state
      part: state
      attrs:
        role: status
        aria-live: polite
      children:
        - slot: loading
          attrs:
            class: state-loading
        - slot: empty
          attrs:
            class: state-empty
        - slot: error
          attrs:
            class: state-error
props:
  - $type: prop
    name: data-elevation
    type: enum
    kind: style
    values:
      - none
      - sm
      - md
      - lg
    description: none  | sm | md | lg
  - $type: prop
    name: data-loading
    type: string
    kind: style
    default: false
    description: show the loading overlay (ratified boolean-verb state)
  - $type: prop
    name: data-padding
    type: enum
    kind: style
    values:
      - none
      - sm
      - base
      - lg
    description: >-
      none | sm | base  | lg The empty and error overlays are SLOT-DRIVEN (ratified D6): slot
      content into the empty / error slot and the matching overlay shows automatically. There is no
      data-state attribute — the base class reflects named-slot presence as data-has-{slot} on the
      host and CSS keys the overlay off it.
  - $type: prop
    name: data-state
    type: enum
    kind: style
    values:
      - empty
      - error
    description: "empty | error   (shows the matching overlay; TODO D6: move to slot-driven :has())"
  - $type: prop
    name: data-variant
    type: enum
    kind: style
    values:
      - fill
      - fit
    description: fill  | fit (hugs content)
states:
  - $type: state
    name: violet
    selector: ":host([data-color-set=\"violet\"])"
  - $type: state
    name: teal
    selector: ":host([data-color-set=\"teal\"])"
  - $type: state
    name: blue
    selector: ":host([data-color-set=\"blue\"])"
  - $type: state
    name: green
    selector: ":host([data-color-set=\"green\"])"
  - $type: state
    name: amber
    selector: ":host([data-color-set=\"amber\"])"
  - $type: state
    name: red
    selector: ":host([data-color-set=\"red\"])"
  - $type: state
    name: fill
    selector: ":host([data-variant=\"fill\"])"
  - $type: state
    name: fit
    selector: ":host([data-variant=\"fit\"])"
  - $type: state
    name: sm
    selector: ":host([data-elevation=\"sm\"])"
  - $type: state
    name: md
    selector: ":host([data-elevation=\"md\"])"
  - $type: state
    name: lg
    selector: ":host([data-elevation=\"lg\"])"
  - $type: state
    name: none
    selector: ":host([data-padding=\"none\"])"
  - $type: state
    name: sm
    selector: ":host([data-padding=\"sm\"])"
  - $type: state
    name: lg
    selector: ":host([data-padding=\"lg\"])"
  - $type: state
    name: has-header
    selector: ":host([data-has-header])"
  - $type: state
    name: has-footer
    selector: ":host([data-has-footer])"
  - $type: state
    name: loading
    selector: ":host([data-loading])"
  - $type: state
    name: has-empty
    selector: ":host([data-has-empty])"
  - $type: state
    name: has-error
    selector: ":host([data-has-error])"
events:
  - $type: event
    name: nothing
    bubbles: true
    composed: true
tokens:
  state.background: "{sherpa.style-surface-base}"
  state-text.color: "{sherpa.theme-content-body-1}"
  state-text.font-size: "{sherpa.font-size-body-base}"
  spinner.border-width: "{sherpa.style-border-base}"
  spinner.border-block-start-color: "{sherpa.theme-content-active-base}"
$extensions:
  sherpa:
    figmaName: Container
    category: container
    booleanProps:
      - expanded
    divergence:
      note: >-
        2026-09-07 SPLIT DONE: the former Container Type axis (default|dialog|panel|overlay-panel|
        accordion) was split into SEPARATE components in Figma AND code (ratified D2/D12). Figma
        "Container" is now a plain COMPONENT (Type=default only), and dialog/panel/overlay-panel/
        accordion are standalone Figma components + code components on native elements:
        dialog→sherpa-dialog (<dialog> modal), overlay-panel→sherpa-overlay-panel (<dialog>
        non-modal), accordion→sherpa-accordion (<details>), panel→sherpa-panel (<section>).
        sherpa-container is now just the base card surface (header/body/footer slots + states).
