# sherpa-container — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-container.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-container
$description: the base card surface.
element:
  $type: element
  tag: header
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: header
      class: header
      part: header
      slot: header
    - el: div
      class: body
      part: body
      slot: ""
    - el: footer
      class: footer
      part: footer
      slot: footer
    - el: div
      class: state
      part: state
      attrs:
        role: status
        aria-live: polite
      children:
        - slot: loading
          attrs:
            class: state-loading
          children:
            - el: span
              class: spinner
              attrs:
                aria-label: Loading
        - slot: empty
          attrs:
            class: state-empty
          children:
            - el: span
              class: state-text
        - slot: error
          attrs:
            class: state-error
          children:
            - el: span
              class: state-text
props:
  - $type: prop
    name: data-elevation
    type: enum
    kind: style
    values:
      - none
      - sm
      - md
      - lg
    description: none  | sm | md | lg
  - $type: prop
    name: data-fill
    type: string
    kind: style
    description: >-
      with data-rows AND several body children: only the child marked data-grow takes the spare
      height; the rest keep their natural size. A records card is a toolbar, a filter bar, the GRID,
      then the pager — the grid grows, the pager stays put. Not needed for the common one-child
      card. No data-state attribute: slotting empty / error shows that overlay, via the base class
      reflecting data-has-{slot}.
  - $type: prop
    name: data-loading
    type: string
    kind: style
    default: false
    description: show the loading overlay (ratified boolean-verb state)
  - $type: prop
    name: data-padding
    type: enum
    kind: style
    values:
      - none
      - sm
      - base
      - lg
    description: none | sm | base  | lg
  - $type: prop
    name: data-rows
    type: enum
    kind: style
    values:
      - "4"
      - "6"
      - "8"
      - "10"
      - "12"
    description: >-
      4 | 6 | 8 | 10 | 12 — a FIXED height of N layout-grid rows. The body's content fills it, so a
      chart draws into the whole card and a data grid scrolls inside it instead of the card growing
      with the data.
states:
  - $type: state
    name: sm
    selector: ":host([data-elevation=\"sm\"])"
  - $type: state
    name: md
    selector: ":host([data-elevation=\"md\"])"
  - $type: state
    name: lg
    selector: ":host([data-elevation=\"lg\"])"
  - $type: state
    name: none
    selector: ":host([data-padding=\"none\"])"
  - $type: state
    name: sm
    selector: ":host([data-padding=\"sm\"])"
  - $type: state
    name: lg
    selector: ":host([data-padding=\"lg\"])"
  - $type: state
    name: sm
    selector: ":host([data-padding-inline=\"sm\"])"
  - $type: state
    name: md
    selector: ":host([data-padding-inline=\"md\"])"
  - $type: state
    name: lg
    selector: ":host([data-padding-inline=\"lg\"])"
  - $type: state
    name: rows
    selector: ":host([data-rows])"
  - $type: state
    name: "4"
    selector: ":host([data-rows=\"4\"])"
  - $type: state
    name: "6"
    selector: ":host([data-rows=\"6\"])"
  - $type: state
    name: "8"
    selector: ":host([data-rows=\"8\"])"
  - $type: state
    name: "10"
    selector: ":host([data-rows=\"10\"])"
  - $type: state
    name: "12"
    selector: ":host([data-rows=\"12\"])"
  - $type: state
    name: has-header
    selector: ":host([data-has-header])"
  - $type: state
    name: has-footer
    selector: ":host([data-has-footer])"
  - $type: state
    name: loading
    selector: ":host([data-loading])"
  - $type: state
    name: has-empty
    selector: ":host([data-has-empty])"
  - $type: state
    name: has-error
    selector: ":host([data-has-error])"
tokens:
  state.background: "{sherpa.style-surface-base}"
  state-text.color: "{sherpa.theme-content-body-1}"
  state-text.font-size: "{sherpa.font-size-body-base}"
  spinner.inline-size: "{sherpa.display-mode-size-md}"
  spinner.block-size: "{sherpa.display-mode-size-md}"
  spinner.border-width: "{sherpa.theme-surface-default-2}"
  spinner.border-block-start-color: "{sherpa.style-indicator-accent}"
$extensions:
  sherpa:
    figmaName: Container
    category: container
    booleanProps:
      - expanded
    divergence:
      note: >-
        2026-09-07 SPLIT DONE: the former Container Type axis (default|dialog|panel|overlay-panel|
        accordion) was split into SEPARATE components in Figma AND code (ratified D2/D12). Figma
        "Container" is now a plain COMPONENT (Type=default only), and dialog/panel/overlay-panel/
        accordion are standalone Figma components + code components on native elements:
        dialog→sherpa-dialog (<dialog> modal), overlay-panel→sherpa-overlay-panel (<dialog>
        non-modal), accordion→sherpa-accordion (<details>), panel→sherpa-panel (<section>).
        sherpa-container is now just the base card surface (header/body/footer slots + states).
