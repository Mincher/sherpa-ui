<!--
  sherpa-slider — a single-value range control wrapping a native <input type=range>.

  Matches the Figma "Slider": a label over a row of [track] [value-input], where
  the value-input is an editable numeric field beside the track (type a value to
  commit it). The native range owns interaction/keyboard/a11y; CSS restyles the
  track/thumb and draws the fill up to the current value.

  Public API:
    data-label       — label text above the slider (shown when set)
    min              — minimum value (native, default 0)
    max              — maximum value (native, default 100)
    step             — step increment (native, default 1)
    value            — current value (native)
    data-show-value  — show the editable value input beside the track (boolean)
    data-value-readonly — make the value display read-only (no typing)
    data-type        — single (default) | range — two thumbs and two value fields
    value-start / value-end — the range ends (data-type="range" only)
    disabled         — disabled state

  Events: input (while dragging / typing), change (on commit).
    single: detail { value }
    range:  detail { start, end }

  RANGE is two native <input type="range">s stacked on one track, not one input
  with two thumbs — there is no such native control. Each owns one end, so the
  browser's own dragging, keyboard stepping and a11y come free for both, and the
  fill is drawn between them from two percentages. The inputs are laid over each
  other and CSS gives pointer events to the THUMBS only, so a click on bare track
  never lands on the input that happens to be on top.
-->
<template id="default">
  <div class="head">
    <label class="label" part="label" for="slider-range"></label>
  </div>

  <div class="slider-row">
    <!-- The START field. Hidden outside range mode; CSS owns that. -->
    <input class="value-input value-start" part="value-start" type="number"
           inputmode="decimal" aria-label="Minimum" />

    <div class="track-area">
      <div class="track" part="track">
        <div class="fill" part="fill"></div>
      </div>
      <input class="range" id="slider-range" type="range" part="range" />
      <!-- The second thumb. Present always, revealed by CSS in range mode, so
           there is no createElement and no template switch. -->
      <input class="range range-end" type="range" part="range-end"
             aria-label="Maximum" />
    </div>

    <input class="value-input value-end" part="value" type="number"
           inputmode="decimal" aria-label="Value" />
  </div>
</template>
