<!--
  sherpa-slider — a single-value range control wrapping a native <input type=range>.

  Public API:
    data-label       — label text above the slider (shown when set)
    min              — minimum value (native, default 0)
    max              — maximum value (native, default 100)
    step             — step increment (native, default 1)
    value            — current value (native)
    data-show-value  — show the editable value field under the track (boolean);
                       a range's two fields share that row, half each
    data-value-readonly — make the value display read-only (no typing)
    data-type        — single (default) | range — two thumbs and two value fields
    value-start / value-end — the range ends (data-type="range" only)
    disabled         — disabled state

  Fires:
    input — while dragging / typing. detail: { value } | { start, end }
    change — on commit. detail: { value } | { start, end }

  RANGE is two stacked native inputs — there is no two-thumb native control.
  CSS gives pointer events to the THUMBS only, so a click on bare track never
  lands on whichever input is on top.
-->
<template id="default">
  <div class="head">
    <label class="label" part="label" for="slider-range"></label>
  </div>

  <div class="slider-row">
    <!-- Hidden outside range mode; CSS owns that. A Sherpa number field, as
         Figma's Slider composes one. TRAP T-a-number-input-wears-sherpas-steppers -->
    <sherpa-input-text class="value-input value-start" part="value-start" data-type="number"
                       aria-label="Minimum"></sherpa-input-text>

    <div class="track-area">
      <div class="track" part="track">
        <div class="fill" part="fill"></div>
      </div>
      <input class="range" id="slider-range" type="range" part="range" />
      <!-- Second thumb: always present, revealed by CSS in range mode. -->
      <input class="range range-end" type="range" part="range-end"
             aria-label="Maximum" />
    </div>

    <sherpa-input-text class="value-input value-end" part="value" data-type="number"
                       aria-label="Value"></sherpa-input-text>
  </div>
</template>
