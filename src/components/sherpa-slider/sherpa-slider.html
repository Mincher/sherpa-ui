<!--
  sherpa-slider — a single-value range control wrapping a native <input type=range>.

  Matches the Figma "Slider": a label over a row of [track] [value-input], where
  the value-input is an editable numeric field beside the track (type a value to
  commit it). The native range owns interaction/keyboard/a11y; CSS restyles the
  track/thumb and draws the fill up to the current value.

  Public API:
    data-label       — label text above the slider (shown when set)
    min              — minimum value (native, default 0)
    max              — maximum value (native, default 100)
    step             — step increment (native, default 1)
    value            — current value (native)
    data-show-value  — show the editable value input beside the track (boolean)
    data-value-readonly — make the value display read-only (no typing)
    disabled         — disabled state

  Events: input (while dragging / typing), change (on commit) — detail { value }.
-->
<template id="default">
  <div class="head">
    <label class="label" part="label" for="slider-range"></label>
  </div>

  <div class="slider-row">
    <div class="track-area">
      <div class="track" part="track">
        <div class="fill" part="fill"></div>
      </div>
      <input class="range" id="slider-range" type="range" part="range" />
    </div>

    <input class="value-input" part="value" type="number"
           inputmode="decimal" aria-label="Value" />
  </div>
</template>
