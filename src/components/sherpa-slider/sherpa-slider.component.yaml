# sherpa-slider — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-slider.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-slider
$description: >-
  A single-value range control: a label over a row of [track][editable value input]. Type a value in
  the field or drag the track; the two stay in sync.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: div
      class: head
      children:
        - el: label
          class: label
          part: label
          attrs:
            for: slider-range
    - el: div
      class: slider-row
      children:
        - el: input
          class: value-input value-start
          part: value-start
          attrs:
            type: number
            inputmode: decimal
            aria-label: Minimum
        - el: div
          class: track-area
          children:
            - el: div
              class: track
              part: track
              children:
                - el: div
                  class: fill
                  part: fill
            - el: input
              class: range
              part: range
              attrs:
                id: slider-range
                type: range
            - el: input
              class: range range-end
              part: range-end
              attrs:
                type: range
                aria-label: Maximum
        - el: input
          class: value-input value-end
          part: value
          attrs:
            type: number
            inputmode: decimal
            aria-label: Value
props:
  - $type: prop
    name: data-label
    type: string
    kind: style
    description: — label text above the slider (shown when set)
  - $type: prop
    name: data-max
    type: string
    kind: style
    default: "100"
    description: — maximum value
  - $type: prop
    name: data-min
    type: string
    kind: style
    default: "0"
    description: — minimum value
  - $type: prop
    name: data-show-value
    type: boolean
    kind: style
    default: false
    description: — show the editable value input beside the track
  - $type: prop
    name: data-step
    type: string
    kind: style
    default: "1"
    description: — step increment
  - $type: prop
    name: data-type
    type: string
    kind: content
    description: — single  | range — two thumbs and two value fields
  - $type: prop
    name: data-value
    type: string
    kind: style
    description: — current value
  - $type: prop
    name: data-value-readonly
    type: string
    kind: content
    description: — make the value display read-only (no typing)
  - $type: prop
    name: value-end
    type: string
    description: the range ends (data-type="range" only)
  - $type: prop
    name: value-start
    type: string
    description: the range ends (data-type="range" only)
  - $type: prop
    name: disabled
    type: boolean
    native: true
    kind: content
    default: false
    description: — disabled state
  - $type: prop
    name: max
    type: string
    native: true
    kind: content
    description: — maximum value (native, default 100)
  - $type: prop
    name: min
    type: string
    native: true
    kind: content
    description: — minimum value (native, default 0)
  - $type: prop
    name: step
    type: string
    native: true
    kind: content
    description: — step increment (native, default 1)
  - $type: prop
    name: value
    type: string
    native: true
    kind: content
    description: — current value (native)
states:
  - $type: state
    name: label
    selector: ":host([data-label])"
  - $type: state
    name: show-value
    selector: ":host([data-show-value])"
  - $type: state
    name: value-readonly
    selector: ":host([data-value-readonly])"
  - $type: state
    name: range
    selector: ":host([data-type=\"range\"])"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
  - $type: state
    name: focus-visible
    selector: .value-input:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (value, range). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: input
    bubbles: true
    composed: true
  - $type: event
    name: change
    bubbles: true
    composed: true
tokens:
  head.font-size: "{sherpa.font-size-body-base}"
  label.color: "{sherpa.theme-content-body-1}"
  label.font-weight: "{sherpa.font-weight-medium}"
  label.line-height: "{sherpa.theme-content-line-height-base}"
  slider-row.gap: "{sherpa.display-mode-space-sm}"
  value-input.inline-size: "{sherpa.display-mode-size-6xl}"
  value-input.min-block-size: "{sherpa.display-mode-size-2xl}"
  value-input.padding: "{sherpa.display-mode-space-2xs}"
  value-input.border-color: "{sherpa.theme-border-default-2}"
  value-input.border-block-start-width: "{sherpa.border-top}"
  value-input.border-block-end-width: "{sherpa.border-bottom}"
  value-input.border-inline-start-width: "{sherpa.border-left}"
  value-input.border-inline-end-width: "{sherpa.border-right}"
  value-input.border-radius: "{sherpa.display-mode-border-rounding-base}"
  value-input.background: "{sherpa.theme-surface-default-base}"
  value-input.color: "{sherpa.theme-content-body-1}"
  value-input.font-family: "{sherpa.font-family-mono}"
  value-input.font-size: "{sherpa.font-size-body-base}"
  track.background: "{sherpa.theme-surface-default-2}"
  track.border-radius: "{sherpa.display-mode-border-rounding-full}"
$extensions:
  sherpa:
    figmaName: Slider
    category: control
    jsProps:
      - name: value
        type: number
        description: the current value (read/write, clamped to min/max)
        access: read-write
      - name: range
        type: "[number, number]"
        description: the two ends (read/write); low end first
        access: read-write
