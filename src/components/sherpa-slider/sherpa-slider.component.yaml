# sherpa-slider — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-slider.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-slider
$description: a single-value range control wrapping a native <input type=range>.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: div
      class: head
      children:
        - el: label
          class: label
          part: label
          attrs:
            for: slider-range
    - el: div
      class: slider-row
      children:
        - el: sherpa-input-text
          class: value-input value-start
          part: value-start
          attrs:
            data-type: number
            aria-label: Minimum
        - el: div
          class: track-area
          children:
            - el: div
              class: track
              part: track
              children:
                - el: div
                  class: fill
                  part: fill
            - el: input
              class: range
              part: range
              attrs:
                id: slider-range
                type: range
            - el: input
              class: range range-end
              part: range-end
              attrs:
                type: range
                aria-label: Maximum
        - el: sherpa-input-text
          class: value-input value-end
          part: value
          attrs:
            data-type: number
            aria-label: Value
props:
  - $type: prop
    name: data-label
    type: string
    observed: false
    kind: content
    description: — label text above the slider (shown when set)
  - $type: prop
    name: data-show-value
    type: boolean
    observed: false
    kind: style
    default: false
    description: >-
      — show the editable value field under the track ; a range's two fields share that row, half
      each
  - $type: prop
    name: data-type
    type: string
    observed: true
    kind: style
    description: — single  | range — two thumbs and two value fields
  - $type: prop
    name: data-value
    type: string
    observed: false
    kind: style
    description: — current value
  - $type: prop
    name: data-value-readonly
    type: string
    observed: true
    kind: style
    description: — make the value display read-only (no typing)
  - $type: prop
    name: value-end
    type: string
    observed: true
    description: the range ends (data-type="range" only)
  - $type: prop
    name: value-start
    type: string
    observed: true
    description: the range ends (data-type="range" only)
  - $type: prop
    name: disabled
    type: boolean
    observed: true
    native: true
    default: false
    description: — disabled state
  - $type: prop
    name: max
    type: string
    observed: true
    native: true
    description: — maximum value (native, default 100)
  - $type: prop
    name: min
    type: string
    observed: true
    native: true
    description: — minimum value (native, default 0)
  - $type: prop
    name: step
    type: string
    observed: true
    native: true
    description: — step increment (native, default 1)
  - $type: prop
    name: value
    type: string
    observed: true
    native: true
    description: — current value (native)
states:
  - $type: state
    name: label
    selector: ":host([data-label])"
  - $type: state
    name: show-value
    selector: ":host([data-show-value])"
  - $type: state
    name: value-readonly
    selector: ":host([data-value-readonly])"
  - $type: state
    name: range
    selector: ":host([data-type=\"range\"])"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
  - $type: state
    name: focus-visible
    selector: .range:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (value, range). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: input
    bubbles: true
    composed: true
    detail:
      value: unknown
  - $type: event
    name: change
    bubbles: true
    composed: true
    detail:
      value: unknown
tokens:
  head.font-size: "{sherpa.font-size-body-base}"
  label.color: "{sherpa.style-content-base}"
  label.font-weight: "{sherpa.font-weight-medium}"
  label.line-height: "{sherpa.theme-content-line-height-base}"
  slider-row.gap: "{sherpa.display-mode-space-xs}"
  track.background: "{sherpa.theme-surface-default-2}"
  track.border-radius: "{sherpa.display-mode-border-rounding-full}"
$extensions:
  sherpa:
    figmaName: Slider
    category: control
    jsProps:
      - name: value
        type: number
        description: the current value (read/write, clamped to min/max)
        access: read-write
      - name: range
        type: "[number, number]"
        description: the two ends (read/write); low end first
        access: read-write
