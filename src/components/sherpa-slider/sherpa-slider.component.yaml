# sherpa-slider — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-slider.{thin.yaml,html,css,ts}. The MECHANICAL surface only —
# props (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# Validated by schemas/component.v1.json; round-trips via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-slider
$description: >-
  A single-value range control: a label over a row of [track][editable value input]. Type a value in
  the field or drag the track; the two stay in sync.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: div
      class: head
      children:
        - el: span
          class: label
          part: label
    - el: div
      class: slider-row
      children:
        - el: div
          class: track-area
          children:
            - el: div
              class: track
              part: track
              children:
                - el: div
                  class: fill
                  part: fill
            - el: input
              class: range
              part: range
              attrs:
                type: range
        - el: input
          class: value-input
          part: value
          attrs:
            type: number
            inputmode: decimal
            aria-label: Value
props:
  - $type: prop
    name: data-label
    type: string
    kind: visibility
    description: — label text above the slider (shown when set)
  - $type: prop
    name: data-max
    type: string
    kind: content
    default: "100"
    description: — maximum value
  - $type: prop
    name: data-min
    type: string
    kind: content
    default: "0"
    description: — minimum value
  - $type: prop
    name: data-show-value
    type: boolean
    kind: style
    default: false
    description: — show the editable value input beside the track
  - $type: prop
    name: data-step
    type: string
    kind: content
    default: "1"
    description: — step increment
  - $type: prop
    name: data-value
    type: string
    kind: content
    description: — current value
  - $type: prop
    name: data-value-readonly
    type: string
    kind: style
    description: make the value display read-only (no typing)
  - $type: prop
    name: disabled
    type: boolean
    native: true
    kind: content
    default: false
    description: — disabled state
states:
  - $type: state
    name: label
    selector: ":host([data-label])"
  - $type: state
    name: show-value
    selector: ":host([data-show-value])"
  - $type: state
    name: value-readonly
    selector: ":host([data-value-readonly])"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
  - $type: state
    name: focus-visible
    selector: .value-input:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (value). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: input
    bubbles: true
    composed: true
  - $type: event
    name: change
    bubbles: true
    composed: true
tokens:
  head.font-size: "{sherpa.font-size-body-base}"
  label.color: "{sherpa.theme-content-body-1}"
  label.font-weight: "{sherpa.font-weight-medium}"
  slider-row.gap: "{sherpa.display-space-sm}"
  value-input.inline-size: "{sherpa.display-size-6xl}"
  value-input.min-block-size: "{sherpa.display-size-2xl}"
  value-input.padding: "{sherpa.display-space-2xs}"
  value-input.border-radius: "{sherpa.display-border-rounding-base}"
  value-input.background: "{sherpa.style-surface-base}"
  value-input.color: "{sherpa.style-content-base}"
  value-input.font-family: "{sherpa.font-family-mono}"
  value-input.font-size: "{sherpa.font-size-body-base}"
  track.background: "{sherpa.theme-surface-default-2}"
  track.border-radius: "{sherpa.display-border-rounding-full}"
$extensions:
  sherpa:
    figmaName: Slider
    category: control
    jsProps:
      - name: value
        type: number
        description: the current value (read/write, clamped to min/max)
        access: read-write
