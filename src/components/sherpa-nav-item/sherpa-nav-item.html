<!--
  sherpa-nav-item — a single navigation row. Figma "Navigation Item" (32:43138).

  THE HOST IS THE BOX — padding, height, radius, background and hover live on
  :host, so the tag and chevron paint inside the row.

  `.nav` and `.expand` are SIBLINGS, not nested: an expandable row has two
  controls, and nesting interactive elements is invalid HTML. CSS lays them out
  as one row.

  `content` is Figma's Navigation::isVisible node — label, tag and chevron
  collapse with the rail. The icon and dot sit outside it and survive collapse.

  Public API:
    data-icon        leading icon — a Font Awesome class list ("fa-solid fa-house");
                     any other value renders as a literal text glyph
    data-tier        nesting depth 2 | 3 — indents the row to the Figma indent tier
                     (tier 1 is the default, no attribute needed)
    data-label       row label text
    data-badge       the trailing Tag's text (Figma hasTag)
    data-status-dot  render the trailing Indicator (atom) dot
    data-expandable  the item has children — shows the chevron (Figma hasChildren)
    data-expanded    expanded state — rotates the chevron
    data-description promo description (promo variant only)
    data-current     current item in the nav set
    data-href        render the row as a link
    data-type     "promo" for the CTA row
    disabled         disabled state

  Fires: item-click  — detail: { label, href }
  Fires: item-expand — detail: { expanded } — the chevron was clicked
-->
<template id="default">
  <button class="nav nav-button" part="row" type="button">
    <span class="icon" part="icon" aria-hidden="true"></span>
    <span class="content" part="content">
      <span class="label" part="label"></span>
      <span class="badge" part="badge"><slot name="trailing"></slot></span>
    </span>
  </button>

  <a class="nav nav-link" part="row">
    <span class="icon" part="icon" aria-hidden="true"></span>
    <span class="content" part="content">
      <span class="label" part="label"></span>
      <span class="badge" part="badge"><slot name="trailing"></slot></span>
    </span>
  </a>

  <!-- Figma's trailing chevron, last child of `content`; a sibling here so it
       can be its own control. -->
  <button class="expand" part="expand" type="button" aria-label="Expand" aria-expanded="false">
    <i class="expand-chevron fa-solid fa-chevron-down" aria-hidden="true"></i>
  </button>

  <!-- Indicator (atom)/Type=dot — outside `content`, so it survives collapse. -->
  <span class="dot" part="dot" aria-hidden="true"></span>
</template>

<template id="promo">
  <button class="promo sherpa-border-edges promo-button" part="row" type="button">
    <span class="promo-icon" part="icon" aria-hidden="true"></span>
    <span class="promo-body">
      <span class="promo-heading" part="heading"></span>
      <span class="promo-description" part="description"></span>
    </span>
    <i class="promo-chevron fa-solid fa-chevron-right" part="chevron" aria-hidden="true"></i>
  </button>
  <a class="promo sherpa-border-edges promo-link" part="row">
    <span class="promo-icon" part="icon" aria-hidden="true"></span>
    <span class="promo-body">
      <span class="promo-heading" part="heading"></span>
      <span class="promo-description" part="description"></span>
    </span>
    <i class="promo-chevron fa-solid fa-chevron-right" part="chevron" aria-hidden="true"></i>
  </a>
</template>
