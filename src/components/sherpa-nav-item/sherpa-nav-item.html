<!--
  sherpa-nav-item — a single navigation row.

  Matches the Figma "Navigation Item" (32:43138). That component is ONE 24-tall
  box, and the tag and chevron live INSIDE it, inside a `content` group — they are
  not siblings hanging off the end of the row:

    Navigation Item        H · pad 0/8/0/8 · gap/md 8 · h 24 · radius 4
    ├─ Icon                16×16                              hasIcon
    ├─ content             H · gap 8 · FILL + grow 1           ← bound to isVisible
    │   ├─ Item Name       14/20 weight/LIGHT 300 · grow 1     hasLabel
    │   ├─ Tag             16-tall pill (rounding/xl 16)       hasTag
    │   └─ Icon            16×16 chevron-down                  hasChildren
    └─ Indicator (atom)    8×8 dot                             hasIndicator

  THE HOST IS THE BOX. The padding, the height, the radius, the background and the
  hover all live on :host, because the Figma row box has to contain the tag and the
  chevron. Previously the inner <button> was the box and the tag was its sibling, so
  the tag painted OUTSIDE the row's background and radius — the reported bug.

  The activation target stays a native control, and an expandable row has TWO
  controls (navigate + expand). Nesting one interactive element inside another is
  invalid HTML and wrecks keyboard order, so they are SIBLINGS in the markup and
  CSS lays them out as the single Figma row. `.nav` is the navigate target and
  stretches; `.expand` is the chevron and hugs its 16px square at the end.

  `content` is the node Figma binds to Navigation::isVisible, so the label, the tag
  AND the chevron collapse together with the rail. The leading icon and the
  indicator dot sit OUTSIDE `content`, so they survive the collapsed rail.

  Public API:
    data-icon        leading icon — a Font Awesome class list ("fa-solid fa-house");
                     any other value renders as a literal text glyph
    data-tier        nesting depth 2 | 3 — indents the row to the Figma indent tier
                     (tier 1 is the default, no attribute needed)
    data-label       row label text
    data-badge       the trailing Tag's text (Figma hasTag)
    data-status-dot  render the trailing Indicator (atom) dot
    data-expandable  the item has children — shows the chevron (Figma hasChildren)
    data-expanded    expanded state — rotates the chevron
    data-description promo description (promo variant only)
    data-current     current item in the nav set
    data-href        render the row as a link
    data-type     "promo" for the CTA row
    disabled         disabled state

  Fires: item-click  — detail: { label, href }
  Fires: item-expand — detail: { expanded } — the chevron was clicked
-->
<template id="default">
  <button class="nav nav-button" part="row" type="button">
    <span class="icon" part="icon" aria-hidden="true"></span>
    <span class="content" part="content">
      <span class="label" part="label"></span>
      <span class="badge" part="badge"><slot name="trailing"></slot></span>
    </span>
  </button>

  <a class="nav nav-link" part="row">
    <span class="icon" part="icon" aria-hidden="true"></span>
    <span class="content" part="content">
      <span class="label" part="label"></span>
      <span class="badge" part="badge"><slot name="trailing"></slot></span>
    </span>
  </a>

  <!-- Figma's trailing chevron-down Icon, last child of `content`. A sibling here
       because an expandable row needs its own control; CSS puts it in place. -->
  <button class="expand" part="expand" type="button" aria-label="Expand" aria-expanded="false">
    <i class="expand-chevron fa-solid fa-chevron-down" aria-hidden="true"></i>
  </button>

  <!-- Indicator (atom)/Type=dot — outside `content`, so it survives collapse. -->
  <span class="dot" part="dot" aria-hidden="true"></span>
</template>

<template id="promo">
  <button class="promo promo-button" part="row" type="button">
    <span class="promo-icon" part="icon" aria-hidden="true"></span>
    <span class="promo-body">
      <span class="promo-heading" part="heading"></span>
      <span class="promo-description" part="description"></span>
    </span>
    <i class="promo-chevron fa-solid fa-chevron-right" part="chevron" aria-hidden="true"></i>
  </button>
  <a class="promo promo-link" part="row">
    <span class="promo-icon" part="icon" aria-hidden="true"></span>
    <span class="promo-body">
      <span class="promo-heading" part="heading"></span>
      <span class="promo-description" part="description"></span>
    </span>
    <i class="promo-chevron fa-solid fa-chevron-right" part="chevron" aria-hidden="true"></i>
  </a>
</template>
