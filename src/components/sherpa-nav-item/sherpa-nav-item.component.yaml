# sherpa-nav-item — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-nav-item.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-nav-item
$description: a single navigation row.
element:
  $type: element
  tag: button
  attributes:
    type: button
  provides:
    - click
    - keyboard
    - focus
    - disabled
templates:
  - default
  - promo
anatomy:
  roots:
    - el: button
      class: nav nav-button
      part: row
      attrs:
        type: button
      children:
        - el: span
          class: icon
          part: icon
          attrs:
            aria-hidden: "true"
        - el: span
          class: content
          part: content
          children:
            - el: span
              class: label
              part: label
            - el: span
              class: badge
              part: badge
              slot: trailing
    - el: a
      class: nav nav-link
      part: row
      children:
        - el: span
          class: icon
          part: icon
          attrs:
            aria-hidden: "true"
        - el: span
          class: content
          part: content
          children:
            - el: span
              class: label
              part: label
            - el: span
              class: badge
              part: badge
              slot: trailing
    - el: button
      class: expand
      part: expand
      attrs:
        type: button
        aria-label: Expand
        aria-expanded: "false"
      children:
        - el: i
          class: expand-chevron fa-solid fa-chevron-down
          attrs:
            aria-hidden: "true"
    - el: span
      class: dot
      part: dot
      attrs:
        aria-hidden: "true"
props:
  - $type: prop
    name: data-badge
    type: string
    kind: visibility
    description: the trailing Tag's text (Figma hasTag)
  - $type: prop
    name: data-current
    type: string
    kind: content
    description: current item in the nav set
  - $type: prop
    name: data-description
    type: string
    kind: content
    description: promo description (promo variant only)
  - $type: prop
    name: data-expandable
    type: string
    kind: content
    description: the item has children — shows the chevron (Figma hasChildren)
  - $type: prop
    name: data-expanded
    type: string
    kind: content
    description: expanded state — rotates the chevron
  - $type: prop
    name: data-href
    type: string
    kind: content
    description: render the row as a link
  - $type: prop
    name: data-icon
    type: string
    kind: visibility
    description: >-
      leading icon — a Font Awesome class list ("fa-solid fa-house"); any other value renders as a
      literal text glyph
  - $type: prop
    name: data-label
    type: string
    kind: content
    description: row label text
  - $type: prop
    name: data-status-dot
    type: string
    kind: style
    description: render the trailing Indicator (atom) dot
  - $type: prop
    name: data-tier
    type: string
    kind: style
    description: >-
      nesting depth 2 | 3 — indents the row to the Figma indent tier (tier 1 is the default, no
      attribute needed)
  - $type: prop
    name: data-variant
    type: string
    kind: style
    description: "\"promo\" for the CTA row"
  - $type: prop
    name: disabled
    type: boolean
    native: true
    default: false
    description: disabled state
states:
  - $type: state
    name: "2"
    selector: ":host([data-tier=\"2\"])"
  - $type: state
    name: "3"
    selector: ":host([data-tier=\"3\"])"
  - $type: state
    name: href
    selector: ":host([data-href])"
  - $type: state
    name: icon
    selector: ":host([data-icon])"
  - $type: state
    name: badge
    selector: ":host([data-badge])"
  - $type: state
    name: has-trailing
    selector: ":host([data-has-trailing])"
  - $type: state
    name: expandable
    selector: ":host([data-expandable])"
  - $type: state
    name: expanded
    selector: ":host([data-expanded])"
  - $type: state
    name: status-dot
    selector: ":host([data-status-dot])"
  - $type: state
    name: current
    selector: ":host([data-current])"
  - $type: state
    name: promo
    selector: ":host([data-variant=\"promo\"])"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
  - $type: state
    name: focus-visible
    selector: .nav:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (templateId, current, expanded). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: item-click
    bubbles: true
    composed: true
  - $type: event
    name: href
    bubbles: true
    composed: true
  - $type: event
    name: item-expand
    bubbles: true
    composed: true
tokens:
  nav.gap: "{sherpa.theme-gap-md}"
  icon.inline-size: "{sherpa.theme-size-icon-xs}"
  icon.block-size: "{sherpa.theme-size-icon-xs}"
  icon.font-size: "{sherpa.theme-size-icon-xs}"
  content.gap: "{sherpa.theme-gap-md}"
  badge.padding: "{sherpa.theme-padding-xs}"
  badge.block-size: "{sherpa.display-mode-size-sm}"
  badge.border-radius: "{sherpa.display-mode-border-rounding-xl}"
  badge.background: "{sherpa.theme-surface-success-2}"
  badge.color: "{sherpa.theme-content-body-base-fixed}"
  badge.font-size: "{sherpa.theme-content-size-xs}"
  badge.font-weight: "{sherpa.font-weight-regular}"
  badge.line-height: "{sherpa.theme-content-line-height-xs}"
  expand.inline-size: "{sherpa.theme-size-icon-xs}"
  expand.block-size: "{sherpa.theme-size-icon-xs}"
  expand.padding: "{sherpa.display-mode-space-none}"
  expand.font-size: "{sherpa.theme-size-icon-2xs}"
  dot.inline-size: "{sherpa.display-mode-size-2xs}"
  dot.block-size: "{sherpa.display-mode-size-2xs}"
  dot.border-radius: "{sherpa.display-mode-border-rounding-full}"
  dot.background: "{sherpa.theme-surface-active-base}"
  dot.border-width: "{sherpa.border-top}"
  dot.border-color: "{sherpa.theme-border-active-2}"
  promo.gap: "{sherpa.structure-space-gap}"
  promo.padding: "{sherpa.theme-padding-sm}"
  promo.border-radius: "{sherpa.display-mode-border-rounding-base}"
  promo.border-width: "{sherpa.style-border-width}"
  promo.border-color: "{sherpa.theme-border-default-2}"
  promo.background: "{sherpa.style-surface-base}"
  promo.color: "{sherpa.theme-content-body-base}"
  promo-icon.inline-size: "{sherpa.display-mode-size-lg}"
  promo-icon.block-size: "{sherpa.display-mode-size-lg}"
  promo-icon.border-radius: "{sherpa.display-mode-border-rounding-xl}"
  promo-icon.background: "{sherpa.theme-surface-active-base}"
  promo-icon.color: "{sherpa.theme-content-active-base}"
  promo-body.gap: "{sherpa.display-mode-space-none}"
  promo-heading.color: "{sherpa.theme-content-body-base}"
  promo-heading.font-size: "{sherpa.font-size-body-base}"
  promo-heading.font-weight: "{sherpa.font-weight-semibold}"
  promo-description.color: "{sherpa.theme-content-body-1}"
  promo-description.font-size: "{sherpa.font-size-body-small}"
  promo-chevron.color: "{sherpa.theme-content-body-1}"
$extensions:
  sherpa:
    figmaName: Navigation Item
    category: nav
    booleanProps:
      - hasIcon
      - hasIndicator
      - isMaximised
    jsProps:
      - name: templateId
        type: string
        access: read
      - name: current
        type: string
        access: read-write
      - name: expanded
        type: string
        access: read-write
