# sherpa-nav-item — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-nav-item.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-nav-item
$description: a single navigation row.
element:
  $type: element
  tag: a
  provides:
    - navigation
    - keyboard
    - focus
templates:
  - default
  - promo
anatomy:
  root:
    el: a
    class: row
    part: row
    children:
      - el: span
        class: icon
        part: icon
        attrs:
          aria-hidden: "true"
      - el: span
        class: label
        part: label
      - el: span
        class: badge
        part: badge
        slot: trailing
props:
  - $type: prop
    name: data-badge
    type: string
    kind: visibility
    description: trailing count/badge text
  - $type: prop
    name: data-current
    type: string
    kind: style
    description: current item in the nav set
  - $type: prop
    name: data-description
    type: string
    kind: content
  - $type: prop
    name: data-href
    type: string
    kind: content
    description: render the row as a link
  - $type: prop
    name: data-icon
    type: string
    kind: visibility
    description: leading icon glyph (text/emoji)
  - $type: prop
    name: data-label
    type: string
    kind: content
    description: row label text
  - $type: prop
    name: data-status-dot
    type: string
    kind: style
    description: >-
      render the trailing chip as a small success/online dot data-description promo description
      (promo variant only)
  - $type: prop
    name: data-variant
    type: string
    kind: style
    description: "\"promo\" for the CTA row"
  - $type: prop
    name: disabled
    type: boolean
    native: true
    default: false
    description: >-
      disabled state The current row fills surface/interactive/active/base with content/active/base
      ink (the brand accent). The trailing chip is a round status element filled by the ancestor
      [data-status] cascade; a plain success dot pins the success ink.
states:
  - $type: state
    name: icon
    selector: ":host([data-icon])"
  - $type: state
    name: badge
    selector: ":host([data-badge])"
  - $type: state
    name: has-trailing
    selector: ":host([data-has-trailing])"
  - $type: state
    name: status-dot
    selector: ":host([data-status-dot])"
  - $type: state
    name: current
    selector: ":host([data-current])"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
  - $type: state
    name: focus-visible
    selector: ":focus-visible"
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (templateId, current). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: item-click
    bubbles: true
    composed: true
  - $type: event
    name: href
    bubbles: true
    composed: true
tokens:
  row.gap: "{sherpa.structure-space-gap}"
  row.padding: "{sherpa.theme-padding-xs}"
  row.border-radius: "{sherpa.display-border-rounding-base}"
  row.color: "{sherpa.style-content-base}"
  row.font-size: "{sherpa.font-size-body-base}"
  row.font-weight: "{sherpa.font-weight-medium}"
  icon.inline-size: "{sherpa.theme-size-icon-xs}"
  badge.padding-inline: "{sherpa.display-space-2xs}"
  badge.min-inline-size: "{sherpa.display-size-md}"
  badge.block-size: "{sherpa.display-size-md}"
  badge.border-radius: "{sherpa.display-border-rounding-full}"
  badge.background: "{sherpa.theme-surface-active-base}"
  badge.color: "{sherpa.theme-content-body-base-fixed}"
  badge.font-size: "{sherpa.font-size-body-small}"
  badge.font-weight: "{sherpa.font-weight-semibold}"
  promo.gap: "{sherpa.structure-space-gap}"
  promo.padding: "{sherpa.theme-padding-sm}"
  promo.border-radius: "{sherpa.display-border-rounding-base}"
  promo.background: "{sherpa.style-surface-base}"
  promo.color: "{sherpa.style-content-base}"
  promo-icon.inline-size: "{sherpa.display-size-lg}"
  promo-icon.block-size: "{sherpa.display-size-lg}"
  promo-icon.border-radius: "{sherpa.display-border-rounding-xl}"
  promo-icon.background: "{sherpa.theme-surface-active-base}"
  promo-icon.color: "{sherpa.theme-content-active-base}"
  promo-body.gap: "{sherpa.display-space-none}"
  promo-heading.color: "{sherpa.style-content-base}"
  promo-heading.font-size: "{sherpa.font-size-body-base}"
  promo-heading.font-weight: "{sherpa.font-weight-semibold}"
  promo-description.color: "{sherpa.theme-content-body-1}"
  promo-description.font-size: "{sherpa.font-size-body-small}"
  promo-chevron.color: "{sherpa.theme-content-body-1}"
$extensions:
  sherpa:
    figmaName: Navigation Item
    category: nav
    booleanProps:
      - hasIcon
      - hasIndicator
      - isMaximised
    jsProps:
      - name: templateId
        type: string
        access: read
      - name: current
        type: string
        access: read-write
