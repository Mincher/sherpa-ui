# sherpa-input-text — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-input-text.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-input-text
$description: >-
  A text field. The default style is the full form-field molecule (label + description + control +
  validation + helper); the minimal style is a bare inline field (optional label beside the control)
  for dense placements like a grid column filter (data-borderless drops the border).
element:
  $type: element
  tag: label
  provides:
    - click-forwarding
templates:
  - default
  - multiline
  - minimal
anatomy:
  root:
    el: label
    class: field
    part: field
    children:
      - el: span
        class: label
        part: label
      - el: span
        class: description
        part: description
      - el: span
        class: control-row
        part: control-row
        children:
          - el: span
            class: icon icon-start
            part: icon-start
            attrs:
              aria-hidden: "true"
          - el: input
            class: control
            part: control
            attrs:
              type: text
          - el: span
            class: icon icon-end
            part: icon-end
            attrs:
              aria-hidden: "true"
          - el: span
            class: actions
            part: actions
            slot: actions
      - el: span
        class: message
        part: message
props:
  - $type: prop
    name: data-borderless
    type: string
    kind: style
    description: drop the control border (minimal style)
  - $type: prop
    name: data-description
    type: string
    kind: content
    default: style
    description: helper text under the label
  - $type: prop
    name: data-error
    type: string
    kind: content
    default: style
    description: validation message — shown as a filled critical bar
  - $type: prop
    name: data-icon-end
    type: string
    kind: content
    description: trailing icon glyph inside the control row (CSS-gated)
  - $type: prop
    name: data-icon-start
    type: string
    kind: content
    description: leading icon glyph inside the control row (CSS-gated)
  - $type: prop
    name: data-label
    type: string
    kind: content
    description: field label (hidden when empty)
  - $type: prop
    name: data-multiline
    type: string
    kind: style
    default: style only
    description: auto-growing <textarea>
  - $type: prop
    name: data-type
    type: string
    kind: style
    default: is the full molecule
    description: "\"minimal\" for the bare inline field"
  - $type: prop
    name: placeholder
    type: string
    native: true
    description: native placeholder
  - $type: prop
    name: value
    type: string
    native: true
    description: native value (also a JS property)
states:
  - $type: state
    name: has-actions
    selector: ":host([data-has-actions])"
  - $type: state
    name: icon-start
    selector: ":host([data-icon-start])"
  - $type: state
    name: icon-end
    selector: ":host([data-icon-end])"
  - $type: state
    name: error
    selector: ":host([data-error])"
  - $type: state
    name: borderless
    selector: ":host([data-borderless])"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
  - $type: state
    name: focus-visible
    selector: .control:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (templateId, value). See $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: >-
      callable from a view definition's state block (validate, formResetCallback,
      formStateRestoreCallback, checkValidity, focus). See $extensions.sherpa.methods.
events:
  - $type: event
    name: input
    bubbles: true
    composed: true
  - $type: event
    name: change
    bubbles: true
    composed: true
tokens:
  field.gap: "{sherpa.theme-gap-sm}"
  label.font-size: "{sherpa.font-size-body-small}"
  label.font-weight: "{sherpa.font-weight-medium}"
  label.line-height: "{sherpa.theme-content-line-height-small}"
  label.color: "{sherpa.theme-content-body-base}"
  description.font-size: "{sherpa.font-size-body-small}"
  description.line-height: "{sherpa.theme-content-line-height-small}"
  description.color: "{sherpa.theme-content-body-2}"
  control-row.gap: "{sherpa.structure-space-gap}"
  control-row.min-block-size: "{sherpa.display-mode-size-2xl}"
  control-row.padding-inline: "{sherpa.structure-space-padding}"
  control-row.border-block-start-width: "{sherpa.border-top}"
  control-row.border-block-end-width: "{sherpa.border-bottom}"
  control-row.border-inline-start-width: "{sherpa.border-left}"
  control-row.border-inline-end-width: "{sherpa.border-right}"
  control-row.border-start-start-radius: "{sherpa.border-rounding-top-left}"
  control-row.border-start-end-radius: "{sherpa.border-rounding-top-right}"
  control-row.border-end-start-radius: "{sherpa.border-rounding-bottom-left}"
  control-row.border-end-end-radius: "{sherpa.border-rounding-bottom-right}"
  control-row.background: "{sherpa.theme-surface-default-base}"
  control.padding-block: "{sherpa.theme-padding-sm}"
  control.color: "{sherpa.theme-content-body-base}"
  control.font-size: "{sherpa.font-size-body-base}"
  control.line-height: "{sherpa.theme-content-line-height-base}"
  icon.inline-size: "{sherpa.theme-size-icon-xs}"
  icon.block-size: "{sherpa.theme-size-icon-xs}"
  icon.font-size: "{sherpa.theme-size-icon-xs}"
  icon.color: "{sherpa.theme-content-body-1}"
  actions.gap: "{sherpa.structure-space-gap}"
  message.padding: "{sherpa.theme-padding-xs}"
  message.border-radius: "{sherpa.border-rounding-bottom-right}"
  message.font-size: "{sherpa.font-size-body-base}"
  message.line-height: "{sherpa.theme-content-line-height-base}"
  field-minimal.gap: "{sherpa.display-mode-space-xs}"
$extensions:
  sherpa:
    figmaName: Input Field (atom)
    methods:
      - $type: method
        name: validate
        args: ""
        description: Check this field and show the result.
      - $type: method
        name: formResetCallback
        args: ""
        description: "`form.reset()` — put the value back and clear any message."
      - $type: method
        name: formStateRestoreCallback
        args: "state: string"
        description: The browser restoring a value — a back-button navigation, or a session
      - $type: method
        name: checkValidity
        args: ""
        description: Native validity, surfaced for form logic.
      - $type: method
        name: focus
        args: ""
    category: control
    variantAxes:
      - name: State
        values:
          - error
          - default
    booleanProps:
      - hasLeadingIcon
      - hasTrailingIcon
      - hasActions
    divergence:
      note: >-
        2026-08-26: In Figma the component is LIGHTWEIGHT — "Input Field" is just the control box
        (leading/trailing icon + value), with State variants (default / error) carrying only style.
        Label, description, helper, and validation text are NOT in the component: they are external
        Typography text placed around the field in the "Example Template - Vertical/Horizontal"
        frames on the Input page (same approach as Fieldset). Intentionally NOT 1:1 with this web
        component, whose default style is the full form-field molecule (label + description +
        control + validation + helper). Public API (data-label/description/error, input/change) is
        unchanged on the code side.
      oneToMany:
        figmaComponent: Input Field
        note: >-
          1 Figma component → MANY HTML input types. The "Input Field" box (Figma COMPONENT_SET, id
          645:69690) is a SUBCOMPONENT: every input type is its OWN Figma component set that
          contains an Input Field INSTANCE (icons/value swapped per type). HTML has a SEPARATE
          element per type (<input type=…>, <select>, <textarea>). Each type component set has a
          `Layout` axis = vertical (label above) | horizontal (label beside). They live on the "✅
          Input" page in the "Input Types" SECTION. The "Template /" prefix was dropped 2026-08-26 —
          these are accepted as real components, not detach-only templates. Each code component
          shares figmaName "Input Field" (same pattern as the 3 "Data Field" chart components
          sharing one Figma primitive).
        figmaSubcomponent: Input Field
        horizontalLayout: >-
          Layout=horizontal is a GRID, cols [0.5fr label][1fr content], rows [FIXED 32][FLEX]. col0
          row0 = label (right-aligned, HUG width, vertical-center, sat against the field). col1
          (spanning) = a SINGLE VERTICAL wrapper frame ("Frame 3", gap 4) holding Input Field +
          description + helper. STANDARD SET BY Input Number, applied to all 7 on 2026-08-26 (Will).
          WHY the wrapper: Figma GRID auto-layout does NOT remove empty rows when set to HUG, so
          putting description/helper as separate grid cells left dead rows. Wrapping them (with
          Input Field) in one vertical frame in col1 sidesteps that — the grid is just label |
          content-stack. Text Area uses the same wrapper; its Input Field keeps the resize recipe
          (value FILL-width/HUG-height/ TOP, field counterAxis AUTO) so it still grows multi-line
          inside the wrapper. BUILD TIP: don't hand-restructure the old separate-cell layout in
          place (grid row-count fights back, corrupts). Instead CLONE the known-good Input Number
          horizontal, retext, swap icons, then replace the set's horizontal variant.
        types:
          - figmaComponent: Input Text
            html: <input type="text">
            codeComponent: sherpa-input-text
          - figmaComponent: Input Number
            html: <input type="number">
            codeComponent: sherpa-input-number
            note: value right-aligned, trailing stepper glyph
          - figmaComponent: Input Select
            html: <select>
            codeComponent: sherpa-select
            note: trailing chevron-down; value = chosen option
          - figmaComponent: Input Search
            html: <input type="search">
            codeComponent: sherpa-input-search
            note: leading magnifier glyph
          - figmaComponent: Input Date
            html: <input type="date">
            codeComponent: sherpa-input-date
            note: trailing calendar glyph
          - figmaComponent: Input Password
            html: <input type="password">
            codeComponent: sherpa-input-password
            note: value = dots; reveal (eye) toggle TODO — no eye glyph in the icon set yet
          - figmaComponent: Text Area
            html: <textarea>
            codeComponent: sherpa-textarea
            note: >-
              Input Field with the height restriction removed — field fills width & grows height,
              value top-aligned/wrapping
    jsProps:
      - name: templateId
        type: string
        access: read
      - name: value
        type: string
        access: read-write
