<!--
  sherpa-input-text — a labelled text field.
  Templates: default (label + description + control + message), multiline
  (auto-growing <textarea>), minimal (bare inline field, no description/message).

  Public API:
    data-type        "minimal" for the bare inline field (default is the full molecule)
    data-borderless   drop the control border (minimal style)
    data-multiline    auto-growing <textarea> (default style only)
    data-label        field label (hidden when empty)
    data-description   helper text under the label (default style)
    data-error        validation message — shown as a filled critical bar (default style)
    data-icon-start    leading icon glyph inside the control row (CSS-gated)
    data-icon-end      trailing icon glyph inside the control row (CSS-gated)
    placeholder       native placeholder
    value             native value (also a JS property)
    data-rules        names a validation rule the platform has no idea about
                      (e.g. "email") — see the TS for the rule set
    name / required / disabled / readonly / minlength / maxlength / pattern / inputmode / autocomplete
                      native attributes, reflected to the inner control

  Slots:
    actions           trailing controls in the field row (steppers, buttons); CSS-gated

  Fires: input, change (re-dispatched from the inner control)
-->
<template id="default">
  <label class="field" part="field">
    <span class="label" part="label"></span>
    <span class="description" part="description"></span>
    <span class="control-row sherpa-border-edges" part="control-row">
      <span class="icon sherpa-icon-box icon-start" part="icon-start" aria-hidden="true"></span>
      <input class="control" part="control" type="text" />
      <span class="icon sherpa-icon-box icon-end" part="icon-end" aria-hidden="true"></span>
      <!-- Opt-in with data-clearable; CSS reveals it off data-has-value. -->
      <button class="clear" part="clear" type="button" tabindex="-1"
              aria-label="Clear">
        <i class="sherpa-icon-box" data-icon="cross" aria-hidden="true"></i>
      </button>
      <span class="actions" part="actions"><slot name="actions"></slot></span>
    </span>
    <span class="message" part="message"></span>
  </label>
</template>

<template id="multiline">
  <label class="field" part="field">
    <span class="label" part="label"></span>
    <span class="description" part="description"></span>
    <span class="control-row sherpa-border-edges" part="control-row">
      <span class="icon sherpa-icon-box icon-start" part="icon-start" aria-hidden="true"></span>
      <textarea class="control" part="control" rows="3"></textarea>
      <span class="icon sherpa-icon-box icon-end" part="icon-end" aria-hidden="true"></span>
      <!-- Opt-in with data-clearable; CSS reveals it off data-has-value. -->
      <button class="clear" part="clear" type="button" tabindex="-1"
              aria-label="Clear">
        <i class="sherpa-icon-box" data-icon="cross" aria-hidden="true"></i>
      </button>
      <span class="actions" part="actions"><slot name="actions"></slot></span>
    </span>
    <span class="message" part="message"></span>
  </label>
</template>

<!-- A SELECT is the same field with a different control: one of a known set,
     so the platform's own element does the work. `populate([{value,label}])`
     fills it; a caret is drawn in CSS because the native one ignores padding. -->
<template id="select">
  <label class="field" part="field">
    <span class="label" part="label"></span>
    <span class="description" part="description"></span>
    <span class="control-row sherpa-border-edges" part="control-row">
      <span class="icon sherpa-icon-box icon-start" part="icon-start" aria-hidden="true"></span>
      <select class="control" part="control"></select>
      <span class="icon sherpa-icon-box icon-end" part="icon-end" aria-hidden="true"></span>
      <!-- Opt-in with data-clearable; CSS reveals it off data-has-value. -->
      <button class="clear" part="clear" type="button" tabindex="-1"
              aria-label="Clear">
        <i class="sherpa-icon-box" data-icon="cross" aria-hidden="true"></i>
      </button>
      <span class="actions" part="actions"><slot name="actions"></slot></span>
    </span>
    <span class="message" part="message"></span>
  </label>
</template>

<template id="minimal">
  <label class="field field-minimal" part="field">
    <span class="label" part="label"></span>
    <input class="control" part="control" type="text" />
  </label>
</template>
