name: sherpa-input-text
figmaName: Input Field (atom)
category: control
description: >-
  A text field. The default style is the full form-field molecule (label + description + control +
  validation + helper); the minimal style is a bare inline field (optional label beside the control)
  for dense placements like a grid column filter (data-borderless drops the border).
generated: false
props:
  data-label:
    kind: content
  data-description:
    kind: content
  data-error:
    kind: style
templates:
  - data-multiline
  - multiline
  - default
events:
  input: {}
  change: {}
parts:
  - field
  - label
  - description
  - control
  - message
tokens:
  field:control-space-gap-base: control-space-gap-base
  label:core-fonts-scale-base: core-fonts-scale-base
  label:core-fonts-weight-600: core-fonts-weight-600
  label:content-title-base: content-title-base
  description:core-fonts-scale-sm: core-fonts-scale-sm
  description:content-secondary-base: content-secondary-base
  description:control-space-padding-xs: control-space-padding-xs
  control:core-size-2xl: core-size-2xl
