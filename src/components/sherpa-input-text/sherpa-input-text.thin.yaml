  control:control-space-padding-md: control-space-padding-md
  control:control-border-width: control-border-width
  control:input-border-radius-top-left: input-border-radius-top-left
  control:surface-primary-base: surface-primary-base
  control:content-primary-base: content-primary-base
  control:core-fonts-scale-lg: core-fonts-scale-lg
  message:core-fonts-scale-sm: core-fonts-scale-sm
