# sherpa-empty-state — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-empty-state.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-empty-state
$description: a centred placeholder for a blank list, grid, or region.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  root:
    el: div
    class: empty
    part: empty
    children:
      - el: div
        class: icon
        part: icon
        attrs:
          aria-hidden: "true"
        children:
          - slot: icon
            children:
              - el: span
                class: glyph
      - el: div
        class: heading
        part: heading
        children:
          - el: h2
            class: title
            part: title
          - el: div
            class: message
            part: message
            children:
              - slot: ""
                children:
                  - el: p
                    class: message-text
                    part: message-text
      - el: div
        class: actions
        part: actions
        children:
          - slot: action
            attrs:
              data-accepts: control
      - el: div
        class: small-print
        part: small-print
        children:
          - slot: small-print
            attrs:
              data-accepts: text
            children:
              - el: p
                class: small-print-text
                part: small-print-text
props:
  - $type: prop
    name: data-description
    type: string
    observed: false
    kind: content
    description: message text (rendered into .message-text)
  - $type: prop
    name: data-heading
    type: string
    observed: false
    kind: content
    description: heading text (rendered into .title)
  - $type: prop
    name: data-illustration
    type: string
    observed: false
    kind: style
    description: "built-in glyph: empty  | search | folder | data | error | success"
  - $type: prop
    name: data-size
    type: enum
    observed: false
    kind: style
    values:
      - sm
      - md
      - lg
    description: sm | md  | lg
  - $type: prop
    name: data-small-print
    type: string
    observed: false
    kind: content
    description: fine-print / help text (rendered into .small-print-text)
states:
  - $type: state
    name: has-icon
    selector: ":host([data-has-icon])"
  - $type: state
    name: empty
    selector: ":host([data-illustration=\"empty\"])"
  - $type: state
    name: search
    selector: ":host([data-illustration=\"search\"])"
  - $type: state
    name: folder
    selector: ":host([data-illustration=\"folder\"])"
  - $type: state
    name: data
    selector: ":host([data-illustration=\"data\"])"
  - $type: state
    name: error
    selector: ":host([data-illustration=\"error\"])"
  - $type: state
    name: success
    selector: ":host([data-illustration=\"success\"])"
  - $type: state
    name: has-content
    selector: ":host([data-has-content])"
  - $type: state
    name: has-action
    selector: ":host([data-has-action])"
  - $type: state
    name: small-print
    selector: ":host([data-small-print])"
  - $type: state
    name: has-small-print
    selector: ":host([data-has-small-print])"
  - $type: state
    name: sm
    selector: ":host([data-size=\"sm\"])"
  - $type: state
    name: lg
    selector: ":host([data-size=\"lg\"])"
  - $type: state
    name: not-heading
    selector: ":host(:not([data-heading]))"
tokens:
  empty.gap: "{sherpa.display-mode-space-base}"
  icon.padding: "{sherpa.theme-padding-md}"
  icon.border-radius: "{sherpa.display-mode-border-rounding-lg}"
  icon.background: "{sherpa.theme-surface-default-2}"
  icon.color: "{sherpa.theme-content-body-1}"
  glyph.font-family: "{sherpa.font-family-body}"
  glyph.font-weight: "{sherpa.font-weight-regular}"
  heading.gap: "{sherpa.display-mode-space-2xs}"
  title.color: "{sherpa.theme-content-body-base}"
  title.font-family: "{sherpa.font-family-body}"
  title.font-size: "{sherpa.font-size-body-base}"
  title.font-weight: "{sherpa.font-weight-regular}"
  title.line-height: "{sherpa.theme-content-line-height-base}"
  message.color: "{sherpa.theme-content-body-base}"
  message.font-family: "{sherpa.font-family-body}"
  message.font-size: "{sherpa.font-size-body-base}"
  message.line-height: "{sherpa.theme-content-line-height-base}"
  actions.gap: "{sherpa.display-mode-space-sm}"
  small-print.color: "{sherpa.theme-content-body-1}"
  small-print.font-family: "{sherpa.font-family-body}"
  small-print.font-size: "{sherpa.font-size-body-xs}"
  small-print.line-height: "{sherpa.theme-content-line-height-xs}"
$extensions:
  sherpa:
    figmaName: Empty State
    category: container
    booleanProps:
      - hasSmallPrint
      - hasActions
