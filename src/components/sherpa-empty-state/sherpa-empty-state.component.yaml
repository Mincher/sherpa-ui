# sherpa-empty-state — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-empty-state.{thin.yaml,html,css,ts}. The MECHANICAL surface only —
# props (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# Validated by schemas/component.v1.json; round-trips via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-empty-state
$description: a centred placeholder for a blank list, grid, or region.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  root:
    el: div
    class: empty
    part: empty
    children:
      - el: div
        class: icon
        part: icon
        attrs:
          aria-hidden: "true"
        children:
          - slot: icon
      - el: div
        class: heading
        part: heading
        children:
          - el: h2
            class: title
            part: title
          - el: div
            class: message
            part: message
            children:
              - slot: ""
      - el: div
        class: actions
        part: actions
        children:
          - slot: action
            attrs:
              data-accepts: control
props:
  - $type: prop
    name: data-description
    type: string
    kind: content
    description: >-
      message text (rendered into .message-text) data-illustration built-in glyph: empty  | search |
      folder | data | error | success
  - $type: prop
    name: data-size
    type: enum
    kind: style
    values:
      - sm
      - base
      - lg
    description: sm | base  | lg
  - $type: prop
    name: data-title
    type: string
    kind: content
    description: heading text (rendered into .title)
states:
  - $type: state
    name: has-icon
    selector: ":host([data-has-icon])"
  - $type: state
    name: empty
    selector: ":host([data-illustration=\"empty\"])"
  - $type: state
    name: search
    selector: ":host([data-illustration=\"search\"])"
  - $type: state
    name: folder
    selector: ":host([data-illustration=\"folder\"])"
  - $type: state
    name: data
    selector: ":host([data-illustration=\"data\"])"
  - $type: state
    name: error
    selector: ":host([data-illustration=\"error\"])"
  - $type: state
    name: success
    selector: ":host([data-illustration=\"success\"])"
  - $type: state
    name: has-content
    selector: ":host([data-has-content])"
  - $type: state
    name: has-action
    selector: ":host([data-has-action])"
  - $type: state
    name: sm
    selector: ":host([data-size=\"sm\"])"
  - $type: state
    name: lg
    selector: ":host([data-size=\"lg\"])"
  - $type: state
    name: not-title
    selector: ":host(:not([data-title]))"
events:
  - $type: event
    name: nothing
    bubbles: true
    composed: true
tokens:
  empty.gap: "{sherpa.display-space-base}"
  icon.color: "{sherpa.theme-content-body-1}"
  glyph.font-family: "{sherpa.font-family-body}"
  glyph.font-weight: "{sherpa.font-weight-regular}"
  heading.gap: "{sherpa.display-space-2xs}"
  title.color: "{sherpa.theme-content-body-base}"
  title.font-family: "{sherpa.font-family-body}"
  title.font-size: "{sherpa.font-size-heading-h2}"
  title.font-weight: "{sherpa.font-weight-semibold}"
  message.color: "{sherpa.theme-content-body-1}"
  message.font-family: "{sherpa.font-family-body}"
  message.font-size: "{sherpa.font-size-body-base}"
  actions.gap: "{sherpa.display-space-sm}"
$extensions:
  sherpa:
    figmaName: Empty State
    category: container
    booleanProps:
      - hasSmallPrint
      - hasActions
