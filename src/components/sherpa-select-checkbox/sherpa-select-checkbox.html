<!--
  sherpa-select-checkbox — a labelled checkbox. Native <input type="checkbox">;
  the visible box is drawn in CSS off :checked / :indeterminate / :disabled.

  `data-advanced` adds a caret opening a slotted menu of selection scenarios.
  The host slots the rows, because only the host knows what "all" means:

    <sherpa-select-checkbox data-advanced>
      <sherpa-menu slot="menu">
        <button value="page">Select all on page</button>
      </sherpa-menu>
    </sherpa-select-checkbox>

  Choosing one emits `selection-scenario`. The component REPORTS; the host applies.

  Public API:
    data-label        label text to the right of the box (or default slot)
    data-description   helper line below the label
    data-advanced      show the caret + its slotted menu
    checked           native checked state (also a JS property)
    indeterminate     mixed state (JS property → input.indeterminate; CSS :indeterminate)
    value             submitted value when checked (default "on")
    name / disabled / required
                      native attributes, mirrored to the inner control

  Fires:
    change — re-dispatched from the inner control. detail { checked, value, indeterminate }
    selection-scenario — a menu row was chosen. detail { value }
-->
<template id="default">
  <!-- The GROUP, not the label, is the host's child: a <button> inside a
       <label> would toggle the checkbox on every click. -->
  <div class="group sherpa-snap-group" part="group">
    <!-- `data-snap` describes this child; `.sherpa-snap-group` joins by
         POSITION, so a re-order survives. -->
    <span class="box sherpa-border-edges" part="box" data-snap="start">
      <label class="field" part="field">
        <input class="control" part="control" type="checkbox" />
        <span class="text" part="text">
          <span class="label" part="label"></span>
          <span class="description" part="description"></span>
          <slot></slot>
        </span>
      </label>
    </span>

    <!-- A real sherpa-button, not a hand-drawn one — T-compose-never-reimplement. -->
    <sherpa-button class="caret" part="caret" data-type="icon" data-size="sm"
                   data-snap="end"
                   data-icon-start="fa-solid fa-caret-down"
                   aria-haspopup="menu" aria-expanded="false"
                   aria-label="Selection options"></sherpa-button>
  </div>
  <!-- OUTSIDE the snap group: `:last-child` would round this slot instead of
       the caret. -->
  <slot name="menu"></slot>
</template>
