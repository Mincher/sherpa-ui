# sherpa-select-checkbox — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-select-checkbox.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-select-checkbox
$description: >-
  a labelled checkbox. Native <input type="checkbox">; the visible box is drawn in CSS off :checked
  / :indeterminate / :disabled.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: div
      class: group sherpa-group
      part: group
      children:
        - el: span
          class: box sherpa-border-edges
          part: box
          attrs:
            data-group: start
          children:
            - el: label
              class: field
              part: field
              children:
                - el: input
                  class: control
                  part: control
                  attrs:
                    type: checkbox
                - el: span
                  class: text
                  part: text
                  children:
                    - el: span
                      class: label
                      part: label
                    - el: span
                      class: description
                      part: description
                    - slot: ""
        - el: sherpa-button
          class: caret
          part: caret
          attrs:
            data-type: icon
            data-size: sm
            data-group: end
            data-icon-start: triangle-down
            aria-haspopup: menu
            aria-expanded: "false"
            aria-label: Selection options
    - slot: menu
props:
  - $type: prop
    name: data-advanced
    type: string
    observed: true
    kind: style
    description: show the caret + its slotted menu
  - $type: prop
    name: data-description
    type: string
    observed: false
    kind: content
    description: helper line below the label
  - $type: prop
    name: data-label
    type: string
    observed: false
    kind: content
    description: label text to the right of the box (or default slot)
  - $type: prop
    name: checked
    type: boolean
    observed: true
    native: true
    default: false
    description: native checked state (also a JS property)
  - $type: prop
    name: disabled
    type: boolean
    observed: false
    native: true
    default: false
    description: native attributes, mirrored to the inner control
  - $type: prop
    name: indeterminate
    type: string
    observed: true
    native: true
    description: mixed state (JS property → input.indeterminate; CSS :indeterminate)
  - $type: prop
    name: name
    type: string
    observed: false
    native: true
    description: native attributes, mirrored to the inner control
  - $type: prop
    name: value
    type: string
    observed: false
    native: true
    default: "\"on\""
    description: submitted value when checked
states:
  - $type: state
    name: advanced
    selector: ":host([data-advanced])"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
  - $type: state
    name: focus-visible
    selector: .control:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: >-
      read/write JS properties (checked, indeterminate, value, disabled). See
      $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: >-
      callable from a view definition's state block (checkValidity, reportValidity, focus). See
      $extensions.sherpa.methods.
events:
  - $type: event
    name: change
    bubbles: true
    composed: true
    detail:
      checked: unknown
      indeterminate: boolean
      value: unknown
  - $type: event
    name: selection-scenario
    bubbles: true
    composed: true
    detail:
      value: unknown
tokens:
  field.gap: "{sherpa.display-mode-space-xs}"
  field.color: "{sherpa.theme-content-body-base}"
  control.--_border: "{sherpa.style-border-base-1}"
  control.--_surface: "{sherpa.style-surface-base}"
  control.--_fill: "{sherpa.style-indicator-accent}"
  control.border-width: "{sherpa.display-mode-border-width-sm}"
  control.border-radius: "{sherpa.display-mode-border-rounding-sm}"
  text.gap: "{sherpa.display-mode-space-2xs}"
  label.color: "{sherpa.theme-content-body-1}"
  label.font-size: "{sherpa.font-size-body-base}"
  label.font-weight: "{sherpa.font-weight-medium}"
  label.line-height: "{sherpa.theme-content-line-height-base}"
  description.color: "{sherpa.style-content-secondary}"
  description.font-size: "{sherpa.font-size-body-small}"
  description.line-height: "{sherpa.theme-content-line-height-small}"
$extensions:
  sherpa:
    figmaName: Select Checkbox
    methods:
      - $type: method
        name: checkValidity
        args: ""
      - $type: method
        name: reportValidity
        args: ""
        description: Check, and show the browser's message on the box.
      - $type: method
        name: focus
        args: "options?: FocusOptions"
    category: control
    booleanProps:
      - hasDescription
    divergence:
      note: >-
        2026-08-27: FORMALISED as a real Figma COMPONENT again (was briefly a detach-only template).
        "Select Checkbox" = a Basic Checkbox INSTANCE (the shared subcomponent) + label +
        description, with label/description TEXT props + a hasDescription toggle. Kept as a
        component for design↔code parity with sherpa-select-checkbox. The checked/indeterminate
        state lives on the Basic Checkbox subcomponent. See
        [[sherpa-fieldset-checkbox-radio-templates]] for the earlier template history.
    jsProps:
      - name: checked
        type: string
        access: read-write
      - name: indeterminate
        type: string
        access: read-write
      - name: value
        type: string
        access: read-write
      - name: disabled
        type: string
        access: read-write
