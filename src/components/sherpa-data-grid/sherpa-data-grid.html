<!--
  sherpa-data-grid — a sortable data table.

  populate({ columns, rows }) where columns is [{ field, header?, type?, sortable? }]
  and rows is an array of records. Header cells and body rows are stamped from
  cloning prototypes. Clicking a sortable header sorts by that field (asc → desc →
  asc) and reflects data-sort-field / data-sort-direction on the host. Clicking a
  row emits row-click.

  Composes the Grid Cell model (Figma 926:34253): a leading selection checkbox
  column (data-selectable) and a secondary filter-input header row (data-filterable)
  are both opt-in and CSS-gated — the columns/rows exist in the template always and
  CSS reveals them off the host attribute.

  Typing in a filter input narrows the visible rows to those whose value in THAT
  column contains the typed text, case-insensitively. Several columns filter
  together (every active filter must match). The grid does this itself — it holds
  the row records, so making the caller re-populate on every keystroke would be
  slower and would lose the caller's own sort/selection state. filter-change still
  fires for callers that want to drive a server-side query instead.

  A populated filter shows a trailing clear button. CSS reveals it off the cell's
  data-has-value flag, so JS only writes state.

  data-group-field names a column to GROUP by. Its rows are bunched by their value
  in that column and each bunch gets a collapsible group row on top (Figma Grid Cell
  Type=group) carrying that value as its label. The grouped column itself drops out
  of the header and the rows — its value is the heading now.

  Public API:
    data-sort-field / data-sort-direction   current sort (asc | desc)
    data-group-field                         group rows by this column
    data-selectable                          show a leading selection column
    data-select     multiple (default) | single — single draws RADIOS, holds one
                    row, and shows no control in the header: "select all" is
                    meaningless where only one can be chosen
    data-filterable                          show a secondary header row of filter inputs
    data-column-filters                      a filter button in each column heading
    data-filter-fields                       space-separated fields an EXTERNAL filter
                    is narrowing; those columns' headings take data-status="active".
                    Written by SherpaDataSource — a host driving the grid by hand
                    can write it too.

  JS API — what a person can do by clicking, a caller can do by calling. This is
  what lets a SAVED VIEW, a preset or an agent configure a grid:
    setColumnFilter(field, clause)  set one column's filter from a store FilterClause
    columnClause(field)            read it back — the same clause, for saving
    suspendColumnFilter(field, on) keep the clause but stop applying it
    clearColumnFilter(field?)      delete one, or all
    openColumnFilter(field, anchor) open that column's menu, anchored anywhere
    select(keys) / clearSelection() set the selection BY KEY (needs `key` in populate)
    selectedKeys / selectedRecords read it back

  Column widths: each column is drawn at a fixed width so long labels TRUNCATE
  rather than stretch the column. A column takes `width` from its config, else the
  default; dragging the grip on a header's trailing edge resizes it, clamped
  between SherpaDataGrid.MIN_COL_WIDTH and MAX_COL_WIDTH.

  Fires:
    column-resize    — detail: { field, width }
    sort-change      — detail: { field, direction }
    row-click        — detail: { index, row }
    selection-change — detail: { selected: string[] }   (row indices as strings —
                       for a SAVED selection read `selectedKeys`, since an index
                       means something different after any sort)
    column-filter-change — detail: { field, header, op, value, from, to, clause, label }
    filter-change    — detail: { field, value, filters, visible }
    group-toggle     — detail: { value, collapsed }
-->
<template id="default">
  <!--
    The scroll box. A <table> cannot be the scroll container itself — giving it
    `display: block` to make it scrollable takes it out of table layout and its
    columns stop lining up. So the table keeps `display: table` and this wrapper
    owns the overflow, which is also what lets `position: sticky` on the <thead>
    pin against a real scrolling ancestor.
  -->
  <div class="scroller" part="scroller">
  <table class="grid" part="grid">
    <!--
      The <colgroup> is what makes a column's width a SETTING rather than a
      measurement. With `table-layout: fixed` the browser reads each column's
      size from its <col> and stops sizing to the widest cell, so a long label
      truncates inside its column instead of stretching it.

      The leading <col> matches the fixed select column; JS stamps one more per
      drawn column from the prototype below.
    -->
    <colgroup class="cols">
      <col class="select-col" />
    </colgroup>
    <thead class="head" part="head">
      <tr class="head-row">
        <th class="select-cell select-head" scope="col">
          <input class="select-all" type="checkbox" aria-label="Select all rows" />
        </th>
      </tr>
      <tr class="filter-row">
        <th class="select-cell filter-spacer" scope="col" aria-hidden="true"></th>
      </tr>
    </thead>
    <tbody class="body" part="body"></tbody>
  </table>
  </div>
  <div class="empty" part="empty" role="status">
    <slot name="empty">No rows to display.</slot>
  </div>

  <!-- Shown when a column filter matches nothing. Distinct from `empty`, which is
       for a grid with no data at all and which hides the whole table. -->
  <div class="no-matches" part="no-matches" role="status">
    <slot name="no-matches">No rows match the current filters.</slot>
  </div>

  <template class="head-cell-tpl">
    <th class="head-cell" scope="col">
      <!--
        THE COLUMN FILTER — an icon-only <sherpa-quick-filter>, not a button of
        our own.

        A column filter is a button that opens a value menu, which is exactly
        what the chip already is. Rebuilding it here would mean a second
        popover, a second cross-shadow placement measurement and a second
        Apply footer, each free to drift from the toolbar's. `data-icon-only`
        strips the chip to its menu button and swaps the caret for a funnel;
        the column heading beside it names the field, so nothing is lost.

        A chip lives in the light DOM of whoever holds it, so its menu is a
        real popover in the top layer and escapes the grid's own scroller clip.

        The menu itself is stamped in by JS per column TYPE — text gets a
        condition + value pair, a number gets the range menu, a date gets a
        calendar — because only JS knows the column's type. The chip is in the
        template from the start either way; CSS hides it when the grid is not
        filterable.

        `data-plain` drops the button's face and ring while it is resting.
        Thirteen boxed buttons down a header row read as thirteen controls
        competing with the column names, and the names are what the reader
        came for. A chip that is ON keeps its full accent face.

        `data-locked` is required, not decoration. A chip derives its own
        on-state from its menu's CHECKED ROWS, and this menu has none — it
        holds a condition and a value. Unlocked, the chip read "no rows ticked"
        as "nothing filtered" and switched itself straight back off the instant
        Apply closed the menu. Locked, the on-state is the grid's to set, which
        is right: the grid is what knows whether a clause was kept.
      -->
      <!--
        The flex ROW. It has to be an inner wrapper rather than the <th>:
        `display: flex` on a table cell takes it out of table layout, the cell
        stops being a column, and the whole header row stacks down the page.
      -->
      <span class="head-row-inner">
        <!--
          LABEL, FILTER, SORT — in that order.

          The NAME leads, because the name is what the reader is looking for;
          the two controls follow it. The label keeps its <button>, so clicking
          the column name still sorts — the glyph beside it is an indicator,
          not a second control, and both are inside the one delegated click
          handler either way.
        -->
        <button class="head-btn" type="button">
          <span class="head-label"></span>
        </button>
        <sherpa-quick-filter class="head-filter" data-icon-only data-menu
                             data-no-value data-locked
                             data-plain></sherpa-quick-filter>
        <!--
          THE SORT CONTROL — a second icon-only chip, matching the filter one
          beside it.

          It carries NO MENU: a sort has nothing to pick, only a direction to
          cycle. So `data-menu` is absent and the caret opens nothing; the
          click cycles ascending → descending → off, exactly as the
          quick-filter toolbar's Sort chip does, and the glyph says which of
          the three it is in.

          `data-locked`, because the grid owns the on-state: a chip works its
          own out from ticked menu rows, and this one has no menu. The glyph
          itself is a Font Awesome class written by JS from the shared icon map
          — the one place Will's four Figma icons (group, sort-none,
          sort-ascending, sort-descending) are mapped.
        -->
        <sherpa-quick-filter class="head-sort" data-icon-only data-plain
                             data-no-value data-locked></sherpa-quick-filter>
      </span>
      <!--
        The resize grip. It sits on the header's TRAILING edge and drags that
        column wider or narrower. A <th> cannot take `resize` (that property only
        works on a scroll container), so the grip is its own box and JS does the
        arithmetic on pointer move.

        It is a plain <span>, not a <button>: it has no keyboard action and
        announcing "button" on every column would add one useless stop per column
        to the tab order. Keyboard users resize nothing here; the column already
        truncates rather than hides.
      -->
      <span class="resize-grip" part="resize-grip" aria-hidden="true"></span>
    </th>
  </template>

  <!--
    A COLUMN FILTER MENU. Cloned into a header's chip, one per filterable
    column. `data-commit` gives it the Apply / Cancel footer: a condition and a
    value are two decisions, and filtering on the half-built pair would query
    for "contains ''" on the first keystroke.
  -->
  <template class="head-menu-tpl">
    <sherpa-menu slot="menu" data-commit></sherpa-menu>
  </template>

  <!--
    A TEXT column's filter body: pick a condition, type a value.

    Both are real form controls, so the keyboard and screen-reader behaviour
    comes free and the menu's own Apply reads their values without the grid
    wiring a change listener per control.

    The <select> is EMPTY here and filled by JS from `OPS_FOR_TYPE` and
    `OP_LABELS` in src/core/store.ts — the one operator vocabulary every
    query-building surface reads.

    It used to be six hardcoded <option>s, with the numeric menu below holding
    six more. That is two copies of a list that also exists as `FilterOp` in
    the store, and a Filter Panel would have made a third. The keys ARE the
    operators, so what the control reports is already what the filter needs and
    no translation table can drift.

    The margins are INLINE for the reason the toolbar's rows carry theirs
    inline: this fragment is cloned into the CHIP's light DOM and slotted into
    the menu, so it sits in neither shadow tree and neither sheet reaches it.
  -->
  <template class="head-text-filter-tpl">
    <div class="head-filter-body">
      <!-- One <option> as a CLONING PROTOTYPE, the shape sherpa-pagination's
           rows <select> uses. JS clones it per operator; no createElement, and
           no structural innerHTML. -->
      <select class="head-filter-op" aria-label="Condition"><option></option></select>
      <input class="head-filter-value" type="text" aria-label="Value"
             placeholder="Value" />
    </div>
  </template>

  <!--
    THE RANGE SWITCH — the first row of a number or date filter menu.

    A number filter is "equals this" or "between these two"; a date filter is
    "on this day" or "between these two days". One menu with a mode, not two
    buttons the reader must choose between before they know which they want.
    The switch flips what the rows below it are.

    The same shape the quick-filter toolbar uses, deliberately: a reader who
    has met the toolbar's number chip already knows this control.
  -->
  <template class="head-range-tpl">
    <div class="head-filter-range" data-row>
      <sherpa-switch class="head-filter-range-switch" data-type="simple"></sherpa-switch>
      <span class="head-filter-range-label">Range</span>
    </div>
  </template>

  <!--
    A NUMBER column's filter body: one field when Range is off, two when it is
    on. BOTH pairs exist from the start and CSS reveals one, so flipping the
    switch is an attribute write rather than a rebuild — whatever was typed on
    the other side survives a flip back.

    A condition picker comes FIRST, as it does for text — filled by JS from the
    same shared vocabulary, with the NUMBER list this time. "between" is the
    RANGE mode rather than a seventh option, because a span needs two inputs
    and a single condition list cannot grow one.

    The inputs are bare number fields rather than sherpa-input-text: they sit in
    the chip's light DOM where neither component's sheet reaches them, so a
    composed component there would carry a shadow tree for a box this file
    could not style anyway.
  -->
  <template class="head-number-filter-tpl">
    <div class="head-filter-body">
      <!-- The cloning prototype again — see the text body above. -->
      <select class="head-filter-op" aria-label="Condition"><option></option></select>
      <input class="head-filter-value head-filter-num" type="number"
             inputmode="decimal" aria-label="Value" placeholder="Value" />
      <!--
        The RANGE shape: a two-ended slider, the same control the quick-filter
        toolbar's number chip uses. A pair of boxes would ask the reader to
        type two numbers before seeing anything; the slider shows the column's
        whole span and lets them close in on part of it.

        Its ends are the column's real min and max, computed from the rows —
        see #addColumnFilter. A slider with no bounds is a slider over 0..100,
        which for a spend column is every row on the far left.
      -->
      <sherpa-slider class="head-filter-slider" data-type="range"
                     data-show-value></sherpa-slider>
    </div>
  </template>

  <!--
    A DATE column's filter body: the CALENDAR, the same component the toolbar's
    date chip holds. `data-embedded` is what makes it sit inside a menu card
    rather than float as its own popover.

    `data-type="range"` is written by JS when the Range switch is on — the
    calendar already owns both shapes (one day, or a two-click start→end with
    the days between banded), so the switch re-points the calendar rather than
    swapping in a second one.

    No condition picker. A calendar answers "which day" by being clicked; a
    "greater than" over a date grid would be a second way of saying "after",
    with no place to show it.
  -->
  <template class="head-date-filter-tpl">
    <div class="head-filter-body">
      <sherpa-calendar class="head-filter-calendar" data-embedded></sherpa-calendar>
    </div>
  </template>

  <!-- One per drawn column. JS sets its inline-size; see .cols in the CSS. -->
  <template class="col-tpl">
    <col class="col" />
  </template>

  <!--
    A filter cell wraps its input so a trailing clear button can sit inside the
    field's box. The button exists in the template from the start; CSS reveals it
    off the cell's data-has-value flag, which the input handler writes.
  -->
  <template class="filter-cell-tpl">
    <th class="filter-cell" scope="col">
      <span class="filter-field sherpa-border-edges">
        <input class="filter-input" type="text" />
        <button class="filter-clear" type="button">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </span>
    </th>
  </template>

  <template class="row-tpl">
    <tr class="row">
      <td class="select-cell">
        <input class="row-select" type="checkbox" aria-label="Select row" />
      </td>
    </tr>
  </template>

  <!--
    A GROUP row — Figma Grid Cell `Type=group` (in the template at 926:35309). It
    spans every column, is 32 tall with padding 4 and gap 8, and holds a selection
    checkbox, a chevron toggle, then the group's value as its label.

    The grouped column's own cells are DROPPED from the rows below (the value is
    already the group's heading, so repeating it in every row is noise) and its
    header goes with them.

    The chevron is a real <button> with aria-expanded, so it is focusable and
    Enter/Space-activatable for free; CSS rotates it and hides the group's rows
    off the row's data-collapsed flag.
  -->
  <template class="group-row-tpl">
    <tr class="group-row">
      <!--
        The <td> stays a real table cell so its colspan keeps reserving every
        column; the flex row lives in an inner wrapper. Flexing the <td> itself
        takes it out of table layout, and the colspan stops holding the width.
      -->
      <td class="group-cell">
        <span class="group-inner">
          <input class="group-select" type="checkbox" aria-label="Select group" />
          <button class="group-toggle" type="button">
            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
          </button>
          <span class="group-label"></span>
          <span class="group-count"></span>
        </span>
      </td>
    </tr>
  </template>

  <template class="cell-tpl">
    <td class="cell"></td>
  </template>
</template>
