<!--
  sherpa-data-grid — a sortable, filterable, groupable data table.

  populate({ columns, rows, actions?, key? }) stamps header cells and body rows
  from cloning prototypes. Selection, filter row, actions column and group rows
  all exist in the template always; CSS reveals them off host attributes.

  Filtering is done HERE, over the held rows, so a keystroke does not cost the
  caller a re-populate (and their sort/selection). filter-change still fires for
  a server-side query.

  While data-group-field is set the grid pages itself, by SCREEN LINES — a shut
  group is one line whatever it holds. A store's skip/take counts RECORDS and
  cannot know what is folded. Ungrouped, paging is the store's.

  Public API:
    data-sort-field / data-sort-direction   current sort (asc | desc)
    data-group-field                         group rows by this column
    data-scope                               ASKED of its provider: the Query scope its headings answer
    data-selectable                          show a leading selection column
    data-select     multiple (default) | single — single draws RADIOS, holds one
                    row, and shows no control in the header: "select all" is
                    meaningless where only one can be chosen
    data-filterable                          show a secondary header row of filter inputs
    data-column-filters                      a filter button in each column heading
    data-filter-fields                       space-separated fields an EXTERNAL filter
                    is narrowing; those columns' headings take data-status="active".
                    Written by SherpaDataSource — a host driving the grid by hand
                    can write it too.
    data-column-values  the WHOLE column's values, so a filter menu offers them
                    all even when the drawn rows carry only some: `field:a|b|c`
                    per entry, NEWLINE separated. A value no drawn row carries
                    sorts below a divider, dimmed but still selectable — that is
                    how a reader broadens a filter back out.
                    TRAP T-unavailable-value-sorts-below-a-divider
    data-needles    what an EXTERNAL filter MATCHED on, so its hits mark in the
                    cells: `field:op:value` per entry, NEWLINE separated. Written
                    by SherpaDataSource beside data-filter-fields. Only substring
                    ops appear — `eq` matched the whole value and `ne` matched by
                    absence, so neither leaves a span to point at.
                    TRAP T-a-needle-comes-from-either-direction
    data-page / data-page-size               the visual page, WHILE GROUPED only —
                    a page is data-page-size screen LINES, and a shut group is one.
                    Written by SherpaDataSource; the grid reports back the page
                    count it arrives at and never writes data-page itself.
    data-actions                             set BY populate() when `actions` is
                    non-empty; reveals the pinned trailing column. A host does not
                    write it.
    data-total-pages                         how many pages the host believes there
                    are. READ ONLY, and only to avoid re-reporting a count that has
                    not changed — the grid never writes it. Not observed: a change
                    to it is the ECHO of the grid's own report, and re-rendering on
                    it would be a loop.

  JS API — what a person can do by clicking, a caller can do by calling. This is
  what lets a SAVED VIEW, a preset or an agent configure a grid:
    setColumnFilter(field, clause)  set one column's filter from a store FilterClause
    columnClause(field)            read it back — the same clause, for saving
    suspendColumnFilter(field, on) keep the clause but stop applying it
    clearColumnFilter(field?)      delete one, or all
    openColumnFilter(field, anchor) open that column's menu, anchored anywhere
    select(keys) / clearSelection() set the selection BY KEY (needs `key` in populate)
    actionsFor(count)              the actions that apply to a selection of that size —
                    all of them for 1, only the `multi` ones for 2+, none for 0. A bulk
                    toolbar reads this so it cannot disagree with the row menu
    selectedKeys / selectedRecords read it back
    currentKey / current           the CURRENT row, the last one clicked, by key.
                    Setting currentKey is silent, as select() is
    neighbour(by) / stepCurrent(by) the row `by` away in drawn order; step moves
                    to it, and gives null at an end

  Column widths are fixed so long labels truncate; the header grip drags between
  SherpaDataGrid.MIN_COL_WIDTH and MAX_COL_WIDTH.

  Fires:
    column-resize    — detail: { field, width }
    sort-change      — detail: { field, direction }
    row-select       — detail: { index, row }
    selection-change — detail: { selected: string[] }   (row indices as strings —
                       for a SAVED selection read `selectedKeys`, since an index
                       means something different after any sort)
    column-filter-change — detail: { field, header, op, value, from, to, clause, label }
    filter-change    — detail: { field, value, filters, visible }
    group-toggle     — detail: { value, collapsed }
    row-action       — detail: { id, records }   an action was chosen, from the row
                       menu or a host's bulk bar. A REPORT: the grid never acts on
                       the record itself
    grid-pages-change — detail: { pages, page }   how many pages the CURRENT fold
                       state makes, while grouped. A REPORT, not a request: the
                       host owns data-page, and folding changes the count under it
-->
<template id="default">
  <!-- The wrapper owns the overflow: `display: block` on a <table> drops it out
       of table layout. Sticky <thead> also needs a real scrolling ancestor. -->
  <div class="scroller" part="scroller">
  <table class="grid" part="grid">
    <!-- With `table-layout: fixed` a column's width comes from its <col>, so a
         long label truncates. JS stamps one <col> per drawn column. -->
    <colgroup class="cols">
      <col class="select-col" />
      <!-- Always present; CSS hides it. JS never creates it. -->
      <col class="actions-col" />
    </colgroup>
    <thead class="head" part="head">
      <tr class="head-row">
        <th class="select-cell select-head" scope="col">
          <!-- Figma `Checkbox - Advanced` (1334:8173). `data-advanced` is set by
               JS when the grid has rows, so an empty grid shows a plain box. -->
          <sherpa-select-checkbox class="select-all" aria-label="Select all rows">
            <sherpa-menu slot="menu" data-align="start">
              <button value="page" type="button">Select all on page</button>
              <button value="all" type="button">Select all rows</button>
              <button value="none" type="button">Clear selection</button>
            </sherpa-menu>
          </sherpa-select-checkbox>
        </th>
        <!-- LAST in the row, so columns can change without re-ordering it. The
             text is a real heading for a screen reader; CSS hides it. -->
        <th class="actions-cell actions-head" scope="col">
          <span class="actions-label sherpa-truncate">Actions</span>
        </th>
      </tr>
      <tr class="filter-row">
        <th class="select-cell filter-spacer" scope="col" aria-hidden="true"></th>
        <th class="actions-cell filter-spacer" scope="col" aria-hidden="true"></th>
      </tr>
    </thead>
    <tbody class="body" part="body"></tbody>
  </table>
  </div>
  <div class="empty" part="empty" role="status">
    <slot name="empty">No rows to display.</slot>
  </div>

  <!-- Shown when a column filter matches nothing. Distinct from `empty`, which
       hides the whole table. -->
  <div class="no-matches" part="no-matches" role="status">
    <slot name="no-matches">No rows match the current filters.</slot>
  </div>

  <template class="head-cell-tpl">
    <th class="head-cell" scope="col">
      <!-- The flex row must be an inner wrapper: `display: flex` on a <th> takes
           the cell out of table layout and the header row stacks. -->
      <span class="head-row-inner">
        <button class="head-btn" type="button">
          <span class="head-label sherpa-truncate"></span>
        </button>
        <!-- A chip, not a button of our own — it already owns the popover, and
             in the light DOM its menu escapes the scroller clip. JS stamps the
             menu body per column TYPE. `data-locked` is required: a chip derives
             its on-state from CHECKED ROWS, and this menu has none, so unlocked
             it switches itself off the instant Apply closes. -->
        <sherpa-quick-filter class="head-filter" data-icon-only data-menu
                             data-no-value data-locked
                             data-plain></sherpa-quick-filter>
        <!-- Sort: no `data-menu` — a sort has nothing to pick, the click cycles
             asc → desc → off. `data-locked` for the reason above. -->
        <sherpa-quick-filter class="head-sort" data-icon-only data-plain
                             data-no-value data-locked></sherpa-quick-filter>
      </span>
      <!-- A <th> cannot take `resize` (scroll containers only), so JS does the
           arithmetic on pointer move. A <span>, not a <button>: no keyboard
           action, and one useless tab stop per column. -->
      <span class="resize-grip" part="resize-grip" aria-hidden="true"></span>
    </th>
  </template>

  <!-- Cloned into a header's chip, one per filterable column. `data-commit`
       gives it Apply / Cancel, so a half-built pair is not queried. -->
  <template class="head-menu-tpl">
    <sherpa-menu slot="menu" data-commit></sherpa-menu>
  </template>



  <!-- `data-embedded` makes the calendar sit in the menu card rather than float
       as its own popover; JS writes `data-type="range"` when Range is on. -->
  <template class="head-date-filter-tpl">
    <div class="head-filter-body">
      <sherpa-calendar class="head-filter-calendar" data-embedded></sherpa-calendar>
    </div>
  </template>

  <!-- One per drawn column. JS sets its inline-size; see .cols in the CSS. -->
  <template class="col-tpl">
    <col class="col" />
  </template>

  <!-- The clear button exists from the start; CSS reveals it off the cell's
       data-has-value flag, which the input handler writes. -->
  <template class="filter-cell-tpl">
    <th class="filter-cell" scope="col">
      <span class="filter-field sherpa-border-edges sherpa-border-corners">
        <input class="filter-input" type="text" />
        <button class="filter-clear sherpa-border-corners" type="button">
          <i class="sherpa-icon-box" data-icon="cross" aria-hidden="true"></i>
        </button>
      </span>
    </th>
  </template>

  <template class="row-tpl">
    <tr class="row">
      <td class="select-cell">
        <!-- REAL controls, not bare <input>s — a raw input draws the browser's
             own box. TRAP T-compose-never-reimplement. Both exist always and CSS
             reveals one: SINGLE wants a radio, and a checkbox cannot become one.
             TRAP T-every-element-in-the-template. -->
        <sherpa-select-checkbox class="row-select row-multi"
                                aria-label="Select row"></sherpa-select-checkbox>
        <sherpa-select-radio class="row-select row-one"
                             aria-label="Select this row"></sherpa-select-radio>
      </td>
      <!-- Data cells are appended BETWEEN these two by #renderBody, so the
           actions cell has to be moved to the end after they land. -->
      <td class="actions-cell">
        <button class="actions-trigger" type="button" aria-haspopup="menu"
                aria-expanded="false" aria-label="Row actions">
          <!-- fa-SOLID: the free set carries this glyph at weight 900 only, and a
               missing one is a tofu box with no warning — T-fa-pro-icons-fail-silently. -->
          <i class="sherpa-icon-box" data-icon="ellipses-vertical" aria-hidden="true"></i>
        </button>
      </td>
    </tr>
  </template>

  <!-- ONE MENU FOR THE WHOLE GRID, not one per row. The trigger that opened it
       is remembered, so `menu-select` knows the row.
       TRAP T-one-actions-menu-for-every-row. -->
  <sherpa-menu class="actions-menu" data-align="end"></sherpa-menu>

  <!-- Cloned per action. NO `slot` ATTRIBUTE: the menu's rows go in its DEFAULT
       slot, and a row carrying one is never projected — the card opens 14px tall
       with the buttons unrendered. -->
  <template class="action-item-tpl">
    <button class="action-item" type="button">
      <i class="action-icon" aria-hidden="true"></i>
      <span class="action-label"></span>
    </button>
  </template>

  <!-- A GROUP row — Figma Grid Cell `Type=group` (926:35309). The grouped
       column's own cells and header are DROPPED from the rows below. -->
  <template class="group-row-tpl">
    <tr class="group-row">
      <!-- The <td> stays a real cell so its colspan keeps reserving every
           column; flexing it would drop it out of table layout. -->
      <td class="group-cell">
        <span class="group-inner">
          <sherpa-select-checkbox class="group-select" aria-label="Select group"></sherpa-select-checkbox>
          <button class="group-toggle" type="button">
            <i class="sherpa-icon-box" data-icon="chevron-down" aria-hidden="true"></i>
          </button>
          <span class="group-label"></span>
          <span class="group-count"></span>
        </span>
      </td>
    </tr>
  </template>

  <template class="cell-tpl">
    <td class="cell"></td>
  </template>
</template>
