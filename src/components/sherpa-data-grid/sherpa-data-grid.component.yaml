$extensions:
  sherpa:
    figmaName: Grid Cell
    methods:
      - $type: method
        name: setColumnFilter
        args: "field: string, clause: unknown[] | null"
        description: Set one column's filter from OUTSIDE. TRAP
      - $type: method
        name: columnClause
        args: "field: string"
        description: One column's filter as a ready FilterClause, or null. TRAP
      - $type: method
        name: suspendColumnFilter
        args: "field: string, suspended = true"
        description: Suspend or resume, never lose. TRAP T-grid-suspend-is-not-clear.
      - $type: method
        name: openColumnFilter
        args: "field: string, anchor?: HTMLElement"
        description: Open one column's filter menu, anchored where the caller says. TRAP
      - $type: method
        name: clearColumnFilter
        args: "field?: string"
        description: Drop one column's heading filter from OUTSIDE; nothing drops them all.
      - $type: method
        name: actionsFor
        args: "count: number"
        description: "The actions for the CURRENT selection — one row: all; two or more: only"
      - $type: method
        name: select
        args: "keys: readonly string[]"
        description: Select exactly these rows, by key. TRAP T-grid-select-remembers-wanted-keys
      - $type: method
        name: clearSelection
        args: ""
        description: Select nothing. The same as `select([])`, said plainly.
    category: data
    variantAxes:
      - name: Type
        values:
          - cell
          - header
          - group
          - filter
    booleanProps:
      - hasCheckbox
      - hasActions
    divergence:
      note: >-
        The shipped code (sherpa-data-grid.ts) is a plain <table> — head row + body rows, sortable,
        no pinning/selection/per-column filters. This def + the Figma build capture the RICHER
        designed architecture (flat pinned columns). Reconcile later: either enrich the code to the
        column model, or scope the Figma component to match. Public API (data-sort-field/direction,
        grid-sort-change, row-click) is preserved on both sides.
    jsProps:
      - name: selectedRecords
        type: string
        access: read
      - name: selectedKeys
        type: string
        access: read
