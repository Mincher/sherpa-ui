# sherpa-data-grid — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-data-grid.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-data-grid
$description: >-
  A sortable, selectable data grid assembled from flat columns. A leading Selection column (pinned
  left) and a trailing Actions column (pinned right) bracket the data columns; a toolbar and a
  data-variant quick-filter toolbar sit above, pagination below. Rows are visual — each column is a
  vertical stack of cells, so the grid stays flat.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: div
      class: scroller
      part: scroller
      children:
        - el: table
          class: grid
          part: grid
          children:
            - el: colgroup
              class: cols
              children:
                - el: col
                  class: select-col
                - el: col
                  class: actions-col
            - el: thead
              class: head
              part: head
              children:
                - el: tr
                  class: head-row
                  children:
                    - el: th
                      class: select-cell select-head
                      attrs:
                        scope: col
                      children:
                        - el: sherpa-select-checkbox
                          class: select-all
                          attrs:
                            aria-label: Select all rows
                          children:
                            - el: sherpa-menu
                              attrs:
                                slot: menu
                                data-align: start
                              children:
                                - el: button
                                  attrs:
                                    value: page
                                    type: button
                                - el: button
                                  attrs:
                                    value: all
                                    type: button
                                - el: button
                                  attrs:
                                    value: none
                                    type: button
                    - el: th
                      class: actions-cell actions-head
                      attrs:
                        scope: col
                      children:
                        - el: span
                          class: actions-label sherpa-truncate
                - el: tr
                  class: filter-row
                  children:
                    - el: th
                      class: select-cell filter-spacer
                      attrs:
                        scope: col
                        aria-hidden: "true"
                    - el: th
                      class: actions-cell filter-spacer
                      attrs:
                        scope: col
                        aria-hidden: "true"
            - el: tbody
              class: body
              part: body
    - el: div
      class: empty
      part: empty
      slot: empty
      attrs:
        role: status
    - el: div
      class: no-matches
      part: no-matches
      slot: no-matches
      attrs:
        role: status
    - el: template
      class: head-cell-tpl
      children:
        - el: th
          class: head-cell
          attrs:
            scope: col
          children:
            - el: span
              class: head-row-inner
              children:
                - el: button
                  class: head-btn
                  attrs:
                    type: button
                  children:
                    - el: span
                      class: head-label sherpa-truncate
                - el: sherpa-quick-filter
                  class: head-filter
                  attrs:
                    data-icon-only: ""
                    data-menu: ""
                    data-no-value: ""
                    data-locked: ""
                    data-plain: ""
                - el: sherpa-quick-filter
                  class: head-sort
                  attrs:
                    data-icon-only: ""
                    data-plain: ""
                    data-no-value: ""
                    data-locked: ""
            - el: span
              class: resize-grip
              part: resize-grip
              attrs:
                aria-hidden: "true"
props:
  - $type: prop
    name: data-actions
    type: string
    kind: style
    description: >-
      set BY populate() when `actions` is non-empty; reveals the pinned trailing column. A host does
      not write it.
  - $type: prop
    name: data-column-filters
    type: string
    kind: style
    description: a filter button in each column heading
  - $type: prop
    name: data-column-values
    type: string
    kind: content
    description: >-
      the WHOLE column's values, so a filter menu offers them all even when the drawn rows carry
      only some: `field:a|b|c` per entry, NEWLINE separated. A value no drawn row carries sorts
      below a divider, dimmed but still selectable — that is how a reader broadens a filter back
      out. TRAP T-unavailable-value-sorts-below-a-divider
  - $type: prop
    name: data-filter-fields
    type: string
    kind: content
    description: >-
      space-separated fields an EXTERNAL filter is narrowing; those columns' headings take
      data-status="active". Written by SherpaDataSource — a host driving the grid by hand can write
      it too.
  - $type: prop
    name: data-filterable
    type: string
    kind: style
    description: show a secondary header row of filter inputs
  - $type: prop
    name: data-group-field
    type: string
    kind: content
    description: group rows by this column
  - $type: prop
    name: data-needles
    type: string
    kind: content
    description: >-
      what an EXTERNAL filter MATCHED on, so its hits mark in the cells: `field:op:value` per entry,
      NEWLINE separated. Written by SherpaDataSource beside data-filter-fields. Only substring ops
      appear — `eq` matched the whole value and `ne` matched by absence, so neither leaves a span to
      point at. TRAP T-a-needle-comes-from-either-direction
  - $type: prop
    name: data-page
    type: string
    kind: content
    description: >-
      the visual page, WHILE GROUPED only — a page is data-page-size screen LINES, and a shut group
      is one. Written by SherpaDataSource; the grid reports back the page count it arrives at and
      never writes data-page itself.
  - $type: prop
    name: data-page-size
    type: string
    kind: content
    description: >-
      the visual page, WHILE GROUPED only — a page is data-page-size screen LINES, and a shut group
      is one. Written by SherpaDataSource; the grid reports back the page count it arrives at and
      never writes data-page itself.
  - $type: prop
    name: data-select
    type: enum
    kind: content
    values:
      - multiple
      - single
    description: >-
      multiple  | single — single draws RADIOS, holds one row, and shows no control in the header:
      "select all" is meaningless where only one can be chosen
  - $type: prop
    name: data-selectable
    type: string
    kind: content
    description: show a leading selection column
  - $type: prop
    name: data-sort-direction
    type: string
    kind: content
    description: current sort (asc | desc)
  - $type: prop
    name: data-sort-field
    type: string
    kind: content
    description: current sort (asc | desc)
  - $type: prop
    name: data-total-pages
    type: string
    kind: style
    description: >-
      how many pages the host believes there are. READ ONLY, and only to avoid re-reporting a count
      that has not changed — the grid never writes it. Not observed: a change to it is the ECHO of
      the grid's own report, and re-rendering on it would be a loop. JS API — what a person can do
      by clicking, a caller can do by calling. This is what lets a SAVED VIEW, a preset or an agent
      configure a grid: setColumnFilter(field, clause)  set one column's filter from a store
      FilterClause columnClause(field)            read it back — the same clause, for saving
      suspendColumnFilter(field, on) keep the clause but stop applying it
      clearColumnFilter(field?)      delete one, or all openColumnFilter(field, anchor) open that
      column's menu, anchored anywhere select(keys) / clearSelection() set the selection BY KEY
      (needs `key` in populate) actionsFor(count)              the actions that apply to a selection
      of that size — all of them for 1, only the `multi` ones for 2+, none for 0. A bulk toolbar
      reads this so it cannot disagree with the row menu selectedKeys / selectedRecords read it back
      Column widths are fixed so long labels truncate; the header grip drags between
      SherpaDataGrid.MIN_COL_WIDTH and MAX_COL_WIDTH.
states:
  - $type: state
    name: empty
    selector: ":host([data-empty])"
  - $type: state
    name: selectable
    selector: ":host([data-selectable])"
  - $type: state
    name: advanced-select
    selector: ":host([data-advanced-select])"
  - $type: state
    name: single
    selector: ":host([data-select=\"single\"])"
  - $type: state
    name: filterable
    selector: ":host([data-filterable])"
  - $type: state
    name: no-matches
    selector: ":host([data-no-matches])"
  - $type: state
    name: column-filters
    selector: ":host([data-column-filters])"
  - $type: state
    name: resizing
    selector: ":host([data-resizing])"
  - $type: state
    name: actions
    selector: ":host([data-actions])"
  - $type: state
    name: focus-visible
    selector: .filter-input:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (selectedRecords, selectedKeys). See $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: >-
      callable from a view definition's state block (setColumnFilter, columnClause,
      suspendColumnFilter, openColumnFilter, clearColumnFilter, actionsFor, select, clearSelection).
      See $extensions.sherpa.methods.
events:
  - $type: event
    name: column-resize
    bubbles: true
    composed: true
    detail:
      field: unknown
      width: unknown
  - $type: event
    name: sort-change
    bubbles: true
    composed: true
    detail:
      direction: unknown
      field: boolean
  - $type: event
    name: row-click
    bubbles: true
    composed: true
    detail:
      index: unknown
      row: unknown
    trigger:
      "on": click
      node: .body
  - $type: event
    name: selection-change
    bubbles: true
    composed: true
    detail:
      records: unknown
      selected: unknown
  - $type: event
    name: column-filter-change
    bubbles: true
    composed: true
    detail:
      clause: unknown
      field: unknown
      from: unknown
      header: unknown
      label: unknown
      op: unknown
      to: unknown
      value: unknown
  - $type: event
    name: filter-change
    bubbles: true
    composed: true
    detail:
      field: unknown
      filters: unknown
      value: unknown
      visible: unknown
  - $type: event
    name: group-toggle
    bubbles: true
    composed: true
    detail:
      collapsed: unknown
      value: unknown
  - $type: event
    name: row-action
    bubbles: true
    composed: true
    detail:
      id: unknown
      records: unknown
  - $type: event
    name: grid-pages-change
    bubbles: true
    composed: true
    detail:
      page: unknown
      pages: unknown
  - $type: event
    name: menu-clear
    bubbles: true
    composed: true
