# sherpa-data-grid — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-data-grid.{thin.yaml,html,css,ts}. The MECHANICAL surface only —
# props (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# Validated by schemas/component.v1.json; round-trips via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-data-grid
$description: >-
  A sortable, selectable data grid assembled from flat columns. A leading Selection column (pinned
  left) and a trailing Actions column (pinned right) bracket the data columns; a toolbar and a
  data-variant quick-filter toolbar sit above, pagination below. Rows are visual — each column is a
  vertical stack of cells, so the grid stays flat.
element:
  $type: element
  tag: table
  provides: []
templates:
  - default
anatomy:
  root:
    el: table
    class: grid
    part: grid
    children:
      - el: thead
        class: head
        part: head
        children:
          - el: tr
            class: head-row
      - el: tbody
        class: body
        part: body
props:
  - $type: prop
    name: data-sort-direction
    type: string
    kind: content
    description: current sort (asc | desc)
  - $type: prop
    name: data-sort-field
    type: string
    kind: content
    description: current sort (asc | desc)
states:
  - $type: state
    name: empty
    selector: ":host([data-empty])"
  - $type: state
    name: focus-visible
    selector: .head-btn:focus-visible
events:
  - $type: event
    name: grid-sort-change
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .head-row
  - $type: event
    name: row-click
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .body
  - $type: event
    name: direction
    bubbles: true
    composed: true
  - $type: event
    name: row
    bubbles: true
    composed: true
tokens:
  head-cell.background: "{sherpa.theme-surface-default-2}"
  head-cell.border-block-end: "{sherpa.display-border-width-base}"
  head-btn.gap: "{sherpa.display-space-2xs}"
  head-btn.padding: "{sherpa.display-space-xs}"
  head-btn.font-weight: "{sherpa.font-weight-semibold}"
  head-btn.color: "{sherpa.theme-content-body-base}"
  cell.padding: "{sherpa.display-space-xs}"
  empty.padding: "{sherpa.display-space-2xl}"
  empty.color: "{sherpa.theme-content-body-1}"
$extensions:
  sherpa:
    figmaName: Grid Cell
    category: data
    variantAxes:
      - name: Type
        values:
          - cell
          - header
          - group
          - filter
    booleanProps:
      - hasCheckbox
      - hasActions
    divergence:
      note: >-
        The shipped code (sherpa-data-grid.ts) is a plain <table> — head row + body rows, sortable,
        no pinning/selection/per-column filters. This def + the Figma build capture the RICHER
        designed architecture (flat pinned columns). Reconcile later: either enrich the code to the
        column model, or scope the Figma component to match. Public API (data-sort-field/direction,
        grid-sort-change, row-click) is preserved on both sides.
