# sherpa-data-grid — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-data-grid.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-data-grid
$description: >-
  A sortable, selectable data grid assembled from flat columns. A leading Selection column (pinned
  left) and a trailing Actions column (pinned right) bracket the data columns; a toolbar and a
  data-variant quick-filter toolbar sit above, pagination below. Rows are visual — each column is a
  vertical stack of cells, so the grid stays flat.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: div
      class: scroller
      part: scroller
      children:
        - el: table
          class: grid
          part: grid
          children:
            - el: thead
              class: head
              part: head
              children:
                - el: tr
                  class: head-row
                  children:
                    - el: th
                      class: select-cell select-head
                      attrs:
                        scope: col
                      children:
                        - el: input
                          class: select-all
                          attrs:
                            type: checkbox
                            aria-label: Select all rows
                - el: tr
                  class: filter-row
                  children:
                    - el: th
                      class: select-cell filter-spacer
                      attrs:
                        scope: col
                        aria-hidden: "true"
            - el: tbody
              class: body
              part: body
    - el: div
      class: empty
      part: empty
      slot: empty
      attrs:
        role: status
    - el: div
      class: no-matches
      part: no-matches
      slot: no-matches
      attrs:
        role: status
    - el: template
      class: head-cell-tpl
      children:
        - el: th
          class: head-cell
          attrs:
            scope: col
          children:
            - el: button
              class: head-btn
              attrs:
                type: button
              children:
                - el: span
                  class: head-label
                - el: i
                  class: sort-icon
                  attrs:
                    aria-hidden: "true"
props:
  - $type: prop
    name: data-filterable
    type: string
    kind: style
    description: show a secondary header row of filter inputs
  - $type: prop
    name: data-group-field
    type: string
    kind: content
    description: group rows by this column
  - $type: prop
    name: data-selectable
    type: string
    kind: content
    description: show a leading checkbox column (select-all + per-row)
  - $type: prop
    name: data-sort-direction
    type: string
    kind: content
    description: current sort (asc | desc)
  - $type: prop
    name: data-sort-field
    type: string
    kind: content
    description: current sort (asc | desc)
states:
  - $type: state
    name: empty
    selector: ":host([data-empty])"
  - $type: state
    name: selectable
    selector: ":host([data-selectable])"
  - $type: state
    name: filterable
    selector: ":host([data-filterable])"
  - $type: state
    name: no-matches
    selector: ":host([data-no-matches])"
  - $type: state
    name: focus-visible
    selector: .select-all:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (selectedRecords). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: sort-change
    bubbles: true
    composed: true
  - $type: event
    name: direction
    bubbles: true
    composed: true
  - $type: event
    name: row-click
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .body
  - $type: event
    name: row
    bubbles: true
    composed: true
  - $type: event
    name: selection-change
    bubbles: true
    composed: true
  - $type: event
    name: filter-change
    bubbles: true
    composed: true
  - $type: event
    name: value
    bubbles: true
    composed: true
  - $type: event
    name: filters
    bubbles: true
    composed: true
  - $type: event
    name: visible
    bubbles: true
    composed: true
  - $type: event
    name: group-toggle
    bubbles: true
    composed: true
  - $type: event
    name: collapsed
    bubbles: true
    composed: true
tokens:
  head.background: "{sherpa.theme-surface-default-1}"
  head-row.background: "{sherpa.theme-surface-default-1}"
  filter-row.background: "{sherpa.theme-surface-default-1}"
  select-cell.inline-size: "{sherpa.display-mode-space-2xl}"
  select-cell.padding: "{sherpa.display-mode-space-2xs}"
  select-head.background: "{sherpa.theme-surface-default-1}"
  select-head.border-block-end: "{sherpa.border-bottom}"
  select-all.accent-color: "{sherpa.theme-border-accent-2}"
  row-select.accent-color: "{sherpa.theme-border-accent-2}"
  filter-cell.padding: "{sherpa.display-mode-space-2xs}"
  filter-cell.background: "{sherpa.style-surface-base-1}"
  filter-cell.border-block-end: "{sherpa.border-bottom}"
  filter-spacer.background: "{sherpa.style-surface-base-1}"
  filter-spacer.border-block-end: "{sherpa.border-bottom}"
  filter-field.padding: "{sherpa.display-mode-space-2xs}"
  filter-field.border-width: "{sherpa.style-border-width}"
  filter-field.border-radius: "{sherpa.border-rounding-top-left}"
  filter-input.font-family: "{sherpa.font-family-body}"
  filter-input.font-size: "{sherpa.font-size-body-base}"
  filter-input.font-weight: "{sherpa.font-weight-regular}"
  filter-input.line-height: "{sherpa.theme-content-line-height-base}"
  filter-input.color: "{sherpa.style-content-base}"
  filter-clear.inline-size: "{sherpa.theme-size-icon-xs}"
  filter-clear.block-size: "{sherpa.theme-size-icon-xs}"
  filter-clear.margin-inline-start: "{sherpa.display-mode-space-3xs}"
  filter-clear.border-radius: "{sherpa.border-rounding-top-left}"
  filter-clear.color: "{sherpa.theme-content-body-1}"
  filter-clear.font-size: "{sherpa.theme-content-size-small}"
  no-matches.padding: "{sherpa.display-mode-space-xs}"
  no-matches.color: "{sherpa.theme-content-body-1}"
  no-matches.font-size: "{sherpa.font-size-body-small}"
  no-matches.line-height: "{sherpa.theme-content-line-height-small}"
  head-cell.padding: "{sherpa.display-mode-space-2xs}"
  head-cell.background: "{sherpa.style-surface-base-1}"
  head-cell.border-block-end: "{sherpa.border-bottom}"
  head-btn.gap: "{sherpa.display-mode-space-2xs}"
  head-btn.padding: "{sherpa.display-mode-space-2xs}"
  head-btn.font-family: "{sherpa.font-family-body}"
  head-btn.font-size: "{sherpa.font-size-body-base}"
  head-btn.font-weight: "{sherpa.font-weight-regular}"
  head-btn.line-height: "{sherpa.theme-content-line-height-base}"
  head-btn.color: "{sherpa.theme-content-body-1}"
  sort-icon.inline-size: "{sherpa.theme-size-icon-xs}"
  sort-icon.block-size: "{sherpa.theme-size-icon-xs}"
  sort-icon.font-size: "{sherpa.theme-size-icon-xs}"
  group-inner.inset-inline-start: "{sherpa.display-mode-space-2xs}"
  row.background: "{sherpa.style-surface-base}"
  cell.padding: "{sherpa.display-mode-space-2xs}"
  cell.line-height: "{sherpa.theme-content-line-height-base}"
  group-row.background: "{sherpa.style-surface-base-1}"
  group-cell.padding: "{sherpa.display-mode-space-2xs}"
  group-cell.border-block-end: "{sherpa.border-bottom}"
  group-cell.color: "{sherpa.style-content-base}"
  group-cell.line-height: "{sherpa.theme-content-line-height-base}"
  group-inner.gap: "{sherpa.theme-gap-md}"
  group-inner.min-block-size: "{sherpa.display-mode-size-lg}"
  group-toggle.inline-size: "{sherpa.display-mode-size-sm}"
  group-toggle.block-size: "{sherpa.display-mode-size-sm}"
  group-toggle.font-size: "{sherpa.font-size-body-small}"
  group-label.font-weight: "{sherpa.font-weight-semibold}"
  group-count.min-inline-size: "{sherpa.display-mode-size-sm}"
  group-count.padding-inline: "{sherpa.display-mode-space-3xs}"
  group-count.border-radius: "{sherpa.display-mode-border-rounding-sm}"
  group-count.background: "{sherpa.theme-surface-default-base}"
  group-count.color: "{sherpa.theme-content-body-1}"
  group-count.font-size: "{sherpa.font-size-body-small}"
  empty.padding: "{sherpa.display-mode-space-2xl}"
  empty.color: "{sherpa.theme-content-body-1}"
$extensions:
  sherpa:
    figmaName: Grid Cell
    category: data
    variantAxes:
      - name: Type
        values:
          - cell
          - header
          - group
          - filter
    booleanProps:
      - hasCheckbox
      - hasActions
    divergence:
      note: >-
        The shipped code (sherpa-data-grid.ts) is a plain <table> — head row + body rows, sortable,
        no pinning/selection/per-column filters. This def + the Figma build capture the RICHER
        designed architecture (flat pinned columns). Reconcile later: either enrich the code to the
        column model, or scope the Figma component to match. Public API (data-sort-field/direction,
        grid-sort-change, row-click) is preserved on both sides.
    jsProps:
      - name: selectedRecords
        type: string
        access: read
