# sherpa-data-grid — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-data-grid.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-data-grid
$description: >-
  A sortable, selectable data grid assembled from flat columns. A leading Selection column (pinned
  left) and a trailing Actions column (pinned right) bracket the data columns; a toolbar and a
  data-variant quick-filter toolbar sit above, pagination below. Rows are visual — each column is a
  vertical stack of cells, so the grid stays flat.
element:
  $type: element
  tag: table
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: table
      class: grid
      part: grid
      children:
        - el: thead
          class: head
          part: head
          children:
            - el: tr
              class: head-row
              children:
                - el: th
                  class: select-cell select-head
                  attrs:
                    scope: col
                  children:
                    - el: input
                      class: select-all
                      attrs:
                        type: checkbox
                        aria-label: Select all rows
            - el: tr
              class: filter-row
              children:
                - el: th
                  class: select-cell filter-spacer
                  attrs:
                    scope: col
                    aria-hidden: "true"
        - el: tbody
          class: body
          part: body
    - el: div
      class: empty
      part: empty
      slot: empty
      attrs:
        role: status
    - el: template
      class: head-cell-tpl
      children:
        - el: th
          class: head-cell
          attrs:
            scope: col
          children:
            - el: button
              class: head-btn
              attrs:
                type: button
              children:
                - el: span
                  class: head-label
                - el: span
                  class: sort-icon
                  attrs:
                    aria-hidden: "true"
props:
  - $type: prop
    name: data-filterable
    type: string
    kind: style
    description: show a secondary header row of filter inputs
  - $type: prop
    name: data-selectable
    type: string
    kind: style
    description: show a leading checkbox column (select-all + per-row)
  - $type: prop
    name: data-sort-direction
    type: string
    kind: content
    description: current sort (asc | desc)
  - $type: prop
    name: data-sort-field
    type: string
    kind: content
    description: current sort (asc | desc)
states:
  - $type: state
    name: empty
    selector: ":host([data-empty])"
  - $type: state
    name: selectable
    selector: ":host([data-selectable])"
  - $type: state
    name: filterable
    selector: ":host([data-filterable])"
  - $type: state
    name: focus-visible
    selector: .select-all:focus-visible
events:
  - $type: event
    name: sort-change
    bubbles: true
    composed: true
  - $type: event
    name: direction
    bubbles: true
    composed: true
  - $type: event
    name: row-click
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .body
  - $type: event
    name: row
    bubbles: true
    composed: true
  - $type: event
    name: selection-change
    bubbles: true
    composed: true
  - $type: event
    name: filter-change
    bubbles: true
    composed: true
  - $type: event
    name: value
    bubbles: true
    composed: true
tokens:
  select-cell.inline-size: "{sherpa.display-space-2xl}"
  select-cell.padding: "{sherpa.display-space-xs}"
  select-head.background: "{sherpa.theme-surface-default-2}"
  select-head.border-block-end: "{sherpa.display-border-width-base}"
  select-all.accent-color: "{sherpa.theme-border-accent-base}"
  row-select.accent-color: "{sherpa.theme-border-accent-base}"
  filter-cell.padding: "{sherpa.display-space-2xs}"
  filter-cell.background: "{sherpa.theme-surface-default-2}"
  filter-cell.border-block-end: "{sherpa.display-border-width-base}"
  filter-spacer.background: "{sherpa.theme-surface-default-2}"
  filter-spacer.border-block-end: "{sherpa.display-border-width-base}"
  filter-input.padding: "{sherpa.display-space-2xs}"
  filter-input.color: "{sherpa.theme-content-body-base}"
  filter-input.background: "{sherpa.theme-surface-default-base}"
  filter-input.border-width: "{sherpa.display-border-width-base}"
  filter-input.border-color: "{sherpa.style-border-base}"
  filter-input.border-radius: "{sherpa.display-border-rounding-sm}"
  head-cell.background: "{sherpa.theme-surface-default-2}"
  head-cell.border-block-end: "{sherpa.display-border-width-base}"
  head-btn.gap: "{sherpa.display-space-2xs}"
  head-btn.padding: "{sherpa.display-space-xs}"
  head-btn.font-weight: "{sherpa.font-weight-semibold}"
  head-btn.color: "{sherpa.theme-content-body-base}"
  cell.padding: "{sherpa.display-space-xs}"
  empty.padding: "{sherpa.display-space-2xl}"
  empty.color: "{sherpa.theme-content-body-1}"
$extensions:
  sherpa:
    figmaName: Grid Cell
    category: data
    variantAxes:
      - name: Type
        values:
          - cell
          - header
          - group
          - filter
    booleanProps:
      - hasCheckbox
      - hasActions
    divergence:
      note: >-
        The shipped code (sherpa-data-grid.ts) is a plain <table> — head row + body rows, sortable,
        no pinning/selection/per-column filters. This def + the Figma build capture the RICHER
        designed architecture (flat pinned columns). Reconcile later: either enrich the code to the
        column model, or scope the Figma component to match. Public API (data-sort-field/direction,
        grid-sort-change, row-click) is preserved on both sides.
