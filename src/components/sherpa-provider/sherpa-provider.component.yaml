# sherpa-provider — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-provider.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-provider
$description: the data layer, over a SUBTREE of the page.
templates:
  - default
anatomy:
  root:
    slot: ""
    attrs:
      data-accepts: any
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (filterMode, view). See $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: >-
      callable from a view definition's state block (provide, open, close, saveView, export,
      import). See $extensions.sherpa.methods.
events:
  - $type: event
    name: filter-mode-change
    bubbles: true
    composed: true
    detail:
      mode: unknown
  - $type: event
    name: view-change
    bubbles: true
    composed: true
    detail:
      id: unknown
$extensions:
  sherpa:
    methods:
      - $type: method
        name: provide
        args: "options: ProvideOptions"
        description: >-
          Give this subtree its sources — and its Views. Every component already asking is answered
          again: a Context that swaps its source swaps it for everything in it. Settles once the
          kept Query, or the start View, is on.
      - $type: method
        name: open
        args: "definition: PageDefinition, options: OpenOptions"
        description: >-
          Set up a page from its DEFINITION: its source over the app's store, every filter bar drawn
          from its scope — the View chip, the fields it holds, what it may add — and all of it
          provided. The source, or undefined for a page with no data.
      - $type: method
        name: close
        args: ""
        description: >-
          Leave the page, or one still opening: its source goes, and nothing in the subtree reaches
          it.
      - $type: method
        name: saveView
        args: "label: string"
        description: Save what is on screen as a new View of the open page, and put it on the View chip.
      - $type: method
        name: export
        args: ""
        description: >-
          This subtree's whole state as JSON — each source's question, and the View on screen — for
          a link, another service or an agent.
      - $type: method
        name: import
        args: "state: ProviderState"
        description: >-
          Take a state back in, exactly: each named source's question, and its View — shown on the
          View chip, and known to the pick listener, so the next pick of the old View is heard. A
          source it does not name is left as it is.
    jsProps:
      - name: filterMode
        type: string
        access: read-write
      - name: view
        type: string
        access: read
