# sherpa-provider — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-provider.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-provider
$description: the data layer, over a REGION of the page.
templates:
  - default
anatomy:
  root:
    slot: ""
    attrs:
      data-accepts: any
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (view, elements). See $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: >-
      callable from a view definition's state block (provide, export, import). See
      $extensions.sherpa.methods.
events:
  - $type: event
    name: view-change
    bubbles: true
    composed: true
    detail:
      id: unknown
$extensions:
  sherpa:
    methods:
      - $type: method
        name: provide
        args: "options: ProvideOptions"
        description: Give this subtree its sources — and its Views. Every component already
      - $type: method
        name: export
        args: ""
        description: This subtree's whole state as JSON — each source's question, and the View
      - $type: method
        name: import
        args: "state: ProviderState"
        description: "Take a state back in, exactly: each named source's question, and its View"
    jsProps:
      - name: view
        type: string
        access: read
      - name: elements
        type: string
        access: read
