<!--
  sherpa-provider — the data layer, over a SUBTREE of the page.

  A component inside it ASKS — a `context-request` event, the Context Protocol —
  and the nearest provider ANSWERS with what the component declared it needs:
  its data now, and again on every change. It draws nothing.
  docs/PROVIDER-DESIGN.md. TRAP T-a-component-asks-its-provider

      <sherpa-provider>
        <sherpa-data-grid data-scope="data"></sherpa-data-grid>
      </sherpa-provider>
      provider.provide({ sources: { records: source } });

  Public API:
    data-keep-content  every card it draws a state on keeps its content: a bar
                    and a banner, never an overlay. Will, TODO 59.
    (the rest — `provide()` gives it its sources)

  Slots:
    (default)   the subtree — every component in it can ask

  Fires:
    filter-mode-change — the filters moved between the toolbars and the panel. detail: { mode }
    view-change — a View was picked, opened or saved. detail: { id, elements? }
    reach-change — whether the page's data can be reached changed. detail: { reach, failure? }
-->
<template id="default">
  <slot data-accepts="content"></slot>
  <!-- THE MODE'S OWN BUTTON, cloned into each bar's and panel's `actions`
       slot — the page's switch, not a component's. TRAP T-the-mode-switch-is-the-pages-own -->
  <template class="mode-panel-tpl">
    <sherpa-button slot="actions" data-type="icon" data-size="sm" data-filter-mode
                   data-icon-start="sidebar" aria-label="View as filter panel"></sherpa-button>
  </template>
  <template class="mode-bars-tpl">
    <sherpa-button slot="actions" data-type="icon" data-size="sm" data-filter-mode
                   data-icon-start="fullscreen-exit" aria-label="Filter in the toolbars instead"></sherpa-button>
  </template>

  <!-- The words its code hands on as data. TRAP T-a-word-is-in-the-markup -->
  <template class="words">
    <span data-word="view">View</span>
  </template>
</template>
