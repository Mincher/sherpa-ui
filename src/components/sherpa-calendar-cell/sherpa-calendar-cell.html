<!--
  sherpa-calendar-cell — one day, month or year in a calendar's grid.
  Figma "Calendar Cell" (276:16589).

  The state lives on the inner `.content` box, not the host: that box carries
  the fill and rounding, so a selected RANGE can square its inner corners while
  the host keeps its hit area and focus ring.

  Public API:
    data-state     default (omitted) | today | selected | range-start |
                   range-end | range-mid
    data-label     the number to show (or use the default slot)
    data-value     the ISO date this cell STANDS FOR (2026-09-18), which is what
                   cell-click carries. The label is a number in the month's own
                   terms and cannot say which month; this can. Falls back to
                   data-label when absent, so a cell with no calendar around it
                   still reports something.
    data-outside   this day belongs to the neighbouring month
    disabled       native — outside data-min / data-max

  Fires: cell-click — the cell was pressed. detail: { value }
-->
<template id="default">
  <button class="cell" part="cell" type="button">
    <span class="content" part="content">
      <span class="label" part="label"><slot></slot></span>
    </span>
  </button>
</template>
