# sherpa-calendar-cell — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-calendar-cell.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-calendar-cell
$description: one day, month or year in a calendar's grid.
element:
  $type: element
  tag: button
  attributes:
    type: button
  provides:
    - click
    - keyboard
    - focus
    - disabled
templates:
  - default
anatomy:
  root:
    el: button
    class: cell
    part: cell
    attrs:
      type: button
    children:
      - el: span
        class: content
        part: content
        children:
          - el: span
            class: label
            part: label
            slot: ""
props:
  - $type: prop
    name: data-label
    type: string
    kind: content
    description: the number to show (or use the default slot)
  - $type: prop
    name: data-outside
    type: string
    kind: style
    description: this day belongs to the neighbouring month
  - $type: prop
    name: data-state
    type: enum
    kind: style
    values:
      - default
      - today
      - selected
      - range-start
      - range-end
      - range-mid
    description: default (omitted) | today | selected | range-start | range-end | range-mid
  - $type: prop
    name: disabled
    type: boolean
    native: true
    kind: content
    default: false
    description: native — outside data-min / data-max
states:
  - $type: state
    name: today
    selector: ":host([data-state=\"today\"])"
  - $type: state
    name: selected
    selector: ":host([data-state=\"selected\"])"
  - $type: state
    name: range-start
    selector: ":host([data-state=\"range-start\"])"
  - $type: state
    name: range-end
    selector: ":host([data-state=\"range-end\"])"
  - $type: state
    name: range-mid
    selector: ":host([data-state=\"range-mid\"])"
  - $type: state
    name: outside
    selector: ":host([data-outside])"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
  - $type: state
    name: focus-visible
    selector: .cell:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (value). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: cell-click
    bubbles: true
    composed: true
    detail:
      value: unknown
tokens:
  cell.block-size: "{sherpa.display-mode-size-2xl}"
  content.border-radius: "{sherpa.display-mode-border-rounding-base}"
  content.color: "{sherpa.theme-content-body-1}"
  content.font-size: "{sherpa.theme-content-size-base}"
  content.font-weight: "{sherpa.font-weight-regular}"
  content.line-height: "{sherpa.theme-content-line-height-base}"
  content.font-family: "{sherpa.font-family-mono}"
$extensions:
  sherpa:
    figmaName: Calendar Cell
    figmaNodeId: "276:16589"
    category: control
    variantAxes:
      - name: State
        values:
          - default
          - today
          - selected-range
    jsProps:
      - name: value
        type: string
        access: read
