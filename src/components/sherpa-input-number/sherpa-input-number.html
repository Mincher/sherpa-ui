<!--
  sherpa-input-number — a labelled numeric field.

  A variation of sherpa-input-text: same label / description / message chrome,
  but the control is <input type="number"> (right-aligned, mono) sitting in a
  row that can hold optional ± stepper buttons.

  Public API:
    data-label        field label (hidden when empty)
    data-description   helper text under the label
    data-error        error message (shown when set / on :user-invalid)
    data-steppers      show ± stepper buttons (present = shown)
    data-min / data-max / data-step
                      mirrored to native min / max / step on the control
    placeholder       native placeholder
    value             native value (also a JS property; valueAsNumber getter)
    name / required / disabled / readonly
                      native attributes, reflected to the inner control

  Fires: input, change (re-dispatched from the inner control and on step)
-->
<template id="default">
  <label class="field" part="field">
    <span class="label" part="label"></span>
    <span class="description" part="description"></span>
    <span class="control-row" part="control-row">
      <button type="button" class="step step-down" part="step-down" aria-label="Decrease value" tabindex="-1">&minus;</button>
      <input class="control" part="control" type="number" inputmode="decimal" />
      <button type="button" class="step step-up" part="step-up" aria-label="Increase value" tabindex="-1">&plus;</button>
    </span>
    <span class="message" part="message" aria-live="polite"></span>
  </label>
</template>
