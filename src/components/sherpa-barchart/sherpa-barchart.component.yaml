# sherpa-barchart — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-barchart.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-barchart
$description: a vertical bar chart for categorical comparison.
element:
  $type: element
  tag: figure
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: figure
      class: chart-figure
      part: figure
      children:
        - el: figcaption
          class: chart-header
          part: header
          children:
            - el: span
              class: title
              slot: title
        - el: div
          class: chart-body
          children:
            - el: span
              class: axis-label axis-label-y
              part: axis-label
            - el: div
              class: y-axis
              part: y-axis
              attrs:
                aria-hidden: "true"
            - el: div
              class: plot
              part: plot
              attrs:
                role: img
                aria-label: Bar chart
              children:
                - el: div
                  class: gridlines
                  part: gridlines
                  attrs:
                    aria-hidden: "true"
                - el: div
                  class: bars
                  part: bars
                  children:
                    - el: div
                      class: bars-zero
                      part: zero-line
                      attrs:
                        aria-hidden: "true"
            - el: div
              class: x-axis-row
              part: x-axis
              attrs:
                aria-hidden: "true"
        - slot: legend
    - el: template
      class: ytick-tpl
      children:
        - el: span
          class: y-tick sherpa-truncate
          children:
            - el: span
              class: y-value
props:
  - $type: prop
    name: data-aggregate
    type: enum
    observed: false
    kind: style
    values:
      - count
      - sum
      - mean
      - min
      - max
      - distinct
    description: count  | sum | mean | min | max | distinct, per value
  - $type: prop
    name: data-axis-label
    type: string
    observed: false
    kind: content
    description: y-axis caption (shown when set)
  - $type: prop
    name: data-bands
    type: string
    observed: false
    kind: style
    description: a number segment-field cut at these edges, "0,20,40" — a histogram
  - $type: prop
    name: data-field
    type: string
    observed: false
    kind: style
    description: the number that aggregate reads
  - $type: prop
    name: data-max
    type: string
    observed: true
    kind: style
    description: explicit y-max (else derived from the data)
  - $type: prop
    name: data-segment-field
    type: string
    observed: false
    kind: style
    description: "ASKED of its provider: one bar per value of this field"
  - $type: prop
    name: data-ticks
    type: string
    observed: true
    kind: style
    default: "4"
    description: number of y gridlines/values
states:
  - $type: state
    name: vertical
    selector: ":host([data-legend=\"vertical\"])"
  - $type: state
    name: below-zero
    selector: ":host([data-below-zero])"
  - $type: state
    name: not-has-y-axis
    selector: ":host(:not([data-has-y-axis]))"
  - $type: state
    name: focus-visible
    selector: .bar-col:focus-visible
events:
  - $type: event
    name: bar-click
    bubbles: true
    composed: true
    detail:
      index: unknown
      label: string
      value: number
    trigger:
      "on": click
      node: .bars
tokens:
  bars.gap: "{sherpa.display-mode-space-xs}"
  bars.border-block-end: "{sherpa.display-mode-border-width-base}"
  x-axis-row.gap: "{sherpa.display-mode-space-xs}"
  x-axis-row.margin-block-start: "{sherpa.display-mode-space-2xs}"
  bar.border-radius: "{sherpa.display-mode-border-rounding-sm}"
  bar.border-width: "{sherpa.display-mode-border-width-base}"
  bar.border-color: "{sherpa.data-viz-series-1}"
  bar.background: "{sherpa.data-viz-series-1}"
  bar-label.font-family: "{sherpa.font-family-mono}"
  bar-label.font-size: "{sherpa.font-size-body-small}"
  bar-label.line-height: "{sherpa.theme-content-line-height-small}"
  bar-label.color: "{sherpa.theme-content-body-1}"
  chart-body.flex: "{sherpa.display-mode-space-2xs}"
  gridlines.background-image: "{sherpa.style-border-base}"
  gridlines.border-block-start: "{sherpa.border-top}"
  y-axis.inline-size: "{sherpa.display-mode-size-lg}"
  y-axis.padding-inline-end: "{sherpa.display-mode-space-sm}"
  y-axis.border-inline-end: "{sherpa.border-right}"
  y-axis.font-family: "{sherpa.font-family-mono}"
  y-axis.font-size: "{sherpa.font-size-body-small}"
  y-axis.font-weight: "{sherpa.font-weight-regular}"
  y-axis.line-height: "{sherpa.theme-content-line-height-small}"
  y-axis.color: "{sherpa.theme-content-body-1}"
$extensions:
  sherpa:
    figmaName: Data Field
    category: chart
    variantAxes:
      - name: Orientation
        values:
          - vertical
          - horizontal
