# sherpa-barchart — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-barchart.{thin.yaml,html,css,ts}. The MECHANICAL surface only —
# props (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# Validated by schemas/component.v1.json; round-trips via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-barchart
$description: a vertical bar chart for categorical comparison.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  root:
    el: div
    class: chart-header
    part: header
    children:
      - el: span
        class: title
        slot: title
props:
  - $type: prop
    name: data-label
    type: string
    kind: style
    description: chart title
  - $type: prop
    name: data-max
    type: string
    kind: content
    description: explicit y-max (else derived from the data)
states:
  - $type: state
    name: focus-visible
    selector: .bar-col:focus-visible
events:
  - $type: event
    name: bar-click
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .bars
  - $type: event
    name: label
    bubbles: true
    composed: true
  - $type: event
    name: value
    bubbles: true
    composed: true
tokens:
  title.font-size: "{sherpa.font-size-body-base}"
  title.font-weight: "{sherpa.font-weight-semibold}"
  title.color: "{sherpa.theme-content-body-base}"
  bars.gap: "{sherpa.display-space-sm}"
  bar.border-radius: "{sherpa.display-border-rounding-sm}"
  bar.background: "{sherpa.categorical-1}"
  bars.border-block-end: "{sherpa.display-border-width-base}"
  bar-label.margin-block-start: "{sherpa.display-space-2xs}"
  bar-label.font-size: "{sherpa.font-size-body-small}"
  bar-label.color: "{sherpa.theme-content-body-1}"
$extensions:
  sherpa:
    figmaName: Data Field
    category: chart
    variantAxes:
      - name: Orientation
        values:
          - vertical
          - horizontal
