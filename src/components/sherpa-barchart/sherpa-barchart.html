<!--
  sherpa-barchart — a HORIZONTAL bar chart for categorical comparison: one bar
  a row, its category on the left, its value along the bottom. Will, TODO 548

  Public API:
    data-max         explicit value-axis max (else derived from the data)
    data-axis-label  the value axis's caption, under it (shown when set)
    data-ticks       number of value gridlines (default 4)
    data-segment-field  ASKED of its provider: one bar per value of this field
    data-stack-field    each bar stacked by this field's values, in their colours
    data-aggregate      count (default) | sum | mean | min | max | distinct, per value
    data-field          the number that aggregate reads
    data-bands          a number segment-field cut at these edges, "0,20,40" — a histogram

  Slots:
    heading — heading above the chart
    legend  — a <sherpa-chart-legend> for the series. Wider than square, beside the
              plot; square or narrower, below it.

  Fires: bar-click — detail: { index, label, value }
-->
<template id="default">
  <div class="chart-shape">
  <figure class="chart-figure" part="figure">
    <figcaption class="chart-header" part="header">
      <span class="title"><slot name="heading" data-accepts="text"></slot></span>
    </figcaption>
    <div class="chart-body">
      <!-- A sibling COLUMN, not inside .bar-col: it mirrors .bars, so label N
           sits beside bar N and a long label cannot shrink the bars. -->
      <div class="category-axis" part="category-axis" aria-hidden="true"></div>

      <div class="plot" part="plot" role="group" aria-label="Bar chart">
        <div class="gridlines" part="gridlines" aria-hidden="true"></div>
        <div class="bars" part="bars">
          <!-- Only drawn when the scale dips below zero: :state(below-zero). -->
          <div class="bars-zero" part="zero-line" aria-hidden="true"></div>
        </div>
      </div>

      <div class="value-axis" part="value-axis" aria-hidden="true"></div>
      <span class="axis-label axis-label-value" part="axis-label"></span>
    </div>

    <slot name="legend" data-accepts="legend"></slot>
  </figure>
  </div>

  <template class="ytick-tpl">
    <span class="value-tick"><span class="y-value"></span></span>
  </template>

  <!-- The tip is a CHILD of the button so one hover covers target and anchor.
       Placement is declarative — see .sherpa-tip in core/sherpa-anchor.css. -->
  <template class="bar-tpl">
    <button class="bar-col sherpa-anchor" type="button">
      <!-- The BAR is the anchor, not the column: a .bar-col is the full plot
           width, so anchoring to it puts the tip far from a short bar. -->
      <span class="bar sherpa-anchor-el" part="bar">
        <!-- Stacked by its Secondary: its pieces, each in its own colour. TODO 548 -->
        <span class="bar-stack" part="bar-stack"></span>
        <!-- Grouped, its parts, from its base. TODO 548 -->
        <span class="bar-parts" part="bar-parts"></span>
        <!-- The part the highlight's driver matches. TODO 441 -->
        <span class="bar-match" part="bar-match"></span>
      </span>
      <span class="sherpa-tip" popover="manual" part="tip" role="tooltip">
        <span class="chart-tip-label"></span>
        <span class="sherpa-tip-value"></span>
        <span class="chart-tip-parts"></span>
      </span>
    </button>
  </template>

  <!-- One part of a grouped bar, or of a piece: its share of it. TODO 548 -->
  <template class="bar-part-tpl"><span class="bar-part" part="bar-part"></span></template>
  <!-- One piece of a stacked bar: its share, in its own colour, and its parts. TODO 548 -->
  <template class="bar-piece-tpl"><span class="bar-piece" part="bar-piece"><span class="bar-parts"></span></span></template>

  <template class="xlabel-tpl">
    <span class="bar-label sherpa-truncate" part="bar-label" data-text="label"></span>
  </template>
</template>
<!-- The plot is a GROUP, not an img: its bars are buttons, and an img hides
     what it holds. Each bar is named with its label and value. -->
