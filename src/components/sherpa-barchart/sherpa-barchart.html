<!--
  sherpa-barchart — a vertical bar chart for categorical comparison.
  populate([{ label, value, colorIndex? }]) stamps a bar per category; each bar's
  height is a --_h custom property CSS turns into the height.

  Public API:
    data-label       chart title
    data-max         explicit y-max (else derived from the data)
    data-axis-label  y-axis caption (shown when set)
    data-ticks       number of y gridlines/values (default 4)

  Slots:
    title   — heading above the chart (data-accepts: text, inline)
    legend  — a <sherpa-chart-legend> for the series. Horizontal → below the plot;
              vertical → beside it. (data-accepts: chart-legend)

  Fires: bar-click — detail: { index, label, value }
-->
<template id="default">
  <figure class="chart-figure" part="figure">
    <figcaption class="chart-header" part="header">
      <span class="title"><slot name="title"></slot></span>
    </figcaption>
    <div class="chart-body">
      <span class="axis-label axis-label-y" part="axis-label"></span>
      <div class="y-axis" part="y-axis" aria-hidden="true"></div>

      <div class="plot" part="plot" role="img" aria-label="Bar chart">
        <!-- A repeating gradient, so line spacing and axis-label spacing are both
             just the division count. -->
        <div class="gridlines" part="gridlines" aria-hidden="true"></div>
        <div class="bars" part="bars"></div>
      </div>

      <!-- Category labels are a SIBLING row, not inside .bar-col: they sit below
           the baseline rule and share the plot's column tracks via `subgrid`, so a
           long label cannot shrink the bars. -->
      <div class="x-axis-row" part="x-axis" aria-hidden="true"></div>
    </div>

    <!-- The legend belongs to the CHART, not the card around it. -->
    <slot name="legend"></slot>
  </figure>

  <!-- The tick rule is the cell's own border, so it cannot drift out of step with
       its label. -->
  <template class="ytick-tpl">
    <span class="y-tick"><span class="y-value"></span></span>
  </template>

  <!--
    The tip is a CHILD of the button, not a sibling: the button is both hover
    target and anchor, so one `:hover` covers both. Placement is declarative —
    see .chart-tip in core/sherpa-base.css. No JS measures anything.
  -->
  <template class="bar-tpl">
    <button class="bar-col chart-mark" type="button">
      <!-- The BAR is the anchor, not the column: a .bar-col is the full plot
           height, so anchoring to it puts the tip far above a short bar. -->
      <span class="bar chart-anchor" part="bar"></span>
      <span class="chart-tip" part="tip" role="tooltip">
        <span class="chart-tip-label"></span>
        <span class="chart-tip-value"></span>
      </span>
    </button>
  </template>

  <template class="xlabel-tpl">
    <span class="bar-label" part="bar-label"></span>
  </template>
</template>
<!--
  The <figure> is display:contents — figure/figcaption semantics without changing
  layout. The plot is role="img" so AT reads the CSS-drawn bars as one labelled
  image rather than descending into meaningless divs.
-->
