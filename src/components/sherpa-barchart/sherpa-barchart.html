<!--
  sherpa-barchart — a vertical bar chart for categorical comparison.

  populate([{ label, value, colorIndex? }]) stamps a bar per category from a
  cloning prototype. Each bar's height is a --_h custom property (its value as a
  percentage of the max) that CSS turns into the bar height. Colour is categorical.

  The Y AXIS matches the Figma "Chart Axis" (Orientation=vertical): value labels
  with a tick marker between each pair, drawn with a 0.5px style-border/base rule,
  and an optional rotated axis label beside them. The ticks are the axis's own
  right edge, so they line up with the plot without a second element to keep in
  step. Axis text is content/size/base 14 on line-height/base 20, content/body/+1.

  Public API:
    data-label       chart title
    data-max         explicit y-max (else derived from the data)
    data-axis-label  y-axis caption (shown when set)
    data-ticks       number of y gridlines/values (default 4)

  Slots:
    title   — heading above the chart (data-accepts: text, inline)
    legend  — a <sherpa-chart-legend> for the series. Horizontal → below the plot;
              vertical → beside it. (data-accepts: chart-legend)

  Fires: bar-click — detail: { index, label, value }
-->
<template id="default">
  <figure class="chart-figure" part="figure">
    <figcaption class="chart-header" part="header">
      <span class="title"><slot name="title"></slot></span>
    </figcaption>
    <div class="chart-body">
      <!-- Y axis: a caption plus the value/tick column, both CSS-gated. -->
      <span class="axis-label axis-label-y" part="axis-label"></span>
      <div class="y-axis" part="y-axis" aria-hidden="true"></div>

      <div class="plot" part="plot" role="img" aria-label="Bar chart">
        <!-- One rule per value division, behind the bars (Figma's Data Field
             gridlines). A repeating gradient, so the line spacing and the axis
             label spacing are both just the division count. -->
        <div class="gridlines" part="gridlines" aria-hidden="true"></div>
        <div class="bars" part="bars"></div>
      </div>

      <!-- The HORIZONTAL axis: category labels in their OWN grid row, BELOW the
           baseline rule the plot ends on. They used to live inside .bar-col, which
           put them above that rule (inside the drawing area) and let a long label
           shrink the bars. As a sibling row they share the plot's column tracks
           via `subgrid`, so label N is always exactly under bar N. -->
      <div class="x-axis-row" part="x-axis" aria-hidden="true"></div>
    </div>

    <!-- The legend belongs to the CHART, not to the card around it. A categorical
         series is only readable if the reader can name the colours, so the pair is
         one thing and the ratio between them is this component's business — the
         same rule sherpa-donut-chart already follows for its own legend.

         A HORIZONTAL legend sits BELOW the plot (this slot, in the host's flex
         column); a VERTICAL one sits BESIDE it, which the CSS switches to a two
         column grid on. -->
    <slot name="legend"></slot>
  </figure>

  <!-- One y value + its tick rule. The rule is the cell's own border, so the tick
       cannot drift out of step with the label it belongs to. -->
  <template class="ytick-tpl">
    <span class="y-tick"><span class="y-value"></span></span>
  </template>

  <!--
    One bar, plus its hover tooltip.

    The tip is a CHILD of the bar's <button>, not a sibling: the button is the
    hover target AND the anchor, and nesting means one `:hover` selector covers
    both without the tip needing to know its own index. Placement is entirely
    declarative — see the .chart-tip rules in core/sherpa-base.css, which use
    anchor positioning and position-try-fallbacks to flip the tip to whichever
    side has room. No JS measures anything.
  -->
  <template class="bar-tpl">
    <button class="bar-col chart-mark" type="button">
      <!--
        The BAR is the anchor, not the column. A .bar-col is the full plot height
        (179px on a 180px plot), so anchoring to it put the tip above the COLUMN —
        far from a short bar, and flipped below whenever the plot sat near the top
        of the viewport. Anchoring to the bar itself puts the tip just above the
        value it describes.
      -->
      <span class="bar chart-anchor" part="bar"></span>
      <span class="chart-tip" part="tip" role="tooltip">
        <span class="chart-tip-label"></span>
        <span class="chart-tip-value"></span>
      </span>
    </button>
  </template>

  <!-- One category label, stamped into .x-axis-row alongside its bar. -->
  <template class="xlabel-tpl">
    <span class="bar-label" part="bar-label"></span>
  </template>
</template>
<!--
  The <figure> is a display:contents wrapper so the host's flex column still
  lays out the caption + plot directly; it adds figure/figcaption semantics
  without changing layout. The plot is role="img" so AT treats the CSS-drawn
  bars as one labelled image rather than descending into meaningless divs.
-->
