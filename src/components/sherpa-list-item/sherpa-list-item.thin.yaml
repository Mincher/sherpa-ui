name: sherpa-list-item
figmaName: Menu List Item
category: container
description: >-
  A single list row (atom of List / Menu / Nav): a leading region (drag handle, expand toggle,
  selection control, icon), a title + description, and a trailing slot.
generated: false
tier: sub-component
parentComponent: sherpa-list
anatomy:
  row(div):
    figma:
      node: COMPONENT_SET
      layout: HORIZONTAL
      variantAxis: State
    children:
      - lead(span):
          part: lead
          figma:
            node: FRAME
            layout: HORIZONTAL
            of: leading
          children:
            - drag(button):
                part: drag
                figma:
                  node: INSTANCE
                  of: drag-handle
            - expand(button):
                part: expand
                figma:
                  node: INSTANCE
                  of: Button (expand)
            - control(span):
                part: control
                slot: control
                figma:
                  node: INSTANCE
                  of: leading-control
            - leading(span):
                part: leading
                slot: leading
                figma:
                  node: INSTANCE
                  of: icon
      - content(span):
          part: content
          figma:
            node: FRAME
            layout: VERTICAL
          children:
            - title(span):
                figma:
                  node: TEXT
                  role: control-content
            - description(span):
                figma:
                  node: TEXT
                  role: secondary
      - trailing(span):
          part: trailing
          slot: trailing
          figma:
            node: SLOT
props:
  data-title:
    $verbatim:
      type: string
      default: null
      kind: content
      description: Primary text.
      figma:
        text: label
  data-description:
    $verbatim:
      type: string
      default: null
      kind: content
      description: Secondary text.
      figma:
        boolean: hasDescription
        text: description
  data-icon:
    $verbatim:
      type: string
      default: null
      kind: content
      description: Leading icon glyph.
      figma:
        boolean: hasLeadingIcon
  data-active:
    $verbatim:
      type: boolean
      default: false
      kind: content
      description: Active/selected visual state.
      figma:
        variantAxis: State
        value: active
  data-interactive:
    $verbatim:
      type: boolean
      default: false
      kind: content
      description: Enable hover + click behaviour (focusable).
      figma:
        variantAxis: State
        value: hover
  data-draggable:
    kind: visibility
    figmaBoolean: hasDragHandle
    description: Show the drag handle.
  data-expandable:
    kind: visibility
    figmaBoolean: hasExpand
    description: Show the expand toggle.
  data-expanded:
    $verbatim:
      type: boolean
      default: false
      kind: content
      description: Expanded state.
      figma:
        note: expanded
  data-selectable:
    kind: visibility
    figmaBoolean: hasLeadingControl
    description: Show a leading selection control.
  data-selected:
    $verbatim:
      type: boolean
      default: false
      kind: content
      description: Selection state (for the leading control).
      figma:
        note: selected
templates:
  - default
slots:
  leading:
    accepts:
      - content
    description: A custom icon / avatar (in addition to the data-icon glyph).
  control:
    accepts:
      - control
    description: A custom selection control (else the built-in checkbox box).
  trailing:
    accepts:
      - control
      - content
    description: Actions / badges.
events:
  list-item-click:
    description: The interactive row was activated (click/Enter/Space).
    $verbatim:
      detail:
        title: string
      trigger:
        'on': click
        node: .row
  list-item-expand:
    description: The expand toggle flipped the expanded state.
    $verbatim:
      detail:
        expanded: boolean
      trigger:
        'on': click
        node: .expand
  list-item-select:
    description: The leading control toggled selection.
    $verbatim:
      detail:
        selected: boolean
      trigger:
        'on': click
        node: .control
  list-item-drag:
    description: The drag handle received a pointerdown.
    $verbatim:
      trigger:
        'on': pointerdown
        node: .drag
parts:
  - row
  - lead
  - drag
  - expand
  - control
  - leading
  - icon
  - content
  - title
  - description
  - trailing
tokens:
  row.background:
    override: status-surface
    fallback: surface-primary-base
  row.gap: control-space-gap-base
  row.padding: control-space-padding-md
  title.color: control-content-default
  description.color: content-secondary-base
figmaVerbatim:
  _status: matched
  figmaName: Menu List Item
  nodeType: COMPONENT
  built: true
  variantAxes: []
  booleanProps:
    - hasDescription
    - hasLeadingIcon
    - hasDragHandle
    - hasLeadingControl
    - hasLeading
    - hasExpand
  textProps:
    - label
    - description
  instanceProps:
    - leadingControl
  modePins: {}
  figmaEvents:
    - list-item-click
  note: 'rebuilt 2026-08-15: drag handle, expand toggle, leading selection control, icon + events + state'
