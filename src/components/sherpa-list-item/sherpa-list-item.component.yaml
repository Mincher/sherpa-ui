# sherpa-list-item — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-list-item.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-list-item
$description: >-
  A single list row (atom of List / Menu / Nav): a leading region (drag handle, expand toggle,
  selection control, icon), a title + description, and a trailing slot.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  root:
    el: div
    class: row
    part: row
    children:
      - el: span
        class: lead
        part: lead
        children:
          - el: button
            class: drag
            part: drag
            attrs:
              type: button
              tabindex: "-1"
              aria-label: Drag to reorder
            children:
              - el: span
                class: drag-glyph
                attrs:
                  aria-hidden: "true"
          - el: button
            class: expand
            part: expand
            attrs:
              type: button
              tabindex: "-1"
              aria-expanded: "false"
              aria-label: Expand
            children:
              - el: span
                class: expand-glyph
                attrs:
                  aria-hidden: "true"
          - el: span
            class: control
            part: control
            children:
              - slot: control
          - el: span
            class: leading
            part: leading
            attrs:
              aria-hidden: "true"
            children:
              - el: span
                class: icon
                part: icon
              - slot: leading
      - el: span
        class: content
        part: content
        children:
          - el: span
            class: title
            part: title
          - el: span
            class: description
            part: description
      - el: span
        class: trailing
        part: trailing
        slot: trailing
props:
  - $type: prop
    name: data-current
    type: string
    kind: style
    default: false
    description: current-row state
  - $type: prop
    name: data-description
    type: string
    kind: content
    description: secondary text
  - $type: prop
    name: data-draggable
    type: string
    kind: style
    description: show the drag handle
  - $type: prop
    name: data-expandable
    type: string
    kind: style
    description: show the expand toggle
  - $type: prop
    name: data-expanded
    type: string
    kind: content
    default: false
    description: expanded state (the toggle reflects it)
  - $type: prop
    name: data-heading
    type: string
    kind: content
    description: primary text
  - $type: prop
    name: data-icon
    type: string
    kind: content
    description: a leading icon glyph
  - $type: prop
    name: data-interactive
    type: string
    kind: content
    default: false
    description: hover + click behaviour
  - $type: prop
    name: data-label
    type: string
    kind: content
    description: primary text (data-heading is a back-compat alias)
  - $type: prop
    name: data-selectable
    type: string
    kind: style
    description: show a leading selection control (checkbox affordance)
  - $type: prop
    name: data-selected
    type: string
    kind: style
    default: false
    description: selection state (for the leading control)
  - $type: prop
    name: disabled
    type: boolean
    native: true
    default: false
    description: disabled state
states:
  - $type: state
    name: draggable
    selector: ":host([data-draggable])"
  - $type: state
    name: expandable
    selector: ":host([data-expandable])"
  - $type: state
    name: expanded
    selector: ":host([data-expanded])"
  - $type: state
    name: selectable
    selector: ":host([data-selectable])"
  - $type: state
    name: selected
    selector: ":host([data-selected])"
  - $type: state
    name: icon
    selector: ":host([data-icon])"
  - $type: state
    name: has-leading
    selector: ":host([data-has-leading])"
  - $type: state
    name: has-trailing
    selector: ":host([data-has-trailing])"
  - $type: state
    name: interactive
    selector: ":host([data-interactive])"
  - $type: state
    name: current
    selector: ":host([data-current])"
  - $type: state
    name: not-description
    selector: ":host(:not([data-description]))"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
  - $type: state
    name: focus-visible
    selector: ":focus-visible"
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (current, selected). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: item-click
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .row
  - $type: event
    name: item-expand
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .expand
  - $type: event
    name: item-select
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .control
  - $type: event
    name: item-drag
    bubbles: true
    composed: true
    trigger:
      "on": pointerdown
      node: .drag
tokens:
  row.gap: "{sherpa.structure-space-gap}"
  row.padding: "{sherpa.structure-space-padding}"
  row.border-radius: "{sherpa.structure-rounding-top-left}"
  row.color: "{sherpa.style-content-base}"
  lead.gap: "{sherpa.structure-space-gap}"
  lead.min-block-size: "{sherpa.font-size-body-large}"
  drag.inline-size: "{sherpa.theme-size-icon-xs}"
  drag.block-size: "{sherpa.theme-size-icon-xs}"
  drag.color: "{sherpa.theme-content-body-1}"
  expand.inline-size: "{sherpa.theme-size-icon-xs}"
  expand.block-size: "{sherpa.theme-size-icon-xs}"
  expand.color: "{sherpa.theme-content-body-1}"
  checkbox.inline-size: "{sherpa.theme-size-icon-xs}"
  checkbox.block-size: "{sherpa.theme-size-icon-xs}"
  checkbox.border-width: "{sherpa.style-border-width}"
  checkbox.border-color: "{sherpa.style-border-base}"
  checkbox.border-radius: "{sherpa.display-border-rounding-sm}"
  leading.color: "{sherpa.style-content-base}"
  content.gap: "{sherpa.display-space-3xs}"
  title.color: "{sherpa.style-content-base}"
  title.font-size: "{sherpa.font-size-body-large}"
  title.font-weight: "{sherpa.font-weight-medium}"
  description.color: "{sherpa.theme-content-body-1}"
  description.font-size: "{sherpa.font-size-body-base}"
  trailing.gap: "{sherpa.structure-space-gap}"
$extensions:
  sherpa:
    figmaName: Menu List Item
    category: container
    booleanProps:
      - hasDescription
      - hasLeadingIcon
      - hasDragHandle
      - hasLeadingControl
      - hasLeading
      - hasExpand
    jsProps:
      - name: current
        type: string
        access: read-write
      - name: selected
        type: string
        access: read-write
