# sherpa-chip — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-chip.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-chip
$description: a compact input/filter chip (Figma Chip, 62:1732).
element:
  $type: element
  tag: span
  provides: []
templates:
  - default
  - dismissible
anatomy:
  root:
    el: span
    class: chip
    part: chip
    children:
      - el: span
        class: icon
        part: icon
        attrs:
          aria-hidden: "true"
        children:
          - slot: icon
            children:
              - el: i
                class: glyph
      - el: span
        class: label
        slot: ""
      - el: button
        class: close
        part: close
        attrs:
          type: button
          aria-label: Remove
        children:
          - el: span
            attrs:
              aria-hidden: "true"
        showWhen: dismissible
props:
  - $type: prop
    name: data-dismissible
    type: string
    kind: style
    description: show the close button (selects the dismissible template)
  - $type: prop
    name: data-icon
    type: string
    kind: style
    description: leading icon glyph value (shown when present; or slot "icon")
  - $type: prop
    name: data-status
    type: enum
    kind: style
    values:
      - info
      - success
      - warning
      - critical
      - urgent
    description: info | success | warning | critical | urgent (via the cascade)
states:
  - $type: state
    name: not-icon
    selector: ":host(:not([data-icon]))"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
  - $type: state
    name: focus-visible
    selector: .close:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (templateId). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: chip-remove
    bubbles: true
    composed: true
tokens:
  chip.gap: "{sherpa.theme-gap-sm}"
  chip.padding: "{sherpa.theme-padding-sm}"
  chip.border-width: "{sherpa.display-mode-border-width-base}"
  chip.border-radius: "{sherpa.display-mode-border-rounding-sm}"
  chip.font-size: "{sherpa.font-size-body-small}"
  chip.font-weight: "{sherpa.font-weight-regular}"
  chip.line-height: "{sherpa.theme-content-line-height-small}"
  icon.inline-size: "{sherpa.theme-size-icon-2xs}"
  icon.block-size: "{sherpa.theme-size-icon-2xs}"
  close.inline-size: "{sherpa.theme-size-icon-2xs}"
  close.block-size: "{sherpa.theme-size-icon-2xs}"
  close.margin-inline-start: "{sherpa.theme-gap-sm}"
  close.border-radius: "{sherpa.display-mode-border-rounding-full}"
  close.font-size: "{sherpa.font-size-body-base}"
$extensions:
  sherpa:
    figmaName: Chip
    category: control
    jsProps:
      - name: templateId
        type: string
        access: read
