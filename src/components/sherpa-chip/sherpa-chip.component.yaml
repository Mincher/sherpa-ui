$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-chip
$description: a compact input/filter chip (Figma Chip, 62:1732).
element:
  $type: element
  tag: span
  provides: []
templates:
  - default
  - dismissible
anatomy:
  root:
    el: span
    class: chip
    part: chip
    children:
      - el: span
        class: icon
        part: icon
        attrs:
          aria-hidden: "true"
        children:
          - slot: icon
            children:
              - el: i
                class: glyph
      - el: span
        slot: ""
      - el: sherpa-button
        class: close
        part: close
        attrs:
          data-type: icon
          data-size: xs
          data-look: transparent
          data-icon-start: cross
          aria-label: Remove
        showWhen: dismissible
props:
  - $type: prop
    name: data-dismissible
    type: string
    observed: false
    kind: style
    description: show the close button (selects the dismissible template)
  - $type: prop
    name: data-icon
    type: string
    observed: false
    kind: content
    description: leading icon glyph value (shown when present; or slot "icon")
  - $type: prop
    name: data-status
    type: enum
    observed: false
    kind: style
    values:
      - info
      - success
      - warning
      - critical
      - urgent
    description: info | success | warning | critical | urgent (via the cascade)
states:
  - $type: state
    name: not-icon
    selector: ":host(:not([data-icon]))"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
events:
  - $type: event
    name: chip-remove
    bubbles: true
    composed: true
tokens:
  chip.gap: "{sherpa.theme-gap-sm}"
  chip.padding: "{sherpa.theme-padding-sm}"
  chip.border-width: "{sherpa.display-mode-border-width-base}"
  chip.border-color: "{sherpa.style-border-base}"
  chip.border-radius: "{sherpa.display-mode-border-rounding-sm}"
  chip.background: "{sherpa.style-surface-base}"
  chip.color: "{sherpa.style-content-base}"
  chip.font-size: "{sherpa.font-size-body-small}"
  chip.font-weight: "{sherpa.font-weight-regular}"
  chip.line-height: "{sherpa.theme-content-line-height-small}"
  icon.inline-size: "{sherpa.theme-size-icon-2xs}"
  icon.block-size: "{sherpa.theme-size-icon-2xs}"
  close.margin-inline-start: "{sherpa.display-mode-space-2xs}"
$extensions:
