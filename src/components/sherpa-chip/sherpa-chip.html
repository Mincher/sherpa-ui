<!--
  sherpa-chip — a compact input/filter chip (Figma Chip, 62:1732).

  A small near-square pill (radius 2) holding an optional leading icon, a label,
  and an optional trailing dismiss button. Neutral by default (white surface, grey
  border, dark ink); colour comes from the [data-status] cascade on an ancestor or
  the chip itself. Distinct from sherpa-tag (a full-radius passive marker) — the
  chip is a squarer, interactive selection/filter token.

  Templates (via data-dismissible):
    default     — leading icon + label
    dismissible — leading icon + label + a close button (fires chip-remove)

  Public API:
    data-status       info | success | warning | critical | urgent (via the cascade)
    data-icon         leading icon glyph value (shown when present; or slot "icon")
    data-dismissible  show the close button (selects the dismissible template)

  Slots:
    icon      — a leading glyph (overrides data-icon; shown when data-icon is set)
    (default) — the label

  Fires: chip-remove — detail: {}
-->
<template id="default">
  <span class="chip" part="chip">
    <span class="icon" part="icon" aria-hidden="true"><slot name="icon"><i class="glyph"></i></slot></span>
    <span class="label"><slot></slot></span>
  </span>
</template>

<template id="dismissible">
  <span class="chip" part="chip">
    <span class="icon" part="icon" aria-hidden="true"><slot name="icon"><i class="glyph"></i></slot></span>
    <span class="label"><slot></slot></span>
    <button class="close" part="close" type="button" aria-label="Remove">
      <span aria-hidden="true">&#215;</span>
    </button>
  </span>
</template>
