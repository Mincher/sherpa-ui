# sherpa-accordion — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-accordion.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-accordion
$description: a disclosure card built on native <details> / <summary>.
element:
  $type: element
  tag: details
  provides:
    - toggle
    - open-state
    - keyboard
  stateCss:
    open: "[open]"
templates:
  - default
anatomy:
  root:
    el: details
    class: root
    part: root
    children:
      - el: summary
        class: header
        part: header
        children:
          - el: span
            class: titles
            part: titles
            children:
              - el: span
                class: heading
                part: heading
                children:
                  - el: span
                    class: heading-text
                  - slot: heading
              - el: span
                class: description
                part: description
                children:
                  - el: span
                    class: description-text
                  - slot: description
          - el: span
            class: actions
            part: actions
            slot: actions
          - el: i
            class: chevron sherpa-icon-box
            attrs:
              data-icon: chevron-down
              aria-hidden: "true"
      - el: div
        class: body
        part: body
        slot: ""
props:
  - $type: prop
    name: data-description
    type: string
    observed: false
    kind: content
    description: — optional secondary line under the title (fallback to slotted [slot=description])
  - $type: prop
    name: data-heading
    type: string
    observed: false
    kind: content
    description: — the summary title (fallback to slotted [slot=heading])
  - $type: prop
    name: data-status
    type: string
    observed: false
    kind: style
    description: — status colour cascade (critical | warning | success | info | urgent)
  - $type: prop
    name: open
    type: boolean
    observed: true
    native: true
    default: false
    description: — native boolean (current disclosure state; drives [open] visuals)
states:
  - $type: state
    name: has-actions
    selector: ":host([data-has-actions])"
  - $type: state
    name: description
    selector: ":host([data-description])"
  - $type: state
    name: has-description
    selector: ":host([data-has-description])"
  - $type: state
    name: focus-visible
    selector: .header:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (open). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: toggle
    bubbles: true
    composed: true
    detail:
      open: unknown
tokens:
  header.gap: "{sherpa.theme-gap-sm}"
  header.padding: "{sherpa.theme-padding-md}"
  header.color: "{sherpa.style-content-base}"
  actions.gap: "{sherpa.display-mode-space-2xs}"
  titles.gap: "{sherpa.display-mode-space-3xs}"
  heading.color: "{sherpa.theme-content-body-base}"
  heading.font-size: "{sherpa.font-size-body-base}"
  heading.font-weight: "{sherpa.font-weight-medium}"
  heading.line-height: "{sherpa.theme-content-line-height-base}"
  description.color: "{sherpa.theme-content-body-1}"
  description.font-size: "{sherpa.font-size-body-small}"
  description.line-height: "{sherpa.theme-content-line-height-small}"
  body.border-block-start: "{sherpa.style-border-width}"
$extensions:
  sherpa:
    figmaName: Accordion
    category: container
    divergence:
      note: >-
        2026-09-07 (D2/D12): split out of the former Container Type=accordion variant into a
        standalone component on native <details>/<summary>. The [open] disclosure state is native
        (no data-expanded). Maps to the Figma "Accordion" component (Container set already split).
    jsProps:
      - name: open
        type: boolean
        description: whether the disclosure is expanded (delegates to <details>)
        access: read-write
