<!--
  sherpa-accordion — a disclosure card built on native <details> / <summary>.

  Native-first (naming standard D2/D12): the open/closed state IS the native
  <details open> attribute — there is no data-expanded. <summary> owns the button
  role, keyboard (Enter / Space) and focus for free; clicking it toggles the
  disclosure with no JS. The chevron rotates via CSS on `.root[open]`. The card
  surface (border, radius, status cascade) mirrors sherpa-container.

  Public API:
    data-heading      — the summary title (fallback to slotted [slot=heading])
    data-description  — optional secondary line under the title (fallback to slotted [slot=description])
    open              — native boolean (current disclosure state; drives [open] visuals)
    data-status       — status colour cascade (critical | warning | success | info | urgent)

  Slots:
    heading     — rich summary title (overrides data-heading)
    description — rich secondary line under the title (overrides data-description)
    (default)   — the disclosure body

  Fires: toggle (detail: { open: boolean })
-->
<template id="default">
  <details class="root" part="root">
    <summary class="header" part="header">
      <span class="titles" part="titles">
        <span class="heading" part="heading"><span class="heading-text"></span><slot name="heading"></slot></span>
        <span class="description" part="description"><span class="description-text"></span><slot name="description"></slot></span>
      </span>
      <span class="chevron" aria-hidden="true"></span>
    </summary>
    <div class="body" part="body">
      <slot></slot>
    </div>
  </details>
</template>
