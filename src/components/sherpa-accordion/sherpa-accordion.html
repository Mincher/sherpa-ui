<!--
  sherpa-accordion — a disclosure card built on native <details> / <summary>.
  State IS the native `open` attribute — there is no data-expanded.

  Public API:
    data-heading      — the summary title (fallback to slotted [slot=heading])
    data-description  — optional secondary line under the title (fallback to slotted [slot=description])
    data-icon         — a glyph before the title: what the section holds
    open              — native boolean (current disclosure state; drives [open] visuals)
    data-status       — status colour cascade (critical | warning | success | info | urgent)

  Slots:
    heading     — rich summary title (overrides data-heading)
    description — rich secondary line under the title (overrides data-description)
    actions     — trailing controls on the header row, before the chevron. OUTSIDE
                  the <summary>, so a click on one never toggles the disclosure
                  and no button sits in a button. TRAP T-an-accordion-action-is-not-a-toggle
    badge       — a mark in the header row, shown only while the disclosure is SHUT
    (default)   — the disclosure body

  Fires:
    accordion-open  (detail: {})
    accordion-close (detail: {})
-->
<template id="default">
  <details class="root" part="root">
    <summary class="header" part="header">
      <i class="icon sherpa-icon-box" part="icon" aria-hidden="true" data-attr-data-icon="data-icon"></i>
      <span class="titles" part="titles">
        <span class="heading" part="heading"><span class="heading-text" data-text="data-heading"></span><slot name="heading" data-accepts="text"></slot></span>
        <span class="description" part="description"><span class="description-text" data-text="data-description"></span><slot name="description" data-accepts="text"></slot></span>
      </span>
      <!-- A mark while SHUT — its matches, say. Will, TODO 418 -->
      <span class="badge" part="badge"><slot name="badge" data-accepts="badge"></slot></span>
      <i class="chevron sherpa-icon-box" data-icon="chevron-down" aria-hidden="true"></i>
    </summary>
    <div class="body" part="body">
      <slot data-accepts="content"></slot>
    </div>
  </details>
  <!-- Trailing controls, OUTSIDE the <summary> — a button may not hold buttons —
       laid over its row, before the chevron. TRAP T-an-accordion-action-is-not-a-toggle -->
  <span class="actions" part="actions"><slot name="actions" data-accepts="control"></slot></span>
</template>
