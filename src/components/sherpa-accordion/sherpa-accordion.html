<!--
  sherpa-accordion — an expand/collapse disclosure section.

  A header <button> trigger toggles a collapsible panel. The open/closed state
  lives entirely in CSS (grid-template-rows 0fr→1fr) off data-expanded; JS only
  flips that attribute and syncs aria-expanded.

  Public API:
    data-expanded  open state (boolean)
    data-title     header text (or use the `title` slot)
    disabled       blocks interaction

  Slots:
    title      — custom header content (reflects data-has-title; overrides data-title)
    (default)  — the collapsible panel content

  Fires: accordion-toggle  { expanded: boolean }
-->
<template id="default">
  <h3 class="heading" part="heading">
    <button class="trigger" part="trigger" type="button" aria-expanded="false">
      <span class="title-text"></span>
      <slot name="title"></slot>
      <i class="chevron" aria-hidden="true"></i>
    </button>
  </h3>

  <div class="region" part="region">
    <div class="panel" part="panel">
      <slot></slot>
    </div>
  </div>
</template>
