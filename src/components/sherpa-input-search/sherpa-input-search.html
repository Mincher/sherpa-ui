<!--
  sherpa-input-search — a labelled search field.

  A variation of sherpa-input-text: same label / description / message chrome,
  but the control has a leading search glyph (pure CSS ::before on .control-row)
  and a trailing clear button that appears only when there's a value.

  Public API:
    data-label        field label (hidden when empty)
    data-description   helper text under the label
    data-error        error message (shown when set / on :user-invalid)
    placeholder       native placeholder
    value             native value (also a JS property)
    name / required / disabled / readonly
                      native attributes, reflected to the inner control

  Fires: input, change (re-dispatched), search (on Enter / clear)
-->
<template id="default">
  <label class="field" part="field">
    <span class="label" part="label"></span>
    <span class="description" part="description"></span>
    <span class="control-row" part="control-row">
      <span class="search-icon" aria-hidden="true"></span>
      <input class="control" part="control" type="search" />
      <button type="button" class="clear" part="clear" aria-label="Clear search" tabindex="-1">&times;</button>
    </span>
    <span class="message" part="message" aria-live="polite"></span>
  </label>
</template>
