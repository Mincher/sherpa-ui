<!--
  sherpa-input-time — a labelled time field.

  Wraps a native <input type="time"> in the standard field chrome (label /
  description / message). Native validation, keyboard entry, and the OS time
  picker come for free.

  Public API:
    data-label        field label (hidden when empty)
    data-description  helper text under the label
    data-error        error message (shown when set / on :user-invalid)
    data-min          earliest selectable time (HH:MM) → native min
    data-max          latest selectable time (HH:MM)   → native max
    data-step         step in seconds → native step (e.g. 300 = 5-minute)
    value             native value (also a JS property; HH:MM)
    name / required / disabled / readonly
                      native attributes, reflected to the inner control

  Fires: input, change (re-dispatched from the inner control)
-->
<template id="default">
  <label class="field" part="field">
    <span class="label" part="label"></span>
    <span class="description" part="description"></span>
    <input class="control" part="control" type="time" />
    <span class="message" part="message" aria-live="polite"></span>
  </label>
</template>
