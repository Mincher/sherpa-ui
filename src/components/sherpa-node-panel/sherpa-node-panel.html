<!--
  sherpa-node-panel — the nodes a graph editor may place, by category: a Jump to chip and a
  search, then one list in which each category's heading sticks while its items scroll, one
  item per family; a Custom Node under each of its tags. A card (sherpa-container) on a canvas:
  docked flush and flat in its panel area, or floating. Drawn from populate(paletteOf(kinds)); a
  category with no kind is empty.
  Will, plan 713 M8, plan 749 P3, TODOs 769, 784, 786. TRAP T-the-node-panel-asks-it-places

  Public API:
    data-floatable    show the Float / Dock button in its header
    data-floating     lifted off its place: anywhere in its canvas, moved by its header and
                      resized by its corner; a press brings it to the front. Removed, it docks
                      back. TRAP T-a-floating-panel-is-a-state
    data-x / data-y   where it floats, in px from its canvas's top left. The panel writes them
                      at the end of each move; kept while docked, so it floats there again
    data-width / data-height   how big it floats, in px, written at the end of each resize. Never
                      under 16rem by 12rem nor past its canvas

  Slots:
    (none)

  Fires:
    node-add — an item was clicked, Enter was pressed on it, or it was dropped, or a choice of
               "Add a node" was picked. detail: { kind, type?, point?, context? } — `type` is the
               family's type a search found it by; `point` is where a drag was let go, in client
               pixels; `context` is what askAdd() was given.
    panel-float — the reader pressed Float or Dock. detail: { floating }
    panel-move — floating, its header was dragged, or its grip moved by the keys. detail: { x, y }
    panel-resize — floating, its corner was dragged, or moved by the keys. detail: { width, height }

  Methods:
    askAdd(context) — open "Add a node" at a point: the kinds a socket of a type could join
-->
<template id="default">
  <!-- The box that floats; docked, it fills its place. TRAP T-a-floating-panel-is-a-state -->
  <div class="box sherpa-float" part="box">
    <!-- Docked, no shadow; floating, lifted. -->
    <sherpa-container class="card" part="card" data-padding="none"
                      data-when-data-elevation="data-floating: lg">
      <sherpa-container-header slot="header" class="heading sherpa-float-bar" part="heading" data-heading="Nodes">
        <span slot="actions" class="toolbar" part="toolbar">
          <!-- Floating, the header bar moves it, and this shows where to take hold: on hover,
               and for the keys. A press on it is a press on the bar. -->
          <span class="grip sherpa-float-grip sherpa-icon-box" part="grip" data-icon="drag-handle-vertical" role="button"
                tabindex="0" aria-label="Move panel" title="Drag the header to move it, or use the arrow keys"></span>
          <!-- Float: lifted off, anywhere in the canvas; Dock puts it back. -->
          <sherpa-button class="float" part="float" data-type="icon" data-size="sm"
                         data-icon-start="browser" aria-label="Float"
                         data-when-data-icon-start="data-floating: sidebar-flip"
                         data-when-aria-label="data-floating: Dock"></sherpa-button>
        </span>
      </sherpa-container-header>
      <div class="content" part="content">
        <div class="search" part="search">
          <!-- A pick scrolls the list to a category's heading, or a tag's. TRAP T-a-node-panel-lists-under-sticky-headings -->
          <sherpa-quick-filter class="jump" part="jump" data-type="jump" data-label="Jump to"
                               data-icon-start="list" data-menu>
            <sherpa-menu slot="menu"></sherpa-menu>
          </sherpa-quick-filter>
          <sherpa-input-text class="find" part="find" data-type="minimal" data-icon-start="magnifying-glass" placeholder="Search nodes" aria-label="Search nodes" autocomplete="off"></sherpa-input-text>
        </div>
        <div class="categories" part="categories"></div>
        <p class="none" part="none" role="status" aria-live="polite" data-word="none">No node matches.</p>
      </div>
    </sherpa-container>
    <!-- Floating, the bottom-right corner resizes it: drag it, or the arrow keys on it. -->
    <div class="corner sherpa-float-corner" part="corner" role="button" tabindex="0" aria-label="Resize panel"
         title="Drag to resize, or use the arrow keys"></div>
  </div>

  <!-- The drag in flight, and the point "Add a node" opens at. -->
  <span class="ghost" part="ghost" aria-hidden="true"></span>
  <span class="anchor" aria-hidden="true"></span>
  <sherpa-menu class="add" data-heading="Add a node" data-search></sherpa-menu>

  <!-- A category: its heading sticks at the top of the list while its items scroll under it. -->
  <template class="category-tpl">
    <div class="category">
      <sherpa-section-header class="category-heading" data-size="sm" tabindex="-1" data-attr-data-heading="category"></sherpa-section-header>
      <sherpa-list class="items" data-type="plain"></sherpa-list>
      <p class="empty" data-word="empty">Nothing saved yet.</p>
    </div>
  </template>
  <!-- A tag, inside its category: the Custom Nodes that have it. -->
  <template class="tag-tpl">
    <div class="tag">
      <sherpa-section-header class="tag-heading" data-size="sm" data-divider="none" tabindex="-1" data-attr-data-heading="tag"></sherpa-section-header>
      <sherpa-list class="items" data-type="plain"></sherpa-list>
    </div>
  </template>
  <template class="item-tpl">
    <sherpa-list-item data-interactive data-attr-data-kind="id" data-attr-data-label="heading" data-attr-data-description="description" data-attr-data-icon="icon"></sherpa-list-item>
  </template>
  <template class="choice-tpl">
    <button type="button" data-attr-value="id" data-text="heading"></button>
  </template>
</template>
