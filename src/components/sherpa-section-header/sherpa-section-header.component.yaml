# sherpa-section-header — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-section-header.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-section-header
$description: a semantic heading row for a content section.
element:
  $type: element
  tag: header
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: header
      class: row
      part: row
      children:
        - el: div
          class: lead
          part: lead
          children:
            - slot: heading
              children:
                - el: h2
                  class: title
                  part: title
            - el: div
              class: description
              part: description
              slot: description
        - el: div
          class: actions
          part: actions
          children:
            - slot: actions
              attrs:
                data-accepts: control
    - el: hr
      class: divider
      part: divider
props:
  - $type: prop
    name: data-divider
    type: string
    kind: style
    default: false
    description: bottom divider; shown by DEFAULT — set data-divider="none" to hide it
  - $type: prop
    name: data-heading
    type: string
    kind: style
    description: heading text (rendered into .title)
  - $type: prop
    name: data-size
    type: enum
    kind: style
    values:
      - sm
      - md
      - lg
    description: sm | md  | lg
states:
  - $type: state
    name: has-heading
    selector: ":host([data-has-heading])"
  - $type: state
    name: has-description
    selector: ":host([data-has-description])"
  - $type: state
    name: has-actions
    selector: ":host([data-has-actions])"
  - $type: state
    name: sm
    selector: ":host([data-size=\"sm\"])"
  - $type: state
    name: lg
    selector: ":host([data-size=\"lg\"])"
  - $type: state
    name: none
    selector: ":host([data-divider=\"none\"])"
tokens:
  row.gap: "{sherpa.display-mode-space-xs}"
  title.color: "{sherpa.theme-content-body-base}"
  title.font-family: "{sherpa.font-family-body}"
  title.font-weight: "{sherpa.font-weight-medium}"
  title.line-height: "{sherpa.theme-content-line-height-base}"
  description.color: "{sherpa.theme-content-body-1}"
  description.font-family: "{sherpa.font-family-body}"
  description.font-size: "{sherpa.font-size-body-small}"
  description.line-height: "{sherpa.theme-content-line-height-small}"
  actions.gap: "{sherpa.display-mode-space-xs}"
  divider.margin-block-start: "{sherpa.theme-padding-md}"
  divider.border-block-start: "{sherpa.border-top}"
$extensions:
  sherpa:
    figmaName: Section Header
    category: container
    booleanProps:
      - hasDivider
      - hasActions
      - hasDescription
