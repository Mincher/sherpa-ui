$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-section-header
$description: a semantic heading row for a content section.
element:
  $type: element
  tag: header
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: header
      class: row
      part: row
      children:
        - el: div
          class: lead
          part: lead
          slot: heading
          children:
            - el: div
              class: description
              part: description
              slot: description
        - el: div
          class: actions
          part: actions
          slot: actions
    - el: hr
      class: divider
      part: divider
props:
  - $type: prop
    name: data-divider
    type: boolean
    kind: style
    default: false
    description: show a bottom divider
  - $type: prop
    name: data-size
    type: enum
    kind: style
    values:
      - sm
      - base
      - lg
    description: sm | base  | lg
  - $type: prop
    name: data-title
    type: string
    kind: content
    description: heading text (rendered into .title)
states:
  - $type: state
    name: has-heading
    selector: ":host([data-has-heading])"
  - $type: state
    name: has-description
    selector: ":host([data-has-description])"
  - $type: state
    name: has-actions
    selector: ":host([data-has-actions])"
  - $type: state
    name: sm
    selector: ":host([data-size=\"sm\"])"
  - $type: state
    name: lg
    selector: ":host([data-size=\"lg\"])"
  - $type: state
    name: divider
    selector: ":host([data-divider])"
events:
  - $type: event
    name: nothing
    bubbles: true
    composed: true
tokens:
  row.gap: "{sherpa.display-space-xs}"
  lead.gap: "{sherpa.display-space-xs}"
  title.color: "{sherpa.theme-content-body-base}"
  title.font-family: "{sherpa.font-family-body}"
  title.font-weight: "{sherpa.font-weight-semibold}"
  description.color: "{sherpa.theme-content-body-1}"
  description.font-family: "{sherpa.font-family-body}"
  description.font-size: "{sherpa.font-size-body-base}"
  actions.gap: "{sherpa.display-space-xs}"
  divider.margin-block-start: "{sherpa.display-space-xs}"
$extensions:
