name: sherpa-grid-column
figmaName: .Grid Column
category: data
description: >-
  A single vertical column of a data grid: a Grid Column Header, an optional filter slot, then a
  stack of Grid Cells. Columns sit side-by-side inside the grid — the grid is flat (no row objects;
  rows are cells at the same index across columns).
generated: false
tier: sub-component
parentComponent: sherpa-data-grid
anatomy:
  column(div):
    figma:
      node: COMPONENT
      layout: VERTICAL
      hugHeight: true
      fixedWidth: 214
    children:
      - header(sherpa-grid-column-header):
          owns: sherpa-grid-column-header
          figma:
            node: INSTANCE
            of: Grid Column Header
      - filter(div):
          slot: filter
          figma:
            node: SLOT
            layout: VERTICAL
            fillWidth: true
            hugHeight: true
      - cells(div):
          slot: ''
          figma:
            node: SLOT
            layout: VERTICAL
            fillWidth: true
            hugHeight: true
props:
  data-pinned:
    $verbatim:
      type: enum
      values:
        - left
        - right
      default: null
      kind: style
      description: >-
        Pin the column to the left or right edge of the grid (sticky). Unset = scrolls with the
        body.
      figma:
        note: modelled by placement (Selection Column left, Actions Column right)
  data-width:
    $verbatim:
      type: string
      default: 214px
      kind: style
      description: Column width (a CSS length or fr unit inside the grid track).
      figma:
        note: grid track size on the parent GRID layout
templates:
  - default
slots:
  filter:
    accepts:
      - control
      - content
    description: Optional per-column filter row (a Grid Column Filter — search + menu).
  '':
    accepts:
      - data
    description: The column's cells, top to bottom.
parts:
  - column
  - header
  - filter
  - cells
nested:
  - component: sherpa-grid-column-header
    relationship: owned
    role: column header
  - component: sherpa-grid-cell
    relationship: slotted
    role: the column's cells (app supplies)
tokens:
  column.gap: space-none
figmaVerbatim:
  _status: built
  figmaName: .Grid Column
  page: 'sherpa-data-grid (section: Grid Column)'
  nodeType: COMPONENT
  built: true
  booleanProps: []
  textProps: []
  instanceProps:
    - Grid Column Header
  modePins: {}
  note: >-
    Header is an owned instance; the filter and cells are slots. Width is FIXED on the column; the
    parent grid re-tracks it.
  consolidated: >-
    All data-grid components share ONE Figma page (sherpa-data-grid), organised into named Sections
    — not one page per sub-component.
  tier: sub-component
  figmaEvents: []
