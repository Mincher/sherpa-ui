<!--
  sherpa-input-tag — a token/chip input.

  Type text and press Enter to add a chip; press Backspace in an empty field to
  remove the last chip; click a chip's × to remove it. Each chip is a removable
  <sherpa-tag>. Initial tags via populate(['a','b']) or populate([{ label }]).

  Public API:
    data-label        field label (hidden when empty)
    data-description  helper text under the label
    data-error        error message (shown when set)
    data-value        JSON array of current tags (reflected; read via .tags)
    disabled          native — hides chip remove buttons, blocks input

  Fires: tags-change — detail: { tags: string[] } (on add and remove)

  Chips use a cloning prototype (<template class="chip-tpl">, no id — the base
  class's template parser ignores it).
-->
<template id="default">
  <label class="field" part="field">
    <span class="label" part="label"></span>
    <span class="description" part="description"></span>
    <span class="box" part="box">
      <span class="chips" part="chips"></span>
      <input class="control" part="control" type="text" autocomplete="off" />
    </span>
    <span class="message" part="message" aria-live="polite"></span>
  </label>

  <template class="chip-tpl">
    <sherpa-tag class="chip" data-variant="secondary" data-removable></sherpa-tag>
  </template>
</template>
