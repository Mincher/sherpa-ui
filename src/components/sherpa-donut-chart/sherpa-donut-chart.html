<!--
  sherpa-donut-chart — a donut / pie for part-to-whole data.

  Matches the Figma "Donut Chart" (200×200), which draws each slice as its own arc:
  five ELLIPSE nodes with arcData.innerRadius 0.7 (a hole at 70% of the radius),
  cornerRadius 2 and a 1px INSIDE stroke, each filled with its series hue at 60%.

  So the ring is SVG, one <path> per slice, not a conic-gradient. A gradient draws
  hard-edged bands and cannot round a band's ends, so the design's 2px rounding was
  unreachable that way — and a gradient has no per-slice element to stroke or to
  hover either. Slices are stamped from the .slice-tpl cloning prototype.

  The viewBox is a fixed 0 0 100 100 with the arcs drawn as a stroked circle, so the
  ring scales with the element while staying perfectly circular.

  Public API:
    data-variant   donut (default) | pie   (pie fills to the centre, no hole)
    data-label     centre big text
    data-sublabel  centre small text

  Slots: legend — an optional legend beside the ring.

  Fires: slice-click — a slice is clicked. detail: { index, label, value }
-->
<template id="default">
  <figure class="layout" part="layout">
    <div class="ring-wrap">
      <svg class="ring" part="ring" viewBox="0 0 100 100" role="img"
           aria-label="Donut chart" preserveAspectRatio="xMidYMid meet">
        <g class="slices"></g>
      </svg>
      <!--
        HOVER DOTS — one per slice, and the tooltip ANCHORS.

        HTML buttons, not the SVG arcs themselves: an SVG element cannot be a CSS
        anchor in Chromium (anchor-name is accepted and silently never resolves, so
        the tip lands in the viewport corner).

        Each dot places itself on its slice's MID-ANGLE with CSS trig — the JS
        supplies only the angle, and `cos()` / `sin()` do the geometry in
        percentages of the ring box. So the dots follow the ring at any size with
        nothing measured in JS.
      -->
      <div class="hotspots" part="hotspots"></div>

      <div class="centre">
        <span class="value" part="value"></span>
        <span class="sub" part="sub"></span>
      </div>
    </div>
    <slot name="legend"></slot>
  </figure>

  <!--
    One arc per slice. JS sets the dash geometry, the rotation and the hue.

    The prototype is WRAPPED IN AN <svg>. Without that wrapper the HTML parser
    reads `<circle>` as unknown HTML and builds an HTMLUnknownElement in the XHTML
    namespace: it clones and appends without error, reports the right attributes,
    and paints absolutely nothing. Inside an <svg> the parser switches to the SVG
    namespace, so the clone is a real SVGCircleElement.
  -->
  <template class="slice-tpl">
    <svg><circle class="slice" cx="50" cy="50" fill="none" /></svg>
  </template>

  <!-- One slice's hover dot + tooltip. JS sets --_angle (the slice's mid-angle)
       and the text; CSS trig puts the dot on the ring. -->
  <!--
    An invisible ANCHOR POINT plus its tooltip, per slice.

    There is no visible marker: the reader hovers the SEGMENT ITSELF, which is
    what they are already pointing at. The anchor exists only because an SVG
    element cannot be a CSS anchor in Chromium — so a zero-size HTML span sits at
    the slice's mid-arc and the tip anchors to that.

    The tip is a SIBLING, never a descendant of a positioned box: an
    absolutely-placed ancestor breaks anchor positioning for a fixed tip.
  -->
  <template class="hotspot-tpl">
    <span class="hotspot chart-anchor-point"></span>
    <span class="chart-tip" role="tooltip">
      <span class="chart-tip-label"></span>
      <span class="chart-tip-value"></span>
    </span>
  </template>
</template>
