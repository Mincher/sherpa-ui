<!--
  sherpa-donut-chart — a donut / pie for part-to-whole data.

  The ring is SVG, one CLOSED <path> per slice (not a stroked circle): a stroke has
  caps, not corners, so it can carry neither a border round the slice nor rounded
  corners. Geometry comes from ringSegmentPath() in src/core/format-tick.ts.
  Slices TOUCH — the rounding alone separates them, as in Figma.

  Public API:
    data-type   donut (default) | pie   (pie fills to the centre, no hole)
    data-label     centre big text
    data-sublabel  centre small text

  Slots: legend — an optional legend beside the ring.

  Fires: slice-click — a slice is clicked. detail: { index, label, value }
-->
<template id="default">
  <figure class="layout" part="layout">
    <div class="ring-wrap">
      <svg class="ring" part="ring" viewBox="0 0 100 100" role="img"
           aria-label="Donut chart" preserveAspectRatio="xMidYMid meet">
        <g class="slices"></g>
      </svg>
      <!-- Tooltip anchors. An SVG element cannot be a CSS anchor in Chromium —
           anchor-name is accepted, silently never resolves, and the tip lands in
           the viewport corner. -->
      <div class="hotspots" part="hotspots"></div>

      <div class="centre">
        <span class="value" part="value"></span>
        <span class="sub" part="sub"></span>
      </div>
    </div>
    <slot name="legend"></slot>
  </figure>

  <!--
    JS sets the `d` and the hue. The prototype is WRAPPED IN AN <svg>: without it
    the parser builds an HTMLUnknownElement that clones, appends and reports its
    attributes without error, and paints nothing.
  -->
  <template class="slice-tpl">
    <svg><path class="slice" /></svg>
  </template>

  <!--
    A zero-size anchor point plus its tooltip, per slice. JS sets --_angle (the
    slice's mid-angle) and the text; CSS trig places the point on the ring.

    The tip is a SIBLING, never a descendant of a positioned box: an
    absolutely-placed ancestor breaks anchor positioning for a fixed tip.
  -->
  <template class="hotspot-tpl">
    <span class="hotspot chart-anchor-point"></span>
    <span class="chart-tip" role="tooltip">
      <span class="chart-tip-label"></span>
      <span class="chart-tip-value"></span>
    </span>
  </template>
</template>
