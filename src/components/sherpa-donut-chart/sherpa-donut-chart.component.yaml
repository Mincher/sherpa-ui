# sherpa-donut-chart — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-donut-chart.{thin.yaml,html,css,ts}. The MECHANICAL surface only —
# props (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# Validated by schemas/component.v1.json; round-trips via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-donut-chart
$description: a donut / pie for part-to-whole data.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  root:
    el: div
    class: layout
    part: layout
    slot: legend
    children:
      - el: div
        class: ring-wrap
        children:
          - el: div
            class: ring
            part: ring
          - el: div
            class: centre
            children:
              - el: span
                class: value
                part: value
              - el: span
                class: sub
                part: sub
props:
  - $type: prop
    name: data-label
    type: string
    kind: content
    description: centre big text
  - $type: prop
    name: data-sublabel
    type: string
    kind: content
    description: centre small text
  - $type: prop
    name: data-variant
    type: enum
    kind: style
    values:
      - donut
      - pie
    description: donut  | pie   (pie removes the centre hole)
states:
  - $type: state
    name: pie
    selector: ":host([data-variant=\"pie\"])"
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (slices). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: nothing
    bubbles: true
    composed: true
tokens:
  layout.gap: "{sherpa.display-space-lg}"
  value.font-size: "{sherpa.font-size-heading-h1}"
  value.font-weight: "{sherpa.font-weight-bold}"
  value.color: "{sherpa.theme-content-body-base}"
  sub.font-size: "{sherpa.font-size-body-small}"
  sub.color: "{sherpa.theme-content-body-1}"
$extensions:
  sherpa:
    figmaName: Donut Chart
    category: chart
    jsProps:
      - name: slices
        type: string
        access: read
