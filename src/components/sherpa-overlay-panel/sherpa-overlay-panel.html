<!--
  sherpa-overlay-panel — a NON-modal floating panel on native <dialog>.
  show(), not showModal(): no backdrop, no focus trap, no ESC — the page behind stays interactive.

  Public API:
    data-icon         a glyph before the title (shows the icon slot area)
    data-heading      link-style header title text (rendered into .title)
    open              native boolean (read reflects dialog.open; set → show()/close())
    data-collapsed    collapsed state (body/footer hidden; the collapse toggle reflects it)
    data-status       status colour cascade (critical | warning | success | info | urgent)

  Toolbar buttons are shown by opt-in data-* flags (CSS-gated):
    data-collapsible  show the collapse toggle
    data-expandable   show the expand button
    data-external     show the external-link button
    data-dismissible  show the close button

  Slots:
    icon         — custom lead icon (else the data-icon glyph)
    description  — the metadata / description row under the title (reflects data-has-description)
    (default)    — the panel body
    footer       — footer action controls (reflects data-has-footer)

  Fires:
    panel-collapse   (detail: { collapsed })
    panel-expand     (detail: { })
    panel-external   (detail: { })
    close            (detail: { })
-->
<template id="default">
  <!-- A non-modal <dialog> gets no ::backdrop, so the tint is a real element.
       Pointer-transparent by design: the page behind stays clickable. -->
  <div class="scrim" part="scrim" aria-hidden="true"></div>
  <dialog class="root sherpa-border-edges sherpa-border-corners" part="root">
    <!-- DEFAULT variant, not data-type="panel" — that inks the title link-blue.
         The header's own collapse/dismiss events are re-emitted as the panel's. -->
    <sherpa-container-header class="header" part="header">
      <slot name="icon" slot="icon"></slot>
      <slot name="description" slot="metadata" data-accepts="content,control"></slot>

      <!-- Specific to a FLOATING panel, so they sit in the actions slot. -->
      <span slot="actions" class="toolbar" part="toolbar">
        <sherpa-button class="expand" part="expand" data-type="icon" data-size="xs"
                       data-look="transparent" data-icon-start="fullscreen"
                       aria-label="Expand"></sherpa-button>
        <sherpa-button class="external" part="external" data-type="icon" data-size="xs"
                       data-look="transparent" data-icon-start="arrow-up-right-from-square"
                       aria-label="Open externally"></sherpa-button>
      </span>
    </sherpa-container-header>

    <div class="body" part="body">
      <slot></slot>
    </div>

    <!-- stretch: a panel footer usually holds ONE full-width control. -->
    <sherpa-container-footer class="footer" part="footer" data-align="stretch">
      <slot name="footer" data-accepts="control,input"></slot>
    </sherpa-container-footer>
  </dialog>
</template>
