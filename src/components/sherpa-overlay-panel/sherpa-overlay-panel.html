<!--
  sherpa-overlay-panel — a NON-modal floating panel on native <dialog>.

  Native-first (naming standard D2/D12): a native <dialog> opened with show()
  (not showModal()) is a floating panel — it sits in the top layer but WITHOUT a
  backdrop, without a focus-trap, and without ESC-to-close, so the page behind
  stays interactive. We chose <dialog>.show() over the Popover API because it
  shares sherpa-dialog's exact structure and lifecycle (one difference: show vs
  showModal) and gives an imperative show()/close() API.

  Matches the Figma "Overlay Panel" (node 1003:33705): a rich header chrome
  (lead icon + link-style title + a description/metadata row + a trailing toolbar
  of collapse / expand / external / close buttons), a body region, and a footer
  region for slotted actions (e.g. Cancel / Apply). Header chrome is rendered by
  the panel itself; the body and footer are slots.

  Public API:
    data-icon         a glyph before the title (shows the icon slot area)
    data-title        link-style header title text (rendered into .title)
    open              native boolean (read reflects dialog.open; set → show()/close())
    data-collapsed    collapsed state (body/footer hidden; the collapse toggle reflects it)
    data-status       status colour cascade (critical | warning | success | info | urgent)

  Toolbar buttons are shown by opt-in data-* flags (CSS-gated):
    data-collapsible  show the collapse toggle
    data-expandable   show the expand button
    data-external     show the external-link button
    data-dismissible  show the close button

  Slots:
    icon         — custom lead icon (else the data-icon glyph)
    description  — the metadata / description row under the title (reflects data-has-description)
    (default)    — the panel body
    footer       — footer action controls (reflects data-has-footer)

  Fires:
    panel-collapse   (detail: { collapsed })
    panel-expand     (detail: { })
    panel-external   (detail: { })
    close            (detail: { })
-->
<template id="default">
  <!-- The SCRIM. A non-modal <dialog> (show(), not showModal()) gets no
       ::backdrop at all — that pseudo-element only paints for a modal — so the
       tint behind the panel has to be a real element. It is pointer-transparent,
       which is the whole point of a non-modal panel: the page behind stays live
       and clickable while the assistant is open. -->
  <div class="scrim" part="scrim" aria-hidden="true"></div>
  <dialog class="root" part="root">
    <header class="header" part="header">
      <div class="row" part="row">
        <span class="icon" part="icon" aria-hidden="true"><slot name="icon"></slot></span>

        <div class="labels" part="labels">
          <span class="title" part="title"></span>
          <div class="description" part="description">
            <slot name="description" data-accepts="content,control"></slot>
          </div>
        </div>

        <div class="toolbar" part="toolbar">
          <button class="collapse" part="collapse" type="button" aria-expanded="true" aria-label="Collapse">
            <span class="collapse-glyph" aria-hidden="true">&#x25B4;</span>
          </button>
          <button class="expand" part="expand" type="button" aria-label="Expand">
            <span class="expand-glyph" aria-hidden="true">&#x26F6;</span>
          </button>
          <button class="external" part="external" type="button" aria-label="Open externally">
            <span class="external-glyph" aria-hidden="true">&#x2197;</span>
          </button>
          <button class="close" part="close" type="button" aria-label="Close">
            <span class="close-glyph" aria-hidden="true">&#x2715;</span>
          </button>
        </div>
      </div>
    </header>

    <div class="body" part="body">
      <slot></slot>
    </div>

    <div class="footer" part="footer">
      <slot name="footer" data-accepts="control,input"></slot>
    </div>
  </dialog>
</template>
