<!--
  sherpa-overlay-panel — a NON-modal panel on native <dialog>, in one of four modes: fixed in a panel area, an overlay on its content,
  floating, or a tab on its area's edge. With no host it is an overlay on the window's right edge.
  show(), not showModal(): no backdrop, no focus trap, no ESC — the page behind stays interactive.
  Slotted into a canvas's or a panel area's own slot, it is docked there already: flush in that area,
  floating inside that layout, its tab on that area's edge. TRAP T-a-panel-slotted-in-a-layout-is-docked-there

  Public API:
    data-icon         a glyph before the title (shows the icon slot area)
    data-heading      header title text (rendered into .title)
    data-searchable   a search row in the header, the header's full width; it fires `panel-search`
    data-search-placeholder  what the search row says (also its label); "Search" by default
    data-padding      `none`: the body has no padding, for content that fills it (a list)
    open              native boolean (read reflects dialog.open; set → show()/close())
    data-collapsed    collapsed state (body/footer hidden; the collapse toggle reflects it)
    data-maximised    full-overlay state: the panel fills the window and shows its breadcrumbs
    data-mode         fixed | overlay | floating | tab: the ONE mode. Fixed is flat, taking its area's room; overlay draws over the view with
                      a shadow, the area giving its room back; floating is off its area, anywhere in its room, moved by its header and
                      resized by its corner (data-x, data-y, data-width, data-height, written at the end of each move or resize); tab is
                      shrunk to a tab, turned 90 degrees, on its area's edge, which opens it as it was. None: fixed in an area, an overlay
                      on the window's edge where it has none. The AREA writes it on every panel in it (max 2); floating is its own
    data-hover-open   a tab opens its panel as a docked overlay while the pointer is on it, and shuts it to the tab as the pointer leaves
    data-side         start | end: the area it docks to (the default is end); kept, a panel overlaid out of its area stays on its edge
    data-minimisable  show the Minimise button
    data-updated      the panel says it changed while a tab: the tab turns active and wears a "!".
                      Set by `notify()` or a new `data-heading`; cleared when it opens
    data-status       status colour cascade (critical | warning | success | info | urgent)

  Toolbar buttons are shown by opt-in data-* flags (CSS-gated):
    data-collapsible  show the collapse toggle
    data-expandable   show the maximise / minimise button
    data-external     show the external-link button
    data-floatable    show the Float button (floating, the Dock one: back to its area, in the area's mode)
    data-dismissible  show the close button

  Slots:
    icon         — custom lead icon (else the data-icon glyph)
    breadcrumbs  — a sherpa-breadcrumbs trail, shown at the top while maximised
    badge        — a badge beside the title: a count, as a filter panel's applied filters
    description  — the metadata / description row under the title (reflects has-description)
    actions      — the host's own header controls, before the view-mode pair and close
    actions-end  — the page's controls after the view-mode pair (Show as toolbar)
    overflow     — the content's ⋮, last
    (default)    — the panel body
    footer       — footer action controls (reflects has-footer)

  Commands (a button's `command`, from `commandfor`): --show, --hide

  Fires:
    panel-search     (detail: { value })  the search row's text changed (typed, cleared by its x, or Escape)
    panel-collapse   (detail: { collapsed })
    panel-expand     (detail: { maximised })
    panel-external   (detail: { })
    panel-mode-change (detail: { mode, restore? })  a button, a tab or `requestMode` asked for a mode: the area that holds it writes `data-mode` (fixed panels stack; overlay and tab are a group, one open), floating on this one alone; with no area it is its own. `restore`: a tab opening to what it was
    panel-close      (detail: { reason })  it shut: reader (the default), width or page
    panel-move       (detail: { x, y })  floating, its header was dragged, or its grip moved by the keys
    panel-drag       (detail: { x, y, phase })  floating, where the POINTER is (client px) while its header drags it: phase move, then end or cancel. The area it floats over lights up to dock it. TRAP T-a-dragged-panel-docks-where-the-area-lights-up
    panel-resize     (detail: { width, height })  its left edge was dragged, or moved by the keys;
                     floating, its corner
-->
<template id="default">
  <!-- Minimised: this tab, turned on its side and flush to the edge of its area, in place of the box. -->
  <div class="tab" part="tab">
    <!-- Its tooltip says what a press does: the state it was left in, the opposite of the button beside it. -->
    <button class="tab-open" part="tab-open" type="button" aria-label="Open panel">
      <span class="tab-title" part="tab-title"></span>
      <span class="tab-mark" part="tab-mark" aria-hidden="true">!</span>
    </button>
  </div>
  <!-- NO scrim: a quick peek, while the page behind stays in use. -->
  <!-- `autofocus` on the dialog itself: opened, the focus is the CONTAINER's, not its first control (the grip); Tab goes on to that. -->
  <dialog class="root sherpa-float sherpa-border-edges sherpa-border-corners" part="root" autofocus tabindex="-1">
    <!-- The LEFT edge resizes it: drag it, or ArrowLeft / ArrowRight on it.
         TRAP T-an-overlay-panel-resizes-from-its-left-edge -->
    <div class="resize" part="resize" role="separator" aria-orientation="vertical"
         aria-label="Resize panel" tabindex="0"></div>
    <div class="trail" part="trail">
      <slot name="breadcrumbs" data-accepts="nav"></slot>
    </div>
    <!-- DEFAULT variant, not data-type="panel" — that inks the title link-blue.
         The header's own collapse/dismiss events are re-emitted as the panel's. -->
    <sherpa-container-header class="header sherpa-float-bar" part="header" data-bordered-close>
      <!-- Floating, the header bar moves it. This grip is for the keys alone: it shows only while it has their focus
           (TODO 931). TRAP T-a-floating-panel-is-a-state -->
      <span slot="lead" class="grip sherpa-float-grip sherpa-icon-box" part="grip" data-icon="drag-handle-vertical" role="button"
            tabindex="0" aria-label="Move panel" title="Drag the header to move it, or use the arrow keys"></span>
      <slot name="icon" slot="icon" data-accepts="icon"></slot>
      <slot name="badge" slot="badge" data-accepts="badge"></slot>
      <slot name="description" slot="metadata" data-accepts="content"></slot>
      <!-- `data-searchable`: a search row of its own, the header's full width, stamped when it first shows. -->
      <template class="search-tpl">
        <sherpa-input-text slot="metadata" class="search" part="search" data-icon-start="magnifying-glass" data-clearable
                           autocomplete="off" placeholder="Search" aria-label="Search"></sherpa-input-text>
      </template>

      <!-- Figma Container Header `Variant=Panel`: the host's controls, then the
           view-mode pair, each divided from the next. -->
      <span slot="actions" class="toolbar" part="toolbar">
        <!-- GROUP 1, the content's own actions (the page's too, e.g. Filters in toolbar): first. -->
        <span class="custom" part="custom">
          <slot name="actions" data-accepts="control"></slot>
          <slot name="actions-end" data-accepts="control"></slot>
        </span>
        <span class="divider after-custom" aria-hidden="true"></span>
        <!-- GROUP 2, where it is docked: as an overlay, or fixed in its area; or floating. Its first and last shown button
             wear the group's ends (`#syncGroup`). TRAP T-a-minimised-panel-is-a-tab
             Each asks for a mode, and the area writes it. TRAP T-a-panel-has-four-modes -->
        <sherpa-group class="docks" part="docks">
          <sherpa-button class="dock-overlay" part="dock-overlay" data-type="icon" data-size="sm"
                         data-icon-start="monitor-w-floating-window" aria-label="Dock as overlay"></sherpa-button>
          <sherpa-button class="dock-fixed" part="dock-fixed" data-type="icon" data-size="sm"
                         data-icon-start="sidebar-flip" aria-label="Dock as fixed"></sherpa-button>
          <!-- Float: lifted off, anywhere in the window; Dock puts it back. -->
          <sherpa-button class="float" part="float" data-type="icon" data-size="sm"
                         data-icon-start="browser" aria-label="Float"
                         data-when-data-icon-start="data-mode=floating: sidebar-flip"
                         data-when-aria-label="data-mode=floating: Dock"></sherpa-button>
        </sherpa-group>
        <span class="divider after-docks" aria-hidden="true"></span>
        <!-- GROUP 3, what it shows: Minimise, Maximise (the full page), open in a new tab. -->
        <sherpa-group class="modes" part="modes">
          <sherpa-button class="minimise" part="minimise" data-type="icon" data-size="sm"
                         data-icon-start="minus" aria-label="Minimise to a tab"></sherpa-button>
          <sherpa-button class="expand" part="expand" data-type="icon" data-size="sm"
                         data-icon-start="fullscreen" aria-label="Maximise"
                         data-when-data-icon-start="data-maximised: fullscreen-exit"
                         data-when-aria-label="data-maximised: Minimise"></sherpa-button>
          <sherpa-button class="external" part="external" data-type="icon" data-size="sm"
                         data-icon-start="open-externally"
                         aria-label="Open externally"></sherpa-button>
        </sherpa-group>
        <span class="divider after-modes" aria-hidden="true"></span>
        <!-- GROUP 4, the overflow menu; then the header's own close. -->
        <slot name="overflow" data-accepts="control"></slot>
        <!-- What the width folded away, one group at a time: shown only then. -->
        <sherpa-button class="fold" part="fold" data-type="icon" data-size="sm"
                       data-icon-start="ellipsis" aria-label="More actions"></sherpa-button>
        <sherpa-menu class="fold-menu" data-align="end"></sherpa-menu>
        <span class="divider after-overflow" aria-hidden="true"></span>
      </span>
    </sherpa-container-header>

    <div class="body" part="body">
      <slot data-accepts="content"></slot>
    </div>

    <!-- stretch: a panel footer usually holds ONE full-width control. -->
    <sherpa-container-footer class="footer" part="footer" data-align="stretch">
      <slot name="footer" data-accepts="control,input"></slot>
    </sherpa-container-footer>
    <!-- Floating, the bottom-right corner resizes it: drag it, or the arrow keys on it. -->
    <div class="corner sherpa-float-corner" part="corner" role="button" tabindex="0" aria-label="Resize panel"
         title="Drag to resize, or use the arrow keys"></div>
  </dialog>
</template>
