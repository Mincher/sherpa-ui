# sherpa-overlay-panel — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-overlay-panel.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-overlay-panel
$description: >-
  a NON-modal floating panel on native <dialog>. show(), not showModal(): no backdrop, no focus
  trap, no ESC — the page behind stays interactive.
element:
  $type: element
  tag: div
  attributes:
    aria-hidden: "true"
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: div
      class: scrim
      part: scrim
      attrs:
        aria-hidden: "true"
    - el: dialog
      class: root sherpa-border-edges sherpa-border-corners
      part: root
      children:
        - el: div
          class: resize
          part: resize
          attrs:
            role: separator
            aria-orientation: vertical
            aria-label: Resize panel
            tabindex: "0"
        - el: sherpa-container-header
          class: header
          part: header
          children:
            - slot: icon
              attrs:
                slot: icon
            - slot: description
              attrs:
                slot: metadata
                data-accepts: content,control
            - el: span
              class: toolbar
              part: toolbar
              attrs:
                slot: actions
              children:
                - slot: actions
                  attrs:
                    data-accepts: control
                - el: sherpa-button
                  class: expand
                  part: expand
                  attrs:
                    data-type: icon
                    data-size: xs
                    data-look: transparent
                    data-icon-start: fullscreen
                    aria-label: Expand
                - el: sherpa-button
                  class: external
                  part: external
                  attrs:
                    data-type: icon
                    data-size: xs
                    data-look: transparent
                    data-icon-start: arrow-up-right-from-square
                    aria-label: Open externally
        - el: div
          class: body
          part: body
          slot: ""
        - el: sherpa-container-footer
          class: footer
          part: footer
          attrs:
            data-align: stretch
          children:
            - slot: footer
              attrs:
                data-accepts: control,input
props:
  - $type: prop
    name: data-collapsed
    type: string
    observed: true
    kind: style
    description: collapsed state (body/footer hidden; the collapse toggle reflects it)
  - $type: prop
    name: data-collapsible
    type: string
    observed: true
    kind: style
    description: show the collapse toggle
  - $type: prop
    name: data-dismissible
    type: string
    observed: true
    kind: style
    description: show the close button
  - $type: prop
    name: data-expandable
    type: string
    observed: false
    kind: style
    description: show the expand button
  - $type: prop
    name: data-external
    type: string
    observed: false
    kind: style
    description: show the external-link button
  - $type: prop
    name: data-heading
    type: string
    observed: true
    kind: style
    description: link-style header title text (rendered into .title)
  - $type: prop
    name: data-icon
    type: string
    observed: true
    kind: style
    description: a glyph before the title (shows the icon slot area)
  - $type: prop
    name: data-status
    type: string
    observed: false
    kind: style
    description: >-
      status colour cascade (critical | warning | success | info | urgent) Toolbar buttons are shown
      by opt-in data-* flags (CSS-gated):
  - $type: prop
    name: open
    type: boolean
    observed: true
    native: true
    default: false
    description: native boolean (read reflects dialog.open; set → show()/close())
states:
  - $type: state
    name: collapsed
    selector: ":host([data-collapsed])"
  - $type: state
    name: not-expandable
    selector: ":host(:not([data-expandable]))"
  - $type: state
    name: not-external
    selector: ":host(:not([data-external]))"
  - $type: state
    name: focus-visible
    selector: .resize:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (open). See $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: >-
      callable from a view definition's state block (show, hide, close). See
      $extensions.sherpa.methods.
events:
  - $type: event
    name: panel-collapse
    bubbles: true
    composed: true
    detail:
      collapsed: unknown
  - $type: event
    name: panel-expand
    bubbles: true
    composed: true
  - $type: event
    name: panel-external
    bubbles: true
    composed: true
  - $type: event
    name: panel-close
    bubbles: true
    composed: true
  - $type: event
    name: panel-resize
    bubbles: true
    composed: true
    detail:
      width: unknown
tokens:
  scrim.background: "{sherpa.display-mode-color-neutral-fixed-color-5}"
  root.border-start-start-radius: "{sherpa.border-rounding-top-left}"
  root.border-end-start-radius: "{sherpa.border-rounding-bottom-left}"
  root.color: "{sherpa.style-content-base}"
  root.box-shadow: "{sherpa.shadow-lg}"
  toolbar.gap: "{sherpa.theme-gap-sm}"
  resize.inline-size: "{sherpa.display-mode-space-xs}"
$extensions:
  sherpa:
    figmaName: Overlay Panel
    methods:
      - $type: method
        name: show
        args: ""
        description: Open as a non-modal floating panel (no backdrop, no focus trap).
      - $type: method
        name: hide
        args: ""
        description: Close it.
      - $type: method
        name: close
        args: ""
        description: "`hide()`, in the native <dialog>'s spelling."
    category: container
    divergence:
      note: >-
        2026-09-07 (D2/D12): split out of the former Container Type=overlay-panel variant into a
        standalone component on native <dialog> opened NON-modally via show() (no backdrop, no
        focus-trap, no ESC — page stays interactive). Chose <dialog>.show() over the Popover API to
        share sherpa-dialog's structure + imperative show()/close() lifecycle. Maps to the Figma
        "Overlay Panel" component (Container set already split).
    jsProps:
      - name: open
        type: boolean
        description: whether the panel is open (delegates to <dialog>)
        access: read-write
