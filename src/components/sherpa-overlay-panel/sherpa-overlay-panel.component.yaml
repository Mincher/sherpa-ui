# sherpa-overlay-panel — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-overlay-panel.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-overlay-panel
$description: a NON-modal floating panel on native <dialog>.
element:
  $type: element
  tag: div
  attributes:
    aria-hidden: "true"
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: div
      class: scrim
      part: scrim
      attrs:
        aria-hidden: "true"
    - el: dialog
      class: root
      part: root
      children:
        - el: header
          class: header
          part: header
          children:
            - el: div
              class: row
              part: row
              children:
                - el: span
                  class: icon
                  part: icon
                  slot: icon
                  attrs:
                    aria-hidden: "true"
                - el: div
                  class: labels
                  part: labels
                  children:
                    - el: span
                      class: title
                      part: title
                    - el: div
                      class: description
                      part: description
                      children:
                        - slot: description
                          attrs:
                            data-accepts: content,control
                - el: div
                  class: toolbar
                  part: toolbar
                  children:
                    - el: button
                      class: collapse
                      part: collapse
                      attrs:
                        type: button
                        aria-expanded: "true"
                        aria-label: Collapse
                      children:
                        - el: span
                          class: collapse-glyph
                          attrs:
                            aria-hidden: "true"
                    - el: button
                      class: expand
                      part: expand
                      attrs:
                        type: button
                        aria-label: Expand
                      children:
                        - el: span
                          class: expand-glyph
                          attrs:
                            aria-hidden: "true"
                    - el: button
                      class: external
                      part: external
                      attrs:
                        type: button
                        aria-label: Open externally
                      children:
                        - el: span
                          class: external-glyph
                          attrs:
                            aria-hidden: "true"
                    - el: button
                      class: close
                      part: close
                      attrs:
                        type: button
                        aria-label: Close
                      children:
                        - el: span
                          class: close-glyph
                          attrs:
                            aria-hidden: "true"
        - el: div
          class: body
          part: body
          slot: ""
        - el: div
          class: footer
          part: footer
          children:
            - slot: footer
              attrs:
                data-accepts: control,input
props:
  - $type: prop
    name: data-collapsed
    type: string
    kind: content
    description: collapsed state (body/footer hidden; the collapse toggle reflects it)
  - $type: prop
    name: data-collapsible
    type: string
    kind: style
    description: show the collapse toggle
  - $type: prop
    name: data-dismissible
    type: string
    kind: style
    description: show the close button
  - $type: prop
    name: data-expandable
    type: string
    kind: style
    description: show the expand button
  - $type: prop
    name: data-external
    type: string
    kind: style
    description: show the external-link button
  - $type: prop
    name: data-heading
    type: string
    kind: style
    description: — convenience header label (a slotted [slot=header] overrides it)
  - $type: prop
    name: data-icon
    type: string
    kind: style
    description: a glyph before the title (shows the icon slot area)
  - $type: prop
    name: data-status
    type: string
    kind: style
    description: >-
      status colour cascade (critical | warning | success | info | urgent) Toolbar buttons are shown
      by opt-in data-* flags (CSS-gated):
  - $type: prop
    name: data-title
    type: string
    kind: style
    description: link-style header title text (rendered into .title)
  - $type: prop
    name: open
    type: string
    description: native boolean (read reflects dialog.open; set → show()/close())
states:
  - $type: state
    name: icon
    selector: ":host([data-icon])"
  - $type: state
    name: has-icon
    selector: ":host([data-has-icon])"
  - $type: state
    name: title
    selector: ":host([data-title])"
  - $type: state
    name: has-description
    selector: ":host([data-has-description])"
  - $type: state
    name: collapsible
    selector: ":host([data-collapsible])"
  - $type: state
    name: expandable
    selector: ":host([data-expandable])"
  - $type: state
    name: external
    selector: ":host([data-external])"
  - $type: state
    name: dismissible
    selector: ":host([data-dismissible])"
  - $type: state
    name: collapsed
    selector: ":host([data-collapsed])"
  - $type: state
    name: has-footer
    selector: ":host([data-has-footer])"
  - $type: state
    name: focus-visible
    selector: .collapse:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (open). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: panel-collapse
    bubbles: true
    composed: true
  - $type: event
    name: panel-expand
    bubbles: true
    composed: true
  - $type: event
    name: panel-external
    bubbles: true
    composed: true
  - $type: event
    name: close
    bubbles: true
    composed: true
tokens:
  root.border-block-start-width: "{sherpa.border-top}"
  root.border-block-end-width: "{sherpa.border-bottom}"
  root.border-inline-start-width: "{sherpa.border-left}"
  root.border-inline-end-width: "{sherpa.border-right}"
  root.color: "{sherpa.style-content-base}"
  root.box-shadow: "{sherpa.display-mode-size-2xs}"
  header.border-block-end: "{sherpa.style-border-width}"
  row.gap: "{sherpa.theme-gap-sm}"
  row.padding: "{sherpa.theme-padding-md}"
  icon.inline-size: "{sherpa.theme-content-size-base}"
  icon.block-size: "{sherpa.theme-content-size-base}"
  icon.margin-block-start: "{sherpa.display-mode-space-3xs}"
  icon.color: "{sherpa.theme-content-body-1}"
  labels.gap: "{sherpa.theme-gap-sm}"
  title.color: "{sherpa.theme-content-link-1}"
  title.font-family: "{sherpa.font-family-body}"
  title.font-size: "{sherpa.font-size-body-base}"
  title.font-weight: "{sherpa.font-weight-medium}"
  title.line-height: "{sherpa.theme-content-line-height-base}"
  description.gap: "{sherpa.theme-gap-lg}"
  description.color: "{sherpa.theme-content-body-1}"
  description.font-family: "{sherpa.font-family-body}"
  description.font-size: "{sherpa.font-size-body-small}"
  description.line-height: "{sherpa.theme-content-line-height-small}"
  toolbar.gap: "{sherpa.theme-gap-sm}"
  collapse.inline-size: "{sherpa.display-mode-size-sm}"
  collapse.block-size: "{sherpa.display-mode-size-sm}"
  collapse.border-radius: "{sherpa.display-mode-border-rounding-base}"
  collapse.color: "{sherpa.style-content-base}"
  expand.inline-size: "{sherpa.display-mode-size-sm}"
  expand.block-size: "{sherpa.display-mode-size-sm}"
  expand.border-radius: "{sherpa.display-mode-border-rounding-base}"
  expand.color: "{sherpa.style-content-base}"
  external.inline-size: "{sherpa.display-mode-size-sm}"
  external.block-size: "{sherpa.display-mode-size-sm}"
  external.border-radius: "{sherpa.display-mode-border-rounding-base}"
  external.color: "{sherpa.style-content-base}"
  close.inline-size: "{sherpa.display-mode-size-sm}"
  close.block-size: "{sherpa.display-mode-size-sm}"
  close.border-radius: "{sherpa.display-mode-border-rounding-base}"
  close.color: "{sherpa.style-content-base}"
  footer.gap: "{sherpa.theme-gap-sm}"
  footer.padding: "{sherpa.theme-padding-md}"
  footer.border-block-start: "{sherpa.style-border-width}"
$extensions:
  sherpa:
    figmaName: Overlay Panel
    category: container
    divergence:
      note: >-
        2026-09-07 (D2/D12): split out of the former Container Type=overlay-panel variant into a
        standalone component on native <dialog> opened NON-modally via show() (no backdrop, no
        focus-trap, no ESC — page stays interactive). Chose <dialog>.show() over the Popover API to
        share sherpa-dialog's structure + imperative show()/close() lifecycle. Maps to the Figma
        "Overlay Panel" component (Container set already split).
    jsProps:
      - name: open
        type: boolean
        description: whether the panel is open (delegates to <dialog>)
        access: read-write
