# sherpa-button — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-button.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-button
$description: the primary interactive trigger.
element:
  $type: element
  tag: button
  attributes:
    type: button
  provides:
    - click
    - keyboard
    - focus
    - disabled
templates:
  - default
  - icon
anatomy:
  root:
    el: button
    class: trigger
    part: trigger
    attrs:
      type: button
    children:
      - el: i
        class: icon icon-start
        attrs:
          aria-hidden: "true"
      - el: span
        class: label
        slot: ""
      - el: i
        class: icon icon-end
        attrs:
          aria-hidden: "true"
      - el: span
        class: badge
        children:
          - slot: badge
            attrs:
              data-accepts: badge
      - el: span
        class: menu-slot
        children:
          - slot: menu
            attrs:
              data-accepts: menu
props:
  - $type: prop
    name: data-badge
    type: string
    kind: content
    description: trailing badge glyph/text value (or slot a node into "badge")
  - $type: prop
    name: data-icon-end
    type: string
    kind: visibility
    description: icon glyph value
  - $type: prop
    name: data-icon-start
    type: string
    kind: visibility
    description: icon glyph value
  - $type: prop
    name: data-label
    type: string
    kind: content
    description: label text (or use the default slot)
  - $type: prop
    name: data-look
    type: enum
    kind: style
    values:
      - saturated
      - transparent
    description: >-
      saturated (primary) | transparent (tertiary) (omitted = default / "secondary": white surface,
      grey border, dark ink)
  - $type: prop
    name: data-size
    type: enum
    kind: style
    values:
      - 2xs
      - xs
      - sm
      - lg
      - xl
    default: omitted = base size
    description: 2xs | xs | sm | lg | xl
  - $type: prop
    name: data-status
    type: enum
    kind: style
    values:
      - critical
      - warning
      - success
      - info
      - urgent
    description: critical | warning | success | info | urgent  (tints the look tier)
  - $type: prop
    name: data-type
    type: string
    kind: style
    description: icon
  - $type: prop
    name: data-variant
    type: enum
    kind: style
    values:
      - primary
      - secondary
      - tertiary
      - tertiary-on-color
    description: primary | secondary | tertiary | tertiary-on-color
  - $type: prop
    name: disabled
    type: boolean
    native: true
    kind: content
    default: false
    description: native disabled state
states:
  - $type: state
    name: saturated
    selector: ":host([data-look=\"saturated\"])"
  - $type: state
    name: transparent
    selector: ":host([data-look=\"transparent\"])"
  - $type: state
    name: icon
    selector: ":host([data-type=\"icon\"])"
  - $type: state
    name: icon-start
    selector: ":host([data-icon-start])"
  - $type: state
    name: icon-end
    selector: ":host([data-icon-end])"
  - $type: state
    name: badge
    selector: ":host([data-badge])"
  - $type: state
    name: has-badge
    selector: ":host([data-has-badge])"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
  - $type: state
    name: focus-visible
    selector: .trigger:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (templateId). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: button-click
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .trigger
tokens:
  trigger.gap: "{sherpa.button-space-gap}"
  trigger.min-block-size: "{sherpa.button-size-height}"
  trigger.padding-inline: "{sherpa.button-space-padding}"
  trigger.font-size: "{sherpa.button-font-size}"
  trigger.font-weight: "{sherpa.structure-font-weight}"
  trigger.line-height: "{sherpa.button-font-line-height}"
  icon.inline-size: "{sherpa.button-size-icon}"
  icon.block-size: "{sherpa.button-size-icon}"
  icon.font-size: "{sherpa.button-size-icon}"
$extensions:
  sherpa:
    figmaName: Button
    category: control
    variantAxes:
      - name: Type
        values:
          - icon
          - label
      - name: State
        values:
          - Default
    booleanProps:
      - hasIconStart
      - hasIconEnd
      - hasBadge
    divergence:
      note: >-
        2026-08-26: HTML-element note. Sherpa deliberately does NOT use <a role="button"> — a
        navigating trigger stays a real link, not a button-styled anchor. For a form SUBMIT (<input
        type="submit"> / <button type="submit">), use this Button styled Saturated-Default in
        appearance (the Saturated look-tier, default state). i.e. the submit action of a form is a
        Saturated-Default Button, not a separate component.
    jsProps:
      - name: templateId
        type: string
        access: read
