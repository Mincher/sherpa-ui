name: sherpa-button
figmaName: Button
category: control
description: the primary interactive trigger.
props:
  data-label:
    kind: content
  data-icon-start:
    kind: visibility
  data-icon-end:
    kind: visibility
  disabled:
    kind: style
templates:
  - type
  - icon
  - default
slots:
  '':
    accepts: []
    description: ''
events:
  button-click:
    $verbatim:
      trigger:
        'on': click
        node: .trigger
parts:
  - trigger
tokens:
  trigger:button-space-gap: button-space-gap
  trigger:button-size-height: button-size-height
  trigger:button-space-padding: button-space-padding
  trigger:button-font-size: button-font-size
  trigger:core-fonts-weight-600: core-fonts-weight-600
  icon:button-size-icon: button-size-icon
  trigger:content-inactive-base: content-inactive-base
  trigger:control-surface-inactive: control-surface-inactive
  trigger:border-interactive-inactive: border-interactive-inactive
  icon:content-inactive-base: content-inactive-base
_divergence:
  note: >-
    2026-08-26: HTML-element note. Sherpa deliberately does NOT use <a role="button"> — a
    navigating trigger stays a real link, not a button-styled anchor. For a form SUBMIT
    (<input type="submit"> / <button type="submit">), use this Button styled Saturated-Default
    in appearance (the Saturated look-tier, default state). i.e. the submit action of a form is a
    Saturated-Default Button, not a separate component.
figmaVerbatim:
  _status: matched
  figmaName: Button
  nodeType: COMPONENT_SET
  built: true
  variantAxes:
    - name: Type
      values:
        - icon
        - label
    - name: State
      values:
        - Default
  booleanProps:
    - hasIconStart
    - hasIconEnd
    - hasBadge
  textProps:
    - label
  instanceProps:
    - iconStart
    - iconEnd
  modePins: {}
  figmaEvents:
    - button-click
    - menu-open
    - menu-close
    - menu-select
    - menu-populate
