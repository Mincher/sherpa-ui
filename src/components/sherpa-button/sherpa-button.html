<!--
  sherpa-button — the primary interactive trigger.
  Two templates, selected by data-type: default (icon(s) + label), icon (square).

  Public API (data-* + native):
    data-look      saturated (primary) | transparent (tertiary)
                   (omitted = default / "secondary": white surface, grey border, dark ink)
    data-size      2xs | xs | sm | lg | xl   (default omitted = base size)
    data-type      icon            (default omitted)
    data-status    critical | warning | success | info | urgent  (tints the look tier)
    data-icon-start / data-icon-end   icon glyph value
    data-badge     the text of the trailing sherpa-badge (or slot a node into "badge")
    data-label     label text (or use the default slot)
    data-tip       the tooltip's text. Unset: an unlabelled button's tip is its
                   aria-label, and a labelled one has none
    data-no-tip    no tooltip — for a host that composes the button and says it itself
    data-no-tab    out of the tab order — for a host whose own keys do the same (a stepper)
    data-open      set by JS while its slotted menu is open — CSS only
    disabled       native disabled state

  Slots:
    (default)      label content
    badge          trailing badge — data-accepts: badge
    menu           a sherpa-menu this button opens — data-accepts: menu

  Fires: button-click
-->
<template id="default">
  <button class="trigger sherpa-anchor" part="trigger" type="button">
    <i class="icon sherpa-icon-box icon-start" aria-hidden="true"></i>
    <span class="label"><slot></slot></span>
    <i class="icon sherpa-icon-box icon-end" aria-hidden="true"></i>
    <span class="badge"><slot name="badge" data-accepts="badge"><sherpa-badge class="badge-value"></sherpa-badge></slot></span>
    <!-- Named, not default: a popover in the default slot joins the label's textContent and widens the button. -->
    <span class="menu-slot"><slot name="menu" data-accepts="menu"></slot></span>
  </button>
  <!-- What the button DOES, on hover and focus. aria-hidden: the name already says it. -->
  <span class="tip sherpa-tip" part="tip" aria-hidden="true"></span>
</template>

<template id="icon">
  <button class="trigger sherpa-anchor" part="trigger" type="button">
    <i class="icon sherpa-icon-box icon-start" aria-hidden="true"></i>
    <!-- An icon button opens a slotted MENU too — the legend's Other row is one.
         Without the slot the menu had nowhere to render. TRAP T-an-icon-button-still-slots-its-menu -->
    <span class="menu-slot"><slot name="menu" data-accepts="menu"></slot></span>
  </button>
  <span class="tip sherpa-tip" part="tip" aria-hidden="true"></span>
</template>
