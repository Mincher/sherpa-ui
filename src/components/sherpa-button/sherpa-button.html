<!--
  sherpa-button — the primary interactive trigger.

  Two templates, selected by data-type:
    default — icon(s) + label
    icon    — icon only (square)

  Public API (data-* + native):
    data-look      saturated (primary) | transparent (tertiary)
                   (omitted = default / "secondary": white surface, grey border, dark ink)
    data-size      2xs | xs | sm | lg | xl   (default omitted = base size)
    data-type      icon            (default omitted)
    data-status    critical | warning | success | info | urgent  (tints the look tier)
    data-icon-start / data-icon-end   icon glyph value
    data-badge     trailing badge glyph/text value (or slot a node into "badge")
    data-label     label text (or use the default slot)
    disabled       native disabled state

  Slots:
    (default)      label content
    badge          trailing badge — data-accepts: badge

  Fires: button-click
-->
<template id="default">
  <button class="trigger" part="trigger" type="button">
    <i class="icon icon-start" aria-hidden="true"></i>
    <span class="label"><slot></slot></span>
    <i class="icon icon-end" aria-hidden="true"></i>
    <span class="badge"><slot name="badge" data-accepts="badge"></slot></span>
    <!--
      A MENU this button triggers. Named, not the default slot: a popover placed
      in the default slot lands inside the LABEL, so its rows' text joins the
      label's textContent ("Add filter" became "Add filterSeatsHealthOpen
      tickets") and their width pushed the button 22px past the design's 99.

      The popover paints in the top layer, so this span never affects layout.
    -->
    <span class="menu-slot"><slot name="menu" data-accepts="menu"></slot></span>
  </button>
</template>

<template id="icon">
  <button class="trigger" part="trigger" type="button">
    <i class="icon icon-start" aria-hidden="true"></i>
  </button>
</template>
