# sherpa-router — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-router.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-router
$description: the ONE owner of the URL, on the Navigation API. It draws nothing.
templates:
  - default
anatomy:
  root:
    slot: ""
    attrs:
      data-accepts: any
props:
  - $type: prop
    name: data-overlay
    type: string
    observed: false
    kind: style
    description: >-
      owned parameters that open OVER the page. A link that names only these keeps the rest of the
      route as it is
  - $type: prop
    name: data-params
    type: string
    observed: false
    kind: style
    description: >-
      the URL search parameters it owns, space separated: `name`, or `name=default` for the value a
      URL that leaves it out means
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (route). See $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: callable from a view definition's state block (href, go). See $extensions.sherpa.methods.
events:
  - $type: event
    name: route-change
    bubbles: true
    composed: true
    detail:
      changed: unknown
      previous: unknown
      route: unknown
      type: unknown
      waitUntil: unknown
$extensions:
  sherpa:
    methods:
      - $type: method
        name: href
        args: "route: Route"
        description: The URL for a route — for a real `<a href>`. Unowned parameters are kept.
      - $type: method
        name: go
        args: "changes: Route, options: { replace?: boolean } = {}"
        description: "Navigate: the changes over the route now. Settles when the page has."
    jsProps:
      - name: route
        type: Route
        access: read
