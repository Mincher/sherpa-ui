<!--
  sherpa-transfer-list — a two-pane shuttle (available ↔ selected).

  Matches the Figma "Transfer List": each pane's rows are sherpa-list-item
  instances (with a leading selection control) and the shuttle controls are
  sherpa-button instances — composition, not ad-hoc DOM.

  The full pool is supplied via populate([{ value, label, selected? }]); items
  sit in the left or right pane per their `selected` flag. Selecting rows stages
  them; the move buttons shuttle staged (or all) items across.

  Public API:
    data-source-heading  heading for the available pane (default "Available")
    data-target-heading  heading for the selected pane  (default "Selected")

  Fires: transfer-change — detail: { selected, moved, direction }
-->
<template id="default">
  <div class="panes" part="panes">
    <div class="pane source" part="pane">
      <h3 class="pane-heading" part="heading"></h3>
      <ul class="pane-list" part="list" role="listbox" aria-multiselectable="true"></ul>
      <p class="pane-empty" part="empty">No items</p>
    </div>

    <div class="moves" part="moves" role="group" aria-label="Transfer controls">
      <sherpa-button class="move" data-move="add"        data-variant="secondary" data-size="sm" data-label="›"  aria-label="Add selected"></sherpa-button>
      <sherpa-button class="move" data-move="add-all"    data-variant="secondary" data-size="sm" data-label="»"  aria-label="Add all"></sherpa-button>
      <sherpa-button class="move" data-move="remove"     data-variant="secondary" data-size="sm" data-label="‹"  aria-label="Remove selected"></sherpa-button>
      <sherpa-button class="move" data-move="remove-all" data-variant="secondary" data-size="sm" data-label="«"  aria-label="Remove all"></sherpa-button>
    </div>

    <div class="pane target" part="pane">
      <h3 class="pane-heading" part="heading"></h3>
      <ul class="pane-list" part="list" role="listbox" aria-multiselectable="true"></ul>
      <p class="pane-empty" part="empty">Nothing selected</p>
    </div>
  </div>

  <template class="row-tpl">
    <li class="row" role="option">
      <sherpa-list-item data-selectable data-interactive></sherpa-list-item>
    </li>
  </template>
</template>
