<!--
  sherpa-transfer-list — a two-pane shuttle (available ↔ selected).
  Pool comes from populate([{ value, label, selected? }]); `selected` picks the pane.

  Public API:
    data-source-heading  heading for the available pane (default "Available")
    data-target-heading  heading for the selected pane  (default "Selected")

  Fires: transfer-change — detail: { selected, moved, direction }
-->
<template id="default">
  <div class="panes" part="panes">
    <div class="pane source" part="pane">
      <h3 class="pane-heading" part="heading" id="source-heading"></h3>
      <ul class="pane-list" part="list" role="listbox" aria-multiselectable="true" aria-labelledby="source-heading"></ul>
      <p class="pane-empty" part="empty">No items</p>
    </div>

    <div class="moves" part="moves" role="group" aria-label="Transfer controls">
      <sherpa-button class="move" data-move="add"        data-size="sm" data-label="›"  aria-label="Add selected"></sherpa-button>
      <sherpa-button class="move" data-move="add-all"    data-size="sm" data-label="»"  aria-label="Add all"></sherpa-button>
      <sherpa-button class="move" data-move="remove"     data-size="sm" data-label="‹"  aria-label="Remove selected"></sherpa-button>
      <sherpa-button class="move" data-move="remove-all" data-size="sm" data-label="«"  aria-label="Remove all"></sherpa-button>
    </div>

    <div class="pane target" part="pane">
      <h3 class="pane-heading" part="heading" id="target-heading"></h3>
      <ul class="pane-list" part="list" role="listbox" aria-multiselectable="true" aria-labelledby="target-heading"></ul>
      <p class="pane-empty" part="empty">Nothing selected</p>
    </div>
  </div>

  <template class="row-tpl">
    <li class="row" role="option" data-attr-data-value="value">
      <sherpa-list-item data-selectable data-interactive
                        data-attr-data-heading="label"></sherpa-list-item>
    </li>
  </template>
</template>
