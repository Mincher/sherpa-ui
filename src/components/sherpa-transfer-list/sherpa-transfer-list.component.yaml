# sherpa-transfer-list — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-transfer-list.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-transfer-list
$description: >-
  A two-pane shuttle (available ↔ selected): each row is a composed sherpa-list-item with a leading
  selection control; the shuttle controls are composed sherpa-button instances.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: div
      class: panes
      part: panes
      children:
        - el: div
          class: pane source
          part: pane
          children:
            - el: h3
              class: pane-heading
              part: heading
            - el: ul
              class: pane-list
              part: list
              attrs:
                role: listbox
                aria-multiselectable: "true"
            - el: p
              class: pane-empty
              part: empty
        - el: div
          class: moves
          part: moves
          attrs:
            role: group
            aria-label: Transfer controls
          children:
            - el: sherpa-button
              class: move
              attrs:
                data-move: add
                data-variant: secondary
                data-size: sm
                data-label: ›
                aria-label: Add selected
            - el: sherpa-button
              class: move
              attrs:
                data-move: add-all
                data-variant: secondary
                data-size: sm
                data-label: »
                aria-label: Add all
            - el: sherpa-button
              class: move
              attrs:
                data-move: remove
                data-variant: secondary
                data-size: sm
                data-label: ‹
                aria-label: Remove selected
            - el: sherpa-button
              class: move
              attrs:
                data-move: remove-all
                data-variant: secondary
                data-size: sm
                data-label: «
                aria-label: Remove all
        - el: div
          class: pane target
          part: pane
          children:
            - el: h3
              class: pane-heading
              part: heading
            - el: ul
              class: pane-list
              part: list
              attrs:
                role: listbox
                aria-multiselectable: "true"
            - el: p
              class: pane-empty
              part: empty
    - el: template
      class: row-tpl
      children:
        - el: li
          class: row
          attrs:
            role: option
          children:
            - el: sherpa-list-item
              attrs:
                data-selectable: ""
                data-interactive: ""
props:
  - $type: prop
    name: data-source-heading
    type: string
    kind: style
    default: "\"Available\""
    description: heading for the available pane
  - $type: prop
    name: data-target-heading
    type: string
    kind: style
    default: "\"Selected\""
    description: heading for the selected pane
states:
  - $type: state
    name: disabled
    selector: ":host([disabled])"
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (selected). See $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: >-
      callable from a view definition's state block (getSelectedValues). See
      $extensions.sherpa.methods.
events:
  - $type: event
    name: transfer-change
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .moves
  - $type: event
    name: moved
    bubbles: true
    composed: true
  - $type: event
    name: direction
    bubbles: true
    composed: true
tokens:
  pane.border-width: "{sherpa.display-mode-border-width-base}"
  pane.border-radius: "{sherpa.border-rounding-top-left}"
  pane-heading.padding: "{sherpa.display-mode-space-xs}"
  pane-heading.border-block-end: "{sherpa.display-mode-border-width-base}"
  pane-heading.background: "{sherpa.theme-surface-default-1}"
  pane-heading.color: "{sherpa.theme-content-body-1}"
  pane-heading.font-size: "{sherpa.font-size-body-small}"
  pane-heading.font-weight: "{sherpa.font-weight-regular}"
  pane-heading.line-height: "{sherpa.theme-content-line-height-small}"
  pane-empty.padding: "{sherpa.display-mode-space-base}"
  pane-empty.color: "{sherpa.theme-content-body-1}"
  row.border-radius: "{sherpa.border-rounding-top-left}"
  moves.gap: "{sherpa.display-mode-space-2xs}"
$extensions:
  sherpa:
    figmaName: Transfer List
    methods:
      - $type: method
        name: getSelectedValues
        args: ""
        description: name, and two names for one thing is how they drift.
    category: container
    jsProps:
      - name: selected
        type: string
        access: read-write
