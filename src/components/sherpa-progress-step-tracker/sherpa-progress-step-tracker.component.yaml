# sherpa-progress-step-tracker — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-progress-step-tracker.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-progress-step-tracker
$description: a horizontal stepper.
element:
  $type: element
  tag: ol
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: ol
      class: steps
      part: steps
    - el: template
      class: step-tpl
      children:
        - el: li
          class: step-item
          children:
            - el: button
              class: step
              part: step
              attrs:
                type: button
                data-index: data-index
              children:
                - el: span
                  class: marker
                  part: marker
                  children:
                    - el: span
                      class: number
                    - el: span
                      class: check
                      attrs:
                        aria-hidden: "true"
                - el: span
                  class: text
                  children:
                    - el: span
                      class: label
                      attrs:
                        data-text: label
                    - el: span
                      class: description
                      attrs:
                        data-text: description
props:
  - $type: prop
    name: data-current-step
    type: string
    observed: true
    kind: style
    description: — 0-based index of the active step
states:
  - $type: state
    name: focus-visible
    selector: .step:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (steps, currentStep). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: step-select
    bubbles: true
    composed: true
    detail:
      index: unknown
      label: string
tokens:
  step.gap: "{sherpa.display-mode-space-2xs}"
  step.inline-size: "{sherpa.display-mode-size-3xl}"
  marker.inline-size: "{sherpa.display-mode-size-lg}"
  marker.block-size: "{sherpa.display-mode-size-lg}"
  marker.border-radius: "{sherpa.display-mode-border-rounding-full}"
  marker.border-width: "{sherpa.display-mode-border-width-base}"
  marker.border-color: "{sherpa.style-border-base}"
  marker.background: "{sherpa.style-surface-base}"
  marker.color: "{sherpa.style-content-base}"
  marker.font-size: "{sherpa.font-size-body-base}"
  marker.font-weight: "{sherpa.font-weight-regular}"
  marker.line-height: "{sherpa.theme-content-line-height-base}"
  text.gap: "{sherpa.display-mode-space-3xs}"
  label.font-size: "{sherpa.font-size-body-small}"
  label.font-weight: "{sherpa.font-weight-medium}"
  label.color: "{sherpa.theme-content-body-1}"
  description.font-size: "{sherpa.font-size-body-small}"
  description.color: "{sherpa.theme-content-body-1}"
  connector.block-size: "{sherpa.display-mode-border-width-lg}"
  connector.margin-block-start: "{sherpa.display-mode-size-lg}"
  connector.background: "{sherpa.style-border-base}"
$extensions:
  sherpa:
    figmaName: Progress Steps
    category: control
    jsProps:
      - name: steps
        type: string
        access: read-write
      - name: currentStep
        type: string
        access: read-write
