<!--
  sherpa-progress-step-tracker — a horizontal stepper.

  Renders step nodes from populate([{ label, description? }]) (or the `steps`
  property). Each step's state (done | active | todo) is a data-state attribute
  the CSS keys off — derived by comparing the step index to data-current-step.
  Connector lines sit between adjacent steps.

  Data-driven rows use cloning prototypes (no id — the base parser ignores them).

  Public API:
    data-current-step — 0-based index of the active step

  Fires: step-click — detail: { index, label }
-->
<template id="default">
  <ol class="steps" part="steps" role="list"></ol>

  <template class="step-tpl">
    <li class="step" role="listitem">
      <span class="marker" part="marker">
        <span class="number"></span>
        <span class="check" aria-hidden="true">✓</span>
      </span>
      <span class="text">
        <span class="label"></span>
        <span class="description"></span>
      </span>
    </li>
  </template>

  <template class="connector-tpl">
    <li class="connector" aria-hidden="true"></li>
  </template>
</template>
