<!--
  sherpa-progress-step-tracker — a horizontal stepper.

  Public API:
    data-current-step — 0-based index of the active step

  Fires: step-select — detail: { index, label }
-->
<template id="default">
  <ol class="steps" part="steps"></ol>

  <template class="step-tpl">
    <li class="step-item">
      <button type="button" class="step" part="step" data-index="data-index">
        <span class="marker" part="marker">
          <span class="number"></span>
          <span class="check" aria-hidden="true">✓</span>
        </span>
        <span class="text">
          <span class="label" data-text="label"></span>
          <span class="description" data-text="description"></span>
        </span>
      </button>
    </li>
  </template>

  <template class="connector-tpl">
    <li class="connector" aria-hidden="true"></li>
  </template>
</template>
