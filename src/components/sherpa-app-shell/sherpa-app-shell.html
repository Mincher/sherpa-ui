<!--
  sherpa-app-shell — the frame for an app and its Contexts. Nav and header are
  PRE-COMPOSED; slotting your own replaces the default.

  Public API:
    data-nav-state   collapsed (default) | hover | default | pinned | settings —
                     mirrored from the rail; drives the content inset
    data-no-nav      drop the nav rail; the content spans the full width (boolean)
    data-no-header   let the content span the full height (no header row) (boolean)

  Slots:
    nav       replace the default <sherpa-nav>          (data-accepts: nav)
    header    replace the default <sherpa-app-header>   (data-accepts: app-header, toolbar)
    (default) the Context content                       (data-accepts: any)
    Set `--sherpa-panel-area-width` to change how wide a panel area is
    (default 360px). The AREA owns it, not the panel inside.

    panel-start  a panel BESIDE the Context, on the leading side — a filter
              panel. Empty it takes no room.      (data-accepts: filter-panel, panel)
    panel-end a panel on the trailing side — details, or Ask. Empty it takes
              no room.                            (data-accepts: panel, overlay-panel)
    overlay   covers the header and content, beside the rail — a
              <sherpa-dialog data-type="overlay">             (data-accepts: dialog)
-->
<template id="default">
  <div class="shell">
    <div class="nav" part="nav">
      <slot name="nav"><sherpa-nav></sherpa-nav></slot>
    </div>
    <!-- The header must be the scroller's sticky first child — as a grid row
         above it, `position: sticky` and `scroll-state(stuck: top)` silently
         do nothing. -->
    <div class="frame" part="frame">
      <main class="content" part="content">
        <header class="header" part="header">
          <slot name="header"><sherpa-app-header></sherpa-app-header></slot>
        </header>
        <!-- PANEL AREAS beside the Context: a filter panel on the left, and a
             details or Ask panel on the right. Empty they take no room, so a
             Context that slots neither is unchanged.
             TRAP T-the-shell-owns-the-panel-areas -->
        <div class="body" part="body">
          <aside class="panel-start" part="panel-start">
            <slot name="panel-start" data-accepts="filter-panel, panel"></slot>
          </aside>
          <div class="context-frame"><slot></slot></div>
          <aside class="panel-end" part="panel-end">
            <slot name="panel-end" data-accepts="panel, overlay-panel"></slot>
          </aside>
        </div>
      </main>
      <div class="overlay" part="overlay"><slot name="overlay" data-accepts="dialog"></slot></div>
    </div>
  </div>
</template>
