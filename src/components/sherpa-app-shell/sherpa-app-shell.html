<!--
  sherpa-app-shell — the boilerplate frame for an app or a view.

  A three-region grid: a nav rail down the left, an app-header across the top of
  the content, and a scrolling content area with the layout grid rules applied.
  Drop a <sherpa-nav> in the nav slot, a <sherpa-app-header> in the header slot,
  and your view content in the default slot. All three regions are empty by
  default — this is a wrapper, not a composition.

  Public API:
    data-nav-collapsed   collapse the nav rail to icon width (boolean)
    data-no-header       let the content span the full height (no header row) (boolean)

  Slots:
    nav       the navigation rail        (data-accepts: nav)
    header    the app header row         (data-accepts: app-header, toolbar)
    (default) the view content           (data-accepts: any)
-->
<template id="default">
  <div class="shell">
    <div class="region nav" part="nav"><slot name="nav"></slot></div>
    <header class="region header" part="header"><slot name="header"></slot></header>
    <main class="region content" part="content"><slot></slot></main>
  </div>
</template>
