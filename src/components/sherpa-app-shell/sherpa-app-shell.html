<!--
  sherpa-app-shell — the frame for an app and its Contexts. Nav and header are
  PRE-COMPOSED; slotting your own replaces the default.

  Public API:
    data-nav-state   collapsed (default) | hover | default | pinned | settings —
                     mirrored from the rail; drives the content inset
    data-no-nav      drop the nav rail; the content spans the full width (boolean)
    data-no-header   let the content span the full height (no header row) (boolean)
    data-scroll-shadow   an inner shadow on each edge the Context is scrolled past (boolean)
    data-panel-start-width / data-panel-end-width   a panel area's width, in px —
                     what a reader dragged it to, handed back by the host. The
                     area never goes under its min or over 33% of its row.
                     The areas are sherpa-layout-panels': a docked panel fills its
                     area flush, and the area draws the divider.

  Fires:
    panel-area-resize — an area's inner edge was dragged, or moved by the keys. detail: { side: start | end, width }
    panel-dock — a floating panel was dropped on a lit area and docked there. detail: { side: start | end, place: top | bottom | only }
    panel-room-change — the body gained or lost room for a panel area. detail: { room }

  Slots:
    nav       replace the default <sherpa-nav>
    header    replace the default <sherpa-app-header>
    (default) the Context content
    context-header  a Context's FIXED region, above its scroll area — a metrics
              row kept in view. The outlet lifts a Context's own `slot="context-header"`
              element here, and takes it away with the Context; what scrolls passes
              under it, under the shell's scroll shadow. Empty it takes no room.
    A panel area is as wide as its widest open panel (the panel's own `--_width`); `--sherpa-panel-area-min-width` is
    its narrowest, `--sherpa-panel-area-max-width` its widest.

    panel-start  a panel BESIDE the Context, on the leading side — a filter
              panel. Empty it takes no room.
    panel-end a panel on the trailing side — details, or Ask. Empty it takes
              no room.
    panel-float  the floating panels, off their areas: they float in the body
    overlay   covers the header and content, beside the rail — a
              <sherpa-dialog data-type="overlay">
-->
<template id="default">
  <div class="shell">
    <div class="nav" part="nav">
      <slot name="nav" data-accepts="nav"><sherpa-nav></sherpa-nav></slot>
    </div>
    <!-- ONLY THE CONTEXT SCROLLS: the header and both panel areas stay put.
         TRAP T-only-the-context-scrolls -->
    <div class="frame" part="frame">
      <main class="content" part="content">
        <header class="header" part="header">
          <slot name="header" data-accepts="header,toolbar"><sherpa-app-header></sherpa-app-header></slot>
        </header>
        <!-- PANEL AREAS beside the Context: a filter panel on the left, and a
             details or Ask panel on the right, in the one panel-area layout. Empty
             they take no room, so a Context that slots neither is unchanged.
             TRAP T-the-shell-owns-the-panel-areas -->
        <sherpa-layout-panels class="body" part="body"
                              exportparts="panel-start, panel-end, panel-start-edge, panel-end-edge">
          <slot name="panel-start" slot="panel-start" data-accepts="panel"></slot>
          <!-- Its FRAME draws the side edges of a sideways scroll. TODO 478 -->
          <div class="context-edges sherpa-scroll-frame"><span class="sherpa-scroll-edge-start" aria-hidden="true"></span><span class="sherpa-scroll-edge-end" aria-hidden="true"></span><div class="context-frame sherpa-scroll-shadow">
            <!-- A Context's fixed region, pinned over what scrolls. TRAP T-a-context-has-a-fixed-region -->
            <div class="context-header" part="context-header"><slot name="context-header" data-accepts="header"></slot></div>
            <slot data-accepts="content"></slot></div></div>
          <slot name="panel-end" slot="panel-end" data-accepts="panel"></slot>
          <slot name="panel-float" slot="panel-float" data-accepts="panel"></slot>
        </sherpa-layout-panels>
      </main>
      <div class="overlay" part="overlay"><slot name="overlay" data-accepts="dialog"></slot></div>
    </div>
  </div>
</template>
