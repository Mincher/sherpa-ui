<!--
  sherpa-app-shell — the frame for an app or a view. Nav and header are
  PRE-COMPOSED; slotting your own replaces the default.

  Public API:
    data-nav-state   collapsed (default) | hover | default | pinned | settings —
                     mirrored from the rail; drives the content inset
    data-no-header   let the content span the full height (no header row) (boolean)

  Slots:
    nav       replace the default <sherpa-nav>          (data-accepts: nav)
    header    replace the default <sherpa-app-header>   (data-accepts: app-header, toolbar)
    (default) the view content                          (data-accepts: any)
-->
<template id="default">
  <div class="shell">
    <div class="region nav" part="nav">
      <slot name="nav"><sherpa-nav></sherpa-nav></slot>
    </div>
    <!-- The header must be the scroller's sticky first child — as a grid row
         above it, `position: sticky` and `scroll-state(stuck: top)` silently
         do nothing. -->
    <div class="frame" part="frame">
      <main class="region content" part="content">
        <header class="header" part="header">
          <slot name="header"><sherpa-app-header></sherpa-app-header></slot>
        </header>
        <div class="view"><slot></slot></div>
      </main>
    </div>
  </div>
</template>
