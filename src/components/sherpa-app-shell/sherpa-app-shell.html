<!--
  sherpa-app-shell — the boilerplate frame for an app or a view.

  A three-region grid: a nav rail down the left, an app-header across the top of
  the content, and a scrolling content area with the layout grid rules applied.
  Matching the Figma App Shell, the nav and header are PRE-COMPOSED: a
  <sherpa-nav> and a <sherpa-app-header> ship in place. Drop your view content in
  the default slot; override the nav/header by slotting your own into the named
  slots (which replace the defaults).

  Public API:
    data-nav-collapsed   collapse the nav rail to icon width (boolean)
    data-no-header       let the content span the full height (no header row) (boolean)

  Slots:
    nav       replace the default <sherpa-nav>          (data-accepts: nav)
    header    replace the default <sherpa-app-header>   (data-accepts: app-header, toolbar)
    (default) the view content                          (data-accepts: any)
-->
<template id="default">
  <div class="shell">
    <div class="region nav" part="nav">
      <slot name="nav"><sherpa-nav></sherpa-nav></slot>
    </div>
    <header class="region header" part="header">
      <slot name="header"><sherpa-app-header></sherpa-app-header></slot>
    </header>
    <main class="region content" part="content"><slot></slot></main>
  </div>
</template>
