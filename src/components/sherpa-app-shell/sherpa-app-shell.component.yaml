# sherpa-app-shell — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-app-shell.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-app-shell
$description: the boilerplate frame for an app or a view.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  root:
    el: div
    class: shell
    children:
      - el: div
        class: nav
        part: nav
        children:
          - slot: nav
            children:
              - el: sherpa-nav
      - el: div
        class: frame
        part: frame
        children:
          - el: main
            class: content
            part: content
            children:
              - el: header
                class: header
                part: header
                children:
                  - slot: header
                    children:
                      - el: sherpa-app-header
              - el: div
                class: body
                part: body
                children:
                  - el: aside
                    class: panel-start
                    part: panel-start
                    children:
                      - slot: panel-start
                        attrs:
                          data-accepts: filter-panel, panel
                  - el: div
                    class: context-frame
                    slot: ""
                  - el: aside
                    class: panel-end
                    part: panel-end
                    children:
                      - slot: panel-end
                        attrs:
                          data-accepts: panel, overlay-panel
          - el: div
            class: overlay
            part: overlay
            children:
              - slot: overlay
                attrs:
                  data-accepts: dialog
props:
  - $type: prop
    name: data-nav-state
    type: enum
    observed: true
    kind: style
    values:
      - collapsed
      - hover
      - default
      - pinned
      - settings
    description: >-
      collapsed  | hover | default | pinned | settings — mirrored from the rail; drives the content
      inset
  - $type: prop
    name: data-no-header
    type: boolean
    observed: true
    kind: style
    default: false
    description: let the content span the full height (no header row)
  - $type: prop
    name: data-no-nav
    type: boolean
    observed: true
    kind: style
    default: false
    description: drop the nav rail; the content spans the full width
states:
  - $type: state
    name: pinned
    selector: ":host([data-nav-state=\"pinned\"])"
  - $type: state
    name: settings
    selector: ":host([data-nav-state=\"settings\"])"
  - $type: state
    name: has-panel-start
    selector: ":host([data-has-panel-start])"
  - $type: state
    name: has-panel-end
    selector: ":host([data-has-panel-end])"
  - $type: state
    name: no-nav
    selector: ":host([data-no-nav])"
  - $type: state
    name: no-header
    selector: ":host([data-no-header])"
tokens:
  header.background: "{sherpa.style-surface-base}"
  panel-start.padding: "{sherpa.layout-grid-padding}"
  panel-end.padding: "{sherpa.layout-grid-padding}"
$extensions:
  sherpa:
    figmaName: App Shell
    category: container
    divergence:
      note: >-
        2026-09-09: boilerplate app/view frame. Matches the Figma "App Shell" COMPONENT (page
        sherpa-app-shell, node 1016:35752) — GRID: Primary Navigation (left rail) | App Header (top)
        | content SLOT. PRE-COMPOSED: the nav/header <slot>s carry default
        <sherpa-nav>/<sherpa-app-header> fallback instances (replaceable by slotting your own).
        KNOWN DEF GAP: the thin-def model cannot represent slot FALLBACK content, so
        generate-component-spec round-trip is expected-lossy here (validate passes; the anatomy
        drops the fallback instances). The HTML is the source of truth, not the regenerated anatomy.
    _divergence:
      overlaySlot: >-
        2026-09-24: the `overlay` slot is code-only. It shares the header+content cell, under the
        rail, and holds a sherpa-dialog data-type="overlay" (Settings). Figma's App Shell has no
        such slot yet.
