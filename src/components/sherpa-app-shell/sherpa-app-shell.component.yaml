# sherpa-app-shell — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-app-shell.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-app-shell
$description: the boilerplate frame for an app or a view.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  root:
    el: div
    class: shell
    children:
      - el: div
        class: region nav
        part: nav
        slot: nav
      - el: header
        class: region header
        part: header
        slot: header
      - el: main
        class: region content
        part: content
        slot: ""
props:
  - $type: prop
    name: data-nav-collapsed
    type: boolean
    kind: content
    default: false
    description: collapse the nav rail to icon width
  - $type: prop
    name: data-no-header
    type: boolean
    kind: content
    default: false
    description: let the content span the full height (no header row)
states:
  - $type: state
    name: nav-collapsed
    selector: ":host([data-nav-collapsed])"
  - $type: state
    name: no-header
    selector: ":host([data-no-header])"
tokens:
  nav.border-inline-end: "{sherpa.display-mode-border-width-base}"
  nav.background: "{sherpa.theme-surface-default-base}"
  header.border-block-end: "{sherpa.display-mode-border-width-base}"
  content.padding: "{sherpa.layout-grid-padding}"
