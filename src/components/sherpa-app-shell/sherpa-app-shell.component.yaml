$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-app-shell
$description: the boilerplate frame for an app or a view.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  root:
    el: div
    class: shell
    children:
      - el: div
        class: region nav
        part: nav
        children:
          - slot: nav
      - el: header
        class: region header
        part: header
        children:
          - slot: header
      - el: main
        class: region content
        part: content
        slot: ""
props:
  - $type: prop
    name: data-nav-collapsed
    type: boolean
    kind: content
    default: false
    description: collapse the nav rail to icon width
  - $type: prop
    name: data-no-header
    type: boolean
    kind: content
    default: false
    description: let the content span the full height (no header row)
states:
  - $type: state
    name: nav-collapsed
    selector: ":host([data-nav-collapsed])"
  - $type: state
    name: no-header
    selector: ":host([data-no-header])"
tokens:
  nav.border-inline-end: "{sherpa.display-mode-border-width-base}"
  nav.background: "{sherpa.theme-surface-default-base}"
  header.border-block-end: "{sherpa.display-mode-border-width-base}"
  content.padding: "{sherpa.layout-grid-padding}"
$extensions:
  sherpa:
    figmaName: App Shell
    category: container
    divergence:
      note: >-
        2026-09-09: boilerplate app/view frame. Matches the Figma "App Shell" COMPONENT (page
        sherpa-app-shell, node 1016:35752) — GRID: Primary Navigation (left rail) | App Header (top)
        | content SLOT. PRE-COMPOSED: the nav/header <slot>s carry default
        <sherpa-nav>/<sherpa-app-header> fallback instances (replaceable by slotting your own).
        KNOWN DEF GAP: the thin-def model cannot represent slot FALLBACK content, so
        generate-component-spec round-trip is expected-lossy here (validate passes; the anatomy
        drops the fallback instances). The HTML is the source of truth, not the regenerated anatomy.
