# sherpa-calendar — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-calendar.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-calendar
$description: >-
  A date picker with day / month / year views. The header label zooms out day→month→year; picking a
  month/year zooms back in.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: div
      class: cal
      part: cal
      children:
        - el: div
          class: cal-header sherpa-group
          part: header
          children:
            - el: sherpa-button
              class: cal-nav cal-prev
              part: prev
              attrs:
                data-type: icon
                data-group: start
                data-icon-start: fa-solid fa-chevron-left
                aria-label: Previous
            - el: sherpa-button
              class: cal-label
              part: label
              attrs:
                data-group: mid
                aria-live: polite
            - el: sherpa-button
              class: cal-nav cal-next
              part: next
              attrs:
                data-type: icon
                data-group: end
                data-icon-start: fa-solid fa-chevron-right
                aria-label: Next
        - el: div
          class: cal-weekdays
          part: weekdays
          attrs:
            aria-hidden: "true"
          children:
            - el: span
            - el: span
            - el: span
            - el: span
            - el: span
            - el: span
            - el: span
            - el: span
              class: wd-gap
            - el: span
              class: wd-2
            - el: span
              class: wd-2
            - el: span
              class: wd-2
            - el: span
              class: wd-2
            - el: span
              class: wd-2
            - el: span
              class: wd-2
            - el: span
              class: wd-2
        - el: div
          class: cal-days cal-grid
          part: days
          attrs:
            role: grid
        - el: div
          class: cal-months cal-grid
          part: months
          attrs:
            role: grid
        - el: div
          class: cal-years cal-grid
          part: years
          attrs:
            role: grid
        - el: div
          class: cal-time-row
          part: time-row
          children:
            - el: label
              class: cal-time-label
              part: time-label
              children:
                - el: input
                  class: cal-time sherpa-border-edges
                  part: time
                  attrs:
                    type: time
        - el: div
          class: cal-footer
          part: footer
          children:
            - el: button
              class: cal-today
              part: today
              attrs:
                type: button
            - el: div
              class: cal-actions
              part: actions
              children:
                - el: button
                  class: cal-cancel
                  part: cancel
                  attrs:
                    type: button
                - el: button
                  class: cal-apply sherpa-border-edges
                  part: apply
                  attrs:
                    type: button
    - el: template
      class: cal-header-tpl
      children:
        - el: div
          class: cal-header cal-header-projected
          attrs:
            slot: header
          children:
            - el: sherpa-button
              class: cal-nav cal-prev
              attrs:
                data-type: icon
                data-group: start
                style: >-
                  --sherpa-border-rounding-top-left: var(--sherpa-display-mode-border-rounding-base,
                  4px); --sherpa-border-rounding-bottom-left:
                  var(--sherpa-display-mode-border-rounding-base, 4px);
                data-icon-start: fa-solid fa-chevron-left
                aria-label: Previous
            - el: sherpa-button
              class: cal-label
              attrs:
                data-group: mid
                aria-live: polite
                style: "margin-inline-start: var(--sherpa-structure-space-snapped, 0px); flex: 1 1 auto;"
            - el: sherpa-button
              class: cal-nav cal-next
              attrs:
                data-type: icon
                data-group: end
                style: >-
                  margin-inline-start: var(--sherpa-structure-space-snapped, 0px);
                  --sherpa-border-rounding-top-right:
                  var(--sherpa-display-mode-border-rounding-base, 4px);
                  --sherpa-border-rounding-bottom-right:
                  var(--sherpa-display-mode-border-rounding-base, 4px);
                data-icon-start: fa-solid fa-chevron-right
                aria-label: Next
props:
  - $type: prop
    name: data-available
    type: string
    kind: content
    description: >-
      comma-separated ISO days that EXIST in the data; every other day is disabled. A SET, not a
      span — a column of dates is a scatter, and min/max would leave the empty days between them
      selectable. Omit it and every day is selectable, which is the override: a host that wants a
      picker unconstrained by its own data simply does not supply one.
  - $type: prop
    name: data-embedded
    type: boolean
    kind: style
    default: false
    description: >-
      the HOST owns the card's chrome — see the note below data-embedded: this component contributes
      only its GRID — the footer is hidden and the stepper is projected into the host's `header`
      slot, so a menu hosting a calendar has ONE header and ONE footer rather than two.
  - $type: prop
    name: data-has-time
    type: boolean
    kind: content
    default: false
    description: show a native <input type=time> in the footer
  - $type: prop
    name: data-max
    type: string
    kind: content
    description: latest selectable day (ISO); later days are disabled
  - $type: prop
    name: data-min
    type: string
    kind: content
    description: earliest selectable day (ISO); earlier days are disabled
  - $type: prop
    name: data-type
    type: enum
    kind: content
    values:
      - single
      - range
    default: single
    description: single | range  — one day, or a two-click start→end range
  - $type: prop
    name: data-value
    type: string
    kind: content
    description: selected day, ISO YYYY-MM-DD (single mode); YYYY-MM-DDThh:mm when data-has-time is set
  - $type: prop
    name: data-value-end
    type: string
    kind: content
    description: range end, ISO YYYY-MM-DD (range mode)
  - $type: prop
    name: data-value-start
    type: string
    kind: content
    description: range start, ISO YYYY-MM-DD (range mode)
  - $type: prop
    name: data-view
    type: enum
    kind: content
    values:
      - day
      - month
      - year
    default: day
    description: day | month | year  — the active picker (the Grid-collection swap)
states:
  - $type: state
    name: day
    selector: ":host([data-view=\"day\"])"
  - $type: state
    name: month
    selector: ":host([data-view=\"month\"])"
  - $type: state
    name: year
    selector: ":host([data-view=\"year\"])"
  - $type: state
    name: has-time
    selector: ":host([data-has-time])"
  - $type: state
    name: embedded
    selector: ":host([data-embedded])"
  - $type: state
    name: not-view
    selector: ":host(:not([data-view]))"
  - $type: state
    name: focus-visible
    selector: .cal-time:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (value). See $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: callable from a view definition's state block (today). See $extensions.sherpa.methods.
events:
  - $type: event
    name: datetime-change
    bubbles: true
    composed: true
    detail:
      value: unknown
    trigger:
      "on": click
      node: .cal-prev
  - $type: event
    name: range-select
    bubbles: true
    composed: true
    detail:
      end: unknown
      start: unknown
  - $type: event
    name: calendar-cancel
    bubbles: true
    composed: true
  - $type: event
    name: calendar-apply
    bubbles: true
    composed: true
    detail:
      value: string
