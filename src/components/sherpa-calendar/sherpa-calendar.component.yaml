# sherpa-calendar — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-calendar.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-calendar
$description: >-
  A date picker with day / month / year views. The header label zooms out day→month→year; picking
  a month/year zooms back in.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: div
      class: cal
      part: cal
      children:
        - el: div
          class: cal-header
          part: header
          children:
            - el: button
              class: cal-nav cal-prev
              part: prev
              attrs:
                type: button
                aria-label: Previous
            - el: button
              class: cal-label
              part: label
              attrs:
                type: button
                aria-live: polite
            - el: button
              class: cal-nav cal-next
              part: next
              attrs:
                type: button
                aria-label: Next
        - el: div
          class: cal-weekdays
          part: weekdays
          attrs:
            aria-hidden: "true"
          children:
            - el: span
            - el: span
            - el: span
            - el: span
            - el: span
            - el: span
            - el: span
        - el: div
          class: cal-days cal-grid
          part: days
          attrs:
            role: grid
        - el: div
          class: cal-months cal-grid
          part: months
          attrs:
            role: grid
        - el: div
          class: cal-years cal-grid
          part: years
          attrs:
            role: grid
    - el: template
      class: cal-cell-tpl
      children:
        - el: button
          class: cal-cell
          attrs:
            type: button
            role: gridcell
props:
  - $type: prop
    name: data-view
    type: enum
    kind: content
    values:
      - day
      - month
      - year
    default: day
    description: day | month | year (the active picker; default day)
  - $type: prop
    name: data-max
    type: string
    kind: content
    description: — latest selectable day (ISO); later days are disabled
  - $type: prop
    name: data-min
    type: string
    kind: content
    description: — earliest selectable day (ISO); earlier days are disabled
  - $type: prop
    name: data-value
    type: string
    kind: content
    description: — selected day (ISO YYYY-MM-DD); highlighted in the day grid
states:
  - $type: state
    name: day
    selector: ":host([data-view=\"day\"])"
  - $type: state
    name: month
    selector: ":host([data-view=\"month\"])"
  - $type: state
    name: year
    selector: ":host([data-view=\"year\"])"
  - $type: state
    name: not-view
    selector: ":host(:not([data-view]))"
  - $type: state
    name: focus-visible
    selector: .cal-nav:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (value). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: datetime-change
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .cal-prev
tokens:
  cal.gap: "{sherpa.theme-gap-md}"
  cal.padding: "{sherpa.theme-padding-lg}"
  cal.border-width: "{sherpa.style-border-width}"
  cal.background: "{sherpa.style-surface-base}"
  cal.box-shadow: "{sherpa.shadow-md}"
  cal-header.gap: "{sherpa.display-space-xs}"
  cal-label.font-size: "{sherpa.font-size-body-large}"
  cal-label.font-weight: "{sherpa.font-weight-semibold}"
  cal-label.color: "{sherpa.theme-content-body-base}"
  cal-nav.inline-size: "{sherpa.structure-height}"
  cal-nav.block-size: "{sherpa.structure-height}"
  cal-nav.border-radius: "{sherpa.display-border-rounding-base}"
  cal-nav.color: "{sherpa.style-content-base}"
  cal-nav.font-size: "{sherpa.font-size-heading-h2}"
  cal-cell.block-size: "{sherpa.display-size-2xl}"
  cal-cell.border-width: "{sherpa.style-border-width}"
  cal-cell.border-radius: "{sherpa.display-border-rounding-base}"
  cal-cell.color: "{sherpa.style-content-base}"
  cal-cell.font-size: "{sherpa.font-size-body-base}"
$extensions:
  sherpa:
    figmaName: Calendar
    category: container
    variantAxes:
      - name: Layout
        values:
          - month
          - year
          - day
    divergence:
      "2026-09-02": >-
        Figma DIVERGED. The old "Grid" component (Layout: month/year/day) was renamed/ remodelled to
        "Calendar" (268:14601) with Type: single/range + hasTime — a single vs range date selection
        model with an optional time picker. The CODE keeps the day/month/year zoom navigation (its
        own value). These are different axes: Figma models WHAT is selected (single/range), code
        models the ZOOM view (day/month/year). Reconcile later — either add single/range to the code
        or re-model the Figma component. figmaVerbatim._status = divergent until then.
    jsProps:
      - name: value
        type: string
        access: read-write
