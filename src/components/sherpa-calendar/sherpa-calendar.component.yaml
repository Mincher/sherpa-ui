$extensions:
  sherpa:
    figmaName: Calendar
    methods:
      - $type: method
        name: today
        args: ""
        description: Jump to today and select it.
    category: container
    variantAxes:
      - name: Type
        values:
          - single
          - range
    booleanProps:
      - hasTime
    divergence:
      "2026-09-07": >-
        RESOLVED. The code now models the Figma Calendar (268:14601) verbatim: Type=single|range
        (data-type) + hasTime (data-has-time). data-view (day|month|year) is NOT a divergent axis —
        it is the code's equivalent of the Figma Calendar's Grid-collection swap (which grid the
        component shows: the day grid, the month grid, or the year grid). It is an internal zoom
        mechanism, not the Figma Type axis, and is intentionally kept. No outstanding drift.
    jsProps:
      - name: value
        type: string
        access: read-write
