# sherpa-calendar — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-calendar.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-calendar
$description: >-
  A date picker with day / month / year views. The header label zooms out day→month→year; picking a
  month/year zooms back in.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: div
      class: cal
      part: cal
      children:
        - el: div
          class: cal-header
          part: header
          children:
            - el: button
              class: cal-nav cal-prev
              part: prev
              attrs:
                type: button
                aria-label: Previous
            - el: button
              class: cal-label
              part: label
              attrs:
                type: button
                aria-live: polite
            - el: button
              class: cal-nav cal-next
              part: next
              attrs:
                type: button
                aria-label: Next
        - el: div
          class: cal-weekdays
          part: weekdays
          attrs:
            aria-hidden: "true"
          children:
            - el: span
            - el: span
            - el: span
            - el: span
            - el: span
            - el: span
            - el: span
        - el: div
          class: cal-days cal-grid
          part: days
          attrs:
            role: grid
        - el: div
          class: cal-months cal-grid
          part: months
          attrs:
            role: grid
        - el: div
          class: cal-years cal-grid
          part: years
          attrs:
            role: grid
        - el: div
          class: cal-time-row
          part: time-row
          children:
            - el: label
              class: cal-time-label
              part: time-label
              children:
                - el: input
                  class: cal-time
                  part: time
                  attrs:
                    type: time
        - el: div
          class: cal-footer
          part: footer
          children:
            - el: button
              class: cal-today
              part: today
              attrs:
                type: button
            - el: div
              class: cal-actions
              part: actions
              children:
                - el: button
                  class: cal-cancel
                  part: cancel
                  attrs:
                    type: button
                - el: button
                  class: cal-apply
                  part: apply
                  attrs:
                    type: button
    - el: template
      class: cal-header-tpl
      children:
        - el: div
          class: cal-header cal-header-projected
          attrs:
            slot: header
          children:
            - el: button
              class: cal-nav cal-prev
              attrs:
                type: button
                aria-label: Previous
            - el: button
              class: cal-label
              attrs:
                type: button
                aria-live: polite
            - el: button
              class: cal-nav cal-next
              attrs:
                type: button
                aria-label: Next
props:
  - $type: prop
    name: data-embedded
    type: boolean
    kind: style
    default: false
    description: >-
      the HOST owns the card's chrome — see the note below data-embedded, in full: Figma's Calendar
      (268:14601) is a card of three parts — a `header` SLOT holding the month stepper, the
      day/month/year grid, and a Container Footer. A calendar IS a menu in this system. So when
      embedded, this component contributes only its GRID: the footer is hidden (the host draws the
      action row) and the stepper is PROJECTED into the host's `header` slot, so the menu is the
      card and there is one header and one footer rather than two.
  - $type: prop
    name: data-has-time
    type: boolean
    kind: content
    default: false
    description: show a native <input type=time> in the footer
  - $type: prop
    name: data-max
    type: string
    kind: content
    description: latest selectable day (ISO); later days are disabled
  - $type: prop
    name: data-min
    type: string
    kind: content
    description: earliest selectable day (ISO); earlier days are disabled
  - $type: prop
    name: data-type
    type: enum
    kind: content
    values:
      - single
      - range
    default: single
    description: single | range  — one day, or a two-click start→end range
  - $type: prop
    name: data-value
    type: string
    kind: content
    description: selected day, ISO YYYY-MM-DD (single mode); YYYY-MM-DDThh:mm when data-has-time is set
  - $type: prop
    name: data-value-end
    type: string
    kind: content
    description: range end, ISO YYYY-MM-DD (range mode)
  - $type: prop
    name: data-value-start
    type: string
    kind: content
    description: range start, ISO YYYY-MM-DD (range mode)
  - $type: prop
    name: data-view
    type: enum
    kind: content
    values:
      - day
      - month
      - year
    default: day
    description: day | month | year  — the active picker (the Grid-collection swap)
states:
  - $type: state
    name: day
    selector: ":host([data-view=\"day\"])"
  - $type: state
    name: month
    selector: ":host([data-view=\"month\"])"
  - $type: state
    name: year
    selector: ":host([data-view=\"year\"])"
  - $type: state
    name: has-time
    selector: ":host([data-has-time])"
  - $type: state
    name: embedded
    selector: ":host([data-embedded])"
  - $type: state
    name: not-view
    selector: ":host(:not([data-view]))"
  - $type: state
    name: focus-visible
    selector: .cal-nav:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (value). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: datetime-change
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .cal-prev
  - $type: event
    name: range-select
    bubbles: true
    composed: true
  - $type: event
    name: calendar-cancel
    bubbles: true
    composed: true
  - $type: event
    name: calendar-apply
    bubbles: true
    composed: true
