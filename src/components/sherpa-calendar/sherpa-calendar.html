<!--
  sherpa-calendar — a date picker with day / month / year views.

  Two selection TYPES (Figma Calendar `Type` axis) and an optional time picker
  (Figma `hasTime` boolean). The day/month/year VIEW is the code's own zoom
  mechanism — it is the equivalent of the Figma Calendar's Grid-collection swap
  (which grid the component shows), NOT the Figma Type axis. The header label is a
  button that zooms OUT (day → month → year); picking a month/year zooms back IN.
  Prev/next step whatever the current view shows. A day grid, a month grid, and a
  year grid are stamped from cloning prototypes; CSS shows the one matching data-view.

  Public API:
    data-type       single | range (default single) — one day, or a two-click start→end range
    data-view       day | month | year (default day) — the active picker (the Grid-collection swap)
    data-value      selected day, ISO YYYY-MM-DD (single mode); YYYY-MM-DDThh:mm when data-has-time is set
    data-value-start  range start, ISO YYYY-MM-DD (range mode)
    data-value-end    range end, ISO YYYY-MM-DD (range mode)
    data-min        earliest selectable day (ISO); earlier days are disabled
    data-max        latest selectable day (ISO); later days are disabled
    data-has-time   (boolean) show a native <input type=time> in the footer
    data-embedded   (boolean) the HOST owns the card's chrome — see the note below

  data-embedded, in full: Figma's Calendar (268:14601) is a card of three parts —
  a `header` SLOT holding the month stepper, the day/month/year grid, and a
  Container Footer. A calendar IS a menu in this system. So when embedded, this
  component contributes only its GRID: the footer is hidden (the host draws the
  action row) and the stepper is PROJECTED into the host's `header` slot, so the
  menu is the card and there is one header and one footer rather than two.

  Fires:
    datetime-change (detail: value string — a single day or its date+time chosen)
    range-select (detail: start string end string — a range completed both ends chosen)
    calendar-cancel (detail: none — the footer Cancel button was pressed)
    calendar-apply (detail: value string — the footer Apply button confirmed the current value)
-->
<template id="default">
  <div class="cal" part="cal">
    <div class="cal-header" part="header">
      <button type="button" class="cal-nav cal-prev" part="prev" aria-label="Previous">&lsaquo;</button>
      <button type="button" class="cal-label" part="label" aria-live="polite"></button>
      <button type="button" class="cal-nav cal-next" part="next" aria-label="Next">&rsaquo;</button>
    </div>

    <div class="cal-weekdays" part="weekdays" aria-hidden="true">
      <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span>
      <span>Fri</span><span>Sat</span><span>Sun</span>
    </div>

    <div class="cal-days cal-grid" part="days" role="grid"></div>
    <div class="cal-months cal-grid" part="months" role="grid"></div>
    <div class="cal-years cal-grid" part="years" role="grid"></div>

    <!-- Native time picker — shown only when data-has-time is set (CSS owns it). -->
    <div class="cal-time-row" part="time-row">
      <label class="cal-time-label" part="time-label">Time
        <input type="time" class="cal-time" part="time" />
      </label>
    </div>

    <!-- Footer action row — a Today link on the left, Cancel / Apply on the right. -->
    <div class="cal-footer" part="footer">
      <button type="button" class="cal-today" part="today">Today</button>
      <div class="cal-actions" part="actions">
        <button type="button" class="cal-cancel" part="cancel">Cancel</button>
        <button type="button" class="cal-apply" part="apply">Apply</button>
      </div>
    </div>
  </div>

  <!--
    The month stepper, as a LIGHT-DOM prototype.

    `data-embedded` moves the header OUT of this shadow root and into the host's
    own — a clone of this goes in the light DOM carrying `slot="header"`, so a
    sherpa-menu hosts it in its `header` region natively.

    That is the Calendar node's own shape (268:14601): a card of three regions,
    whose FIRST is a `header` SLOT holding ‹ · "August 2026" · ›. A calendar IS a
    menu in this system, so the stepper belongs to the menu's header rather than
    to a second header drawn inside a nested component.

    The same three classes as the shadow header, so one set of listeners and one
    label sync serve both — see #headerEls() in the TS.
  -->
  <template class="cal-header-tpl">
    <div class="cal-header cal-header-projected" slot="header">
      <button type="button" class="cal-nav cal-prev" aria-label="Previous">&lsaquo;</button>
      <button type="button" class="cal-label" aria-live="polite"></button>
      <button type="button" class="cal-nav cal-next" aria-label="Next">&rsaquo;</button>
    </div>
  </template>

  <!-- Cell prototype — cloned per day/month/year by JS, never rendered directly. -->
  <!--
    One grid cell — a composed <sherpa-calendar-cell>, which is the Figma
    "Calendar Cell" (276:16589) Will split onto the Calendar page as one of the
    parts a calendar is built FROM. It owns the cell's 32x32 box, its three
    states and its text; this component owns which day each one is.

    It was a bare <button> styled here, which is the duplication the system's
    composition rule exists to stop.
  -->
  <template class="cal-cell-tpl">
    <sherpa-calendar-cell class="cal-cell" role="gridcell"></sherpa-calendar-cell>
  </template>
</template>
