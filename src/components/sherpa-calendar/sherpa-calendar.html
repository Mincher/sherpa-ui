<!--
  sherpa-calendar — a date picker with day / month / year views.
  The header label zooms OUT (day → month → year); picking one zooms back IN.

  Public API:
    data-type       single | range (default single) — one day, or a two-click start→end range
    data-view       day | month | year (default day) — the active picker (the Grid-collection swap)
    data-value      selected day, ISO YYYY-MM-DD (single mode); YYYY-MM-DDThh:mm when data-has-time is set
    data-value-start  range start, ISO YYYY-MM-DD (range mode)
    data-value-end    range end, ISO YYYY-MM-DD (range mode)
    data-min        earliest selectable day (ISO); earlier days are disabled
    data-max        latest selectable day (ISO); later days are disabled
    data-available  comma-separated ISO days that EXIST in the data; every other
                    day is disabled. A SET, not a span — a column of dates is a
                    scatter, and min/max would leave the empty days between them
                    selectable. Omit it and every day is selectable, which is the
                    override: a host that wants a picker unconstrained by its own
                    data simply does not supply one.
    data-has-time   (boolean) show a native <input type=time> in the footer
    data-embedded   (boolean) the HOST owns the card's chrome — see the note below

  data-embedded: this component contributes only its GRID — the footer is hidden
  and the stepper is projected into the host's `header` slot, so a menu hosting a
  calendar has ONE header and ONE footer rather than two.

  Fires:
    datetime-change (detail: value string — a single day or its date+time chosen)
    range-select (detail: start string end string — a range completed both ends chosen)
    calendar-cancel (detail: none — the footer Cancel button was pressed)
    calendar-apply (detail: value string — the footer Apply button confirmed the current value)
-->
<template id="default">
  <div class="cal" part="cal">
    <!-- Three composed buttons, snapped into one stepper (Menu set 1156:29240 > Type=Calendar). -->
    <div class="cal-header sherpa-group" part="header">
      <sherpa-button class="cal-nav cal-prev" part="prev" data-type="icon" data-group="start"
                     data-icon-start="fa-solid fa-chevron-left" aria-label="Previous"></sherpa-button>
      <sherpa-button class="cal-label" part="label" data-group="mid" aria-live="polite"></sherpa-button>
      <sherpa-button class="cal-nav cal-next" part="next" data-type="icon" data-group="end"
                     data-icon-start="fa-solid fa-chevron-right" aria-label="Next"></sherpa-button>
    </div>

    <!-- The second weekday set and the gap exist from the start; CSS reveals them for a range calendar's two-month grid. -->
    <div class="cal-weekdays" part="weekdays" aria-hidden="true">
      <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span>
      <span>Fri</span><span>Sat</span><span>Sun</span>
      <span class="wd-gap"></span>
      <span class="wd-2">Mon</span><span class="wd-2">Tue</span><span class="wd-2">Wed</span>
      <span class="wd-2">Thu</span><span class="wd-2">Fri</span><span class="wd-2">Sat</span>
      <span class="wd-2">Sun</span>
    </div>

    <div class="cal-days cal-grid" part="days" role="grid"></div>
    <div class="cal-months cal-grid" part="months" role="grid"></div>
    <div class="cal-years cal-grid" part="years" role="grid"></div>

    <!-- Shown only when data-has-time is set (CSS owns it). -->
    <div class="cal-time-row" part="time-row">
      <label class="cal-time-label" part="time-label">Time
        <input type="time" class="cal-time sherpa-border-edges" part="time" />
      </label>
    </div>

    <!-- The same composed row sherpa-menu uses: the footer owns the action-bar
         geometry, `between` puts Today on the left. -->
    <sherpa-container-footer class="cal-footer" part="footer" data-align="between">
      <sherpa-button class="cal-today" part="today" data-size="sm"
                     data-look="transparent">Today</sherpa-button>
      <div class="cal-actions" part="actions">
        <sherpa-button class="cal-cancel" part="cancel" data-size="sm">Cancel</sherpa-button>
        <sherpa-button class="cal-apply" part="apply" data-size="sm"
                       data-look="saturated">Apply</sherpa-button>
      </div>
    </sherpa-container-footer>
  </div>

  <!--
    The stepper as a LIGHT-DOM clone for data-embedded. Same three classes as the
    shadow header, so one set of listeners and one label sync serve both.
  -->
  <template class="cal-header-tpl">
    <!--
      Outer corners are INLINE because this clone lands in the MENU's light DOM:
      no rule here can reach it, and ::slotted() cannot reach a slotted element's
      children. An inline custom property inherits across both boundaries.
    -->
    <div class="cal-header cal-header-projected" slot="header">
      <sherpa-button class="cal-nav cal-prev" data-type="icon" data-group="start"
                     style="--sherpa-border-rounding-top-left: var(--sherpa-display-mode-border-rounding-base, 4px); --sherpa-border-rounding-bottom-left: var(--sherpa-display-mode-border-rounding-base, 4px);"
                     data-icon-start="fa-solid fa-chevron-left" aria-label="Previous"></sherpa-button>
      <sherpa-button class="cal-label" data-group="mid" aria-live="polite"
                     style="margin-inline-start: var(--sherpa-structure-space-snapped, 0px); flex: 1 1 auto;"></sherpa-button>
      <sherpa-button class="cal-nav cal-next" data-type="icon" data-group="end"
                     style="margin-inline-start: var(--sherpa-structure-space-snapped, 0px); --sherpa-border-rounding-top-right: var(--sherpa-display-mode-border-rounding-base, 4px); --sherpa-border-rounding-bottom-right: var(--sherpa-display-mode-border-rounding-base, 4px);"
                     data-icon-start="fa-solid fa-chevron-right" aria-label="Next"></sherpa-button>
    </div>
  </template>

  <!-- Cloned per day/month/year by JS, never rendered directly. -->
  <template class="cal-cell-tpl">
    <sherpa-calendar-cell class="cal-cell" role="gridcell"></sherpa-calendar-cell>
  </template>
</template>
