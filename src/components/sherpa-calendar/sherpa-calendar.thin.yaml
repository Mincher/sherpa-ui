name: sherpa-calendar
figmaName: Calendar
category: container
description: >-
  A date picker with day / month / year layouts. The header label zooms
  out day→month→year; picking a month/year zooms back in.
generated: false
_divergence:
  '2026-09-02': >-
    Figma DIVERGED. The old "Grid" component (Layout: month/year/day) was renamed/
    remodelled to "Calendar" (268:14601) with Type: single/range + hasTime — a
    single vs range date selection model with an optional time picker. The CODE
    keeps the day/month/year zoom navigation (its own value). These are different
    axes: Figma models WHAT is selected (single/range), code models the ZOOM view
    (day/month/year). Reconcile later — either add single/range to the code or
    re-model the Figma component. figmaVerbatim._status = divergent until then.
