# sherpa-select-radio — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-select-radio.{thin.yaml,html,css,ts}. The MECHANICAL surface only —
# props (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# Validated by schemas/component.v1.json; round-trips via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-select-radio
$description: a labelled radio button.
element:
  $type: element
  tag: label
  provides:
    - click-forwarding
templates:
  - default
anatomy:
  root:
    el: label
    class: field
    part: field
    children:
      - el: input
        class: control
        part: control
        attrs:
          type: radio
      - el: span
        class: text
        part: text
        children:
          - el: span
            class: label
            part: label
          - el: span
            class: description
            part: description
          - slot: ""
props:
  - $type: prop
    name: data-description
    type: string
    kind: content
    description: helper line below the label
  - $type: prop
    name: data-label
    type: string
    kind: content
    description: label text to the right of the dot (or default slot)
  - $type: prop
    name: checked
    type: boolean
    native: true
    kind: content
    default: false
    description: native checked state (also a JS property)
  - $type: prop
    name: value
    type: string
    native: true
    description: submitted value when selected
states:
  - $type: state
    name: minimal
    selector: ":host([data-variant=\"minimal\"])"
  - $type: state
    name: status
    selector: ":host([data-status])"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
  - $type: state
    name: focus-visible
    selector: .control:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (checked, value). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: change
    bubbles: true
    composed: true
  - $type: event
    name: value
    bubbles: true
    composed: true
tokens:
  field.gap: "{sherpa.display-space-xs}"
  field.color: "{sherpa.theme-content-body-base}"
  control.border-width: "{sherpa.display-border-width-sm}"
  control.border-radius: "{sherpa.display-border-rounding-full}"
  text.gap: "{sherpa.display-space-3xs}"
  label.color: "{sherpa.theme-content-body-base}"
  label.font-size: "{sherpa.font-size-body-base}"
  description.color: "{sherpa.theme-content-body-1}"
  description.font-size: "{sherpa.font-size-body-small}"
$extensions:
  sherpa:
    figmaName: Select Radio
    category: control
    booleanProps:
      - hasDescription
    divergence:
      note: >-
        2026-08-27: FORMALISED as a real Figma COMPONENT again (was briefly a detach-only template).
        "Select Radio" = a Radio Indicator INSTANCE (the shared subcomponent) + label + description,
        with label/description TEXT props + a hasDescription toggle. Kept as a component for
        design↔code parity with sherpa-select-radio. The checked state lives on the Radio Indicator
        subcomponent. See [[sherpa-fieldset-checkbox-radio-templates]] for the earlier template
        history.
    jsProps:
      - name: checked
        type: string
        access: read-write
      - name: value
        type: string
        access: read-write
