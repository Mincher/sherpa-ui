# sherpa-select-radio — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-select-radio.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-select-radio
$description: a labelled radio button.
element:
  $type: element
  tag: label
  provides:
    - click-forwarding
templates:
  - default
anatomy:
  root:
    el: label
    class: field
    part: field
    children:
      - el: input
        class: control
        part: control
        attrs:
          type: radio
      - el: span
        class: text
        part: text
        children:
          - el: span
            class: label
            part: label
          - el: span
            class: description
            part: description
          - slot: ""
props:
  - $type: prop
    name: data-description
    type: string
    observed: false
    kind: content
    description: helper line below the label
  - $type: prop
    name: data-label
    type: string
    observed: false
    kind: content
    description: label text to the right of the dot (or default slot)
  - $type: prop
    name: checked
    type: boolean
    observed: true
    native: true
    default: false
    description: native checked state (also a JS property)
  - $type: prop
    name: disabled
    type: boolean
    observed: false
    native: true
    default: false
    description: native attributes, mirrored to the inner control
  - $type: prop
    name: name
    type: string
    observed: false
    native: true
    description: native attributes, mirrored to the inner control
  - $type: prop
    name: required
    type: boolean
    observed: false
    native: true
    default: false
    description: native attributes, mirrored to the inner control
  - $type: prop
    name: value
    type: string
    observed: false
    native: true
    description: submitted value when selected
states:
  - $type: state
    name: disabled
    selector: ":host([disabled])"
  - $type: state
    name: focus-visible
    selector: .control:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (checked, value, disabled). See $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: >-
      callable from a view definition's state block (checkValidity, reportValidity, focus). See
      $extensions.sherpa.methods.
events:
  - $type: event
    name: change
    bubbles: true
    composed: true
    detail:
      checked: unknown
      value: unknown
tokens:
  field.gap: "{sherpa.display-mode-space-xs}"
  field.color: "{sherpa.theme-content-body-base}"
  control.--_border: "{sherpa.style-border-base}"
  control.--_surface: "{sherpa.style-surface-base}"
  control.--_dot: "{sherpa.style-indicator-accent}"
  control.border-width: "{sherpa.display-mode-border-width-base}"
  control.border-radius: "{sherpa.display-mode-border-rounding-full}"
  text.gap: "{sherpa.display-mode-space-2xs}"
  label.color: "{sherpa.theme-content-body-base}"
  label.font-size: "{sherpa.font-size-body-base}"
  label.font-weight: "{sherpa.font-weight-medium}"
  label.line-height: "{sherpa.theme-content-line-height-base}"
  description.color: "{sherpa.theme-content-body-1}"
  description.font-size: "{sherpa.font-size-body-small}"
  description.line-height: "{sherpa.theme-content-line-height-small}"
$extensions:
  sherpa:
    figmaName: Select Radio
    methods:
      - $type: method
        name: checkValidity
        args: ""
      - $type: method
        name: reportValidity
        args: ""
        description: Check, and show the browser's message on the radio.
      - $type: method
        name: focus
        args: "options?: FocusOptions"
    category: control
    booleanProps:
      - hasDescription
    divergence:
      note: >-
        2026-08-27: FORMALISED as a real Figma COMPONENT again (was briefly a detach-only template).
        "Select Radio" = a Radio Indicator INSTANCE (the shared subcomponent) + label + description,
        with label/description TEXT props + a hasDescription toggle. Kept as a component for
        design↔code parity with sherpa-select-radio. The checked state lives on the Radio Indicator
        subcomponent. See [[sherpa-fieldset-checkbox-radio-templates]] for the earlier template
        history.
    jsProps:
      - name: checked
        type: boolean
        access: read-write
      - name: value
        type: string
        access: read-write
      - name: disabled
        type: boolean
        access: read-write
