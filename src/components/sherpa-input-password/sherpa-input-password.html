<!--
  sherpa-input-password — a labelled password field.

  A variation of sherpa-input-text: same label / description / message chrome,
  but the control is <input type="password"> with a trailing show/hide toggle.
  The toggle flips the inner input type and its own aria-pressed; a pure-CSS
  eye glyph swaps between open/struck via the [aria-pressed] state.

  Public API:
    data-label        field label (hidden when empty)
    data-description   helper text under the label
    data-error        error message (shown when set / on :user-invalid)
    placeholder       native placeholder
    value             native value (also a JS property)
    name / required / disabled / readonly / autocomplete
                      native attributes, reflected to the inner control

  Fires: input, change (re-dispatched from the inner control)
-->
<template id="default">
  <label class="field" part="field">
    <span class="label" part="label"></span>
    <span class="description" part="description"></span>
    <span class="control-row" part="control-row">
      <input class="control" part="control" type="password" />
      <button type="button" class="toggle" part="toggle" aria-pressed="false" aria-label="Show password" tabindex="-1">
        <span class="eye" aria-hidden="true"></span>
      </button>
    </span>
    <span class="message" part="message" aria-live="polite"></span>
  </label>
</template>
