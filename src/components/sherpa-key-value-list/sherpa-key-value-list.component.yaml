# sherpa-key-value-list — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-key-value-list.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-key-value-list
$description: a semantic definition list.
element:
  $type: element
  tag: dl
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: dl
      class: list
      part: list
    - el: template
      class: pair-tpl
      children:
        - el: dt
          class: key
          part: key
        - el: dd
          class: value
          part: value
props:
  - $type: prop
    name: data-layout
    type: enum
    kind: style
    values:
      - horizontal
      - stacked
    description: horizontal | stacked  No events — display only.
states:
  - $type: state
    name: horizontal
    selector: ":host([data-layout=\"horizontal\"])"
  - $type: state
    name: stacked
    selector: ":host([data-layout=\"stacked\"])"
  - $type: state
    name: not-layout
    selector: ":host(:not([data-layout]))"
tokens:
  list.row-gap: "{sherpa.display-space-xs}"
  key.color: "{sherpa.theme-content-body-1}"
  key.font-weight: "{sherpa.font-weight-medium}"
  value.color: "{sherpa.theme-content-body-base}"
$extensions:
  sherpa:
    figmaName: Key Value Pair
    category: container
