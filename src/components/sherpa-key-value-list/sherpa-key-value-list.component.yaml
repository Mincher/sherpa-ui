# sherpa-key-value-list — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-key-value-list.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-key-value-list
$description: a semantic definition list.
element:
  $type: element
  tag: dl
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: dl
      class: list
      part: list
    - el: template
      class: pair-tpl
      children:
        - el: dt
          class: key
          part: key
        - el: dd
          class: value
          part: value
props:
  - $type: prop
    name: data-orientation
    type: enum
    kind: style
    values:
      - horizontal
      - vertical
    description: horizontal | vertical  No events — display only.
states:
  - $type: state
    name: horizontal
    selector: ":host([data-orientation=\"horizontal\"])"
  - $type: state
    name: vertical
    selector: ":host([data-orientation=\"vertical\"])"
  - $type: state
    name: not-orientation
    selector: ":host(:not([data-orientation]))"
tokens:
  list.row-gap: "{sherpa.display-mode-space-xs}"
  key.color: "{sherpa.theme-content-body-1}"
  key.font-weight: "{sherpa.font-weight-medium}"
  key.line-height: "{sherpa.theme-content-line-height-base}"
  value.padding-inline: "{sherpa.theme-padding-sm}"
  value.color: "{sherpa.theme-content-body-1}"
  value.line-height: "{sherpa.theme-content-line-height-base}"
  value.background: "{sherpa.style-surface-base-1}"
  value.border-radius: "{sherpa.display-mode-border-rounding-sm}"
$extensions:
  sherpa:
    figmaName: Key Value Pair
    category: container
