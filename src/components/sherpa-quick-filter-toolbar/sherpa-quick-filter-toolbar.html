<!--
  sherpa-quick-filter-toolbar — a strip of quick-filter chips above a grid/list.

  populate([{ id, label, type?, active?, count? }]) stamps chips from a cloning
  prototype; toggling one emits quick-filter-change.

  Per-filter flags:
    data-reset-on-populate  populate() REPLACES chips; live picks do not survive.
    data-bounds  CSS selector the chip's menu must stay inside (else viewport).
    kind         values (default) | number | date — number/date lead with a
                 Range switch.
    removable    opt-in; the row DELETES the chip.
    persistent   always on, never removable, defaults to its FIRST option.
    commit       opt-in Apply/Cancel footer; chips auto-apply by default.

  Clear and Remove are icon buttons in the menu HEADER; the FOOTER holds
  Cancel/Apply plus Today.

  Public API:
    data-type      data (default) | view   (view adds the ★/Save/▾ group)
    data-panel-mode  a filter PANEL is answering for this bar: AI, Reset, the
                  panel toggle and Add filter are hidden, and a `data` bar goes
                  entirely. TRAP T-panel-mode-hides-what-the-panel-answers
    data-no-actions  hide the built-in cluster entirely (host owns the trailing end)
    data-favourite   the ★ is lit (view type) — the value, IN
    data-locked      the host owns the ★; report the click, never self-set
    data-sort-field      the field the Sort chip points at (the standard name)
    data-sort-direction  asc (default) | desc
    data-group-field     the field the Group chip points at (the standard name)

  Slots:
    view     — leading view chip (view type)
    actions  — host extras, placed BEFORE the built-in cluster

  Fires:
    quick-filter-change  — detail: { active, values, picked }
    group-change         — detail: { field }
    sort-change          — detail: { field, direction }
    filter-remove        — a chip was removed. detail: { id, filter }
    filter-add           — the Add chip's body was clicked
    filter-clear         — the undo button: every chip reset
    ai-filter-request    — the AI button
    filter-configure     — the sliders button
    data-refresh         — the refresh button
    view-save            — Save (view type)
    view-favorite        — the ★ toggled. detail: { favourite: boolean }
    view-menu-open       — the Save group's ▾ (view type)
    filter-overflow      — the ⋮ button

  The trailing action cluster is BUILT IN (Figma "Filter Toolbar" 150:3688) and
  follows Figma's `Type` axis. Every control exists in the template from the
  start; `data-type="view"` reveals the view-only group through CSS.
-->
<template id="default">
  <div class="bar" part="bar" role="toolbar" aria-label="Quick filters">
    <div class="view-zone" part="view-zone">
      <slot name="view"></slot>
    </div>

    <!-- ORGANISE ZONE — Group and Sort chips. They change how the grid is
         ARRANGED, not which rows survive, so they keep their own zone and
         divider rather than mixing into the filter run. -->
    <div class="organise-zone" part="organise"></div>

    <div class="chips" part="chips"></div>

    <!--
      THE OVERFLOW CHIP — where filter chips go when there is no room.

      Chips fold in from the END of the run, so the fold order is the reverse of
      the unfold order. CSS reveals it; #reflow() sets the count. It is a real
      <sherpa-quick-filter> so it reads as one of the run; its menu lists the
      folded chips, each opening a submenu carrying that chip's real menu.
    -->
    <!-- NO data-current here: More is active only when a folded chip is, and
         the toolbar writes that. TRAP T-the-more-chip-is-a-door-not-a-filter -->
    <sherpa-quick-filter class="overflow-chip" part="overflow-chip"
                         data-label="More" data-icon-start="filter"
                         data-persistent data-no-value
                         data-locked></sherpa-quick-filter>
    <!--
      ACTION CLUSTER — Figma's `right-actions` slot. Nothing is created at
      runtime. Icon-only buttons at the DEFAULT look (white face, 0.5px #B3B3C3
      ring) — read from the node's own pins, not tertiary. Each carries an
      aria-label because an icon button has no text to name it.
    -->
    <div class="actions-zone" part="actions">
      <!-- Host extras first, before the standard cluster. -->
      <slot name="actions"></slot>

      <!--
        ADD — one button, label plus an END caret (Figma 150:3688
        right-actions[0]); the instance's icon-start is `visible: false`.

        A <sherpa-menu> here must go in the button's `menu` SLOT — in the
        default slot it lands inside the label and widens the box.
      -->
      <sherpa-button class="act add-btn" data-act="add" data-size="sm"
                     data-icon-end="triangle-down"
                     aria-haspopup="menu">Add filter</sherpa-button>

      <sherpa-button class="act" data-size="sm" data-act="ai" data-type="icon"
                     data-icon-start="wand-magic-sparkles"
                     aria-label="Filter with AI"></sherpa-button>
      <sherpa-button class="act" data-size="sm" data-act="clear" data-type="icon"
                     data-icon-start="arrow-rotate-left"
                     aria-label="Reset filters"></sherpa-button>
      <!-- The SIDEBAR glyph, the same one the panel's own switch wears — the
           pair is one control seen from two sides. -->
      <sherpa-button class="act" data-size="sm" data-act="configure" data-type="icon"
                     data-icon-start="sidebar"
                     aria-label="Filter in a panel instead"></sherpa-button>

      <span class="act-divider" aria-hidden="true"></span>

      <!-- THE VIEW GROUP — Figma's "Frame 1": three controls snapped into one
           box. Shown only for data-type="view". -->
      <span class="view-group sherpa-group">
        <sherpa-button class="act" data-size="sm" data-act="favourite" data-type="icon"
                       data-group="start" data-icon-start="star"
                       aria-label="Favourite this view" aria-pressed="false"></sherpa-button>
        <sherpa-button class="act" data-size="sm" data-act="save"
                       data-group="mid" data-icon-start="upload">Save</sherpa-button>
        <sherpa-button class="act" data-size="sm" data-act="view-menu" data-type="icon"
                       data-group="end" data-icon-start="triangle-down"
                       aria-label="View options" aria-haspopup="menu"></sherpa-button>
      </span>

      <sherpa-button class="act" data-size="sm" data-act="refresh" data-type="icon"
                     data-icon-start="cw-circle-arrow"
                     aria-label="Refresh data"></sherpa-button>
      <sherpa-button class="act" data-size="sm" data-act="overflow" data-type="icon"
                     data-icon-start="ellipses-vertical"
                     aria-label="More actions" aria-haspopup="menu"></sherpa-button>
    </div>
  </div>

  <template class="qf-tpl">
    <sherpa-quick-filter class="chip"></sherpa-quick-filter>
  </template>

  <!-- A chip's value menu, cloned when its definition carries `options`. -->
  <template class="qf-menu-tpl">
    <sherpa-menu slot="menu"></sherpa-menu>
  </template>
  <!-- One row of the OVERFLOW chip's menu: a folded filter with a count badge.
       It is a DOOR — clicking it swaps the menu's list for that filter's rows.
       `data-expandable` is the wrong thing here: its toggle sits on the LEADING
       side and fires item-expand. -->
  <template class="qf-folded-tpl">
    <sherpa-list-item class="qf-folded" data-interactive>
      <sherpa-tag class="qf-folded-count" slot="trailing" hidden></sherpa-tag>
      <!-- Decorative: the whole ROW is the click target, so no tab stop and no
           label to announce twice. -->
      <sherpa-button class="qf-folded-caret" slot="trailing" data-type="icon"
                     data-size="xs" data-look="transparent" tabindex="-1"
                     aria-hidden="true"
                     data-icon-start="chevron-right"></sherpa-button>
    </sherpa-list-item>
  </template>

  <!--
    A DATE filter's menu content: the calendar in place of value rows.

    `data-embedded` drops the calendar's own Apply/Cancel — the MENU owns the
    action row, so a date chip commits through the same Apply as every other
    chip. Range and time variants set `data-type="range"` / `data-has-time` on
    this same element, not a second template.
  -->
  <!--
    A FOLDED TOGGLE — a boolean chip's row in the overflow menu.

    A chip with no `options` has nothing to drill into, so it gets the value-row
    shape rather than a drill row (whose handler needs a menu it has not got).
    The tick mirrors the chip's own on/off state.
  -->
  <template class="qf-toggle-tpl">
    <label class="qf-toggle">
      <input type="checkbox" style="margin: 0; flex: 0 0 auto;" />
      <span class="qf-toggle-label"></span>
    </label>
  </template>

  <template class="qf-calendar-tpl">
    <sherpa-calendar class="qf-calendar" data-embedded></sherpa-calendar>
  </template>

  <!-- THE RANGE SWITCH — first row of a number or date menu; flips what the
       rows below it are. Switch LEADS, label follows, so every control in the
       menu shares one left edge. -->
  <template class="qf-range-tpl">
    <div class="qf-range-row" data-row>
      <sherpa-switch class="qf-range-switch" data-type="simple"></sherpa-switch>
      <span class="qf-row-label">Range</span>
    </div>
  </template>

  <!--
    A NUMBER filter's content: one field when Range is off, a two-ended slider
    when on. BOTH exist from the start and CSS reveals one, so a flip keeps
    whatever was typed on the other side.

    A bare number input, not a sherpa-input-text: it sits in the CHIP's light
    DOM to be slotted, where no stylesheet reaches it anyway.
  -->
  <template class="qf-number-tpl">
    <div class="qf-number">
      <input class="qf-number-one sherpa-border-edges" type="number" inputmode="decimal"
             aria-label="Value" placeholder="Any" />
      <sherpa-slider class="qf-number-range" data-type="range"
                     data-show-value></sherpa-slider>
    </div>
  </template>

</template>
