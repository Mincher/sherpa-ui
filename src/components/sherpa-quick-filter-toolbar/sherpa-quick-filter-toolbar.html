<!--
  sherpa-quick-filter-toolbar — a strip of quick-filter chips above a grid/list.

  populate([{ id, label, type?, active?, count? }]) stamps chips from a cloning
  prototype; toggling one emits quick-filter-change.

  Per-filter flags:
    data-reset-on-populate  populate() REPLACES chips; live picks do not survive.
    data-bounds  CSS selector the chip's menu must stay inside (else viewport).
    kind         values (default) | number | date — number/date lead with a
                 Range switch.
    removable    opt-in; the row DELETES the chip.
    persistent   always on, never removable, defaults to its FIRST option.
    commit       opt-in Apply/Cancel footer; chips auto-apply by default.

  Clear and Remove are icon buttons in the menu HEADER; the FOOTER holds
  Cancel/Apply plus Today.

  Public API:
    data-type      data (default) | view   (view adds the ★/Save/▾ group)
    data-limit-options  on | off — the host offers "Limit matching filters": the
                   ⋮ always shows, and its menu holds the switch. Written by the
                   provider. Will, TODO 178.
    data-scope     ASKED of its provider: the Query scope it draws and answers
    data-panel-mode  a filter PANEL is answering for this bar: AI, Reset, the
                  panel toggle and Filters are hidden, and a `data` bar goes
                  entirely. TRAP T-panel-mode-hides-what-the-panel-answers
    data-no-actions  hide the built-in cluster entirely (host owns the trailing end)
    data-favourite   the ★ is lit (view type) — the value, IN
    data-locked      the host owns the ★; report the click, never self-set
    data-sort-field      the field the Sort chip points at (the standard name)
    data-sort-direction  asc (default) | desc
    data-group-field     the field the Group chip points at (the standard name)
    data-saveable    the host SAVES filters: a chip holding an Advanced filter,
                  and the Add menu once any field is on, offer "Save filter",
                  which fires filter-save. The host stores it and calls
                  packFilter(). TRAP T-save-packs-the-fields-into-one-chip
    data-remote      its source fetches from outside the data layer: a
                  multi-select or range menu waits for Apply. Without it,
                  every pick applies at once. Set by a bound source.
    data-pending     the FIELDS changed and not yet applied, space-separated.
                  Set by a bound source; each chip wears the pending look,
                  as one with a draft in its open menu does.

  Slots:
    view     — leading view chip (view type)
    actions  — host extras, placed BEFORE the built-in cluster

  Fires:
    quick-filter-change  — detail: { active, values, picked }
    group-change         — detail: { field }
    sort-change          — detail: { field, direction }
    filter-remove        — a chip was removed. detail: { id, filter }
    filter-save          — "Save filter" was pressed. detail: { readings, id?, label? } — id and label name the saved filter whose change is saved
    filter-delete        — a saved filter's Delete: it is off the bar. detail: { id }
    preset-edit          — a saved filter's rows changed, sent once when its editing ends. detail: { id, readings } — null puts the saved one back
    filter-add           — the Add chip's body was clicked
    filter-clear         — the undo button: every chip reset
    view-reset           — Reset all to default: put back the View's own filters, in every scope. Cancelable
    ai-filter-request    — the AI button
    data-refresh         — the refresh button
    view-save            — Save (view type)
    view-favorite        — the ★ toggled. detail: { favourite: boolean }
    view-save-as         — Save view as, from the Save group's ▾ (view type)
    view-delete          — Delete view, the reader's own View (view type)
    limit-options-change — the ⋮ menu's "Limit matching filters". detail: { on }

  The trailing action cluster is BUILT IN (Figma "Filter Toolbar" 150:3688) and
  follows Figma's `Type` axis. Every control exists in the template from the
  start; `data-type="view"` reveals the view-only group through CSS.
-->
<template id="default">
  <div class="bar" part="bar" role="toolbar" aria-label="Quick filters">
    <div class="view-zone" part="view-zone">
      <slot name="view"></slot>
    </div>

    <!-- ORGANISE ZONE — Group and Sort chips. They change how the grid is
         ARRANGED, not which rows survive, so they keep their own zone and
         divider rather than mixing into the filter run. -->
    <div class="organise-zone" part="organise"></div>

    <div class="chips" part="chips"></div>

    <!--
      ACTION CLUSTER — Figma's `right-actions` slot. Nothing is created at
      runtime. Icon-only buttons at the DEFAULT look (white face, 0.5px #B3B3C3
      ring) — read from the node's own pins, not tertiary. Each carries an
      aria-label because an icon button has no text to name it.
    -->
    <div class="actions-zone" part="actions">
      <!-- Host extras first, before the standard cluster. -->
      <slot name="actions"></slot>

      <!--
        FILTERS — ONE button for every filter: the chips folded away for want
        of room (its badge counts them), every filter to add, and the saved
        ones. Chips fold in from the END of the run. Figma 150:3688
        right-actions[0]. TRAP T-one-filters-button

        A <sherpa-menu> here must go in the button's `menu` SLOT — in the
        default slot it lands inside the label and widens the box.
      -->
      <sherpa-button class="act add-btn" data-act="add" data-size="sm"
                     data-icon-start="plus" data-icon-end="triangle-down"
                     aria-haspopup="dialog">Filters</sherpa-button>

      <sherpa-button class="act" data-size="sm" data-act="ai" data-type="icon"
                     data-icon-start="wand-magic-sparkles"
                     aria-label="Suggest filters"></sherpa-button>
      <!-- RESET, and its menu: Reset all to default. Will, TODO 109 and 129.
           TRAP T-reset-to-default-is-the-views-own -->
      <span class="reset-group sherpa-group">
        <sherpa-button class="act" data-size="sm" data-act="clear" data-group="start"
                       data-icon-start="arrow-rotate-left"
                       aria-label="Reset all filters">Reset</sherpa-button>
        <sherpa-button class="act reset-more" data-size="sm" data-act="reset-more" data-type="icon"
                       data-group="end" data-icon-start="triangle-down"
                       aria-label="Reset options" aria-haspopup="dialog">
          <sherpa-menu slot="menu" data-align="end">
            <button type="button" value="reset-default">Reset all to default</button>
          </sherpa-menu>
        </sherpa-button>
      </span>
      <span class="act-divider" aria-hidden="true"></span>

      <!-- THE VIEW GROUP — Figma's "Frame 1": three controls snapped into one
           box. Shown only for data-type="view". -->
      <span class="view-group sherpa-group">
        <sherpa-button class="act" data-size="sm" data-act="favourite" data-type="icon"
                       data-group="start" data-icon-start="star"
                       aria-label="Add to Favorites" aria-pressed="false"></sherpa-button>
        <sherpa-button class="act" data-size="sm" data-act="save"
                       data-group="mid" data-icon-start="upload">Save</sherpa-button>
        <sherpa-button class="act view-more" data-size="sm" data-act="view-menu" data-type="icon"
                       data-group="end" data-icon-start="triangle-down"
                       aria-label="Save view options" aria-haspopup="dialog">
          <!-- Delete only on the reader's own View. TRAP T-a-saved-view-is-the-readers-own -->
          <sherpa-menu slot="menu" class="view-menu" data-align="end">
            <button type="button" value="save-as">Save view as</button>
            <button type="button" value="delete" class="view-delete" data-status="critical">Delete view</button>
          </sherpa-menu>
        </sherpa-button>
      </span>

      <sherpa-button class="act" data-size="sm" data-act="refresh" data-type="icon"
                     data-icon-start="cw-circle-arrow"
                     aria-label="Refresh data"></sherpa-button>
      <sherpa-button class="act" data-size="sm" data-act="overflow" data-type="icon"
                     data-icon-start="ellipses-vertical"
                     aria-label="More actions" aria-haspopup="dialog"></sherpa-button>
    </div>
  </div>

  <!-- THE ⋮ MENU: one menu, filled on each open with what has folded away.
       TRAP T-the-more-menu-holds-what-folded -->
  <sherpa-menu class="more-menu" data-align="end"></sherpa-menu>
  <template class="more-item-tpl">
    <button class="more-item" type="button"><span class="more-label"></span></button>
  </template>
  <template class="more-divider-tpl"><hr class="more-divider" /></template>
  <!-- A SWITCH row: a check row, as a filter's menu draws one. Will, TODO 178. -->
  <template class="more-check-tpl">
    <label class="menu-row more-check"><input type="checkbox" value="limit-options" /><span class="menu-row-label">Limit matching filters</span></label>
  </template>

  <template class="qf-tpl">
    <sherpa-quick-filter class="chip"></sherpa-quick-filter>
  </template>

  <!-- A chip's value menu, cloned when its definition carries `options`. -->
  <!-- A DATE body stays SLOTTED: the calendar projects its stepper into the
       menu's `header` slot, and slot assignment only reaches a host's LIGHT
       DOM. The Range switch above it IS the menu's.
       TRAP T-a-menu-owns-its-own-bodies -->
  <!-- Where an on/off chip's child menu is built for a drill: never shown,
       only its rows move. TRAP T-a-row-opens-its-child-menu -->
  <div class="qf-built" hidden></div>
  <!-- A saved filter's menu: each field's own menu, read-only, drawn above
       these. The reader's OWN filter keeps its actions; Save and Discard show
       while it holds a change or is being edited.
       TRAP T-a-saved-chip-lists-its-conditions · TRAP T-a-saved-filter-keeps-its-edit
       TRAP T-an-action-row-can-keep-its-menu-open -->
  <template class="qf-saved-menu-tpl">
    <sherpa-menu slot="menu" data-no-select-all>
      <hr class="qf-saved-own" />
      <button type="button" class="qf-saved-edit" value="save-edit">Save filter</button>
      <button type="button" class="qf-saved-edit" value="discard-edit">Discard changes</button>
      <button type="button" class="qf-saved-own" value="edit" data-stay-open>Edit filter</button>
      <button type="button" class="qf-saved-own" value="delete">Delete filter</button>
    </sherpa-menu>
  </template>
  <!-- One field of a saved filter: its heading, then its menu or its words. -->
  <template class="qf-saved-field-tpl">
    <div><p class="menu-section"></p><div class="saved-field" role="group"></div><p class="menu-line"></p></div>
  </template>




</template>
