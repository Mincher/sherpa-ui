<!--
  sherpa-quick-filter-toolbar — a strip of quick-filter chips above a grid/list.

  populate([{ id, label, type?, active?, count? }]) stamps sherpa-quick-filter
  chips from a cloning prototype. Toggling a chip emits quick-filter-change with
  the full set of active filter ids. A trailing actions slot holds add / clear
  controls; an optional leading view slot (data-type="view") holds a view chip.

  Public API:
    data-type      data (default) | view   (view adds the ★/Save/▾ group)
    data-no-actions  hide the built-in cluster entirely (host owns the trailing end)
    data-favourite   the ★ is lit (view type)

  Slots:
    view     — leading view chip (view type)
    actions  — host extras, placed BEFORE the built-in cluster

  Fires:
    quick-filter-change  — detail: { active, values, picked }
    group-change / sort-change
    filter-add           — the Add chip's body was clicked
    filter-clear         — the undo button: every chip reset
    ai-filter-request    — the AI button
    filter-configure     — the sliders button
    data-refresh         — the refresh button
    view-save            — Save (view type)
    view-favorite        — the ★ toggled. detail: { favourite: boolean }
    view-menu-open       — the Save group's ▾ (view type)
    filter-overflow      — the ⋮ button

  ── THE ACTION CLUSTER (Figma "Filter Toolbar" 150:3688) ────────────────────
  The trailing cluster is BUILT IN and follows Figma's `Type` axis. It used to be
  an empty `actions` slot with the cluster "delegated to the host" — reversed on
  Will's call, because Figma models this as ONE component and every host that
  mounted a toolbar had to rebuild the same seven buttons.

  Both types, in order:   Add chip · AI · undo · configure · │ · refresh · ⋮
  Type=view ALSO inserts, after the divider:  [★│Save│▾]  (one snapped group)

  Every control exists in the template from the start; `data-type` reveals the
  view-only group through CSS. The `actions` slot survives for host extras and
  renders BEFORE the built-in cluster.
-->
<template id="default">
  <div class="bar" part="bar" role="toolbar" aria-label="Quick filters">
    <div class="view-zone" part="view-zone">
      <slot name="view"></slot>
    </div>

    <!--
      ORGANISE ZONE — the Group and Sort chips, at the START of the bar.

      Figma's Filter Toolbar (Type=data) opens its content slot with TWO menu
      chips, then a 1x16 Divider, then the filter chips. These are those two: they
      change how the grid is ARRANGED, not which rows survive, so they are kept in
      their own zone with its own divider rather than mixed into the filter run.
      Same Filter Chip (atom) component either way — only the placement differs.
    -->
    <div class="organise-zone" part="organise"></div>

    <div class="chips" part="chips"></div>
    <!--
      ACTION CLUSTER — Figma's `right-actions` slot, built in.

      Every button exists here from the start; CSS reveals the view-only group
      off :host([data-type="view"]). Nothing is created at runtime.

      The buttons are icon-only sherpa-buttons at the DEFAULT look — white face,
      0.5px #B3B3C3 ring. Read from the node's own pins: every Button instance in
      `right-actions` is pinned `Style: default`, with fill #FFFFFF and stroke
      #B3B3C3. They were built on the assumption that a
      run of icon buttons must be tertiary; the pins say otherwise, and a bordered
      cluster is what separates these ACTIONS from the filter chips beside them.

      Each carries an aria-label, because an icon button has no text to name it.
    -->
    <div class="actions-zone" part="actions">
      <!-- Host extras first, so a slotted control reads as part of the host's
           own toolbar rather than interrupting the standard cluster. -->
      <slot name="actions"></slot>

      <!--
        ADD — a single Button, read from the updated node (150:3688
        right-actions[0]): Type=label, 99 x 24, pinned Structure=sm and
        Style=default, so a white face and 0.5px #B3B3C3 ring like the rest of
        the cluster.

        Label "Add filter", and ONE icon: `triangle-down` at the END. The
        instance's icon-start is present but `visible: false`, so the design
        shows no leading glyph — 99 = 8 padding + 61 label + 8 gap + 14 icon + 8
        padding, which only adds up without one.

        The caret is now an END ICON on one button rather than a second snapped
        control. That is the change: adding a filter always meant "show me the
        list", so a body/caret split was two controls doing one job.

        The <sherpa-menu> goes in the button's `menu` SLOT, not its default one —
        a popover in the default slot lands inside the label, joining its text
        and widening the box.
      -->
      <sherpa-button class="act add-btn" data-act="add" data-size="sm"
                     data-icon-end="fa-solid fa-caret-down"
                     aria-haspopup="menu" aria-expanded="false">Add filter</sherpa-button>

      <sherpa-button class="act" data-size="sm" data-act="ai" data-type="icon"
                     data-icon-start="fa-solid fa-wand-magic-sparkles"
                     aria-label="Filter with AI"></sherpa-button>
      <sherpa-button class="act" data-size="sm" data-act="clear" data-type="icon"
                     data-icon-start="fa-solid fa-arrow-rotate-left"
                     aria-label="Reset filters"></sherpa-button>
      <!-- Figma's glyph is `sliders-up`, which is Font Awesome PRO — and a Pro
           class in the free webfont renders NOTHING at all (content: none, zero
           glyph). `fa-sliders` is the same control-sliders picture in Free.
           Verified by rendering both inside a real shadow root. -->
      <sherpa-button class="act" data-size="sm" data-act="configure" data-type="icon"
                     data-icon-start="fa-solid fa-sliders"
                     aria-label="Configure filters"></sherpa-button>

      <span class="act-divider" aria-hidden="true"></span>

      <!--
        THE VIEW GROUP — Figma's "Frame 1": three controls SNAPPED into one box
        (gap -0.5, i.e. their borders overlap). data-snap squares the joined
        edges so they read as a single control, which is what makes ★ and ▾ read
        as parts of Save rather than three loose buttons.

        Shown only for data-type="view".
      -->
      <span class="view-group">
        <sherpa-button class="act" data-size="sm" data-act="favourite" data-type="icon"
                       data-snap="right" data-icon-start="fa-regular fa-star"
                       aria-label="Favourite this view" aria-pressed="false"></sherpa-button>
        <sherpa-button class="act save-btn" data-size="sm" data-act="save"
                       data-snap="all" data-icon-start="fa-solid fa-upload">Save</sherpa-button>
        <sherpa-button class="act" data-size="sm" data-act="view-menu" data-type="icon"
                       data-snap="left" data-icon-start="fa-solid fa-caret-down"
                       aria-label="View options" aria-haspopup="menu"></sherpa-button>
      </span>

      <sherpa-button class="act" data-size="sm" data-act="refresh" data-type="icon"
                     data-icon-start="fa-solid fa-arrows-rotate"
                     aria-label="Refresh data"></sherpa-button>
      <sherpa-button class="act" data-size="sm" data-act="overflow" data-type="icon"
                     data-icon-start="fa-solid fa-ellipsis-vertical"
                     aria-label="More actions" aria-haspopup="menu"></sherpa-button>
    </div>
  </div>

  <template class="qf-tpl">
    <sherpa-quick-filter class="chip"></sherpa-quick-filter>
  </template>

  <!-- A chip's value menu, cloned when its definition carries `options`. Rows are
       real form controls, so keyboard + screen-reader behaviour comes free. -->
  <template class="qf-menu-tpl">
    <sherpa-menu slot="menu"></sherpa-menu>
  </template>
  <template class="qf-row-tpl">
    <label><input type="checkbox" /><span class="qf-row-label"></span></label>
  </template>

  <!--
    A DATE filter's menu content: the calendar itself, in place of value rows.

    `data-embedded` drops the calendar's own Apply/Cancel — the MENU owns the
    action row, exactly as Figma's Calendar composes a Container Footer rather
    than drawing one. So a date chip commits through the same single Apply as
    every other filter chip, and the toolbar needs no date-specific path.

    The same prototype serves the range and time variants that are coming: those
    are `data-type="range"` and `data-has-time` on this element, which the chip
    definition sets — not a second template.
  -->
  <template class="qf-calendar-tpl">
    <sherpa-calendar class="qf-calendar" data-embedded></sherpa-calendar>
  </template>

  <!--
    "Remove filter" — an ACTION row, so a <button>, not a label+input. The menu
    treats the two differently on purpose: a value row is part of the draft that
    Apply commits, where an action fires immediately. Removing a filter is not a
    value you might change your mind about before applying; it is the thing you
    came to do.

    It sits at the END, after the values, because it is destructive and should
    not be the first thing a thumb lands on.
  -->
  <template class="qf-remove-tpl">
    <button type="button" class="qf-remove" value="remove">
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      <span>Remove filter</span>
    </button>
  </template>
</template>
