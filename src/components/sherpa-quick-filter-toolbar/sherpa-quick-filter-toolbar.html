<!--
  sherpa-quick-filter-toolbar — a strip of quick-filter chips above a grid/list.

  populate([{ id, label, type?, active?, count? }]) stamps chips from a cloning
  prototype; toggling one emits quick-filter-change.

  Per-filter flags:
    data-reset-on-populate  populate() REPLACES chips; live picks do not survive.
    data-bounds  CSS selector the chip's menu must stay inside (else viewport).
    kind         values (default) | number | date — number/date lead with a
                 Range switch.
    removable    opt-in; the row DELETES the chip.
    persistent   always on, never removable, defaults to its FIRST option.
    commit       opt-in Apply/Cancel footer; chips auto-apply by default.

  Clear and Remove are icon buttons in the menu HEADER; the FOOTER holds
  Cancel/Apply plus Today.

  Public API:
    data-scroll-shadow  an inner shadow on each edge its column is scrolled past (boolean)
    data-flat       portrait: its scope is a HEADING, not an accordion — the column's View (boolean)
    data-column     portrait: a column, header and all, even over one scope and its parts (boolean)
    data-type      data (default) | view
    data-orientation  landscape (default) | portrait — PORTRAIT is the panel's
                    column. Over ONE scope, the scope is an accordion — its
                    name, its matches while shut, its Apply and Discard —
                    holding Group and Sort, then each list field as a SECTION
                    of value chips; nothing folds. Over SEVERAL scopes
                    (`data-scope="view data"`) it is the COLUMN: ONE header —
                    Save <name>, one Filters menu for every scope, the page's
                    buttons, ⋮ and the search — over one such accordion per
                    scope. A column opens and shuts as a panel does. TODO 425
    open           a column is showing. A host writes it; every close reports
                    `filter-panel-close`, and says why.
    data-heading   its scope's name, written by its source: a portrait bar's
                    heading.
    data-fetch-fields  the fields the STORE answers, space-separated: each Apply
                    asks it once for the keys they match. Read by the provider.
    data-at-default  the filters already ARE the View's default: "Reset all to
                    default" is inactive. Written by the provider. TODO 231.
    data-nothing-to-reset  nothing is left to clear: Reset is inactive. Written by
                    the provider. TODO 231.
    data-limit-options  on | off — the host offers "Limit to matching filters": the
                   ⋮ always shows, and its menu holds the switch. Written by the
                   provider. Will, TODO 178.
    data-hide-unmatched  on | off — the host hides what Limit rules out, when it is on
    data-scope     ASKED of its provider: the Query scope it draws and answers
    data-panel-mode  a filter PANEL is answering for this bar: Reset, the
                  panel toggle and Filters are hidden, and a `data` bar goes
                  entirely. TRAP T-panel-mode-hides-what-the-panel-answers
    data-switchable  show Figma's leading filter Switch, on a data bar: off stops
                  every filter in the bar and keeps its value. Hidden by
                  default, for legacy reasons. Will, TODO 338.
    data-no-actions  hide the built-in cluster entirely (host owns the trailing end)
    data-locked      the host owns the state; report, never self-set
    data-sort-field      the field the Sort chip points at (the standard name)
    data-sort-direction  asc (default) | desc
    data-group-field     the field the Group chip points at (the standard name)
    data-saveable    the host SAVES filters: its ⋮ offers Save filters, or "Save
                  <name>" over the set last taken with Save filters as and
                  Delete filters. Its `savedSets` fill the Filters menu's Saved
                  section. TRAP T-saved-filters-are-every-scope
    data-remote      its source fetches from outside the data layer: a
                  multi-select or range menu waits for Apply. Without it,
                  every pick applies at once. Set by a bound source.
    data-apply-on    input: its source applies LIVE — a number does not wait
                  for Apply, and reports while it moves. Set by a bound
                  source. TODO 107
    data-pending     the FIELDS changed and not yet applied, space-separated.
                  Set by a bound source; each chip wears the pending look,
                  as one with a draft in its open menu does.
    data-waits       its scope waits for ONE Apply, this bar's: its menus keep
                  Discard alone. Set by a bound source. TODO 406
    data-dirty       something in its scope is changed and not applied: Apply
                  is on. Set by a bound source.
    data-failed      the FIELDS whose own read failed, space-separated: each
                  chip says so in critical. Set by a bound source. TODO 411

  Slots:
    view     — leading view chip (view type)
    actions  — host extras, placed BEFORE the built-in cluster; a column's, in its header

  Fires:
    quick-filter-change  — one reader act, as a request: a field's answer, an on or off, the Switch, Clear all. detail: { scope, request?, active, values }
    group-change         — detail: { field }
    sort-change          — detail: { field, direction }
    filter-remove        — a chip was removed. detail: { id, filter, holds }
    filter-add           — chips were added, detail: { ids, filters, holds }; or a REQUEST to move a field to another scope — Move to View filters, or back. detail: { scope, ids, from }
    view-reset           — Reset all on view: put back the View's own filters, in every scope. Cancelable
    filter-apply         — Apply, where the scope waits: send every change held in it. detail: { }
    filter-discard       — Discard, where the scope waits: put back the applied answer — a menu's, its field's; the bar's, every field's. detail: { field? }
    filters-apply        — a saved set's row was ticked: take it, so the filters match it. detail: { id }
    filters-dismiss      — a saved set's row was unticked: the scopes it names lose their filters. detail: { id }
    filters-save         — Save filters: over the set last taken ("Save <name>"), else under a new name. detail: { }
    filters-save-as      — Save filters as: a new set, by name. detail: { }
    filters-delete       — Delete filters: forget the set last taken. detail: { id }
    filters-manage       — Manage Saved Filters: the host opens its dialog, to rename and remove the reader's sets. detail: { }
    limit-options-change — the ⋮ menu's "Limit to matching filters". detail: { on }
    hide-unmatched-change — the ⋮ menu's "Hide invalid filters" row, while Limit is on. detail: { on }
    filter-panel-close   — a column shut, and why: the reader, the width or the page. detail: { reason }
    data-refresh         — Refresh: load the page's data again. detail: {}

  The trailing action cluster is BUILT IN (Figma "Filter Toolbar" 150:3688) and
  follows Figma's `Type` axis. Every control exists in the template from the
  start. The View's ★ and Save are the App Header's (TODOs 425 G9, 428).
-->
<template id="default">
  <div class="bar" part="bar" role="toolbar" aria-label="Quick filters">
    <div class="view-zone" part="view-zone">
      <slot name="view" data-accepts="control"></slot>
    </div>

    <!-- The leading filter Switch: every filter, the grouping and the sort off or
         on, each keeping its value. Left of Group. Will, TODO 398 -->
    <div class="switch-zone" part="switch">
      <sherpa-switch class="filters-switch" data-type="simple" checked aria-label="Apply filters"></sherpa-switch>
    </div>

    <!-- ORGANISE ZONE — Group and Sort chips. They change how the grid is
         ARRANGED, not which rows survive, so they keep their own zone and
         divider rather than mixing into the filter run. -->
    <div class="organise-zone" part="organise"></div>

    <div class="chips" part="chips"></div>

    <!--
      ACTION CLUSTER — Figma's `right-actions` slot. Nothing is created at
      runtime. Icon-only buttons at the DEFAULT look (white face, 0.5px #B3B3C3
      ring) — read from the node's own pins, not tertiary. Each carries an
      aria-label because an icon button has no text to name it.
    -->
    <div class="actions-zone" part="actions">
      <!-- APPLY — ONE for a scope that waits: every pick in it is held until
           this. Left of the panel toggle a provider puts in the slot, a divider
           between. Will, TODO 406 -->
      <sherpa-button class="act apply-all" data-act="apply" data-size="sm"
                     data-look="saturated" disabled>Apply</sherpa-button>
      <!-- …and Discard at its right: every change held goes. Will, 406; its word, TODO 431 -->
      <sherpa-button class="act discard-all" data-act="discard" data-size="sm"
                     data-icon-start="cross" disabled>Discard</sherpa-button>
      <span class="act-divider apply-divider" aria-hidden="true"></span>
      <!-- Host extras first, before the standard cluster. -->
      <slot name="actions" data-accepts="control"></slot>

      <!--
        FILTERS — ONE button for every filter: the chips folded away for want
        of room (its badge counts them), every filter to add, and the saved
        ones. Chips fold in from the END of the run. Figma 150:3688
        right-actions[0]. TRAP T-one-filters-button

        A <sherpa-menu> here must go in the button's `menu` SLOT — in the
        default slot it lands inside the label and widens the box.
      -->
      <!-- "Save <name>" while a saved set is taken; every other filter action is
           in the Filters menu. Will, TODO 383 -->
      <sherpa-button class="act save-set" data-act="filters-save" data-size="sm"
                     data-icon-start="upload">Save&nbsp;<span class="save-name"></span></sherpa-button>
      <sherpa-button class="act add-btn" data-act="add" data-size="sm"
                     data-icon-start="plus" data-icon-end="triangle-down"
                     aria-haspopup="dialog">Filters</sherpa-button>

      <!-- REFRESH, left of the ⋮. Will, TODO 428 -->
      <sherpa-button class="act" data-size="sm" data-act="refresh" data-type="icon"
                     data-icon-start="cw-circle-arrow"
                     aria-label="Refresh data"></sherpa-button>
      <sherpa-button class="act" data-size="sm" data-act="overflow" data-type="icon"
                     data-icon-start="ellipses-vertical"
                     aria-label="More actions" aria-haspopup="dialog"></sherpa-button>
    </div>
  </div>
</template>

<!-- PORTRAIT — the panel's column. The scope is an accordion, as a panel's is:
     its name, a badge of what its filters match while shut, and its Apply and
     Discard on the header row. TODO 425 -->
<template id="portrait">
  <sherpa-accordion class="scope" part="scope" open>
    <sherpa-tooltip slot="badge" class="scope-tip"><sherpa-badge class="scope-results" role="img"></sherpa-badge></sherpa-tooltip>
    <span slot="actions" class="actions-zone" part="actions">
      <sherpa-button class="act apply-all" data-act="apply" data-size="sm"
                     data-look="saturated" disabled>Apply</sherpa-button>
      <sherpa-button class="act discard-all" data-act="discard" data-size="sm"
                     data-icon-start="cross" disabled>Discard</sherpa-button>
      <slot name="actions" data-accepts="control"></slot>
    </span>
    <div class="bar" part="bar" role="toolbar" aria-label="Quick filters">
      <div class="switch-zone" part="switch">
        <sherpa-switch class="filters-switch" data-type="simple" checked aria-label="Apply filters"></sherpa-switch>
      </div>
      <!-- Headed "Organise", as the panel's was. Will, TODO 438 -->
      <div class="organise-zone" part="organise" data-section="Organise"></div>
      <div class="chips" part="chips"></div>
    </div>
  </sherpa-accordion>
</template>

<!-- FLAT — a portrait toolbar whose scope is a HEADING, not an accordion: the
     column's View Context. The heading row holds Apply and Discard; its fields
     follow. Will, TODO 435 -->
<template id="flat">
  <sherpa-section-header class="scope" part="scope" data-size="sm" data-divider="none">
    <span slot="actions" class="actions-zone" part="actions">
      <sherpa-button class="act apply-all" data-act="apply" data-size="sm"
                     data-look="saturated" disabled>Apply</sherpa-button>
      <sherpa-button class="act discard-all" data-act="discard" data-size="sm"
                     data-icon-start="cross" disabled>Discard</sherpa-button>
      <slot name="actions" data-accepts="control"></slot>
    </span>
  </sherpa-section-header>
  <div class="bar" part="bar" role="toolbar" aria-label="Quick filters">
    <div class="switch-zone" part="switch">
      <sherpa-switch class="filters-switch" data-type="simple" checked aria-label="Apply filters"></sherpa-switch>
    </div>
    <div class="organise-zone" part="organise"></div>
    <div class="chips" part="chips"></div>
  </div>
</template>

<!-- COLUMN — portrait over SEVERAL scopes: the panel area's. ONE header — Save
     <name>, the Filters menu for every scope, the page's buttons, ⋮, and the
     one search above every scope — over the View Context, a rule, then the
     Local Context: a portrait toolbar per component scope. TODO 425 · Will, TODO 435 -->
<template id="column">
  <sherpa-container class="column" part="column" data-padding="none"
                    data-swap-on="data-scroll-shadow" data-swap-data-scroll-shadow="">
    <sherpa-container-header slot="header" class="head" part="head" data-icon="filter" data-heading="Filters">
      <sherpa-button slot="actions" class="column-save" part="save" data-size="sm"
                     data-icon-start="upload">Save&nbsp;<span class="save-name"></span></sherpa-button>
      <sherpa-button slot="actions" class="column-filters" part="filters" data-size="sm"
                     data-icon-start="plus" data-icon-end="triangle-down"
                     aria-haspopup="dialog">Filters</sherpa-button>
      <slot name="actions" slot="actions" data-accepts="control"></slot>
      <sherpa-button slot="actions" class="column-more" part="more" data-type="icon" data-size="sm"
                     data-icon-start="ellipses-vertical"
                     aria-label="More actions" aria-haspopup="dialog"></sherpa-button>
      <sherpa-input-text slot="metadata" class="find" part="find"
                         data-icon-start="magnifying-glass" data-clearable
                         placeholder="Search filters" autocomplete="off"
                         aria-label="Search every filter"></sherpa-input-text>
    </sherpa-container-header>
    <div class="sections" part="sections">
      <div class="view-scope" part="view-scope"></div>
      <hr class="scope-rule" part="scope-rule" />
      <sherpa-section-header class="local-heading" part="local-heading" data-heading="Local Context"
                             data-size="sm" data-divider="none"></sherpa-section-header>
      <div class="local-scopes" part="local-scopes"></div>
    </div>
  </sherpa-container>

  <!-- One scope's toolbar, in portrait. -->
  <template class="section-tpl"><sherpa-quick-filter-toolbar data-orientation="portrait"></sherpa-quick-filter-toolbar></template>
</template>
