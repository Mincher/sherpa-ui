<!-- toolbar-rows.html — what every filter toolbar template clones: a chip, Group
     and Sort, Move, a section's ⋮, a bar's ⋮ row and the words. Listed first,
     so each stamp — landscape, portrait, card or column — holds them.
     TRAP T-a-family-shares-markup -->
<template id="default">
  <!-- The ⋮ menu: its rows and their words. TRAP T-the-more-menu-holds-what-folded -->
  <sherpa-menu class="more-menu" data-align="end"></sherpa-menu>
  <!-- A page button's row: its words are the page's. -->
  <template class="more-item-tpl"><button class="more-item" type="button"><span class="more-label"></span></button></template>
  <template class="more-divider-tpl"><hr class="more-divider" /></template>
  <template class="more-rows-tpl">
    <button class="more-item" type="button" value="reset"><span class="more-label">Reset filters</span></button>
    <button class="more-item" type="button" value="reset-default"><span class="more-label">Reset to view defaults</span></button>
    <button class="more-item" type="button" value="filters-save"><span class="more-label">Save filters…</span></button>
    <!-- SWITCH rows, as a filter's menu draws one. Will, TODO 178 and 205. -->
    <label class="menu-row more-check"><input type="checkbox" value="limit-options" /><span class="menu-row-label">Limit to matching filters</span></label>
    <!-- Below Limit, and inactive while Limit is off. Will, TODOs 205 and 376. -->
    <label class="menu-row more-check"><input type="checkbox" value="hide-unmatched" /><span class="menu-row-label">Hide invalid filters</span></label>
    <button class="more-item" type="button" value="suggest"><span class="more-label">Suggest filters</span></button>
    <button class="more-item" type="button" value="refresh"><span class="more-label">Refresh data</span></button>
    <!-- The page's Query as nodes, where the host offers it. Will, TODOs 555, 822 -->
    <button class="more-item" type="button" value="node-editor"><span class="more-label">Open in Node Editor</span></button>
    <!-- The Saved menu's last row, where the app splits it from Filters. TODO 436 -->
    <button class="more-item" type="button" value="filters-manage"><span class="more-label">Manage Saved Filters</span></button>
  </template>

  <template class="qf-tpl">
    <sherpa-quick-filter class="chip"></sherpa-quick-filter>
  </template>

  <!-- The Group and Sort chips: not a `.chip`, so the filter code passes them by. -->
  <!-- A chart's Primary, what it counts, and Secondary, what it splits by: a
       Group chip's gesture each. Will, TODO 548 -->
  <template class="organise-primary-tpl">
    <sherpa-quick-filter class="organise-chip" data-id="primary" data-kind="group" data-label="Primary" data-icon-start="table-columns"></sherpa-quick-filter>
  </template>
  <template class="organise-secondary-tpl">
    <sherpa-quick-filter class="organise-chip" data-id="secondary" data-kind="group" data-label="Secondary" data-icon-start="toolbar-pivot"></sherpa-quick-filter>
  </template>
  <template class="organise-group-tpl">
    <sherpa-quick-filter class="organise-chip" data-id="group" data-kind="group" data-label="Group"></sherpa-quick-filter>
  </template>
  <template class="organise-sort-tpl">
    <sherpa-quick-filter class="organise-chip" data-id="sort" data-kind="sort" data-label="Sort"></sherpa-quick-filter>
  </template>

  <!-- MOVE, a row of a chip's menu, in toolbar mode: the field up to the View,
       or a View field back down. Will, TODOs 425 G4, 450 · TRAP T-send-to-view-filters -->
  <template class="move-tpl"><button slot="actions" class="more-item move" type="button" value="move"></button></template>
  <!-- SOLO, rows of a chip's menu: every other filter in its scope off while it is.
       CSS shows them where the app allows it, and the one that applies. Will, TODO 690 -->
  <template class="solo-tpl"><button slot="actions" class="more-item" type="button" value="solo">Solo this filter</button></template>
  <template class="unsolo-tpl"><button slot="actions" class="more-item" type="button" value="unsolo">Remove soloing</button></template>
  <!-- The words its code hands on as data. TRAP T-a-word-is-in-the-markup -->
  <template class="words">
    <span data-word="raise">Move to View Context</span>
    <span data-word="lower">Move to</span>
    <span data-word="return">Return to</span>
    <!-- The heading over a scope's presets, and a local bar's other fields. Will, TODOs 493, 610 -->
    <span data-word="presets">Presets</span>
    <span data-word="custom">Custom</span>
    <!-- What a panel scope narrows, under its name, where its tag says it badly. Will, TODO 457 -->
    <span data-word="sherpa-barchart">Bar Chart</span>
    <!-- A radial chart is a donut unless its data-type says pie. -->
    <span data-word="sherpa-radial-chart">Donut Chart</span>
    <span data-word="sherpa-radial-chart:donut">Donut Chart</span>
    <span data-word="sherpa-radial-chart:pie">Pie Chart</span>
    <!-- After a Primary's definition's field, in its menu. Will, TODO 572 -->
    <span data-word="default">(Default)</span>
  </template>
  <!-- A SECTION's own Apply and Discard, before its ⋮, where each field applies
       on its own: shown while the field is pending. Will, TODO 451 -->
  <template class="field-apply-tpl">
    <!-- `default`: the pair is the bar's look, never its field chip's active one. -->
    <span slot="more" class="field-apply" data-status="default">
      <sherpa-button class="field-commit" data-size="sm" data-look="saturated">Apply</sherpa-button>
      <sherpa-button class="field-discard" data-size="sm" data-icon-start="trash">Discard</sherpa-button>
    </span>
  </template>
  <!-- A SECTION's ⋮, in its chip's `more` slot: the field's own actions, each
       only where it applies. Will, TODO 425 G1. `default`: never its chip's
       active look — the picks decide only its rows. Will, TODO 483 -->
  <template class="field-more-tpl">
    <sherpa-button slot="more" class="field-more" data-type="icon" data-size="sm" data-status="default"
                   data-icon-start="ellipses-vertical" aria-haspopup="dialog"
                   data-description="Change, move, reset or remove this filter.">
      <sherpa-menu slot="menu" class="field-menu" data-align="end">
        <!-- Both ways, and CSS says the one it goes now. TODO 523 P7 -->
        <button class="more-item" type="button" value="advanced"><span class="more-label">Advanced</span><span class="more-label more-on">Simple</span></button>
        <button class="more-item" type="button" value="raise"><span class="more-label"></span></button>
        <button class="more-item" type="button" value="lower"><span class="more-label"></span></button>
        <button class="more-item" type="button" value="clear"><span class="more-label">Reset</span></button>
        <button class="more-item" type="button" value="solo"><span class="more-label">Solo this filter</span></button>
        <button class="more-item" type="button" value="unsolo"><span class="more-label">Remove soloing</span></button>
        <button class="more-item" type="button" value="remove"><span class="more-label">Remove</span></button>
      </sherpa-menu>
    </sherpa-button>
  </template>
</template>
