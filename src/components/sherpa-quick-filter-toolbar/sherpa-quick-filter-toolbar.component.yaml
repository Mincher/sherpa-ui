# sherpa-quick-filter-toolbar — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-quick-filter-toolbar.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-quick-filter-toolbar
$description: a strip of quick-filter chips above a grid/list.
element:
  $type: element
  tag: div
  attributes:
    role: toolbar
    aria-label: Quick filters
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: div
      class: bar
      part: bar
      attrs:
        role: toolbar
        aria-label: Quick filters
      children:
        - el: div
          class: view-zone
          part: view-zone
          slot: view
        - el: div
          class: organise-zone
          part: organise
        - el: div
          class: chips
          part: chips
        - el: sherpa-quick-filter
          class: overflow-chip
          part: overflow-chip
          attrs:
            data-label: More
            data-icon-start: fa-solid fa-filter
            data-current: ""
            data-persistent: ""
            data-no-value: ""
            data-locked: ""
        - el: div
          class: actions-zone
          part: actions
          children:
            - slot: actions
            - el: sherpa-button
              class: act add-btn
              attrs:
                data-act: add
                data-size: sm
                data-icon-end: fa-solid fa-caret-down
                aria-haspopup: menu
                aria-expanded: "false"
            - el: sherpa-button
              class: act
              attrs:
                data-size: sm
                data-act: ai
                data-type: icon
                data-icon-start: fa-solid fa-wand-magic-sparkles
                aria-label: Filter with AI
            - el: sherpa-button
              class: act
              attrs:
                data-size: sm
                data-act: clear
                data-type: icon
                data-icon-start: fa-solid fa-arrow-rotate-left
                aria-label: Reset filters
            - el: sherpa-button
              class: act
              attrs:
                data-size: sm
                data-act: configure
                data-type: icon
                data-icon-start: fa-solid fa-sliders
                aria-label: Configure filters
            - el: span
              class: act-divider
              attrs:
                aria-hidden: "true"
            - el: span
              class: view-group sherpa-group
              children:
                - el: sherpa-button
                  class: act
                  attrs:
                    data-size: sm
                    data-act: favourite
                    data-type: icon
                    data-group: start
                    data-icon-start: fa-regular fa-star
                    aria-label: Favourite this view
                    aria-pressed: "false"
                - el: sherpa-button
                  class: act save-btn
                  attrs:
                    data-size: sm
                    data-act: save
                    data-group: mid
                    data-icon-start: fa-solid fa-upload
                - el: sherpa-button
                  class: act
                  attrs:
                    data-size: sm
                    data-act: view-menu
                    data-type: icon
                    data-group: end
                    data-icon-start: fa-solid fa-caret-down
                    aria-label: View options
                    aria-haspopup: menu
            - el: sherpa-button
              class: act
              attrs:
                data-size: sm
                data-act: refresh
                data-type: icon
                data-icon-start: fa-solid fa-arrows-rotate
                aria-label: Refresh data
            - el: sherpa-button
              class: act
              attrs:
                data-size: sm
                data-act: overflow
                data-type: icon
                data-icon-start: fa-solid fa-ellipsis-vertical
                aria-label: More actions
                aria-haspopup: menu
    - el: template
      class: qf-tpl
      children:
        - el: sherpa-quick-filter
          class: chip
props:
  - $type: prop
    name: data-favourite
    type: string
    kind: style
    description: the ★ is lit (view type)
  - $type: prop
    name: data-group-field
    type: string
    kind: content
    description: the field the Group chip points at (the standard name)
  - $type: prop
    name: data-no-actions
    type: string
    kind: style
    description: hide the built-in cluster entirely (host owns the trailing end)
  - $type: prop
    name: data-sort-direction
    type: enum
    kind: content
    values:
      - asc
      - desc
    description: asc  | desc
  - $type: prop
    name: data-sort-field
    type: string
    kind: content
    description: the field the Sort chip points at (the standard name)
  - $type: prop
    name: data-type
    type: enum
    kind: style
    values:
      - data
      - view
    description: data  | view   (view adds the ★/Save/▾ group)
states:
  - $type: state
    name: view
    selector: ":host([data-type=\"view\"])"
  - $type: state
    name: has-view
    selector: ":host([data-has-view])"
  - $type: state
    name: has-organise
    selector: ":host([data-has-organise])"
  - $type: state
    name: "1"
    selector: ":host([data-collapse=\"1\"])"
  - $type: state
    name: "2"
    selector: ":host([data-collapse=\"2\"])"
  - $type: state
    name: "3"
    selector: ":host([data-collapse=\"3\"])"
  - $type: state
    name: collapse
    selector: ":host([data-collapse])"
  - $type: state
    name: no-actions
    selector: ":host([data-no-actions])"
  - $type: state
    name: favourite
    selector: ":host([data-favourite])"
  - $type: state
    name: folded
    selector: ":host([data-folded])"
  - $type: state
    name: focus-visible
    selector: .qf-number-one:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: >-
      read/write JS properties (active, values, pickedValues, customFilters, groupField, sortField,
      sortDirection, sortSuspended). See $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: >-
      callable from a view definition's state block (setChipValues, available, addCustomFilter,
      clearAll, organise). See $extensions.sherpa.methods.
events:
  - $type: event
    name: quick-filter-change
    bubbles: true
    composed: true
    detail:
      active: unknown
      custom: unknown
      id: unknown
      picked: unknown
      scope: string
      source: string
      values: unknown
  - $type: event
    name: group-change
    bubbles: true
    composed: true
    detail:
      field: unknown
  - $type: event
    name: filter-add
    bubbles: true
    composed: true
    detail:
      filters: unknown
      ids: unknown
  - $type: event
    name: filter-clear
    bubbles: true
    composed: true
  - $type: event
    name: ai-filter-request
    bubbles: true
    composed: true
  - $type: event
    name: filter-configure
    bubbles: true
    composed: true
  - $type: event
    name: data-refresh
    bubbles: true
    composed: true
  - $type: event
    name: view-save
    bubbles: true
    composed: true
  - $type: event
    name: view-favorite
    bubbles: true
    composed: true
    detail:
      favourite: unknown
  - $type: event
    name: view-menu-open
    bubbles: true
    composed: true
  - $type: event
    name: filter-overflow
    bubbles: true
    composed: true
  - $type: event
    name: sort-change
    bubbles: true
    composed: true
    detail:
      direction: unknown
      field: unknown
  - $type: event
    name: filter-remove
    bubbles: true
    composed: true
    detail:
      filter: unknown
      id: unknown
tokens:
  bar.gap: "{sherpa.display-mode-space-xs}"
  bar.padding-block: "{sherpa.display-mode-space-2xs}"
  bar.padding-inline: "{sherpa.theme-padding-none}"
  act-divider.inline-size: "{sherpa.display-mode-border-width-base}"
  act-divider.block-size: "{sherpa.display-mode-size-sm}"
  act-divider.background: "{sherpa.theme-border-default-2}"
  chips.gap: "{sherpa.display-mode-space-xs}"
  actions-zone.gap: "{sherpa.display-mode-space-xs}"
$extensions:
  sherpa:
    figmaName: Filter Toolbar
    methods:
      - $type: method
        name: setChipValues
        args: "id: string, picks: readonly string[] | undefined"
        description: Set ONE chip's picks, leaving every other chip alone.
      - $type: method
        name: available
        args: "defs: QuickFilterDef[]"
        description: available([...]) — the filters the Add chip offers, over the populate() set.
      - $type: method
        name: addCustomFilter
        args: "spec: { id: string; label: string; value?: string | null }"
        description: Put a CUSTOM filter on the bar — one whose value is TYPED, not picked.
      - $type: method
        name: clearAll
        args: ""
        description: TRAP T-clear-all-resets-organise-too — organise chips included; three events afterwards.
      - $type: method
        name: organise
        args: "def: OrganiseDef"
        description: organise({ group, sort }). TRAP T-organise-chips-lead-the-bar — separate from populate().
    category: control
    variantAxes:
      - name: Type
        values:
          - data
          - view
    divergence:
      note: >-
        INTENTIONAL simplification. Figma "Filter Toolbar" (150:3688) is a fuller toolbar: it bakes
        in a leading view chip (Type=view) or a Switch (Type=data), divider-separated preset/filter
        chips, and a trailing ACTION CLUSTER (Add split menu, AI/brand filter, undo, refresh,
        favourite/star, Save-view split menu, overflow), plus view-scope events (view-menu-open /
        view-change / view-save / view-favorite / data-refresh / ai-filter-request). The shipped
        code is a deliberately SIMPLER 3-zone slot bar (view / chips / actions): the action cluster,
        dividers and save-view controls are DELEGATED to slotted content (the `actions` and `view`
        slots), not built in, and those extra Figma events are the host's responsibility, not fired
        here. Chips are stamped by populate(); the only event emitted is quick-filter-change. Do not
        expand to match Figma without a deliberate decision.
    jsProps:
      - name: active
        type: string
        access: read
      - name: values
        type: string
        access: read-write
      - name: pickedValues
        type: string
        access: read
      - name: customFilters
        type: string
        access: read
      - name: groupField
        type: string
        access: read
      - name: sortField
        type: string
        access: read
      - name: sortDirection
        type: string
        access: read
      - name: sortSuspended
        type: string
        access: read
