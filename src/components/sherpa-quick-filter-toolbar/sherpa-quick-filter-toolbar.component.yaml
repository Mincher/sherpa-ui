# sherpa-quick-filter-toolbar — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-quick-filter-toolbar.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-quick-filter-toolbar
$description: a strip of quick-filter chips above a grid/list.
element:
  $type: element
  tag: div
  attributes:
    role: toolbar
    aria-label: Quick filters
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: div
      class: bar
      part: bar
      attrs:
        role: toolbar
        aria-label: Quick filters
      children:
        - el: div
          class: view-zone
          part: view-zone
          slot: view
        - el: div
          class: organise-zone
          part: organise
        - el: div
          class: chips
          part: chips
        - el: sherpa-quick-filter
          class: overflow-chip
          part: overflow-chip
          attrs:
            data-label: More
            data-icon-start: filter
            data-persistent: ""
            data-no-value: ""
            data-locked: ""
        - el: div
          class: actions-zone
          part: actions
          children:
            - slot: actions
            - el: sherpa-button
              class: act add-btn
              attrs:
                data-act: add
                data-size: sm
                data-icon-end: triangle-down
                aria-haspopup: menu
            - el: sherpa-button
              class: act
              attrs:
                data-size: sm
                data-act: ai
                data-type: icon
                data-icon-start: wand-magic-sparkles
                aria-label: Filter with AI
            - el: sherpa-button
              class: act
              attrs:
                data-size: sm
                data-act: clear
                data-type: icon
                data-icon-start: arrow-rotate-left
                aria-label: Reset filters
            - el: sherpa-button
              class: act
              attrs:
                data-size: sm
                data-act: configure
                data-type: icon
                data-icon-start: sidebar
                aria-label: Filter in a panel instead
            - el: span
              class: act-divider
              attrs:
                aria-hidden: "true"
            - el: span
              class: view-group sherpa-group
              children:
                - el: sherpa-button
                  class: act
                  attrs:
                    data-size: sm
                    data-act: favourite
                    data-type: icon
                    data-group: start
                    data-icon-start: star
                    aria-label: Favourite this view
                    aria-pressed: "false"
                - el: sherpa-button
                  class: act
                  attrs:
                    data-size: sm
                    data-act: save
                    data-group: mid
                    data-icon-start: upload
                - el: sherpa-button
                  class: act
                  attrs:
                    data-size: sm
                    data-act: view-menu
                    data-type: icon
                    data-group: end
                    data-icon-start: triangle-down
                    aria-label: View options
                    aria-haspopup: menu
            - el: sherpa-button
              class: act
              attrs:
                data-size: sm
                data-act: refresh
                data-type: icon
                data-icon-start: cw-circle-arrow
                aria-label: Refresh data
            - el: sherpa-button
              class: act
              attrs:
                data-size: sm
                data-act: overflow
                data-type: icon
                data-icon-start: ellipses-vertical
                aria-label: More actions
                aria-haspopup: menu
    - el: template
      class: qf-tpl
      children:
        - el: sherpa-quick-filter
          class: chip
props:
  - $type: prop
    name: data-favourite
    type: string
    observed: true
    kind: style
    description: the ★ is lit (view type) — the value, IN
  - $type: prop
    name: data-group-field
    type: string
    observed: true
    kind: style
    description: the field the Group chip points at (the standard name)
  - $type: prop
    name: data-locked
    type: string
    observed: false
    kind: style
    description: the host owns the ★; report the click, never self-set
  - $type: prop
    name: data-no-actions
    type: string
    observed: false
    kind: style
    description: hide the built-in cluster entirely (host owns the trailing end)
  - $type: prop
    name: data-panel-mode
    type: string
    observed: false
    kind: style
    description: >-
      a filter PANEL is answering for this bar: AI, Reset, the panel toggle and Add filter are
      hidden, and a `data` bar goes entirely. TRAP T-panel-mode-hides-what-the-panel-answers
  - $type: prop
    name: data-saveable
    type: string
    observed: true
    kind: style
    description: >-
      the host SAVES filters: a chip holding a Custom Condition, and the Add menu once any field is
      on, offer "Save filter", which fires filter-save. The host stores it and calls packFilter().
      TRAP T-save-packs-the-fields-into-one-chip
  - $type: prop
    name: data-sort-direction
    type: enum
    observed: true
    kind: style
    values:
      - asc
      - desc
    description: asc  | desc
  - $type: prop
    name: data-sort-field
    type: string
    observed: true
    kind: style
    description: the field the Sort chip points at (the standard name)
  - $type: prop
    name: data-type
    type: enum
    observed: false
    kind: style
    values:
      - data
      - view
    description: data  | view   (view adds the ★/Save/▾ group)
states:
  - $type: state
    name: view
    selector: ":host([data-type=\"view\"])"
  - $type: state
    name: has-view
    selector: ":host([data-has-view])"
  - $type: state
    name: has-organise
    selector: ":host([data-has-organise])"
  - $type: state
    name: "1"
    selector: ":host([data-collapse=\"1\"])"
  - $type: state
    name: "2"
    selector: ":host([data-collapse=\"2\"])"
  - $type: state
    name: "3"
    selector: ":host([data-collapse=\"3\"])"
  - $type: state
    name: collapse
    selector: ":host([data-collapse])"
  - $type: state
    name: no-actions
    selector: ":host([data-no-actions])"
  - $type: state
    name: folded
    selector: ":host([data-folded])"
  - $type: state
    name: panel-mode
    selector: ":host([data-panel-mode])"
capabilities:
  - $type: capability
    api: js-property-mirror
    description: >-
      read/write JS properties (active, values, superseded, pickedValues, clauses, readings, states,
      savedReadings, externalFilters, offering, heldIds, held, groupField, sortField, sortDirection,
      sortSuspended). See $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: >-
      callable from a view definition's state block (setChipValues, setChipReading, supersede,
      unpackFilter, deleteFilter, packFilter, setClause, report, available, addFilters,
      removeFilter, allowFields, addExternalFilter, addCustomFilter, clearAll, organise). See
      $extensions.sherpa.methods.
events:
  - $type: event
    name: quick-filter-change
    bubbles: true
    composed: true
    detail:
      active: unknown
      clauses: unknown
      external: unknown
      id: unknown
      picked: unknown
      scope: string
      source: string
      values: unknown
  - $type: event
    name: group-change
    bubbles: true
    composed: true
    detail:
      field: unknown
  - $type: event
    name: sort-change
    bubbles: true
    composed: true
    detail:
      direction: unknown
      field: unknown
  - $type: event
    name: filter-remove
    bubbles: true
    composed: true
    detail:
      filter: unknown
      id: unknown
  - $type: event
    name: filter-save
    bubbles: true
    composed: true
    detail:
      readings: unknown
  - $type: event
    name: filter-delete
    bubbles: true
    composed: true
    detail:
      id: unknown
  - $type: event
    name: filter-add
    bubbles: true
    composed: true
    detail:
      filters: unknown
      ids: unknown
  - $type: event
    name: filter-clear
    bubbles: true
    composed: true
  - $type: event
    name: ai-filter-request
    bubbles: true
    composed: true
  - $type: event
    name: filter-configure
    bubbles: true
    composed: true
  - $type: event
    name: data-refresh
    bubbles: true
    composed: true
  - $type: event
    name: view-save
    bubbles: true
    composed: true
  - $type: event
    name: view-favorite
    bubbles: true
    composed: true
    detail:
      favourite: unknown
  - $type: event
    name: view-menu-open
    bubbles: true
    composed: true
  - $type: event
    name: filter-overflow
    bubbles: true
    composed: true
tokens:
  bar.gap: "{sherpa.display-mode-space-xs}"
  bar.padding-block: "{sherpa.display-mode-space-2xs}"
  bar.padding-inline: "{sherpa.theme-padding-none}"
  act-divider.inline-size: "{sherpa.display-mode-border-width-base}"
  act-divider.block-size: "{sherpa.display-mode-size-sm}"
  act-divider.background: "{sherpa.theme-border-default-2}"
  chips.gap: "{sherpa.display-mode-space-xs}"
  actions-zone.gap: "{sherpa.display-mode-space-xs}"
$extensions:
  sherpa:
    figmaName: Filter Toolbar
    methods:
      - $type: method
        name: setChipValues
        args: "id: string, picks: readonly string[] | undefined"
        description: Set ONE chip's picks, leaving every other chip alone.
      - $type: method
        name: setChipReading
        args: "id: string, reading: FieldReading"
        description: setChipReading(id, reading) — steer ONE chip with a whole reading.
      - $type: method
        name: supersede
        args: "ids: readonly string[], appliedAt?: string"
        description: supersede([...ids]) — the VIEW now owns these fields.
      - $type: method
        name: unpackFilter
        args: "id: string"
        description: Put a saved filter's answer back into its fields — UNPACK. A field not on
      - $type: method
        name: deleteFilter
        args: "id: string"
        description: "Delete a saved filter: gone from the bar AND the Add list, and"
      - $type: method
        name: packFilter
        args: "saved: SavedFilter & { id: string }"
        description: Show a SAVED filter in place of the fields it was made from — PACK. Its chip
      - $type: method
        name: setClause
        args: "id: string, clause: readonly [string, FilterOp, unknown] | null"
        description: setClause(id, clause) — set ONE condition chip from a ready FilterClause.
      - $type: method
        name: report
        args: ""
        description: report() — re-announce the WHOLE bar, as a reader's own change would.
      - $type: method
        name: available
        args: "defs: QuickFilterDef[]"
        description: available([...]) — the filters the Add chip offers, over the populate() set.
      - $type: method
        name: addFilters
        args: "ids: readonly string[]"
        description: addFilters([...ids]) — put offered filters on this bar, as the Add button
      - $type: method
        name: removeFilter
        args: "id: string"
        description: removeFilter(id) — take one filter off this bar, as its menu's Remove
      - $type: method
        name: allowFields
        args: "list: AllowList"
        description: allowFields([...]) — the ONLY fields this bar may offer, or `null` for all.
      - $type: method
        name: addExternalFilter
        args: "spec: ExternalFilterSpec"
        description: "Put an EXTERNAL filter on the bar: one the host applies somewhere else."
      - $type: method
        name: addCustomFilter
        args: "spec: ExternalFilterSpec"
        description: The old name of `addExternalFilter()`, still a door.
      - $type: method
        name: clearAll
        args: ""
        description: TRAP T-clear-all-resets-organise-too — organise chips included; three events afterwards.
      - $type: method
        name: organise
        args: "def: OrganiseDef"
        description: organise({ group, sort }) — how ONE component arranges the rows it draws.
    category: control
    variantAxes:
      - name: Type
        values:
          - data
          - view
    divergence:
      note: >-
        INTENTIONAL simplification. Figma "Filter Toolbar" (150:3688) is a fuller toolbar: it bakes
        in a leading view chip (Type=view) or a Switch (Type=data), divider-separated preset/filter
        chips, and a trailing ACTION CLUSTER (Add split menu, AI/brand filter, undo, refresh,
        favourite/star, Save-view split menu, overflow), plus view-scope events (view-menu-open /
        view-change / view-save / view-favorite / data-refresh / ai-filter-request). The shipped
        code is a deliberately SIMPLER 3-zone slot bar (view / chips / actions): the action cluster,
        dividers and save-view controls are DELEGATED to slotted content (the `actions` and `view`
        slots), not built in, and those extra Figma events are the host's responsibility, not fired
        here. Chips are stamped by populate(); the only event emitted is quick-filter-change. Do not
        expand to match Figma without a deliberate decision.
    jsProps:
      - name: active
        type: string
        access: read
      - name: values
        type: string
        access: read-write
      - name: superseded
        type: string
        access: read
      - name: pickedValues
        type: string
        access: read
      - name: clauses
        type: string
        access: read
      - name: readings
        type: string
        access: read
      - name: states
        type: string
        access: read
      - name: savedReadings
        type: string
        access: read
      - name: externalFilters
        type: string
        access: read
      - name: offering
        type: string
        access: read
      - name: heldIds
        type: string
        access: read
      - name: held
        type: string
        access: read
      - name: groupField
        type: string
        access: read
      - name: sortField
        type: string
        access: read
      - name: sortDirection
        type: string
        access: read
      - name: sortSuspended
        type: string
        access: read
