# sherpa-quick-filter-toolbar — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-quick-filter-toolbar.{thin.yaml,html,css,ts}. The MECHANICAL surface only —
# props (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# Validated by schemas/component.v1.json; round-trips via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-quick-filter-toolbar
$description: a strip of quick-filter chips above a grid/list.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  root:
    el: div
    class: bar
    part: bar
    children:
      - el: div
        class: view-zone
        part: view-zone
        slot: view
      - el: div
        class: chips
        part: chips
      - el: div
        class: actions-zone
        part: actions
        slot: actions
props:
  - $type: prop
    name: data-type
    type: enum
    kind: style
    values:
      - data
      - view
    description: data  | view   (view = the App-Header view-scope treatment)
states:
  - $type: state
    name: has-view
    selector: ":host([data-has-view])"
  - $type: state
    name: has-actions
    selector: ":host([data-has-actions])"
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (active). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: quick-filter-change
    bubbles: true
    composed: true
tokens:
  bar.gap: "{sherpa.display-space-sm}"
  bar.padding: "{sherpa.display-space-xs}"
  chips.gap: "{sherpa.theme-gap-sm}"
$extensions:
  sherpa:
    figmaName: Filter Toolbar
    category: control
    variantAxes:
      - name: Type
        values:
          - data
          - view
    jsProps:
      - name: active
        type: string
        access: read
