<!--
  sherpa-dialog — a modal built on the native <dialog> element.

  data-open (boolean) drives it: the JS calls showModal() / close() in onChange.
  Native <dialog> gives the focus trap, ::backdrop, and Escape-to-close for free.
  A close button and a backdrop click also close it.

  Public API:
    data-open        — reflected boolean; present = modal shown
    data-label       — dialog title text (or use the `title` slot)
    data-size        — sm | md (default) | lg | full
    data-dismissible — "false" hides the close button (default: shown)

  Slots:
    (default) — the dialog body
    title     — custom title content (overrides data-label)
    footer    — footer actions (reflects data-has-footer)

  Fires: dialog-open — detail: {}
         dialog-close — detail: {}
-->
<template id="default">
  <dialog class="dialog" part="dialog">
    <header class="header" part="header">
      <div class="titles">
        <h2 class="title-text" part="title"></h2>
        <slot name="title"></slot>
      </div>
      <button class="close" part="close" type="button" aria-label="Close">
        <span class="close-glyph" aria-hidden="true"></span>
      </button>
    </header>

    <div class="body" part="body">
      <slot></slot>
    </div>

    <footer class="footer" part="footer">
      <slot name="footer"></slot>
    </footer>
  </dialog>
</template>
