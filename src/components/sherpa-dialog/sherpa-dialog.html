<!--
  sherpa-dialog — a modal surface on the native <dialog>: modality, ::backdrop,
  focus trap, ESC and top-layer come from showModal().

  Public API:
    data-heading  — convenience header label (a slotted [slot=header] overrides it)
    data-type     — modal (default) | overlay — overlay fills its container and
                    opens NON-modal, so the page beside it stays live
    open          — native boolean (read reflects dialog.open; set → show()/close())
    data-status   — status colour cascade (critical | warning | success | info | urgent)

  Slots:
    header    — header region (reflects data-has-header). data-heading renders a
                PLAIN label; for the Figma dialog header (icon + title + description +
                close), COMPOSE a <sherpa-container-header> into this slot — the dialog
                intentionally does not build that chrome itself.
    (default) — the dialog body
    footer    — footer region (reflects data-has-footer)

  Fires: dialog-close (detail: { })
-->
<template id="default">
  <dialog class="root sherpa-border-edges sherpa-border-corners" part="root" tabindex="-1">
    <div class="header" part="header">
      <span class="heading-text"></span>
      <slot name="header"></slot>
    </div>
    <div class="body" part="body">
      <slot></slot>
    </div>
    <div class="footer" part="footer">
      <slot name="footer"></slot>
    </div>
  </dialog>
</template>
