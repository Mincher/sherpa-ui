# sherpa-dialog — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-dialog.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-dialog
$description: a modal surface built on the native <dialog> element.
element:
  $type: element
  tag: dialog
  provides:
    - modal
    - focus-trap
    - escape-close
    - backdrop
  stateCss:
    open: "[open]"
templates:
  - default
anatomy:
  root:
    el: dialog
    class: root
    part: root
    children:
      - el: div
        class: header
        part: header
        children:
          - el: span
            class: heading-text
          - slot: header
      - el: div
        class: body
        part: body
        slot: ""
      - el: div
        class: footer
        part: footer
        slot: footer
props:
  - $type: prop
    name: data-heading
    type: string
    kind: content
    description: — convenience header label (a slotted [slot=header] overrides it)
  - $type: prop
    name: data-status
    type: string
    kind: style
    description: — status colour cascade (critical | warning | success | info | urgent)
  - $type: prop
    name: open
    type: string
    description: — native boolean (read reflects dialog.open; set → showModal()/close())
states:
  - $type: state
    name: has-header
    selector: ":host([data-has-header])"
  - $type: state
    name: heading
    selector: ":host([data-heading])"
  - $type: state
    name: has-footer
    selector: ":host([data-has-footer])"
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (open). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: close
    bubbles: true
    composed: true
tokens:
  root.border-width: "{sherpa.style-border-width}"
  root.border-radius: "{sherpa.structure-rounding-top-left}"
  root.color: "{sherpa.style-content-base}"
  root.box-shadow: "{sherpa.theme-elevation-offset-x-large}"
  heading-text.color: "{sherpa.theme-content-body-base}"
  heading-text.font-size: "{sherpa.font-size-body-base}"
  heading-text.font-weight: "{sherpa.font-weight-medium}"
  heading-text.line-height: "{sherpa.theme-content-line-height-base}"
$extensions:
  sherpa:
    figmaName: Dialog
    category: container
    divergence:
      note: >-
        2026-09-07 (D2/D12): split out of the former Container Type=dialog variant into a standalone
        component on native <dialog> (showModal → modality, ::backdrop, focus-trap, ESC free). Maps
        to the Figma "Dialog" component (Container set already split).
    jsProps:
      - name: open
        type: boolean
        description: whether the dialog is open (delegates to <dialog>)
        access: read-write
