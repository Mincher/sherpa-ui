# sherpa-code-block — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-code-block.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-code-block
$description: a monospace code display with a copy button.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: div
      class: header
      part: header
      children:
        - el: span
          class: language
          part: language
        - el: button
          class: copy
          part: copy
          attrs:
            type: button
            aria-label: Copy code
          children:
            - el: span
              class: copy-label
            - el: span
              class: copied-label
    - el: pre
      class: pre
      part: pre
      children:
        - el: code
          class: code
          part: code
          children:
            - el: span
              class: gutter
              part: gutter
              attrs:
                aria-hidden: "true"
            - el: span
              class: code-text
              part: code-text
              slot: ""
props:
  - $type: prop
    name: data-code
    type: string
    kind: content
    description: the code to show (also settable via the default slot)
  - $type: prop
    name: data-language
    type: string
    kind: content
    description: a short language label shown in the header (e.g. "bash")
  - $type: prop
    name: data-line-numbers
    type: string
    kind: content
    description: >-
      boolean — render a line-number gutter beside the code. Numbers derive from the code's line
      count; CSS-gated.
states:
  - $type: state
    name: copied
    selector: ":host([data-copied])"
  - $type: state
    name: line-numbers
    selector: ":host([data-line-numbers])"
  - $type: state
    name: focus-visible
    selector: .copy:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (code). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: code-copy
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .copy
tokens:
  header.gap: "{sherpa.display-space-sm}"
  header.min-block-size: "{sherpa.display-size-xl}"
  header.padding: "{sherpa.display-space-2xs}"
  header.background: "{sherpa.style-surface-base}"
  header.border-block-end: "{sherpa.style-border-width}"
  language.font-family: "{sherpa.font-family-mono}"
  language.font-size: "{sherpa.font-size-body-base}"
  language.font-weight: "{sherpa.font-weight-regular}"
  language.letter-spacing: "{sherpa.theme-content-letter-spacing-base}"
  language.color: "{sherpa.theme-content-body-1}"
  copy.gap: "{sherpa.structure-space-gap}"
  copy.padding: "{sherpa.structure-space-padding}"
  copy.border-width: "{sherpa.style-border-width}"
  copy.border-color: "{sherpa.theme-border-default-2}"
  copy.border-radius: "{sherpa.display-border-rounding-sm}"
  copy.background: "{sherpa.theme-surface-default-base}"
  copy.color: "{sherpa.style-content-base}"
  copy.font-size: "{sherpa.font-size-body-small}"
  copied-label.color: "{sherpa.theme-surface-success-3}"
  pre.padding: "{sherpa.display-space-sm}"
  pre.background: "{sherpa.theme-surface-default-1}"
  code.font-family: "{sherpa.font-family-mono}"
  code.font-size: "{sherpa.font-size-body-base}"
  code.color: "{sherpa.style-content-base}"
  gutter.padding-inline-end: "{sherpa.display-space-sm}"
  gutter.color: "{sherpa.theme-content-body-3}"
$extensions:
  sherpa:
    figmaName: Code Block
    category: container
    booleanProps:
      - hasHeader
      - hasLineNumbers
    jsProps:
      - name: code
        type: string
        access: read
