$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-nav-section
$description: a labelled group of nav items in a settings-style panel.
element:
  $type: element
  tag: nav
  attributes:
    aria-label: Section navigation
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: nav
      class: panel
      part: panel
      attrs:
        aria-label: Section navigation
      children:
        - el: h2
          class: heading
          part: heading
        - el: div
          class: groups
          part: groups
    - el: template
      class: group-tpl
      children:
        - el: section
          class: group
          children:
            - el: h3
              class: group-label
              part: group-label
            - el: ul
              class: group-list
              attrs:
                role: list
props:
  - $type: prop
    name: data-active-id
    type: string
    kind: content
    description: id of the currently active item
  - $type: prop
    name: data-heading
    type: string
    kind: content
    description: optional panel heading text
states:
  - $type: state
    name: not-heading
    selector: ":host(:not([data-heading]))"
  - $type: state
    name: focus-visible
    selector: .item:focus-visible
events:
  - $type: event
    name: nav-section-select
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .groups
