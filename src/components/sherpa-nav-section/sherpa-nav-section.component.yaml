$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-nav-section
$description: a labelled group of nav items in a settings-style panel.
element:
  $type: element
  tag: span
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: span
      class: label
      part: label
    - el: span
      class: rule
      part: rule
      attrs:
        aria-hidden: "true"
props:
  - $type: prop
    name: data-collapsed
    type: string
    kind: style
    description: present on a collapsed rail — hides the label, keeps the rule
  - $type: prop
    name: data-label
    type: string
    kind: style
    description: the section label text (rendered verbatim — author its case)
states:
  - $type: state
    name: collapsed
    selector: ":host([data-collapsed])"
tokens:
  label.color: "{sherpa.theme-content-body-1}"
  label.font-size: "{sherpa.font-size-body-xs}"
  label.font-weight: "{sherpa.font-weight-regular}"
  label.line-height: "{sherpa.theme-content-line-height-xs}"
  rule.border-block-start: "{sherpa.border-top}"
$extensions:
  sherpa:
    figmaName: Navigation Section/default
    category: nav
    booleanProps:
      - isMaximised
