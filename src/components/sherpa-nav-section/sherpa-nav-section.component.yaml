  group-label.font-weight: "{sherpa.font-weight-semibold}"
  group-list.gap: "{sherpa.display-space-2xs}"
  item.gap: "{sherpa.display-space-xs}"
  item.padding: "{sherpa.display-space-xs}"
  item.color: "{sherpa.theme-content-body-2}"
