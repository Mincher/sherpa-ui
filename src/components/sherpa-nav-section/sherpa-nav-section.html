<!--
  sherpa-nav-section — a section label + rule that groups items in a nav rail.

  Public API:
    data-label      the section label text (rendered verbatim — author its case)
    data-collapsed  present on a collapsed rail — hides the label, keeps the rule

  Fires: (none)
-->
<template id="default">
  <span class="label" part="label"></span>
  <span class="rule" part="rule" aria-hidden="true"></span>
</template>
