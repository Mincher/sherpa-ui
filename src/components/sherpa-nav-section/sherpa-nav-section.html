<!--
  sherpa-nav-section — a section-label divider for a navigation rail.

  A tiny row: a short SECTION label followed by a horizontal rule that fills the
  remaining width. Used to group items inside a nav. On a collapsed rail the
  label is hidden (data-collapsed) so only the rule remains.

  Public API:
    data-label      the section label text (rendered verbatim — author its case)
    data-collapsed  present on a collapsed rail — hides the label, keeps the rule

  Fires: (none)
-->
<template id="default">
  <span class="label" part="label"></span>
  <span class="rule" part="rule" aria-hidden="true"></span>
</template>
