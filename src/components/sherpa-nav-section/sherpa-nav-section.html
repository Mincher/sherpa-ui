<!--
  sherpa-nav-section — a labelled group of nav items for a settings-style panel.

  Populate with populate([{ label, items: [{ id, label, icon? }] }]). Groups and
  items are stamped from cloning prototypes (<template class="…">, no id — the
  base parser ignores them). The active item is marked by data-active-id on the
  host. Clicking an item fires nav-section-select with the item's id.

  Public API:
    data-heading    optional panel heading text
    data-active-id  id of the currently active item

  Fires: nav-section-select — detail: { id }
-->
<template id="default">
  <nav class="panel" part="panel" aria-label="Section navigation">
    <h2 class="heading" part="heading"></h2>
    <div class="groups" part="groups"></div>
  </nav>

  <template class="group-tpl">
    <section class="group">
      <h3 class="group-label" part="group-label"></h3>
      <ul class="group-list" role="list"></ul>
    </section>
  </template>

  <template class="item-tpl">
    <li class="item-row" role="listitem">
      <button class="item" type="button" part="item">
        <span class="item-icon" aria-hidden="true"></span>
        <span class="item-label"></span>
      </button>
    </li>
  </template>
</template>
