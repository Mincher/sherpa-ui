# sherpa-toolbar — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-toolbar.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-toolbar
$description: a horizontal control strip.
element:
  $type: element
  tag: div
  attributes:
    role: toolbar
  provides: []
templates:
  - default
anatomy:
  root:
    el: div
    class: bar
    part: bar
    attrs:
      role: toolbar
    children:
      - el: div
        class: zone leading
        part: leading
        slot: leading
      - el: div
        class: zone trailing
        part: trailing
        slot: trailing
props:
  - $type: prop
    name: data-density
    type: enum
    kind: style
    values:
      - comfortable
      - compact
    description: comfortable  | compact (tighter block padding)
  - $type: prop
    name: data-type
    type: enum
    kind: style
    values:
      - plain
      - bordered
    description: plain  | bordered (adds a bottom rule)
states:
  - $type: state
    name: compact
    selector: ":host([data-density=\"compact\"])"
  - $type: state
    name: bordered
    selector: ":host([data-type=\"bordered\"])"
  - $type: state
    name: not-has-leading
    selector: ":host(:not([data-has-leading]))"
  - $type: state
    name: not-has-trailing
    selector: ":host(:not([data-has-trailing]))"
$extensions:
  sherpa:
    figmaName: Toolbar
    category: control
