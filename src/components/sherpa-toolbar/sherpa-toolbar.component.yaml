# sherpa-toolbar — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-toolbar.{thin.yaml,html,css,ts}. The MECHANICAL surface only —
# props (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# Validated by schemas/component.v1.json; round-trips via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-toolbar
$description: a horizontal control strip.
element:
  $type: element
  tag: div
  attributes:
    role: toolbar
  provides: []
templates:
  - default
anatomy:
  root:
    el: div
    class: bar
    part: bar
    attrs:
      role: toolbar
    children:
      - el: div
        class: zone start
        part: start
        slot: start
      - el: div
        class: zone center
        part: center
        slot: center
      - el: div
        class: zone end
        part: end
        slot: end
props:
  - $type: prop
    name: data-density
    type: enum
    kind: style
    values:
      - comfortable
      - compact
    description: comfortable  | compact (tighter block padding)
  - $type: prop
    name: data-variant
    type: enum
    kind: style
    values:
      - plain
      - bordered
    description: plain  | bordered (adds a bottom rule)
states:
  - $type: state
    name: compact
    selector: ":host([data-density=\"compact\"])"
  - $type: state
    name: bordered
    selector: ":host([data-variant=\"bordered\"])"
  - $type: state
    name: not-has-start
    selector: ":host(:not([data-has-start]))"
  - $type: state
    name: not-has-center
    selector: ":host(:not([data-has-center]))"
  - $type: state
    name: not-has-end
    selector: ":host(:not([data-has-end]))"
events:
  - $type: event
    name: nothing
    bubbles: true
    composed: true
tokens:
  bar.padding-inline: "{sherpa.theme-padding-lg}"
$extensions:
  sherpa:
    figmaName: Toolbar
    category: control
