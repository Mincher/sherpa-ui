<!--
  sherpa-toolbar — a horizontal control strip.

  Two zones: leading (grows to fill) and trailing (hugs). Each zone is a named
  slot; the base class reflects data-has-{slot} on the host so empty zones
  collapse (pure CSS). No data logic.

  Public API:
    data-variant   plain (default) | bordered (adds a bottom rule)
    data-density   comfortable (default) | compact (tighter block padding)

  Slots:
    leading   — leading zone (title, primary CTA, search — grows to fill)
    trailing  — trailing zone (icon buttons, overflow menu — hugs)

  Fires: nothing — it's a layout surface; consumers wire their own controls.
-->
<template id="default">
  <div class="bar" part="bar" role="toolbar">
    <div class="zone leading" part="leading"><slot name="leading"></slot></div>
    <div class="zone trailing" part="trailing"><slot name="trailing"></slot></div>
  </div>
</template>
