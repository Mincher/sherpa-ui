<!--
  sherpa-toolbar — a horizontal control strip.

  Two zones, per the Figma Toolbar page: leading HUGS and holds the primary
  action; trailing GROWS with its content pushed to the end (an item count, a
  search field). Each zone is a named slot; the base class reflects
  data-has-{slot} on the host so empty zones collapse (pure CSS). No data logic.

  Public API:
    data-type   plain (default) | bordered (adds a bottom rule)
    data-density   comfortable (default) | compact (tighter block padding)

  Slots:
    leading   — the primary action / actions cluster (hugs, sits at the start)
    trailing  — item count, search, overflow (grows; content pushed to the end)

  Fires: nothing — it's a layout surface; consumers wire their own controls.
-->
<template id="default">
  <div class="bar" part="bar" role="toolbar">
    <div class="zone leading" part="leading"><slot name="leading"></slot></div>
    <div class="zone trailing" part="trailing"><slot name="trailing"></slot></div>
  </div>
</template>
