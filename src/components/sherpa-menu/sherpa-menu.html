<!--
  sherpa-menu — a floating list of choices or actions. Figma "Menu" SET
  (1156:29240), Type axis List | Calendar.

  The card IS a `popover`, so the browser owns the top layer — but MANUAL, not
  auto: the rows are SLOTTED, so for light-dismiss the browser reads the DOM
  tree, where they are children of this element and OUTSIDE the card. Ticking a
  row dismissed the menu with nothing chosen. The menu owns Escape and
  outside-click itself, off the composed path.
  TRAP T-a-slotted-row-is-outside-its-own-popover

  Placement is NOT native: CSS anchor positioning cannot cross a shadow root, so
  `position-anchor` found nothing and every menu rendered at the viewport corner.
  show(trigger) measures the trigger and writes viewport coordinates instead.

  Rows are slotted, and stay real form controls:

    values  — <label><input type="checkbox|radio" value="…" /> Label</label>
    actions — <button type="button" value="…">Label</button>

  Public API:
    data-commit     show the Apply / Cancel footer and DEFER changes until Apply
    data-readonly   SHOW an answer held elsewhere — rows and conditions inert, no
                    footer, no Add condition, no Advanced button
    data-heading  optional heading (rendered upper-case at 10/16)
    data-search   show a search input under the heading that filters the rows
    data-removable  show a "Remove" button in the footer (after Today);
                    it emits menu-select with value="remove"
    data-no-select-all  a multi-select list with no Select all row — the Filters
                    menu, where adding every filter at once is never the answer.
                    Read when the items stamp.
    data-saveable   show a "Save filter" button in the footer; it emits
                    menu-select with value="save".
                    TRAP T-save-packs-the-fields-into-one-chip
    data-drill      the list has been replaced by a SUB-LIST — shows a back arrow
                    and a breadcrumb in the header. Drilling IN PLACE rather than
                    opening a second card means one box to position, nothing to
                    close on a pointer crossing a gap, and no way for two cards to
                    disagree about what is ticked.
    data-drill-from  names the list that was replaced — the breadcrumb's text
    data-clearable  show a Clear button in the footer that empties the selection
                    (a CALENDAR menu shows Today there instead — see the footer)
    data-type     list (default) | calendar | filter — the Menu set's `Type` axis.
                  `filter` is the FILTER MENU: a condition dropdown above the
                  search, and the text box its typing conditions use. One field
                  gets one menu whether a chip or a column heading opens it.
                  TRAP T-one-field-one-filter-menu
                  TRAP T-an-operator-decides-pick-or-type
                  `calendar` widens the card and lays the LIST region out
                  horizontally, so a day grid and a time picker sit side by
                  side. Everything else is the same menu.
    data-inline     draw in the FLOW rather than the top layer — the same menu,
                  always open, for a filter PANEL. The popover attribute is
                  dropped, so Escape and outside-click no longer apply, and
                  show()/hide() become no-ops.
                  TRAP T-an-inline-menu-is-the-same-menu
    data-advanced FILTER type only: this field offers Advanced conditions,
                  so the mode button shows. OPT-IN: most fields are answered by
                  ticking values, and a `Contains` box over a closed set of three
                  is noise. TRAP T-conditions-are-opt-in-per-field
    data-advanced-only  FILTER type only: Advanced conditions and NOTHING
                  else. Implies data-advanced, opens in advanced mode and cannot
                  leave it, and hides the switch — there is no list behind it.
                  For a field whose values are a wall nobody ticks: 240 emails.
                  TRAP T-a-filter-answers-by-values-conditions-or-both
    data-mode     FILTER type only: simple | advanced (Will's words). `simple`
                  is a ticked list with a search; `advanced` is the And/Or
                  condition rows. An Advanced button in the header moves between
                  them. The old values default | custom | select | condition are
                  read, and rewritten to the new ones.
                  TRAP T-a-filter-menu-has-two-modes
    data-custom   the old name of data-advanced, still read.
                  TRAP T-a-renamed-attribute-keeps-its-old-name
    data-custom-only  the old name of data-advanced-only, still read.
    data-conditional  the name before that, still read.
    data-conditions-only  the name before that, still read.
    data-op       FILTER type only: which condition is picked. Defaults to `eq`.
                  The FIRST row's op — a menu in condition mode holds many.
    data-conditions  FILTER type only: a comma-separated op list ('eq,ne,contains')
                  in place of the default text set.
    data-has-value  written BY the menu: the typed value is not empty, so the
                  input's Clear button shows.
    data-value    FILTER type only: what was TYPED under a typing condition.
                  An ATTRIBUTE because a variant re-stamp replaces the whole
                  shadow tree, and a value living only in the box is lost.
    data-takes    written BY the menu from data-op: list | text. CSS reads it to
                  reveal the rows or the text box.
    data-select   multiple (default, checkbox rows) | single (radio rows)
    data-align    start (default) | end   which trigger edge the card lines up with
    open          native-ish boolean: reflects/controls the popover

  Slots:
    header    — controls ABOVE the heading (a calendar's month stepper). Slotted
                content lands in the MENU's light DOM, so this component styles
                it — see the `::slotted(.cal-header)` block in sherpa-menu.css.
    (default) — the rows (labels with inputs, or buttons)

  Fires:
    menu-change — the selection was COMMITTED. detail: { values: string[] }
                  Without data-commit that is every row tick; with it, only Apply.
    change — the number body's field or slider changed. NOT composed, as a
                  row's native change is not.
    menu-apply  — Apply was clicked. detail: { values: string[] }
    menu-cancel — Cancel was clicked; the values are already restored. detail: {}
    menu-clear  — Clear was clicked; the selection is already empty. detail: {}
    menu-select — an action row was clicked. detail: { value, label }
    menu-drill — a row's child-menu caret. detail: { value }
    menu-open — detail: {}
    menu-close — detail: {}
    condition-change — the condition or its typed value changed.
                  detail: { op, value, conditions }
                  `conditions` is EVERY row, in order. TRAP T-many-conditions-are-one-reading
    filter-mode-change — the mode button was pressed. detail: { mode } — simple | advanced
-->
<template id="default">
  <div class="menu sherpa-border-edges sherpa-border-corners" part="menu" popover="manual" role="dialog">
    <!-- HEADER — CSS-gated on the slot-presence flag, so an unslotted menu is unchanged. -->
    <div class="header" part="header">
      <!-- Shown only in a DRILLED menu. The trail IS sherpa-breadcrumbs, never re-drawn here. -->
      <span class="drill-trail" part="drill-trail">
        <sherpa-button class="drill-back" part="drill-back" data-type="icon" data-size="xs"
                       data-look="transparent" data-icon-start="arrow-left"
                       aria-label="Back"></sherpa-button>
        <sherpa-breadcrumbs class="drill-crumbs" part="drill-crumbs"></sherpa-breadcrumbs>
      </span>
      <p class="heading" part="heading"></p>
      <slot name="header"></slot>
      <!--
        SEARCH — sherpa-input-text composed, so it owns box, ring and focus; there
        is nothing here to restyle. It filters the rows the menu already has, so a
        row hidden by a search keeps its ticked state and comes back with it.
      -->
      <sherpa-input-text class="search" part="search"
                         data-icon-start="magnifying-glass" data-clearable
                         placeholder="Search" autocomplete="off"
                         aria-label="Search this menu"></sherpa-input-text>
    </div>

    <!-- Without this the card collapses to an empty box and reads as broken. -->
    <p class="no-matches" part="no-matches" role="status">No matches</p>

    <!-- THE BODIES A MENU CAN HAVE; `data-body` picks one. They live HERE
         because a body handed over as a slotted child is styled by whoever
         handed it over — which is how one Range switch came to be spelled
         `qf-range-*` in the toolbar and `head-filter-range-*` in the grid,
         with two sets of rules to keep in step.
         TRAP T-a-menu-owns-its-own-bodies -->
    <div class="body-range" part="body-range">
      <sherpa-switch class="body-range-switch" data-type="simple"
                     aria-label="Range"></sherpa-switch>
      <span class="body-range-label">Range</span>
    </div>

    <!-- BOTH SHAPES ALWAYS EXIST and CSS reveals one, so flipping Range keeps
         what was typed on the other side.
         TRAP T-range-switch-swaps-not-rebuilds -->
    <div class="body-number" part="body-number">
      <!-- The operator, where the host offers a choice of one. A chip does not;
           a grid column heading does. Shown only when `data-conditions` names
           the set. TRAP T-ops-follow-the-column-type -->
      <sherpa-input-text class="body-op" data-type="select"
                         aria-label="Condition"></sherpa-input-text>
      <!-- A Sherpa number field, NEVER a bare native number input.
           TRAP T-a-number-input-wears-sherpas-steppers -->
      <sherpa-input-text class="body-number-one" data-type="number"
                         aria-label="Value"></sherpa-input-text>
      <sherpa-slider class="body-number-range" data-type="range"
                     data-show-value></sherpa-slider>
    </div>

    <!-- NO CALENDAR HERE. A date body stays a SLOTTED child of the menu: the
         calendar projects its stepper into this menu's `header` slot, and slot
         assignment only reaches a host's LIGHT DOM. Inside this shadow root it
         would have nothing to project into.
         TRAP T-a-menu-owns-its-own-bodies
         TRAP T-projected-slot-content-crosses-two-shadow-boundaries -->

    <div class="rows" part="rows">
      <slot></slot>
    </div>

    <!-- ITEM PROTOTYPES — the menu stamps into its own rows slot from the DATA
         it is given, choosing by `data-select` and by what the value is. A
         caller hands over values; it never hands over markup, which is how a
         chip menu and a column heading menu drifted into different controls.
         No `id`, so the multi-template parser leaves them alone.
         TRAP T-one-field-one-filter-menu -->
    <template class="menu-check-tpl">
      <label class="menu-row"><input type="checkbox" /><span class="menu-row-label"></span></label>
    </template>
    <template class="menu-radio-tpl">
      <label class="menu-row"><input type="radio" /><span class="menu-row-label"></span></label>
    </template>
    <!-- SELECT ALL leads a MULTIPLE menu. Its label never moves, and a single-
         select menu never gets one. TRAP T-select-all-is-not-a-value -->
    <template class="menu-all-tpl">
      <!-- `qf-all` too: it is the name the rest of the system knows this row
           by, and renaming it would be a change nobody asked for. -->
      <label class="menu-row qf-all"><input type="checkbox" /><span class="menu-row-label">Select all</span></label>
    </template>
    <!-- A SECTION heading, drawn where an item's `section` changes. -->
    <template class="menu-section-tpl">
      <p class="menu-row menu-section"></p>
    </template>
    <!-- A row with NO tick box: it names what it cannot pick. -->
    <template class="menu-bare-tpl">
      <label class="menu-row menu-row-bare"><span class="menu-row-label"></span></label>
    </template>
    <!-- A CHILD MENU's door, at a row's end: its pick count, then its caret.
         TRAP T-a-row-opens-its-child-menu -->
    <template class="menu-count-tpl">
      <sherpa-badge class="menu-row-count"></sherpa-badge>
    </template>
    <template class="menu-drill-tpl">
      <sherpa-button class="menu-row-drill" data-type="icon" data-size="xs"
                     data-look="transparent" data-icon-start="chevron-right"></sherpa-button>
    </template>

    <!--
      FOOTER — the composed <sherpa-container-footer>, which owns the action-bar
      geometry and hides itself when empty. All three buttons are the button's
      DEFAULT size, as Figma pins them.

      A committing menu holds row changes as DRAFT until Apply, so what is behind
      the card does not re-query on every tick; Cancel restores the opening values.
    -->
    <sherpa-container-footer class="footer" part="footer" data-align="end">
      <!-- Today is the calendar's left slot, and REPLACES Clear rather than joining it. -->
      <sherpa-button class="today" part="today">Today</sherpa-button>
      <!--
        Clear, Save and Remove act on the filter, not on the draft, so they lead the
        row, separated from Cancel·Apply by the spacer. Default look — NOT
        transparent — as Figma pins them. Remove's critical ink is re-stated in
        CSS: a bare [data-status] rule in tokens.css reaches the document only,
        never a shadow root.
      -->
      <sherpa-button class="clear" part="clear">Clear</sherpa-button>
      <!-- A NUMBER has nothing to clear: its field and handles go back to where
           they started. Will, TODO 134. -->
      <sherpa-button class="reset" part="reset"
                     data-icon-start="arrow-rotate-left">Reset</sherpa-button>
      <sherpa-button class="save" part="save">Save filter</sherpa-button>
      <sherpa-button class="remove" part="remove" data-status="critical">Remove</sherpa-button>
      <span class="footer-spacer"></span>
      <sherpa-button class="cancel" part="cancel" data-footer="revert">Cancel</sherpa-button>
      <sherpa-button class="apply" part="apply" data-look="saturated" data-footer="commit">Apply</sherpa-button>
    </sherpa-container-footer>
  </div>
</template>

<template id="filter">
  <div class="menu sherpa-border-edges sherpa-border-corners" part="menu" popover="manual" role="dialog">
    <!-- HEADER — CSS-gated on the slot-presence flag, so an unslotted menu is unchanged. -->
    <div class="header" part="header">
      <!-- Shown only in a DRILLED menu. The trail IS sherpa-breadcrumbs, never re-drawn here. -->
      <span class="drill-trail" part="drill-trail">
        <sherpa-button class="drill-back" part="drill-back" data-type="icon" data-size="xs"
                       data-look="transparent" data-icon-start="arrow-left"
                       aria-label="Back"></sherpa-button>
        <sherpa-breadcrumbs class="drill-crumbs" part="drill-crumbs"></sherpa-breadcrumbs>
      </span>
      <p class="heading" part="heading"></p>
      <slot name="header"></slot>
      <!-- ONE OBJECT: the condition and whatever answers it are SNAPPED, with
           no gap, by `.sherpa-group` — the system's own grouping class, which
           squares the inner corners and halves the shared edge by POSITION.
           The search box is the last child while the rows are the answer; the
           input takes its place once a typing condition does.
           TRAP T-grouping-is-an-attribute-and-a-class -->
      <!-- The mode button, at the end of the heading's row: the two modes are
           the SAME filter seen two ways, not two menus. f(x), and ON in
           Advanced. Will, TODO 141. TRAP T-a-filter-menu-has-two-modes -->
      <div class="use-condition" part="use-condition">
        <sherpa-button class="use-advanced" data-type="icon" data-size="sm"
                       data-icon-start="function" aria-label="Advanced"
                       aria-pressed="false"></sherpa-button>
      </div>

      <!-- SELECT MODE — the search leads the ticked rows beneath it. -->
      <sherpa-input-text class="search" part="search"
                         data-icon-start="magnifying-glass" data-clearable
                         placeholder="Search" autocomplete="off"
                         aria-label="Search this menu"></sherpa-input-text>

      <!-- CONDITION MODE — one or more rows, stamped from the prototype.
           Row one has no join select; every later row starts with one. -->
      <div class="condition-rows" part="condition-rows" role="group"
           aria-label="Advanced conditions"></div>
      <sherpa-button class="add-condition" part="add-condition"
                     data-icon-start="plus">Add condition</sherpa-button>
    </div>

    <!-- Without this the card collapses to an empty box and reads as broken. -->
    <p class="no-matches" part="no-matches" role="status">No matches</p>

    <div class="rows" part="rows">
      <slot></slot>
    </div>

    <!-- ITEM PROTOTYPES — the menu stamps into its own rows slot from the DATA
         it is given, choosing by `data-select` and by what the value is. A
         caller hands over values; it never hands over markup, which is how a
         chip menu and a column heading menu drifted into different controls.
         No `id`, so the multi-template parser leaves them alone.
         TRAP T-one-field-one-filter-menu -->
    <!-- CONDITION ROW — [And|Or] [condition] [value] [x]. The join is dropped on
         the first row in CSS, never removed, so re-ordering cannot lose it.
         `.sherpa-group` snaps the three into one object by POSITION.
         TRAP T-a-filter-menu-has-two-modes -->
    <template class="condition-row-tpl">
      <div class="condition-row sherpa-group">
        <sherpa-input-text class="join" data-type="select" data-size="sm"
                           aria-label="Join"></sherpa-input-text>
        <sherpa-input-text class="condition" data-type="select"
                           aria-label="Condition"></sherpa-input-text>
        <!-- A picking op answers with a SELECT of the field's own values; a
             typing op answers with a text box. CSS shows one. -->
        <sherpa-input-text class="condition-pick" data-type="select"
                           aria-label="Value"></sherpa-input-text>
        <sherpa-input-text class="condition-value" placeholder="Value"
                           data-clearable aria-label="Value"></sherpa-input-text>
        <!-- DEFAULT look and DEFAULT size, and LAST in the group: it is one of
             the row's controls, not chrome floating beside them, so it stands
             the same height as the inputs it sits with. -->
        <sherpa-button class="drop-condition" data-type="icon"
                       data-icon-start="cross"
                       aria-label="Remove condition"></sherpa-button>
      </div>
    </template>

    <template class="menu-check-tpl">
      <label class="menu-row"><input type="checkbox" /><span class="menu-row-label"></span></label>
    </template>
    <template class="menu-radio-tpl">
      <label class="menu-row"><input type="radio" /><span class="menu-row-label"></span></label>
    </template>
    <!-- SELECT ALL leads a MULTIPLE menu. Its label never moves, and a single-
         select menu never gets one. TRAP T-select-all-is-not-a-value -->
    <template class="menu-all-tpl">
      <!-- `qf-all` too: it is the name the rest of the system knows this row
           by, and renaming it would be a change nobody asked for. -->
      <label class="menu-row qf-all"><input type="checkbox" /><span class="menu-row-label">Select all</span></label>
    </template>
    <!-- A SECTION heading, drawn where an item's `section` changes. -->
    <template class="menu-section-tpl">
      <p class="menu-row menu-section"></p>
    </template>
    <!-- A row with NO tick box: it names what it cannot pick. -->
    <template class="menu-bare-tpl">
      <label class="menu-row menu-row-bare"><span class="menu-row-label"></span></label>
    </template>
    <!-- A CHILD MENU's door, at a row's end: its pick count, then its caret.
         TRAP T-a-row-opens-its-child-menu -->
    <template class="menu-count-tpl">
      <sherpa-badge class="menu-row-count"></sherpa-badge>
    </template>
    <template class="menu-drill-tpl">
      <sherpa-button class="menu-row-drill" data-type="icon" data-size="xs"
                     data-look="transparent" data-icon-start="chevron-right"></sherpa-button>
    </template>

    <!--
      FOOTER — the composed <sherpa-container-footer>, which owns the action-bar
      geometry and hides itself when empty. All three buttons are the button's
      DEFAULT size, as Figma pins them.

      A committing menu holds row changes as DRAFT until Apply, so what is behind
      the card does not re-query on every tick; Cancel restores the opening values.
    -->
    <sherpa-container-footer class="footer" part="footer" data-align="end">
      <!-- Today is the calendar's left slot, and REPLACES Clear rather than joining it. -->
      <sherpa-button class="today" part="today">Today</sherpa-button>
      <!--
        Clear, Save and Remove act on the filter, not on the draft, so they lead the
        row, separated from Cancel·Apply by the spacer. Default look — NOT
        transparent — as Figma pins them. Remove's critical ink is re-stated in
        CSS: a bare [data-status] rule in tokens.css reaches the document only,
        never a shadow root.
      -->
      <sherpa-button class="clear" part="clear">Clear</sherpa-button>
      <sherpa-button class="save" part="save">Save filter</sherpa-button>
      <sherpa-button class="remove" part="remove" data-status="critical">Remove</sherpa-button>
      <span class="footer-spacer"></span>
      <sherpa-button class="cancel" part="cancel" data-footer="revert">Cancel</sherpa-button>
      <sherpa-button class="apply" part="apply" data-look="saturated" data-footer="commit">Apply</sherpa-button>
    </sherpa-container-footer>
  </div>
</template>
