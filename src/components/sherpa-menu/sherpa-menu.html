<!--
  sherpa-menu — a floating list of choices or actions.

  Matches the Figma "Menu" (49:66174): a 240px card (padding 8, gap 2, radius 4,
  Elevation md) with an optional 10/16 upper-case heading over 36-tall rows.

  Native-first: the card IS a `popover`, so the browser puts it in the top layer,
  closes it on Escape and on an outside click, and manages focus — no scroll-lock
  hacks and no dismiss listeners.

  Placement is the one part the browser cannot do here. CSS anchor positioning only
  resolves an `anchor-name` inside ONE tree, and a trigger is always in a different
  shadow root from this card, so `position-anchor` found nothing and every menu
  rendered at the viewport corner. Instead show(trigger) measures the trigger and
  writes viewport coordinates the `position: fixed` card consumes, flipping above or
  clamping inward when an edge is in the way.

  Rows are whatever you slot in, and they stay real form controls:

    values  — <label><input type="checkbox|radio" value="…" /> Label</label>
    actions — <button type="button" value="…">Label</button>

  So a multi-select field is checkbox rows, a single-select field is radio rows, and
  an action menu is buttons. Keyboard and screen-reader behaviour come free.

  Public API:
    data-commit     show the Apply / Cancel footer and DEFER changes until Apply
    data-heading  optional heading (rendered upper-case at 10/16)
    data-search   show a search input under the heading that filters the rows
    data-select   multiple (default, checkbox rows) | single (radio rows)
    data-align    start (default) | end   which trigger edge the card lines up with
    open          native-ish boolean: reflects/controls the popover

  Slots:
    (default) — the rows (labels with inputs, or buttons)

  Fires:
    menu-change — the selection was COMMITTED. detail: { values: string[] }
                  Without data-commit that is every row tick; with it, only Apply.
    menu-apply  — Apply was clicked. detail: { values: string[] }
    menu-cancel — Cancel was clicked; the values are already restored. detail: {}
    menu-select — an action row was clicked. detail: { value, label }
    menu-open / menu-close — detail: {}
-->
<template id="default">
  <div class="menu" part="menu" popover="auto" role="menu">
    <p class="heading" part="heading"></p>

    <!--
      SEARCH — the Input Field (atom), composed, not hand-rolled.

      Read from the Menu node (49:66174): its second child is an
      `Input Field (atom)` instance at 224 x 32, between the heading and the
      rows. sherpa-input-text IS that component, so it owns the field's box,
      ring, focus state and icon — there is nothing here for this menu to
      restyle.

      No label and no description: the placeholder and its position under the
      heading say what it is, and a 240px card cannot spare a line to repeat it.
      `aria-label` carries the name for a screen reader instead.

      It filters the ROWS the menu already has, so it never re-queries and never
      disturbs what is ticked — a row hidden by a search keeps its state and
      comes back with it.
    -->
    <sherpa-input-text class="search" part="search"
                       data-icon-start="fa-solid fa-magnifying-glass"
                       placeholder="Search" autocomplete="off"
                       aria-label="Search this menu"></sherpa-input-text>

    <!-- Shown when a search matches no row. Without it the card collapses to an
         empty box and reads as broken rather than as "nothing found". -->
    <p class="no-matches" part="no-matches" role="status">No matches</p>

    <div class="rows" part="rows">
      <slot></slot>
    </div>

    <!--
      Apply / Cancel footer, shown with data-commit. A committing menu holds its
      row changes as DRAFT until Apply, so the chart or table behind it does not
      re-query on every tick; Cancel restores the values the menu opened with.

      Cancel is the DEFAULT look and Apply the saturated one, matching the Figma
      footer convention (a cancel is not a transparent afterthought).
    -->
    <div class="footer" part="footer">
      <sherpa-button class="cancel" part="cancel" data-size="sm">Cancel</sherpa-button>
      <sherpa-button class="apply" part="apply" data-size="sm" data-look="saturated">Apply</sherpa-button>
    </div>
  </div>
</template>
