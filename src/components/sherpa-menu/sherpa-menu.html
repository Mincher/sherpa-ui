<!--
  sherpa-menu — a floating list of choices or actions.

  Matches the Figma "Menu" SET (1156:29240), whose `Type` axis is List | Calendar
  and whose three slots are header, list and footer. Both variants share one card:
  240 wide (Calendar hugs its grid), padding 8/8/4/8, gap 8, radius 4, Elevation md,
  a 10/16 heading over 36-tall rows, and a composed `Container Footer` action bar.

  Native-first: the card IS a `popover`, so the browser puts it in the top layer,
  closes it on Escape and on an outside click, and manages focus — no scroll-lock
  hacks and no dismiss listeners.

  Placement is the one part the browser cannot do here. CSS anchor positioning only
  resolves an `anchor-name` inside ONE tree, and a trigger is always in a different
  shadow root from this card, so `position-anchor` found nothing and every menu
  rendered at the viewport corner. Instead show(trigger) measures the trigger and
  writes viewport coordinates the `position: fixed` card consumes, flipping above or
  clamping inward when an edge is in the way.

  Rows are whatever you slot in, and they stay real form controls:

    values  — <label><input type="checkbox|radio" value="…" /> Label</label>
    actions — <button type="button" value="…">Label</button>

  So a multi-select field is checkbox rows, a single-select field is radio rows, and
  an action menu is buttons. Keyboard and screen-reader behaviour come free.

  Public API:
    data-commit     show the Apply / Cancel footer and DEFER changes until Apply
    data-heading  optional heading (rendered upper-case at 10/16)
    data-search   show a search input under the heading that filters the rows
    data-removable  show a "Remove filter" button in the footer (after Today);
                    it emits menu-select with value="remove"
    data-clearable  show a Clear button in the footer that empties the selection
                    (a CALENDAR menu shows Today there instead — see the footer)
    data-type     list (default) | calendar — the Menu set's own `Type` axis.
                  `calendar` widens the card and lays the LIST region out
                  horizontally, so a day grid and a time picker sit side by
                  side. Everything else is the same menu.
    data-select   multiple (default, checkbox rows) | single (radio rows)
    data-align    start (default) | end   which trigger edge the card lines up with
    open          native-ish boolean: reflects/controls the popover

  Slots:
    header    — controls ABOVE the heading (a calendar's month stepper). The
                Calendar variant's header is three Button instances SNAPPED into
                one control: prev (icon, snap-right-edge), month (label,
                snap-all-edges), next (icon, snap-left-edge).

                Those buttons land in the MENU's light DOM, outside the
                calendar's shadow root — so this file styles the group; see the
                `::slotted(.cal-header)` block in sherpa-menu.css.
    (default) — the rows (labels with inputs, or buttons)

  Fires:
    menu-change — the selection was COMMITTED. detail: { values: string[] }
                  Without data-commit that is every row tick; with it, only Apply.
    menu-apply  — Apply was clicked. detail: { values: string[] }
    menu-cancel — Cancel was clicked; the values are already restored. detail: {}
    menu-clear  — Clear was clicked; the selection is already empty. detail: {}
    menu-select — an action row was clicked. detail: { value, label }
    menu-open / menu-close — detail: {}
-->
<template id="default">
  <div class="menu" part="menu" popover="auto" role="menu">
    <!--
      HEADER — a slot, not just the text heading below it.

      Read from the Calendar node (268:14601), which is a card of exactly three
      regions: a `header` SLOT holding ‹ · "August 2026" · ›, the content grid,
      and a Container Footer. A calendar IS a menu in this system, so its month
      stepper belongs in the menu's own header rather than inside a nested
      component that draws a second one.

      CSS-gated on SherpaElement's slot-presence flag, so a menu with nothing
      slotted here is unchanged.
    -->
    <div class="header" part="header">
      <p class="heading" part="heading"></p>
      <slot name="header"></slot>
    </div>

    <!--
      SEARCH — the Input Field (atom), composed, not hand-rolled.

      Read from the Menu node (49:66174): its second child is an
      `Input Field (atom)` instance at 224 x 32, between the heading and the
      rows. sherpa-input-text IS that component, so it owns the field's box,
      ring, focus state and icon — there is nothing here for this menu to
      restyle.

      No label and no description: the placeholder and its position under the
      heading say what it is, and a 240px card cannot spare a line to repeat it.
      `aria-label` carries the name for a screen reader instead.

      It filters the ROWS the menu already has, so it never re-queries and never
      disturbs what is ticked — a row hidden by a search keeps its state and
      comes back with it.
    -->
    <sherpa-input-text class="search" part="search"
                       data-icon-start="fa-solid fa-magnifying-glass"
                       placeholder="Search" autocomplete="off"
                       aria-label="Search this menu"></sherpa-input-text>

    <!-- Shown when a search matches no row. Without it the card collapses to an
         empty box and reads as broken rather than as "nothing found". -->
    <p class="no-matches" part="no-matches" role="status">No matches</p>

    <div class="rows" part="rows">
      <slot></slot>
    </div>

    <!--
      FOOTER — the composed <sherpa-container-footer>, not a hand-drawn row.

      Read from the Menu set (1156:29240): BOTH variants' `footer` slot holds a
      `Container Footer` instance at Type=action-bar — padding 8 block / 0 inline, gap 4,
      and a top stroke of style-border/base +1. That component already is that
      row, owns those values and hides itself when empty, so the menu composes
      it instead of copying its geometry.

      A committing menu holds its row changes as DRAFT until Apply, so the chart
      or table behind it does not re-query on every tick; Cancel restores the
      values the menu opened with.

      Read off the footer instances themselves (1156:29251 / 1144:28602), which
      is what settles their size and look:

        Clear   left  slot · Type=label · DEFAULT size · Style=default
        Cancel  right slot · Type=label · DEFAULT size · Style=default
        Apply   right slot · Type=label · DEFAULT size · Style: SATURATED

      So all three are the button's DEFAULT size — 32 tall, matching the header
      stepper and the Container Footer's own 32-tall slots. They carried
      data-size="sm" and Clear a transparent look, neither of which Figma pins.

      CLEAR sits on the LEFT, alone, where Figma puts "Today" — a destructive-ish
      action belongs away from the one a thumb reaches for. The spacer is what
      pushes the pair apart; both are shown only with data-clearable.
    -->
    <sherpa-container-footer class="footer" part="footer" data-align="end">
      <!--
        THE LEFT SLOT. Figma's two footers differ in exactly this position:

          Calendar   left = "Today"      right = Cancel · Apply
          List       left = (empty)      right = Cancel · Apply

        Today is the calendar's, and it REPLACES Clear rather than joining it —
        one control on the left, as the node has. Clear stays for a list menu
        that asks for it (data-clearable), where Figma leaves the slot empty and
        the code has always offered one.
      -->
      <sherpa-button class="today" part="today">Today</sherpa-button>
      <!--
        REMOVE FILTER — a footer button, after Today, on the left side.

        This was an action ROW at the foot of the list for a value menu and a
        footer button for a calendar (which has no list for a row to sit in).
        One action in two places is one too many: the button is the shape that
        works for both, it never scrolls away with a long list, and it sits with
        the menu's other actions rather than among the values.

        `data-status="critical"` because it DELETES the chip. The status cascade
        carries the destructive ink through the button's own tokens, which is
        how the system says "this one is not a value pick" everywhere else.

        It emits `menu-select` with value="remove".
      -->
      <sherpa-button class="remove" part="remove" data-status="critical"
                     data-icon-start="fa-solid fa-xmark">Remove filter</sherpa-button>
      <sherpa-button class="clear" part="clear">Clear</sherpa-button>
      <span class="footer-spacer"></span>
      <sherpa-button class="cancel" part="cancel">Cancel</sherpa-button>
      <sherpa-button class="apply" part="apply" data-look="saturated">Apply</sherpa-button>
    </sherpa-container-footer>
  </div>
</template>
