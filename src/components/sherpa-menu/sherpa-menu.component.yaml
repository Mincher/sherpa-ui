# sherpa-menu — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-menu.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-menu
$description: a floating list of choices or actions.
element:
  $type: element
  tag: div
  attributes:
    popover: auto
    role: menu
  provides: []
templates:
  - default
  - filter
anatomy:
  byTemplate:
    default:
      - el: div
        class: menu sherpa-border-edges
        part: menu
        attrs:
          popover: auto
          role: menu
        children:
          - el: div
            class: header
            part: header
            children:
              - el: span
                class: drill-trail
                part: drill-trail
                children:
                  - el: sherpa-button
                    class: drill-back
                    part: drill-back
                    attrs:
                      data-type: icon
                      data-size: xs
                      data-look: transparent
                      data-icon-start: fa-solid fa-arrow-left
                      aria-label: Back
                  - el: sherpa-breadcrumbs
                    class: drill-crumbs
                    part: drill-crumbs
              - el: p
                class: heading
                part: heading
              - slot: header
              - el: sherpa-input-text
                class: search
                part: search
                attrs:
                  data-icon-start: fa-solid fa-magnifying-glass
                  placeholder: Search
                  autocomplete: "off"
                  aria-label: Search this menu
          - el: p
            class: no-matches
            part: no-matches
            attrs:
              role: status
          - el: div
            class: rows
            part: rows
            slot: ""
          - el: template
            class: menu-check-tpl
            children:
              - el: label
                class: menu-row
                children:
                  - el: input
                    attrs:
                      type: checkbox
                  - el: span
                    class: menu-row-label
    filter:
      - el: div
        class: menu sherpa-border-edges
        part: menu
        attrs:
          popover: auto
          role: menu
        children:
          - el: div
            class: header
            part: header
            children:
              - el: span
                class: drill-trail
                part: drill-trail
                children:
                  - el: sherpa-button
                    class: drill-back
                    part: drill-back
                    attrs:
                      data-type: icon
                      data-size: xs
                      data-look: transparent
                      data-icon-start: fa-solid fa-arrow-left
                      aria-label: Back
                  - el: sherpa-breadcrumbs
                    class: drill-crumbs
                    part: drill-crumbs
              - el: p
                class: heading
                part: heading
              - slot: header
              - el: div
                class: filter-row sherpa-group
                part: filter-row
                children:
                  - el: sherpa-input-text
                    class: condition
                    part: condition
                    attrs:
                      data-type: select
                      aria-label: Condition
                  - el: sherpa-input-text
                    class: condition-value
                    part: condition-value
                    attrs:
                      placeholder: Value
                      data-clearable: ""
                      aria-label: Value
                  - el: sherpa-input-text
                    class: search
                    part: search
                    attrs:
                      data-icon-start: fa-solid fa-magnifying-glass
                      placeholder: Search
                      autocomplete: "off"
                      aria-label: Search this menu
          - el: p
            class: no-matches
            part: no-matches
            attrs:
              role: status
          - el: div
            class: rows
            part: rows
            slot: ""
          - el: template
            class: menu-check-tpl
            children:
              - el: label
                class: menu-row
                children:
                  - el: input
                    attrs:
                      type: checkbox
                  - el: span
                    class: menu-row-label
props:
  - $type: prop
    name: data-align
    type: enum
    kind: content
    values:
      - start
      - end
    description: start  | end   which trigger edge the card lines up with
  - $type: prop
    name: data-clearable
    type: string
    kind: content
    description: >-
      show a Clear button in the footer that empties the selection (a CALENDAR menu shows Today
      there instead — see the footer)
  - $type: prop
    name: data-commit
    type: string
    kind: style
    description: show the Apply / Cancel footer and DEFER changes until Apply
  - $type: prop
    name: data-conditions
    type: string
    kind: style
    description: >-
      FILTER type only: a comma-separated op list ('eq,ne,contains') in place of the default text
      set.
  - $type: prop
    name: data-drill
    type: string
    kind: style
    description: >-
      the list has been replaced by a SUB-LIST — shows a back arrow and a breadcrumb in the header.
      Drilling IN PLACE rather than opening a second card means one box to position, nothing to
      close on a pointer crossing a gap, and no way for two cards to disagree about what is ticked.
  - $type: prop
    name: data-drill-from
    type: string
    kind: content
    description: names the list that was replaced — the breadcrumb's text
  - $type: prop
    name: data-has-value
    type: string
    kind: style
    description: "written BY the menu: the typed value is not empty, so the input's Clear button shows."
  - $type: prop
    name: data-heading
    type: string
    kind: content
    description: optional heading (rendered upper-case at 10/16)
  - $type: prop
    name: data-op
    type: string
    kind: content
    description: "FILTER type only: which condition is picked. Defaults to `eq`."
  - $type: prop
    name: data-removable
    type: string
    kind: content
    description: show a "Remove" button in the footer (after Today); it emits menu-select with value="remove"
  - $type: prop
    name: data-search
    type: string
    kind: content
    description: show a search input under the heading that filters the rows
  - $type: prop
    name: data-select
    type: enum
    kind: style
    values:
      - multiple
      - single
    description: multiple  | single (radio rows)
  - $type: prop
    name: data-takes
    type: string
    kind: style
    description: >-
      written BY the menu from data-op: list | text. CSS reads it to reveal the rows or the text
      box.
  - $type: prop
    name: data-type
    type: enum
    kind: content
    values:
      - list
      - calendar
      - filter
    description: >-
      list  | calendar | filter — the Menu set's `Type` axis. `filter` is the FILTER MENU: a
      condition dropdown above the search, and the text box its typing conditions use. One field
      gets one menu whether a chip or a column heading opens it. TRAP T-one-field-one-filter-menu
      TRAP T-an-operator-decides-pick-or-type `calendar` widens the card and lays the LIST region
      out horizontally, so a day grid and a time picker sit side by side. Everything else is the
      same menu.
  - $type: prop
    name: data-value
    type: string
    kind: content
    description: >-
      FILTER type only: what was TYPED under a typing condition. An ATTRIBUTE because a variant
      re-stamp replaces the whole shadow tree, and a value living only in the box is lost.
  - $type: prop
    name: open
    type: boolean
    native: true
    kind: content
    default: false
    description: "native-ish boolean: reflects/controls the popover"
states:
  - $type: state
    name: heading
    selector: ":host([data-heading])"
  - $type: state
    name: has-header
    selector: ":host([data-has-header])"
  - $type: state
    name: search
    selector: ":host([data-search])"
  - $type: state
    name: filter
    selector: ":host([data-type=\"filter\"])"
  - $type: state
    name: drill
    selector: ":host([data-drill])"
  - $type: state
    name: text
    selector: ":host([data-takes=\"text\"])"
  - $type: state
    name: clearable
    selector: ":host([data-clearable])"
  - $type: state
    name: removable
    selector: ":host([data-removable])"
  - $type: state
    name: calendar
    selector: ":host([data-type=\"calendar\"])"
  - $type: state
    name: no-matches
    selector: ":host([data-no-matches])"
  - $type: state
    name: commit
    selector: ":host([data-commit])"
  - $type: state
    name: focus-visible
    selector: ":focus-visible"
capabilities:
  - $type: capability
    api: js-property-mirror
    description: >-
      read/write JS properties (values, templateId, op, conditionValue, open). See
      $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: >-
      callable from a view definition's state block (show, hide, toggle, items). See
      $extensions.sherpa.methods.
events:
  - $type: event
    name: menu-change
    bubbles: true
    composed: true
    detail:
      values: unknown
  - $type: event
    name: menu-apply
    bubbles: true
    composed: true
    detail:
      values: unknown
  - $type: event
    name: menu-cancel
    bubbles: true
    composed: true
  - $type: event
    name: menu-clear
    bubbles: true
    composed: true
  - $type: event
    name: menu-select
    bubbles: true
    composed: true
    detail:
      label: string
      value: unknown
  - $type: event
    name: condition-change
    bubbles: true
    composed: true
    detail:
      op: unknown
      value: unknown
  - $type: event
    name: menu-items
    bubbles: true
    composed: true
    detail:
      values: unknown
  - $type: event
    name: menu-back
    bubbles: true
    composed: true
tokens:
  menu.gap: "{sherpa.display-mode-space-xs}"
  menu.padding: "{sherpa.theme-padding-md}"
  menu.padding-block-end: "{sherpa.theme-padding-sm}"
  menu.border-color: "{sherpa.style-border-base}"
  menu.border-start-start-radius: "{sherpa.border-rounding-top-left}"
  menu.border-start-end-radius: "{sherpa.border-rounding-top-right}"
  menu.border-end-start-radius: "{sherpa.border-rounding-bottom-left}"
  menu.border-end-end-radius: "{sherpa.border-rounding-bottom-right}"
  menu.background: "{sherpa.style-surface-base}"
  menu.color: "{sherpa.theme-content-body-base}"
  menu.font-family: "{sherpa.font-family-body}"
  menu.box-shadow: "{sherpa.display-mode-size-2xs}"
  heading.padding-inline: "{sherpa.theme-padding-none}"
  heading.color: "{sherpa.theme-content-body-1}"
  heading.font-size: "{sherpa.theme-content-size-small}"
  heading.font-weight: "{sherpa.font-weight-regular}"
  heading.line-height: "{sherpa.theme-content-line-height-small}"
  heading.letter-spacing: "{sherpa.theme-content-letter-spacing-xs}"
  remove.--_status-text: "{sherpa.theme-content-critical-1}"
  remove.--_status-border: "{sherpa.theme-border-critical-2}"
  remove.--_status-icon: "{sherpa.theme-content-critical-1}"
  rows.gap: "{sherpa.display-mode-space-2xs}"
$extensions:
  sherpa:
    figmaName: Menu
    methods:
      - $type: method
        name: show
        args: "trigger?: HTMLElement"
        description: Open the menu under `trigger`, which is also what it measures against.
      - $type: method
        name: hide
        args: ""
      - $type: method
        name: toggle
        args: "trigger?: HTMLElement"
      - $type: method
        name: items
        args: "next: readonly MenuItem[]"
        description: items([...]) — the SYNCHRONOUS door, for a caller building a detached tree.
    figmaNodeId: "1156:29240"
    category: overlay
    variantAxes:
      - name: Type
        values:
          - List
          - Calendar
    composes:
      - sherpa-input-text
      - sherpa-button
      - sherpa-container-footer
    _divergence:
      nodeId: >-
        49:66174 is now only the Type=List VARIANT; the set moved to 1156:29240 when the Calendar
        variant was added. Older notes cite the variant id.
      calendarWidth: >-
        Figma's Calendar variant measures 562 wide, which is the RESULT of a 7-column grid beside a
        time picker inside 8px padding, and is off the 8px grid. The code hugs its content instead,
        so a calendar with no time picker is narrower rather than half empty.
      heading: >-
        The two variants' headers are exclusive: List holds one TEXT node, Calendar holds
        prev/month/next and no heading. data-heading is still accepted on a calendar menu and moves
        to the card's aria-label.
      time: >-
        The Calendar variant's `list` frame holds a `time-clock` beside the day grid. No code
        counterpart yet; data-has-time renders a native <input type="time"> in the calendar instead.
    jsProps:
      - name: values
        type: string[]
        description: the checked row values (read/write)
        access: read-write
      - name: templateId
        type: string
        access: read
      - name: op
        type: string
        access: read-write
      - name: conditionValue
        type: string
        access: read-write
      - name: open
        type: string
        access: read-write
