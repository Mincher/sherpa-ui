# sherpa-menu — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-menu.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-menu
$description: a floating list of choices or actions.
element:
  $type: element
  tag: div
  attributes:
    popover: auto
    role: menu
  provides: []
templates:
  - default
anatomy:
  root:
    el: div
    class: menu
    part: menu
    attrs:
      popover: auto
      role: menu
    children:
      - el: p
        class: heading
        part: heading
      - el: div
        class: rows
        part: rows
        slot: ""
props:
  - $type: prop
    name: data-align
    type: enum
    kind: content
    values:
      - start
      - end
    description: start  | end   which trigger edge the card lines up with
  - $type: prop
    name: data-anchor
    type: string
    kind: style
    description: the CSS anchor-name of the trigger, for anchor positioning
  - $type: prop
    name: data-heading
    type: string
    kind: content
    description: optional heading (rendered upper-case at 10/16)
  - $type: prop
    name: data-select
    type: enum
    kind: style
    values:
      - multiple
      - single
    description: multiple  | single (radio rows)
  - $type: prop
    name: open
    type: string
    description: "native-ish boolean: reflects/controls the popover"
states:
  - $type: state
    name: focus-visible
    selector: ":focus-visible"
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (values, open). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: menu-change
    bubbles: true
    composed: true
  - $type: event
    name: menu-select
    bubbles: true
    composed: true
  - $type: event
    name: label
    bubbles: true
    composed: true
  - $type: event
    name: menu-open
    bubbles: true
    composed: true
tokens:
  menu.gap: "{sherpa.display-mode-space-3xs}"
  menu.padding: "{sherpa.theme-padding-md}"
  menu.border-width: "{sherpa.style-border-width}"
  menu.border-color: "{sherpa.style-border-base}"
  menu.border-radius: "{sherpa.structure-rounding-top-left}"
  menu.background: "{sherpa.style-surface-base}"
  menu.color: "{sherpa.theme-content-body-base}"
  menu.font-family: "{sherpa.font-family-body}"
  menu.box-shadow: "{sherpa.theme-elevation-offset-x-base}"
  heading.padding-inline: "{sherpa.theme-padding-md}"
  heading.color: "{sherpa.theme-content-body-1}"
  heading.font-size: "{sherpa.font-size-body-xs}"
  heading.font-weight: "{sherpa.font-weight-regular}"
  heading.line-height: "{sherpa.theme-content-line-height-xs}"
  rows.gap: "{sherpa.display-mode-space-3xs}"
$extensions:
  sherpa:
    jsProps:
      - name: values
        type: string[]
        description: the checked row values (read/write)
        access: read-write
      - name: open
        type: string
        access: read-write
