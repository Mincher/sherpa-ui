# sherpa-menu — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-menu.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-menu
$description: a floating list of choices or actions. Figma "Menu" SET (1156:29240), Type axis List | Calendar.
element:
  $type: element
  tag: div
  attributes:
    popover: manual
    role: menu
  provides: []
templates:
  - default
  - filter
anatomy:
  byTemplate:
    default:
      - el: div
        class: menu sherpa-border-edges sherpa-border-corners
        part: menu
        attrs:
          popover: manual
          role: menu
        children:
          - el: div
            class: header
            part: header
            children:
              - el: span
                class: drill-trail
                part: drill-trail
                children:
                  - el: sherpa-button
                    class: drill-back
                    part: drill-back
                    attrs:
                      data-type: icon
                      data-size: xs
                      data-look: transparent
                      data-icon-start: arrow-left
                      aria-label: Back
                  - el: sherpa-breadcrumbs
                    class: drill-crumbs
                    part: drill-crumbs
              - el: p
                class: heading
                part: heading
              - slot: header
              - el: sherpa-input-text
                class: search
                part: search
                attrs:
                  data-icon-start: magnifying-glass
                  data-clearable: ""
                  placeholder: Search
                  autocomplete: "off"
                  aria-label: Search this menu
          - el: p
            class: no-matches
            part: no-matches
            attrs:
              role: status
          - el: div
            class: body-range
            part: body-range
            children:
              - el: sherpa-switch
                class: body-range-switch
                attrs:
                  data-type: simple
                  aria-label: Range
              - el: span
                class: body-range-label
          - el: div
            class: body-number
            part: body-number
            children:
              - el: sherpa-input-text
                class: body-op
                attrs:
                  data-type: select
                  aria-label: Condition
              - el: input
                class: body-number-one sherpa-border-edges
                attrs:
                  type: number
                  inputmode: decimal
                  aria-label: Value
                  placeholder: Any
              - el: sherpa-slider
                class: body-number-range
                attrs:
                  data-type: range
                  data-show-value: ""
          - el: div
            class: rows
            part: rows
            slot: ""
          - el: template
            class: menu-check-tpl
            children:
              - el: label
                class: menu-row
                children:
                  - el: input
                    attrs:
                      type: checkbox
                  - el: span
                    class: menu-row-label
    filter:
      - el: div
        class: menu sherpa-border-edges sherpa-border-corners
        part: menu
        attrs:
          popover: manual
          role: menu
        children:
          - el: div
            class: header
            part: header
            children:
              - el: span
                class: drill-trail
                part: drill-trail
                children:
                  - el: sherpa-button
                    class: drill-back
                    part: drill-back
                    attrs:
                      data-type: icon
                      data-size: xs
                      data-look: transparent
                      data-icon-start: arrow-left
                      aria-label: Back
                  - el: sherpa-breadcrumbs
                    class: drill-crumbs
                    part: drill-crumbs
              - el: p
                class: heading
                part: heading
              - slot: header
              - el: div
                class: use-condition
                part: use-condition
                children:
                  - el: sherpa-switch
                    class: use-advanced-switch
                    attrs:
                      data-type: simple
                      aria-label: Advanced
                  - el: span
                    class: use-advanced-label
              - el: sherpa-input-text
                class: search
                part: search
                attrs:
                  data-icon-start: magnifying-glass
                  data-clearable: ""
                  placeholder: Search
                  autocomplete: "off"
                  aria-label: Search this menu
              - el: div
                class: condition-rows
                part: condition-rows
                attrs:
                  role: group
                  aria-label: Advanced conditions
              - el: sherpa-button
                class: add-condition
                part: add-condition
                attrs:
                  data-icon-start: plus
          - el: p
            class: no-matches
            part: no-matches
            attrs:
              role: status
          - el: div
            class: rows
            part: rows
            slot: ""
          - el: template
            class: condition-row-tpl
            children:
              - el: div
                class: condition-row sherpa-group
                children:
                  - el: sherpa-input-text
                    class: join
                    attrs:
                      data-type: select
                      data-size: sm
                      aria-label: Join
                  - el: sherpa-input-text
                    class: condition
                    attrs:
                      data-type: select
                      aria-label: Condition
                  - el: sherpa-input-text
                    class: condition-pick
                    attrs:
                      data-type: select
                      aria-label: Value
                  - el: sherpa-input-text
                    class: condition-value
                    attrs:
                      placeholder: Value
                      data-clearable: ""
                      aria-label: Value
                  - el: sherpa-button
                    class: drop-condition
                    attrs:
                      data-type: icon
                      data-icon-start: cross
                      aria-label: Remove condition
props:
  - $type: prop
    name: data-advanced
    type: string
    observed: false
    kind: style
    description: >-
      FILTER type only: this field offers Advanced conditions, so the mode switch shows. OPT-IN:
      most fields are answered by ticking values, and a `Contains` box over a closed set of three is
      noise. TRAP T-conditions-are-opt-in-per-field
  - $type: prop
    name: data-advanced-only
    type: string
    observed: false
    kind: style
    description: >-
      FILTER type only: Advanced conditions and NOTHING else. Implies data-advanced, opens in
      advanced mode and cannot leave it, and hides the switch — there is no list behind it. For a
      field whose values are a wall nobody ticks: 240 emails. TRAP
      T-a-filter-answers-by-values-conditions-or-both
  - $type: prop
    name: data-align
    type: enum
    observed: true
    kind: style
    values:
      - start
      - end
    description: start  | end   which trigger edge the card lines up with
  - $type: prop
    name: data-clearable
    type: string
    observed: true
    kind: style
    description: >-
      show a Clear button in the footer that empties the selection (a CALENDAR menu shows Today
      there instead — see the footer)
  - $type: prop
    name: data-commit
    type: string
    observed: false
    kind: style
    description: show the Apply / Cancel footer and DEFER changes until Apply
  - $type: prop
    name: data-conditional
    type: string
    observed: true
    kind: style
    description: the name before that, still read.
  - $type: prop
    name: data-conditions
    type: string
    observed: false
    kind: style
    description: >-
      FILTER type only: a comma-separated op list ('eq,ne,contains') in place of the default text
      set.
  - $type: prop
    name: data-conditions-only
    type: string
    observed: true
    kind: style
    description: the name before that, still read.
  - $type: prop
    name: data-custom
    type: string
    observed: true
    kind: style
    description: the old name of data-advanced, still read. TRAP T-a-renamed-attribute-keeps-its-old-name
  - $type: prop
    name: data-custom-only
    type: string
    observed: true
    kind: style
    description: the old name of data-advanced-only, still read.
  - $type: prop
    name: data-drill
    type: string
    observed: false
    kind: style
    description: >-
      the list has been replaced by a SUB-LIST — shows a back arrow and a breadcrumb in the header.
      Drilling IN PLACE rather than opening a second card means one box to position, nothing to
      close on a pointer crossing a gap, and no way for two cards to disagree about what is ticked.
  - $type: prop
    name: data-drill-from
    type: string
    observed: true
    kind: style
    description: names the list that was replaced — the breadcrumb's text
  - $type: prop
    name: data-has-value
    type: string
    observed: false
    kind: style
    description: "written BY the menu: the typed value is not empty, so the input's Clear button shows."
  - $type: prop
    name: data-heading
    type: string
    observed: true
    kind: content
    description: optional heading (rendered upper-case at 10/16)
  - $type: prop
    name: data-inline
    type: string
    observed: true
    kind: style
    description: >-
      draw in the FLOW rather than the top layer — the same menu, always open, for a filter PANEL.
      The popover attribute is dropped, so Escape and outside-click no longer apply, and
      show()/hide() become no-ops. TRAP T-an-inline-menu-is-the-same-menu
  - $type: prop
    name: data-mode
    type: string
    observed: true
    kind: style
    description: >-
      FILTER type only: simple | advanced (Will's words). `simple` is a ticked list with a search;
      `advanced` is the And/Or condition rows. An Advanced switch in the header moves between them.
      The old values default | custom | select | condition are read, and rewritten to the new ones.
      TRAP T-a-filter-menu-has-two-modes
  - $type: prop
    name: data-no-select-all
    type: string
    observed: false
    kind: style
    description: >-
      a multi-select list with no Select all row — the Filters menu, where adding every filter at
      once is never the answer. Read when the items stamp.
  - $type: prop
    name: data-op
    type: string
    observed: true
    kind: style
    description: >-
      FILTER type only: which condition is picked. Defaults to `eq`. The FIRST row's op — a menu in
      condition mode holds many.
  - $type: prop
    name: data-readonly
    type: string
    observed: true
    kind: style
    description: >-
      SHOW an answer held elsewhere — rows and conditions inert, no footer, no Add condition, no
      Advanced switch
  - $type: prop
    name: data-removable
    type: string
    observed: true
    kind: style
    description: show a "Remove" button in the footer (after Today); it emits menu-select with value="remove"
  - $type: prop
    name: data-saveable
    type: string
    observed: false
    kind: style
    description: >-
      show a "Save filter" button in the footer; it emits menu-select with value="save". TRAP
      T-save-packs-the-fields-into-one-chip
  - $type: prop
    name: data-search
    type: string
    observed: true
    kind: style
    description: show a search input under the heading that filters the rows
  - $type: prop
    name: data-select
    type: enum
    observed: false
    kind: style
    values:
      - multiple
      - single
    description: multiple  | single (radio rows)
  - $type: prop
    name: data-takes
    type: string
    observed: false
    kind: style
    description: >-
      written BY the menu from data-op: list | text. CSS reads it to reveal the rows or the text
      box.
  - $type: prop
    name: data-type
    type: enum
    observed: true
    kind: style
    values:
      - list
      - calendar
      - filter
    description: >-
      list  | calendar | filter — the Menu set's `Type` axis. `filter` is the FILTER MENU: a
      condition dropdown above the search, and the text box its typing conditions use. One field
      gets one menu whether a chip or a column heading opens it. TRAP T-one-field-one-filter-menu
      TRAP T-an-operator-decides-pick-or-type `calendar` widens the card and lays the LIST region
      out horizontally, so a day grid and a time picker sit side by side. Everything else is the
      same menu.
  - $type: prop
    name: data-value
    type: string
    observed: true
    kind: style
    description: >-
      FILTER type only: what was TYPED under a typing condition. An ATTRIBUTE because a variant
      re-stamp replaces the whole shadow tree, and a value living only in the box is lost.
  - $type: prop
    name: open
    type: boolean
    observed: true
    native: true
    default: false
    description: "native-ish boolean: reflects/controls the popover"
states:
  - $type: state
    name: inline
    selector: ":host([data-inline])"
  - $type: state
    name: heading
    selector: ":host([data-heading])"
  - $type: state
    name: has-header
    selector: ":host([data-has-header])"
  - $type: state
    name: search
    selector: ":host([data-search])"
  - $type: state
    name: filter
    selector: ":host([data-type=\"filter\"])"
  - $type: state
    name: advanced
    selector: ":host([data-mode=\"advanced\"])"
  - $type: state
    name: drill
    selector: ":host([data-drill])"
  - $type: state
    name: clearable
    selector: ":host([data-clearable])"
  - $type: state
    name: removable
    selector: ":host([data-removable])"
  - $type: state
    name: saveable
    selector: ":host([data-saveable])"
  - $type: state
    name: calendar
    selector: ":host([data-type=\"calendar\"])"
  - $type: state
    name: no-matches
    selector: ":host([data-no-matches])"
  - $type: state
    name: commit
    selector: ":host([data-commit])"
  - $type: state
    name: number
    selector: ":host([data-body=\"number\"])"
  - $type: state
    name: date
    selector: ":host([data-body=\"date\"])"
  - $type: state
    name: readonly
    selector: ":host([data-readonly])"
  - $type: state
    name: focus-visible
    selector: .body-number-one:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: >-
      read/write JS properties (values, mode, conditions, op, conditionValue, open, dirty). See
      $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: >-
      callable from a view definition's state block (setCount, show, hide, close, toggle, apply,
      items). See $extensions.sherpa.methods.
events:
  - $type: event
    name: menu-change
    bubbles: true
    composed: true
    detail:
      values: unknown
  - $type: event
    name: change
    bubbles: true
    composed: false
  - $type: event
    name: menu-apply
    bubbles: true
    composed: true
    detail:
      values: unknown
  - $type: event
    name: menu-cancel
    bubbles: true
    composed: true
  - $type: event
    name: menu-clear
    bubbles: true
    composed: true
  - $type: event
    name: menu-select
    bubbles: true
    composed: true
    detail:
      label: string
      value: unknown
  - $type: event
    name: menu-drill
    bubbles: true
    composed: true
    detail:
      value: string
  - $type: event
    name: menu-open
    bubbles: true
    composed: true
  - $type: event
    name: menu-close
    bubbles: true
    composed: true
  - $type: event
    name: condition-change
    bubbles: true
    composed: true
    detail:
      conditions: unknown
      op: unknown
      value: unknown
  - $type: event
    name: filter-mode-change
    bubbles: true
    composed: true
    detail:
      mode: unknown
  - $type: event
    name: menu-range-change
    bubbles: true
    composed: true
    detail:
      range: unknown
  - $type: event
    name: menu-items
    bubbles: true
    composed: true
    detail:
      values: unknown
  - $type: event
    name: menu-back
    bubbles: true
    composed: true
tokens:
  menu.gap: "{sherpa.display-mode-space-xs}"
  menu.padding: "{sherpa.theme-padding-md}"
  menu.padding-block-end: "{sherpa.theme-padding-sm}"
  menu.border-color: "{sherpa.style-border-base}"
  menu.background: "{sherpa.style-surface-base}"
  menu.color: "{sherpa.theme-content-body-base}"
  menu.font-family: "{sherpa.font-family-body}"
  menu.box-shadow: "{sherpa.shadow-md}"
  use-advanced-label.color: "{sherpa.style-content-base}"
  use-advanced-label.font-size: "{sherpa.theme-content-size-base}"
  heading.padding-inline: "{sherpa.theme-padding-none}"
  heading.color: "{sherpa.theme-content-body-1}"
  heading.font-size: "{sherpa.theme-content-size-small}"
  heading.font-weight: "{sherpa.font-weight-regular}"
  heading.line-height: "{sherpa.theme-content-line-height-small}"
  heading.letter-spacing: "{sherpa.theme-content-letter-spacing-xs}"
  remove.--_status-text: "{sherpa.theme-content-critical-1}"
  remove.--_status-border: "{sherpa.theme-border-critical-2}"
  remove.--_status-icon: "{sherpa.theme-content-critical-1}"
  rows.gap: "{sherpa.display-mode-space-2xs}"
  body-number-one.min-block-size: "{sherpa.display-mode-size-2xl}"
  body-number-one.padding: "{sherpa.display-mode-space-2xs}"
  body-number-one.border-color: "{sherpa.style-border-base}"
  body-number-one.border-radius: "{sherpa.display-mode-border-rounding-base}"
  body-number-one.background: "{sherpa.style-surface-base}"
  body-number-one.color: "{sherpa.theme-content-body-1}"
  body-number-one.font-size: "{sherpa.theme-content-size-base}"
  body-range-label.color: "{sherpa.theme-content-body-1}"
  body-range-label.font-size: "{sherpa.theme-content-size-base}"
$extensions:
  sherpa:
    figmaName: Menu
    methods:
      - $type: method
        name: setCount
        args: "value: string, count: number"
        description: Write a child menu's pick count on its row. An empty badge draws nothing.
      - $type: method
        name: show
        args: "trigger?: HTMLElement"
        description: Open the menu under `trigger`, which is also what it measures against.
      - $type: method
        name: hide
        args: ""
      - $type: method
        name: close
        args: ""
      - $type: method
        name: toggle
        args: "trigger?: HTMLElement"
      - $type: method
        name: apply
        args: ""
        description: Commit the draft and close, as the Apply button does.
      - $type: method
        name: items
        args: "next: readonly MenuItem[]"
        description: items([...]) — the SYNCHRONOUS door, for a caller building a detached tree.
    figmaNodeId: "1156:29240"
    category: overlay
    variantAxes:
      - name: Type
        values:
          - List
          - Calendar
    composes:
      - sherpa-input-text
      - sherpa-button
      - sherpa-container-footer
    _divergence:
      nodeId: >-
        49:66174 is now only the Type=List VARIANT; the set moved to 1156:29240 when the Calendar
        variant was added. Older notes cite the variant id.
      calendarWidth: >-
        Figma's Calendar variant measures 562 wide, which is the RESULT of a 7-column grid beside a
        time picker inside 8px padding, and is off the 8px grid. The code hugs its content instead,
        so a calendar with no time picker is narrower rather than half empty.
      heading: >-
        The two variants' headers are exclusive: List holds one TEXT node, Calendar holds
        prev/month/next and no heading. data-heading is still accepted on a calendar menu and moves
        to the card's aria-label.
      time: >-
        The Calendar variant's `list` frame holds a `time-clock` beside the day grid. No code
        counterpart yet; data-has-time renders a native <input type="time"> in the calendar instead.
    jsProps:
      - name: values
        type: string[]
        description: the checked row values (read/write)
        access: read-write
      - name: mode
        type: string
        access: read-write
      - name: conditions
        type: string
        access: read-write
      - name: op
        type: string
        access: read-write
      - name: conditionValue
        type: string
        access: read-write
      - name: open
        type: string
        access: read-write
      - name: dirty
        type: string
        access: read
