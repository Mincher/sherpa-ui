# sherpa-metric — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-metric.{thin.yaml,html,css,ts}. The MECHANICAL surface only —
# props (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# Validated by schemas/component.v1.json; round-trips via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-metric
$description: a KPI tile.
element:
  $type: element
  tag: p
  provides: []
templates:
  - default
anatomy:
  root:
    el: p
    class: label
    part: label
props:
  - $type: prop
    name: data-delta
    type: string
    kind: content
    description: — the change text (e.g. "+12.5%")
  - $type: prop
    name: data-label
    type: string
    kind: content
    description: — the metric name (shown above the value)
  - $type: prop
    name: data-trend
    type: string
    kind: style
    description: >-
      — up | down | flat  (colours the delta + shows the arrow) populate({ name, value, delta,
      values }) fills all of the above; when `values` is present the embedded sparkline is shown and
      fed.
  - $type: prop
    name: data-value
    type: string
    kind: content
    description: — the formatted value string (big number)
states:
  - $type: state
    name: up
    selector: ":host([data-trend=\"up\"])"
  - $type: state
    name: down
    selector: ":host([data-trend=\"down\"])"
  - $type: state
    name: has-values
    selector: ":host([data-has-values])"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
events:
  - $type: event
    name: nothing
    bubbles: true
    composed: true
tokens:
  label.font-size: "{sherpa.font-size-body-base}"
  label.font-weight: "{sherpa.font-weight-semibold}"
  label.color: "{sherpa.theme-content-body-base}"
  row.gap: "{sherpa.display-space-base}"
  figures.gap: "{sherpa.display-space-3xs}"
  value.font-size: "{sherpa.display-fonts-scale-6xl}"
  value.font-weight: "{sherpa.font-weight-bold}"
  value.color: "{sherpa.theme-content-body-base}"
  trend.gap: "{sherpa.display-space-3xs}"
  trend.font-size: "{sherpa.font-size-body-base}"
  arrow.font-size: "{sherpa.font-size-body-small}"
$extensions:
  sherpa:
    figmaName: Metric
    category: content
