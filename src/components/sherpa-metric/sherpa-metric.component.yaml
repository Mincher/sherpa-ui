# sherpa-metric — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-metric.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-metric
$description: a KPI tile.
element:
  $type: element
  tag: p
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: p
      class: label
      part: label
    - el: div
      class: row
      children:
        - el: div
          class: figures
          children:
            - el: p
              class: value
              part: value
            - el: div
              class: trend
              part: trend
              children:
                - el: span
                  class: arrow arrow-up
                  attrs:
                    aria-hidden: "true"
                - el: span
                  class: arrow arrow-down
                  attrs:
                    aria-hidden: "true"
                - el: span
                  class: delta
                  part: delta
        - el: div
          class: spark
          part: spark
          children:
            - el: sherpa-sparkline
props:
  - $type: prop
    name: data-delta
    type: string
    kind: content
    description: — the change text (e.g. "+12.5%")
  - $type: prop
    name: data-label
    type: string
    kind: content
    description: — the metric name (shown above the value)
  - $type: prop
    name: data-trend
    type: string
    kind: style
    description: >-
      — up | down | flat  (colours the delta + shows the arrow) populate({ name, value, delta,
      values }) fills all of the above; when `values` is present the embedded sparkline is shown and
      fed.
  - $type: prop
    name: data-value
    type: string
    kind: content
    description: — the formatted value string (big number)
states:
  - $type: state
    name: up
    selector: ":host([data-trend=\"up\"])"
  - $type: state
    name: down
    selector: ":host([data-trend=\"down\"])"
  - $type: state
    name: has-values
    selector: ":host([data-has-values])"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
events:
  - $type: event
    name: nothing
    bubbles: true
    composed: true
tokens:
  label.font-size: "{sherpa.font-size-body-small}"
  label.font-weight: "{sherpa.font-weight-regular}"
  label.line-height: "{sherpa.theme-content-line-height-small}"
  label.color: "{sherpa.theme-content-body-1}"
  row.gap: "{sherpa.structure-space-gap}"
  row.padding: "{sherpa.structure-space-padding}"
  row.border-radius: "{sherpa.display-mode-border-rounding-lg}"
  row.background: "{sherpa.style-surface-base}"
  figures.gap: "{sherpa.structure-space-gap}"
  value.font-size: "{sherpa.theme-content-size-h1}"
  value.font-weight: "{sherpa.font-weight-semibold}"
  value.line-height: "{sherpa.theme-content-line-height-h1}"
  value.letter-spacing: "{sherpa.theme-content-letter-spacing-h1}"
  value.color: "{sherpa.theme-content-body-base}"
  trend.gap: "{sherpa.display-mode-space-2xs}"
  trend.font-size: "{sherpa.font-size-body-small}"
  trend.line-height: "{sherpa.theme-content-line-height-small}"
  arrow.font-size: "{sherpa.font-size-body-small}"
$extensions:
  sherpa:
    figmaName: Metric
    category: content
