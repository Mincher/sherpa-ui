# sherpa-stack — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-stack.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-stack
$description: a run of controls in one direction, with a token gap.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  root:
    el: div
    class: run
    part: run
    children:
      - slot: ""
        attrs:
          data-accepts: any
props:
  - $type: prop
    name: data-align
    type: enum
    kind: style
    values:
      - start
      - center
      - end
      - stretch
      - between
    description: >-
      start | center | end | stretch  | between — how items sit ACROSS the run (the cross axis),
      except `between`, which spreads them ALONG it
  - $type: prop
    name: data-direction
    type: enum
    kind: style
    values:
      - block
      - inline
    description: block  | inline (a row)
  - $type: prop
    name: data-fill
    type: string
    kind: style
    description: >-
      take the parent's height and hand the spare space to the child marked data-grow. Without it
      the stack is content-height and there is no spare space to give.
  - $type: prop
    name: data-gap
    type: enum
    kind: style
    values:
      - sm
      - md
      - lg
      - xl
      - 2xl
    description: sm (4) | md (8) | lg (12, default) | xl (16) | 2xl (24)
  - $type: prop
    name: data-grow
    type: string
    kind: style
    description: >-
      with data-fill on the stack, this item takes the spare space and the others keep their natural
      size. For a stack inside a fixed-height card — the grid grows, the toolbar above and the pager
      below stay put. TWO attributes rather than one because a stack cannot see its own children
      from CSS: `:host(:has(…))` does not parse, and the chained `:host:has(…)` matches every host
      regardless. So the height is declared on the stack, not detected from it.
  - $type: prop
    name: data-measure
    type: string
    kind: style
    description: "cap the run's width at a reading measure (90ch) and centre it On a CHILD (not on the stack):"
  - $type: prop
    name: data-min-item
    type: string
    kind: style
    default: 200px
    description: "with data-wrap: the floor an item may shrink to"
  - $type: prop
    name: data-scroll
    type: string
    kind: style
    description: >-
      the run scrolls when it is taller than its room, instead of pushing the page. It caps the
      stack at its parent's height, so the parent must have one.
  - $type: prop
    name: data-wrap
    type: string
    kind: style
    description: "inline only: items wrap and share the line"
states:
  - $type: state
    name: inline
    selector: ":host([data-direction=\"inline\"])"
  - $type: state
    name: sm
    selector: ":host([data-gap=\"sm\"])"
  - $type: state
    name: md
    selector: ":host([data-gap=\"md\"])"
  - $type: state
    name: lg
    selector: ":host([data-gap=\"lg\"])"
  - $type: state
    name: xl
    selector: ":host([data-gap=\"xl\"])"
  - $type: state
    name: 2xl
    selector: ":host([data-gap=\"2xl\"])"
  - $type: state
    name: none
    selector: ":host([data-gap=\"none\"])"
  - $type: state
    name: start
    selector: ":host([data-align=\"start\"])"
  - $type: state
    name: center
    selector: ":host([data-align=\"center\"])"
  - $type: state
    name: end
    selector: ":host([data-align=\"end\"])"
  - $type: state
    name: stretch
    selector: ":host([data-align=\"stretch\"])"
  - $type: state
    name: between
    selector: ":host([data-align=\"between\"])"
  - $type: state
    name: scroll
    selector: ":host([data-scroll])"
  - $type: state
    name: measure
    selector: ":host([data-measure])"
  - $type: state
    name: wrap
    selector: ":host([data-wrap])"
  - $type: state
    name: fill
    selector: ":host([data-fill])"
$extensions:
  sherpa:
    figmaName: Stack
    category: container
