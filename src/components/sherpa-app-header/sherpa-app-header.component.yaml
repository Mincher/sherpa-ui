# sherpa-app-header — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-app-header.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-app-header
$description: >-
  The top application header bar: two rows (a back button + breadcrumb trail with trailing app
  actions, then a view icon + title with an embedded quick-filter toolbar) over a thin loading bar.
  Sits in the view frame's header region.
element:
  $type: element
  tag: header
  provides: []
templates:
  - default
anatomy:
  root:
    el: header
    class: bar
    part: bar
    children:
      - el: div
        class: content
        part: content
        children:
          - el: div
            class: row-history
            part: row-history
            children:
              - el: div
                class: history
                part: history
                children:
                  - el: sherpa-button
                    class: back
                    part: back
                    attrs:
                      data-type: icon
                      data-size: xs
                      data-look: transparent
                      data-icon-start: fa-solid fa-arrow-left
                      aria-label: Back
                  - slot: breadcrumbs
              - el: div
                class: actions
                part: actions
                children:
                  - slot: actions
                  - el: sherpa-button
                    class: ai
                    part: ai
                    attrs:
                      data-size: sm
                      data-icon-start: fa-solid fa-wand-magic-sparkles
                    children:
                      - el: span
                        class: ai-label
                  - el: sherpa-button
                    class: labs
                    part: labs
                    attrs:
                      data-type: icon
                      data-size: sm
                      data-look: transparent
                      data-icon-start: fa-solid fa-flask
                      aria-label: Labs
                  - el: span
                    class: divider divider-labs
                    attrs:
                      aria-hidden: "true"
                  - el: sherpa-button
                    class: theme-toggle
                    part: theme-toggle
                    attrs:
                      data-type: icon
                      data-size: sm
                      data-look: transparent
                      data-icon-start: fa-solid fa-moon
                      aria-label: Toggle theme
                  - el: span
                    class: divider divider-tools
                    attrs:
                      aria-hidden: "true"
                  - el: span
                    class: notifications
                    part: notifications
                    children:
                      - el: sherpa-button
                        class: notif-btn
                        part: notif-btn
                        attrs:
                          data-type: icon
                          data-size: sm
                          data-look: transparent
                          data-icon-start: fa-solid fa-bell
                          aria-label: Notifications
                      - el: span
                        class: notif-badge
                        part: notif-badge
                        attrs:
                          aria-hidden: "true"
                  - el: sherpa-button
                    class: account
                    part: account
                    attrs:
                      data-type: icon
                      data-size: sm
                      data-look: transparent
                      data-icon-start: fa-solid fa-user-gear
                      aria-label: Account
                  - el: sherpa-button
                    class: help
                    part: help
                    attrs:
                      data-type: icon
                      data-size: sm
                      data-look: transparent
                      data-icon-start: fa-solid fa-headset
                      aria-label: Support
                  - el: span
                    class: divider divider-menu
                    attrs:
                      aria-hidden: "true"
                  - el: sherpa-button
                    class: menu
                    part: menu
                    attrs:
                      data-type: icon
                      data-size: sm
                      data-look: transparent
                      data-icon-start: fa-solid fa-grip
                      aria-label: Switch app
          - el: div
            class: row-view
            part: row-view
            children:
              - el: div
                class: title-row
                part: title-row
                children:
                  - el: span
                    class: view-icon
                    part: view-icon
                    attrs:
                      aria-hidden: "true"
                  - el: h1
                    class: title
                    part: title
                  - slot: title
              - el: div
                class: filters
                part: filters
                slot: filters
      - el: div
        class: loading-bar
        part: loading-bar
        attrs:
          role: presentation
        children:
          - el: span
            class: loading-fill
props:
  - $type: prop
    name: data-account
    type: string
    kind: style
    description: show the account button
  - $type: prop
    name: data-ai
    type: string
    kind: style
    description: show the "Ask N-zo" AI button
  - $type: prop
    name: data-ai-label
    type: string
    kind: style
    default: "\"Ask N-zo\""
    description: its label
  - $type: prop
    name: data-back
    type: string
    kind: style
    description: show the back button
  - $type: prop
    name: data-heading
    type: string
    kind: style
    description: the view title (row 2)
  - $type: prop
    name: data-help
    type: string
    kind: style
    description: show the support button
  - $type: prop
    name: data-icon
    type: string
    kind: content
    description: the view icon — an FA class list ("fa-solid fa-gauge")
  - $type: prop
    name: data-labs
    type: string
    kind: style
    description: show the labs/beaker button
  - $type: prop
    name: data-loading
    type: string
    kind: style
    description: run the indeterminate loading bar
  - $type: prop
    name: data-menu
    type: string
    kind: style
    description: show the app-switcher button
  - $type: prop
    name: data-notifications
    type: string
    kind: content
    description: unread count — shows the bell + its badge
  - $type: prop
    name: data-theme-toggle
    type: string
    kind: style
    description: show the light/dark (moon) button
  - $type: prop
    name: data-title
    type: string
    kind: style
    description: accepted as an alias for data-heading
states:
  - $type: state
    name: back
    selector: ":host([data-back])"
  - $type: state
    name: ai
    selector: ":host([data-ai])"
  - $type: state
    name: labs
    selector: ":host([data-labs])"
  - $type: state
    name: theme-toggle
    selector: ":host([data-theme-toggle])"
  - $type: state
    name: notifications
    selector: ":host([data-notifications])"
  - $type: state
    name: account
    selector: ":host([data-account])"
  - $type: state
    name: help
    selector: ":host([data-help])"
  - $type: state
    name: menu
    selector: ":host([data-menu])"
  - $type: state
    name: icon
    selector: ":host([data-icon])"
  - $type: state
    name: loading
    selector: ":host([data-loading])"
  - $type: state
    name: not-loading
    selector: ":host(:not([data-loading]))"
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (values). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: breadcrumb-click
    bubbles: true
    composed: true
    detail:
      href: unknown
      index: unknown
      label: unknown
tokens:
  content.gap: "{sherpa.display-mode-space-sm}"
  content.padding: "{sherpa.display-mode-space-xs}"
  row-history.gap: "{sherpa.display-mode-space-xs}"
  row-history.min-block-size: "{sherpa.display-mode-size-lg}"
  history.gap: "{sherpa.display-mode-space-2xs}"
  actions.gap: "{sherpa.display-mode-space-xs}"
  divider.inline-size: "{sherpa.display-mode-border-width-base}"
  divider.block-size: "{sherpa.display-mode-size-sm}"
  divider.background: "{sherpa.theme-border-default-2}"
  notif-badge.inset-block-end: "{sherpa.display-mode-space-sm}"
  notif-badge.inset-inline-start: "{sherpa.display-mode-space-2xs}"
  notif-badge.min-inline-size: "{sherpa.display-mode-size-sm}"
  notif-badge.block-size: "{sherpa.display-mode-size-sm}"
  notif-badge.padding-inline: "{sherpa.display-mode-space-3xs}"
  notif-badge.border-radius: "{sherpa.display-mode-border-rounding-sm}"
  notif-badge.background: "{sherpa.theme-surface-accent-2}"
  notif-badge.color: "{sherpa.theme-content-body-base-fixed}"
  notif-badge.font-family: "{sherpa.font-family-mono}"
  notif-badge.font-size: "{sherpa.theme-content-size-base}"
  notif-badge.font-weight: "{sherpa.font-weight-regular}"
  notif-badge.line-height: "{sherpa.theme-content-line-height-base}"
  notif-badge.box-shadow: "{sherpa.display-mode-size-2xs}"
  row-view.gap: "{sherpa.display-mode-space-2xs}"
  title-row.gap: "{sherpa.display-mode-space-xs}"
  title-row.min-block-size: "{sherpa.display-mode-size-lg}"
  view-icon.inline-size: "{sherpa.theme-size-icon-xs}"
  view-icon.block-size: "{sherpa.theme-size-icon-xs}"
  view-icon.font-size: "{sherpa.theme-size-icon-xs}"
  view-icon.color: "{sherpa.theme-content-body-1}"
  title.font-size: "{sherpa.font-size-body-large}"
  title.font-weight: "{sherpa.font-weight-regular}"
  title.line-height: "{sherpa.theme-content-line-height-large}"
  title.color: "{sherpa.theme-content-body-1}"
  loading-bar.block-size: "{sherpa.display-mode-border-width-lg}"
  loading-fill.background: "{sherpa.theme-surface-active-2}"
$extensions:
  sherpa:
    figmaName: App Header
    category: nav
    booleanProps:
      - hasNotifications
      - hasLoadingBar
    jsProps:
      - name: values
        type: string
        access: read-write
