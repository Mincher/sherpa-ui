# sherpa-app-header — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-app-header.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-app-header
$description: >-
  The top application header bar: two rows (a back button + breadcrumb trail with trailing app
  actions, then a view icon + title with an embedded quick-filter toolbar) over a thin loading bar.
  Sits in the view frame's header region.
element:
  $type: element
  tag: header
  attributes:
    role: banner
  provides: []
templates:
  - default
anatomy:
  root:
    el: header
    class: bar
    part: bar
    attrs:
      role: banner
    children:
      - el: div
        class: content
        part: content
        children:
          - el: div
            class: row-history
            part: history-row
            children:
              - el: div
                class: history
                part: history
                children:
                  - el: button
                    class: back
                    part: back
                    attrs:
                      type: button
                      aria-label: Back
                  - el: div
                    class: breadcrumb
                    part: breadcrumb
                    slot: breadcrumb
              - el: div
                class: actions
                part: actions
                children:
                  - slot: actions
                  - el: span
                    class: divider
                    part: divider
                    attrs:
                      aria-hidden: "true"
                  - el: button
                    class: favorite
                    part: favorite
                    attrs:
                      type: button
                      aria-pressed: "false"
                      aria-label: Favourite
                  - el: button
                    class: export
                    part: export
                    attrs:
                      type: button
                      aria-label: Export
                  - el: span
                    class: notifications
                    part: notifications
                    children:
                      - el: button
                        class: notif-btn
                        part: notif-btn
                        attrs:
                          type: button
                          aria-label: Notifications
                      - el: span
                        class: notif-badge
                        part: notif-badge
                        attrs:
                          role: status
          - el: div
            class: row-view
            part: view-row
            children:
              - el: div
                class: title-row
                part: title-row
                children:
                  - el: span
                    class: view-icon
                    part: view-icon
                    attrs:
                      aria-hidden: "true"
                  - el: h1
                    class: title
                    part: title
              - el: div
                class: filters
                part: filters
                slot: filters
      - el: div
        class: loading-bar
        part: loading-bar
        attrs:
          role: progressbar
          aria-hidden: "true"
        children:
          - el: span
            class: loading-fill
props:
  - $type: prop
    name: data-favorite
    type: string
    kind: content
    default: false
    description: — favourited state (the star toggle)
  - $type: prop
    name: data-heading
    type: string
    kind: content
    description: — the view title (hidden when empty)
  - $type: prop
    name: data-icon
    type: string
    kind: content
    description: — a glyph before the title
  - $type: prop
    name: data-loading
    type: string
    kind: style
    description: — show the loading bar
  - $type: prop
    name: data-notifications
    type: string
    kind: content
    description: — notification count (shows the badge; hidden at 0/unset)
states:
  - $type: state
    name: favorite
    selector: ":host([data-favorite])"
  - $type: state
    name: notifications
    selector: ":host([data-notifications])"
  - $type: state
    name: icon
    selector: ":host([data-icon])"
  - $type: state
    name: loading
    selector: ":host([data-loading])"
  - $type: state
    name: not-loading
    selector: ":host(:not([data-loading]))"
  - $type: state
    name: focus-visible
    selector: .back:focus-visible
events:
  - $type: event
    name: back
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .back
  - $type: event
    name: favorite-toggle
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .favorite
  - $type: event
    name: view-export
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .export
  - $type: event
    name: breadcrumb-click
    bubbles: true
    composed: true
    trigger:
      "on": breadcrumb-select
      node: .breadcrumb
  - $type: event
    name: label
    bubbles: true
    composed: true
  - $type: event
    name: href
    bubbles: true
    composed: true
tokens:
  content.gap: "{sherpa.display-space-sm}"
  content.padding: "{sherpa.display-space-xs}"
  row-history.gap: "{sherpa.display-space-xs}"
  row-history.min-block-size: "{sherpa.display-size-lg}"
  history.gap: "{sherpa.display-space-2xs}"
  actions.gap: "{sherpa.display-space-xs}"
  divider.inline-size: "{sherpa.display-border-width-base}"
  divider.block-size: "{sherpa.display-size-md}"
  divider.background: "{sherpa.style-border-base}"
  back.inline-size: "{sherpa.display-size-lg}"
  back.block-size: "{sherpa.display-size-lg}"
  back.border-radius: "{sherpa.display-border-rounding-base}"
  back.color: "{sherpa.theme-content-body-1}"
  back.font-size: "{sherpa.font-size-body-base}"
  favorite.inline-size: "{sherpa.display-size-lg}"
  favorite.block-size: "{sherpa.display-size-lg}"
  favorite.border-radius: "{sherpa.display-border-rounding-base}"
  favorite.color: "{sherpa.theme-content-body-1}"
  favorite.font-size: "{sherpa.font-size-body-base}"
  export.inline-size: "{sherpa.display-size-lg}"
  export.block-size: "{sherpa.display-size-lg}"
  export.border-radius: "{sherpa.display-border-rounding-base}"
  export.color: "{sherpa.theme-content-body-1}"
  export.font-size: "{sherpa.font-size-body-base}"
  notif-btn.inline-size: "{sherpa.display-size-lg}"
  notif-btn.block-size: "{sherpa.display-size-lg}"
  notif-btn.border-radius: "{sherpa.display-border-rounding-base}"
  notif-btn.color: "{sherpa.theme-content-body-1}"
  notif-btn.font-size: "{sherpa.font-size-body-base}"
  notif-badge.min-inline-size: "{sherpa.display-size-md}"
  notif-badge.block-size: "{sherpa.display-size-md}"
  notif-badge.padding-inline: "{sherpa.display-space-3xs}"
  notif-badge.border-radius: "{sherpa.display-border-rounding-full}"
  notif-badge.background: "{sherpa.theme-surface-default-base}"
  notif-badge.color: "{sherpa.theme-content-body-base-fixed}"
  notif-badge.font-size: "{sherpa.font-size-body-xs}"
  notif-badge.font-weight: "{sherpa.font-weight-semibold}"
  notif-badge.line-height: "{sherpa.display-size-md}"
  row-view.gap: "{sherpa.display-space-sm}"
  title-row.gap: "{sherpa.display-space-xs}"
  view-icon.inline-size: "{sherpa.display-size-md}"
  title.font-size: "{sherpa.font-size-heading-h2}"
  title.font-weight: "{sherpa.font-weight-bold}"
  title.color: "{sherpa.theme-content-body-base}"
  loading-bar.block-size: "{sherpa.display-border-width-lg}"
  loading-fill.background: "{sherpa.display-color-brand-color-3}"
$extensions:
  sherpa:
    figmaName: App Header
    category: nav
    booleanProps:
      - hasNotifications
      - hasLoadingBar
