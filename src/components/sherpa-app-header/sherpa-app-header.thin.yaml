name: sherpa-app-header
figmaName: App Header
category: nav
description: >-
  The top application header bar: two rows (a back button + breadcrumb trail with trailing app
  actions, then a view icon + title with an embedded quick-filter toolbar) over a thin loading bar.
  Sits in the view frame's header region.
generated: false
anatomy:
  bar(header):
    figma:
      node: COMPONENT
      layout: VERTICAL
      fillWidth: true
    children:
      - content(div):
          part: content
          figma:
            node: FRAME
            layout: VERTICAL
          children:
            - row-history(div):
                part: history-row
                figma:
                  node: FRAME
                  layout: HORIZONTAL
                children:
                  - back(button):
                      part: back
                      figma:
                        node: INSTANCE
                        of: Button
                  - breadcrumb(div):
                      slot: breadcrumb
                      figma:
                        node: INSTANCE
                        of: Breadcrumbs
                  - actions(div):
                      slot: actions
                      figma:
                        node: FRAME
                        role: trailing actions (Button + Notif Badge)
            - row-view(div):
                part: view-row
                figma:
                  node: FRAME
                  layout: VERTICAL
                children:
                  - view-icon(span):
                      figma:
                        node: INSTANCE
                        of: view-icon
                  - title(h1):
                      figma:
                        node: TEXT
                        role: title
                  - filters(div):
                      slot: filters
                      figma:
                        node: INSTANCE
                        of: Quick Filter Toolbar
      - loading-bar(div):
          part: loading-bar
          figma:
            node: SLOT
            role: brand-tinted progress line
props:
  data-title:
    $verbatim:
      type: string
      default: null
      kind: content
      description: The view title (hidden when empty).
      figma:
        note: View title text
  data-icon:
    $verbatim:
      type: string
      default: null
      kind: content
      description: A glyph before the title.
      figma:
        node: view-icon
  data-notifications:
    $verbatim:
      type: string
      default: null
      kind: content
      description: Notification count — shows the badge; 0/unset hides it.
      figma:
        boolean: hasNotifications
        node: Notif Badge
  data-loading:
    kind: visibility
    figmaBoolean: hasLoadingBar
    description: Show the loading bar.
  data-favorite:
    $verbatim:
      type: boolean
      default: false
      kind: content
      description: Favourited state (the star toggle).
      figma:
        note: favourite toggle
templates:
  - default
slots:
  breadcrumb:
    accepts:
      - nav
    description: Custom breadcrumb trail (else populate() stamps a sherpa-breadcrumbs).
  actions:
    accepts:
      - control
    description: Trailing app actions (buttons).
  filters:
    accepts:
      - control
    description: View-scope filter toolbar (else populate() stamps a sherpa-quick-filter-toolbar).
events:
  view-header-back:
    description: The back button was pressed.
    $verbatim:
      trigger:
        'on': click
        node: .back
  favorite-toggle:
    description: The favourite star was toggled.
    $verbatim:
      detail:
        favorite: boolean
      trigger:
        'on': click
        node: .favorite
  view-export:
    description: The export action was pressed.
    $verbatim:
      trigger:
        'on': click
        node: .export
  breadcrumb-click:
    description: A breadcrumb was chosen (re-dispatched from the slotted breadcrumbs).
    $verbatim:
      detail:
        index: number
        label: string
        href: string
      trigger:
        'on': breadcrumb-select
        node: .breadcrumb
parts:
  - bar
  - content
  - history-row
  - history
  - back
  - breadcrumb
  - actions
  - divider
  - favorite
  - export
  - notifications
  - notif-btn
  - notif-badge
  - view-row
  - title-row
  - view-icon
  - title
  - filters
  - loading-bar
nested:
  - component: sherpa-breadcrumbs
    relationship: slotted
    role: the breadcrumb trail (populate stamps one)
  - component: sherpa-quick-filter-toolbar
    relationship: slotted
    role: the view-scope filters (populate stamps one)
overrides:
  note: Consumers do not edit library source. They override from outside.
  populate: populate({ breadcrumb, filters }) stamps a sherpa-breadcrumbs + sherpa-quick-filter-toolbar.
  listen: Add view-header-back / favorite-toggle / view-export / breadcrumb-click listeners.
  attributes: Set data-title / data-icon / data-notifications / data-loading / data-favorite directly.
tokens:
  bar.background: surface-primary-base
  content.gap: space-sm
  content.padding: space-xs
  divider.background: border-primary
  notif-badge.background: badge-surface-default
  notif-badge.color: content-title-on-color
  title.color: content-title-base
  loading-fill.background: core-color-brand-base
figmaVerbatim:
  _status: matched
  figmaName: App Header
  nodeType: COMPONENT
  built: true
  booleanProps:
    - hasLoadingBar
    - hasNotifications
  textProps: []
  instanceProps:
    - Button
    - Breadcrumbs
    - Notif Badge
    - view-icon
    - Quick Filter Toolbar
  modePins: {}
  note: >-
    Rebuilt 2026-08-15 to match Figma App Header: two rows (history+actions, view details w/
    embedded Quick Filter Toolbar) + loading bar + notification badge +
    back/favorite/export/breadcrumb events. Was a 3-region flex bar (needs-rebuild).
  figmaEvents: []
