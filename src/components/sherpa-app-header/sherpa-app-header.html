<!--
  sherpa-app-header — the top application header bar.

  Public API:
    data-heading        the Context title (row 2)
    data-no-filters     no filter row: the Context's page holds its filters
                        (a Context's `chrome.filters: false`). TODO 425
    data-icon           the Context icon — an icon name ("gauge")
    data-back           show the back button
    data-ai             show the "Ask N-zo" AI button
    data-ai-label       its label
    data-suggest        show "Suggest filters", beside Ask N-zo. Will, TODO 425
    data-labs           show the labs/beaker button
    data-theme-toggle   show the light/dark (moon) button
    data-theme-mode     light | dark — the mode on screen; the button offers the other
    data-notifications  unread count — shows the bell + its badge
    data-notifications-open  the HOST's panel is open, so the bell wears its
                    open ring. The header emits the intent; the host owns the
                    panel and reports the state back.
                    TRAP T-a-trigger-shows-what-it-opened
    data-account        show the account button
    data-help           show the support button
    data-menu           show the app-switcher button
    data-loading        run the indeterminate loading bar
    data-view-actions   show the View's own actions on the top row, left of Ask
                        N-zo: ★, and Save with Save view as and Delete view.
                        They never move, so they are the header's, not a
                        toolbar's. Will, TODOs 425 G9 and 428
    data-favourite      the ★ is lit — the value, IN
    data-locked         the host owns the ★: report the click, never light it
    data-custom-view    the View on screen is the reader's own: Delete view shows.
                        TRAP T-a-saved-view-is-the-readers-own

  Slots:
    breadcrumbs  the breadcrumb trail (row 1, left)
    actions      extra buttons before the standard action set
    heading      rich Context title (overrides data-heading)
    filters      the quick-filter toolbar (row 2)

  Fires:
    back-click — detail: {}
    ai-click — detail: {}
    ai-filter-request — Suggest filters was pressed. detail: {}
    labs-click — detail: {}
    theme-toggle — detail: {}
    notifications-click — detail: {}
    account-click — detail: {}
    help-click — detail: {}
    menu-click — detail: {}
    view-favorite — the ★ was pressed, a request. detail: { favourite }
    view-save — Save. detail: {}
    view-save-as — Save view as. detail: {}
    view-delete — Delete view, the reader's own View. detail: {}
    nav-menu-request — detail: {}  the mobile nav menu, right of the title.
                    Its button shows where a host sets --sherpa-app-header-nav-menu
    (breadcrumb-select comes from the slotted sherpa-breadcrumbs and already
     bubbles composed, so the header does not re-emit it.)
-->
<template id="default">
  <header class="bar" part="bar">
    <div class="content" part="content">
      <!-- ── Row 1: history, the Context's title, actions ─────────── -->
      <div class="row-history" part="row-history">
        <div class="history" part="history">
          <!-- xs, not sm: the back button belongs to the 16-tall breadcrumb
               line, not the 24-tall actions row. -->
          <sherpa-button class="back" part="back" data-type="icon" data-size="xs"
                         data-look="transparent" data-icon-start="arrow-left"
                         aria-label="Back"></sherpa-button>
          <slot name="breadcrumbs" data-accepts="nav"></slot>
        </div>

        <!-- The Context's icon and title, on the actions' row. Will, TODO 434 -->
        <div class="title-row" part="title-row">
          <span class="context-icon sherpa-icon-box" part="context-icon" aria-hidden="true"></span>
          <h1 class="title sherpa-truncate sherpa-text-large" part="title"></h1>
          <slot name="heading" data-accepts="text"></slot>
          <!-- Where the SHELL says its rail is gone. TRAP T-the-nav-is-a-menu-on-a-phone -->
          <sherpa-button class="nav-menu" part="nav-menu" data-type="icon" data-size="sm"
                         data-look="transparent" data-icon-start="menu"
                         aria-label="Menu" aria-haspopup="dialog"></sherpa-button>
        </div>

        <div class="actions" part="actions">
          <slot name="actions" data-accepts="control"></slot>

          <!-- THE VIEW's own: ★ · Save · ▾ snapped into one box, left of Ask
               N-zo. They never move, so they are the header's. Two drawings, so
               the star fills: TRAP T-favourite-star-swaps-its-glyph. Will, TODO 428 -->
          <span class="view-group sherpa-group" part="view-actions">
            <sherpa-button class="favourite" data-size="sm" data-type="icon"
                           data-group="start" data-icon-start="star"
                           aria-label="Add to Favorites" aria-pressed="false"
                           data-swap-on="data-favourite" data-swap-data-icon-start="star-filled"
                           data-swap-aria-label="Remove from Favorites" data-swap-aria-pressed="true"
                           data-swap-data-status="active"></sherpa-button>
            <sherpa-button class="save" data-size="sm" data-group="mid" data-icon-start="upload">Save</sherpa-button>
            <sherpa-button class="view-more" data-size="sm" data-type="icon" data-group="end"
                           data-icon-start="triangle-down" aria-label="Save view options" aria-haspopup="dialog">
              <sherpa-menu slot="menu" class="view-menu" data-align="end">
                <button type="button" value="save-as">Save view as</button>
                <button type="button" value="delete" class="view-delete" data-status="critical">Delete view</button>
              </sherpa-menu>
            </sherpa-button>
          </span>

          <!-- The one action that is not transparent — the default border sets
               it apart from the icon run beside it. -->
          <sherpa-button class="ai" part="ai" data-size="sm"
                         data-icon-start="wand-magic-sparkles">
            <span class="ai-label">Ask N-zo</span>
          </sherpa-button>
          <!-- Suggest filters: the page's, so the header's, not a toolbar's.
               Bordered, as Ask N-zo is: the two AI actions read as a pair. Will, TODO 425 -->
          <sherpa-button class="suggest" part="suggest" data-type="icon" data-size="sm"
                         data-icon-start="wand-magic-sparkles"
                         aria-label="Suggest filters"></sherpa-button>

          <!-- Order and dividers are Figma's (App Header 150:3690). -->
          <sherpa-button class="labs" part="labs" data-type="icon" data-size="sm"
                         data-look="transparent" data-icon-start="beaker"
                         aria-label="Labs"></sherpa-button>

          <span class="divider divider-labs" aria-hidden="true"></span>

          <sherpa-button class="theme-toggle" part="theme-toggle" data-type="icon" data-size="sm"
                         data-look="transparent" data-icon-start="moon" aria-label="Switch to dark mode"
                         data-swap-on="data-theme-mode=dark" data-swap-data-icon-start="sun"
                         data-swap-aria-label="Switch to light mode"></sherpa-button>

          <span class="divider divider-tools" aria-hidden="true"></span>

          <span class="notifications" part="notifications">
            <!-- `fa-bell`, not `fa-bell-on`: the Pro glyph renders nothing at
                 all in the free webfont — zero width, no warning. -->
            <sherpa-button class="notif-btn" part="notif-btn" data-type="icon" data-size="sm"
                           data-look="transparent" data-icon-start="notifications"
                           aria-label="Notifications"></sherpa-button>
            <sherpa-badge class="notif-badge" part="notif-badge" aria-hidden="true"></sherpa-badge>
          </span>
          <sherpa-button class="account" part="account" data-type="icon" data-size="sm"
                         data-look="transparent" data-icon-start="user-settings"
                         aria-label="Account"></sherpa-button>
          <sherpa-button class="help" part="help" data-type="icon" data-size="sm"
                         data-look="transparent" data-icon-start="headset"
                         aria-label="Support"></sherpa-button>

          <span class="divider divider-menu" aria-hidden="true"></span>

          <sherpa-button class="menu" part="menu" data-type="icon" data-size="sm"
                         data-look="transparent" data-icon-start="drag-handle-horizontal"
                         aria-label="Switch app"></sherpa-button>
        </div>
      </div>

      <!-- ── Row 2: the Context's filters ───────────────────────────── -->
      <div class="row-context" part="row-context">

        <div class="filters" part="filters">
          <slot name="filters" data-accepts="toolbar"></slot>
        </div>
      </div>
    </div>

    <div class="loading-bar" part="loading-bar" role="presentation">
      <span class="loading-fill"></span>
    </div>
  </header>
</template>
