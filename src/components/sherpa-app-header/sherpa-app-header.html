<!--
  sherpa-app-header — the top application header bar.

  Matches the Figma "App Header" (150:3690) exactly. Two stacked rows inside an 8px
  padded content frame (gap 12), on a flat style-surface/base with NO borders:

    Row 1 — History & Actions (space-between, 24 tall)
      left   : back button (16px Transparent icon) + breadcrumbs
      right  : "Ask N-zo" (24-tall default label button, AI icon)
             · divider · chat · beaker · moon
             · divider · notifications · account · help
             · divider · menu
    Row 2 — View Details (gap 12)
      title row : 16px view icon + view title (16/24 regular)
      filters   : the embedded quick-filter toolbar (Type=view)

  Every action button is a 24×24 Transparent icon button (Figma Structure=sm), so
  they are pure chrome until the app wires them. Each is CSS-gated on a data-* flag
  so a product can drop the ones it does not use.

  Public API:
    data-title          the view title (row 2)
    data-icon           the view icon — an FA class list ("fa-regular fa-gauge")
    data-back           show the back button
    data-ai             show the "Ask N-zo" AI button
    data-ai-label       its label (default "Ask N-zo")
    data-chat           show the chat button
    data-labs           show the labs/beaker button
    data-theme-toggle   show the light/dark (moon) button
    data-notifications  unread count — shows the bell + its badge
    data-account        show the account button
    data-help           show the help button
    data-menu           show the overflow menu button
    data-favorite       the view is favourited (fills the star)
    data-loading        run the indeterminate loading bar

  Slots:
    breadcrumbs  the breadcrumb trail (row 1, left)
    actions      extra buttons before the standard action set
    title        rich view title (overrides data-title)
    filters      the quick-filter toolbar (row 2)

  Fires:
    header-back · header-ai · header-chat · header-labs · header-theme
    header-notifications · header-account · header-help · header-menu
    header-favorite — detail: { favorite }
-->
<template id="default">
  <header class="bar" part="bar">
    <div class="content" part="content">
      <!-- ── Row 1: history + actions ─────────────────────────────── -->
      <div class="row-history" part="row-history">
        <div class="history" part="history">
          <button class="btn back" part="back" type="button" aria-label="Back">
            <i class="fa-regular fa-arrow-left" aria-hidden="true"></i>
          </button>
          <slot name="breadcrumbs"></slot>
        </div>

        <div class="actions" part="actions">
          <slot name="actions"></slot>

          <button class="ai" part="ai" type="button">
            <i class="fa-regular fa-wand-magic-sparkles" aria-hidden="true"></i>
            <span class="ai-label">Ask N-zo</span>
          </button>

          <span class="divider divider-ai" aria-hidden="true"></span>

          <button class="btn chat" part="chat" type="button" aria-label="Chat">
            <i class="fa-regular fa-comment" aria-hidden="true"></i>
          </button>
          <button class="btn labs" part="labs" type="button" aria-label="Labs">
            <i class="fa-regular fa-flask" aria-hidden="true"></i>
          </button>
          <button class="btn theme-toggle" part="theme-toggle" type="button" aria-label="Toggle theme">
            <i class="fa-regular fa-moon" aria-hidden="true"></i>
          </button>

          <span class="divider divider-tools" aria-hidden="true"></span>

          <span class="notifications" part="notifications">
            <button class="btn notif-btn" part="notif-btn" type="button" aria-label="Notifications">
              <i class="fa-regular fa-bell" aria-hidden="true"></i>
            </button>
            <span class="notif-badge" part="notif-badge" aria-hidden="true"></span>
          </span>
          <button class="btn account" part="account" type="button" aria-label="Account">
            <i class="fa-regular fa-circle-user" aria-hidden="true"></i>
          </button>
          <button class="btn help" part="help" type="button" aria-label="Help">
            <i class="fa-regular fa-circle-question" aria-hidden="true"></i>
          </button>

          <span class="divider divider-menu" aria-hidden="true"></span>

          <button class="btn menu" part="menu" type="button" aria-label="Menu">
            <i class="fa-regular fa-bars" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <!-- ── Row 2: view details ──────────────────────────────────── -->
      <div class="row-view" part="row-view">
        <div class="title-row" part="title-row">
          <span class="view-icon" part="view-icon" aria-hidden="true"></span>
          <h1 class="title" part="title"></h1>
          <slot name="title"></slot>
          <button class="btn favorite" part="favorite" type="button"
                  aria-pressed="false" aria-label="Favourite this view">
            <i class="fa-regular fa-star" aria-hidden="true"></i>
          </button>
        </div>

        <div class="filters" part="filters">
          <slot name="filters"></slot>
        </div>
      </div>
    </div>

    <div class="loading-bar" part="loading-bar" role="presentation">
      <span class="loading-fill"></span>
    </div>
  </header>
</template>
