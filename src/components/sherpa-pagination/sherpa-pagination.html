<!--
  sherpa-pagination — results-size + page navigation control.

  Two zones on one row:
    results  — a "Rows per page" label + a native <select> for the page size.
    controls — first («) + prev (‹) buttons · a native number <input> for the
               current page · "of N" total text · next (›) + last (») buttons.

  Both native controls are composed directly (progressive enhancement): the
  <select> and <input type="number"> work without JS; JS only reflects state,
  clamps, and emits events. The rows <select> options are stamped from a cloning
  prototype (<template class="rows-opt-tpl">, no id → the base parser ignores it).

  Public API:
    data-page          — current 1-based page (default 1)
    data-total-pages   — total page count (default 1)
    data-page-size     — active rows-per-page value (default first option)
    data-rows-options  — comma list of rows-per-page choices, e.g. "10,25,50"

  Fires:
    page-change       — detail: { page }
    page-size-change  — detail: { pageSize }
-->
<template id="default">
  <div class="pagination" part="pagination">
    <div class="results" part="results">
      <label class="rows-label" for="rows">Rows per page</label>
      <select class="rows" id="rows" part="rows"></select>
    </div>

    <!--
      Read from the Figma node (Pagination 48:65826). The four controls are
      Button instances at Structure=DEFAULT (32×32) pinned Style=Transparent,
      and they sit in TWO SNAPPED PAIRS with the page field between them:

          [ « | ‹ ]   [48px field]  of 10   [ › | » ]

      They were hand-rolled <button>s with pure-CSS chevron glyphs, which is the
      same re-implementation the app header carried: a component that exists,
      written again by hand, free to drift from it.
    -->
    <nav class="controls" part="controls" aria-label="Pagination">
      <span class="pair pair-back sherpa-snap-group">
        <sherpa-button class="btn first" data-action="first" data-type="icon"
                       data-look="transparent" data-snap="right"
                       data-icon-start="fa-solid fa-angles-left"
                       aria-label="First page"></sherpa-button>
        <sherpa-button class="btn prev" data-action="prev" data-type="icon"
                       data-look="transparent" data-snap="left"
                       data-icon-start="fa-solid fa-angle-left"
                       aria-label="Previous page"></sherpa-button>
      </span>

      <input class="page-input sherpa-border-edges" type="number" inputmode="numeric" min="1" step="1"
             part="page-input" aria-label="Page number" />
      <span class="total" part="total" aria-hidden="true">of 1</span>

      <span class="pair pair-fwd sherpa-snap-group">
        <sherpa-button class="btn next" data-action="next" data-type="icon"
                       data-look="transparent" data-snap="right"
                       data-icon-start="fa-solid fa-angle-right"
                       aria-label="Next page"></sherpa-button>
        <sherpa-button class="btn last" data-action="last" data-type="icon"
                       data-look="transparent" data-snap="left"
                       data-icon-start="fa-solid fa-angles-right"
                       aria-label="Last page"></sherpa-button>
      </span>
    </nav>
  </div>

  <template class="rows-opt-tpl">
    <option></option>
  </template>
</template>
