<!--
  sherpa-pagination — results-size + page navigation control.

  The native <select> works without JS; the page box is a Sherpa number field.
  JS only reflects state, clamps, and emits. Rows options stamp from
  <template class="rows-opt-tpl"> — no id, so the base parser ignores it.

  Public API:
    data-page          — current 1-based page (default 1)
    data-total-pages   — total page count (default 1)
    data-page-size     — active rows-per-page value (default first option)
    data-rows-options  — comma list of rows-per-page choices, e.g. "10,25,50"

  Fires:
    page-change       — detail: { page }
    page-size-change  — detail: { pageSize }
-->
<template id="default">
  <div class="pagination" part="pagination">
    <div class="results" part="results">
      <label class="rows-label" for="rows">Rows per page</label>
      <select class="rows" id="rows" part="rows"></select>
    </div>

    <!-- Figma Pagination 48:65826: two snapped Button pairs around the page field. -->
    <nav class="controls" part="controls" aria-label="Pagination">
      <sherpa-group class="pair">
        <sherpa-button class="btn first" data-action="first" data-type="icon"
                       data-look="transparent"
                       data-icon-start="double-chevron-left"
                       aria-label="First page"></sherpa-button>
        <sherpa-button class="btn prev" data-action="prev" data-type="icon"
                       data-look="transparent"
                       data-icon-start="chevron-left"
                       aria-label="Previous page"></sherpa-button>
      </sherpa-group>

      <!-- A Sherpa number field. TRAP T-a-number-input-wears-sherpas-steppers -->
      <sherpa-input-text class="page-input" part="page-input" data-type="number"
                         inputmode="numeric" min="1" step="1"
                         aria-label="Page number"></sherpa-input-text>
      <span class="total" part="total" aria-hidden="true">of 1</span>

      <sherpa-group class="pair">
        <sherpa-button class="btn next" data-action="next" data-type="icon"
                       data-look="transparent"
                       data-icon-start="chevron-right"
                       aria-label="Next page"></sherpa-button>
        <sherpa-button class="btn last" data-action="last" data-type="icon"
                       data-look="transparent"
                       data-icon-start="double-chevron-right"
                       aria-label="Last page"></sherpa-button>
      </sherpa-group>
    </nav>
  </div>

  <template class="rows-opt-tpl">
    <option></option>
  </template>
</template>
