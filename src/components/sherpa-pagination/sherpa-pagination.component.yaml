# sherpa-pagination — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-pagination.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-pagination
$description: page navigation.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: div
      class: pagination
      part: pagination
      children:
        - el: div
          class: results
          part: results
          children:
            - el: label
              class: rows-label
              attrs:
                for: rows
            - el: select
              class: rows
              part: rows
              attrs:
                id: rows
        - el: nav
          class: controls
          part: controls
          attrs:
            aria-label: Pagination
          children:
            - el: span
              class: pair sherpa-group
              children:
                - el: sherpa-button
                  class: btn first
                  attrs:
                    data-action: first
                    data-type: icon
                    data-look: transparent
                    data-group: start
                    data-icon-start: fa-solid fa-angles-left
                    aria-label: First page
                - el: sherpa-button
                  class: btn prev
                  attrs:
                    data-action: prev
                    data-type: icon
                    data-look: transparent
                    data-group: end
                    data-icon-start: fa-solid fa-angle-left
                    aria-label: Previous page
            - el: input
              class: page-input sherpa-border-edges sherpa-border-corners
              part: page-input
              attrs:
                type: number
                inputmode: numeric
                min: "1"
                step: "1"
                aria-label: Page number
            - el: span
              class: total
              part: total
              attrs:
                aria-hidden: "true"
            - el: span
              class: pair sherpa-group
              children:
                - el: sherpa-button
                  class: btn next
                  attrs:
                    data-action: next
                    data-type: icon
                    data-look: transparent
                    data-group: start
                    data-icon-start: fa-solid fa-angle-right
                    aria-label: Next page
                - el: sherpa-button
                  class: btn last
                  attrs:
                    data-action: last
                    data-type: icon
                    data-look: transparent
                    data-group: end
                    data-icon-start: fa-solid fa-angles-right
                    aria-label: Last page
    - el: template
      class: rows-opt-tpl
      children:
        - el: option
props:
  - $type: prop
    name: data-page
    type: string
    observed: true
    kind: style
    default: "1"
    description: — current 1-based page
  - $type: prop
    name: data-page-size
    type: string
    observed: true
    kind: style
    default: first option
    description: — active rows-per-page value
  - $type: prop
    name: data-rows-options
    type: string
    observed: true
    kind: style
    description: — comma list of rows-per-page choices, e.g. "10,25,50"
  - $type: prop
    name: data-total-pages
    type: string
    observed: true
    kind: style
    default: "1"
    description: — total page count
states:
  - $type: state
    name: disabled
    selector: ":host([disabled])"
  - $type: state
    name: focus-visible
    selector: .rows:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (page, totalPages, pageSize). See $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: callable from a view definition's state block (goToPage). See $extensions.sherpa.methods.
events:
  - $type: event
    name: page-change
    bubbles: true
    composed: true
    detail:
      page: unknown
    trigger:
      "on": click
      node: .pager
  - $type: event
    name: page-size-change
    bubbles: true
    composed: true
    detail:
      pageSize: unknown
tokens:
  results.gap: "{sherpa.display-mode-space-xs}"
  total.margin-inline-end: "{sherpa.display-mode-space-xs}"
  pagination.gap: "{sherpa.display-mode-space-base}"
  pagination.padding: "{sherpa.display-mode-space-xs}"
  rows.padding: "{sherpa.theme-padding-sm}"
  rows.background: "{sherpa.theme-surface-default-base}"
  rows.color: "{sherpa.theme-content-body-1}"
  rows.font-size: "{sherpa.font-size-body-base}"
  page-input.padding: "{sherpa.theme-padding-sm}"
  page-input.background: "{sherpa.theme-surface-default-base}"
  page-input.color: "{sherpa.theme-content-body-1}"
  page-input.font-size: "{sherpa.font-size-body-base}"
  rows.padding-inline-end: "{sherpa.structure-space-padding}"
  page-input.margin-inline: "{sherpa.display-mode-space-xs}"
$extensions:
  sherpa:
    figmaName: Pagination
    methods:
      - $type: method
        name: goToPage
        args: "n: number"
        description: Navigate to a page (clamped) and emit page-change if it changed.
    category: control
    booleanProps:
      - hasResults
    jsProps:
      - name: page
        type: number
        description: current page (read/write)
        access: read-write
      - name: totalPages
        type: number
        description: total page count (read/write)
        access: read-write
      - name: pageSize
        type: number
        description: rows per page (read/write)
        access: read-write
