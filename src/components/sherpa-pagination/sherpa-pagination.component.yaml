# sherpa-pagination — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-pagination.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-pagination
$description: page navigation.
element:
  $type: element
  tag: nav
  attributes:
    aria-label: Pagination
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: nav
      class: pager
      part: pager
      attrs:
        aria-label: Pagination
      children:
        - el: button
          class: btn prev
          attrs:
            data-action: prev
            type: button
            aria-label: Previous page
          children:
            - el: span
              class: chev chev-left
              attrs:
                aria-hidden: "true"
        - el: span
          class: numbers
          part: numbers
        - el: button
          class: btn next
          attrs:
            data-action: next
            type: button
            aria-label: Next page
          children:
            - el: span
              class: chev chev-right
              attrs:
                aria-hidden: "true"
    - el: template
      class: num-tpl
      children:
        - el: button
          class: btn num
          attrs:
            data-action: page
            type: button
props:
  - $type: prop
    name: data-current-page
    type: string
    kind: content
    default: "1"
    description: the active 1-based page
  - $type: prop
    name: data-total-pages
    type: string
    kind: content
    default: "1"
    description: — total page count
states:
  - $type: state
    name: focus-visible
    selector: .btn:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (page, totalPages). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: page-change
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .pager
tokens:
  pager.gap: "{sherpa.structure-space-gap}"
  numbers.gap: "{sherpa.structure-space-gap}"
  btn.padding-inline: "{sherpa.structure-space-padding}"
  btn.border-width: "{sherpa.style-border-width}"
  btn.border-radius: "{sherpa.structure-rounding-top-left}"
  btn.font-size: "{sherpa.font-size-body-base}"
  btn.font-weight: "{sherpa.font-weight-medium}"
  btn.color: "{sherpa.theme-content-body-base}"
  gap.color: "{sherpa.theme-content-body-1}"
  chev.border-right: "{sherpa.display-border-width-lg}"
  chev.border-bottom: "{sherpa.display-border-width-lg}"
$extensions:
  sherpa:
    figmaName: Pagination
    category: control
    booleanProps:
      - hasResults
    jsProps:
      - name: page
        type: number
        description: current page (read/write)
        access: read-write
      - name: totalPages
        type: number
        description: total page count (read/write)
        access: read-write
