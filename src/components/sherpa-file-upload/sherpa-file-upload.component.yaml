# sherpa-file-upload — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-file-upload.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-file-upload
$description: drag-and-drop file zone; "browse" triggers the hidden <input type="file">.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: div
      class: field
      part: field
      children:
        - el: span
          class: label
          part: label
        - el: div
          class: drop-zone
          part: drop-zone
          children:
            - el: span
              class: drop-icon
              attrs:
                aria-hidden: "true"
            - el: span
              children:
                - el: button
                  class: browse
                  part: browse
                  attrs:
                    type: button
        - el: div
          class: details
          part: details
          children:
            - el: span
              class: max-size
              part: max-size
            - el: span
              class: allowed-types
              part: allowed-types
        - el: ul
          class: file-list
          part: file-list
        - el: div
          class: actions
          part: actions
          children:
            - slot: actions
            - el: sherpa-button
              class: clear-all
              part: clear-all
              attrs:
                data-size: sm
            - el: sherpa-button
              class: upload
              part: upload
              attrs:
                data-size: sm
                data-look: saturated
        - el: span
          class: helper
          part: helper
    - el: input
      class: file-input
      attrs:
        type: file
        tabindex: "-1"
        aria-hidden: "true"
    - el: template
      class: file-item-tpl
      children:
        - el: li
          class: file-item
          attrs:
            data-index: data-index
          children:
            - el: span
              class: file-icon sherpa-border-corners
              attrs:
                aria-hidden: "true"
            - el: span
              class: file-body
              children:
                - el: span
                  class: file-line
                  children:
                    - el: span
                      class: file-name sherpa-truncate
                      attrs:
                        data-text: name
                    - el: span
                      class: file-size
                - el: span
                  class: file-status
                  part: file-status
            - el: sherpa-button
              class: file-remove
              attrs:
                data-type: icon
                data-size: xs
                data-look: transparent
                data-icon-start: cross
                aria-label: Remove file
props:
  - $type: prop
    name: data-accept
    type: string
    observed: true
    kind: style
    description: comma-separated MIME types / extensions → native accept + hint
  - $type: prop
    name: data-dragover
    type: string
    observed: false
    kind: style
    description: set automatically while a drag is over the zone (CSS hook)
  - $type: prop
    name: data-helper
    type: string
    observed: false
    kind: content
    description: helper text under the list (hidden when empty)
  - $type: prop
    name: data-label
    type: string
    observed: false
    kind: content
    description: label above the drop zone (hidden when empty)
  - $type: prop
    name: data-loading
    type: string
    observed: false
    kind: style
    description: in-flight state (disables the upload button)
  - $type: prop
    name: data-max-size
    type: string
    observed: true
    kind: style
    description: maximum file-size hint (e.g. "4 MB") shown in details
  - $type: prop
    name: data-multiple
    type: string
    observed: true
    kind: style
    description: allow selecting more than one file → native multiple
  - $type: prop
    name: disabled
    type: boolean
    observed: true
    native: true
    default: false
    description: disabled state
states:
  - $type: state
    name: dragover
    selector: ":host([data-dragover])"
  - $type: state
    name: has-files
    selector: ":host([data-has-files])"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
  - $type: state
    name: focus-visible
    selector: .browse:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (files). See $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: callable from a view definition's state block (setFileStatus). See $extensions.sherpa.methods.
events:
  - $type: event
    name: file-add
    bubbles: true
    composed: true
    detail:
      added: unknown
      files: unknown
    trigger:
      "on": drop
      node: .drop-zone
  - $type: event
    name: file-remove
    bubbles: true
    composed: true
    detail:
      files: unknown
      removed: unknown
    trigger:
      "on": click
      node: .file-remove
  - $type: event
    name: file-clear
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .clear-all
  - $type: event
    name: file-upload-start
    bubbles: true
    composed: true
    detail:
      files: unknown
    trigger:
      "on": click
      node: .upload
  - $type: event
    name: files-change
    bubbles: true
    composed: true
    detail:
      files: unknown
    trigger:
      "on": change
      node: .file-input
tokens:
  field.gap: "{sherpa.display-mode-space-sm}"
  label.font-size: "{sherpa.font-size-body-base}"
  label.font-weight: "{sherpa.font-weight-semibold}"
  label.color: "{sherpa.theme-content-body-base}"
  helper.font-size: "{sherpa.font-size-body-small}"
  helper.color: "{sherpa.theme-content-body-1}"
  drop-zone.gap: "{sherpa.display-mode-space-xs}"
  drop-zone.padding: "{sherpa.display-mode-space-lg}"
  drop-zone.border-width: "{sherpa.display-mode-border-width-base}"
  drop-zone.border-color: "{sherpa.theme-border-active-2}"
  drop-zone.border-radius: "{sherpa.display-mode-border-rounding-base}"
  drop-zone.color: "{sherpa.theme-content-body-1}"
  drop-zone.font-size: "{sherpa.font-size-body-base}"
  drop-icon.font-size: "{sherpa.theme-content-size-base}"
  drop-icon.color: "{sherpa.theme-content-body-1}"
  browse.color: "{sherpa.theme-content-body-1}"
  browse.font-weight: "{sherpa.font-weight-medium}"
  file-list.gap: "{sherpa.display-mode-space-2xs}"
  file-item.gap: "{sherpa.display-mode-space-xs}"
  file-item.color: "{sherpa.theme-content-body-1}"
  file-item.font-size: "{sherpa.font-size-body-base}"
  file-item.line-height: "{sherpa.theme-content-line-height-base}"
  file-icon.inline-size: "{sherpa.theme-size-icon-xl}"
  file-icon.block-size: "{sherpa.theme-size-icon-xl}"
  file-icon.margin-inline-end: "{sherpa.display-mode-space-2xs}"
  file-icon.border-width: "{sherpa.display-mode-border-width-base}"
  file-icon.border-color: "{sherpa.theme-border-default-2}"
  file-icon.color: "{sherpa.theme-content-body-1}"
  file-icon.font-size: "{sherpa.theme-content-size-base}"
  file-body.gap: "{sherpa.display-mode-space-3xs}"
  file-line.gap: "{sherpa.display-mode-space-xs}"
  file-size.color: "{sherpa.theme-content-body-1}"
  file-size.font-size: "{sherpa.font-size-body-small}"
  file-size.line-height: "{sherpa.theme-content-line-height-small}"
  file-status.font-size: "{sherpa.font-size-body-small}"
  file-status.line-height: "{sherpa.theme-content-line-height-small}"
  file-status.color: "{sherpa.theme-content-body-1}"
  max-size.font-size: "{sherpa.font-size-body-small}"
  max-size.line-height: "{sherpa.theme-content-line-height-small}"
  max-size.color: "{sherpa.theme-content-body-1}"
  allowed-types.font-size: "{sherpa.font-size-body-small}"
  allowed-types.line-height: "{sherpa.theme-content-line-height-small}"
  allowed-types.color: "{sherpa.theme-content-body-1}"
  actions.gap: "{sherpa.display-mode-space-base}"
$extensions:
  sherpa:
    figmaName: File Uploader
    methods:
      - $type: method
        name: setFileStatus
        args: "index: number, status: string"
        description: Set a per-file status line (e.g. "Uploading…", "Uploaded", "Failed").
    category: control
    jsProps:
      - name: files
        type: File[]
        access: read
