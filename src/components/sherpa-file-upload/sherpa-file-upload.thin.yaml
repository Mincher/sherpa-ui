name: sherpa-file-upload
figmaName: File Uploader
category: control
description: >-
  A drag-and-drop file selection zone: a drop area, a details block (max size + allowed types), a
  file list (name + size + status + remove), and an actions row (clear-all + upload).
generated: false
props:
  data-label:
    kind: content
  data-helper:
    kind: content
  data-accept:
    kind: content
  data-multiple:
    kind: style
  disabled:
    kind: style
slots:
  actions:
    accepts:
      - control
    description: Extra controls in the actions row (before clear/upload).
events:
  file-add:
    description: Files were added (dropped or picked).
    $verbatim:
      detail:
        added: File[]
        files: File[]
      trigger:
        'on': drop
        node: .drop-zone
  file-remove:
    description: A file was removed from the list.
    $verbatim:
      detail:
        removed: File
        files: File[]
      trigger:
        'on': click
        node: .file-remove
  file-clear:
    description: The clear-all button emptied the list.
    $verbatim:
      trigger:
        'on': click
        node: .clear-all
  file-upload-start:
    description: The upload button started an upload of the current files.
    $verbatim:
      detail:
        files: File[]
      trigger:
        'on': click
        node: .upload
  files-change:
    description: The file list changed (kept for back-compat).
    $verbatim:
      detail:
        files: File[]
      trigger:
        'on': change
        node: .file-input
parts:
  - field
  - label
  - drop-zone
  - file-list
  - helper
