<!--
  sherpa-filter-panel — the filter toolbars, as a column.

  A SIBLING of sherpa-quick-filter-toolbar over the same DataSource, never a
  reader of one: it takes the same filter definitions and emits the same
  `quick-filter-change`. TRAP T-the-panel-is-the-toolbar-in-a-column

  One accordion per SCOPE. Inside each, a field is a section header with its
  own actions above a wrapping run of boolean chips — one per value. ONE search.
  NO footer: a change applies as it is made. Over a REMOTE source a changed
  field shows its own Apply and Discard. Will, 2026-09-27 (TODO 62).

      const panel = document.querySelector('sherpa-filter-panel');
      panel.populate([
        { scope: 'view', label: 'View filters', filters: [...] },
        { scope: 'data', label: 'Customer records', filters: [...] },
      ]);
      source.bind(panel, { steerOnly: true });

  Public API:
    data-heading    the panel's own title (default "Filters")
    data-limit-options  on | off — the host offers "Limit matching filters": its
                    ⋮ menu holds the switch. Written by the provider. TODO 178.
    open            the panel is showing. A host writes it; the panel reports
                    `filter-panel-close` and never hides itself. Where there is
                    no room, the app shell says so. TRAP T-the-panel-is-desktop-only
    data-locked     the source owns the state — report, never set
    data-sort-field / data-sort-direction   the sort in force. Written by the
                    source; the Sort chip shows it.
    data-group-field  the group in force. Written by the source; the Group
                    chip shows it. TRAP T-a-panel-follows-the-query-open-or-shut
    data-saveable   the host SAVES filters: a scope with an answered field
                    offers "Save filter", and a reader's own saved preset
                    opens Edit filter and Delete filter — each asked for.
                    TRAP T-the-panel-saves-a-whole-scope
    data-remote     its source fetches from outside the data layer, so a
                    change waits for its field's Apply. Set by a bound source.
    data-pending    the FIELDS changed and not yet applied, space-separated.
                    Set by a bound source; each shows Apply and Discard.

  Slots:
    (default)   extra content under the scopes

  Fires:
    quick-filter-change — one field changed, or Reset all. detail: { scope, readings, values, picked }
    filter-apply — a changed field's Apply, remote only. detail: { scope, id, field }
    filter-discard — a changed field's Discard, remote only. detail: { scope, id, field }
    filter-panel-close — it closed. detail: { reason: reader | width | page } — only a reader's is a choice
    filter-add-request — the Filters menu committed, or a field sent up or down. detail: { scope, ids, from? }
    filter-remove — a field's Remove. detail: { scope, id }
    group-change — a Group chip or Reset all, with its scope. detail: { field, scope }
    sort-change — a Sort chip or Reset all, with its scope. detail: { field, direction, scope }
    filter-save — a scope's Save filter, or a saved filter's change saved. detail: { scope, readings, id?, label? }
    filter-edit — a saved preset's Edit filter. detail: { scope, id }
    filter-delete — a saved preset's Delete filter. detail: { scope, id }
    preset-edit — a saved preset's rows changed. detail: { scope, id, readings } — null puts the saved one back
    view-reset — Reset all to default: put back the View's own filters, in every scope. Cancelable
    limit-options-change — the ⋮ menu's "Limit matching filters". detail: { on }
-->
<template id="default">
  <!-- A CONTAINER, not a sherpa-panel: a panel draws LEFT and RIGHT edges only
       because it is built to sit flush BETWEEN in-flow surfaces, so it has no
       top, no bottom and no rounding. This is a standalone card beside the
       content. A container is one, and it supplies its composed footer's
       `--_pad-inline` already.
       TRAP T-a-panel-flush-between-surfaces-draws-two-edges -->
  <sherpa-container class="panel" part="panel" data-padding="none">
    <sherpa-container-header slot="header" class="head" part="head"
                             data-icon="filter">
      <!-- BOTH scopes at once, applied as the toolbar's Reset is. Both header
           buttons wear the DEFAULT look. Will, 2026-09-26. -->
      <!-- …and its menu: Reset all to default. TRAP T-reset-to-default-is-the-views-own -->
      <!-- ONE Filters menu, for every scope: what each holds, then what may be
           added — each row says its scope. The SAME button a toolbar shows,
           attribute for attribute. Will, TODO 124. TRAP T-the-add-menu-is-the-whole-list -->
      <sherpa-button slot="actions" class="filters-btn" part="filters" data-size="sm"
                     data-icon-start="plus" data-icon-end="triangle-down"
                     aria-haspopup="dialog">Filters</sherpa-button>
      <span slot="actions" class="reset-group sherpa-group">
        <sherpa-button class="reset-all" part="reset-all" data-size="sm" data-group="start"
                       data-icon-start="arrow-rotate-left"
                       aria-label="Reset all filters">Reset</sherpa-button>
        <sherpa-button class="reset-more" part="reset-more" data-type="icon" data-size="sm"
                       data-group="end" data-icon-start="triangle-down"
                       aria-label="Reset options" aria-haspopup="dialog">
          <sherpa-menu slot="menu" data-align="end">
            <button type="button" value="reset-default">Reset all to default</button>
          </sherpa-menu>
        </sherpa-button>
      </span>
      <!-- The HOST's buttons — the page's switch back to the toolbars is one.
           TRAP T-the-mode-switch-is-the-pages-own -->
      <slot name="actions" slot="actions"></slot>
      <!-- ⋮ — what folded away for want of room, then the host's own option.
           Will, TODO 178. TRAP T-the-more-menu-holds-what-folded -->
      <sherpa-button slot="actions" class="more-btn" part="more" data-type="icon" data-size="sm"
                     data-icon-start="ellipses-vertical"
                     aria-label="More actions" aria-haspopup="dialog"></sherpa-button>
      <!-- ONE search, across every field's name and every value in the panel.
           The metadata row is the header's own bottom row, so it spans the
           full width. -->
      <sherpa-input-text slot="metadata" class="search" part="search"
                         data-icon-start="magnifying-glass" data-clearable
                         placeholder="Search filters" autocomplete="off"
                         aria-label="Search every filter"></sherpa-input-text>
    </sherpa-container-header>

    <div class="scopes" part="scopes"></div>
    <slot></slot>

  </sherpa-container>
  <!-- THE ⋮ MENU: built on each open, as the toolbar's is. -->
  <sherpa-menu class="more-menu" data-align="end"></sherpa-menu>
  <template class="more-item-tpl">
    <button class="more-item" type="button"><span class="more-label"></span></button>
  </template>
  <template class="more-divider-tpl"><hr class="more-divider" /></template>
  <template class="more-check-tpl">
    <label class="menu-row more-check"><input type="checkbox" value="limit-options" /><span class="menu-row-label">Limit matching filters</span></label>
  </template>

  <!-- A saved filter's field, opened to change it — outside the scopes, so
       no field hears it as its own. TRAP T-a-saved-filter-keeps-its-edit -->
  <div class="editor"></div>

  <!-- PROTOTYPES. Every element the panel will ever show exists here from the
       start; JS clones, it never createElement()s. -->
  <template class="scope-tpl">
    <sherpa-accordion class="scope" open>
      <!-- NOTHING in the header: a summary is a button, and a button may not
           hold buttons. The scope's Save is the FIRST ROW of its body.
           TRAP T-an-accordion-action-is-not-a-toggle -->
      <div class="scope-acts">
        <!-- The whole scope as ONE saved filter. TRAP T-the-panel-saves-a-whole-scope -->
        <sherpa-button class="scope-save" data-size="sm">Save filter</sherpa-button>
      </div>
    </sherpa-accordion>
  </template>

  <template class="field-tpl">
    <!-- A FIELD: its header — the label, and its buttons at the right — then
         its chips or its body. Will, 2026-09-26. -->
    <div class="field">
      <sherpa-section-header class="field-head" data-size="sm" data-divider="none">
        <!-- The title, then the rows its answer matches — the chip's badge,
             for a field no single chip stands for. Will, TODO 133. -->
        <span slot="heading" class="field-lead">
          <!-- The TYPE SCALE's small class, in caps and light, as a metric's title. -->
          <h3 class="field-title sherpa-text-small"></h3>
          <!-- role=img so its aria-label is said, as the chip's count is. -->
          <sherpa-badge class="field-results" role="img"></sherpa-badge>
        </span>
        <!-- DEFAULT look. No Remove: the scope's Add menu is the whole list. -->
        <span slot="actions" class="field-acts">
          <!-- Clear and Send to, as ONE control. Will, TODO 121. -->
          <span class="field-group sherpa-group">
            <sherpa-button class="field-clear" data-type="icon" data-size="sm"
                           data-icon-start="arrow-rotate-left"></sherpa-button>
            <!-- A component's field, SENT UP to the View's filters. TRAP T-send-to-view-filters -->
            <sherpa-button class="field-raise" data-type="icon" data-size="sm"
                           data-icon-start="arrow-up"></sherpa-button>
            <!-- …and a View field, SENT DOWN to the scope it came from. TODO 120. -->
            <sherpa-button class="field-lower" data-type="icon" data-size="sm"
                           data-icon-start="arrow-down"></sherpa-button>
          </span>
          <!-- REMOTE only, once changed. DISCARD goes back to the last Apply. -->
          <sherpa-button class="field-discard" data-type="icon" data-size="sm"
                         data-icon-start="cross" aria-label="Discard"></sherpa-button>
          <sherpa-button class="field-apply" data-type="icon" data-size="sm"
                         data-icon-start="tick" aria-label="Apply"></sherpa-button>
          <!-- ADVANCED: f(x), at the header's end, ON in Advanced. Will, TODO 141. -->
          <sherpa-button class="field-advanced" data-type="icon" data-size="sm"
                         data-icon-start="function" aria-pressed="false"></sherpa-button>
        </span>
      </sherpa-section-header>
      <!-- `hug`: each chip at its own width. Every other value STRETCHES its
           items to share the line, which makes a chip read as a button. -->
      <sherpa-stack class="field-values" data-direction="inline" data-gap="sm"
                    data-wrap data-min-item="hug" data-align="start"></sherpa-stack>
      <!-- WHERE A MENU GOES. A condition, a number or a range is answered by
           the field's own menu body, drawn inline — not by a second copy of
           each control. TRAP T-an-inline-menu-is-the-same-menu -->
      <div class="field-body" part="field-body"></div>
    </div>
  </template>

  <template class="value-tpl">
    <sherpa-quick-filter class="value"></sherpa-quick-filter>
  </template>

  <!-- A View field more than one scope may take: its Send down button opens
       them, a row each. TRAP T-send-to-view-filters -->
  <template class="lower-menu-tpl">
    <sherpa-menu slot="menu" data-align="end"></sherpa-menu>
  </template>
  <template class="lower-item-tpl">
    <button type="button" class="lower-item"></button>
  </template>

  <!-- A saved preset's menu: its conditions, as lines, stamped above these —
       and the reader's OWN keeps its actions; Save and Discard only while it
       holds a change. TRAP T-a-saved-chip-lists-its-conditions
       TRAP T-the-panel-saves-a-whole-scope · TRAP T-a-saved-filter-keeps-its-edit -->
  <template class="saved-menu-tpl">
    <sherpa-menu slot="menu" data-no-select-all>
      <hr class="saved-own" />
      <button type="button" class="saved-edit" value="save-edit">Save filter</button>
      <button type="button" class="saved-edit" value="discard-edit">Discard changes</button>
      <button type="button" class="saved-own" value="edit">Edit filter</button>
      <button type="button" class="saved-own" value="delete">Delete filter</button>
    </sherpa-menu>
  </template>

  <!-- A field a higher scope holds: the line under its heading. -->
  <template class="applied-tpl">
    <span slot="description" class="field-applied sherpa-text-small"></span>
  </template>

  <!-- A scope with nothing to draw says so; empty, it reads as broken. -->
  <template class="empty-tpl">
    <sherpa-section-header class="scope-empty" data-size="sm" data-divider="none"
                           data-heading="No filters here yet"></sherpa-section-header>
  </template>
</template>
