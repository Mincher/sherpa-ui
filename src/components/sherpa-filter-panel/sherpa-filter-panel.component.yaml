# sherpa-filter-panel — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-filter-panel.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-filter-panel
$description: the filter toolbars, as a column.
element:
  $type: element
  tag: sherpa-container
  attributes:
    data-padding: none
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: sherpa-container
      class: panel
      part: panel
      attrs:
        data-padding: none
      children:
        - el: sherpa-container-header
          class: head
          part: head
          attrs:
            slot: header
            data-icon: filter
          children:
            - el: span
              class: reset-group sherpa-group
              attrs:
                slot: actions
              children:
                - el: sherpa-button
                  class: reset-all
                  part: reset-all
                  attrs:
                    data-size: sm
                    data-group: start
                    data-icon-start: arrow-rotate-left
                    aria-label: Reset all filters
                - el: sherpa-button
                  class: reset-more
                  part: reset-more
                  attrs:
                    data-type: icon
                    data-size: sm
                    data-group: end
                    data-icon-start: triangle-down
                    aria-label: Reset options
                    aria-haspopup: dialog
                  children:
                    - el: sherpa-menu
                      attrs:
                        slot: menu
                        data-align: end
                      children:
                        - el: button
                          attrs:
                            type: button
                            value: reset-default
            - slot: actions
              attrs:
                slot: actions
            - el: sherpa-input-text
              class: search
              part: search
              attrs:
                slot: metadata
                data-icon-start: magnifying-glass
                data-clearable: ""
                placeholder: Search filters
                autocomplete: "off"
                aria-label: Search every filter
        - el: div
          class: scopes
          part: scopes
        - slot: ""
    - el: template
      class: scope-tpl
      children:
        - el: sherpa-accordion
          class: scope
          attrs:
            open: ""
          children:
            - el: span
              class: scope-actions
              attrs:
                slot: actions
              children:
                - el: sherpa-button
                  class: scope-add
                  attrs:
                    data-size: sm
                    data-icon-start: plus
                    data-icon-end: triangle-down
                    aria-haspopup: dialog
                - el: sherpa-button
                  class: scope-save
                  attrs:
                    data-size: sm
props:
  - $type: prop
    name: data-group-field
    type: string
    observed: true
    kind: style
    description: >-
      the group in force. Written by the source; the Group chip shows it. TRAP
      T-a-panel-follows-the-query-open-or-shut
  - $type: prop
    name: data-heading
    type: string
    observed: true
    kind: style
    default: "\"Filters\""
    description: the panel's own title
  - $type: prop
    name: data-locked
    type: string
    observed: false
    kind: style
    description: the source owns the state — report, never set
  - $type: prop
    name: data-min-width
    type: string
    observed: false
    kind: style
    default: "1280"
    description: >-
      the width below which the panel refuses to show, in px . Filtering goes back to the toolbars
      there.
  - $type: prop
    name: data-pending
    type: string
    observed: false
    kind: style
    description: >-
      the FIELDS changed and not yet applied, space-separated. Set by a bound source; each shows
      Apply and Discard.
  - $type: prop
    name: data-remote
    type: string
    observed: false
    kind: style
    description: >-
      its source fetches from outside the data layer, so a change waits for its field's Apply. Set
      by a bound source.
  - $type: prop
    name: data-saveable
    type: string
    observed: true
    kind: style
    description: >-
      the host SAVES filters: a scope with an answered field offers "Save filter", and a reader's
      own saved preset opens Edit filter and Delete filter — each asked for. TRAP
      T-the-panel-saves-a-whole-scope
  - $type: prop
    name: data-sort-direction
    type: string
    observed: true
    kind: style
    description: the sort in force. Written by the source; the Sort chip shows it.
  - $type: prop
    name: data-sort-field
    type: string
    observed: true
    kind: style
    description: the sort in force. Written by the source; the Sort chip shows it.
  - $type: prop
    name: open
    type: string
    observed: true
    native: true
    description: >-
      the panel is showing. A host writes it; the panel reports `filter-panel-close` and never hides
      itself, except below its breakpoint. TRAP T-the-panel-is-desktop-only
states:
  - $type: state
    name: remote
    selector: ":host([data-remote])"
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (values, readings, open). See $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: >-
      callable from a view definition's state block (setFieldReading, drawReading, drawResults,
      show, hide, close, toggle, drawScopes). See $extensions.sherpa.methods.
events:
  - $type: event
    name: quick-filter-change
    bubbles: true
    composed: true
    detail:
      picked: unknown
      readings: unknown
      scope: string
      values: unknown
  - $type: event
    name: filter-apply
    bubbles: true
    composed: true
  - $type: event
    name: filter-discard
    bubbles: true
    composed: true
  - $type: event
    name: filter-panel-close
    bubbles: true
    composed: true
    detail:
      reason: unknown
  - $type: event
    name: filter-add-request
    bubbles: true
    composed: true
    detail:
      from: unknown
      ids: unknown
      scope: unknown
  - $type: event
    name: filter-remove
    bubbles: true
    composed: true
    detail:
      id: unknown
      scope: unknown
  - $type: event
    name: group-change
    bubbles: true
    composed: true
    detail:
      field: unknown
      scope: unknown
  - $type: event
    name: sort-change
    bubbles: true
    composed: true
    detail:
      direction: string
      field: unknown
      scope: unknown
  - $type: event
    name: filter-save
    bubbles: true
    composed: true
    detail:
      readings: unknown
      scope: unknown
  - $type: event
    name: filter-edit
    bubbles: true
    composed: true
  - $type: event
    name: filter-delete
    bubbles: true
    composed: true
  - $type: event
    name: view-reset
    bubbles: true
    composed: true
  - $type: event
    name: filter-condition-change
    bubbles: true
    composed: true
    detail:
      id: unknown
      mode: unknown
      scope: unknown
  - $type: event
    name: filter-panel-reopen
    bubbles: true
    composed: true
  - $type: event
    name: menu-change
    bubbles: true
    composed: true
tokens:
  field.row-gap: "{sherpa.display-mode-space-xs}"
  field-lead.gap: "{sherpa.display-mode-space-xs}"
  field-title.color: "{sherpa.style-content-secondary}"
  field-title.font-weight: "{sherpa.font-weight-light}"
  field-acts.gap: "{sherpa.display-mode-space-2xs}"
  scope-actions.gap: "{sherpa.display-mode-space-2xs}"
$extensions:
  sherpa:
    methods:
      - $type: method
        name: setFieldReading
        args: "id: string, given: FieldReading, scope?: string"
        description: >-
          setFieldReading(id, reading) — steer ONE field with a whole reading: what another control
          set while the panel shows. SILENT, like every steer, and it is that field's last Apply
          now, so Discard keeps it. A field drawn as one chip — Group, Sort, a date — is left alone.
      - $type: method
        name: drawReading
        args: "field: string, reading: FieldReading, scope: string"
        description: >-
          drawReading(field, reading, scope) — a bound source tells the panel one field's answer, in
          the scope that holds it. OPEN OR SHUT: a shut panel that skipped this opened on an old
          answer, and its next report wrote that answer back over the Query.
      - $type: method
        name: drawResults
        args: "results: Readonly<Record<string, number>>, scope?: string"
        description: >-
          drawResults(results, scope) — a bound source tells the panel the rows each answer in a
          scope matches, by field or saved-filter id. A field drawn as ONE chip, and a saved
          filter's chip, wear it; a field drawn as a run or a body has no one chip, so its HEADER
          wears it. SILENT.
      - $type: method
        name: show
        args: ""
        description: Show the panel, unless the window is too narrow.
      - $type: method
        name: hide
        args: "reason: 'reader' | 'width' | 'page' = 'reader'"
        description: >-
          EVERY close reports, and says why. The width path called this directly while only the
          header button emitted, so a narrow window left the panel gone and the host still in panel
          mode — no toolbars, no panel.
      - $type: method
        name: close
        args: "reason: 'reader' | 'width' | 'page' = 'reader'"
        description: "`hide()`, in the spelling every surface keeps."
      - $type: method
        name: toggle
        args: ""
      - $type: method
        name: drawScopes
        args: "scopes: readonly ScopeDescription[]"
        description: >-
          The source draws each scope WHOLE — what it holds and answers, what it may add, how its
          rows are arranged. A saved filter is one question answered yes or no; a date is one chip,
          its menu a calendar.
    jsProps:
      - name: values
        type: string
        access: read
      - name: readings
        type: string
        access: read
      - name: open
        type: string
        access: read-write
