# sherpa-filter-panel — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-filter-panel.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-filter-panel
$description: the filter toolbars, as a column.
element:
  $type: element
  tag: sherpa-container
  attributes:
    data-padding: none
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: sherpa-container
      class: panel
      part: panel
      attrs:
        data-padding: none
      children:
        - el: sherpa-container-header
          class: head
          part: head
          attrs:
            slot: header
            data-icon: filter
          children:
            - el: sherpa-button
              class: to-toolbars
              part: to-toolbars
              attrs:
                slot: actions
                data-type: icon
                data-size: sm
                data-look: transparent
                data-icon-start: sidebar
                aria-label: Filter in the toolbars instead
            - el: sherpa-input-text
              class: search
              part: search
              attrs:
                slot: metadata
                data-icon-start: magnifying-glass
                data-clearable: ""
                placeholder: Search filters
                autocomplete: "off"
                aria-label: Search every filter
        - el: div
          class: scopes
          part: scopes
        - slot: ""
        - el: sherpa-container-footer
          class: foot
          part: foot
          attrs:
            slot: footer
            data-align: end
          children:
            - el: sherpa-button
              class: discard
              part: discard
            - el: sherpa-button
              class: apply
              part: apply
              attrs:
                data-look: saturated
    - el: template
      class: scope-tpl
      children:
        - el: sherpa-accordion
          class: scope
          attrs:
            open: ""
          children:
            - el: span
              class: scope-actions
              attrs:
                slot: actions
              children:
                - el: sherpa-button
                  class: scope-add
                  attrs:
                    data-size: sm
                    data-icon-end: triangle-down
                    aria-haspopup: menu
props:
  - $type: prop
    name: data-heading
    type: string
    observed: true
    kind: style
    default: "\"Filters\""
    description: the panel's own title
  - $type: prop
    name: data-locked
    type: string
    observed: false
    kind: style
    description: the source owns the state — report, never set
  - $type: prop
    name: data-min-width
    type: string
    observed: false
    kind: style
    default: "1280"
    description: >-
      the width below which the panel refuses to show, in px . Filtering goes back to the toolbars
      there.
  - $type: prop
    name: data-open
    type: string
    observed: true
    kind: style
    description: >-
      the panel is showing. A host writes it; the panel reports `filter-panel-close` and never hides
      itself, except below its breakpoint. TRAP T-the-panel-is-desktop-only
states:
  - $type: state
    name: open
    selector: ":host([data-open])"
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (values, readings). See $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: >-
      callable from a view definition's state block (open, close, toggle). See
      $extensions.sherpa.methods.
events:
  - $type: event
    name: quick-filter-change
    bubbles: true
    composed: true
    detail:
      picked: unknown
      readings: unknown
      scope: string
      values: unknown
  - $type: event
    name: filter-panel-close
    bubbles: true
    composed: true
    detail:
      reason: unknown
  - $type: event
    name: filter-add-request
    bubbles: true
    composed: true
    detail:
      ids: unknown
      scope: unknown
  - $type: event
    name: filter-remove
    bubbles: true
    composed: true
    detail:
      id: unknown
      scope: unknown
  - $type: event
    name: group-change
    bubbles: true
    composed: true
  - $type: event
    name: sort-change
    bubbles: true
    composed: true
  - $type: event
    name: filter-condition-change
    bubbles: true
    composed: true
    detail:
      id: unknown
      mode: unknown
      scope: unknown
  - $type: event
    name: filter-panel-reopen
    bubbles: true
    composed: true
tokens:
  field.column-gap: "{sherpa.display-mode-space-xs}"
$extensions:
  sherpa:
    methods:
      - $type: method
        name: open
        args: ""
        description: Show the panel, unless the window is too narrow.
      - $type: method
        name: close
        args: "reason: 'reader' | 'width' = 'reader'"
        description: EVERY close reports, and says why. The width path called this directly
      - $type: method
        name: toggle
        args: ""
    jsProps:
      - name: values
        type: string
        access: read
      - name: readings
        type: string
        access: read
