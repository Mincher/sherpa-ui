<!--
  sherpa-container-footer — the footer bar for a container's `footer` slot.

  A single actions row for slotted controls, with data-align controlling how they
  distribute horizontally. Appears only when the slot has content.

  Public API:
    data-align  start | end (default) | between | stretch
                stretch — ONE wide control fills the row (a chat composer, a
                search field), rather than a cluster of buttons at one end.

  Slots:
    (default) — footer action controls (reflects data-has-content)

  Fires: nothing — slotted controls emit their own events.
-->
<template id="default">
  <footer class="row" part="row">
    <slot data-accepts="control,input"></slot>
  </footer>
</template>
