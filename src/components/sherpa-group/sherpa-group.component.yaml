# sherpa-group — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-group.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-group
$description: a row, column or grid of controls that reads as ONE object.
templates:
  - default
anatomy:
  root:
    slot: ""
props:
  - $type: prop
    name: data-col-count
    type: string
    observed: false
    kind: style
    description: the grid's column count (2|3|4|5|6|8|10|12); grid only
  - $type: prop
    name: data-direction
    type: enum
    observed: false
    kind: style
    values:
      - row
      - column
      - grid
    description: row  | column | grid
states:
  - $type: state
    name: not-direction
    selector: ":host(:not([data-direction]))"
$extensions:
  sherpa:
    category: layout
    divergence:
      note: >-
        2026-09-23: NO FIGMA COMPONENT, and that is the ruling — grouping is a Figma VARIABLE
        collection (the Grouping matrix), not a component. Same footing as `sherpa-layout-grid`: a
        layout concept expressed as a util component, so `figmaName` is absent, which is what tells
        resync-figma there is nothing to match.
        The wrapper DERIVES each child's position — `:first-child` / `:last-child` for a row or
        column, `sibling-index()` for a grid — so a re-order, insert or delete needs nothing from
        the children. It replaces the `.sherpa-group*` classes for new work; the classes and the
        `data-group` attribute both stay, because a host that states a position in its own markup
        still needs them. TRAP T-grouping-is-an-attribute-and-a-class
        It works because `::slotted()` sets CUSTOM PROPERTIES, which inherit through a child's own
        shadow boundary where a class cannot reach.
