<!--
  sherpa-input-date-range — a start/end date range field.

  Two native <input type="date"> controls in the standard field chrome
  (label / description / message). The value is { start, end } (ISO strings).
  start's max is bound to end and end's min to start so the native pickers can't
  cross; an out-of-order pair surfaces the message.

  Public API:
    data-label / data-description / data-error   field chrome
    data-start / data-end                        initial ISO values
    data-min / data-max                          overall selectable bounds
    name / required / disabled                   mirrored to both controls

  Fires: change — detail: { start, end }
-->
<template id="default">
  <div class="field" part="field">
    <span class="label" part="label"></span>
    <span class="description" part="description"></span>
    <div class="range" part="range">
      <input class="control start" part="control" type="date" aria-label="Start date" />
      <span class="sep" aria-hidden="true">–</span>
      <input class="control end" part="control" type="date" aria-label="End date" />
    </div>
    <span class="message" part="message" aria-live="polite"></span>
  </div>
</template>
