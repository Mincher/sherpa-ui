# sherpa-notifications — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-notifications.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-notifications
$description: the bell's list.
element:
  $type: element
  tag: sherpa-menu
  attributes:
    data-heading: Notifications
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: sherpa-menu
      class: menu
      part: menu
      attrs:
        data-heading: Notifications
      children:
        - el: span
          class: head
          attrs:
            slot: header
          children:
            - el: sherpa-button
              class: read-all
              part: read-all
              attrs:
                data-look: transparent
                data-size: xs
    - el: template
      class: notification-tpl
      children:
        - el: sherpa-list-item
          class: notification
          attrs:
            data-interactive: ""
          children:
            - el: i
              class: notification-icon
              attrs:
                slot: leading
                aria-hidden: "true"
            - el: span
              class: notification-time
              attrs:
                slot: trailing
            - el: span
              class: notification-pip
              attrs:
                slot: trailing
                aria-hidden: "true"
props:
  - $type: prop
    name: data-empty-text
    type: string
    kind: content
    default: "\"No notifications\""
    description: what to say when there is nothing
states:
  - $type: state
    name: empty
    selector: ":host([data-empty])"
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (unreadCount). See $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: >-
      callable from a view definition's state block (show, hide, toggle). See
      $extensions.sherpa.methods.
events:
  - $type: event
    name: notification-click
    bubbles: true
    composed: true
    detail:
      id: unknown
      notification: unknown
  - $type: event
    name: notification-read
    bubbles: true
    composed: true
    detail:
      ids: unknown
tokens:
  notification-icon.font-size: "{sherpa.theme-size-icon-xs}"
  notification-icon.color: "{sherpa.theme-content-body-1}"
  notification-time.color: "{sherpa.theme-content-body-1}"
  notification-time.font-size: "{sherpa.theme-content-size-small}"
  notification-time.line-height: "{sherpa.theme-content-line-height-small}"
  empty.padding: "{sherpa.theme-padding-md}"
  empty.color: "{sherpa.theme-content-body-1}"
  empty.font-family: "{sherpa.font-family-body}"
  empty.font-size: "{sherpa.font-size-body-base}"
  empty.line-height: "{sherpa.theme-content-line-height-base}"
$extensions:
  sherpa:
    figmaName: Notifications
    methods:
      - $type: method
        name: show
        args: "trigger?: HTMLElement"
        description: Open the list, anchored to whatever opened it (the bell).
      - $type: method
        name: hide
        args: ""
      - $type: method
        name: toggle
        args: "trigger?: HTMLElement"
        description: Open if shut, shut if open — what a bell click does.
    category: container
    jsProps:
      - name: unreadCount
        type: string
        access: read
