<!--
  sherpa-node — one node of a node editor: a card on a sherpa-layout-canvas, at
  its data-x and data-y. Its HEADER names it, drags it and may carry the whole
  node's sockets; its content holds its rows. Will, TODO 78.
  TRAP T-a-node-moves-itself-and-reports

  Public API:
    data-heading      the node's name, in its header
    data-icon         a glyph before the name
    data-description  a line under the name
    data-input-socket   the whole node's input socket, on its header: value | object | boolean | any: an input is a D, its type in its ink
    data-output-socket  the whole node's output socket, on its header: value (a circle) | object (a diamond) | boolean (a triangle)
    data-input-routed   a route joins the header's input: its socket is filled, else hollow
    data-output-routed  a route leaves the header's output: its socket is filled, else hollow
    data-branches       a fork: the header's output is True, and a footer shows with its False socket, a rounded square
    data-false-routed   a route leaves False: its socket is filled, else hollow
    data-category     its kind's category, in lower case: sources | custom-nodes | variables | math | logic | time | utils | collections | output | ai; each has its look
    data-input-many   the header's input takes several routes: its socket is a double height D
    data-scale-w      its width, in times its natural width: 1 to 2 (default 1)
    data-scale-h      its height, in times its natural height: 1 to 2 (default 1)
    data-x            where it sits across the canvas, in plane px (default 0)
    data-y            where it sits down the canvas, in plane px (default 0)
    data-current      the selected node; the HOST writes it, one node of many
    data-active       the one picked node whose panel is shown, in a stronger ring; the HOST writes it
    data-step         how its step stands as a run lights it: running | done | failed | skipped. Its host writes it
    data-caption      a line over the node: what its step did, its time and rows. Its host writes it
    data-locked       the host owns the place: a drag or a key reports, and moves nothing
    data-resizable    the resize handle and Alt and an arrow exist: the app's Allow resizing nodes setting writes it. A saved size draws either way

  Slots:
    (default)   the node's rows: each a sherpa-node-row

  Fires:
    node-move — it moved, or was asked to: a drag on its header, or an arrow key there. detail: { x, y }
    node-resize — its resize handle was dragged, or Alt and an arrow pressed on its header. detail: { w, h }, in times its natural size
    node-select — it was pressed: a click on it, or Enter or Space on its header. The click a drag ends with is no press.
-->
<template id="default">
  <div class="root" part="root">
    <!-- What its step did, over the card: it moves no row, so no route moves. -->
    <span class="caption sherpa-truncate" part="caption" data-text="data-caption"></span>
    <!-- The HEADER is the handle: a drag moves the node, the arrows move it, Enter selects it. -->
    <div class="header" part="header" role="button" tabindex="0" aria-roledescription="node">
      <sherpa-container-header class="heading" part="heading" data-heading="Node" data-attr-data-heading="data-heading" data-attr-data-icon="data-icon" data-attr-data-description="data-description"></sherpa-container-header>
      <!-- The grip: where to take hold. Shown on hover and focus; it moves nothing itself. -->
      <span class="grip sherpa-icon-box" part="grip" aria-hidden="true" data-icon="drag-handle-vertical"></span>
      <span class="socket socket-in sherpa-anchor" part="socket-in" aria-hidden="true"></span>
      <span class="tip tip-in sherpa-tip" popover="manual" part="tip" aria-hidden="true"><span class="name">Input:</span><span class="word w-value">a value</span><span class="word w-object">an object</span><span class="word w-boolean">a boolean</span><span class="word w-any">any type</span></span>
      <span class="socket socket-out sherpa-anchor" part="socket-out" aria-hidden="true"></span>
      <span class="tip tip-out sherpa-tip" popover="manual" part="tip" aria-hidden="true"><span class="name name-out">Output:</span><span class="name name-true">True:</span><span class="word w-value">a value</span><span class="word w-object">an object</span><span class="word w-boolean">a boolean</span></span>
    </div>
    <div class="body" part="body"><slot data-accepts="item"></slot></div>
    <!-- The FOOTER: only a fork has one, and its False socket. -->
    <div class="footer" part="footer">
      <sherpa-container-footer class="foot" part="foot"></sherpa-container-footer>
      <span class="socket socket-out socket-false sherpa-anchor" part="socket-false" aria-hidden="true"></span>
      <span class="tip tip-false sherpa-tip" popover="manual" part="tip" aria-hidden="true"><span class="name">False:</span><span class="word">a boolean</span></span>
    </div>
    <!-- The RESIZE handle: bottom right, shown on hover and focus. A drag grows the node up to double; the primary key (Ctrl, or Cmd on a Mac) keeps its aspect. -->
    <span class="resize" part="resize" aria-hidden="true" title="Drag to resize. Hold Ctrl to keep the shape."></span>
  </div>
</template>
