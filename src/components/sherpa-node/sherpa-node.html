<!--
  sherpa-node — one node of a node editor: a card on a sherpa-layout-canvas, at
  its data-x and data-y. Its HEADER names it, drags it and may carry the whole
  node's sockets; its content holds its rows. Will, TODO 78.
  TRAP T-a-node-moves-itself-and-reports · TRAP T-a-node-reads-null-from-what-it-cannot-use

  Public API:
    data-heading      the node's name, in its header
    data-kind         its kind's name, where the node has a name of its own: the header says it first ("Field: Device type"). Its host writes it
    data-icon         a glyph before the name
    data-description  a line under the name
    data-input-socket   the whole node's input socket, on its header: value | object | boolean | any: an input is a D, its type in its ink
    data-output-socket  the whole node's output socket, on its header: value (a circle) | object (a diamond) | boolean (a circle)
    data-input-connected   a connection joins the header's input: its socket is filled, else hollow
    data-output-connected  a connection leaves the header's output: its socket is filled, else hollow
    data-category     its kind's category, in lower case: sources | custom-nodes | variables | math | logic | time | utils | collections | output | ai; each has its look
    data-input-many   the header's input takes several connections: its socket is a double height D
    data-scale-w      its width, in times its natural width: 1 to 2 (default 1)
    data-scale-h      its height, in times its natural height: 1 to 2 (default 1)
    data-x            where it sits across the canvas, in plane px (default 0)
    data-y            where it sits down the canvas, in plane px (default 0)
    data-current      the selected node; the HOST writes it, one node of many
    data-active       the one picked node whose panel is shown, in a stronger ring; the HOST writes it
    data-joined       joined to what is picked: downstream of a picked node, at an end of a picked connection, or joined to the row in focus. It wears the active border on its own fill. The HOST writes it
    data-linked       a portal of the picked portal's name, In or Out: it takes the picked look; the HOST writes it
    data-step         how its step stands as a run lights it: running | done | failed | skipped. Its host writes it. Running, the node wears the active border
    data-caption      the TAB on its top edge: what its step does or did, its time and rows ("Simulating… 1s"). A running tab leads with a play icon. Its host writes it
    data-warning      what reached it that it cannot use, in words, a line each: it draws as a warning, and a hover or focus on its header shows the words. Its host writes it
    data-locked       the host owns the place: a drag or a key reports, and moves nothing
    data-resizable    the resize handle and Alt and an arrow exist: the app's Allow resizing nodes setting writes it. A saved size draws either way
    data-chain-drag   ⌘ or Ctrl held on a drag or an arrow asks to pull the nodes it joins: the app's Enable node chain dragging setting writes it
    data-chain-falloff  distance | connections: what that pull falls off by, the distance along the connectors (none: it) or how many: the app's setting writes it
    data-collapsed    collapsed: its rows show only their sockets, no label or field; a socket's tip names its row and says its value, and its
                      name reads "Heading: summary". Its host writes it
    data-inputs, data-outputs  how many sockets each side's stack holds, collapsed: the header's and the rows'. Its host writes them
    data-inputs-connected, data-outputs-connected  the same, of the connected ones only: hiding the unconnected, the stacks hold these. Its host writes them
    data-summary      what its first field holds, in words: a collapsed node's name ends with it ("Condition: Equals"). Its host writes it
    data-hide-unconnected  collapsed, a socket no connection joins hides; a hover shows them. Its host writes it
    data-reveal       the hidden sockets show, as on a hover: a line is being dragged. Its host writes it
    data-sub-graph    it holds a sub-graph, as a Custom Node's use: a drill-down button on its header's end opens it (node-open). Its host writes it

  Slots:
    (default)   the node's rows: each a sherpa-node-row

  Fires:
    node-move — it moved, or was asked to: a drag on its header, or an arrow key there. detail: { x, y, chain?, falloff? }: chain, with ⌘ or Ctrl held and data-chain-drag on; falloff 'connections', where data-chain-falloff says so
    node-resize — its resize handle was dragged, or Alt and an arrow pressed on its header. detail: { w, h }, in times its natural size
    node-select — it was pressed: a click on it, or Enter or Space on its header. The click a drag ends with is no press.
    node-open — its drill-down button was pressed: open its sub-graph. It is no press of the node
-->
<template id="default">
  <div class="root" part="root">
    <!-- COLLAPSED, the two stacks every socket stands in: a D of the node's fill on each side. -->
    <span class="stack stack-in" part="stack-in" aria-hidden="true"></span>
    <span class="stack stack-out" part="stack-out" aria-hidden="true"></span>
    <!-- The TAB on its top edge, right-aligned: what its step does or did. It moves no row, so no connection moves. TODO 845 -->
    <span class="caption" part="caption">
      <span class="caption-icon sherpa-icon-box" part="caption-icon" aria-hidden="true" data-icon="play"></span>
      <span class="caption-warn sherpa-icon-box" part="caption-warn" aria-hidden="true" data-icon="status-warning"></span>
      <span class="caption-text sherpa-truncate" part="caption-text" data-text="data-caption"></span>
    </span>
    <!-- The HEADER is the handle: a drag moves the node, the arrows move it, Enter selects it. It anchors the warning's tip. -->
    <div class="header sherpa-anchor" part="header" role="button" tabindex="0" aria-roledescription="node" aria-describedby="warning">
      <sherpa-container-header class="heading" part="heading" data-heading="Node" data-attr-data-icon="data-icon" data-attr-data-description="data-description"></sherpa-container-header>
      <span class="socket-tab socket-tab-in sherpa-anchor" part="socket-tab-in" aria-hidden="true"><span class="socket socket-in" part="socket-in"><i class="core"></i></span></span>
      <span class="tip tip-in sherpa-tip" popover="manual" part="tip" aria-hidden="true"><span class="name">Input:</span><span class="word w-value">a value</span><span class="word w-object">an object</span><span class="word w-boolean">a boolean</span><span class="word w-any">any type</span></span>
      <span class="socket-tab socket-tab-out sherpa-anchor" part="socket-tab-out" aria-hidden="true"><span class="socket socket-out" part="socket-out"><i class="core"></i></span></span>
      <span class="tip tip-out sherpa-tip" popover="manual" part="tip" aria-hidden="true"><span class="name name-out">Output:</span><span class="word w-value">a value</span><span class="word w-object">an object</span><span class="word w-boolean">a boolean</span></span>
    </div>
    <!-- A sub-graph's DRILL-DOWN, over the header's end: beside the header, so no control sits inside another. -->
    <sherpa-button class="open" part="open" data-type="icon" data-look="transparent" data-size="sm" data-icon-start="folder-open" aria-label="Open graph" data-tip="Open graph"></sherpa-button>
    <!-- The header's tip: the warning's words, the first tip after it. -->
    <span id="warning" class="tip tip-warning sherpa-tip" popover="manual" part="tip" role="tooltip" data-text="data-warning"></span>
    <div class="body" part="body"><slot data-accepts="item"></slot></div>
    <!-- The RESIZE handle: bottom right, shown on hover and focus. A drag grows the node up to double; the primary key (Ctrl, or Cmd on a Mac) keeps its aspect. -->
    <span class="resize" part="resize" aria-hidden="true" title="Drag to resize. Hold Ctrl to keep the shape."></span>
  </div>
</template>
