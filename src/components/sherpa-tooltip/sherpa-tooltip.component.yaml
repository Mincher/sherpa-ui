# sherpa-tooltip — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-tooltip.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-tooltip
$description: a hover/focus tooltip that wraps a trigger.
element:
  $type: element
  tag: span
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: span
      class: anchor
      part: anchor
      slot: ""
    - el: span
      class: bubble
      part: bubble
      attrs:
        role: tooltip
        popover: manual
      children:
        - el: span
          class: tip-text
        - slot: tip
        - el: span
          class: arrow
          part: arrow
          attrs:
            aria-hidden: "true"
props:
  - $type: prop
    name: data-floating
    type: string
    kind: style
    description: >-
      place the bubble in the TOP LAYER from measured coordinates rather than relative to the host.
      For a tooltip inside a box that clips — a toolbar's chip run, a scroller — where the ordinary
      absolute bubble is cut off.
  - $type: prop
    name: data-placement
    type: enum
    kind: content
    values:
      - top
      - bottom
      - left
      - right
    description: top  | bottom | left | right
  - $type: prop
    name: data-text
    type: string
    kind: style
    description: tip text (or use the `tip` slot)
states:
  - $type: state
    name: has-tip
    selector: ":host([data-has-tip])"
  - $type: state
    name: bottom
    selector: ":host([data-placement=\"bottom\"])"
  - $type: state
    name: left
    selector: ":host([data-placement=\"left\"])"
  - $type: state
    name: right
    selector: ":host([data-placement=\"right\"])"
  - $type: state
    name: floating
    selector: ":host([data-floating])"
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (text). See $extensions.sherpa.jsProps.
tokens:
  bubble.padding: "{sherpa.display-mode-space-2xs}"
  bubble.font-family: "{sherpa.font-family-body}"
  bubble.font-size: "{sherpa.font-size-body-small}"
  bubble.font-weight: "{sherpa.font-weight-regular}"
  bubble.line-height: "{sherpa.theme-content-line-height-small}"
  bubble.border-radius: "{sherpa.display-mode-border-rounding-base}"
  bubble.box-shadow: "{sherpa.shadow-md}"
  bubble.transition: "{sherpa.motion-base}"
$extensions:
  sherpa:
    figmaName: Tooltip (atom)
    category: container
    jsProps:
      - name: text
        type: string
        access: read-write
