# sherpa-tooltip — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-tooltip.{thin.yaml,html,css,ts}. The MECHANICAL surface only —
# props (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# Validated by schemas/component.v1.json; round-trips via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-tooltip
$description: a hover/focus tooltip that wraps a trigger.
element:
  $type: element
  tag: span
  provides: []
templates:
  - default
anatomy:
  root:
    el: span
    class: anchor
    part: anchor
    slot: ""
props:
  - $type: prop
    name: data-placement
    type: enum
    kind: content
    values:
      - top
      - bottom
      - left
      - right
    description: top  | bottom | left | right
  - $type: prop
    name: data-text
    type: string
    kind: content
    description: tip text (or use the `tip` slot)
states:
  - $type: state
    name: has-tip
    selector: ":host([data-has-tip])"
  - $type: state
    name: bottom
    selector: ":host([data-placement=\"bottom\"])"
  - $type: state
    name: left
    selector: ":host([data-placement=\"left\"])"
  - $type: state
    name: right
    selector: ":host([data-placement=\"right\"])"
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (text). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: nothing
    bubbles: true
    composed: true
tokens:
  bubble.padding: "{sherpa.display-space-2xs}"
  bubble.font-family: "{sherpa.font-family-body}"
  bubble.font-size: "{sherpa.font-size-body-small}"
  bubble.font-weight: "{sherpa.font-weight-semibold}"
  bubble.border-radius: "{sherpa.display-border-rounding-base}"
$extensions:
  sherpa:
    figmaName: Tooltip (atom)
    category: container
    jsProps:
      - name: text
        type: string
        access: read-write
