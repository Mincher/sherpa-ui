<!--
  sherpa-tooltip — a hover/focus tooltip wrapping a trigger.

  The bubble is the SHARED tip every component uses (core/sherpa-anchor.css): it
  opens in the TOP LAYER on hover or keyboard focus, and CSS anchors it to the
  trigger. When its side has no room, it takes another.

  Public API:
    data-text       tip text (or use the `tip` slot)
    data-placement  top (default) | bottom | left | right

  Slots:
    (default) — the trigger element the tooltip describes
    tip       — rich tip content (reflects has-tip; overrides data-text)

  Fires: nothing.
-->
<template id="default">
  <span class="anchor sherpa-anchor" part="anchor">
    <slot data-accepts="content"></slot>
  </span>
  <span class="bubble sherpa-tip" part="bubble" role="tooltip" popover="manual">
    <span class="tip-text"></span>
    <slot name="tip" data-accepts="content"></slot>
  </span>
</template>
