<!--
  sherpa-tooltip — a hover/focus tooltip wrapping a trigger.

  Show/hide is entirely CSS (:hover / :focus-within on the host); JS never toggles
  visibility.

  Public API:
    data-text       tip text (or use the `tip` slot)
    data-placement  top (default) | bottom | left | right
    data-floating   place the bubble in the TOP LAYER from measured coordinates
                    rather than relative to the host. For a tooltip inside a box
                    that clips — a toolbar's chip run, a scroller — where the
                    ordinary absolute bubble is cut off.

  Slots:
    (default) — the trigger element the tooltip describes
    tip       — rich tip content (reflects data-has-tip; overrides data-text)

  Fires: nothing.
-->
<template id="default">
  <span class="anchor" part="anchor">
    <slot></slot>
  </span>
  <!--
    `popover=manual` lifts the bubble into the TOP LAYER, past any clipping
    ancestor. `manual`, not `auto`: visibility stays CSS's, and `auto` would
    dismiss on any outside click. A popover is `position: fixed`, so
    `data-floating` places it from measured viewport coords (--_x / --_y).
  -->
  <span class="bubble" part="bubble" role="tooltip" popover="manual">
    <span class="tip-text"></span>
    <slot name="tip"></slot>
    <span class="arrow" part="arrow" aria-hidden="true"></span>
  </span>
</template>
