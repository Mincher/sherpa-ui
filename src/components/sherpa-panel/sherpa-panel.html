<!--
  sherpa-panel — a titled, collapsible content panel.

  A header (title/heading + optional controls + a collapse toggle), a scrollable
  body, and an optional footer. data-collapsed hides the body and footer, leaving
  just the header row.

  Public API:
    data-title      heading text (rendered into .title-text)
    data-collapsed  collapsed state (boolean)

  Slots:
    heading   — custom heading element (replaces the default .title-text)
    controls  — header control buttons (reflects data-has-controls)
    (default) — the panel body
    footer    — a pinned footer region (reflects data-has-footer)

  Fires: panel-toggle on every collapse/expand.
-->
<template id="default">
  <header class="header" part="header">
    <div class="lead" part="lead">
      <slot name="heading">
        <span class="title-text" part="title"></span>
      </slot>
    </div>
    <div class="controls" part="controls">
      <slot name="controls" data-accepts="control"></slot>
    </div>
    <button class="toggle" type="button" part="toggle" aria-label="Collapse panel" aria-expanded="true">
      <span class="chevron" aria-hidden="true"></span>
    </button>
  </header>

  <div class="body" part="body">
    <slot></slot>
  </div>

  <div class="footer" part="footer">
    <slot name="footer"></slot>
  </div>
</template>
