<!--
  sherpa-panel — a persistent inline panel (a semantic <section> card).

  Public API:
    data-heading    — the title of a composed sherpa-container-header; a slotted [slot=header] replaces it
    data-collapsed  — boolean; hides the body/footer, leaving the header
    data-status     — status colour cascade (critical | warning | success | info | urgent)

  Slots:
    header    — header region (reflects has-header): a header of its own, in
                place of data-heading's
    (default) — the panel body
    footer    — footer region (reflects has-footer)

  Fires: nothing by itself — it's a surface. Consumers wire their own controls.
-->
<template id="default">
  <section class="root" part="root">
    <div class="header" part="header">
      <!-- Figma's Container Header, default variant, as the Dialog and Panel compose it. -->
      <sherpa-container-header class="heading" part="heading"></sherpa-container-header>
      <slot name="header" data-accepts="header"></slot>
    </div>
    <div class="body" part="body">
      <slot data-accepts="content"></slot>
    </div>
    <div class="footer" part="footer">
      <slot name="footer" data-accepts="footer"></slot>
    </div>
  </section>
</template>
