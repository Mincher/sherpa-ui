# sherpa-panel — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-panel.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-panel
$description: a persistent inline panel (a semantic <section> card).
element:
  $type: element
  tag: section
  provides: []
templates:
  - default
anatomy:
  root:
    el: section
    class: root
    part: root
    children:
      - el: div
        class: header
        part: header
        children:
          - el: span
            class: heading-text
          - slot: header
      - el: div
        class: body
        part: body
        slot: ""
      - el: div
        class: footer
        part: footer
        slot: footer
props:
  - $type: prop
    name: data-collapsed
    type: string
    kind: style
    description: — boolean; hides the body/footer, leaving the header
  - $type: prop
    name: data-heading
    type: string
    kind: content
    description: — convenience header label (a slotted [slot=header] overrides it)
  - $type: prop
    name: data-status
    type: string
    kind: style
    description: — status colour cascade (critical | warning | success | info | urgent)
states:
  - $type: state
    name: has-header
    selector: ":host([data-has-header])"
  - $type: state
    name: heading
    selector: ":host([data-heading])"
  - $type: state
    name: has-footer
    selector: ":host([data-has-footer])"
  - $type: state
    name: collapsed
    selector: ":host([data-collapsed])"
events:
  - $type: event
    name: nothing
    bubbles: true
    composed: true
tokens:
  heading-text.font-weight: "{sherpa.font-weight-semibold}"
$extensions:
  sherpa:
    figmaName: Panel
    category: container
    divergence:
      note: >-
        2026-09-07 (D2/D12): split out of the former Container Type=panel variant into a standalone
        component. A panel is a persistent, in-flow region (not floating, not a disclosure), so its
        native home is a plain semantic <section> — no <dialog>/<details>. Maps to the Figma "Panel"
        component (Container set already split).
