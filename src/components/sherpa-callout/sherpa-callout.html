<!--
  sherpa-callout — a status message box.

  A round status icon badge, a title/message, and an optional dismiss button.
  data-status re-points the [data-status] cascade (--_status-surface/-border/-text)
  so the whole box fills with the status surface; the icon badge carries the hue.

  Public API:
    data-status       info | success | warning | critical | urgent (default: neutral/info)
    data-heading      heading text (rendered into .title)
    data-dismissible  show the close button (fires callout-dismiss)

  Slots:
    (default) — the message body

  Fires: callout-dismiss
-->
<template id="default">
  <div class="box" part="box">
    <span class="icon sherpa-icon-box" part="icon" aria-hidden="true"></span>
    <div class="content" part="content">
      <span class="title" part="title"></span>
      <div class="message" part="message">
        <slot></slot>
      </div>
    </div>
    <button class="close" part="close" type="button" aria-label="Dismiss">
      <span aria-hidden="true">&#215;</span>
    </button>
  </div>
</template>
