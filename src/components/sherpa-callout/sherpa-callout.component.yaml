# sherpa-callout — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-callout.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-callout
$description: a status message box.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  root:
    el: div
    class: box
    part: box
    children:
      - el: span
        class: icon sherpa-icon-box
        part: icon
        attrs:
          data-icon: status-info
          data-icon-status: info
          aria-hidden: "true"
      - el: span
        class: icon sherpa-icon-box
        part: icon
        attrs:
          data-icon: status-ok
          data-icon-status: success
          aria-hidden: "true"
      - el: span
        class: icon sherpa-icon-box
        part: icon
        attrs:
          data-icon: status-warning
          data-icon-status: warning
          aria-hidden: "true"
      - el: span
        class: icon sherpa-icon-box
        part: icon
        attrs:
          data-icon: status-critical
          data-icon-status: critical
          aria-hidden: "true"
      - el: span
        class: icon sherpa-icon-box
        part: icon
        attrs:
          data-icon: status-urgent
          data-icon-status: urgent
          aria-hidden: "true"
      - el: div
        class: content
        part: content
        children:
          - el: span
            class: title
            part: title
          - el: div
            class: message
            part: message
            slot: ""
      - el: sherpa-button
        class: close
        part: close
        attrs:
          data-type: icon
          data-size: xs
          data-look: transparent
          data-icon-start: cross
          aria-label: Dismiss
props:
  - $type: prop
    name: data-dismissible
    type: string
    observed: false
    kind: style
    description: show the close button (fires callout-dismiss)
  - $type: prop
    name: data-heading
    type: string
    observed: false
    kind: content
    description: heading text (rendered into .title)
  - $type: prop
    name: data-status
    type: enum
    observed: false
    kind: style
    values:
      - info
      - success
      - warning
      - critical
      - urgent
    description: info | success | warning | critical | urgent
states:
  - $type: state
    name: not-heading
    selector: ":host(:not([data-heading]))"
  - $type: state
    name: not-has-content
    selector: ":host(:not([data-has-content]))"
  - $type: state
    name: not-dismissible
    selector: ":host(:not([data-dismissible]))"
capabilities:
  - $type: capability
    api: js-methods
    description: callable from a view definition's state block (dismiss). See $extensions.sherpa.methods.
events:
  - $type: event
    name: callout-dismiss
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .close
tokens:
  box.gap: "{sherpa.display-mode-space-xs}"
  box.padding: "{sherpa.theme-padding-lg}"
  box.border-inline-start: "{sherpa.display-mode-border-width-lg}"
  box.border-radius: "{sherpa.display-mode-border-rounding-sm}"
  box.font-size: "{sherpa.font-size-body-base}"
  icon.--_icon-size: "{sherpa.theme-content-size-base}"
  icon.margin-block-start: "{sherpa.display-mode-space-3xs}"
  content.gap: "{sherpa.display-mode-space-2xs}"
  title.font-weight: "{sherpa.font-weight-semibold}"
  title.font-size: "{sherpa.font-size-body-base}"
  title.line-height: "{sherpa.theme-content-line-height-base}"
  message.font-size: "{sherpa.font-size-body-small}"
  message.line-height: "{sherpa.theme-content-line-height-small}"
  close.margin-inline-start: "{sherpa.display-mode-space-2xs}"
$extensions:
  sherpa:
    figmaName: Callout
    methods:
      - $type: method
        name: dismiss
        args: ""
        description: "Dismiss the callout: emit the event and remove the element."
    category: container
