<!--
  sherpa-toast — a transient notification (Figma Toast 27:750).
  The card is NEUTRAL, not status-filled; only the icon badge carries the hue.

  Public API:
    data-status    info (default) | success | warning | critical | urgent
    data-heading   the primary line (or the default slot)
    data-value     the supporting detail line (shown when present)
    data-action    an action link label (shown when present; fires toast-action)
    data-duration  auto-dismiss delay in ms (default 5000; 0 disables)

  Static: SherpaToast.info/success/warning/critical(heading, opts?)

  Slots:
    (default) — the heading content (overrides data-heading)

  Fires:
    toast-dismiss  — on auto or manual dismiss. detail: {}
    toast-action   — the action link is clicked. detail: {}
-->
<template id="default">
  <div class="toast sherpa-border-edges sherpa-border-corners" part="toast" role="alert">
    <span class="icon sherpa-icon-box" data-icon="status-info" data-icon-status="info" part="icon" aria-hidden="true"></span>
    <span class="icon sherpa-icon-box" data-icon="status-ok" data-icon-status="success" part="icon" aria-hidden="true"></span>
    <span class="icon sherpa-icon-box" data-icon="status-warning" data-icon-status="warning" part="icon" aria-hidden="true"></span>
    <span class="icon sherpa-icon-box" data-icon="status-critical" data-icon-status="critical" part="icon" aria-hidden="true"></span>
    <span class="icon sherpa-icon-box" data-icon="status-urgent" data-icon-status="urgent" part="icon" aria-hidden="true"></span>
    <span class="content" part="content">
      <span class="heading" part="heading"><slot></slot></span>
      <span class="value" part="value"></span>
      <button class="action" part="action" type="button"></button>
    </span>
    <sherpa-button class="close" part="close" data-type="icon" data-size="xs"
                   data-look="transparent" data-icon-start="cross"
                   aria-label="Dismiss"></sherpa-button>
  </div>
</template>
