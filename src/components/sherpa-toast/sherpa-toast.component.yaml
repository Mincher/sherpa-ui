# sherpa-toast — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-toast.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-toast
$description: a transient notification.
element:
  $type: element
  tag: div
  attributes:
    role: alert
  provides: []
templates:
  - default
anatomy:
  root:
    el: div
    class: toast
    part: toast
    attrs:
      role: alert
    children:
      - el: span
        class: icon
        part: icon
        attrs:
          aria-hidden: "true"
      - el: span
        class: content
        part: content
        children:
          - el: span
            class: heading
            part: heading
            slot: ""
          - el: span
            class: value
            part: value
          - el: button
            class: action
            part: action
            attrs:
              type: button
      - el: button
        class: close
        part: close
        attrs:
          type: button
          aria-label: Dismiss
        children:
          - el: span
            attrs:
              aria-hidden: "true"
props:
  - $type: prop
    name: data-action
    type: string
    kind: content
    description: an action link label (shown when present; fires toast-action)
  - $type: prop
    name: data-duration
    type: string
    kind: style
    default: 5000; 0 disables
    description: auto-dismiss delay in ms
  - $type: prop
    name: data-heading
    type: string
    kind: content
    description: the primary line (or the default slot)
  - $type: prop
    name: data-message
    type: string
    kind: content
    description: the message text (or slot content)
  - $type: prop
    name: data-status
    type: enum
    kind: style
    values:
      - info
      - success
      - warning
      - critical
      - urgent
    description: info  | success | warning | critical | urgent
  - $type: prop
    name: data-value
    type: string
    kind: content
    description: the supporting detail line (shown when present)
states:
  - $type: state
    name: info
    selector: ":host([data-status=\"info\"])"
  - $type: state
    name: success
    selector: ":host([data-status=\"success\"])"
  - $type: state
    name: warning
    selector: ":host([data-status=\"warning\"])"
  - $type: state
    name: critical
    selector: ":host([data-status=\"critical\"])"
  - $type: state
    name: urgent
    selector: ":host([data-status=\"urgent\"])"
  - $type: state
    name: value
    selector: ":host([data-value])"
  - $type: state
    name: action
    selector: ":host([data-action])"
  - $type: state
    name: not-status
    selector: ":host(:not([data-status]))"
  - $type: state
    name: focus-visible
    selector: .action:focus-visible
events:
  - $type: event
    name: toast-dismiss
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .close
  - $type: event
    name: toast-action
    bubbles: true
    composed: true
tokens:
  toast.gap: "{sherpa.display-space-sm}"
  toast.padding: "{sherpa.theme-padding-lg}"
  toast.border-width: "{sherpa.style-border-width}"
  toast.border-radius: "{sherpa.structure-rounding-top-left}"
  toast.box-shadow: "{sherpa.shadow-md}"
  icon.inline-size: "{sherpa.theme-size-icon-md}"
  icon.block-size: "{sherpa.theme-size-icon-md}"
  icon.color: "{sherpa.theme-content-body-base-fixed}"
  icon.font-size: "{sherpa.font-size-body-small}"
  icon.font-weight: "{sherpa.font-weight-bold}"
  content.gap: "{sherpa.theme-gap-sm}"
  heading.font-size: "{sherpa.font-size-body-base}"
  heading.font-weight: "{sherpa.font-weight-semibold}"
  close.inline-size: "{sherpa.display-size-md}"
  close.block-size: "{sherpa.display-size-md}"
  close.margin-inline-start: "{sherpa.display-space-2xs}"
  close.border-radius: "{sherpa.display-border-rounding-full}"
  close.font-size: "{sherpa.font-size-body-large}"
$extensions:
  sherpa:
    figmaName: Toast
    category: container
    booleanProps:
      - hasClose
      - hasAction
