# sherpa-toast — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-toast.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-toast
$description: a transient notification.
element:
  $type: element
  tag: div
  attributes:
    role: alert
  provides: []
templates:
  - default
anatomy:
  root:
    el: div
    class: toast sherpa-border-edges sherpa-border-corners
    part: toast
    attrs:
      role: alert
    children:
      - el: span
        class: icon sherpa-icon-box
        part: icon
        attrs:
          data-icon: status-info
          data-icon-status: info
          aria-hidden: "true"
      - el: span
        class: icon sherpa-icon-box
        part: icon
        attrs:
          data-icon: status-ok
          data-icon-status: success
          aria-hidden: "true"
      - el: span
        class: icon sherpa-icon-box
        part: icon
        attrs:
          data-icon: status-warning
          data-icon-status: warning
          aria-hidden: "true"
      - el: span
        class: icon sherpa-icon-box
        part: icon
        attrs:
          data-icon: status-critical
          data-icon-status: critical
          aria-hidden: "true"
      - el: span
        class: icon sherpa-icon-box
        part: icon
        attrs:
          data-icon: status-urgent
          data-icon-status: urgent
          aria-hidden: "true"
      - el: span
        class: content
        part: content
        children:
          - el: span
            class: heading
            part: heading
            slot: ""
          - el: span
            class: value
            part: value
          - el: button
            class: action
            part: action
            attrs:
              type: button
      - el: button
        class: close
        part: close
        attrs:
          type: button
          aria-label: Dismiss
        children:
          - el: span
            attrs:
              aria-hidden: "true"
props:
  - $type: prop
    name: data-action
    type: string
    kind: style
    description: an action link label (shown when present; fires toast-action)
  - $type: prop
    name: data-duration
    type: string
    kind: style
    default: 5000; 0 disables
    description: auto-dismiss delay in ms
  - $type: prop
    name: data-heading
    type: string
    kind: style
    description: the primary line (or the default slot)
  - $type: prop
    name: data-message
    type: string
    kind: style
    description: the message text (or slot content)
  - $type: prop
    name: data-status
    type: enum
    kind: style
    values:
      - info
      - success
      - warning
      - critical
      - urgent
    description: info  | success | warning | critical | urgent
  - $type: prop
    name: data-value
    type: string
    kind: style
    description: the supporting detail line (shown when present)
states:
  - $type: state
    name: stacked
    selector: ":host([data-stacked])"
  - $type: state
    name: leaving
    selector: ":host([data-leaving])"
  - $type: state
    name: value
    selector: ":host([data-value])"
  - $type: state
    name: action
    selector: ":host([data-action])"
  - $type: state
    name: focus-visible
    selector: .action:focus-visible
capabilities:
  - $type: capability
    api: js-methods
    description: callable from a view definition's state block (dismiss). See $extensions.sherpa.methods.
events:
  - $type: event
    name: toast-dismiss
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .close
  - $type: event
    name: toast-action
    bubbles: true
    composed: true
tokens:
  toast.gap: "{sherpa.display-mode-space-sm}"
  toast.padding: "{sherpa.theme-padding-lg}"
  toast.box-shadow: "{sherpa.display-mode-size-2xs}"
  icon.--_icon-size: "{sherpa.theme-content-size-base}"
  icon.margin-block-start: "{sherpa.display-mode-space-3xs}"
  content.gap: "{sherpa.theme-gap-sm}"
  heading.color: "{sherpa.theme-content-body-1}"
  heading.font-size: "{sherpa.font-size-body-base}"
  heading.font-weight: "{sherpa.font-weight-semibold}"
  heading.line-height: "{sherpa.theme-content-line-height-base}"
  close.inline-size: "{sherpa.theme-size-icon-2xs}"
  close.block-size: "{sherpa.theme-size-icon-2xs}"
  close.margin-block-start: "{sherpa.display-mode-space-2xs}"
  close.border-radius: "{sherpa.display-mode-border-rounding-full}"
  close.color: "{sherpa.theme-content-body-1}"
  close.font-size: "{sherpa.font-size-body-base}"
$extensions:
  sherpa:
    figmaName: Toast
    methods:
      - $type: method
        name: dismiss
        args: ""
        description: Stop the timer, announce, play the leave animation, then remove the node.
    category: container
    booleanProps:
      - hasClose
      - hasAction
