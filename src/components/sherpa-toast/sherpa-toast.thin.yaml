name: sherpa-toast
figmaName: Toast
category: container
description: a transient notification.
props:
  data-message:
    kind: content
slots:
  '':
    accepts: []
    description: ''
events:
  toast-dismiss:
    $verbatim:
      trigger:
        'on': click
        node: .close
parts:
  - toast
  - message
  - close
tokens:
  toast:core-space-sm: core-space-sm
  toast:container-space-padding-md: container-space-padding-md
  toast:container-border-width: container-border-width
  toast:container-border-radius-top-left: container-border-radius-top-left
  toast:shadow-md: shadow-md
  message:status-text:
    override: status-text
  message:content-title-base: content-title-base
  message:core-fonts-scale-base: core-fonts-scale-base
  close:core-size-md: core-size-md
  close:core-space-2xs: core-space-2xs
  close:core-border-rounding-full: core-border-rounding-full
  close:status-text:
    override: status-text
  close:content-title-base: content-title-base
figmaVerbatim:
  _status: matched
  figmaName: Toast
  nodeType: COMPONENT
  built: true
  booleanProps:
    - hasAction
    - hasClose
  textProps:
    - heading
    - value
  instanceProps: []
  modePins:
    Status:
      mode: info
    Elevation:
      mode: md
  figmaEvents:
    - close
    - action
