# sherpa-select-group — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-select-group.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-select-group
$description: a labelled group of checkbox or radio options.
element:
  $type: element
  tag: fieldset
  provides:
    - group-disable
templates:
  - default
anatomy:
  root:
    el: fieldset
    class: group
    part: group
    children:
      - el: legend
        class: legend
        part: legend
        children:
          - el: span
            class: label
            part: label
          - el: span
            class: description
            part: description
      - el: hr
        class: divider
        part: divider
        attrs:
          aria-hidden: "true"
      - el: div
        class: options
        part: options
        attrs:
          role: group
        children:
          - slot: options
            attrs:
              data-accepts: control
      - el: p
        class: validation
        part: validation
        attrs:
          role: alert
props:
  - $type: prop
    name: data-description
    type: string
    kind: content
    description: helper line under the heading
  - $type: prop
    name: data-error
    type: string
    kind: content
    description: validation message; present → validation row shown
  - $type: prop
    name: data-label
    type: string
    kind: content
    description: group heading (hidden when empty)
  - $type: prop
    name: data-multiple
    type: string
    kind: content
    description: present → checkboxes (multi-select); absent → radios
  - $type: prop
    name: data-status
    type: string
    kind: style
    description: status cascade re-inks heading + validation (critical/…)
  - $type: prop
    name: disabled
    type: boolean
    native: true
    kind: content
    default: false
    description: disable every option
  - $type: prop
    name: value
    type: string
    native: true
    description: "property: string[] when multiple, else string | null"
states:
  - $type: state
    name: label
    selector: ":host([data-label])"
  - $type: state
    name: description
    selector: ":host([data-description])"
  - $type: state
    name: horizontal
    selector: ":host([data-orientation=\"horizontal\"])"
  - $type: state
    name: error
    selector: ":host([data-error])"
  - $type: state
    name: status
    selector: ":host([data-status])"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (value). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: change
    bubbles: true
    composed: true
    trigger:
      "on": change
      node: .options
tokens:
  group.gap: "{sherpa.display-space-xs}"
  legend.gap: "{sherpa.display-space-2xs}"
  label.color: "{sherpa.theme-content-body-base}"
  label.font-size: "{sherpa.font-size-body-large}"
  label.font-weight: "{sherpa.font-weight-semibold}"
  description.color: "{sherpa.theme-content-body-1}"
  description.font-size: "{sherpa.font-size-body-base}"
  divider.border-block-start: "{sherpa.border-width-sm}"
  options.gap: "{sherpa.display-space-xs}"
  validation.color: "{sherpa.theme-content-body-1}"
  validation.font-size: "{sherpa.font-size-body-small}"
$extensions:
  sherpa:
    figmaName: Fieldset
    category: control
    booleanProps:
      - hasDescription
      - hasValidation
    divergence:
      note: >-
        2026-08-26: RENAMED in Figma to "Fieldset" (page "✅ Fieldset"), to match the HTML
        <fieldset>/<legend> model. The head (legend + description) was replaced with a Section
        Header instance (divider on, actions off). The options slot holds detached "Checkbox Field"
        / "Radio Field" frames (Basic control + label + description) — see
        sherpa-select-checkbox/radio _divergence: those are no longer components, just templates.
        Code name still sherpa-select-group; rename to sherpa-fieldset when the code side is
        reworked.
    jsProps:
      - name: value
        type: string
        access: read-write
