name: sherpa-select-group
figmaName: Fieldset
category: control
description: a labelled group of checkbox or radio options.
props:
  data-label:
    kind: content
  data-description:
    kind: content
  data-multiple:
    kind: style
  disabled:
    kind: style
events:
  change:
    $verbatim:
      trigger:
        'on': change
        node: .options
parts:
  - group
  - legend
  - label
  - description
  - options
tokens:
  legend:core-space-2xs: core-space-2xs
  legend:core-space-xs: core-space-xs
  label:status-text:
    override: status-text
  label:content-title-base: content-title-base
  label:core-fonts-scale-lg: core-fonts-scale-lg
  label:core-fonts-weight-600: core-fonts-weight-600
  description:content-secondary-base: content-secondary-base
  description:core-fonts-scale-base: core-fonts-scale-base
  options:core-space-xs: core-space-xs
  options:core-space-base: core-space-base
  label:content-inactive-base: content-inactive-base
  description:content-inactive-base: content-inactive-base
  description:status-text:
    override: status-text
_divergence:
  note: >-
    2026-08-26: RENAMED in Figma to "Fieldset" (page "✅ Fieldset"), to match the HTML
    <fieldset>/<legend> model. The head (legend + description) was replaced with a Section Header
    instance (divider on, actions off). The options slot holds detached "Checkbox Field" / "Radio
    Field" frames (Basic control + label + description) — see sherpa-select-checkbox/radio
    _divergence: those are no longer components, just templates. Code name still
    sherpa-select-group; rename to sherpa-fieldset when the code side is reworked.
figmaVerbatim:
  _status: divergent
  figmaName: Fieldset
  nodeType: COMPONENT
  built: true
  variantAxes: []
  booleanProps:
    - hasDescription
    - hasValidation
  textProps:
    - legend
    - description
    - validation
  instanceProps: []
  modePins: {}
  figmaEvents:
    - change
