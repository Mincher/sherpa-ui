name: sherpa-container-header
figmaName: Container Header
category: container
description: >-
  The header bar for a container's `header` slot: an optional drag handle + icon, a title + optional
  description, and a trailing actions region with an optional collapse toggle and dismiss button.
generated: false
anatomy:
  row(header):
    figma:
      node: COMPONENT
      layout: HORIZONTAL
    children:
      - drag(button):
          part: drag
          figma:
            node: INSTANCE
            of: drag-handle
      - icon(span):
          part: icon
          slot: icon
          figma:
            node: INSTANCE
            of: icon
      - labels(div):
          part: labels
          figma:
            node: FRAME
            layout: VERTICAL
          children:
            - title(span):
                slot: heading
                figma:
                  node: TEXT
                  role: title
            - description(span):
                figma:
                  node: TEXT
                  role: secondary
      - actions(div):
          part: actions
          slot: actions
          figma:
            node: SLOT
            layout: HORIZONTAL
          children:
            - toggle(button):
                part: toggle
                figma:
                  node: INSTANCE
                  of: toggle
            - close(button):
                part: close
                figma:
                  node: INSTANCE
                  of: close
props:
  data-title:
    $verbatim:
      type: string
      default: null
      kind: content
      description: Heading text (or use the heading slot).
      figma:
        text: heading
  data-description:
    $verbatim:
      type: string
      default: null
      kind: content
      description: Secondary text below the heading.
      figma:
        boolean: hasDescription
        text: description
  data-icon:
    $verbatim:
      type: string
      default: null
      kind: content
      description: A glyph before the title.
      figma:
        boolean: hasIcon
  data-draggable:
    kind: visibility
    figmaBoolean: hasDragHandle
    description: Show the drag handle.
  data-dismissible:
    kind: visibility
    figmaBoolean: dismissible
    description: Show the close button.
  data-collapsible:
    kind: visibility
    figmaBoolean: hasToggle
    description: Show the collapse toggle.
  data-collapsed:
    $verbatim:
      type: boolean
      default: false
      kind: content
      description: Collapsed state (the toggle reflects it).
      figma:
        note: collapsed
templates:
  - default
slots:
  heading:
    accepts:
      - content
    description: Custom heading element (replaces the default title).
  icon:
    accepts:
      - content
    description: Custom icon element (else data-icon glyph).
  actions:
    accepts:
      - control
      - input
    description: Extra trailing action controls (before toggle/close).
events:
  container-header-dismiss:
    description: The close button was pressed.
    $verbatim:
      trigger:
        'on': click
        node: .close
  container-header-toggle:
    description: The collapse toggle flipped the collapsed state.
    $verbatim:
      detail:
        collapsed: boolean
      trigger:
        'on': click
        node: .toggle
  container-header-drag:
    description: The drag handle received a pointerdown (start of a reorder).
    $verbatim:
      trigger:
        'on': pointerdown
        node: .drag
parts:
  - row
  - drag
  - icon
  - labels
  - title
  - description
  - actions
  - toggle
  - close
tokens:
  row.gap: container-space-gap-sm
  row.padding: container-space-padding-sm
  labels.gap: core-space-3xs
  title.color:
    override: status-text
    fallback: content-title-base
  description.color: content-secondary-base
  actions.gap: container-space-gap-sm
figmaVerbatim:
  _status: matched
  figmaName: Container Header
  nodeType: COMPONENT_SET
  built: true
  variantAxes:
    - name: Variant
      values:
        - Default
        - Panel
  booleanProps:
    - hasDragHandle
    - hasActions
    - hasIcon
    - hasMetadata
  textProps:
    - heading
  instanceProps: []
  modePins: {}
  figmaEvents: []
  note: 'rebuilt 2026-08-15: added drag-handle, icon, dismiss, collapse toggle + events'
