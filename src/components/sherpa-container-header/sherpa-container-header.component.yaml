# sherpa-container-header — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-container-header.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-container-header
$description: the header bar for a container's `header` slot.
element:
  $type: element
  tag: header
  provides: []
templates:
  - default
anatomy:
  root:
    el: header
    class: header
    part: header
    children:
      - el: span
        class: left
        part: left
        children:
          - el: sherpa-button
            class: drag
            part: drag
            attrs:
              data-type: icon
              data-size: xs
              data-look: transparent
              data-icon-start: drag-handle-vertical
              aria-label: Drag to reorder
          - el: sherpa-button
            class: toggle
            part: toggle
            attrs:
              data-type: icon
              data-size: sm
              data-look: transparent
              data-icon-start: chevron-up
              aria-expanded: "true"
              aria-label: Collapse
          - el: span
            class: icon
            part: icon
            slot: icon
            attrs:
              aria-hidden: "true"
      - el: div
        class: labels
        part: labels
        children:
          - slot: heading
            children:
              - el: span
                class: title sherpa-truncate
                part: title
      - el: div
        class: actions
        part: actions
        children:
          - slot: actions
            attrs:
              data-accepts: control,input
          - el: sherpa-button
            class: close
            part: close
            attrs:
              data-type: icon
              data-size: sm
              data-look: transparent
              data-icon-start: cross
              aria-label: Close
      - el: div
        class: metadata
        part: metadata
        children:
          - el: span
            class: description sherpa-truncate
            part: description
          - slot: metadata
            attrs:
              data-accepts: content,control
props:
  - $type: prop
    name: data-collapsed
    type: string
    observed: true
    kind: style
    default: false
    description: collapsed state (opt-in; absent = expanded default; the toggle reflects it)
  - $type: prop
    name: data-collapsible
    type: string
    observed: false
    kind: style
    description: show the collapse toggle
  - $type: prop
    name: data-description
    type: string
    observed: false
    kind: content
    description: secondary text (rendered into .description)
  - $type: prop
    name: data-dismissible
    type: string
    observed: false
    kind: style
    description: show the close button
  - $type: prop
    name: data-draggable
    type: string
    observed: false
    kind: style
    description: show the drag handle
  - $type: prop
    name: data-heading
    type: string
    observed: false
    kind: content
    description: heading text (rendered into .title)
  - $type: prop
    name: data-icon
    type: string
    observed: false
    kind: content
    description: a glyph before the title (shows the icon slot)
  - $type: prop
    name: data-type
    type: enum
    observed: false
    kind: style
    values:
      - default
      - panel
    default: default
    description: default | panel
states:
  - $type: state
    name: draggable
    selector: ":host([data-draggable])"
  - $type: state
    name: icon
    selector: ":host([data-icon])"
  - $type: state
    name: has-icon
    selector: ":host([data-has-icon])"
  - $type: state
    name: collapsible
    selector: ":host([data-collapsible])"
  - $type: state
    name: has-heading
    selector: ":host([data-has-heading])"
  - $type: state
    name: description
    selector: ":host([data-description])"
  - $type: state
    name: dismissible
    selector: ":host([data-dismissible])"
  - $type: state
    name: collapsed
    selector: ":host([data-collapsed])"
  - $type: state
    name: has-metadata
    selector: ":host([data-has-metadata])"
  - $type: state
    name: panel
    selector: ":host([data-type=\"panel\"])"
events:
  - $type: event
    name: header-dismiss
    bubbles: true
    composed: true
  - $type: event
    name: header-collapse
    bubbles: true
    composed: true
    detail:
      collapsed: unknown
  - $type: event
    name: header-drag
    bubbles: true
    composed: true
tokens:
  header.column-gap: "{sherpa.theme-gap-sm}"
  header.padding: "{sherpa.theme-padding-md}"
  left.gap: "{sherpa.theme-gap-sm}"
  drag.inline-size: "{sherpa.display-mode-size-sm}"
  drag.block-size: "{sherpa.display-mode-size-sm}"
  icon.inline-size: "{sherpa.theme-content-size-base}"
  icon.block-size: "{sherpa.theme-content-size-base}"
  icon.color: "{sherpa.theme-content-body-1}"
  title.color: "{sherpa.theme-content-body-base}"
  title.font-family: "{sherpa.font-family-body}"
  title.font-size: "{sherpa.font-size-body-base}"
  title.font-weight: "{sherpa.font-weight-medium}"
  title.line-height: "{sherpa.theme-content-line-height-base}"
  description.color: "{sherpa.theme-content-body-1}"
  description.font-family: "{sherpa.font-family-body}"
  description.font-size: "{sherpa.font-size-body-small}"
  description.line-height: "{sherpa.theme-content-line-height-small}"
  actions.gap: "{sherpa.theme-gap-sm}"
  toggle.transition: "{sherpa.motion-base}"
  metadata.margin-block-start: "{sherpa.theme-gap-sm}"
  metadata.gap: "{sherpa.theme-gap-lg}"
  metadata.color: "{sherpa.theme-content-body-1}"
  metadata.font-family: "{sherpa.font-family-body}"
  metadata.font-size: "{sherpa.font-size-body-small}"
  metadata.line-height: "{sherpa.theme-content-line-height-small}"
$extensions:
  sherpa:
    figmaName: Container Header
    category: container
    variantAxes:
      - name: Variant
        values:
          - Panel
          - accordion
          - default
    booleanProps:
      - hasDragHandle
      - hasActions
      - hasIcon
      - hasMetadata
    _divergence:
      accordionVariant: >-
        Figma's Container Header set has three Variant values (default / accordion / Panel). Code
        data-variant exposes only `default` and `panel`. The `accordion` variant is the default
        skeleton whose trailing affordance is a disclosure chevron (iconStart 17:4752) instead of
        the close X (iconStart 17:4120) — i.e. exactly the existing `data-collapsible` state (shows
        .toggle, fires header-collapse, rotates on data-collapsed). It is therefore represented as a
        boolean state, not a data-variant value, to avoid a redundant second path to the same
        chevron affordance. A fully standalone disclosure card (native <details>/<summary>, own
        chevron) is the separate `sherpa-accordion` component. No `accordion` data-variant value is
        planned.
