# sherpa-container-header — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-container-header.{thin.yaml,html,css,ts}. The MECHANICAL surface only —
# props (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# Validated by schemas/component.v1.json; round-trips via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-container-header
$description: >-
  The header bar for a container's `header` slot: an optional drag handle + icon, a title + optional
  description, and a trailing actions region with an optional collapse toggle and dismiss button.
element:
  $type: element
  tag: header
  provides: []
templates:
  - default
anatomy:
  root:
    el: header
    class: row
    part: row
    children:
      - el: button
        class: drag
        part: drag
        attrs:
          type: button
          aria-label: Drag to reorder
        children:
          - el: span
            class: drag-glyph
            attrs:
              aria-hidden: "true"
      - el: span
        class: icon
        part: icon
        slot: icon
        attrs:
          aria-hidden: "true"
      - el: div
        class: labels
        part: labels
        slot: heading
        children:
          - el: span
            class: description
            part: description
      - el: div
        class: actions
        part: actions
        slot: actions
        children:
          - el: button
            class: toggle
            part: toggle
            attrs:
              type: button
              aria-expanded: "true"
              aria-label: Collapse
            children:
              - el: span
                class: toggle-glyph
                attrs:
                  aria-hidden: "true"
          - el: button
            class: close
            part: close
            attrs:
              type: button
              aria-label: Close
            children:
              - el: span
                class: close-glyph
                attrs:
                  aria-hidden: "true"
props:
  - $type: prop
    name: data-collapsed
    type: string
    kind: content
    default: false
    description: collapsed state (the toggle reflects it)
  - $type: prop
    name: data-collapsible
    type: string
    kind: style
    description: show the collapse toggle
  - $type: prop
    name: data-description
    type: string
    kind: content
    description: secondary text (rendered into .description)
  - $type: prop
    name: data-dismissible
    type: string
    kind: style
    description: show the close button
  - $type: prop
    name: data-draggable
    type: string
    kind: style
    description: show the drag handle
  - $type: prop
    name: data-icon
    type: string
    kind: content
    description: a glyph before the title (shows the icon slot)
  - $type: prop
    name: data-title
    type: string
    kind: content
    description: heading text (rendered into .title)
states:
  - $type: state
    name: draggable
    selector: ":host([data-draggable])"
  - $type: state
    name: icon
    selector: ":host([data-icon])"
  - $type: state
    name: has-icon
    selector: ":host([data-has-icon])"
  - $type: state
    name: has-heading
    selector: ":host([data-has-heading])"
  - $type: state
    name: description
    selector: ":host([data-description])"
  - $type: state
    name: collapsible
    selector: ":host([data-collapsible])"
  - $type: state
    name: dismissible
    selector: ":host([data-dismissible])"
  - $type: state
    name: collapsed
    selector: ":host([data-collapsed])"
  - $type: state
    name: focus-visible
    selector: .toggle:focus-visible
events:
  - $type: event
    name: container-header-dismiss
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .close
  - $type: event
    name: container-header-toggle
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .toggle
  - $type: event
    name: container-header-drag
    bubbles: true
    composed: true
    trigger:
      "on": pointerdown
      node: .drag
tokens:
  row.gap: "{sherpa.theme-gap-md}"
  row.padding: "{sherpa.theme-padding-md}"
  labels.gap: "{sherpa.display-space-3xs}"
  drag.inline-size: "{sherpa.display-size-sm}"
  drag.block-size: "{sherpa.display-size-sm}"
  drag.color: "{sherpa.theme-content-body-1}"
  icon.inline-size: "{sherpa.display-size-sm}"
  icon.block-size: "{sherpa.display-size-sm}"
  icon.color: "{sherpa.theme-content-body-base}"
  title.color: "{sherpa.theme-content-body-base}"
  title.font-family: "{sherpa.font-family-body}"
  title.font-size: "{sherpa.font-size-body-large}"
  title.font-weight: "{sherpa.font-weight-semibold}"
  description.color: "{sherpa.theme-content-body-1}"
  description.font-family: "{sherpa.font-family-body}"
  description.font-size: "{sherpa.font-size-body-base}"
  actions.gap: "{sherpa.theme-gap-md}"
$extensions:
  sherpa:
    figmaName: Container Header
    category: container
    variantAxes:
      - name: Variant
        values:
          - Default
          - Panel
    booleanProps:
      - hasDragHandle
      - hasActions
      - hasIcon
      - hasMetadata
