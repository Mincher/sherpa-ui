<!--
  sherpa-container-header — the header bar for a container's `header` slot.

  Matches the Figma "Container Header": an optional drag handle + icon on the
  lead, a title + optional description, then a trailing actions region with an
  optional collapse toggle and a dismiss (close) button. A `metadata` slot sits
  below the heading row — a bottom metadata strip in Panel, secondary content in
  Default.

  Two presets share ONE skeleton (heading row + metadata row), switched by
  data-type:
    default  single row — title + optional description + actions (today's header)
    panel    link-style title + right-side actions group + bottom metadata row

  Figma has a third variant, `accordion`. It is NOT a data-type value here:
  it is the default skeleton whose trailing affordance is a disclosure chevron
  instead of a close X — i.e. exactly `data-collapsible` (shows .toggle, fires
  header-collapse, rotates on data-collapsed). Set data-collapsible (and omit
  data-dismissible) to reproduce Figma's accordion header. A fully standalone
  disclosure CARD (native <details>/<summary>, its own chevron) is the separate
  `sherpa-accordion` component — this header only supplies the collapse toggle
  for a container it heads, so no `accordion` variant value is needed.

  Public API:
    data-type     default | panel   (default default)
    data-heading     heading text (rendered into .title)
    data-description  secondary text (rendered into .description)
    data-icon         a glyph before the title (shows the icon slot)
    data-draggable    show the drag handle
    data-dismissible  show the close button
    data-collapsible  show the collapse toggle
    data-collapsed    collapsed state (opt-in; absent = expanded default; the toggle reflects it)

  Slots:
    heading   — custom heading element (replaces the default .title)
    icon      — custom icon element (else data-icon glyph)
    actions   — extra trailing action controls (before toggle/close)
    metadata  — bottom metadata strip (Panel) / secondary content (Default)

  Fires:
    header-dismiss   (detail: {})
    header-collapse  (detail: { collapsed })
    header-drag      (detail: {})
-->
<template id="default">
  <header class="header" part="header">
    <div class="row" part="row">
      <!-- Composed sherpa-buttons, not raw <button>s with unicode glyphs. A
           literal &#x2715; inks at whatever weight the body font gives it, which
           is why the close read wrong beside every other control in the library;
           a Font Awesome glyph fills the box Figma sizes with `icon-size`, and
           the component brings the hover, focus ring and disabled inking with
           it. -->
      <sherpa-button class="drag" part="drag" data-type="icon" data-size="xs"
                     data-look="transparent" data-icon-start="fa-solid fa-grip-vertical"
                     aria-label="Drag to reorder"></sherpa-button>

      <span class="icon" part="icon" aria-hidden="true"><slot name="icon"></slot></span>

      <div class="labels" part="labels">
        <slot name="heading">
          <span class="title" part="title"></span>
        </slot>
        <span class="description" part="description"></span>
      </div>

      <div class="actions" part="actions">
        <slot name="actions" data-accepts="control,input"></slot>
        <sherpa-button class="toggle" part="toggle" data-type="icon" data-size="xs"
                       data-look="transparent" data-icon-start="fa-solid fa-chevron-up"
                       aria-expanded="true" aria-label="Collapse"></sherpa-button>
        <sherpa-button class="close" part="close" data-type="icon" data-size="xs"
                       data-look="transparent" data-icon-start="fa-solid fa-xmark"
                       aria-label="Close"></sherpa-button>
      </div>
    </div>

    <div class="metadata" part="metadata">
      <slot name="metadata" data-accepts="content,control"></slot>
    </div>
  </header>
</template>
