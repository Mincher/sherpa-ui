<!--
  sherpa-select-card — a selectable card with header / content / footer regions.

  The footer holds both select controls; CSS shows one per data-select-mode.
  Filling the footer slot replaces them.

  Public API:
    data-label        header title (used when no header slot is given)
    data-description  helper line under the title
    data-selected     present → the card is selected (also a JS property)
    data-select-mode  radio | checkbox — which footer control shows (default radio).
                      checkbox = multi-select (re-click toggles); radio = single-select.
    data-orientation  vertical | horizontal (footer beside the body vs below; default vertical)
    data-footer       none → hide the footer region entirely (CSS-only)
    disabled          native — dims + blocks interaction
    value             submitted / reported value when selected
    name              radio group name (default footer)

  Slots:
    header    — header region (falls back to data-label / data-description)
    (default) — the card body / content
    footer    — footer region (falls back to the select controls)

  Fires: change — detail { selected, value }
-->
<template id="default">
  <div class="card" part="card">
    <div class="header" part="header">
      <slot name="header">
        <span class="label" part="label"></span>
        <span class="description" part="description"></span>
      </slot>
    </div>

    <div class="body" part="body">
      <slot></slot>
    </div>

    <div class="footer" part="footer">
      <slot name="footer">
        <sherpa-select-radio class="footer-control control-radio" part="footer-control"></sherpa-select-radio>
        <sherpa-select-checkbox class="footer-control control-checkbox" part="footer-control"></sherpa-select-checkbox>
      </slot>
    </div>
  </div>
</template>
