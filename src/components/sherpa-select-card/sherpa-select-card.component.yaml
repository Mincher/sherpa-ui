# sherpa-select-card — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-select-card.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-select-card
$description: a selectable card with header / content / footer regions.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  root:
    el: div
    class: card
    part: card
    children:
      - el: div
        class: header
        part: header
        children:
          - slot: header
      - el: div
        class: body
        part: body
        slot: ""
      - el: div
        class: footer
        part: footer
        children:
          - slot: footer
props:
  - $type: prop
    name: data-description
    type: string
    kind: style
    description: helper line under the title
  - $type: prop
    name: data-footer
    type: string
    kind: style
    description: none → hide the footer region entirely (CSS-only)
  - $type: prop
    name: data-label
    type: string
    kind: style
    description: header title (used when no header slot is given)
  - $type: prop
    name: data-orientation
    type: enum
    kind: style
    values:
      - vertical
      - horizontal
    default: vertical
    description: vertical | horizontal (footer beside the body vs below; default vertical)
  - $type: prop
    name: data-select-mode
    type: enum
    kind: content
    values:
      - radio
      - checkbox
    default: radio
    description: >-
      radio | checkbox — which footer control shows . checkbox = multi-select (re-click toggles);
      radio = single-select.
  - $type: prop
    name: data-selected
    type: string
    kind: content
    description: present → the card is selected (also a JS property)
  - $type: prop
    name: disabled
    type: boolean
    native: true
    kind: content
    default: false
    description: native — dims + blocks interaction
  - $type: prop
    name: name
    type: string
    native: true
    kind: content
    default: footer
    description: radio group name
  - $type: prop
    name: value
    type: string
    native: true
    kind: content
    description: submitted / reported value when selected
states:
  - $type: state
    name: horizontal
    selector: ":host([data-orientation=\"horizontal\"])"
  - $type: state
    name: has-header
    selector: ":host([data-has-header])"
  - $type: state
    name: label
    selector: ":host([data-label])"
  - $type: state
    name: description
    selector: ":host([data-description])"
  - $type: state
    name: none
    selector: ":host([data-footer=\"none\"])"
  - $type: state
    name: checkbox
    selector: ":host([data-select-mode=\"checkbox\"])"
  - $type: state
    name: selected
    selector: ":host([data-selected])"
  - $type: state
    name: not-horizontal
    selector: ":host(:not([data-orientation=\"horizontal\"]))"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (selected, value). See $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: callable from a view definition's state block (focus). See $extensions.sherpa.methods.
events:
  - $type: event
    name: change
    bubbles: true
    composed: true
tokens:
  card.border-width: "{sherpa.display-mode-border-width-base}"
  body.color: "{sherpa.theme-content-body-1}"
  body.font-size: "{sherpa.font-size-body-base}"
  body.line-height: "{sherpa.theme-content-line-height-base}"
  header.gap: "{sherpa.display-mode-space-3xs}"
  label.font-size: "{sherpa.font-size-body-base}"
  label.font-weight: "{sherpa.font-weight-medium}"
  label.line-height: "{sherpa.theme-content-line-height-base}"
  description.color: "{sherpa.theme-content-body-1}"
  description.font-size: "{sherpa.font-size-body-small}"
  description.line-height: "{sherpa.theme-content-line-height-small}"
$extensions:
  sherpa:
    methods:
      - $type: method
        name: focus
        args: "options?: FocusOptions"
    jsProps:
      - name: selected
        type: string
        access: read-write
      - name: value
        type: string
        access: read-write
