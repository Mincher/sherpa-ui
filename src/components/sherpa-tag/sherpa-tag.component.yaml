# sherpa-tag — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-tag.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-tag
$description: A compact labelled pill. Neutral by default; colour comes from the [data-status] cascade.
element:
  $type: element
  tag: span
  provides: []
templates:
  - default
  - dismissible
anatomy:
  root:
    el: span
    class: pill sherpa-border-edges
    part: pill
    children:
      - el: span
        class: icon
        part: icon
        attrs:
          aria-hidden: "true"
        children:
          - slot: icon
            children:
              - el: i
                class: glyph
      - el: span
        class: label
        slot: ""
      - el: button
        class: close
        part: close
        attrs:
          type: button
          aria-label: Remove
        children:
          - el: span
            attrs:
              aria-hidden: "true"
        showWhen: dismissible
props:
  - $type: prop
    name: data-dismissible
    type: string
    kind: style
    default: false
    description: show the close button (selects the dismissible template)
  - $type: prop
    name: data-icon
    type: string
    kind: style
    description: leading icon glyph value (shown when present; or slot "icon")
  - $type: prop
    name: data-status
    type: enum
    kind: style
    values:
      - info
      - success
      - warning
      - critical
      - urgent
    description: info | success | warning | critical | urgent (via the cascade)
  - $type: prop
    name: data-type
    type: string
    kind: style
    description: dot   (render as a small circular indicator; default full)
states:
  - $type: state
    name: dot
    selector: ":host([data-type=\"dot\"])"
  - $type: state
    name: not-icon
    selector: ":host(:not([data-icon]))"
  - $type: state
    name: focus-visible
    selector: .close:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (templateId). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: tag-remove
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .close
tokens:
  pill.gap: "{sherpa.theme-gap-sm}"
  pill.block-size: "{sherpa.display-mode-size-sm}"
  pill.padding: "{sherpa.theme-padding-sm}"
  pill.border-radius: "{sherpa.display-mode-border-rounding-xl}"
  pill.font-size: "{sherpa.theme-content-size-xs}"
  pill.font-weight: "{sherpa.font-weight-regular}"
  pill.line-height: "{sherpa.theme-content-line-height-xs}"
  icon.inline-size: "{sherpa.theme-size-icon-2xs}"
  icon.block-size: "{sherpa.theme-size-icon-2xs}"
  close.inline-size: "{sherpa.theme-size-icon-2xs}"
  close.block-size: "{sherpa.theme-size-icon-2xs}"
  close.margin-inline-start: "{sherpa.theme-gap-sm}"
  close.border-radius: "{sherpa.display-mode-border-rounding-full}"
  close.font-size: "{sherpa.font-size-body-base}"
$extensions:
  sherpa:
    figmaName: Tag
    category: control
    variantAxes:
      - name: Type
        values:
          - dot
          - full
    booleanProps:
      - hasIcon
      - hasDismiss
    jsProps:
      - name: templateId
        type: string
        access: read
