name: sherpa-tag
figmaName: Tag
category: control
description: A compact labelled pill. Neutral by default; colour comes from the [data-status] cascade.
generated: false
anatomy:
  pill(span):
    figma:
      node: FRAME
      layout: HORIZONTAL
      hugHeight: true
    children:
      - icon(span):
          part: icon
          slot: icon
          attrs:
            aria-hidden: 'true'
          figma:
            node: INSTANCE
            source: icon-glyph
      - label(span):
          slot: ''
          figma:
            node: TEXT
            prop: label
      - dismiss:
          owns: sherpa-button
          part: dismiss
          showWhen: removable
          attrs:
            data-type: icon
            data-variant: tertiary
            data-size: 2xs
            data-icon-start: ✕
            aria-label: Remove
          figma:
            node: INSTANCE
            source: sherpa-button
          listen:
            - event: button-click
              action: reemit
              as: tag-remove
props:
  data-status: $status
  data-icon:
    kind: visibility
    description: Show the leading icon.
  data-removable:
    kind: template
    template: removable
    figmaBoolean: hasDismiss
    description: Show the dismiss button (selects the removable template).
  data-collapsed:
    kind: style
    axis:
      name: Type
      value: dot
    description: Render as a small circular indicator (the Figma Type=dot variant).
templates:
  - default
  - removable
slots:
  icon:
    accepts:
      - icon
    description: A leading glyph.
  '':
    accepts:
      - content
    description: The label.
events:
  tag-remove:
    description: Fired when the dismiss button is clicked.
    cancelable: true
    $verbatim:
      trigger:
        from: child
        component: sherpa-button
        event: button-click
      default:
        action: remove-self
        description: The tag removes itself from the DOM. Call preventDefault() to keep it.
        cancelableBy: preventDefault
parts:
  - pill
  - icon
  - dismiss
nested:
  - component: sherpa-button
    relationship: owned
overrides: $standard
tokens:
  pill.gap: control-space-gap-sm
  pill.paddingBlock: control-space-padding-xs
  pill.paddingInline: control-space-padding-sm
  pill.borderWidth: control-border-width
  pill.borderColor:
    override: status-border
    fallback: control-border-default
  pill.borderRadius: core-border-rounding-full
  pill.background:
    override: status-surface
    fallback: control-surface-default
  pill.color:
    override: status-text
    fallback: content-title-base
  pill.fontSize: core-fonts-scale-sm
  pill.fontWeight: core-fonts-weight-600
  icon.size: size-icon-2xs
figmaVerbatim:
  _status: matched
  figmaName: Tag
  nodeType: COMPONENT_SET
  built: true
  variantAxes:
    - name: Type
      values:
        - dot
        - full
  booleanProps:
    - hasIcon
    - hasDismiss
  textProps:
    - label
  instanceProps: []
  modePins: {}
  figmaEvents: []
  note: >-
    Type=dot is the collapsed indicator; status is the [data-status] cascade (no mode pin).
    hasDismiss = the owned dismiss Button.
