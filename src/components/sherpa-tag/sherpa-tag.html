<!--
  sherpa-tag — a compact labelled pill.

  Templates (via data-removable):
    default   — label pill
    removable — label pill + a close button (fires tag-remove)

  Colour comes from the [data-status] cascade on an ancestor: the pill fills with
  the status surface (primary) or shows a status border on a plain surface
  (secondary). No ancestor status → a neutral pill.

  Public API:
    data-variant    primary (filled status surface) | secondary (status border)
    data-collapsed  render as a small circular indicator (boolean)
    data-removable  show the close button (selects the removable template)

  Fires: tag-remove
-->
<template id="default">
  <span class="pill" part="pill">
    <slot></slot>
  </span>
</template>

<template id="removable">
  <span class="pill" part="pill">
    <span class="label"><slot></slot></span>
    <button class="close" part="close" type="button" aria-label="Remove">
      <span aria-hidden="true">&#215;</span>
    </button>
  </span>
</template>
