# sherpa-switch — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-switch.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-switch
$description: an immediate binary toggle.
element:
  $type: element
  tag: label
  provides:
    - click-forwarding
templates:
  - default
anatomy:
  root:
    el: label
    class: track sherpa-border-edges
    part: track
    children:
      - el: input
        class: input
        attrs:
          type: checkbox
          role: switch
      - el: span
        class: knob
        attrs:
          aria-hidden: "true"
      - el: span
        class: label
        attrs:
          aria-hidden: "true"
props:
  - $type: prop
    name: data-type
    type: string
    observed: true
    kind: style
    description: — default (rectangular, ON/OFF label, square thumb) | simple  (pill, no label, round thumb)
  - $type: prop
    name: checked
    type: boolean
    observed: true
    native: true
    default: false
    description: — native boolean       (current value; drives :checked visuals)
  - $type: prop
    name: disabled
    type: boolean
    observed: true
    native: true
    default: false
    description: — native boolean       (reflected onto the inner input)
  - $type: prop
    name: required
    type: boolean
    observed: true
    native: true
    default: false
    description: — native boolean       (a form refuses it while off)
  - $type: prop
    name: value
    type: string
    observed: true
    native: true
    description: — native string        (what it stands for when on; default "on")
states:
  - $type: state
    name: disabled
    selector: ":host([disabled])"
  - $type: state
    name: focus-visible
    selector: .input:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (checked, disabled, value). See $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: >-
      callable from a view definition's state block (checkValidity, reportValidity, focus). See
      $extensions.sherpa.methods.
events:
  - $type: event
    name: change
    bubbles: true
    composed: true
    detail:
      checked: unknown
      value: unknown
    trigger:
      "on": change
      node: .input
tokens:
  track.inline-size: "{switch.switch-size.width}"
  track.min-block-size: "{switch.switch-size.height}"
  track.padding-block-start: "{switch.switch-size.padding}"
  track.padding-block-end: "{switch.switch-size.padding}"
  track.padding-inline-start: "{switch.switch-size.padding}"
  track.padding-inline-end: "{switch.switch-size.padding}"
  track.border-radius: "{switch.switch-radius.track}"
  track.font-family: "{sherpa.font-family-body}"
  track.font-size: "{sherpa.font-size-body-small}"
  track.font-weight: "{sherpa.font-weight-regular}"
  track.line-height: "{sherpa.theme-content-line-height-small}"
  track.transition: "{sherpa.motion-base}"
  knob.inline-size: "{switch.switch-size.thumb}"
  knob.block-size: "{switch.switch-size.thumb}"
  knob.border-radius: "{switch.switch-radius.thumb}"
  knob.background: "{sherpa.style-content-inverse}"
  knob.transition: "{sherpa.motion-fast}"
  label.transition: "{sherpa.motion-fast}"
  label.color: "{sherpa.style-content-base}"
$extensions:
  sherpa:
    figmaName: Switch
    methods:
      - $type: method
        name: checkValidity
        args: ""
      - $type: method
        name: reportValidity
        args: ""
        description: Check, and show the browser's message on the switch.
      - $type: method
        name: focus
        args: "options?: FocusOptions"
    category: control
    variantAxes:
      - name: Value
        values:
          - "off"
          - "on"
    booleanProps:
      - hasLabel
    jsProps:
      - name: checked
        type: boolean
        description: whether the switch is on (delegates to the inner input)
        access: read-write
      - name: disabled
        type: boolean
        description: disabled state (reflects host attr + inner input)
        access: read-write
      - name: value
        type: string
        description: what it stands for when on (default "on"), as a checkbox's
        access: read-write
