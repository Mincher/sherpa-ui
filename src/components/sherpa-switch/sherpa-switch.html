<!--
  sherpa-switch — an immediate binary toggle.

  An <input> can hold no children, so the knob and label are SIBLING spans
  keyed off :checked / :disabled via the sibling combinator.

  Public API:
    data-label       its words, beside the track — a click on them toggles it, as on a checkbox
    data-description a helper line under the label
    checked    — native boolean       (current value; drives :checked visuals)
    data-type — default (rectangular, ON/OFF label, square thumb)
               | simple  (pill, no label, round thumb)
    disabled   — native boolean       (reflected onto the inner input)
    value      — native string        (what it stands for when on; default "on")
    required   — native boolean       (a form refuses it while off)

  Fires: change  (detail: { checked: boolean, value: string })
-->
<template id="default">
  <!-- ONE label for the whole control, so its words toggle it too. TODO 230 -->
  <label class="field" part="field">
    <span class="track sherpa-border-edges" part="track">
      <input class="input" type="checkbox" role="switch" />
      <span class="knob" aria-hidden="true"></span>
      <span class="label" aria-hidden="true"></span>
    </span>
    <span class="text" part="text">
      <span class="title" part="title"></span>
      <span class="description" part="description"></span>
    </span>
  </label>
</template>
