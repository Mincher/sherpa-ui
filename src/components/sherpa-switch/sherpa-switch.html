<!--
  sherpa-switch — an immediate binary toggle.

  Native-first (naming standard D1/D11): a real <input type="checkbox" role="switch">
  owns the value, keyboard (Space), focus and form participation. A <label> wraps the
  whole track so a click anywhere toggles the input natively — no JS click handler.
  An <input> can't hold child elements, so the visual knob + ON/OFF label are sibling
  spans; CSS keys them off the input's :checked / :disabled / :focus-visible state via
  the sibling combinator. The visual form (rectangular default vs. simple pill) is a
  CSS variant on data-type — the same track markup restyles, no second template.

  Public API:
    checked    — native boolean       (current value; drives :checked visuals)
    data-type — default (rectangular, ON/OFF label, square thumb)
               | simple  (pill, no label, round thumb)
    disabled   — native boolean       (reflected onto the inner input)

  Fires: change  (detail: { checked: boolean })
-->
<template id="default">
  <label class="track sherpa-border-edges" part="track">
    <input class="input" type="checkbox" role="switch" />
    <span class="knob" aria-hidden="true"></span>
    <span class="label" aria-hidden="true"></span>
  </label>
</template>
