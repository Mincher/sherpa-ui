# sherpa-prompt-composer — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-prompt-composer.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-prompt-composer
$description: an AI prompt input.
element:
  $type: element
  tag: form
  attributes:
    autocomplete: "off"
  provides:
    - submit
    - validation
    - reset
templates:
  - default
anatomy:
  root:
    el: form
    class: form
    part: form
    attrs:
      autocomplete: "off"
    children:
      - el: textarea
        class: input
        part: input
        attrs:
          rows: "1"
          spellcheck: "true"
      - el: div
        class: tools
        part: tools
        children:
          - el: div
            class: leading
            part: leading
            children:
              - el: button
                class: lead-btn attach
                part: attach
                attrs:
                  type: button
                  aria-label: Attach
                children:
                  - el: svg
                    class: glyph
                    attrs:
                      viewBox: 0 0 24 24
                      aria-hidden: "true"
                      fill: none
                      stroke: currentColor
                      stroke-width: "2"
                      stroke-linecap: round
                      stroke-linejoin: round
                    children:
                      - el: path
                        attrs:
                          d: >-
                            M21.44 11.05 12.25 20.24a5 5 0 0 1-7.07-7.07l9.19-9.19a3 3 0 0 1 4.24
                            4.24l-9.2 9.19a1 1 0 0 1-1.41-1.41l8.49-8.49
              - el: button
                class: lead-btn lab
                part: lab
                attrs:
                  type: button
                  aria-label: Lab
                children:
                  - el: svg
                    class: glyph
                    attrs:
                      viewBox: 0 0 24 24
                      aria-hidden: "true"
                      fill: none
                      stroke: currentColor
                      stroke-width: "2"
                      stroke-linecap: round
                      stroke-linejoin: round
                    children:
                      - el: path
                        attrs:
                          d: >-
                            M9 3h6M10 3v6.5L4.6 18.1A2 2 0 0 0 6.3 21h11.4a2 2 0 0 0 1.7-2.9L14
                            9.5V3M8 15h8
              - el: div
                class: extras
                part: extras
                slot: extras
          - el: button
            class: send
            part: send
            attrs:
              type: submit
              aria-label: Send
            children:
              - el: span
                class: send-glyph
                attrs:
                  aria-hidden: "true"
props:
  - $type: prop
    name: data-no-leading-actions
    type: string
    kind: style
    description: — hide the two default leading buttons (attach + lab)
  - $type: prop
    name: data-placeholder
    type: string
    kind: content
    description: — textarea placeholder
  - $type: prop
    name: disabled
    type: boolean
    native: true
    kind: content
    default: false
    description: — disables the input, leading buttons + send button
  - $type: prop
    name: value
    type: string
    native: true
    description: — JS property; clear() resets it
states:
  - $type: state
    name: has-extras
    selector: ":host([data-has-extras])"
  - $type: state
    name: no-leading-actions
    selector: ":host([data-no-leading-actions])"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
  - $type: state
    name: focus-visible
    selector: .lead-btn:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (value). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: prompt-submit
    bubbles: true
    composed: true
    trigger:
      "on": submit
      node: .form
  - $type: event
    name: composer-attach
    bubbles: true
    composed: true
  - $type: event
    name: composer-lab
    bubbles: true
    composed: true
tokens:
  form.gap: "{sherpa.display-space-xs}"
  form.padding: "{sherpa.display-space-xs}"
  form.border-width: "{sherpa.style-border-width}"
  form.border-radius: "{sherpa.structure-rounding-top-left}"
  input.min-block-size: "{sherpa.display-size-lg}"
  input.font-size: "{sherpa.font-size-body-large}"
  input.color: "{sherpa.style-content-base}"
  tools.gap: "{sherpa.display-space-2xs}"
  leading.gap: "{sherpa.display-space-2xs}"
  extras.gap: "{sherpa.display-space-2xs}"
  lead-btn.inline-size: "{sherpa.structure-height}"
  lead-btn.block-size: "{sherpa.structure-height}"
  lead-btn.border-radius: "{sherpa.display-border-rounding-full}"
  lead-btn.color: "{sherpa.style-content-base}"
  send.inline-size: "{sherpa.structure-height}"
  send.block-size: "{sherpa.structure-height}"
  send.border-radius: "{sherpa.display-border-rounding-full}"
  send.background: "{sherpa.theme-surface-accent-base}"
  send.color: "{sherpa.theme-content-body-base-fixed}"
  send-glyph.font-size: "{sherpa.font-size-body-large}"
$extensions:
  sherpa:
    figmaName: Prompt Composer
    category: content
    booleanProps:
      - hasLeadingActions
    jsProps:
      - name: value
        type: string
        access: read-write
