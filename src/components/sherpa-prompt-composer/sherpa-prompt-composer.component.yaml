# sherpa-prompt-composer — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-prompt-composer.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-prompt-composer
$description: an AI prompt input. Auto-growing textarea. Enter submits; Shift+Enter inserts a newline.
element:
  $type: element
  tag: form
  attributes:
    autocomplete: "off"
  provides:
    - submit
    - validation
    - reset
templates:
  - default
anatomy:
  root:
    el: form
    class: form
    part: form
    attrs:
      autocomplete: "off"
    children:
      - el: textarea
        class: input
        part: input
        attrs:
          rows: "1"
          spellcheck: "true"
      - el: div
        class: tools
        part: tools
        children:
          - el: div
            class: leading
            part: leading
            children:
              - el: sherpa-button
                class: lead-btn attach
                part: attach
                attrs:
                  data-type: icon
                  data-size: sm
                  data-look: transparent
                  data-icon-start: paperclip
                  aria-label: Attach
              - el: sherpa-button
                class: lead-btn lab
                part: lab
                attrs:
                  data-type: icon
                  data-size: sm
                  data-look: transparent
                  data-icon-start: beaker
                  aria-label: Lab
              - el: div
                class: extras
                part: extras
                slot: extras
          - el: sherpa-button
            class: send
            part: send
            attrs:
              data-type: icon
              data-size: sm
              data-look: saturated
              data-icon-start: arrow-up
              aria-label: Send
props:
  - $type: prop
    name: data-no-leading-actions
    type: string
    observed: false
    kind: style
    description: — hide the two default leading buttons (attach + lab)
  - $type: prop
    name: data-placeholder
    type: string
    observed: true
    kind: style
    description: — textarea placeholder
  - $type: prop
    name: disabled
    type: boolean
    observed: true
    native: true
    default: false
    description: — disables the input, leading buttons + send button
states:
  - $type: state
    name: has-extras
    selector: ":host([data-has-extras])"
  - $type: state
    name: no-leading-actions
    selector: ":host([data-no-leading-actions])"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
  - $type: state
    name: focus-visible
    selector: .lead-btn:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (value). See $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: callable from a view definition's state block (focus, clear). See $extensions.sherpa.methods.
events:
  - $type: event
    name: prompt-submit
    bubbles: true
    composed: true
    detail:
      text: unknown
    trigger:
      "on": submit
      node: .form
tokens:
  form.gap: "{sherpa.display-mode-space-xs}"
  form.padding: "{sherpa.display-mode-space-sm}"
  form.border-width: "{sherpa.display-mode-border-width-base}"
  form.border-radius: "{sherpa.border-rounding-top-left}"
  input.min-block-size: "{sherpa.display-mode-size-lg}"
  input.font-size: "{sherpa.font-size-body-base}"
  input.line-height: "{sherpa.theme-content-line-height-base}"
  input.color: "{sherpa.theme-content-body-1}"
  tools.gap: "{sherpa.display-mode-space-2xs}"
$extensions:
  sherpa:
    figmaName: Prompt Composer
    methods:
      - $type: method
        name: focus
        args: ""
      - $type: method
        name: clear
        args: ""
    category: content
    booleanProps:
      - hasLeadingActions
    jsProps:
      - name: value
        type: string
        access: read-write
