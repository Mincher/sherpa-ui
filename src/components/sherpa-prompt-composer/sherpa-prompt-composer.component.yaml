# sherpa-prompt-composer — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-prompt-composer.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-prompt-composer
$description: an AI prompt input.
element:
  $type: element
  tag: form
  attributes:
    autocomplete: "off"
  provides:
    - submit
    - validation
    - reset
templates:
  - default
anatomy:
  root:
    el: form
    class: form
    part: form
    attrs:
      autocomplete: "off"
    children:
      - el: textarea
        class: input
        part: input
        attrs:
          rows: "1"
          spellcheck: "true"
      - el: div
        class: tools
        part: tools
        children:
          - el: div
            class: actions
            part: actions
            slot: actions
          - el: button
            class: send
            part: send
            attrs:
              type: submit
              aria-label: Send
            children:
              - el: span
                class: send-glyph
                attrs:
                  aria-hidden: "true"
props:
  - $type: prop
    name: data-placeholder
    type: string
    kind: content
    description: textarea placeholder
  - $type: prop
    name: disabled
    type: boolean
    native: true
    kind: content
    default: false
    description: — disables the input + send button
  - $type: prop
    name: value
    type: string
    native: true
    description: — JS property; clear() resets it
states:
  - $type: state
    name: has-actions
    selector: ":host([data-has-actions])"
  - $type: state
    name: disabled
    selector: ":host([disabled])"
  - $type: state
    name: focus-visible
    selector: .send:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (value). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: prompt-submit
    bubbles: true
    composed: true
    trigger:
      "on": submit
      node: .form
tokens:
  form.gap: "{sherpa.display-space-xs}"
  form.padding: "{sherpa.display-space-xs}"
  form.border-width: "{sherpa.style-border-width}"
  input.min-block-size: "{sherpa.display-size-lg}"
  input.font-size: "{sherpa.font-size-body-large}"
  input.color: "{sherpa.style-content-base}"
  tools.gap: "{sherpa.display-space-2xs}"
  actions.gap: "{sherpa.display-space-2xs}"
  send.inline-size: "{sherpa.structure-height}"
  send.block-size: "{sherpa.structure-height}"
  send.border-radius: "{sherpa.display-border-rounding-full}"
  send.background: "{sherpa.theme-surface-accent-base}"
  send.color: "{sherpa.theme-content-body-base-fixed}"
  send-glyph.font-size: "{sherpa.font-size-body-large}"
$extensions:
  sherpa:
    figmaName: Prompt Composer
    category: content
    booleanProps:
      - hasLeadingActions
    jsProps:
      - name: value
        type: string
        access: read-write
