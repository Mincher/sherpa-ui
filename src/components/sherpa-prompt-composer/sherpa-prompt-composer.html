<!--
  sherpa-prompt-composer — an AI prompt input.
  Auto-growing textarea. Enter submits; Shift+Enter inserts a newline.

  Public API:
    data-placeholder         — textarea placeholder
    data-no-leading-actions  — hide the two default leading buttons (attach + lab)
    disabled                 — disables the input, leading buttons + send button
    value                    — JS property; clear() resets it

  Slots:
    extras — extra controls after the default leading buttons (reflects data-has-extras)

  Fires:
    prompt-submit   — detail: { text } — on a non-empty submit (then clears).
    composer-attach — detail: {}       — the attach (paperclip) button is pressed.
    composer-lab    — detail: {}       — the lab (flask) button is pressed.
-->
<template id="default">
  <form class="form" part="form" autocomplete="off">
    <textarea class="input" part="input" rows="1" spellcheck="true"></textarea>
    <div class="tools" part="tools">
      <div class="leading" part="leading">
        <sherpa-button class="lead-btn attach" part="attach" data-type="icon" data-size="sm"
                       data-look="transparent" data-icon-start="paperclip"
                       aria-label="Attach"></sherpa-button>
        <sherpa-button class="lead-btn lab" part="lab" data-type="icon" data-size="sm"
                       data-look="transparent" data-icon-start="beaker"
                       aria-label="Lab"></sherpa-button>
        <div class="extras" part="extras"><slot name="extras"></slot></div>
      </div>
      <sherpa-button class="send" part="send" data-type="icon" data-size="sm"
                     data-look="saturated" data-icon-start="arrow-up"
                     aria-label="Send"></sherpa-button>
    </div>
  </form>
</template>
