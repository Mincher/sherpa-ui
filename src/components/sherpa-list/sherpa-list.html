<!--
  sherpa-list — a vertical row container.

  It is a native <ul>. Fill it either by slotting sherpa-list-item children
  (default slot) or via populate([{ title, description?, active?, interactive? }]),
  which stamps <li> rows into the <ul> from the cloning prototype
  (<template class="row-tpl">, no id — so the base template parser ignores it).

  The empty-state message (data-empty) shows when there are no rows; CSS owns
  its visibility.

  Public API:
    data-type  (default — dividers between rows) | bordered | plain (no dividers)
    data-empty    empty-state message

  No events of its own — child rows emit item-click, which the list uses
  to keep a single current row.
-->
<template id="default">
  <ul class="body" part="body">
    <slot></slot>
  </ul>
  <div class="empty" part="empty" role="status" aria-live="polite"></div>

  <template class="row-tpl">
    <li class="row-item">
      <sherpa-list-item
        data-attr-data-label="title"
        data-attr-data-description="description"
        data-when-current="active"
        data-when-interactive="interactive"
      ></sherpa-list-item>
    </li>
  </template>
</template>
