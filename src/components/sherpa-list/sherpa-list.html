<!--
  sherpa-list — a vertical row container. Slot sherpa-list-item children, or
  call populate() to stamp rows from the .row-tpl prototype.

  Public API:
    data-type  (default — dividers between rows) | bordered | plain (no dividers)
    data-empty    empty-state message

  No events of its own — child rows emit item-click, which the list uses
  to keep a single current row.
-->
<template id="default">
  <!-- A role, not a <ul>: a slotted row is a custom element, and a <ul> may
       hold only <li>. The list names each slotted row a listitem. -->
  <div class="body" part="body" role="list">
    <slot></slot>
  </div>
  <div class="empty" part="empty" role="status" aria-live="polite"></div>

  <template class="row-tpl">
    <div class="row-item" role="listitem">
      <sherpa-list-item
        data-attr-data-label="title"
        data-attr-data-description="description"
        data-when-current="active"
        data-when-interactive="interactive"
      ></sherpa-list-item>
    </div>
  </template>
</template>
