$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-list
$description: a vertical container for a homogeneous row list.
element:
  $type: element
  tag: div
  attributes:
    role: list
  provides: []
templates:
  - default
anatomy:
  root:
    el: div
    class: body
    part: body
    slot: ""
    attrs:
      role: list
    children:
      - el: div
        class: rows
        part: rows
props:
  - $type: prop
    name: data-empty
    type: string
    kind: visibility
    description: >-
      empty-state message No events of its own — child rows emit list-item-click, which the list
      uses to keep a single active row.
  - $type: prop
    name: data-variant
    type: enum
    kind: style
    values:
      - default
      - bordered
      - divided
    description: default | bordered | divided
states:
  - $type: state
    name: bordered
    selector: ":host([data-variant=\"bordered\"])"
  - $type: state
    name: divided
    selector: ":host([data-variant=\"divided\"])"
  - $type: state
    name: empty-visible
    selector: ":host([data-empty-visible])"
tokens:
  empty.padding: "{sherpa.theme-padding-lg}"
  empty.color: "{sherpa.theme-content-body-1}"
  empty.font-size: "{sherpa.font-size-body-base}"
$extensions:
  sherpa:
    figmaName: List
    category: container
