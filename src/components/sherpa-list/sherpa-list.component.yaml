# sherpa-list — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-list.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-list
$description: a vertical container for a homogeneous row list.
element:
  $type: element
  tag: ul
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: ul
      class: body
      part: body
      slot: ""
    - el: div
      class: empty
      part: empty
      attrs:
        role: status
        aria-live: polite
    - el: template
      class: row-tpl
      children:
        - el: li
          class: row-item
          children:
            - el: sherpa-list-item
              attrs:
                data-attr-data-label: title
                data-attr-data-description: description
                data-when-current: active
                data-when-interactive: interactive
props:
  - $type: prop
    name: data-empty
    type: string
    observed: true
    kind: content
    description: >-
      empty-state message No events of its own — child rows emit item-click, which the list uses to
      keep a single current row.
  - $type: prop
    name: data-type
    type: string
    observed: false
    kind: style
    default: — dividers between rows
    description: "| bordered | plain (no dividers)"
states:
  - $type: state
    name: empty-visible
    selector: ":host([data-empty-visible])"
  - $type: state
    name: not-plain
    selector: ":host(:not([data-type=\"plain\"]))"
tokens:
  empty.padding: "{sherpa.theme-padding-lg}"
  empty.color: "{sherpa.theme-content-body-1}"
  empty.font-size: "{sherpa.font-size-body-base}"
$extensions:
  sherpa:
    figmaName: List
    category: container
