<!--
  sherpa-overlay-item — a menu option row for floating menus / overlays.

  The host IS the interactive menu item (role + tabindex set in JS). A single
  template: a check mark (shown when data-checked), a leading icon (data-icon),
  the label (data-label), and an optional trailing shortcut (data-shortcut) or
  slotted trailing content.

  Public API:
    data-icon      leading icon glyph
    data-label     option label text
    data-shortcut  trailing shortcut hint text
    data-checked   checked / selected state (adds a check mark)
    data-active    highlighted (keyboard-focused) row
    data-variant   "danger" for destructive treatment
    disabled       disabled state

  Fires: overlay-item-select — detail: { label, checked }
-->
<template id="default">
  <span class="check" part="check" aria-hidden="true">&#x2713;</span>
  <span class="icon" part="icon" aria-hidden="true"></span>
  <span class="label" part="label"></span>
  <span class="shortcut" part="shortcut"><slot name="trailing"></slot></span>
</template>
