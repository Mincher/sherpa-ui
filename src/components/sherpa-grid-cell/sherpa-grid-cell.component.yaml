# sherpa-grid-cell — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-grid-cell.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-grid-cell
$description: >-
  The single atomic cell of the Data Grid. Type sets the role — body cell, column header, filter
  (secondary-header), or group (row-spanning accordion). Content is a slot the designer/consumer
  fills — alignment, emphasis, and numeric formatting are content choices, not variants. A leading
  checkbox and header/filter actions are boolean toggles.
element:
  $type: element
  tag: div
  provides: []
templates:
  - default
anatomy:
  root:
    el: div
    class: cell
    part: cell
    children:
      - el: button
        class: toggle
        part: toggle
        attrs:
          type: button
          aria-label: Toggle group
        children:
          - el: span
            class: toggle-caret
            attrs:
              aria-hidden: "true"
      - el: span
        class: checkbox
        part: checkbox
        children:
          - slot: selection
      - el: span
        class: content
        part: content
        slot: ""
      - el: span
        class: actions
        part: actions
        children:
          - el: button
            class: sort
            part: sort
            attrs:
              type: button
              aria-label: Sort
            children:
              - el: span
                class: sort-caret
                attrs:
                  aria-hidden: "true"
          - el: button
            class: menu
            part: menu
            attrs:
              type: button
              aria-label: Column menu
            children:
              - el: span
                attrs:
                  aria-hidden: "true"
props:
  - $type: prop
    name: data-expanded
    type: string
    kind: style
    description: group is open (boolean; drives the toggle caret)
  - $type: prop
    name: data-has-actions
    type: boolean
    kind: style
    default: false
    description: show the trailing sort + menu buttons
  - $type: prop
    name: data-has-checkbox
    type: boolean
    kind: style
    default: false
    description: show the leading selection checkbox
  - $type: prop
    name: data-sort-direction
    type: enum
    kind: style
    values:
      - asc
      - desc
    description: asc | desc   (header sort state; drives the caret)
  - $type: prop
    name: data-type
    type: enum
    kind: style
    values:
      - cell
      - header
      - filter
      - group
    default: cell
    description: cell | header | filter | group
states:
  - $type: state
    name: header
    selector: ":host([data-type=\"header\"])"
  - $type: state
    name: filter
    selector: ":host([data-type=\"filter\"])"
  - $type: state
    name: group
    selector: ":host([data-type=\"group\"])"
  - $type: state
    name: has-checkbox
    selector: ":host([data-has-checkbox])"
  - $type: state
    name: expanded
    selector: ":host([data-expanded])"
  - $type: state
    name: has-actions
    selector: ":host([data-has-actions])"
  - $type: state
    name: asc
    selector: ":host([data-sort-direction=\"asc\"])"
  - $type: state
    name: desc
    selector: ":host([data-sort-direction=\"desc\"])"
  - $type: state
    name: focus-visible
    selector: .sort:focus-visible
events:
  - $type: event
    name: sort-change
    bubbles: true
    composed: true
    detail:
      direction: unknown
  - $type: event
    name: menu-open
    bubbles: true
    composed: true
  - $type: event
    name: group-toggle
    bubbles: true
    composed: true
    detail:
      expanded: unknown
tokens:
  cell.gap: "{sherpa.display-mode-space-xs}"
  cell.padding: "{sherpa.theme-padding-sm}"
  cell.min-block-size: "{sherpa.structure-height}"
  cell.border-color: "{sherpa.theme-border-default-2}"
  cell.border-block-start-width: "{sherpa.border-top}"
  cell.border-block-end-width: "{sherpa.border-bottom}"
  cell.border-inline-start-width: "{sherpa.border-left}"
  cell.border-inline-end-width: "{sherpa.border-right}"
  cell.background: "{sherpa.style-surface-base}"
  cell.line-height: "{sherpa.theme-content-line-height-base}"
  sort.inline-size: "{sherpa.theme-size-icon-xs}"
  sort.block-size: "{sherpa.theme-size-icon-xs}"
  sort.border-start-start-radius: "{sherpa.border-rounding-top-left}"
  sort.border-start-end-radius: "{sherpa.border-rounding-top-right}"
  sort.border-end-start-radius: "{sherpa.border-rounding-bottom-left}"
  sort.border-end-end-radius: "{sherpa.border-rounding-bottom-right}"
  sort.color: "{sherpa.style-content-base}"
  menu.inline-size: "{sherpa.theme-size-icon-xs}"
  menu.block-size: "{sherpa.theme-size-icon-xs}"
  menu.border-start-start-radius: "{sherpa.border-rounding-top-left}"
  menu.border-start-end-radius: "{sherpa.border-rounding-top-right}"
  menu.border-end-start-radius: "{sherpa.border-rounding-bottom-left}"
  menu.border-end-end-radius: "{sherpa.border-rounding-bottom-right}"
  menu.color: "{sherpa.style-content-base}"
$extensions:
  sherpa:
    figmaName: Grid Cell
    category: control
    variantAxes:
      - name: Type
        values:
          - cell
          - header
          - group
          - filter
    booleanProps:
      - hasCheckbox
      - hasActions
