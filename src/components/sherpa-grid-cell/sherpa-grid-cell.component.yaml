# sherpa-grid-cell — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-grid-cell.{thin.yaml,html,css,ts}. The MECHANICAL surface only —
# props (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# Validated by schemas/component.v1.json; round-trips via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-grid-cell
$description: >-
  The single atomic cell of the Data Grid. Type sets the role — body cell, column header, filter
  (secondary-header), or group (row-spanning accordion). Content is a slot the designer/consumer
  fills — alignment, emphasis, and numeric formatting are content choices, not variants. A leading
  checkbox and header/filter actions are boolean toggles.
templates:
  - default
props:
  - $type: prop
    name: data-has-actions
    type: string
    kind: visibility
    default: false
    description: Show trailing sort + menu buttons. Available on any cell (most common on headers).
  - $type: prop
    name: data-has-checkbox
    type: string
    kind: visibility
    default: false
    description: Show a leading checkbox — a selection cell (body) or select-all (header).
  - $type: prop
    name: data-type
    type: string
    kind: style
    description: >-
      Cell role. cell = a body cell; header = a column header; filter = the optional
      secondary-header cell (a column filter — a transparent Input sitting in the header band);
      group = a row-spanning group header that toggles its rows open/closed (accordion).
      Alignment/emphasis/numeric format are content in the slot, not variants.
events:
  - $type: event
    name: sort-change
    bubbles: true
    composed: true
  - $type: event
    name: menu-open
    bubbles: true
    composed: true
  - $type: event
    name: group-toggle
    bubbles: true
    composed: true
$extensions:
  sherpa:
    figmaName: Grid Cell
    category: control
    variantAxes:
      - name: Type
        values:
          - cell
          - header
          - group
          - filter
    booleanProps:
      - hasCheckbox
      - hasActions
