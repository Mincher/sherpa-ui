name: sherpa-grid-cell
figmaName: Grid Cell
category: control
description: >-
  The single atomic cell of the Data Grid. Type sets the role — body cell, column header, filter
  (secondary-header), or group (row-spanning accordion). Content is a slot the designer/consumer
  fills — alignment, emphasis, and numeric formatting are content choices, not variants. A leading
  checkbox and header/filter actions are boolean toggles.
generated: false
anatomy:
  cell(div):
    figma:
      node: COMPONENT_SET
      layout: HORIZONTAL
      fillWidth: true
      hugHeight: true
    children:
      - toggle(button):
          part: toggle
          showWhen: group
          attrs:
            type: button
            aria-label: Toggle group
            aria-expanded: 'false'
          figma:
            node: INSTANCE
            source: sherpa-button
          listen:
            - event: click
              action: emit
              as: group-toggle
      - checkbox(span):
          part: checkbox
          showWhen: has-checkbox
          figma:
            node: INSTANCE
            source: Basic Checkbox
      - content(div):
          slot: ''
          part: content
          figma:
            node: SLOT
            slotProp: Content
            perVariant: true
            fillWidth: true
      - actions(div):
          part: actions
          showWhen: has-actions
          figma:
            node: FRAME
            layout: HORIZONTAL
          children:
            - sort(button):
                part: sort
                attrs:
                  type: button
                  aria-label: Sort
                figma:
                  node: INSTANCE
                  source: sherpa-button
                listen:
                  - event: click
                    action: emit
                    as: sort-change
            - menu(button):
                part: menu
                attrs:
                  type: button
                  aria-label: Column menu
                figma:
                  node: INSTANCE
                  source: sherpa-button
                listen:
                  - event: click
                    action: emit
                    as: menu-open
props:
  data-type:
    kind: style
    axis:
      name: Type
      value: cell
    values:
      - cell
      - header
      - filter
      - group
    description: >-
      Cell role. cell = a body cell; header = a column header; filter = the optional
      secondary-header cell (a column filter — a transparent Input sitting in the header band);
      group = a row-spanning group header that toggles its rows open/closed (accordion).
      Alignment/emphasis/numeric format are content in the slot, not variants.
  data-has-checkbox:
    kind: visibility
    figmaBoolean: hasCheckbox
    default: false
    description: Show a leading checkbox — a selection cell (body) or select-all (header).
  data-has-actions:
    kind: visibility
    figmaBoolean: hasActions
    default: false
    description: Show trailing sort + menu buttons. Available on any cell (most common on headers).
templates:
  - default
slots:
  '':
    accepts:
      - content
    description: >-
      The cell content — text, a control, or any composed layout. Alignment and emphasis are set
      here by the consumer, not as component variants.
    examples:
      - name: text
        content: A plain text value
      - name: numerical
        content: '123.45'
        align: right
      - name: emphasis
        content: A primary value
        weight: strong
      - name: link
        content: An accent link
        tone: accent
      - name: action
        content: a transparent icon button (e.g. row menu)
events:
  sort-change:
    description: Fired when the header sort control is clicked.
  menu-open:
    description: Fired when the header column-menu button is clicked.
  group-toggle:
    description: Fired when a group cell's chevron is clicked; expands or collapses the group's rows.
parts:
  - cell
  - toggle
  - checkbox
  - content
  - actions
  - sort
  - menu
tokens:
  cell.background: control-surface/base
  cell.borderColor: control-border/default
  cell.color: content/base
  cell.padding: space/2xs
figmaVerbatim:
  note: >-
    One cell component for the whole grid — Type=cell|header|filter|group. Content is a SLOT
    (per-variant). filter = the optional secondary-header cell (a transparent minimal Input, light
    placeholder). Selection = hasCheckbox; header/filter actions = hasActions. Control tier. Atomic
    sub-component of Data Grid (code = a <td>/<th> in a <table>, not a custom element).
  _status: matched
  figmaName: Grid Cell
  nodeType: COMPONENT_SET
  built: true
  variantAxes:
    - name: Type
      values:
        - cell
        - header
        - filter
        - group
  booleanProps:
    - hasCheckbox
    - hasActions
  textProps: []
  instanceProps: []
  modePins: {}
  figmaEvents: []
