<!--
  sherpa-nav — the primary application navigation rail.

  A five-mode state machine: collapsed (40px, resting) | hover | default | pinned |
  settings (all 320px). JS only writes data-nav-state; every visual difference lives
  in CSS off that attribute + the projected Navigation token region.

  populate(config):
    {
      product?:          { name?, icon? },
      quickItems?:       NavEntry[],   // defaults to Home · Recent · Favorites
      sections?:         [{ label?, items: NavEntry[] }],
      settingsSections?: [{ label?, items: NavEntry[] }],  // shown in SETTINGS mode
    }
  where NavEntry = { id, label, icon?, href?, badge?, indicator?, tier? }.
  A plain array is still accepted and treated as one unlabelled section.

  The settings button swaps the rail to settingsSections — settings pages live behind
  that button, not as a nav item in the product tree. `tier: 2 | 3` indents a row.

  Public API:
    data-nav-state  collapsed (default) | hover | default | pinned | settings
    data-active-id  id of the current item
    data-searchable show the search field (auto-set when a product is given)

  Slots:
    brand-icon  the product mark inside the 40×40 branding tile
    footer      pinned footer content (account / user)

  Fires:
    nav-select      — detail: { id, label, icon } (icon absent on a child row)
    nav-search      — detail: { query }
    nav-state-change — detail: { state }  (collapsed → hover → pinned → settings)
-->
<template id="default">
  <nav class="rail" part="rail" aria-label="Main">
    <div class="header" part="header">
      <div class="brand" part="brand">
        <span class="brand-icon" part="brand-icon" aria-hidden="true">
          <slot name="brand-icon"><i class="fa-solid fa-cubes"></i></slot>
        </span>
        <span class="product sherpa-truncate" part="product"></span>
        <button class="hdr-btn sherpa-border-edges pin" part="pin" type="button" aria-pressed="false" aria-label="Pin navigation">
          <i class="fa-solid fa-thumbtack" aria-hidden="true"></i>
        </button>
        <button class="hdr-btn sherpa-border-edges settings" part="settings" type="button" aria-pressed="false" aria-label="Settings">
          <i class="fa-solid fa-gear" aria-hidden="true"></i>
        </button>
      </div>

      <div class="quick-zone" part="quick-zone">
        <div class="search sherpa-border-edges" part="search">
          <i class="search-icon fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input class="search-input" part="search-input" type="search"
                 placeholder="Search" aria-label="Search navigation" />
          <!-- Shown only when the field has text (CSS, data-has-query). -->
          <button class="search-clear" part="search-clear" type="button" aria-label="Clear search">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>

        <ul class="quick" part="quick" role="list"></ul>
      </div>
    </div>

    <div class="content" part="content">
      <slot></slot>
    </div>

    <div class="footer" part="footer">
      <slot name="footer"></slot>
    </div>
  </nav>

  <!-- Cloning prototypes — no id, so the template parser ignores them. -->
  <template class="section-tpl">
    <section class="section">
      <h2 class="section-label" part="section-label"></h2>
      <ul class="section-items" role="list"></ul>
    </section>
  </template>

  <template class="item-tpl">
    <li class="nav-row" role="listitem">
      <sherpa-nav-item></sherpa-nav-item>
    </li>
  </template>
</template>
