<!--
  sherpa-nav — the primary application navigation rail.

  Matches the Figma "Primary Navigation" (32:43161) and its "Navigation Header"
  sub-component (1051:7815). The rail is a FIVE-MODE state machine, exactly the
  modes of the Figma Navigation collection:

    collapsed  40px  icon-only rail (the resting state)
    hover      320px open + an elevation lift, while the pointer is over it
    default    320px open, no lift
    pinned     320px open and latched (the pin button reads active)
    settings   320px open on the tinted surface, header label "Settings"

  JS only writes data-nav-state; every visual difference lives in CSS off that
  attribute + the projected Navigation token region.

  Structure mirrors Figma: a header (Navigation Header row → search → quick items)
  over a scrolling content area of grouped sections, then a footer.

  populate(config):
    {
      product?:    { name?, icon? },
      quickItems?: NavEntry[],          // defaults to Home · Recent · Favorites
      sections?:   [{ label?, items: NavEntry[] }],
    }
  where NavEntry = { id, label, icon?, href?, badge?, indicator?, tier?, children? }.
  A plain array is still accepted and treated as one unlabelled section.

  Public API:
    data-nav-state  collapsed (default) | hover | default | pinned | settings
    data-active-id  id of the current item
    data-searchable show the search field (auto-set when a product is given)

  Slots:
    brand-icon  the product mark inside the 40×40 branding tile
    footer      pinned footer content (account / user)

  Fires:
    nav-select      — detail: { id }
    nav-search      — detail: { query }
    nav-state-change — detail: { state }  (collapsed → hover → pinned → settings)
-->
<template id="default">
  <nav class="rail" part="rail" aria-label="Main">
    <div class="header" part="header">
      <!-- Navigation Header: 40×40 branding tile · product name · pin · settings -->
      <div class="brand" part="brand">
        <span class="brand-icon" part="brand-icon" aria-hidden="true">
          <slot name="brand-icon"><i class="fa-regular fa-hexagon-nodes"></i></slot>
        </span>
        <span class="product" part="product"></span>
        <button class="hdr-btn pin" part="pin" type="button" aria-pressed="false" aria-label="Pin navigation">
          <i class="fa-regular fa-thumbtack" aria-hidden="true"></i>
        </button>
        <button class="hdr-btn settings" part="settings" type="button" aria-pressed="false" aria-label="Settings">
          <i class="fa-regular fa-gear" aria-hidden="true"></i>
        </button>
      </div>

      <div class="quick-zone" part="quick-zone">
        <div class="search" part="search">
          <i class="search-icon fa-regular fa-magnifying-glass" aria-hidden="true"></i>
          <input class="search-input" part="search-input" type="search"
                 placeholder="Search" aria-label="Search navigation" />
        </div>

        <ul class="quick" part="quick" role="list"></ul>
      </div>
    </div>

    <div class="content" part="content">
      <slot></slot>
    </div>

    <div class="footer" part="footer">
      <slot name="footer"></slot>
    </div>
  </nav>

  <!-- Cloning prototypes (data-driven, no id so the parser ignores them) -->
  <template class="section-tpl">
    <section class="section">
      <h2 class="section-label" part="section-label"></h2>
      <ul class="section-items" role="list"></ul>
    </section>
  </template>

  <template class="item-tpl">
    <li class="nav-row" role="listitem">
      <sherpa-nav-item></sherpa-nav-item>
    </li>
  </template>
</template>
