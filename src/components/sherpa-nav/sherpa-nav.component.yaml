# sherpa-nav — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-nav.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-nav
$description: >-
  The primary application navigation rail: a fixed header (brand row + search + quick items) over a
  scrolling area of grouped sections, plus a footer. Rows are composed sherpa-nav-item elements.
element:
  $type: element
  tag: nav
  attributes:
    aria-label: Main
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: nav
      class: rail
      part: rail
      attrs:
        aria-label: Main
      children:
        - el: div
          class: header
          part: header
          children:
            - el: div
              class: brand
              part: brand
              children:
                - el: span
                  class: brand-icon
                  part: brand-icon
                  attrs:
                    aria-hidden: "true"
                  children:
                    - slot: brand-icon
                - el: span
                  class: product
                  part: product
                - el: button
                  class: hdr-btn pin
                  part: pin
                  attrs:
                    type: button
                    aria-pressed: "false"
                    aria-label: Pin navigation
                  children:
                    - el: i
                      class: fa-solid fa-thumbtack
                      attrs:
                        aria-hidden: "true"
                - el: button
                  class: hdr-btn settings
                  part: settings
                  attrs:
                    type: button
                    aria-pressed: "false"
                    aria-label: Settings
                  children:
                    - el: i
                      class: fa-solid fa-gear
                      attrs:
                        aria-hidden: "true"
            - el: div
              class: quick-zone
              part: quick-zone
              children:
                - el: div
                  class: search
                  part: search
                  children:
                    - el: i
                      class: search-icon fa-solid fa-magnifying-glass
                      attrs:
                        aria-hidden: "true"
                    - el: input
                      class: search-input
                      part: search-input
                      attrs:
                        type: search
                        placeholder: Search
                        aria-label: Search navigation
                    - el: button
                      class: search-clear
                      part: search-clear
                      attrs:
                        type: button
                        aria-label: Clear search
                      children:
                        - el: i
                          class: fa-solid fa-xmark
                          attrs:
                            aria-hidden: "true"
                - el: ul
                  class: quick
                  part: quick
                  attrs:
                    role: list
        - el: div
          class: content
          part: content
          slot: ""
        - el: div
          class: footer
          part: footer
          slot: footer
    - el: template
      class: section-tpl
      children:
        - el: section
          class: section
          children:
            - el: h2
              class: section-label
              part: section-label
            - el: ul
              class: section-items
              attrs:
                role: list
props:
  - $type: prop
    name: data-active-id
    type: string
    kind: content
    description: id of the current item
  - $type: prop
    name: data-collapsed
    type: string
    kind: style
    default: false
    description: — icon-only rail (labels, search, section labels hidden)
  - $type: prop
    name: data-nav-state
    type: enum
    kind: content
    values:
      - collapsed
      - hover
      - default
      - pinned
      - settings
    description: collapsed  | hover | default | pinned | settings
  - $type: prop
    name: data-searchable
    type: string
    kind: style
    description: show the search field (auto-set when a product is given)
states:
  - $type: state
    name: has-query
    selector: ":host([data-has-query])"
  - $type: state
    name: collapsed
    selector: ":host([data-nav-state=\"collapsed\"])"
  - $type: state
    name: not-searchable
    selector: ":host(:not([data-searchable]))"
  - $type: state
    name: not-searching
    selector: ":host(:not([data-searching]))"
  - $type: state
    name: focus-visible
    selector: .hdr-btn:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: read/write JS properties (state, pinned). See $extensions.sherpa.jsProps.
events:
  - $type: event
    name: nav-select
    bubbles: true
    composed: true
    trigger:
      "on": item-click
      node: .rail
  - $type: event
    name: nav-search
    bubbles: true
    composed: true
    trigger:
      "on": input
      node: .search-input
  - $type: event
    name: nav-state-change
    bubbles: true
    composed: true
tokens:
  rail.background: "{sherpa.navigation-nav-surface-default}"
  rail.color: "{sherpa.theme-content-body-base}"
  rail.box-shadow: "{sherpa.navigation-nav-shadow-offset-x}"
  header.gap: "{sherpa.display-mode-space-xs}"
  header.padding-block-end: "{sherpa.display-mode-space-xs}"
  brand.gap: "{sherpa.display-mode-space-sm}"
  brand.padding-inline-end: "{sherpa.display-mode-space-xs}"
  brand.min-block-size: "{sherpa.display-mode-size-3xl}"
  brand-icon.inline-size: "{sherpa.display-mode-size-3xl}"
  brand-icon.block-size: "{sherpa.display-mode-size-3xl}"
  brand-icon.border-end-end-radius: "{sherpa.display-mode-border-rounding-lg}"
  brand-icon.background: "{sherpa.theme-surface-active-3}"
  brand-icon.color: "{sherpa.theme-content-body-base-fixed}"
  brand-icon.font-size: "{sherpa.display-mode-size-lg}"
  product.font-size: "{sherpa.font-size-body-large}"
  product.font-weight: "{sherpa.font-weight-medium}"
  product.line-height: "{sherpa.theme-content-line-height-large}"
  product.color: "{sherpa.theme-content-body-1}"
  hdr-btn.--_btn-box: "{sherpa.display-mode-space-xl}"
  hdr-btn.--_btn-glyph: "{sherpa.theme-content-size-small}"
  hdr-btn.border-width: "{sherpa.style-border-width}"
  hdr-btn.border-radius: "{sherpa.structure-rounding-top-left}"
  hdr-btn.color: "{sherpa.style-content-base}"
  quick-zone.gap: "{sherpa.display-mode-space-xs}"
  quick-zone.padding: "{sherpa.display-mode-space-xs}"
  search.gap: "{sherpa.display-mode-space-xs}"
  search.padding-inline-start: "{sherpa.structure-space-padding}"
  search.block-size: "{sherpa.display-mode-size-2xl}"
  search.border-radius: "{sherpa.structure-rounding-top-left}"
  search.border-width: "{sherpa.style-border-width}"
  search.border-color: "{sherpa.style-border-base}"
  search.background: "{sherpa.style-surface-base}"
  search-icon.color: "{sherpa.theme-content-body-1}"
  search-icon.font-size: "{sherpa.theme-size-icon-xs}"
  search-input.font-size: "{sherpa.font-size-body-base}"
  search-input.line-height: "{sherpa.theme-content-line-height-base}"
  search-input.color: "{sherpa.theme-content-body-base}"
  search-clear.inline-size: "{sherpa.display-mode-size-2xl}"
  search-clear.border-start-end-radius: "{sherpa.structure-rounding-top-right}"
  search-clear.border-end-end-radius: "{sherpa.structure-rounding-bottom-right}"
  search-clear.color: "{sherpa.theme-content-body-1}"
  search-clear.font-size: "{sherpa.theme-content-size-base}"
  quick.gap: "{sherpa.display-mode-space-xs}"
  content.padding-inline: "{sherpa.display-mode-space-xs}"
  content.gap: "{sherpa.display-mode-space-xs}"
  section.gap: "{sherpa.display-mode-space-xs}"
  section-label.gap: "{sherpa.display-mode-space-xs}"
  section-label.padding: "{sherpa.display-mode-space-2xs}"
  section-label.font-size: "{sherpa.font-size-body-xs}"
  section-label.font-weight: "{sherpa.font-weight-regular}"
  section-label.line-height: "{sherpa.theme-content-line-height-xs}"
  section-label.color: "{sherpa.theme-content-body-1}"
  section-items.gap: "{sherpa.display-mode-space-xs}"
  footer.padding: "{sherpa.display-mode-space-xs}"
$extensions:
  sherpa:
    figmaName: Primary Navigation
    category: nav
    jsProps:
      - name: state
        type: string
        access: read-write
      - name: pinned
        type: string
        access: read-write
