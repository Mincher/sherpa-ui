# sherpa-nav — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-nav.{thin.yaml,html,css,ts}. The MECHANICAL surface only —
# props (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# Validated by schemas/component.v1.json; round-trips via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-nav
$description: >-
  The primary application navigation rail: a fixed header (brand row + search + quick items) over a
  scrolling area of grouped sections, plus a footer. Rows are composed sherpa-nav-item elements.
element:
  $type: element
  tag: nav
  attributes:
    aria-label: Main
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: nav
      class: rail
      part: rail
      attrs:
        aria-label: Main
      children:
        - el: div
          class: header
          part: header
          children:
            - el: div
              class: brand
              part: brand
              children:
                - el: span
                  class: brand-icon
                  part: brand-icon
                  slot: brand-icon
                  attrs:
                    aria-hidden: "true"
                - el: span
                  class: product
                  part: product
                - el: span
                  class: brand-actions
                  part: brand-actions
                  slot: brand-actions
            - el: div
              class: search
              part: search
              children:
                - el: span
                  class: search-icon
                  attrs:
                    aria-hidden: "true"
                - el: input
                  class: search-input
                  part: search-input
                  attrs:
                    type: search
                    placeholder: Search
                    aria-label: Search navigation
            - el: ul
              class: quick
              part: quick
              attrs:
                role: list
        - el: div
          class: content
          part: content
          slot: ""
        - el: div
          class: footer
          part: footer
          slot: footer
    - el: template
      class: section-tpl
      children:
        - el: section
          class: section
          children:
            - el: h2
              class: section-label
              part: section-label
            - el: ul
              class: section-items
              attrs:
                role: list
props:
  - $type: prop
    name: data-active-id
    type: string
    kind: content
    description: — id of the currently active item
  - $type: prop
    name: data-collapsed
    type: string
    kind: style
    default: false
    description: — icon-only rail (labels, search, section labels hidden)
  - $type: prop
    name: data-searchable
    type: string
    kind: style
    description: show the search field (auto-set when product/search config given)
states:
  - $type: state
    name: searchable
    selector: ":host([data-searchable])"
  - $type: state
    name: collapsed
    selector: ":host([data-collapsed])"
events:
  - $type: event
    name: nav-select
    bubbles: true
    composed: true
    trigger:
      "on": nav-item-click
      node: .rail
  - $type: event
    name: nav-search
    bubbles: true
    composed: true
    trigger:
      "on": input
      node: .search-input
tokens:
  rail.background: "{sherpa.style-surface-base}"
  rail.color: "{sherpa.style-content-base}"
  header.gap: "{sherpa.display-space-xs}"
  header.padding: "{sherpa.display-space-sm}"
  brand.gap: "{sherpa.display-space-sm}"
  brand.min-block-size: "{sherpa.display-size-3xl}"
  brand-icon.inline-size: "{sherpa.display-size-3xl}"
  brand-icon.block-size: "{sherpa.display-size-3xl}"
  brand-icon.font-size: "{sherpa.font-size-body-large}"
  product.font-size: "{sherpa.font-size-body-large}"
  product.font-weight: "{sherpa.font-weight-semibold}"
  product.color: "{sherpa.theme-content-body-base}"
  brand-actions.gap: "{sherpa.display-space-2xs}"
  search.gap: "{sherpa.display-space-xs}"
  search.padding-inline: "{sherpa.display-space-sm}"
  search.block-size: "{sherpa.display-size-2xl}"
  search.border-radius: "{sherpa.display-border-rounding-base}"
  search.background: "{sherpa.style-surface-base}"
  search-icon.font-size: "{sherpa.font-size-body-small}"
  search-input.font-size: "{sherpa.font-size-body-base}"
  search-input.color: "{sherpa.style-content-base}"
  quick.gap: "{sherpa.display-space-3xs}"
  content.padding: "{sherpa.display-space-sm}"
  content.gap: "{sherpa.display-space-sm}"
  section.gap: "{sherpa.display-space-3xs}"
  section-label.padding: "{sherpa.display-space-2xs}"
  section-label.font-size: "{sherpa.font-size-body-xs}"
  section-label.font-weight: "{sherpa.font-weight-semibold}"
  section-label.color: "{sherpa.theme-content-body-1}"
  section-items.gap: "{sherpa.display-space-3xs}"
  footer.padding: "{sherpa.display-space-sm}"
$extensions:
  sherpa:
    figmaName: Primary Navigation
    category: nav
