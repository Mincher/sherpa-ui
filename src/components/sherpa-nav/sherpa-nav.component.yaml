# sherpa-nav — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-nav.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-nav
$description: the primary application navigation rail.
element:
  $type: element
  tag: nav
  attributes:
    aria-label: Main
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: nav
      class: rail
      part: rail
      attrs:
        aria-label: Main
      children:
        - el: div
          class: header
          part: header
          children:
            - el: div
              class: brand
              part: brand
              children:
                - el: span
                  class: brand-icon
                  part: brand-icon
                  attrs:
                    aria-hidden: "true"
                  children:
                    - slot: brand-icon
                      children:
                        - el: i
                          class: sherpa-icon-box
                          attrs:
                            data-icon: group
                - el: span
                  class: product sherpa-truncate
                  part: product
                - el: span
                  class: actions
                  part: actions
                  children:
                    - el: sherpa-button
                      class: settings
                      part: settings
                      attrs:
                        data-type: icon
                        data-size: sm
                        data-group: start
                        data-icon-start: gear
                        aria-label: Settings
                        aria-pressed: "false"
                    - el: sherpa-button
                      class: pin
                      part: pin
                      attrs:
                        data-type: icon
                        data-size: sm
                        data-group: end
                        data-icon-start: thumbtack-angle
                        aria-label: Pin navigation
                        aria-pressed: "false"
                    - slot: actions
            - el: div
              class: quick-zone
              part: quick-zone
              children:
                - el: div
                  class: search sherpa-border-edges sherpa-border-corners
                  part: search
                  children:
                    - el: i
                      class: search-icon sherpa-icon-box
                      attrs:
                        data-icon: magnifying-glass
                        aria-hidden: "true"
                    - el: input
                      class: search-input
                      part: search-input
                      attrs:
                        type: search
                        placeholder: Search
                        aria-label: Search navigation
                    - el: button
                      class: search-clear
                      part: search-clear
                      attrs:
                        type: button
                        aria-label: Clear search
                      children:
                        - el: i
                          class: sherpa-icon-box
                          attrs:
                            data-icon: cross
                            aria-hidden: "true"
                - el: ul
                  class: quick
                  part: quick
                  attrs:
                    role: list
        - el: div
          class: content
          part: content
          slot: ""
        - el: div
          class: footer
          part: footer
          slot: footer
        - el: div
          class: menu-foot
          part: menu-foot
          children:
            - el: sherpa-nav-item
              class: menu-settings
              attrs:
                data-label: Settings
                data-icon: gear
            - el: sherpa-button
              class: menu-cancel
    - el: template
      class: section-tpl
      children:
        - el: section
          class: section
          children:
            - el: h2
              class: section-label
              part: section-label
            - el: ul
              class: section-items
              attrs:
                role: list
props:
  - $type: prop
    name: data-current-id
    type: string
    observed: true
    kind: style
    description: id of the current Context
  - $type: prop
    name: data-menu
    type: string
    observed: false
    kind: visibility
    description: >-
      the PHONE's menu: the whole screen, no Pin, Settings at the bottom, and Cancel — openMenu() /
      closeMenu()
  - $type: prop
    name: data-nav-state
    type: enum
    observed: true
    kind: style
    values:
      - collapsed
      - hover
      - default
      - pinned
      - settings
    description: collapsed  | hover | default | pinned | settings
  - $type: prop
    name: data-searchable
    type: string
    observed: false
    kind: style
    description: show the search field (auto-set when a product is given)
states:
  - $type: state
    name: menu
    selector: ":host([data-menu])"
  - $type: state
    name: collapsed
    selector: ":host([data-nav-state=\"collapsed\"])"
  - $type: state
    name: has-query
    selector: ":host([data-has-query])"
  - $type: state
    name: not-searchable
    selector: ":host(:not([data-searchable]))"
  - $type: state
    name: not-searching
    selector: ":host(:not([data-searching]))"
  - $type: state
    name: focus-visible
    selector: .search-clear:focus-visible
capabilities:
  - $type: capability
    api: js-property-mirror
    description: >-
      read/write JS properties (state, pinned, activeEntry, currentId). See
      $extensions.sherpa.jsProps.
  - $type: capability
    api: js-methods
    description: >-
      callable from a view definition's state block (openMenu, closeMenu, entry). See
      $extensions.sherpa.methods.
events:
  - $type: event
    name: nav-select
    bubbles: true
    composed: true
    detail:
      id: unknown
    trigger:
      "on": item-click
      node: .rail
  - $type: event
    name: nav-search
    bubbles: true
    composed: true
    detail:
      query: unknown
    trigger:
      "on": input
      node: .search-input
  - $type: event
    name: nav-state-change
    bubbles: true
    composed: true
    detail:
      state: unknown
  - $type: event
    name: nav-menu-change
    bubbles: true
    composed: true
    detail:
      open: boolean
tokens:
  rail.background: "{sherpa.navigation-nav-surface-default}"
  rail.color: "{sherpa.style-content-base}"
  rail.box-shadow: "{sherpa.navigation-nav-shadow-offset-x}"
  header.gap: "{sherpa.display-mode-space-none}"
  header.padding-block-end: "{sherpa.display-mode-space-xs}"
  brand.gap: "{sherpa.display-mode-space-sm}"
  brand.padding-inline-end: "{sherpa.display-mode-space-xs}"
  brand.min-block-size: "{sherpa.display-mode-size-3xl}"
  brand-icon.inline-size: "{sherpa.display-mode-size-3xl}"
  brand-icon.block-size: "{sherpa.display-mode-size-3xl}"
  brand-icon.border-end-end-radius: "{sherpa.display-mode-border-rounding-lg}"
  brand-icon.background: "{sherpa.theme-surface-active-3}"
  brand-icon.color: "{sherpa.style-content-inverse}"
  brand-icon.font-size: "{sherpa.display-mode-size-lg}"
  product.font-size: "{sherpa.font-size-body-large}"
  product.font-weight: "{sherpa.font-weight-medium}"
  product.line-height: "{sherpa.theme-content-line-height-large}"
  product.color: "{sherpa.style-content-secondary}"
  quick-zone.gap: "{sherpa.display-mode-space-xs}"
  quick-zone.padding: "{sherpa.display-mode-space-xs}"
  search.gap: "{sherpa.display-mode-space-xs}"
  search.padding-inline-start: "{sherpa.structure-space-padding}"
  search.block-size: "{sherpa.display-mode-size-2xl}"
  search.border-color: "{sherpa.style-border-base}"
  search.background: "{sherpa.style-surface-base}"
  search-icon.color: "{sherpa.style-content-secondary}"
  search-icon.font-size: "{sherpa.theme-size-icon-xs}"
  search-input.font-size: "{sherpa.font-size-body-base}"
  search-input.line-height: "{sherpa.theme-content-line-height-base}"
  search-input.color: "{sherpa.style-content-base}"
  search-clear.inline-size: "{sherpa.display-mode-size-2xl}"
  search-clear.border-start-end-radius: "{sherpa.border-rounding-top-right}"
  search-clear.border-end-end-radius: "{sherpa.border-rounding-bottom-right}"
  search-clear.color: "{sherpa.style-content-secondary}"
  search-clear.font-size: "{sherpa.theme-content-size-base}"
  quick.gap: "{sherpa.display-mode-space-xs}"
  content.padding-inline: "{sherpa.display-mode-space-xs}"
  content.gap: "{sherpa.display-mode-space-xs}"
  section.gap: "{sherpa.display-mode-space-xs}"
  section-label.gap: "{sherpa.display-mode-space-xs}"
  section-label.block-size: "{sherpa.display-mode-size-lg}"
  section-label.padding: "{sherpa.display-mode-space-2xs}"
  section-label.font-size: "{sherpa.font-size-body-xs}"
  section-label.font-weight: "{sherpa.font-weight-regular}"
  section-label.line-height: "{sherpa.theme-content-line-height-xs}"
  section-label.color: "{sherpa.style-content-secondary}"
  section-items.gap: "{sherpa.display-mode-space-xs}"
  footer.padding: "{sherpa.display-mode-space-xs}"
$extensions:
  sherpa:
    figmaName: Primary Navigation
    methods:
      - $type: method
        name: openMenu
        args: ""
        description: >-
          openMenu() — the PHONE's menu: the nav over the whole screen, open, with no Pin; Settings
          at the bottom and Cancel. A Context row closes it as it goes.
      - $type: method
        name: closeMenu
        args: ""
        description: closeMenu() — back to the rail, going nowhere. Settings stays open.
      - $type: method
        name: entry
        args: "id: string"
        description: What a row shows. Read off the stamped ROW, so hand-authored rows work too.
    category: nav
    jsProps:
      - name: state
        type: NavState
        access: read-write
      - name: pinned
        type: boolean
        access: read-write
      - name: activeEntry
        type: NavRowInfo | null
        access: read
      - name: currentId
        type: string
        access: read-write
