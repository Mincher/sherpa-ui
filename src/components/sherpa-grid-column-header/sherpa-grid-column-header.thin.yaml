name: sherpa-grid-column-header
figmaName: .Grid Column Header
category: data
description: >-
  The header row of a data-grid column: a label plus optional sort/menu actions. The Type variant
  sets label alignment (left, right, centralised).
generated: false
tier: sub-component
parentComponent: sherpa-grid-column
anatomy:
  header(div):
    figma:
      node: COMPONENT_SET
      layout: HORIZONTAL
      fillWidth: true
      hugHeight: true
    children:
      - label(span):
          figma:
            node: TEXT
            prop: label
            role: label
      - actions(div):
          figma:
            node: FRAME
            layout: HORIZONTAL
            hugWidth: true
          children:
            - sort(sherpa-button):
                owns: sherpa-button
                attrs:
                  data-variant: tertiary
                  data-size: sm
                  data-icon-only: 'true'
                figma:
                  node: INSTANCE
                  of: Button
                  icon: sort
props:
  data-type:
    $verbatim:
      type: enum
      values:
        - left-aligned
        - right-aligned
        - centralised
      default: left-aligned
      kind: style
      description: Label alignment within the header.
      figma:
        variantAxis: Type
  data-has-label:
    $verbatim:
      type: boolean
      default: true
      kind: visibility
      description: Show the header text label.
      figma:
        boolean: hasLabel
  data-has-actions:
    kind: visibility
    figmaBoolean: hasActions
    description: Show the sort / menu action buttons.
templates:
  - default
events:
  sort-click:
    description: Fires when the sort action is clicked; the grid cycles asc → desc.
    $verbatim:
      detail:
        field: string
      trigger:
        'on': click
        node: sort
parts:
  - header
  - label
  - actions
nested:
  - component: sherpa-button
    relationship: owned
    role: sort/menu action
    note: icon-only tertiary Button — reuse, never a bespoke icon box (Rule 1)
tokens:
  header.background: surface-secondary-base
  header.borderColor: container-border-default
  header.borderWidth: border-width-base
  header.gap: space-xs
  header.paddingInline: space-xs
  header.paddingBlock: space-xs
  label.color: content-title-base
  actions.gap: space-xs
figmaVerbatim:
  _status: matched
  figmaName: .Grid Column Header
  nodeType: COMPONENT_SET
  built: true
  variantAxes:
    - name: Type
      values:
        - left-aligned
        - right-aligned
        - centralised
  booleanProps: []
  textProps: []
  instanceProps: []
  modePins: {}
  figmaEvents: []
