$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-chart-legend
$description: a legend for charts.
element:
  $type: element
  tag: ul
  attributes:
    role: list
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: ul
      class: legend
      part: legend
      attrs:
        role: list
    - el: template
      class: item-tpl
      children:
        - el: li
          class: item
          attrs:
            role: listitem
          children:
            - el: button
              class: row
              attrs:
                type: button
              children:
                - el: span
                  class: swatch
                  part: swatch
                  attrs:
                    aria-hidden: "true"
                - el: span
                  class: label
                  part: label
                - el: span
                  class: value
                  part: value
props:
  - $type: prop
    name: data-orientation
    type: enum
    kind: style
    values:
      - horizontal
      - vertical
    description: horizontal  | vertical
states:
  - $type: state
    name: vertical
    selector: ":host([data-orientation=\"vertical\"])"
  - $type: state
    name: focus-visible
    selector: .row:focus-visible
