# sherpa-chart-legend — DTCG-dialect component spec (GENERATED by scripts/generate-component-spec.mjs).
#
# Derived from sherpa-chart-legend.{html,css,ts}. The MECHANICAL surface only — props
# (with enum values), anatomy, events, token bindings, element, best-effort
# states/capabilities. Richer state/capability PROSE is left for hand-finishing.
# The Figma binding under $extensions.sherpa is preserved verbatim across regen
# (owned by resync-figma.mjs). Validated by schemas/component.v1.json; round-trips
# via roundtrip-component.mjs.
#
$schema: ../../../schemas/component.v1.json
$type: component
$name: sherpa-chart-legend
$description: a legend for charts.
element:
  $type: element
  tag: div
  attributes:
    role: list
  provides: []
templates:
  - default
anatomy:
  roots:
    - el: div
      class: legend
      part: legend
      attrs:
        role: list
    - el: template
      class: item-tpl
      children:
        - el: button
          class: item
          attrs:
            type: button
            role: listitem
            aria-pressed: "true"
          children:
            - el: span
              class: swatch
              part: swatch
              attrs:
                aria-hidden: "true"
            - el: span
              class: label
              part: label
            - el: span
              class: value
              part: value
props:
  - $type: prop
    name: data-orientation
    type: enum
    kind: style
    values:
      - vertical
      - horizontal
    description: vertical  | horizontal
states:
  - $type: state
    name: horizontal
    selector: ":host([data-orientation=\"horizontal\"])"
  - $type: state
    name: readonly
    selector: ":host([data-readonly])"
  - $type: state
    name: focus-visible
    selector: .item:focus-visible
events:
  - $type: event
    name: legend-item-click
    bubbles: true
    composed: true
    trigger:
      "on": click
      node: .legend
  - $type: event
    name: label
    bubbles: true
    composed: true
  - $type: event
    name: active
    bubbles: true
    composed: true
tokens:
  legend.column-gap: "{sherpa.display-mode-space-xs}"
  legend.row-gap: "{sherpa.display-mode-space-2xs}"
  legend.padding: "{sherpa.display-mode-space-xs}"
  item.border-radius: "{sherpa.border-rounding-top-left}"
  item.color: "{sherpa.theme-content-body-1}"
  item.font-family: "{sherpa.font-family-mono}"
  item.font-size: "{sherpa.theme-content-size-small}"
  item.font-weight: "{sherpa.font-weight-regular}"
  item.line-height: "{sherpa.theme-content-line-height-xs}"
  swatch.inline-size: "{sherpa.display-mode-size-xs}"
  swatch.block-size: "{sherpa.display-mode-size-xs}"
  swatch.border-radius: "{sherpa.border-rounding-top-left}"
  swatch.border-width: "{sherpa.display-mode-border-width-base}"
  swatch.border-color: "{sherpa.data-viz-series-1}"
  swatch.background: "{sherpa.data-viz-series-1}"
  value.color: "{sherpa.theme-content-body-base}"
  rollup-menu-btn.margin-inline-start: "{sherpa.display-mode-space-2xs}"
$extensions:
  sherpa:
    figmaName: Chart Legend
    figmaNodeId: "1099:37879"
    category: chart
    variantAxes:
      - name: Orientation
        values:
          - vertical
          - horizontal
    _divergence:
      hasValueLivesOnTheRow: >-
        `hasValue` is a property of Figma's `Legend Item` (186:4667), the ROW, not of the Chart
        Legend that holds them — the spec used to claim it at the legend level, which is one tier
        too high and read as drift against the live set. The code matches Figma: `populate([{ label,
        value?, colorIndex }])` takes an optional per-ENTRY value and the row's `.value` span
        carries it, so the option is per row on both sides.
      orientationIsFrameWidthOnly: >-
        The Figma set's `Orientation` axis distinguishes only the FRAME WIDTH of its two variants
        (394 vs 153) — both lay their slot out the same way. The code has no data-orientation: the
        legend is a CSS grid that wraps to its container, so one element covers both, and a
        container query does what the variant switch does in Figma.
