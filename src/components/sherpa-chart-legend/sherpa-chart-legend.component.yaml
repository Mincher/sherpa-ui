  swatch.border-radius: "{sherpa.display-border-rounding-sm}"
  swatch.background: "{sherpa.categorical-1}"
  value.color: "{sherpa.theme-content-body-1}"
  value.font-weight: "{sherpa.font-weight-semibold}"
$extensions:
