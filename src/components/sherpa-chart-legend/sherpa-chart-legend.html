<!--
  sherpa-chart-legend — a legend for charts. Figma "Chart Legend" (1098:37846).

  Public API:
    data-orientation  vertical (default) | horizontal

  Fires: legend-item-click — detail: { index, label, active }
-->
<template id="default">
  <div class="legend" part="legend" role="list"></div>

  <template class="item-tpl">
    <button class="item" type="button" role="listitem" aria-pressed="true">
      <span class="swatch sherpa-border-corners" part="swatch" aria-hidden="true"></span>
      <span class="label sherpa-truncate" part="label"></span>
      <span class="value" part="value"></span>
    </button>
  </template>

  <!--
    The "OTHER" roll-up. It cannot reuse .item-tpl: that prototype IS a <button>,
    and the browser un-nests a nested button, silently killing the inner control.
    data-commit keeps the menu open while several rows are ticked.
  -->
  <template class="rollup-tpl">
    <span class="rollup" role="listitem">
      <button class="item rollup-toggle" type="button" aria-pressed="true">
        <span class="swatch sherpa-border-corners" part="swatch" aria-hidden="true"></span>
        <span class="label sherpa-truncate" part="label"></span>
        <span class="value" part="value"></span>
      </button>
      <sherpa-button
        class="rollup-menu-btn"
        data-size="xs"
        data-type="icon"
        data-icon-start="fa-solid fa-caret-down"
        aria-haspopup="menu"
        aria-expanded="false"></sherpa-button>
      <sherpa-menu class="rollup-menu" data-heading="Breakdown" data-commit></sherpa-menu>
    </span>
  </template>

  <!-- One rolled-up category, as a checkbox row in the breakdown menu. -->
  <template class="rollup-row-tpl">
    <label><input type="checkbox" /><span class="rollup-row-label"></span></label>
  </template>
</template>
