<!--
  sherpa-chart-legend — a legend for charts.

  Matches the rebuilt Figma "Chart Legend" (1098:37846), which is a GRID, not a
  list of rows: three columns — swatch · category · value — with a 8px column gap
  and a 4px row gap, inside a frame padded 8 all round.

  A grid, not one flex row per entry, because that is what aligns the columns: with
  per-row flex the value sits wherever its own label ends, so a legend of mixed
  label lengths has ragged values. The grid gives every entry the same three
  tracks, so the values line up down the column.

  Each entry is still ONE button spanning the three tracks (`display: grid` with
  `grid-column: 1 / -1` and its own subgrid), so the whole entry stays a single
  click target and a single tab stop. Splitting the cells into separate grid items
  would align them but leave three tab stops per series.

  The swatch is the Figma "Legend Swatch" (1098:37786): 12×12, radius 4, the series
  hue at 60% with a solid 1px stroke in the same hue.

  populate([{ label, value?, colorIndex }]) stamps the entries from the cloning
  prototype. Clicking one toggles it and emits legend-item-click, which the page
  wires to the chart's setSeriesHidden / setSliceHidden.

  PLACEMENT follows the orientation, and the two are not interchangeable. A
  VERTICAL legend is one entry per row on three shared tracks, so it sits BESIDE a
  chart — slot it into the chart's [slot=legend]. A HORIZONTAL one puts every entry
  on ONE row (Figma's 9-column variant), so it sits BELOW a chart, as a sibling
  after it. A vertical legend under a chart wastes a column of height; a horizontal
  one beside it is too wide to fit.

  Orientation is handled entirely in CSS, so the component observes no attributes:
  changing data-orientation re-styles with no re-render.

  Public API:
    data-orientation  vertical (default) | horizontal

  Fires: legend-item-click — detail: { index, label, active }
-->
<template id="default">
  <div class="legend" part="legend" role="list"></div>

  <template class="item-tpl">
    <button class="item" type="button" role="listitem" aria-pressed="true">
      <span class="swatch" part="swatch" aria-hidden="true"></span>
      <span class="label" part="label"></span>
      <span class="value" part="value"></span>
    </button>
  </template>

  <!--
    The "OTHER" entry — the roll-up row, which needs a second control.

    It cannot reuse .item-tpl: that prototype IS a <button>, and a menu button
    nested inside a button is invalid HTML (the browser un-nests it and the inner
    control stops working). So the roll-up row is a WRAPPER holding two siblings:
    the toggle button (identical to a normal entry) and an xsmall icon button that
    opens the breakdown menu.

    The menu lists the rolled-up categories as CHECKBOX rows with an Apply/Cancel
    footer, so the reader can tick several without the menu closing after each
    click. sherpa-menu already does exactly that with data-commit.
  -->
  <template class="rollup-tpl">
    <span class="rollup" role="listitem">
      <button class="item rollup-toggle" type="button" aria-pressed="true">
        <span class="swatch" part="swatch" aria-hidden="true"></span>
        <span class="label" part="label"></span>
        <span class="value" part="value"></span>
      </button>
      <sherpa-button
        class="rollup-menu-btn"
        data-size="xs"
        data-type="icon"
        data-icon-start="fa-solid fa-ellipsis"
        aria-haspopup="menu"
        aria-expanded="false"></sherpa-button>
      <sherpa-menu class="rollup-menu" data-heading="Breakdown" data-commit></sherpa-menu>
    </span>
  </template>

  <!-- One rolled-up category, as a real checkbox row in the breakdown menu. -->
  <template class="rollup-row-tpl">
    <label><input type="checkbox" /><span class="rollup-row-label"></span></label>
  </template>
</template>
