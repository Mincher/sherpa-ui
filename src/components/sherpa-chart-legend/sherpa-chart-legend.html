<!--
  sherpa-chart-legend — a legend for charts. Figma "Chart Legend" (1098:37846).

  Public API:
    data-orientation  vertical (default) | horizontal
    data-segment-field  ASKED of its provider, or read off its chart: one row per value.
                        A click narrows its chart alone
    data-readonly     a KEY, not a filter: its rows do not toggle

  Fires: legend-item-click — detail: { index, label, active }
-->
<template id="default">
  <div class="legend" part="legend" role="group" aria-label="Legend"></div>

  <!-- One row: a KEY chip, and its value in a shared column beside it. A
       click on the number does nothing. TODO 149 -->
  <template class="item-tpl">
    <div class="item">
      <sherpa-quick-filter class="entry" data-type="key" data-locked data-current>
        <span class="label sherpa-truncate" part="label"></span>
      </sherpa-quick-filter>
      <span class="value" part="value"></span>
    </div>
  </template>

  <!-- The "OTHER" roll-up: a row, and the menu button beside it, which may
       not sit inside the chip's button. The menu is the button's OWN, slotted,
       so sherpa-button drives it: it holds `data-open` through the popover's
       light-dismiss. TRAP T-a-trigger-click-follows-light-dismiss
       data-commit keeps the menu open while several rows are ticked. -->
  <template class="rollup-tpl">
    <span class="rollup">
      <sherpa-button
        class="rollup-menu-btn"
        data-size="xs"
        data-type="icon"
        data-icon-start="triangle-down"
        aria-label="Breakdown" aria-haspopup="dialog">
        <sherpa-menu slot="menu" class="rollup-menu" data-heading="Breakdown" data-commit></sherpa-menu>
      </sherpa-button>
    </span>
  </template>

  <!-- One rolled-up category, as a checkbox row in the breakdown menu. -->
  <template class="rollup-row-tpl">
    <label><input type="checkbox" /><span class="rollup-row-label"></span></label>
  </template>
</template>
