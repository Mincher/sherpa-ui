<!--
  sherpa-chart-legend — a legend for charts. Figma "Chart Legend" (1098:37846).
  A list, or a strip when its chart is square or narrower: its chart says.

  Public API:
    data-segment-field  ASKED of its provider, or read off its chart: one row per value.
                        A click narrows its chart alone
    data-readonly     a KEY, not a filter: its rows do not toggle
    data-chips        each row a value chip, as a filter panel draws it: its swatch,
                      its label, its count. Set by its provider. Will, TODO 586
    data-highlight-hover  a rest on a row says legend-hover. Set by its provider. TODO 495

  Fires:
    legend-item-click — detail: { index, label, active }
    legend-hover — a pointer rests on a row, or leaves it. detail: { label, on }
-->
<template id="default">
  <div class="legend" part="legend" role="group" aria-label="Legend"></div>

  <!-- One row: a KEY chip, and its value in a shared column beside it. A
       click on the number does nothing. TODO 149 -->
  <template class="item-tpl">
    <div class="item">
      <sherpa-quick-filter class="entry" data-type="key" data-locked data-current>
        <span class="label sherpa-truncate" part="label"></span>
      </sherpa-quick-filter>
      <span class="value" part="value"></span>
    </div>
  </template>

  <!-- One row with `data-chips`: the value chip a filter panel draws, its number
       in its count; a value that is no number, a band's range, beside it. TODO 586 -->
  <template class="chip-tpl">
    <div class="item">
      <sherpa-quick-filter class="entry" slot="values" data-locked data-current></sherpa-quick-filter>
      <span class="value" part="value"></span>
    </div>
  </template>

  <!-- The "OTHER" roll-up: a row, and the menu button beside it, which may
       not sit inside the chip's button. The menu is the button's OWN, slotted,
       so sherpa-button drives it: it holds `data-open` through the popover's
       light-dismiss. TRAP T-a-trigger-click-follows-light-dismiss
       data-commit keeps the menu open while several rows are ticked. -->
  <template class="rollup-tpl">
    <span class="rollup">
      <sherpa-button
        class="rollup-menu-btn"
        data-size="xs"
        data-type="icon"
        data-icon-start="triangle-down"
        aria-label="Breakdown" aria-haspopup="dialog">
        <sherpa-menu slot="menu" class="rollup-menu" data-heading="Breakdown" data-select="multiple" data-no-select-all data-commit></sherpa-menu>
      </sherpa-button>
    </span>
  </template>

  <!-- The words its code hands on as data. TRAP T-a-word-is-in-the-markup -->
  <template class="words">
    <span data-word="other">Other</span>
  </template>
</template>
