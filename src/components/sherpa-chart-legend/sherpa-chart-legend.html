<!--
  sherpa-chart-legend — a legend for charts. Figma "Chart Legend" (1098:37846).

  A GRID of three tracks (swatch · category · value), not one flex row per entry,
  so values line up down the column. Each entry is still ONE button spanning all
  three tracks — one click target, one tab stop.

  A VERTICAL legend goes in the chart's [slot=legend]; a HORIZONTAL one goes BELOW
  the chart as a sibling after it. Orientation is pure CSS, so nothing re-renders.

  Public API:
    data-orientation  vertical (default) | horizontal

  Fires: legend-item-click — detail: { index, label, active }
-->
<template id="default">
  <div class="legend" part="legend" role="list"></div>

  <template class="item-tpl">
    <button class="item" type="button" role="listitem" aria-pressed="true">
      <span class="swatch" part="swatch" aria-hidden="true"></span>
      <span class="label" part="label"></span>
      <span class="value" part="value"></span>
    </button>
  </template>

  <!--
    The "OTHER" roll-up entry. It cannot reuse .item-tpl: that prototype IS a
    <button>, and a nested button is un-nested by the browser, which silently
    kills the inner control. Hence a wrapper holding two sibling controls.

    data-commit keeps the menu open while several rows are ticked.
  -->
  <template class="rollup-tpl">
    <span class="rollup" role="listitem">
      <button class="item rollup-toggle" type="button" aria-pressed="true">
        <span class="swatch" part="swatch" aria-hidden="true"></span>
        <span class="label" part="label"></span>
        <span class="value" part="value"></span>
      </button>
      <!-- caret-down, as every other menu control in the system wears. -->
      <sherpa-button
        class="rollup-menu-btn"
        data-size="xs"
        data-type="icon"
        data-icon-start="fa-solid fa-caret-down"
        aria-haspopup="menu"
        aria-expanded="false"></sherpa-button>
      <sherpa-menu class="rollup-menu" data-heading="Breakdown" data-commit></sherpa-menu>
    </span>
  </template>

  <!-- One rolled-up category, as a real checkbox row in the breakdown menu. -->
  <template class="rollup-row-tpl">
    <label><input type="checkbox" /><span class="rollup-row-label"></span></label>
  </template>
</template>
