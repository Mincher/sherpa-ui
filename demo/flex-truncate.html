<!doctype html>
<html lang="en" data-theme="apex-2-core">
  <head>
    <title>flex-truncate — demo</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link href="../css/styles/index.css" rel="stylesheet" />
    <script type="module" src="../components/sherpa-metric/sherpa-metric.js"></script>
    <style>
      body {
        margin: 0;
        padding: 24px 32px 64px;
        font-family: var(--sherpa-fonts-context-body, "Open Sans", sans-serif);
        font-size: 14px;
        color: var(--sherpa-text-default-body);
        background: var(--sherpa-surface-page-default);
      }

      h1 {
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 8px;
        color: var(--sherpa-text-default-heading);
      }

      p {
        margin: 0 0 8px;
        color: var(--sherpa-text-default-secondary);
        max-width: 640px;
        line-height: 1.6;
      }

      code {
        font-family: var(--sherpa-fonts-context-mono, monospace);
        font-size: 12px;
        background: var(--sherpa-surface-container-subtle, #f0f0f5);
        padding: 1px 4px;
        border-radius: 2px;
      }

      h2 {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--sherpa-text-default-secondary);
        margin: 40px 0 16px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--sherpa-border-container-default);
      }

      .demo-stack {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .demo-item {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .demo-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--sherpa-text-default-secondary);
        font-family: var(--sherpa-fonts-context-mono, monospace);
      }

      /* Visual frame — no padding so the flex-truncate container width
         matches exactly the outer frame's content-box width.            */
      .demo-frame {
        border: 1px solid var(--sherpa-border-container-default, #d5d5e0);
        border-radius: 4px;
        overflow: hidden;
        background: var(--sherpa-surface-container-default, #ffffff);
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <h1>flex-truncate</h1>
    <p>
      Drag the resize handles to test truncation on both axes.
    </p>

    <h2>Row — resize width</h2>
    <div class="demo-item">
      <span class="demo-label">← drag →</span>
      <div class="flex-truncate"
        style="width: min(960px, 100%); resize: horizontal; overflow: auto;">
        <sherpa-metric data-label="Total Revenue" value="$1.24M" data-trend="up"   data-delta="+8.3%"></sherpa-metric>
        <sherpa-metric data-label="Active Users"  value="4,821"  data-trend="up"   data-delta="+12%"></sherpa-metric>
        <sherpa-metric data-label="Uptime"        value="99.9%"  data-trend="flat" data-status="success"></sherpa-metric>
        <sherpa-metric data-label="Avg Response"  value="42ms"   data-trend="down" data-delta="−6ms"></sherpa-metric>
        <sherpa-metric data-label="Error Rate"    value="0.02%"  data-trend="down" data-status="success"></sherpa-metric>
      </div>
    </div>

    <h2>Column — resize height</h2>
    <div class="demo-item">
      <span class="demo-label">↑ drag ↓  <code>data-direction="column"</code> + <code>data-min-child-height="100px"</code></span>
      <div class="flex-truncate"
        data-direction="column"
        data-min-child-height="100px"
        style="width: 280px; height: 540px; resize: vertical; overflow: auto;">
        <sherpa-metric data-label="Total Revenue" value="$1.24M" data-trend="up"   data-delta="+8.3%"></sherpa-metric>
        <sherpa-metric data-label="Active Users"  value="4,821"  data-trend="up"   data-delta="+12%"></sherpa-metric>
        <sherpa-metric data-label="Uptime"        value="99.9%"  data-trend="flat" data-status="success"></sherpa-metric>
        <sherpa-metric data-label="Avg Response"  value="42ms"   data-trend="down" data-delta="−6ms"></sherpa-metric>
        <sherpa-metric data-label="Error Rate"    value="0.02%"  data-trend="down" data-status="success"></sherpa-metric>
      </div>
    </div>
  </body>
</html>
