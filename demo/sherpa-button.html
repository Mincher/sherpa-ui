<!doctype html>
<html lang="en" data-theme="apex-2-purple">
  <head>
    <title>sherpa-button — variants</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link href="../css/styles/index.css" rel="stylesheet" />
    <script type="module" src="../components/sherpa-button/sherpa-button.js"></script>
    <style>
      body {
        margin: 0;
        padding: 24px 32px 64px;
        font-family: var(--sherpa-fonts-context-body, "Open Sans", sans-serif);
        font-size: 14px;
        color: var(--sherpa-text-default-body);
        background: var(--sherpa-surface-page-default);
      }

      h1 {
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 8px;
        color: var(--sherpa-text-default-heading);
      }

      h2 {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--sherpa-text-default-secondary);
        margin: 40px 0 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--sherpa-border-container-default);
      }

      .row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
      }

      .row-label {
        font-size: 11px;
        color: var(--sherpa-text-default-secondary);
        min-width: 100px;
      }

      .swatch {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 16px;
        border-radius: 4px;
      }

      .swatch-dark {
        background: var(--sherpa-surface-control-primary-default);
      }
    </style>
  </head>
  <body>
    <h1>sherpa-button</h1>

    <!-- ── Variants ──────────────────────────────────────────── -->
    <h2>Variants</h2>
    <div class="row">
      <sherpa-button data-variant="primary"            data-label="Primary"></sherpa-button>
      <sherpa-button data-variant="secondary"          data-label="Secondary"></sherpa-button>
      <sherpa-button data-variant="tertiary"           data-label="Tertiary"></sherpa-button>
    </div>
    <div class="swatch swatch-dark row">
      <sherpa-button data-variant="tertiary-on-color"  data-label="Tertiary on color"></sherpa-button>
    </div>

    <!-- ── Sizes ─────────────────────────────────────────────── -->
    <h2>Sizes</h2>
    <div class="row">
      <sherpa-button data-variant="primary" data-size="large"    data-label="Large"></sherpa-button>
      <sherpa-button data-variant="primary" data-size="base"     data-label="Base"></sherpa-button>
      <sherpa-button data-variant="primary" data-size="small"    data-label="Small"></sherpa-button>
      <sherpa-button data-variant="primary" data-size="x-small"  data-label="X-Small"></sherpa-button>
      <sherpa-button data-variant="primary" data-size="2x-small" data-label="2X-Small"></sherpa-button>
    </div>

    <!-- ── With icons ────────────────────────────────────────── -->
    <h2>Icons</h2>
    <div class="row">
      <sherpa-button data-variant="primary"    data-label="Leading icon"  data-icon-start="fa-solid fa-plus"></sherpa-button>
      <sherpa-button data-variant="primary"    data-label="Trailing icon" data-icon-end="fa-solid fa-chevron-down"></sherpa-button>
      <sherpa-button data-variant="primary"    data-label="Both icons"    data-icon-start="fa-solid fa-star" data-icon-end="fa-solid fa-chevron-down"></sherpa-button>
      <sherpa-button data-variant="secondary"  data-label="Secondary"     data-icon-start="fa-solid fa-pencil"></sherpa-button>
    </div>

    <!-- ── Icon-only ──────────────────────────────────────────── -->
    <h2>Icon-only (data-type="icon")</h2>
    <div class="row">
      <sherpa-button data-variant="primary"   data-type="icon" data-icon-start="fa-solid fa-plus"   aria-label="Add"></sherpa-button>
      <sherpa-button data-variant="secondary" data-type="icon" data-icon-start="fa-solid fa-pencil" aria-label="Edit"></sherpa-button>
      <sherpa-button data-variant="tertiary"  data-type="icon" data-icon-start="fa-solid fa-trash"  aria-label="Delete"></sherpa-button>
    </div>

    <!-- ── States ────────────────────────────────────────────── -->
    <h2>States</h2>
    <div class="row">
      <sherpa-button data-variant="primary"   data-label="Default"></sherpa-button>
      <sherpa-button data-variant="primary"   data-label="Active"   data-active></sherpa-button>
      <sherpa-button data-variant="primary"   data-label="Disabled" disabled></sherpa-button>
    </div>
    <div class="row">
      <sherpa-button data-variant="secondary" data-label="Default"></sherpa-button>
      <sherpa-button data-variant="secondary" data-label="Active"   data-active></sherpa-button>
      <sherpa-button data-variant="secondary" data-label="Disabled" disabled></sherpa-button>
    </div>
    <div class="row">
      <sherpa-button data-variant="tertiary"  data-label="Default"></sherpa-button>
      <sherpa-button data-variant="tertiary"  data-label="Active"   data-active></sherpa-button>
      <sherpa-button data-variant="tertiary"  data-label="Disabled" disabled></sherpa-button>
    </div>

    <!-- ── Dismissable (with close button) ───────────────────── -->
    <h2>Dismissable (data-dismissable)</h2>
    <div class="row">
      <sherpa-button data-variant="primary"   data-label="Filter" data-dismissable></sherpa-button>
      <sherpa-button data-variant="secondary" data-label="Filter" data-dismissable></sherpa-button>
      <sherpa-button data-variant="primary"   data-label="Active filter" data-active data-dismissable></sherpa-button>
    </div>

    <!-- ── Badge ─────────────────────────────────────────────── -->
    <h2>Badge (data-count)</h2>
    <div class="row">
      <sherpa-button data-variant="primary"   data-label="Alerts"      data-count="3"></sherpa-button>
      <sherpa-button data-variant="secondary" data-label="Alerts"      data-count="3"></sherpa-button>
      <sherpa-button data-variant="primary"   data-label="Active"      data-count="12" data-active></sherpa-button>
    </div>

    <!-- ── Status ────────────────────────────────────────────── -->
    <h2>Status</h2>
    <div class="row">
      <sherpa-button data-variant="primary" data-label="Critical" data-status="critical"></sherpa-button>
      <sherpa-button data-variant="primary" data-label="Warning"  data-status="warning"></sherpa-button>
      <sherpa-button data-variant="primary" data-label="Success"  data-status="success"></sherpa-button>
      <sherpa-button data-variant="primary" data-label="Info"     data-status="info"></sherpa-button>
    </div>
    <div class="row">
      <sherpa-button data-variant="secondary" data-label="Critical" data-status="critical"></sherpa-button>
      <sherpa-button data-variant="secondary" data-label="Warning"  data-status="warning"></sherpa-button>
      <sherpa-button data-variant="secondary" data-label="Success"  data-status="success"></sherpa-button>
      <sherpa-button data-variant="secondary" data-label="Info"     data-status="info"></sherpa-button>
    </div>

    <!-- ── Button-menu ────────────────────────────────────────── -->
    <h2>Button-menu (data-type="button-menu")</h2>
    <div class="row">
      <sherpa-button data-type="button-menu" data-label="Actions"  data-icon-start="fa-solid fa-cog"></sherpa-button>
      <sherpa-button data-type="button-menu" data-label="Actions"  data-active></sherpa-button>
      <sherpa-button data-type="button-menu" data-label="Actions"  disabled></sherpa-button>
    </div>
    <div class="row">
      <span class="row-label">Split:</span>
      <sherpa-button data-type="button-menu" data-label="Actions"  data-split></sherpa-button>
      <sherpa-button data-type="button-menu" data-label="Active"   data-split data-active></sherpa-button>
    </div>
  </body>
</html>
