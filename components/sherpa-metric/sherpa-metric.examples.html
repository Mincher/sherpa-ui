<!--
  sherpa-metric — Live examples.
-->
<template data-label="KPI cards" data-description="Wrapped in .flex-truncate so trailing cards are progressively hidden as the row narrows.">
  <div class="flex-truncate">
    <sherpa-metric data-label="Total devices" value="1,284"  data-trend="up"   data-delta="+12%"></sherpa-metric>
    <sherpa-metric data-label="Uptime"        value="99.97%" data-trend="flat" data-status="success"></sherpa-metric>
    <sherpa-metric data-label="Open alerts"   value="7"      data-trend="up"   data-status="warning"></sherpa-metric>
  </div>
</template>

<template data-label="Trend directions" data-description="Up, down, and flat trend icons. Wrapped in .flex-truncate — resize the window to see trailing cards hide.">
  <div class="flex-truncate">
    <sherpa-metric data-label="Revenue"  value="$48.2k" data-trend="up"   data-delta="+8.4%"></sherpa-metric>
    <sherpa-metric data-label="Churn"    value="2.1%"   data-trend="down" data-delta="-0.3 pp"></sherpa-metric>
    <sherpa-metric data-label="Sessions" value="12,400" data-trend="flat" data-delta="0%"></sherpa-metric>
  </div>
</template>

<template data-label="With sparklines" data-setup="with-sparklines" data-description="Metrics wider than 360 px show a trailing sparkline. Values are injected via setData() in the example setup." data-layout="block">
  <div style="display:flex;gap:8px;width:100%;">
    <sherpa-metric style="flex:1;min-width:0" data-sparkline></sherpa-metric>
    <sherpa-metric style="flex:1;min-width:0" data-sparkline></sherpa-metric>
  </div>
</template>

<template data-label="Status variants">
  <sherpa-metric data-label="Healthy" value="312" data-status="success"></sherpa-metric>
  <sherpa-metric data-label="At risk" value="14"  data-status="warning"></sherpa-metric>
  <sherpa-metric data-label="Failing" value="3"   data-status="critical"></sherpa-metric>
  <sherpa-metric data-label="Urgent"  value="1"   data-status="urgent"></sherpa-metric>
</template>

<template data-label="Data-driven (fixture)" data-setup="with-data" data-description="Metrics fed from /demo/fixtures/metrics.json via the dataset cascade. A parent element with [data-dataset] dispatches dataset-filtered; each metric uses data-value-field and data-agg to select and summarise one column.">
  <div data-dataset="metrics" style="display:contents">
    <sherpa-metric data-value-field="devices_online" data-agg="last" data-sparkline data-show-header="false"></sherpa-metric>
    <sherpa-metric data-value-field="open_alerts"    data-agg="last" data-sparkline data-show-header="false"></sherpa-metric>
    <sherpa-metric data-value-field="uptime_pct"     data-agg="avg"  data-sparkline data-show-header="false" data-unit="%"></sherpa-metric>
    <sherpa-metric data-value-field="sessions"       data-agg="sum"  data-sparkline data-show-header="false"></sherpa-metric>
  </div>
</template>

<template data-label="Inside containers" data-layout="block">
  <sherpa-container data-variant="resizable" data-col-span="3" style="max-width: 320px;">
    <sherpa-container-header data-title="Devices online"></sherpa-container-header>
    <div style="padding: 0 16px 16px;">
      <sherpa-metric data-label="Devices online" value="1,284" data-trend="up" data-delta="+12 since yesterday"></sherpa-metric>
    </div>
  </sherpa-container>
</template>
