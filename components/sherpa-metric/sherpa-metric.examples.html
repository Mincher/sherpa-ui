<!--
  sherpa-metric — Live examples.
  Each <template> renders one example block in the docs site (docs/router.js).
  Attributes:
    data-label       (required) example heading
    data-description (optional) one-line summary
    data-layout      (optional) row (default) | col | block
    data-preview     (optional) "false" → hide live preview, show code only
    data-setup       (optional) name of an exported setup fn from sherpa-metric.examples.js
-->
<template data-label="KPI cards">
  <sherpa-metric data-label="Total devices" data-value="1,284" data-trend="up"   data-trend-value="+12%"></sherpa-metric>
  <sherpa-metric data-label="Uptime"         data-value="99.97%" data-trend="flat" data-status="success"></sherpa-metric>
  <sherpa-metric data-label="Open alerts"    data-value="7"       data-trend="up"   data-status="warning"></sherpa-metric>
</template>
