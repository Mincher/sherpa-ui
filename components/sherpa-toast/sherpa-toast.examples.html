<!--
  sherpa-toast — Live examples.
-->
<template data-label="Fire toasts by status" data-description="Toasts are dispatched from the SherpaToast static API. Click each button to see the corresponding toast appear." data-layout="row" data-setup="toast-statuses">
  <sherpa-button data-variant="secondary" data-status="success"  data-label="Success"  data-icon-start="fa-solid fa-circle-check"></sherpa-button>
  <sherpa-button data-variant="secondary" data-status="warning"  data-label="Warning"  data-icon-start="fa-solid fa-triangle-exclamation"></sherpa-button>
  <sherpa-button data-variant="secondary" data-status="critical" data-label="Critical" data-icon-start="fa-solid fa-circle-xmark"></sherpa-button>
  <sherpa-button data-variant="secondary" data-status="info"     data-label="Info"     data-icon-start="fa-solid fa-circle-info"></sherpa-button>
</template>

<template data-label="Toast with action" data-description="Pass an action to give the user an undo or follow-up affordance." data-layout="row" data-setup="toast-action">
  <sherpa-button data-variant="primary" data-status="critical" data-label="Delete device" data-icon-start="fa-solid fa-trash"></sherpa-button>
</template>

<template data-label="Burst of stacked toasts" data-description="Multiple toasts stack in the configured corner. Click to fire three in sequence." data-layout="row" data-setup="toast-burst">
  <sherpa-button data-variant="secondary" data-label="Fire 3 toasts" data-icon-start="fa-solid fa-layer-group"></sherpa-button>
</template>
