<!--
  sherpa-toast — Live examples.
  Each <template> renders one example block in the docs site (docs/router.js).
  Attributes:
    data-label       (required) example heading
    data-description (optional) one-line summary
    data-layout      (optional) row (default) | col | block
    data-preview     (optional) "false" → hide live preview, show code only
    data-setup       (optional) name of an exported setup fn from sherpa-toast.examples.js
-->
<template data-label="Fire toasts" data-description="Toasts are dispatched from the SherpaToast static API." data-setup="toast-0">
  <sherpa-button data-variant="secondary" data-status="success"  data-label="Success"></sherpa-button>
  <sherpa-button data-variant="secondary" data-status="warning"  data-label="Warning"></sherpa-button>
  <sherpa-button data-variant="secondary" data-status="critical" data-label="Critical"></sherpa-button>
  <sherpa-button data-variant="secondary" data-status="info"     data-label="Info"></sherpa-button>
</template>
