<!--
  sherpa-filter-bar.html — Templates for sherpa-filter-bar.

  Templates:
    • default — Full filter bar with zoned slot layout (for global use)
    • local   — Minimal filter bar with only group + sort (for containers)

  Slot order (default template, left → right):
    toggle    — Filter on/off toggle (slot="toggle")
    [group]   — Built-in shadow DOM group chip (no slot needed)
    [sort]    — Built-in shadow DOM sort chip (no slot needed)
    presets   — Preset filter chips (slot="presets")
    filters   — User-added dynamic filter chips (default slot) + Add button
    actions   — Clear / Apply / Save actions (slot="actions")

  Slot order (local template, left → right):
    [group]   — Built-in shadow DOM group chip (no slot needed)
    [sort]    — Built-in shadow DOM sort chip (no slot needed)
    presets   — Preset filter chips (slot="presets")
    actions   — Clear action (slot="actions")

  Host attributes:
    data-src-json              — URL of a JSON file describing the filter bar.
                            Shape: { fields: [...], presetFilters?: [...] }
                            The same JSON can be reused to describe a parent
                            data grid's columns/records — keep them in one
                            place so the bar and grid stay in sync. Fetched
                            on connect and on attribute change; populates
                            data-available-fields and data-preset-filters.
    data-available-fields — JSON array of field defs: [{ field, name, type }].
                            Usually set via data-src-json; can be set directly.
    data-preset-filters   — Comma-separated field names (or JSON array) that
                            should appear as preset chips. Usually set via
                            data-src-json.
    data-density          — "compact" | "comfortable"
    data-active           — Present when any filter is active (auto-reflected)
    data-embedded         — No top border (for embedding inside other components)
    data-global           — Dispatches globalfilterchange on document (page-level bars)
    data-sort-type        — "time" | "value" — sort cycling mode for the built-in sort chip.
                            time: off → desc (Newest first) → asc (Oldest first).
                            value: off → desc (Largest first) → asc (Smallest first).
                            Default: field sort (asc → desc → off, requires a field).
    data-type             — "local" selects the local template (default: full layout)

  Custom templates:
    To define a custom layout, add a new <template id="my-layout"> block
    below. Override `get templateId()` in a subclass or set it
    dynamically to select the template at render time.
-->

<!-- ═══════════════════════════════════════════════════════════════════════
     DEFAULT — Full filter bar with zoned slot layout (global)
     Has toggle, all filter zones, add button, and actions.
     ═══════════════════════════════════════════════════════════════════════ -->
<template id="default">
  <div class="filter-surface">
    <slot name="toggle"></slot>
    <div class="chip-group group-chip">
      <sherpa-button class="group-btn" data-position="start" data-behavior="segment" data-label="Group" data-icon-start="&#xf5fd;" data-menu-scope="none" data-variant="secondary" data-size="small"></sherpa-button>
      <sherpa-button data-position="end" data-type="icon" data-icon-start="&#xf078;" data-separator data-menu="true" data-menu-scope="none" data-variant="secondary" data-size="small" aria-label="Choose group field"></sherpa-button>
    </div>
    <div class="chip-group sort-chip">
      <sherpa-button class="sort-btn" data-position="start" data-behavior="sort" data-label="Sort" data-icon-start="&#xf0dc;" data-menu-scope="none" data-variant="secondary" data-size="small"></sherpa-button>
      <sherpa-button data-position="end" data-type="icon" data-icon-start="&#xf078;" data-separator data-menu="true" data-menu-scope="none" data-variant="secondary" data-size="small" aria-label="Sort menu"></sherpa-button>
    </div>
    <span class="zone-divider" data-divider="before-presets" aria-hidden="true"></span>
    <slot name="presets"></slot>
    <span class="zone-divider" data-divider="before-custom" aria-hidden="true"></span>
    <slot></slot>
    <sherpa-button
      class="add-filter-button"
      data-menu="true"
      data-menu-scope="none"
      data-variant="secondary"
      data-size="small"
      data-icon-start="&#xf067;"
      data-icon-end="&#xf078;"
      data-label="Add"
      hidden
    ></sherpa-button>
    <slot name="actions"></slot>
  </div>
</template>

<!-- ═══════════════════════════════════════════════════════════════════════
     LOCAL — Minimal filter bar for containers (group + sort + presets)
     No toggle, no add-filter button. Preset chips render between sort
     and actions so consumers can declare per-container filter chips
     via `data-preset-filters` + `setAvailableColumns()`.
     ═══════════════════════════════════════════════════════════════════════ -->
<template id="local">
  <div class="filter-surface">
    <div class="chip-group group-chip">
      <sherpa-button class="group-btn" data-position="start" data-behavior="segment" data-label="Group" data-icon-start="&#xf5fd;" data-menu-scope="none" data-variant="secondary" data-size="small"></sherpa-button>
      <sherpa-button data-position="end" data-type="icon" data-icon-start="&#xf078;" data-separator data-menu="true" data-menu-scope="none" data-variant="secondary" data-size="small" aria-label="Choose group field"></sherpa-button>
    </div>
    <div class="chip-group sort-chip">
      <sherpa-button class="sort-btn" data-position="start" data-behavior="sort" data-label="Sort" data-icon-start="&#xf0dc;" data-menu-scope="none" data-variant="secondary" data-size="small"></sherpa-button>
      <sherpa-button data-position="end" data-type="icon" data-icon-start="&#xf078;" data-separator data-menu="true" data-menu-scope="none" data-variant="secondary" data-size="small" aria-label="Sort menu"></sherpa-button>
    </div>
    <span class="zone-divider" aria-hidden="true" data-divider="before-presets"></span>
    <slot name="presets"></slot>
    <slot name="actions"></slot>
  </div>
  <slot></slot>
</template>
