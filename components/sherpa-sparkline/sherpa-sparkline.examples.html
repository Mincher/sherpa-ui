<!--
  sherpa-sparkline — Live examples.
  Each <template> renders one example block in the docs site (docs/router.js).
  Attributes:
    data-label       (required) example heading
    data-description (optional) one-line summary
    data-layout      (optional) row (default) | col | block
    data-preview     (optional) "false" → hide live preview, show code only
    data-setup       (optional) name of an exported setup fn from sherpa-sparkline.examples.js
-->
<template data-label="Inline sparkline" data-layout="block">
  <sherpa-sparkline data-values="12,18,15,22,19,28,24,30,27,35" style="width: 200px; height: 48px;"></sherpa-sparkline>
</template>

<template data-label="Bar variant" data-layout="col">
  <sherpa-sparkline data-values="4,8,6,10,7,12,9,14" data-variant="bar" style="width: 200px; height: 48px;"></sherpa-sparkline>
  <sherpa-sparkline data-values="30,25,20,15,10,8,6,4" data-variant="bar" style="width: 200px; height: 48px;"></sherpa-sparkline>
</template>

<template data-label="With unit" data-layout="block">
  <sherpa-sparkline data-values="42,55,48,60,72,68,80" data-unit="req/s" style="width: 200px; height: 48px;"></sherpa-sparkline>
</template>
