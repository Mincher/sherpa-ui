<!--
  sherpa-ai-panel — Live examples.
-->
<template data-label="Inline panel" data-layout="block" data-setup="ask-ai-toggle">
  <div class="ai-toggle-demo" style="display:flex; flex-direction:column; gap: 12px; align-items: flex-start;">
    <sherpa-button data-variant="ai" data-label="Ask AI" data-icon-start="fa-solid fa-wand-magic-sparkles"></sherpa-button>
    <sherpa-ai-panel data-variant="inline" data-expanded data-heading="Sherpa Assistant" style="height: 360px; width: 100%;">
      <sherpa-chat-message data-role="ai" data-avatar-icon="fa-solid fa-sparkles">
        <p>Hi! Ask me about your devices, alerts, or deploys.</p>
      </sherpa-chat-message>
      <sherpa-prompt-composer slot="composer" data-placeholder="Ask anything…"></sherpa-prompt-composer>
    </sherpa-ai-panel>
  </div>
</template>

<template data-label="Busy state" data-description="data-busy shows a loader while a response is being generated." data-layout="block" data-setup="ask-ai-toggle">
  <div class="ai-toggle-demo" style="display:flex; flex-direction:column; gap: 12px; align-items: flex-start;">
    <sherpa-button data-variant="ai" data-label="Ask AI" data-icon-start="fa-solid fa-wand-magic-sparkles"></sherpa-button>
    <sherpa-ai-panel data-variant="inline" data-expanded data-heading="Sherpa Assistant" data-busy style="height: 320px; width: 100%;">
      <sherpa-chat-message data-role="user">
        <p>Generate this week's status report.</p>
      </sherpa-chat-message>
      <sherpa-prompt-composer slot="composer" data-placeholder="Working…" data-disabled></sherpa-prompt-composer>
    </sherpa-ai-panel>
  </div>
</template>

<template data-label="Expanded with archive" data-layout="block" data-setup="ask-ai-toggle">
  <div class="ai-toggle-demo" style="display:flex; flex-direction:column; gap: 12px; align-items: flex-start;">
    <sherpa-button data-variant="ai" data-label="Ask AI" data-icon-start="fa-solid fa-wand-magic-sparkles"></sherpa-button>
    <sherpa-ai-panel data-variant="inline" data-heading="Sherpa Assistant" data-can-archive data-expanded style="height: 360px; width: 100%;">
      <sherpa-chat-message data-role="ai" data-avatar-icon="fa-solid fa-sparkles">
        <p>Ready when you are.</p>
      </sherpa-chat-message>
      <sherpa-prompt-composer slot="composer" data-placeholder="Ask anything…"></sherpa-prompt-composer>
    </sherpa-ai-panel>
  </div>
</template>

<template
  data-label="Ask AI trigger"
  data-description="Use the data-variant=&quot;ai&quot; button to open or close the panel. Click the button to toggle data-expanded."
  data-layout="block"
  data-setup="ask-ai-toggle">
  <div class="ai-toggle-demo" style="display:flex; flex-direction:column; gap: 12px; align-items: flex-start;">
    <sherpa-button data-variant="ai" data-label="Ask AI" data-icon-start="fa-solid fa-wand-magic-sparkles"></sherpa-button>
    <sherpa-ai-panel data-variant="inline" data-heading="Sherpa Assistant" style="height: 320px; width: 100%;">
      <sherpa-chat-message data-role="ai" data-avatar-icon="fa-solid fa-sparkles">
        <p>Click the Ask AI button above to toggle me open or closed.</p>
      </sherpa-chat-message>
      <sherpa-prompt-composer slot="composer" data-placeholder="Ask anything…"></sherpa-prompt-composer>
    </sherpa-ai-panel>
  </div>
</template>
