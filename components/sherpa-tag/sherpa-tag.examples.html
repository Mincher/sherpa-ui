<!--
  sherpa-tag — Live examples.
-->
<template data-label="Variants" data-description="Primary and secondary variants for visual hierarchy.">
  <sherpa-tag>Default</sherpa-tag>
  <sherpa-tag data-variant="primary">Primary</sherpa-tag>
  <sherpa-tag data-variant="secondary">Secondary</sherpa-tag>
</template>

<template data-label="Status" data-description="Status drives the colour scheme automatically.">
  <sherpa-tag data-status="critical">Critical</sherpa-tag>
  <sherpa-tag data-status="warning">Warning</sherpa-tag>
  <sherpa-tag data-status="success">Success</sherpa-tag>
  <sherpa-tag data-status="info">Info</sherpa-tag>
  <sherpa-tag data-status="urgent">Urgent</sherpa-tag>
  <sherpa-tag data-status="brand">Brand</sherpa-tag>
</template>

<template data-label="With leading icon" data-description="Place an icon in the slot before the label text.">
  <sherpa-tag data-status="success"><i class="fa-solid fa-circle-check"></i> Active</sherpa-tag>
  <sherpa-tag data-status="warning"><i class="fa-solid fa-clock"></i> Pending</sherpa-tag>
  <sherpa-tag data-status="critical"><i class="fa-solid fa-triangle-exclamation"></i> Error</sherpa-tag>
  <sherpa-tag><i class="fa-solid fa-pen"></i> Draft</sherpa-tag>
</template>

<template data-label="Collapsed" data-description="data-collapsed renders the tag as a small circular indicator.">
  <sherpa-tag data-collapsed data-status="success">Active</sherpa-tag>
  <sherpa-tag data-collapsed data-status="warning">Warning</sherpa-tag>
  <sherpa-tag data-collapsed data-status="critical">Error</sherpa-tag>
</template>
