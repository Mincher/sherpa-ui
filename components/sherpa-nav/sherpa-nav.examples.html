<!--
  sherpa-nav — Live examples.
  Each <template> renders one example block in the docs site (docs/router.js).
  Attributes:
    data-label       (required) example heading
    data-description (optional) one-line summary
    data-layout      (optional) row (default) | col | block
    data-preview     (optional) "false" → hide live preview, show code only
    data-setup       (optional) name of an exported setup fn from sherpa-nav.examples.js
-->
<template data-label="Primary sidebar nav" data-layout="block">
  <sherpa-nav style="height: 360px;">
    <sherpa-nav-item data-label="Dashboard" data-icon="fa-solid fa-gauge"       data-active></sherpa-nav-item>
    <sherpa-nav-item data-label="Devices"   data-icon="fa-solid fa-server"></sherpa-nav-item>
    <sherpa-nav-item data-label="Reports"   data-icon="fa-solid fa-chart-line"></sherpa-nav-item>
    <sherpa-nav-item data-label="Alerts"    data-icon="fa-solid fa-bell"></sherpa-nav-item>
    <sherpa-nav-item data-label="Settings"  data-icon="fa-solid fa-gear"></sherpa-nav-item>
  </sherpa-nav>
</template>

<template data-label="With footer promo" data-layout="block">

    data-promo-title="Upgrade to Pro"
