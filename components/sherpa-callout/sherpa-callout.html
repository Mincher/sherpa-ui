<!--
  sherpa-callout.html — Templates for sherpa-callout.

  Host attributes:
    data-status      — info | warning | critical | success
    data-heading     — Heading text
    data-expanded    — Body visible (toggleable when data-dismissible is set)
    data-dismissible — Show action button

  Slots:
    heading   — Override heading text
    (default) — Body content
    action    — Optional action link/button
-->

<template id="default">
  <div class="header">
    <i class="status-icon" aria-hidden="true"></i>
    <div class="heading-area">
      <slot name="heading">
        <span class="heading-text text-emphasis"></span>
      </slot>
    </div>
    <sherpa-button class="action-btn" data-variant="tertiary" data-size="small" data-type="icon" data-icon-start="&#xf078;" aria-label="Toggle callout"></sherpa-button>
  </div>
  <div class="body text-body">
    <slot></slot>
    <div class="action-area">
      <slot name="action"></slot>
    </div>
  </div>
</template>
