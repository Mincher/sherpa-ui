<!--
  sherpa-chat-message — Live examples.
  Each <template> renders one example block in the docs site (docs/router.js).
  Attributes:
    data-label       (required) example heading
    data-description (optional) one-line summary
    data-layout      (optional) row (default) | col | block
    data-preview     (optional) "false" → hide live preview, show code only
    data-setup       (optional) name of an exported setup fn from sherpa-chat-message.examples.js
-->
<template data-label="Assistant + user" data-layout="col">
  <sherpa-chat-message data-author="Assistant" data-timestamp="just now">
    <p>Hi! How can I help you today?</p>
  </sherpa-chat-message>
  <sherpa-chat-message data-author="You" data-author-variant="user" data-timestamp="now">
    <p>Summarise yesterday's alerts.</p>
  </sherpa-chat-message>
</template>
