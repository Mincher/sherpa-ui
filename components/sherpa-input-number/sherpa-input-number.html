<!--
  sherpa-input-number.html — Number input with step buttons.

  Templates:
    • default — Number input + step-down/step-up buttons

  Host attributes:
    min  — Minimum value
    max  — Maximum value
    step — Step increment

  Inherited from SherpaInputBase:
    data-label, data-description, data-helper, data-layout,
    disabled, readonly, required, name, value, placeholder,
    pattern, minlength, maxlength, novalidate
-->
<template id="default">
<div class="grouped">
  <input type="number" class="input-field" placeholder="0" />
  <button type="button" class="step-down input-action stepper-btn" aria-label="Decrease value">
    <i class="fa-solid fa-minus stepper-icon" aria-hidden="true"></i>
  </button>
  <button type="button" class="step-up input-action stepper-btn" aria-label="Increase value">
    <i class="fa-solid fa-plus stepper-icon" aria-hidden="true"></i>
  </button>
</div>
</template>
