<!--
  sherpa-layout-grid.html — Shadow DOM template for sherpa-layout-grid.

  Responsive 12/6/3 column grid for dashboard composition. Slotted
  <sherpa-container data-variant="resizable"> children take grid spans
  from their data-col-span / data-row-span attributes.

  Use data-content="static" for non-grid (scrollable stacked column) views.
  Use data-pad / data-gap on the host for padding and gap in static mode.

  A <sherpa-view-header slot="view-header"> child sits above the grid
  surface, full-width, with no extra margin. Shown only when the slot
  is populated (data-has-view-header auto-attribute).

  Host attributes:
    data-row-height — CSS length for grid-auto-rows (default: 160px)
    data-content    — "static" — opts out of grid; stacks children vertically
    data-pad        — Adds padding inside the content surface
    data-gap        — sm | base | lg — gap between stacked children (static mode)
    data-fill       — "viewport" — clamp layout to 100dvh, surface scrolls
    data-editable   — Enables drag-to-reposition for slotted containers
  Slots:
    view-header      — Optional sherpa-view-header above the grid surface
    (default)        — sherpa-container resizable children (or any content)
    side-panel-start — Leading side panel on the inline-start edge
    side-panel-end   — Trailing side panel (typically a sherpa-panel)
-->

<template id="default">
  <div class="grid-header" part="header">
    <slot name="view-header"></slot>
  </div>
  <div class="grid-body">
    <slot name="side-panel-start" class="side-panel-start"></slot>
    <div class="grid-surface" part="surface">
      <slot></slot>
    </div>
    <slot name="side-panel-end" class="side-panel-end"></slot>
  </div>
</template>
