<!--
  sherpa-input-checkbox-group — Live examples.
  Each <template> renders one example block in the docs site (docs/router.js).
  Attributes:
    data-label       (required) example heading
    data-description (optional) one-line summary
    data-layout      (optional) row (default) | col | block
    data-preview     (optional) "false" → hide live preview, show code only
    data-setup       (optional) name of an exported setup fn from sherpa-input-checkbox-group.examples.js
-->
<template data-label="Notification channels" data-layout="block">
  <sherpa-input-checkbox-group data-label="Notification channels" data-helper="Select all that apply">
    <sherpa-input-checkbox data-label="Email"             value="email" checked></sherpa-input-checkbox>
    <sherpa-input-checkbox data-label="SMS"               value="sms"></sherpa-input-checkbox>
    <sherpa-input-checkbox data-label="Push notification" value="push" checked></sherpa-input-checkbox>
    <sherpa-input-checkbox data-label="Slack"             value="slack"></sherpa-input-checkbox>
  </sherpa-input-checkbox-group>
</template>
