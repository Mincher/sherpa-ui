<!--
  sherpa-list-panel — Live examples.
-->
<template data-label="Sidebar navigation" data-description="Bordered panel with sherpa-list children acts as a navigation rail." data-layout="block">
  <sherpa-list-panel data-bordered style="max-width: 280px;">
    <sherpa-list>
      <sherpa-list-item data-label="Devices"  data-icon="fa-solid fa-microchip" data-description="1,284 active" data-interactive data-active></sherpa-list-item>
      <sherpa-list-item data-label="Alerts"   data-icon="fa-solid fa-bell"      data-description="7 unresolved" data-interactive><sherpa-tag slot="trailing" data-status="critical">7</sherpa-tag></sherpa-list-item>
      <sherpa-list-item data-label="Reports"  data-icon="fa-solid fa-chart-line" data-interactive></sherpa-list-item>
      <sherpa-list-item data-label="Settings" data-icon="fa-solid fa-gear"      data-interactive></sherpa-list-item>
    </sherpa-list>
  </sherpa-list-panel>
</template>

<template data-label="Recent activity feed" data-description="Panels work well as inset cards inside a dashboard region." data-layout="block">
  <sherpa-list-panel data-bordered style="max-width: 420px;">
    <sherpa-list>
      <sherpa-list-item data-label="Deploy succeeded" data-description="v2.4.1 — 2 mins ago" data-icon="fa-solid fa-rocket"><sherpa-tag slot="trailing" data-status="success">v2.4.1</sherpa-tag></sherpa-list-item>
      <sherpa-list-item data-label="High CPU resolved" data-description="api-gateway — 8 mins ago" data-icon="fa-solid fa-circle-check"></sherpa-list-item>
      <sherpa-list-item data-label="New device joined" data-description="orion-007 — 12 mins ago" data-icon="fa-solid fa-plus"><sherpa-tag slot="trailing" data-status="info">EU</sherpa-tag></sherpa-list-item>
      <sherpa-list-item data-label="Backup completed"  data-description="primary db — 1 hr ago"  data-icon="fa-solid fa-database"></sherpa-list-item>
    </sherpa-list>
  </sherpa-list-panel>
</template>

<template data-label="Empty state" data-description="data-empty renders a placeholder when there's no list to show." data-layout="block">
  <sherpa-list-panel data-bordered data-empty="No incidents in the last 24 hours" style="max-width: 360px;"></sherpa-list-panel>
</template>
