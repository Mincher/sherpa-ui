<!--
  sherpa-progress-tracker — Live examples.
  Each <template> renders one example block in the docs site (docs/router.js).
  Attributes:
    data-label       (required) example heading
    data-description (optional) one-line summary
    data-layout      (optional) row (default) | col | block
    data-preview     (optional) "false" → hide live preview, show code only
    data-setup       (optional) name of an exported setup fn from sherpa-progress-tracker.examples.js
-->
<template data-label="Multi-step progress" data-layout="block">
  <sherpa-progress-tracker>
    <sherpa-list-item data-label="Submitted" data-status="complete"></sherpa-list-item>
    <sherpa-list-item data-label="Review"    data-status="active"></sherpa-list-item>
    <sherpa-list-item data-label="Approved"  data-status="pending"></sherpa-list-item>
    <sherpa-list-item data-label="Deployed"  data-status="pending"></sherpa-list-item>
  </sherpa-progress-tracker>
</template>
