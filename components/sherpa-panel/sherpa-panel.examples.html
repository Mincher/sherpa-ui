<!--
  sherpa-panel — Live examples.
  Shows the panel anatomy: heading, controls slot, metadata slot, default
  content slot and actions slot. Uses a fixed-height wrapper so the panel
  expands vertically inside the preview frame.
-->
<template data-label="Anatomy — heading, metadata, content, actions" data-description="All four slots populated, plus the built-in close button in the header." data-layout="block">
  <div style="height: 360px; display: flex; justify-content: flex-end; background: var(--sherpa-surface-page-default, #f5f5f7); border-radius: 8px;">
    <sherpa-panel
      data-variant="inline"
      data-position="right"
      data-heading="Asset details"
      data-expanded
      data-width="320"
    >
      <sherpa-button slot="controls" data-type="icon" data-variant="tertiary" data-size="small" data-icon-start="fa-solid fa-pen" aria-label="Edit"></sherpa-button>

      <div slot="metadata">Updated 2 min ago · Sensor #4821</div>

      <sherpa-key-value-list>
        <div><dt>Status</dt><dd>Online</dd></div>
        <div><dt>Location</dt><dd>Floor 3 · North wing</dd></div>
        <div><dt>Firmware</dt><dd>v2.4.1</dd></div>
        <div><dt>Last seen</dt><dd>14:32</dd></div>
      </sherpa-key-value-list>

      <sherpa-button slot="actions" data-variant="secondary" data-size="small" data-label="Cancel"></sherpa-button>
      <sherpa-button slot="actions" data-variant="primary" data-size="small" data-label="Save"></sherpa-button>
    </sherpa-panel>
  </div>
</template>

<template data-label="Heading only" data-description="A minimal panel with just a heading and body content — close button still present." data-layout="block">
  <div style="height: 240px; display: flex; justify-content: flex-end; background: var(--sherpa-surface-page-default, #f5f5f7); border-radius: 8px;">
    <sherpa-panel
      data-variant="inline"
      data-position="right"
      data-heading="Filters"
      data-expanded
      data-width="280"
    >
      <p style="margin: 0;">Filter controls go here.</p>
    </sherpa-panel>
  </div>
</template>

<template data-label="Collapsed (left-anchored)" data-description="When data-expanded is removed the panel collapses to a 40px rail with an expand trigger." data-layout="block">
  <div style="height: 200px; display: flex; justify-content: flex-start; background: var(--sherpa-surface-page-default, #f5f5f7); border-radius: 8px;">
    <sherpa-panel
      data-variant="inline"
      data-position="left"
      data-heading="Inspector"
      data-width="280"
    ></sherpa-panel>
  </div>
</template>

<template data-label="Overlay variant" data-description="Position: fixed; floats above content. Use the trigger to re-open after closing. Shown here pinned inside a preview box for layout demonstration only." data-layout="block" data-setup="overlay-trigger">
  <div style="position: relative; height: 280px; background: var(--sherpa-surface-page-default, #f5f5f7); border-radius: 8px; overflow: hidden; padding: 16px;">
    <sherpa-button
      class="overlay-trigger"
      data-variant="primary"
      data-size="small"
      data-icon-start="fa-solid fa-sliders"
      data-label="Open details"
    ></sherpa-button>

    <sherpa-panel
      data-variant="overlay"
      data-position="right"
      data-heading="Details"
      data-expanded
      data-width="320"
      style="position: absolute;"
    >
      <p style="margin: 0;">Overlay panels float above content without reflowing the layout. Click the × in the header to dismiss, then the trigger to re-open.</p>
      <sherpa-button slot="actions" data-variant="primary" data-size="small" data-label="Done"></sherpa-button>
    </sherpa-panel>
  </div>
</template>
