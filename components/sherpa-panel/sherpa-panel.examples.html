<!--
  sherpa-panel — Live examples.
  Each <template> renders one example block in the docs site (docs/router.js).
  Attributes:
    data-label       (required) example heading
    data-description (optional) one-line summary
    data-layout      (optional) row (default) | col | block
    data-preview     (optional) "false" → hide live preview, show code only
    data-setup       (optional) name of an exported setup fn from sherpa-panel.examples.js
-->
<template data-label="Basic panel" data-layout="block">
  <sherpa-panel data-heading="Recent activity">
    <p>Panels wrap related content with a heading and optional actions.</p>
  </sherpa-panel>
</template>
