<template id="default">
  <!-- Collapsed restore strip (inline, when not expanded) -->
  <button class="collapse-trigger" type="button" aria-label="Expand panel">
    <i class="collapse-icon fa-solid" aria-hidden="true"></i>
    <span class="collapse-label"></span>
  </button>

  <!-- Panel body -->
  <div class="panel-body">
    <!-- Header -->
    <header class="panel-header" part="header">
      <div class="header-row">
        <span class="header-title" part="title"></span>
        <div class="controls">
          <slot name="controls"></slot>
          <button class="close-btn" type="button" aria-label="Collapse panel">
            <i class="close-icon fa-solid" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <div class="metadata">
        <slot name="metadata"></slot>
      </div>
      <div class="panel-search-row">
        <slot name="search">
          <sherpa-input-search
            class="panel-search"
            data-name="panel-search"
            data-placeholder="Type to search"
            data-hide-label
          ></sherpa-input-search>
        </slot>
      </div>
    </header>

    <!-- Toolbar row (between header and content) -->
    <div class="toolbar" part="toolbar">
      <slot name="toolbar"></slot>
    </div>

    <!-- Content area (scrollable) -->
    <div class="content" part="body">
      <slot></slot>
      <div class="panel-empty" part="empty"></div>
    </div>

    <!-- Action bar (footer) -->
    <div class="action-bar" part="footer">
      <slot name="actions"></slot>
    </div>
  </div>
</template>
