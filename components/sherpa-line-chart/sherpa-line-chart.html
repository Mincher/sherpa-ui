<!--
  sherpa-line-chart.html — Line / area chart rendered with CSS segments & shapes.

  Uses the same segment approach as sherpa-sparkline: each series is a
  flex row of .shape divs whose clip-path polygons are computed entirely
  in CSS from raw data values set as custom properties by JS.

  Templates:
    • default — Chart body with y-axis, grid, series layer, x-axis, legend

  Host attributes:
    data-title    — Chart title
    data-loading  — Boolean, dims chart
    data-variant  — line (default) | area

  Methods:
    setData({ labels: string[], series: [{ name, values, color? }] })

  Cloning prototypes:
    .series-tpl  — One per data series (12 shape segments with point markers)
-->
<template id="default">
  <div class="chart-header">
    <span class="chart-title"></span>
    <sherpa-button
      class="menu-button"
      data-type="icon"
      data-menu="true"
      data-variant="tertiary"
      data-size="small"
      data-icon-start="&#xf142;"
      aria-label="Menu"
      data-tooltip="Menu"
      data-menu-position="bottom-end"
      data-menu-scope="shadow"
      data-keep-compact
    ></sherpa-button>
  </div>

  <sherpa-filter-bar data-embedded data-type="local" data-sort-type="time">
    <sherpa-button
      slot="actions"
      data-variant="tertiary"
      data-size="small"
      data-action="clear"
      >Clear filter</sherpa-button
    >
  </sherpa-filter-bar>

  <div class="chart-layout" role="img" aria-label="">
    <span class="chart-sr-summary" aria-live="polite"></span>
    <div class="chart-body">
      <div class="y-axis" aria-hidden="true">
        <span class="y-label"></span>
        <span class="y-label"></span>
        <span class="y-label"></span>
        <span class="y-label"></span>
        <span class="y-label"></span>
        <span class="y-label"></span>
      </div>
      <div class="chart-panel">
        <div class="chart-area">
          <div class="grid-lines" aria-hidden="true"></div>
          <div class="series-layer"></div>
        </div>
        <div class="x-axis" aria-hidden="true"></div>
      </div>
    </div>
    <div class="chart-legend" aria-hidden="true"></div>
  </div>
  <sherpa-tooltip></sherpa-tooltip>
  <!-- Cloning prototype — one per data series; .shape elements injected by JS -->
  <template class="series-tpl">
    <div class="series"></div>
  </template>

  <!-- Single shape segment prototype — cloned once per data segment by JS.
       JS sets --_v-start, --_v-end, and --_i directly as inline custom
       properties; CSS computes clip-path normalisation from these. -->
  <template class="shape-tpl">
    <div class="shape">
      <span class="point" data-role="start"></span>
      <span class="point" data-role="end"></span>
    </div>
  </template>

  <template class="legend-item-tpl">
    <div class="legend-item">
      <span class="legend-key"></span>
      <span class="legend-label"></span>
    </div>
  </template>
  <template class="x-label-tpl"><span class="x-label"></span></template>

  <!-- Filter-menu — cloned into a light-DOM <template data-menu> on connect -->
  <template id="filter-menu">
    <sherpa-overlay-item
      data-selection="checkbox"
      data-event="toggle-filters"
    >Show / hide filters</sherpa-overlay-item>
    <sherpa-overlay-item
      data-selection="checkbox"
      data-event="toggle-legend"
      checked
    >Show / hide legend</sherpa-overlay-item>
  </template>
</template>
