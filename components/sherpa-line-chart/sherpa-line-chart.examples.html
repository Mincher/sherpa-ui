<!--
  sherpa-line-chart — Live examples.
  Each <template> renders one example block in the docs site (docs/router.js).
  Attributes:
    data-label       (required) example heading
    data-description (optional) one-line summary
    data-layout      (optional) row (default) | col | block
    data-preview     (optional) "false" → hide live preview, show code only
    data-setup       (optional) name of an exported setup fn from sherpa-line-chart.examples.js
-->
<template data-label="Time series" data-layout="block" data-setup="line-chart-0">
  <sherpa-line-chart data-category="date" data-value-field="value" style="height: 240px;"></sherpa-line-chart>
</template>

<template data-label="Multi-series" data-preview="false">
  <sherpa-line-chart data-category="date" data-value-field="value" data-series="region" style="height: 240px;"></sherpa-line-chart>
</template>

<template data-label="With area fill" data-preview="false">
  <sherpa-line-chart data-category="date" data-value-field="value" data-area style="height: 240px;"></sherpa-line-chart>
</template>
