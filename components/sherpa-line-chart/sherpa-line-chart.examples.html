<!--
  sherpa-line-chart — Live examples.
  Data is supplied programmatically via setData() — see sherpa-line-chart.examples.js.
-->
<template data-label="Daily active users" data-description="Single-series line chart over a 14-day window." data-layout="block" data-setup="daily-active-users">
  <sherpa-line-chart data-title="Daily active users — last 14 days" style="height: 260px;"></sherpa-line-chart>
</template>

<template data-label="Multi-series — Response time by region" data-description="Multiple named series render as separate lines with a legend." data-layout="block" data-setup="response-time-regions">
  <sherpa-line-chart data-title="P95 response time (ms)" data-segment-field="region" style="height: 280px;"></sherpa-line-chart>
</template>

<template data-label="Area variant — Storage growth" data-description="data-variant=&quot;area&quot; fills the region beneath the line." data-layout="block" data-setup="storage-growth">
  <sherpa-line-chart data-title="Total storage used (TB)" data-variant="area" style="height: 240px;"></sherpa-line-chart>
</template>

<template data-label="Loading state" data-description="Skeleton placeholder while data is in flight." data-layout="block">
  <sherpa-line-chart data-title="Revenue trend" data-loading style="height: 220px;"></sherpa-line-chart>
</template>
