<!--
  sherpa-nav-section.html — Secondary navigation panel.

  Single template; the list of groups and items is supplied via the
  setSections(...) method (see sherpa-nav-section.js) or, alternatively,
  by setting the `data-sections` attribute to a JSON string.
-->
<template id="default">
  <header class="header" part="header">
    <button
      class="back"
      type="button"
      part="back"
      aria-label="Back"
      hidden
    >
      <i class="back-icon fa-regular fa-arrow-left" aria-hidden="true"></i>
    </button>
    <h2 class="heading text-heading-lg" part="heading"></h2>
    <span class="header-end" part="header-end">
      <slot name="header-end"></slot>
    </span>
  </header>

  <nav class="sections" part="sections" aria-label="Section navigation"></nav>

  <slot></slot>

  <!-- Cloning prototype used by #renderSections() (bound via renderInto + the
       template binder). Group → items, with header vs. item branches. The
       view-model precomputes per-item flags (isHeader/isItem/active/…). -->
  <template class="group-tpl">
    <section class="group" data-bind-attr="data-has-label:hasLabel">
      <h3 class="group-label text-label-group" data-bind="label"></h3>
      <ul class="group-list" data-bind-each="items">
        <template>
          <li class="header-item" data-bind-if="isHeader">
            <span class="header-item-name text-body" data-bind="label"></span>
            <span class="header-item-description text-body-sm" data-bind="description"
                  data-bind-attr="hidden:noDescription"></span>
          </li>
          <li data-bind-if="isItem">
            <button type="button" class="item text-body"
                    data-bind-attr="data-id:id; data-action:action; data-active:active;
                                    aria-current:ariaCurrent; disabled:disabled">
              <span class="item-label" data-bind="label"></span>
              <i class="item-icon" aria-hidden="true" data-bind-class="iconClass"
                 data-bind-attr="hidden:noIcon"></i>
            </button>
          </li>
        </template>
      </ul>
    </section>
  </template>
</template>
