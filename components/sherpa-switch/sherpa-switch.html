<!--
  sherpa-switch.html — Templates for sherpa-switch.

  One template; the visual form is a CSS variant on data-style (no separate
  template needed — the same track markup restyles).

  Host attributes:
    data-state — "on" | "off"
    data-style — "default" (rectangular, ON/OFF label, 16px control)
               | "simple"  (pill, no label, 12px control)
    disabled   — Boolean

  Usage:
    <sherpa-switch data-state="on"></sherpa-switch>
    <sherpa-switch data-style="simple" data-state="off" disabled></sherpa-switch>
-->

<!-- ═══════════════════════════════════════════════════════════════════════
     Switch track — rectangular by default; data-style="simple" makes it a pill.
     ═══════════════════════════════════════════════════════════════════════ -->
<template id="default">
<button type="button" class="switch-track" role="switch" aria-checked="false">
  <span class="switch-label text-label"></span>
  <span class="switch-knob"></span>
</button>
</template>
