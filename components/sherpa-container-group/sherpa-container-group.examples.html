<!--
  sherpa-container-group — Live examples.

  Each example wraps the group in a <sherpa-layout-grid> so the subgrid
  has a parent grid to inherit column tracks from.
-->

<template data-label="Full-width KPI group with header" data-layout="block">
  <sherpa-layout-grid>
    <sherpa-container-group data-col-span="12">
      <sherpa-container-header data-title="KPIs" data-description="Last 24 hours"></sherpa-container-header>
      <sherpa-container data-col-span="3">
        <sherpa-metric data-label="Revenue"  data-value="$1.24M" data-trend="up"   data-delta="+8.3%"></sherpa-metric>
      </sherpa-container>
      <sherpa-container data-col-span="3">
        <sherpa-metric data-label="Sessions" data-value="48,210" data-trend="up"   data-delta="+2.1%"></sherpa-metric>
      </sherpa-container>
      <sherpa-container data-col-span="3">
        <sherpa-metric data-label="Bounce"   data-value="32.4%"  data-trend="down" data-delta="−1.7%"></sherpa-metric>
      </sherpa-container>
      <sherpa-container data-col-span="3">
        <sherpa-metric data-label="AOV"      data-value="$82"    data-trend="up"   data-delta="+3.4%"></sherpa-metric>
      </sherpa-container>
    </sherpa-container-group>
  </sherpa-layout-grid>
</template>

<template data-label="Mixed row-span (tall chart + small tiles)" data-layout="block">
  <sherpa-layout-grid>
    <sherpa-container-group data-col-span="12">
      <sherpa-container-header data-title="Performance"></sherpa-container-header>
      <sherpa-container data-col-span="6" data-row-span="6">
        <sherpa-line-chart data-label="Revenue trend" data-viz></sherpa-line-chart>
      </sherpa-container>
      <sherpa-container data-col-span="3">
        <sherpa-metric data-label="MRR"   data-value="$92K"></sherpa-metric>
      </sherpa-container>
      <sherpa-container data-col-span="3">
        <sherpa-metric data-label="Churn" data-value="2.1%"></sherpa-metric>
      </sherpa-container>
      <sherpa-container data-col-span="3">
        <sherpa-metric data-label="LTV"   data-value="$1.2K"></sherpa-metric>
      </sherpa-container>
      <sherpa-container data-col-span="3">
        <sherpa-metric data-label="CAC"   data-value="$340"></sherpa-metric>
      </sherpa-container>
    </sherpa-container-group>
  </sherpa-layout-grid>
</template>

<template data-label="Half-width group beside a standalone tile" data-layout="block">
  <sherpa-layout-grid>
    <sherpa-container-group data-col-span="6">
      <sherpa-container data-col-span="3"><sherpa-metric data-label="A" data-value="10"></sherpa-metric></sherpa-container>
      <sherpa-container data-col-span="3"><sherpa-metric data-label="B" data-value="20"></sherpa-metric></sherpa-container>
      <sherpa-container data-col-span="3"><sherpa-metric data-label="C" data-value="30"></sherpa-metric></sherpa-container>
      <sherpa-container data-col-span="3"><sherpa-metric data-label="D" data-value="40"></sherpa-metric></sherpa-container>
    </sherpa-container-group>
    <sherpa-container data-variant="resizable" data-col-span="6">
      <sherpa-container-header slot="header" data-title="Standalone tile"></sherpa-container-header>
      <p style="padding: 16px;">Sibling content beside the group.</p>
    </sherpa-container>
  </sherpa-layout-grid>
</template>
