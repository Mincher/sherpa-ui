<!--
  sherpa-node — Live examples.
-->
<template data-label="Source node" data-layout="block">
  <sherpa-node data-kind="source" data-node-id="src-01" data-x="40" data-y="40">
    <sherpa-node-row data-variant="header" data-icon="fa-solid fa-database" slot="header">
      <span slot="title">Devices</span>
      <sherpa-node-socket slot="output-socket" data-direction="out" data-port-name="out"></sherpa-node-socket>
    </sherpa-node-row>
    <sherpa-node-row><span slot="label">id</span></sherpa-node-row>
    <sherpa-node-row><span slot="label">region</span></sherpa-node-row>
    <sherpa-node-row><span slot="label">status</span></sherpa-node-row>
  </sherpa-node>
</template>

<template data-label="Math node with subtype" data-layout="block">
  <sherpa-node data-kind="math" data-node-id="math-01" data-x="40" data-y="40"
    data-subtypes='[{"value":"sum","label":"Sum"},{"value":"avg","label":"Average"},{"value":"min","label":"Min"},{"value":"max","label":"Max"}]'
    data-subtype="avg">
    <sherpa-node-row data-variant="header" data-icon="fa-solid fa-calculator" slot="header">
      <span slot="title">Aggregate</span>
      <sherpa-node-socket slot="input-socket"  data-direction="in"  data-port-name="in"  data-multi></sherpa-node-socket>
      <sherpa-node-socket slot="output-socket" data-direction="out" data-port-name="out"></sherpa-node-socket>
    </sherpa-node-row>
  </sherpa-node>
</template>

<template data-label="Selected" data-layout="block">
  <sherpa-node data-kind="variable" data-node-id="var-01" data-x="40" data-y="40" data-selected>
    <sherpa-node-row data-variant="header" data-icon="fa-solid fa-square-root-variable" slot="header">
      <span slot="title">Threshold</span>
      <sherpa-node-socket slot="output-socket" data-direction="out" data-port-name="value"></sherpa-node-socket>
    </sherpa-node-row>
    <sherpa-node-row><span slot="label">80</span></sherpa-node-row>
  </sherpa-node>
</template>
