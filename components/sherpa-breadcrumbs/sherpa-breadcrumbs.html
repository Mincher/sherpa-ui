<!--
  sherpa-breadcrumbs.html — Navigation breadcrumb trail.

  Authoring model:
    The template below is the entire rendered structure. Consumers who need
    different crumbs override it by pointing data-src-json at their own HTML file
    that exports a <template id="default"> with the same shape.

  Markup contract:
    • <div class="breadcrumb-trail" role="navigation" aria-label="Breadcrumb"> is the flex row container.
    • Historic crumbs:  <a class="crumb-text" href="…">Label</a><span class="separator" aria-hidden="true">/</span>
    • Current crumb:    <span class="crumb-text" aria-current="page">Label</span>
    • The current crumb has no separator; CSS keys off [aria-current="page"].

  Host attributes:
    data-src-json — URL of a JSON file: [{label, href?}]
-->

<template id="default">
<div class="breadcrumb-trail" role="navigation" aria-label="Breadcrumb">
  <a class="crumb-text" href="#">Home</a>
  <span class="separator" aria-hidden="true">/</span>
  <a class="crumb-text" href="#">Section</a>
  <span class="separator" aria-hidden="true">/</span>
  <span class="crumb-text" aria-current="page">Current page</span>
</div>
</template>
