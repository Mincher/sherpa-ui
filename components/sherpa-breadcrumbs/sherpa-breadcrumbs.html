<!--
  sherpa-breadcrumbs.html — Navigation breadcrumb trail.

  Authoring model:
    The template below is the entire rendered structure. Consumers who need
    different crumbs override it by pointing data-src at their own HTML file
    that exports a <template id="default"> with the same shape.

  Markup contract:
    • <nav aria-label="Breadcrumb"> wrapping an <ol class="breadcrumb-list">
    • Historic crumbs:  <li class="crumb"><a class="crumb-text" href="…">Label</a><span class="separator" aria-hidden="true">/</span></li>
    • Current crumb:    <li class="crumb"><span class="crumb-text" aria-current="page">Label</span></li>
    • The current crumb has no separator; CSS keys off [aria-current="page"].

  Host attributes:
    data-src — URL of an alternative breadcrumbs template
-->

<template id="default">
<nav aria-label="Breadcrumb" class="breadcrumb-nav">
  <ol class="breadcrumb-list">
    <li class="crumb">
      <a class="crumb-text" href="#">Home</a>
      <span class="separator" aria-hidden="true">/</span>
    </li>
    <li class="crumb">
      <a class="crumb-text" href="#">Section</a>
      <span class="separator" aria-hidden="true">/</span>
    </li>
    <li class="crumb">
      <span class="crumb-text" aria-current="page">Current page</span>
    </li>
  </ol>
</nav>
</template>
