<!--
  sherpa-breadcrumbs.html — Navigation breadcrumb trail.

  Data-driven via the Sherpa template binder (data-bind* attributes). Populate
  with either a data array or precompiled HTML:

    el.populate([{ label: 'Home', href: '#' }, { label: 'Current' }]);
    el.populate('<a class="crumb-text" href="#">Home</a>…');   // precompiled HTML

  Anatomy:
    .breadcrumb-trail          flex row container (populated per crumb)
    <template.crumb-tpl>       per-crumb prototype (no id → survives in shadow DOM,
                               cloned once per item by renderInto):
      a.crumb-text             historic crumb (has href)   — data-bind-if="link"
      span.crumb-text          current crumb (aria-current)— data-bind-if="current"
      span.separator "/"       between crumbs              — data-bind-if="separator"

  Host attributes:
    data-src-json — URL of a JSON file: [{label, href?}]
    data-items    — inline JSON array (same shape)
-->

<template id="default">
<div class="breadcrumb-trail" role="navigation" aria-label="Breadcrumb">
  <!-- Static default shown until populate() runs -->
  <span class="crumb-text" aria-current="page">Breadcrumbs</span>
</div>

<!-- Per-crumb cloning prototype (bound by populate() via renderInto) -->
<template class="crumb-tpl">
  <a class="crumb-text" data-bind="label" data-bind-attr="href:href" data-bind-if="link"></a>
  <span class="crumb-text" aria-current="page" data-bind="label" data-bind-if="current"></span>
  <span class="separator" aria-hidden="true" data-bind-if="separator">/</span>
</template>
</template>
