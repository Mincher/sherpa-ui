<!--
  sherpa-popover — Live examples.
  Each <template> renders one example block in the docs site (docs/router.js).
  Attributes:
    data-label       (required) example heading
    data-description (optional) one-line summary
    data-layout      (optional) row (default) | col | block
    data-preview     (optional) "false" → hide live preview, show code only
    data-setup       (optional) name of an exported setup fn from sherpa-popover.examples.js
-->
<template data-label="Toggle popover" data-layout="block" data-setup="popover-0">
  <sherpa-button data-variant="secondary" data-label="Toggle popover"></sherpa-button>
  
  <sherpa-popover data-heading="Popover heading">
    <p>Popover body content. Anchor it to any trigger element.</p>
  </sherpa-popover>
</template>

<template data-label="Positions" data-preview="false">
  <sherpa-popover data-heading="Top"    data-position="top">    <p>Anchored to the top of the trigger.</p></sherpa-popover>
  <sherpa-popover data-heading="Bottom" data-position="bottom"> <p>Anchored to the bottom of the trigger.</p></sherpa-popover>
  <sherpa-popover data-heading="Left"   data-position="left">   <p>Anchored to the left of the trigger.</p></sherpa-popover>
  <sherpa-popover data-heading="Right"  data-position="right">  <p>Anchored to the right of the trigger.</p></sherpa-popover>
</template>

<template data-label="Paged template" data-preview="false">
  <sherpa-popover data-heading="Onboarding" data-template="paged" data-page="1" data-pages="3">
    <p>Page 1 of a multi-step popover walkthrough.</p>
  </sherpa-popover>
</template>
