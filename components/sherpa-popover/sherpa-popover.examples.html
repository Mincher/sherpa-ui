<!--
  sherpa-popover — Live examples.
-->
<template data-label="Toggle popover" data-description="Anchored to a button; toggles via data-open." data-layout="block" data-setup="popover-toggle">
  <div style="display: inline-flex; gap: var(--sherpa-space-default); align-items: flex-start;">
    <sherpa-button data-variant="secondary" data-label="Show details" data-icon-end="fa-solid fa-chevron-down"></sherpa-button>
    <sherpa-popover data-heading="Device details">
      <sherpa-key-value-list data-items='[
        {"label":"Model","value":"Acme Gateway G2"},
        {"label":"Firmware","value":"2.14.1"},
        {"label":"Region","value":"EU (Frankfurt)"},
        {"label":"Last seen","value":"2 mins ago"}
      ]'></sherpa-key-value-list>
    </sherpa-popover>
  </div>
</template>

<template data-label="Positions" data-description="data-position anchors the popover to the top, bottom, left, or right of its trigger." data-layout="row">
  <sherpa-popover data-heading="Top"    data-position="top"    data-open><p>Anchored above the trigger.</p></sherpa-popover>
  <sherpa-popover data-heading="Bottom" data-position="bottom" data-open><p>Anchored below the trigger.</p></sherpa-popover>
  <sherpa-popover data-heading="Right"  data-position="right"  data-open><p>Anchored to the right.</p></sherpa-popover>
</template>

<template data-label="Rich content with actions" data-description="Popovers can host any markup, including form fields and buttons." data-layout="block" data-setup="popover-confirm">
  <div style="display: inline-flex; gap: var(--sherpa-space-default); align-items: flex-start;">
    <sherpa-button data-variant="secondary" data-status="critical" data-label="Delete project" data-icon-start="fa-solid fa-trash"></sherpa-button>
    <sherpa-popover data-heading="Delete this project?">
      <p>This action cannot be undone. All 24 devices will be unassigned.</p>
      <div style="display: flex; justify-content: flex-end; gap: var(--sherpa-space-sm); margin-block-start: var(--sherpa-space-default);">
        <sherpa-button data-variant="tertiary" data-size="small" data-label="Cancel"></sherpa-button>
        <sherpa-button data-variant="primary"  data-size="small" data-status="critical" data-label="Delete"></sherpa-button>
      </div>
    </sherpa-popover>
  </div>
</template>

<template data-label="Paged onboarding" data-description="data-template=&quot;paged&quot; renders Next/Back navigation with a page indicator." data-layout="block">
  <sherpa-popover data-heading="Welcome to Sherpa" data-template="paged" data-page="1" data-pages="3" data-open>
    <p>Start by adding your first device. We'll walk you through it.</p>
  </sherpa-popover>
</template>
