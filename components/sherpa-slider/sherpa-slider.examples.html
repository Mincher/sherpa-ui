<!--
  sherpa-slider — Live examples.
  Each <template> renders one example block in the docs site (docs/router.js).
  Attributes:
    data-label       (required) example heading
    data-description (optional) one-line summary
    data-layout      (optional) row (default) | col | block
    data-preview     (optional) "false" → hide live preview, show code only
    data-setup       (optional) name of an exported setup fn from sherpa-slider.examples.js
-->
<template data-label="Basic" data-layout="block">
  <sherpa-slider data-label="Volume" min="0" max="100" value="40"></sherpa-slider>
</template>

<template data-label="With step" data-layout="block">
  <sherpa-slider data-label="Opacity" min="0" max="1" step="0.1" value="0.7"></sherpa-slider>
</template>
