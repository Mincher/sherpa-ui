<!--
  sherpa-node-canvas — Live examples.
-->
<template data-label="Data pipeline" data-description="A five-node pipeline: source → filter → aggregate → threshold → alert sink." data-layout="block">
  <sherpa-node-canvas data-heading="Alerting pipeline" data-show-header data-grid style="height: 420px;">
    <sherpa-node data-kind="source" data-node-id="src" data-x="40" data-y="60">
      <sherpa-node-row data-variant="header" data-icon="fa-solid fa-database" slot="header">
        <span slot="title">Device telemetry</span>
        <sherpa-node-socket slot="output-socket" data-direction="out" data-port-name="rows" data-connected data-connection-count="1"></sherpa-node-socket>
      </sherpa-node-row>
    </sherpa-node>

    <sherpa-node data-kind="filter" data-node-id="filter" data-x="260" data-y="40">
      <sherpa-node-row data-variant="header" data-icon="fa-solid fa-filter" slot="header">
        <span slot="title">Filter</span>
        <sherpa-node-socket slot="input-socket"  data-direction="in"  data-port-name="rows" data-connected data-connection-count="1"></sherpa-node-socket>
        <sherpa-node-socket slot="output-socket" data-direction="out" data-port-name="rows" data-connected data-connection-count="1"></sherpa-node-socket>
      </sherpa-node-row>
      <sherpa-node-row><span slot="label">region = EU</span></sherpa-node-row>
    </sherpa-node>

    <sherpa-node data-kind="math" data-node-id="agg" data-x="480" data-y="40"
      data-subtypes='[{"value":"sum","label":"Sum"},{"value":"avg","label":"Average"},{"value":"max","label":"Max"}]'
      data-subtype="avg">
      <sherpa-node-row data-variant="header" data-icon="fa-solid fa-calculator" slot="header">
        <span slot="title">Aggregate</span>
        <sherpa-node-socket slot="input-socket"  data-direction="in"  data-port-name="value" data-connected data-connection-count="1"></sherpa-node-socket>
        <sherpa-node-socket slot="output-socket" data-direction="out" data-port-name="result" data-connected data-connection-count="1"></sherpa-node-socket>
      </sherpa-node-row>
    </sherpa-node>

    <sherpa-node data-kind="variable" data-node-id="threshold" data-x="480" data-y="220">
      <sherpa-node-row data-variant="header" data-icon="fa-solid fa-square-root-variable" slot="header">
        <span slot="title">Threshold</span>
        <sherpa-node-socket slot="output-socket" data-direction="out" data-port-name="value" data-connected data-connection-count="1"></sherpa-node-socket>
      </sherpa-node-row>
      <sherpa-node-row><span slot="label">80</span></sherpa-node-row>
    </sherpa-node>

    <sherpa-node data-kind="sink" data-node-id="alert" data-x="720" data-y="120" data-selected>
      <sherpa-node-row data-variant="header" data-icon="fa-solid fa-bell" slot="header">
        <span slot="title">Fire alert</span>
        <sherpa-node-socket slot="input-socket" data-direction="in" data-port-name="in" data-multi></sherpa-node-socket>
      </sherpa-node-row>
      <sherpa-node-row><sherpa-node-socket slot="input-socket" data-direction="in" data-port-name="value"     data-connected data-connection-count="1"></sherpa-node-socket><span slot="label">value</span></sherpa-node-row>
      <sherpa-node-row><sherpa-node-socket slot="input-socket" data-direction="in" data-port-name="threshold" data-connected data-connection-count="1"></sherpa-node-socket><span slot="label">threshold</span></sherpa-node-row>
    </sherpa-node>
  </sherpa-node-canvas>
</template>

<template data-label="Empty canvas" data-description="The canvas shows its background grid even with no nodes \u2014 a drop target for the first node.\"" data-layout="block">
  <sherpa-node-canvas data-heading="New pipeline" data-show-header data-grid style="height: 240px;"></sherpa-node-canvas>
</template>
