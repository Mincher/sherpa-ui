<!--
  sherpa-gauge-chart — Live examples.
-->
<template data-label="CPU usage gauge" data-description="Single value rendered against a 0–100 scale." data-layout="block">
  <sherpa-gauge-chart data-value="72" data-min="0%" data-max="100%" data-label="CPU usage" style="height: 200px; width: 280px;"></sherpa-gauge-chart>
</template>

<template data-label="SLA gauge" data-description="Tight min/max range surfaces sub-1% changes." data-layout="row">
  <sherpa-gauge-chart data-value="99.4" data-min="95%" data-max="100%" data-label="Uptime SLA" style="height: 200px; width: 280px;"></sherpa-gauge-chart>
  <sherpa-gauge-chart data-value="88" data-min="0%" data-max="100%" data-label="Disk capacity" style="height: 200px; width: 280px;"></sherpa-gauge-chart>
  <sherpa-gauge-chart data-value="42" data-min="0%" data-max="100%" data-label="Memory pressure" style="height: 200px; width: 280px;"></sherpa-gauge-chart>
</template>

<template data-label="Series variant — Quota breakdown" data-description="data-variant=&quot;series&quot; reads arc segments from setSegments() for stacked allocation." data-layout="block" data-setup="quota-series">
  <sherpa-gauge-chart data-value="82" data-min="0%" data-max="100%" data-label="Storage quota" data-variant="series" style="height: 200px; width: 320px;"></sherpa-gauge-chart>
</template>

<template data-label="Loading state" data-description="Skeleton arc while waiting on data." data-layout="block">
  <sherpa-gauge-chart data-label="Throughput" data-loading style="height: 200px; width: 280px;"></sherpa-gauge-chart>
</template>
