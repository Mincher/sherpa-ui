<!--
  sherpa-layout-view — Live examples.
  Each <template> renders one example block in the docs site (docs/router.js).
  Attributes:
    data-label       (required) example heading
    data-description (optional) one-line summary
    data-layout      (optional) row (default) | col | block
    data-preview     (optional) "false" → hide live preview, show code only
    data-setup       (optional) name of an exported setup fn from sherpa-layout-view.examples.js
-->
<template data-label="View shell" data-layout="block">
  <sherpa-layout-view data-heading="Dashboard" style="height: 360px;">
    <sherpa-button slot="header-actions" data-variant="primary" data-size="small" data-label="Add device" data-icon-start="fa-solid fa-plus"></sherpa-button>
    <p>Layout view provides a scrollable content column with header actions slotted in.</p>
  </sherpa-layout-view>
</template>
