<!--
  sherpa-layout-view.html — Shadow DOM template for sherpa-layout-view.

  A body-content layout primitive: an embedded sherpa-view-header sits at
  the top, optional left/right side rails flank a scrollable content
  column. The whole thing is bounded to the viewport height by default
  so the side rails stay anchored and only the content column scrolls.

  This is the body-area sibling of sherpa-layout-grid. Use this when you
  want a standard "view header + rails + scrolling content" page region;
  use sherpa-layout-grid when you need the resizable dashboard grid.

  Host attributes:
    data-heading       — Title shown by the embedded view-header
    data-export-title  — Forwarded to the embedded view-header
    data-fill          — "viewport" (default) | "parent"
                         viewport: clamp to 100dvh
                         parent:   fill flex parent (no dvh clamp)
    data-pad           — Adds padding inside the content column
    data-gap           — sm | base | lg — gap between stacked content children
  Slots:
    (default)        — Body content (stacked vertically)
    header-actions   — Forwarded to the embedded view-header's view-selection
    side-panel-start — Leading rail (typically a sherpa-panel)
    side-panel-end   — Trailing rail (typically a sherpa-panel)
-->

<template id="default">
  <sherpa-view-header class="view-header" part="header">
    <slot name="header-actions" slot="view-selection"></slot>
  </sherpa-view-header>
  <div class="view-body" part="body">
    <slot name="side-panel-start" class="side-panel-start"></slot>
    <div class="view-content" part="content">
      <slot></slot>
    </div>
    <slot name="side-panel-end" class="side-panel-end"></slot>
  </div>
</template>
