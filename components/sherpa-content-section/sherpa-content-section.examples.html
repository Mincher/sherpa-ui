<!--
  sherpa-content-section — Live examples.
  Each <template> renders one example block in the docs site (docs/router.js).
  Attributes:
    data-label       (required) example heading
    data-description (optional) one-line summary
    data-layout      (optional) row (default) | col | block
    data-preview     (optional) "false" → hide live preview, show code only
    data-setup       (optional) name of an exported setup fn from sherpa-content-section.examples.js
-->
<template data-label="Side panel section" data-layout="block">
  <sherpa-content-section data-heading="Filters" data-position="left" data-restore-label="Filters">
    <sherpa-input-search data-label="Search" placeholder="Filter…"></sherpa-input-search>
    <p>Side-panel sections can be collapsed and restored from the host layout.</p>
  </sherpa-content-section>
</template>
