<!--
  sherpa-input-date.html — Date input component.

  Templates:
    • default — Typeable text input + calendar-icon trigger + popup

  Host attributes:
    min — Minimum date value (YYYY-MM-DD)
    max — Maximum date value (YYYY-MM-DD)

  Inherited from SherpaInputBase:
    data-label, data-description, data-helper, data-layout,
    disabled, readonly, required, name, value, placeholder,
    pattern, minlength, maxlength, novalidate
-->
<template id="default">
  <!-- Typeable text input (YYYY-MM-DD). Owns form value + validation. -->
  <input
    type="text"
    class="input-field"
    placeholder="YYYY-MM-DD"
    inputmode="numeric"
    autocomplete="off"
    spellcheck="false"
  />

  <!-- Calendar-icon button: opens / closes the picker popup. -->
  <button
    type="button"
    class="picker-trigger input-action"
    part="trigger"
    aria-haspopup="dialog"
    aria-expanded="false"
    aria-label="Open calendar"
    tabindex="-1"
  >
    <i class="fa-regular fa-calendar trigger-icon" aria-hidden="true"></i>
  </button>

  <!-- Calendar popup — shown via :host([data-open]) -->
  <div class="picker-popup" role="dialog" aria-modal="true" aria-label="Date picker">
    <div class="cal-header">
      <button type="button" class="cal-nav cal-prev" aria-label="Previous month">
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
      </button>
      <span class="cal-month-year" aria-live="polite"></span>
      <button type="button" class="cal-nav cal-next" aria-label="Next month">
        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
      </button>
    </div>
    <div class="cal-weekdays" aria-hidden="true">
      <span class="cal-weekday">Su</span>
      <span class="cal-weekday">Mo</span>
      <span class="cal-weekday">Tu</span>
      <span class="cal-weekday">We</span>
      <span class="cal-weekday">Th</span>
      <span class="cal-weekday">Fr</span>
      <span class="cal-weekday">Sa</span>
    </div>
    <div class="cal-days" role="grid"></div>
  </div>

  <!-- Day button prototype — cloned by JS, never rendered directly -->
  <template class="cal-day-tpl">
    <button type="button" class="cal-day" role="gridcell"></button>
  </template>
</template>
