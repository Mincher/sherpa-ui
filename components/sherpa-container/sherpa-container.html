<!--
  sherpa-container.html — Shadow DOM template for sherpa-container.

  Universal container for dashboard composition and standalone card layouts.
  Exposes a named container query scope (`sherpa-container`) so descendant
  viz components can adapt their layout via container queries.

  Content may be provided via:
    slot="header"  — Card-style header (use sherpa-header). Renders edge-to-edge
                     with a bottom separator. Shown only when content is slotted.
    (default slot) — Main content area (light-DOM children with no slot attr).
    slot="footer"  — Card-style footer (use sherpa-footer or sherpa-button).
                     Shown only when content is slotted.

  State overlay slots (visible when data-state matches):
    slot="loading" — Replaces body while data-state="loading"
    slot="empty"   — Replaces body while data-state="empty"
    slot="error"   — Replaces body while data-state="error"

  Host attributes:
    data-variant     — "fit" | "resizable" | "fill" | "worksheet" (default: fit)
    data-col-span    — "3" | "6" | "9" | "12" (resizable variant only)
    data-row-span    — "1"–"6" (resizable variant only)
    data-editable    — Edit mode (resizable variant only)
    data-menu-open   — Set automatically while a descendant overflow menu is open
    data-state       — ready | loading | empty | error — controls overlay
    data-interactive — Makes the container a clickable surface
    data-selectable  — Makes the container a selectable radio option
    data-selected    — Selected/active state
    data-elevation   — none | sm | md | lg — box-shadow depth
    disabled         — Disabled state
-->

<template id="default">
  <div class="card-header" part="header">
    <slot name="header"></slot>
  </div>
  <div class="card-content" part="content">
    <slot></slot>
  </div>
  <slot name="footer"></slot>
  <div class="state-overlay" role="status" aria-live="polite">
    <slot name="loading" class="state-slot state-loading">
      <span class="state-default state-default-loading" aria-label="Loading"></span>
    </slot>
    <slot name="empty" class="state-slot state-empty">
      <span class="state-default state-default-empty">No data to display.</span>
    </slot>
    <slot name="error" class="state-slot state-error">
      <span class="state-default state-default-error">Failed to load.</span>
    </slot>
  </div>
</template>
