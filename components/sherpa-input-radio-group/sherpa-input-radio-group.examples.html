<!--
  sherpa-input-radio-group — Live examples.
  Each <template> renders one example block in the docs site (docs/router.js).
  Attributes:
    data-label       (required) example heading
    data-description (optional) one-line summary
    data-layout      (optional) row (default) | col | block
    data-preview     (optional) "false" → hide live preview, show code only
    data-setup       (optional) name of an exported setup fn from sherpa-input-radio-group.examples.js
-->
<template data-label="Account type" data-layout="block">
  <sherpa-input-radio-group data-label="Account type" name="account-type">
    <sherpa-input-radio data-label="Personal"   value="personal"   checked></sherpa-input-radio>
    <sherpa-input-radio data-label="Business"   value="business"></sherpa-input-radio>
    <sherpa-input-radio data-label="Enterprise" value="enterprise"></sherpa-input-radio>
  </sherpa-input-radio-group>
</template>
