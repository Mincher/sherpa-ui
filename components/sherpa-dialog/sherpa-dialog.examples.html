<!--
  sherpa-dialog — Live examples.
  Each <template> renders one example block in the docs site (docs/router.js).
  Attributes:
    data-label       (required) example heading
    data-description (optional) one-line summary
    data-layout      (optional) row (default) | col | block
    data-preview     (optional) "false" → hide live preview, show code only
    data-setup       (optional) name of an exported setup fn from sherpa-dialog.examples.js
-->
<template data-label="Confirmation dialog" data-description="Use .show() to open the dialog modally." data-layout="block" data-setup="dialog-0">
  <sherpa-button data-variant="primary" data-label="Open dialog" data-icon-start="fa-solid fa-play"></sherpa-button>
  
  <sherpa-dialog data-label="Confirm action" data-description="Deploy configuration to all devices?" data-size="medium">
    <p>This will deploy your configuration to all devices in the selected region.</p>
    <sherpa-callout slot="footer" data-status="warning" data-label="Once started, this action cannot be cancelled."></sherpa-callout>
  </sherpa-dialog>
</template>
