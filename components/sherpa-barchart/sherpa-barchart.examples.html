<!--
  sherpa-barchart — Live examples.
  Each <template> renders one example block in the docs site (docs/router.js).
  Attributes:
    data-label       (required) example heading
    data-description (optional) one-line summary
    data-layout      (optional) row (default) | col | block
    data-preview     (optional) "false" → hide live preview, show code only
    data-setup       (optional) name of an exported setup fn from sherpa-barchart.examples.js
-->
<template data-label="Categorical bars" data-layout="block" data-setup="barchart-0">
  <sherpa-barchart data-category="category" data-value-field="value" data-orientation="vertical" style="height: 240px;"></sherpa-barchart>
</template>

<template data-label="Horizontal orientation" data-preview="false">
  <sherpa-barchart data-category="category" data-value-field="value" data-orientation="horizontal" style="height: 240px;"></sherpa-barchart>
</template>

<template data-label="Stacked series" data-preview="false">
  <sherpa-barchart data-category="month" data-value-field="value" data-series="region" data-stack style="height: 240px;"></sherpa-barchart>
</template>
