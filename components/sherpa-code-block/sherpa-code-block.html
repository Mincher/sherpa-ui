<template id="default">
  <div class="code-header" part="header">
    <span class="code-language" part="language-label"></span>
    <sherpa-button 
      class="copy-btn"
      part="copy-button"
      data-variant="tertiary"
      data-type="icon"
      data-icon-start="fa-solid fa-copy"
      aria-label="Copy code to clipboard">
    </sherpa-button>
  </div>
  <pre class="code-wrapper" part="pre"><code class="hljs" part="code"></code></pre>
</template>
