<!--
  sherpa-input-date-range — Live examples.
-->
<template data-label="Reporting period" data-description="Bound the picker to a calendar quarter via min/max.">
  <sherpa-input-date-range data-label="Reporting period" data-value-start="2026-01-01" data-value-end="2026-03-31"></sherpa-input-date-range>
</template>

<template data-label="Travel window" data-description="Bounded range with helper copy explaining the limit.">
  <sherpa-input-date-range data-label="Travel dates" min="2026-05-18" max="2026-12-31" data-helper="Pick a start and end date within the rest of 2026."></sherpa-input-date-range>
</template>

<template data-label="Required" data-description="required marks the field invalid until both dates are picked.">
  <sherpa-input-date-range data-label="Audit window" required data-helper="Both start and end are required."></sherpa-input-date-range>
</template>

<template data-label="Validation error">
  <sherpa-input-date-range data-label="Lease term" data-value-start="2026-06-01" data-value-end="2026-05-31" data-status="critical" data-helper="End date must be after start date."></sherpa-input-date-range>
</template>
