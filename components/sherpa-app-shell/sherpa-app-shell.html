<!--
  sherpa-app-shell.html — Shadow DOM template for sherpa-app-shell.

  Layout (:host is a flex row):
    .nav-slot  — position: absolute; does not participate in flex flow.
                 sherpa-nav expands on hover over the main area (overlay, no reflow).
                 margin-inline-start on .app-main reserves the collapsed/pinned rail width.
    .app-main  — flex: 1; sole flex item; flex column
      .product-bar-row — flex: 0 0 auto; 48px product bar
      .content-row     — flex: 1; hosts sherpa-layout-grid

  Slots:
    nav          — sherpa-nav element
    product-bar  — sherpa-product-bar-v2 element (optional; App Shell v2 folds
                   its actions into app-header)
    app-header   — sherpa-app-header element (App Shell v2 baseline header)
    (default)    — sherpa-layout-grid / main content
-->
<template id="default">
  <div class="nav-slot">
    <slot name="nav" data-accepts="nav,html"></slot>
  </div>
  <div class="app-main">
    <div class="product-bar-row">
      <slot name="product-bar" data-accepts="shell,nav,html"></slot>
    </div>
    <div class="app-header-row">
      <slot name="app-header" data-accepts="shell,html"></slot>
    </div>
    <div class="content-row">
      <slot data-accepts="any,html"></slot>
    </div>
  </div>
</template>
