<!--
  sherpa-input-select — Live examples.
-->
<template data-label="Region picker" data-description="Options declared as light-DOM <sherpa-option> children." data-layout="block">
  <sherpa-input-select data-label="Region" data-placeholder="Pick a region…" style="min-width: 280px;">
    <sherpa-option value="eu"   label="EU (Frankfurt)"></sherpa-option>
    <sherpa-option value="us"   label="US (Virginia)"></sherpa-option>
    <sherpa-option value="apac" label="APAC (Tokyo)"></sherpa-option>
    <sherpa-option value="sa"   label="South America (São Paulo)"></sherpa-option>
  </sherpa-input-select>
</template>

<template data-label="With initial value" data-description="value pre-selects an option." data-layout="block">
  <sherpa-input-select data-label="Default region" value="eu" style="min-width: 280px;">
    <sherpa-option value="eu"   label="EU (Frankfurt)"></sherpa-option>
    <sherpa-option value="us"   label="US (Virginia)"></sherpa-option>
    <sherpa-option value="apac" label="APAC (Tokyo)"></sherpa-option>
  </sherpa-input-select>
</template>

<template data-label="Required with validation" data-layout="block">
  <sherpa-input-select data-label="Plan" required data-status="critical" data-helper="You must pick a plan to continue." data-placeholder="Choose a plan…" style="min-width: 280px;">
    <sherpa-option value="free" label="Free — single project"></sherpa-option>
    <sherpa-option value="pro"  label="Pro — $19 / month"></sherpa-option>
    <sherpa-option value="team" label="Team — $49 / user / month"></sherpa-option>
  </sherpa-input-select>
</template>

<template data-label="Disabled" data-layout="block">
  <sherpa-input-select data-label="Inherited region" value="eu" disabled style="min-width: 280px;">
    <sherpa-option value="eu" label="EU (Frankfurt)"></sherpa-option>
  </sherpa-input-select>
</template>

<template data-label="Programmatic options" data-description="For dynamic or large lists, call setOptions() instead of declaring children." data-layout="block" data-setup="input-select-3">
  <sherpa-input-select data-label="Time zone" data-placeholder="Pick a time zone…" style="min-width: 320px;"></sherpa-input-select>
</template>

<template data-label="In a settings panel" data-description="Wrap several selects in a sherpa-container for a realistic settings card." data-layout="block">
  <sherpa-container data-variant="fit" style="max-width: 480px;">
    <sherpa-container-header slot="header" data-title="Notification preferences"></sherpa-container-header>
    <div slot="body" style="display: grid; gap: var(--sherpa-space-default); padding: var(--sherpa-space-default);">
      <sherpa-input-select data-label="Digest frequency" value="daily">
        <sherpa-option value="realtime" label="Real time"></sherpa-option>
        <sherpa-option value="hourly"   label="Hourly"></sherpa-option>
        <sherpa-option value="daily"    label="Daily summary"></sherpa-option>
        <sherpa-option value="weekly"   label="Weekly summary"></sherpa-option>
      </sherpa-input-select>
      <sherpa-input-select data-label="Delivery channel" value="email">
        <sherpa-option value="email" label="Email"></sherpa-option>
        <sherpa-option value="sms"   label="SMS"></sherpa-option>
        <sherpa-option value="slack" label="Slack"></sherpa-option>
      </sherpa-input-select>
    </div>
  </sherpa-container>
</template>
