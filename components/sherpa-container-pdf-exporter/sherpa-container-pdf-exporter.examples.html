<!--
  sherpa-container-pdf-exporter — Live examples.
-->
<template data-label="Print-ready dashboard" data-description="Wrap any container or layout in this element to enable PDF/print export. Children gain a data-pdf-mode attribute when exporting." data-layout="block">
  <sherpa-container-pdf-exporter data-title="Weekly device report" data-subtitle="Generated for the EU region">
    <sherpa-container data-variant="fit">
      <sherpa-container-header slot="header" data-title="Devices online" data-description="Snapshot for the period 18 Mar – 24 Mar 2026."></sherpa-container-header>
      <div slot="body" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sherpa-space-default); padding: var(--sherpa-space-default);">
        <sherpa-metric data-label="Total devices" value="1,284" data-delta="+12" data-trend="up"></sherpa-metric>
        <sherpa-metric data-label="Online"        value="1,242" data-status="success"></sherpa-metric>
        <sherpa-metric data-label="Open alerts"   value="7"     data-status="critical"></sherpa-metric>
      </div>
    </sherpa-container>
  </sherpa-container-pdf-exporter>
</template>

<template data-label="With trigger button" data-description="Pair with a Print button that calls window.print() on click to produce the PDF export." data-layout="block">
  <sherpa-container-pdf-exporter data-title="Audit log export">
    <div style="display: flex; justify-content: flex-end; padding: var(--sherpa-space-default);">
      <sherpa-button data-variant="secondary" data-label="Export to PDF" data-icon-start="fa-solid fa-file-pdf" onclick="window.print()"></sherpa-button>
    </div>
    <sherpa-container data-variant="fit">
      <sherpa-container-header slot="header" data-title="Audit log" data-description="Last 24 hours."></sherpa-container-header>
      <sherpa-list slot="body">
        <sherpa-list-item data-label="alex@acme.io signed in"     data-description="from 192.0.2.42 — 09:14"></sherpa-list-item>
        <sherpa-list-item data-label="API key rotated"             data-description="prod-key-7 — 10:42"></sherpa-list-item>
        <sherpa-list-item data-label="Device acme-edge-09 added"   data-description="EU region — 12:08"></sherpa-list-item>
      </sherpa-list>
    </sherpa-container>
  </sherpa-container-pdf-exporter>
</template>
