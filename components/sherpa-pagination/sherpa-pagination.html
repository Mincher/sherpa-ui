<!--
  sherpa-pagination.html — Pagination bar with page-size selector and page navigator.

  Templates:
    • default — Rows-per-page selector + page controls

  Host attributes:
    data-page            — Current 1-based page number (default: 1)
    data-page-size       — Rows shown per page (default: 25)
    data-total-rows      — Total filterable row count (drives page calculations)
    data-allowed-sizes   — Comma-separated page-size options (default: "10,25,50,100")
    data-density         — "compact" | "comfortable"
    hidden               — Hides the component entirely

  Events:
    page-change — { page, pageSize, totalPages }
-->

<template id="default">
  <div class="pagination-results" part="results">
    <span class="pagination-label">Rows per page</span>
    <select class="page-size-select" aria-label="Rows per page"></select>
  </div>

  <div class="pagination-info" part="info">
    <span class="row-range"></span>
  </div>

  <div class="pagination-pager" part="pager">
    <button class="page-btn page-first" data-action="first" aria-label="First page" type="button">
      <i class="fa-solid fa-angles-left" aria-hidden="true"></i>
    </button>
    <button class="page-btn page-prev" data-action="prev" aria-label="Previous page" type="button">
      <i class="fa-solid fa-angle-left" aria-hidden="true"></i>
    </button>
    <span class="page-indicator">
      <span class="page-current"></span>
      <span class="page-separator">of</span>
      <span class="page-total"></span>
    </span>
    <!-- Numbered page buttons (windowed; shown when the container has width). -->
    <span class="page-numbers" role="group" aria-label="Pages"></span>
    <button class="page-btn page-next" data-action="next" aria-label="Next page" type="button">
      <i class="fa-solid fa-angle-right" aria-hidden="true"></i>
    </button>
    <button class="page-btn page-last" data-action="last" aria-label="Last page" type="button">
      <i class="fa-solid fa-angles-right" aria-hidden="true"></i>
    </button>
  </div>

  <!-- Cloning prototype: page-size option -->
  <template class="option-tpl">
    <option data-bind="label" data-bind-attr="value:value; selected:selected"></option>
  </template>

  <!-- Cloning prototypes: a numbered page button and an ellipsis gap. -->
  <template class="page-num-tpl">
    <button class="page-btn page-num" data-action="page" type="button"
            data-bind="label" data-bind-attr="data-page:page; aria-current:current; disabled:isCurrent"></button>
  </template>
  <template class="page-gap-tpl">
    <span class="page-gap" aria-hidden="true">…</span>
  </template>
</template>
