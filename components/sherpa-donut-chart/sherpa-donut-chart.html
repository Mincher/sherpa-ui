<!--
  sherpa-donut-chart.html — Templates for sherpa-donut-chart.

  Templates:
    • default  — Circular div with conic-gradient slices + centre label
    • (custom) — Consumers can add additional <template id="..."> blocks here
                  to define alternative chart layouts. Use the component's
                  `get templateId()` override to select a template by id.

  Host attributes:
    data-title          — Chart title
    data-inner-label    — Centre big text (e.g. "100")
    data-inner-sublabel — Centre small text (e.g. "TOTAL")
    data-loading        — Boolean, dims chart
    data-variant        — donut (default) | pie

  Methods:
    setData([{ label, value, color? }])

  Custom templates:
    To define a custom layout, add a new <template id="my-layout"> block
    below the existing templates. Override `get templateId()` in a subclass
    or set it dynamically to select the template at render time.
-->

<!-- ═══════════════════════════════════════════════════════════════════════
     DEFAULT — Circular div with conic-gradient slices + centre label
     ═══════════════════════════════════════════════════════════════════════ -->
<template id="default">
  <div class="chart-header">
    <span class="chart-title"></span>
    <sherpa-button
      class="menu-button"
      data-type="icon"
      data-menu="true"
      data-variant="tertiary"
      data-size="small"
      data-icon-start="&#xf142;"
      aria-label="Menu"
      data-tooltip="Menu"
      data-menu-position="bottom-end"
      data-menu-scope="shadow"
      data-keep-compact
    ></sherpa-button>
  </div>

  <sherpa-filter-bar data-embedded data-type="local" data-sort-type="value">
    <sherpa-button
      slot="actions"
      data-variant="tertiary"
      data-size="small"
      data-action="clear"
      >Clear filter</sherpa-button
    >
  </sherpa-filter-bar>

  <div class="chart-layout" role="img" aria-label="">
    <span class="chart-sr-summary" aria-live="polite"></span>
    <div class="chart-area">
      <div class="donut-ring" aria-hidden="true"></div>
      <div class="donut-hole" aria-hidden="true"></div>
      <div class="centre-label" aria-hidden="true">
        <span class="centre-value"></span>
        <span class="centre-sublabel"></span>
      </div>
    </div>
    <div class="chart-legend" aria-hidden="true"></div>
  </div>
  <sherpa-tooltip></sherpa-tooltip>

  <!-- Cloning prototype for legend items -->
  <template class="legend-item-tpl">
    <div class="legend-item">
      <span class="legend-key"></span>
      <span class="legend-label"></span>
      <span class="legend-value"></span>
    </div>
  </template>

  <!-- Filter-menu — cloned into a light-DOM <template data-menu> on connect -->
  <template id="filter-menu">
    <sherpa-overlay-item
      data-selection="checkbox"
      data-event="toggle-filters"
    >Show / hide filters</sherpa-overlay-item>
    <sherpa-overlay-item
      data-selection="checkbox"
      data-event="toggle-legend"
      checked
    >Show / hide legend</sherpa-overlay-item>
  </template>
</template>
