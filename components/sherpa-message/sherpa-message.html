<!--
  sherpa-message.html — Banner / inline message.

  Templates:
    • default — Status icon + label + optional inline action link + dismiss button

  Host attributes:
    data-status        — "success" | "critical" | "warning" | "info" | "urgent"
    data-label         — Message text
    data-action-label  — Optional action link text (renders trailing link)
    data-action-href   — Optional href for the action link
    data-action-icon   — FA classes for trailing link icon (default: fa-solid fa-arrow-up-right-from-square)
    data-dismissible   — Presence (or "true") shows the close button
-->

<template id="default">
<span class="message-icon" part="icon">
  <i class="sherpa-icon default-icon" data-size="sm" aria-hidden="true"></i>
</span>

<div class="message-content" part="content">
  <span class="message-label text-body-md" part="label"></span>
  <a class="message-action text-body-md" part="action" hidden>
    <span class="message-action-label"></span>
    <i class="message-action-icon sherpa-icon" data-size="xs" aria-hidden="true"></i>
  </a>
</div>

<sherpa-button
  class="message-close"
  part="close"
  data-type="icon"
  data-variant="tertiary"
  data-size="small"
  data-icon-start="fa-solid fa-xmark"
  aria-label="Dismiss"
></sherpa-button>
</template>
