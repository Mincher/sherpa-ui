<!--
  sherpa-list-item — Live examples.
  Each <template> renders one example block in the docs site (docs/router.js).
  Attributes:
    data-label       (required) example heading
    data-description (optional) one-line summary
    data-layout      (optional) row (default) | col | block
    data-preview     (optional) "false" → hide live preview, show code only
    data-setup       (optional) name of an exported setup fn from sherpa-list-item.examples.js
-->
<template data-label="Variants" data-layout="col">
  <sherpa-list-item data-label="Plain item"></sherpa-list-item>
  <sherpa-list-item data-label="With description" data-description="Last updated 2 mins ago"></sherpa-list-item>
  <sherpa-list-item data-label="With icon"        data-description="online · EU" data-icon="fa-solid fa-server"></sherpa-list-item>
  <sherpa-list-item data-label="Interactive"      data-icon="fa-solid fa-gauge"  data-interactive></sherpa-list-item>
  <sherpa-list-item data-label="Active"           data-icon="fa-solid fa-star"   data-interactive data-active></sherpa-list-item>
</template>

<template data-label="With trailing tag" data-layout="col">
  <sherpa-list-item data-label="Build succeeded"      data-description="2 mins ago"><sherpa-tag slot="trailing" data-status="success">Success</sherpa-tag></sherpa-list-item>
  <sherpa-list-item data-label="High CPU usage"        data-description="12 mins ago"><sherpa-tag slot="trailing" data-status="warning">Warning</sherpa-tag></sherpa-list-item>
  <sherpa-list-item data-label="SSL certificate expiring" data-description="5 days"><sherpa-tag slot="trailing" data-status="critical">Critical</sherpa-tag></sherpa-list-item>
</template>
