<!--
  sherpa-input-password — Live examples.
-->
<template data-label="Default" data-description="Password input with helper text and a visibility toggle.">
  <sherpa-input-password data-label="Password" placeholder="At least 12 characters" data-helper="Use a mix of letters, numbers, and symbols." style="min-width: 320px;"></sherpa-input-password>
</template>

<template data-label="Required with minlength" data-description="Browser-native validation kicks in on form submit.">
  <sherpa-input-password data-label="New password" required minlength="12" style="min-width: 320px;"></sherpa-input-password>
</template>

<template data-label="Validation error" data-description="data-status=&quot;critical&quot; surfaces an inline error.">
  <sherpa-input-password data-label="Password" value="abc" data-status="critical" data-helper="Password must be at least 12 characters." style="min-width: 320px;"></sherpa-input-password>
</template>

<template data-label="Change-password form" data-description="Typical reset-password composition with confirm field." data-layout="block">
  <sherpa-container data-variant="fit" style="max-width: 480px;">
    <sherpa-header slot="header" data-title="Change password" data-description="You'll be signed out of other sessions."></sherpa-header>
    <div slot="body" style="display: grid; gap: var(--sherpa-space-default); padding: var(--sherpa-space-default);">
      <sherpa-input-password data-label="Current password" required></sherpa-input-password>
      <sherpa-input-password data-label="New password" required minlength="12" data-helper="At least 12 characters with a number and symbol."></sherpa-input-password>
      <sherpa-input-password data-label="Confirm new password" required></sherpa-input-password>
    </div>
    <div slot="footer" style="display: flex; gap: var(--sherpa-space-sm); justify-content: flex-end; padding: var(--sherpa-space-default);">
      <sherpa-button data-variant="tertiary" data-label="Cancel"></sherpa-button>
      <sherpa-button data-variant="primary" data-label="Update password"></sherpa-button>
    </div>
  </sherpa-container>
</template>
