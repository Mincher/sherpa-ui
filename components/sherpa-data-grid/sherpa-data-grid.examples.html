<!--
  sherpa-data-grid — Live examples.
  Each <template> renders one example block in the docs site (docs/router.js).
  Attributes:
    data-label       (required) example heading
    data-description (optional) one-line summary
    data-layout      (optional) row (default) | col | block
    data-preview     (optional) "false" → hide live preview, show code only
    data-setup       (optional) name of an exported setup fn from sherpa-data-grid.examples.js
-->
<template data-label="Devices grid" data-description="sherpa-data-grid is populated programmatically via setData({ rows, columns })." data-layout="block" data-setup="data-grid-0">
  <sherpa-data-grid data-density="base" style="height: 320px;"></sherpa-data-grid>
</template>

<template data-label="Compact density" data-description="Use data-density=&quot;compact&quot; to fit more rows per screen." data-preview="false">
  <sherpa-data-grid data-density="compact" style="height: 320px;"></sherpa-data-grid>
</template>

<template data-label="Comfortable density" data-preview="false">
  <sherpa-data-grid data-density="comfortable" style="height: 320px;"></sherpa-data-grid>
</template>
