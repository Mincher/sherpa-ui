<!doctype html>
<html lang="en" data-theme="sherpa" data-mode="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Chat — Sherpa-UI example</title>

  <!-- Design tokens (light DOM → inherit into every shadow root). -->
  <link rel="stylesheet" href="../dist/styles/tokens/tokens.css" />

  <style>
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--sherpa-font-family-body, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
      background: var(--sherpa-theme-surface-default-1, #e8e8f6);
      color: var(--sherpa-theme-content-body-base, #0c0b11);
    }

    /* The app-shell fills the viewport. */
    sherpa-app-shell { height: 100%; }

    /* The chat view: a scrolling thread over a pinned composer. */
    .chat {
      display: grid;
      grid-template-rows: 1fr auto;
      height: 100%;
      min-height: 0;
      background: var(--sherpa-theme-surface-default-base, #fff);
    }

    .thread {
      overflow-y: auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: var(--sherpa-display-mode-space-lg, 16px);
      padding: var(--sherpa-display-mode-space-2xl, 24px);
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }

    /* Typing indicator sits inline in the thread; CSS-toggled via [hidden]. */
    .typing[hidden] { display: none; }

    .composer-dock {
      border-top: 1px solid var(--sherpa-theme-border-default-2, #b3b3c3);
      padding: var(--sherpa-display-mode-space-lg, 16px) var(--sherpa-display-mode-space-2xl, 24px);
      background: var(--sherpa-theme-surface-default-base, #fff);
    }
    .composer-inner {
      max-width: 920px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <sherpa-app-shell data-no-header>
    <!-- Slot our own nav + header so we can populate() them directly. -->
    <sherpa-nav slot="nav" data-active-id="view-chat"></sherpa-nav>
    <sherpa-app-header slot="header" data-heading="Assistant" data-icon="&#x2728;"></sherpa-app-header>

    <!-- The chat view lives in the default slot. -->
    <div class="chat">
      <div class="thread" id="thread" role="log" aria-live="polite" aria-label="Conversation">

        <sherpa-chat-message
          data-type="system"
          data-message="New conversation started · Assistant v4">
        </sherpa-chat-message>

        <sherpa-chat-message
          data-type="user"
          data-name="Will"
          data-timestamp="09:41"
          data-message="Hey — can you help me debounce a search input in vanilla JS?">
        </sherpa-chat-message>

        <sherpa-chat-message
          data-type="assistant"
          data-name="Assistant"
          data-timestamp="09:41"
          data-message="Sure. Debouncing waits until the user stops typing before firing the handler. Here's a small reusable helper:">
        </sherpa-chat-message>

        <sherpa-chat-message data-type="assistant" data-name="Assistant" data-timestamp="09:41">
          <sherpa-code-block
            data-language="javascript"
            data-line-numbers
            data-code="function debounce(fn, delay = 300) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
}

const search = debounce((q) => fetchResults(q), 250);
input.addEventListener('input', (e) => search(e.target.value));">
          </sherpa-code-block>
        </sherpa-chat-message>

        <sherpa-chat-message
          data-type="user"
          data-name="Will"
          data-timestamp="09:42"
          data-message="Nice. What's a sensible default delay for a type-ahead?">
        </sherpa-chat-message>

        <sherpa-chat-message
          data-type="assistant"
          data-name="Assistant"
          data-timestamp="09:42"
          data-message="200–300ms feels responsive without hammering the network. Go lower (150ms) for local filtering, higher (400ms+) if each keystroke hits an expensive API.">
        </sherpa-chat-message>

        <sherpa-chat-message
          data-type="user"
          data-name="Will"
          data-timestamp="09:43"
          data-message="Great — and should I cancel in-flight requests too?">
        </sherpa-chat-message>

        <sherpa-chat-message
          data-type="assistant"
          data-name="Assistant"
          data-timestamp="09:43"
          data-message="Yes. Pair the debounce with an AbortController so a newer query cancels the older fetch — that avoids out-of-order responses overwriting fresh results.">
        </sherpa-chat-message>

        <!-- Typing indicator — toggled via [hidden] from JS. -->
        <sherpa-loader class="typing" id="typing" data-size="sm" hidden>
          <span slot="label">Assistant is typing…</span>
        </sherpa-loader>

      </div>

      <div class="composer-dock">
        <div class="composer-inner">
          <sherpa-prompt-composer
            id="composer"
            data-placeholder="Message the assistant… (Enter to send, Shift+Enter for a newline)">
          </sherpa-prompt-composer>
        </div>
      </div>
    </div>
  </sherpa-app-shell>

  <script type="module">
    import '../dist/index.js';

    await Promise.all([
      customElements.whenDefined('sherpa-app-shell'),
      customElements.whenDefined('sherpa-nav'),
      customElements.whenDefined('sherpa-app-header'),
      customElements.whenDefined('sherpa-chat-message'),
      customElements.whenDefined('sherpa-code-block'),
      customElements.whenDefined('sherpa-loader'),
      customElements.whenDefined('sherpa-prompt-composer'),
    ]);

    // ── Nav rail ──────────────────────────────────────────────
    const nav = document.querySelector('sherpa-app-shell sherpa-nav');
    nav.populate({
      product: { name: 'Sherpa', icon: '&#x1F9ED;' },
      quickItems: [
        { id: 'home', label: 'Home', icon: '&#x1F3E0;', href: '#' },
        { id: 'search', label: 'Search', icon: '&#x1F50D;', href: '#' },
      ],
      sections: [
        { label: 'Views', items: [
          { id: 'view-dashboard', label: 'Dashboard', icon: '&#x25A6;', href: 'dashboard.html' },
          { id: 'view-records',   label: 'Records',   icon: '&#x25A4;', href: 'records.html' },
          { id: 'view-settings',  label: 'Settings',  icon: '&#x2699;', href: 'settings.html' },
          { id: 'view-chat',      label: 'Assistant', icon: '&#x2733;', href: 'chat.html' },
        ] },
        {
          label: 'Workspace',
          items: [
            { id: 'assistant', label: 'Assistant', icon: '&#x2728;', href: '#' },
            { id: 'chat', label: 'Chat', icon: '&#x1F4AC;', href: '#', badge: '3' },
            { id: 'history', label: 'History', icon: '&#x1F553;', href: '#' },
          ],
        },
        {
          label: 'Account',
          items: [
            { id: 'settings', label: 'Settings', icon: '&#x2699;', href: '#' },
          ],
        },
      ],
    });

    // ── App header ────────────────────────────────────────────
    const header = document.querySelector('sherpa-app-shell sherpa-app-header');
    header.populate({
      breadcrumb: [
        { label: 'Workspace', href: '#' },
        { label: 'Assistant' },
      ],
    });

    // ── Chat wiring ───────────────────────────────────────────
    const thread = document.getElementById('thread');
    const typing = document.getElementById('typing');
    const composer = document.getElementById('composer');

    const scrollToBottom = () => { thread.scrollTop = thread.scrollHeight; };

    const now = () =>
      new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    // Insert a message before the typing indicator so it always trails.
    const addMessage = ({ type, name, message }) => {
      const el = document.createElement('sherpa-chat-message');
      el.dataset.type = type;
      if (name) el.dataset.name = name;
      el.dataset.timestamp = now();
      el.dataset.message = message;
      thread.insertBefore(el, typing);
      scrollToBottom();
      return el;
    };

    const CANNED_REPLIES = [
      'Good question. In short: keep the debounce and add an AbortController — cancel the previous fetch before starting the next.',
      'Here’s the idea: store the latest controller, abort it on each new keystroke, and ignore any AbortError you catch.',
      'You could also guard against stale responses by tagging each request with a sequence number and dropping older ones.',
      'For accessibility, announce result counts in an aria-live region so screen-reader users hear updates as you type.',
    ];
    let replyIndex = 0;

    composer.addEventListener('prompt-submit', (e) => {
      const text = (e.detail && e.detail.text || '').trim();
      if (!text) return;

      addMessage({ type: 'user', name: 'Will', message: text });

      // Show the "typing…" indicator briefly, then append a canned reply.
      typing.hidden = false;
      scrollToBottom();

      setTimeout(() => {
        typing.hidden = true;
        const reply = CANNED_REPLIES[replyIndex % CANNED_REPLIES.length];
        replyIndex += 1;
        addMessage({ type: 'assistant', name: 'Assistant', message: reply });
      }, 1100);
    });

    // Attach / lab buttons — demo stubs.
    composer.addEventListener('composer-attach', () => console.log('composer-attach'));
    composer.addEventListener('composer-lab', () => console.log('composer-lab'));

    // Start pinned to the newest message.
    scrollToBottom();
  </script>
</body>
</html>
