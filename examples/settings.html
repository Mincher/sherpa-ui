<!doctype html>
<html lang="en" data-theme="sherpa" data-mode="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings — Sherpa-UI example</title>

  <!-- Design tokens (light DOM → inherit into every shadow root). -->
  <link rel="stylesheet" href="../dist/styles/tokens/tokens.css" />

  <style>
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--sherpa-font-family-body, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
      background: var(--sherpa-theme-surface-default-1, #e8e8f6);
      color: var(--sherpa-theme-content-body-base, #0c0b11);
    }

    /* The settings view lives in the app-shell's default slot. */
    .settings {
      max-width: 760px;
      margin: 0 auto;
      padding: var(--sherpa-display-mode-space-2xl, 32px) var(--sherpa-display-mode-space-xl, 24px);
      display: flex;
      flex-direction: column;
      gap: var(--sherpa-display-mode-space-2xl, 32px);
    }

    /* One form section = a rounded card led by a section-header. */
    .section {
      background: var(--sherpa-theme-surface-default-base, #fff);
      border: 1px solid var(--sherpa-theme-border-default-2, #b3b3c3);
      border-radius: var(--sherpa-display-mode-border-rounding-lg, 12px);
      padding: var(--sherpa-display-mode-space-xl, 24px);
      display: flex;
      flex-direction: column;
      gap: var(--sherpa-display-mode-space-lg, 16px);
    }

    /* A labelled row of switches. */
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sherpa-display-mode-space-lg, 16px);
    }
    .switch-row .meta { display: flex; flex-direction: column; gap: 2px; }
    .switch-row .meta strong { font-weight: 600; font-size: 14px; }
    .switch-row .meta span {
      font-size: 13px;
      color: var(--sherpa-theme-content-body-1, #35353d);
    }

    .plan-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: var(--sherpa-display-mode-space-md, 12px);
    }
  </style>
</head>
<body>
  <!-- Markup is NOT hardcoded here — the bespoke view template is fetched from
       the template server (GET /template/view/settings) and injected below, so
       the example can't drift from the real components. -->
  <main id="view-root"></main>

  <script type="module">
    import '../dist/index.js';
    import { SherpaToast } from '../dist/index.js';

    // ── Fetch the bespoke per-view markup and inject it before wiring. ──
    const viewRoot = document.getElementById('view-root');
    viewRoot.innerHTML = await (await fetch('/template/view/settings')).text();

    await Promise.all([
      customElements.whenDefined('sherpa-app-shell'),
      customElements.whenDefined('sherpa-nav'),
      customElements.whenDefined('sherpa-app-header'),
      customElements.whenDefined('sherpa-select-group'),
      customElements.whenDefined('sherpa-slider'),
      customElements.whenDefined('sherpa-switch'),
      customElements.whenDefined('sherpa-toast'),
    ]);

    /* ── Populate the shell chrome ────────────────────────────────── */
    const nav = document.querySelector('sherpa-app-shell sherpa-nav');
    nav.populate({
      product: { name: 'Sherpa', icon: '🏔' },
      quickItems: [
        { id: 'home', label: 'Home', icon: '⌂', href: '#' },
        { id: 'search', label: 'Search', icon: '⌕', href: '#' },
      ],
      sections: [
        { label: 'Views', items: [
          { id: 'view-dashboard', label: 'Dashboard', icon: '▦', href: 'dashboard.html' },
          { id: 'view-records',   label: 'Records',   icon: '▤', href: 'records.html' },
          { id: 'view-settings',  label: 'Settings',  icon: '⚙', href: 'settings.html' },
          { id: 'view-chat',      label: 'Assistant', icon: '✳', href: 'chat.html' },
        ] },
        {
          label: 'Workspace',
          items: [
            { id: 'dashboard', label: 'Dashboard', icon: '▦', href: '#' },
            { id: 'projects', label: 'Projects', icon: '▤', href: '#', badge: '4' },
            { id: 'team', label: 'Team', icon: '👥', href: '#' },
          ],
        },
        {
          label: 'Account',
          items: [
            { id: 'settings', label: 'Settings', icon: '⚙', href: '#' },
            { id: 'billing', label: 'Billing', icon: '$', href: '#' },
          ],
        },
      ],
    });
    nav.setAttribute('data-active-id', 'view-settings');

    const header = document.querySelector('sherpa-app-shell sherpa-app-header');
    header.populate({
      breadcrumb: [
        { label: 'Account', href: '#' },
        { label: 'Settings' },
      ],
    });

    /* ── Populate the data-driven form controls ───────────────────── */
    document.getElementById('theme-group').populate([
      { value: 'light', label: 'Light', description: 'Bright, high-contrast surfaces.' },
      { value: 'dark',  label: 'Dark',  description: 'Dim surfaces for low light.' },
      { value: 'auto',  label: 'Auto',  description: 'Follow the operating system.' },
    ]);
    // Pre-select the current theme radio.
    document.getElementById('theme-group').value = 'light';

    document.getElementById('page-size').populate({ value: 30 });

    /* ── Wire interactivity ───────────────────────────────────────── */

    // Dark-mode switch → flip <html data-mode> live.
    const darkSwitch = document.getElementById('sw-dark');
    darkSwitch.addEventListener('change', (e) => {
      const dark = e.detail?.checked ?? darkSwitch.checked;
      document.documentElement.setAttribute('data-mode', dark ? 'dark' : 'light');
    });

    // Compact density switch → flip <html data-density> for a bonus live demo.
    document.getElementById('sw-compact').addEventListener('change', (e) => {
      const on = e.detail?.checked ?? false;
      if (on) document.documentElement.setAttribute('data-density', 'compact');
      else document.documentElement.removeAttribute('data-density');
    });

    // Theme radios → keep the picked theme in sync (demo only).
    document.getElementById('theme-group').addEventListener('change', (e) => {
      console.log('theme →', e.detail?.value);
    });

    // Cancel → info toast.
    document.getElementById('cancel-btn').addEventListener('click', () => {
      SherpaToast.info('No changes were saved.', { duration: 3000 });
    });

    // Save (form submit) → success toast summarising the form.
    const form = document.getElementById('settings-form');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const theme = document.getElementById('theme-group').value ?? 'light';
      const perPage = document.getElementById('page-size').value ?? '30';
      const features = document.getElementById('features').value ?? [];
      SherpaToast.success('Settings saved', {
        duration: 4000,
      });
      console.log('saved →', { theme, perPage, features });
    });
  </script>
</body>
</html>
