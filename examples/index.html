<!doctype html>
<html lang="en" data-theme="sherpa" data-mode="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sherpa-UI — example app</title>

  <!-- Design tokens (light DOM → inherit into every shadow root). -->
  <link rel="stylesheet" href="../dist/styles/tokens/tokens.css" />

  <style>
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--sherpa-font-family-body, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
      color: var(--sherpa-theme-content-body-base, #0c0b11);
      background: var(--sherpa-theme-surface-default-1, #e8e8f6);
    }

    /* The single app-shell fills the viewport. */
    #view-root, sherpa-app-shell { height: 100%; }

    /* ── Shared surface card used by dashboard + records. ─────────── */
    /* A panel mirrors sherpa-container's own box, so the example does not invent
       its own chrome: the SAME surface, the SAME 0.5px style-border/base ring and
       the SAME structure rounding. It was a hardcoded `1px solid` at 16px radius
       — double the token width and four times its radius. */
    .panel {
      background: var(--sherpa-style-surface-base, #fff);
      border: var(--sherpa-style-border-width, 0.5px) solid
        var(--sherpa-style-border-base, #b3b3c3);
      border-radius: var(--sherpa-structure-rounding-top-left, 4px);
      padding: var(--sherpa-display-mode-space-lg, 20px);
      display: flex;
      flex-direction: column;
      gap: var(--sherpa-display-mode-space-base, 16px);
      min-width: 0;
    }
    /* Panel titles are sherpa-container-header now, not bare <h3>s, so the type
       scale, spacing and action slots come from the component rather than from
       three hand-written declarations here. The header supplies its own padding,
       so it bleeds to the panel's edges instead of sitting inside its inset. */
    .panel > sherpa-container-header {
      margin: calc(-1 * var(--sherpa-display-mode-space-lg, 20px));
      margin-block-end: 0;
    }

    /* A panel sized in LAYOUT GRID ROWS. The grid's row height is a projected
       layout token (--sherpa-layout-grid-row-height, 64px at desktop), so a panel
       spanning N rows is N of those plus the vertical gutters between them.

       This is what stops the data-grid panel growing with its row count: the panel
       is a fixed height and the grid SCROLLS inside it, so the pager stays put and
       "rows per page = 50" no longer pushes the page metres long. */
    .panel[data-rows] {
      block-size: calc(
        var(--_rows, 6) * var(--sherpa-layout-grid-row-height, 64px)
        + (var(--_rows, 6) - 1) * var(--sherpa-layout-grid-gap-vertical, 16px)
      );
    }
    .panel[data-rows="4"] { --_rows: 4; }
    .panel[data-rows="6"] { --_rows: 6; }
    .panel[data-rows="8"] { --_rows: 8; }
    /* ONE child may grow to fill the panel; everything else keeps its natural
       height. `min-height: 0` is what lets it shrink below its content so its own
       scroll box (a grid) or its own ratio grid (a chart area) takes over.

       Both names are listed because the growing child differs by panel: a data
       panel grows its grid, a chart panel grows its chart area. */
    .panel[data-rows] > :is(sherpa-data-grid, .chart-area) {
      flex: 1 1 auto;
      min-height: 0;
    }
    .panel[data-rows] > :not(sherpa-data-grid, .chart-area) { flex: 0 0 auto; }

    /* ── Chart panels: the CONTENT area is a ratio grid ───────────────
       Not the dashboard's own card grid (that is .sherpa-grid below) — this is
       the split INSIDE one container, between the chart and the thing beside
       or below it.

       The ratio follows the LEGEND'S ORIENTATION, because that is what decides
       whether the pair reads as two columns or two rows — and the two constrain
       different things:

         legend BELOW  the chart (horizontal) → 2 rows,    80/20
         legend BESIDE the chart (vertical)   → 2 columns, 70/30

       with the CHART in the larger cell either way. A legend below runs the full
       width and needs only height; one beside the chart has to fit its longest
       label into its own column, so it gets a little more.

       `data-chart` is an opt-in: a panel holding a data grid or a key-value list
       has no chart to give the larger share to, and silently splitting it would
       be wrong.

       The donut is NOT in this rule. Its legend is a real `slot="legend"`, so it
       is a CHILD of the chart rather than a sibling, and sherpa-donut-chart owns
       that 60/40 internally. Two layouts competing for the same pair was the
       trap the handover flagged; the split lives with whoever actually contains
       both items.

       `minmax(0, Nfr)` rather than a bare `fr`: a bare fr floors at the item's
       min-content size, so a wide chart or a long legend label would push its
       track past its share and quietly break the ratio.

       Both cells CENTRE their content in both axes (`place-items: center`), so a
       chart narrower than its cell sits in the middle of it rather than against
       the inline-start edge. */
    .panel[data-chart] {
      /* The chart area is the row that GROWS; the header and anything else keep
         their natural height. */
      display: flex;
      flex-direction: column;
    }
    .panel[data-chart] > .chart-area {
      display: grid;
      place-items: center;
      gap: var(--sherpa-display-mode-space-base, 16px);
      flex: 1 1 auto;
      min-block-size: 0;
      min-inline-size: 0;
    }
    /* Legend BELOW → 2 rows, 80/20, chart in the tall cell. */
    .panel[data-chart="stacked"] > .chart-area {
      grid-template-rows: minmax(0, 4fr) minmax(0, 1fr);
    }
    /* Legend BESIDE → 2 columns, 70/30, chart in the wide cell.
       A HORIZONTAL split gives the legend more than a vertical one (80/20),
       because the two constrain different things: a legend below the chart runs
       the full width and needs only height, where one beside it has to fit its
       longest label into its own column.
       Both tracks floor at 0, so the ratio ALWAYS holds: a legend label that does
       not fit truncates rather than stealing the chart's share. */
    .panel[data-chart="split"] > .chart-area {
      grid-template-columns: minmax(0, 7fr) minmax(0, 3fr);
    }
    /* SLOTTED: the chart contains its own legend and owns the split itself (the
       donut). One cell, and the chart fills it — the ratio is the component's
       business, the filling is the panel's. */
    .panel[data-chart="slotted"] > .chart-area {
      grid-template-columns: minmax(0, 1fr);
    }
    /* A chart fills the cell it was given; the legend keeps its natural size and
       is centred in its own. Without this the chart hugged its content and the
       ratio bought nothing. */
    .panel[data-chart] > .chart-area > :first-child {
      inline-size: 100%;
      block-size: 100%;
      min-inline-size: 0;
      min-block-size: 0;
    }

    /* The pager fills the panel and carries its own Figma padding (8 × 12), so its
       controls sit 12px in from the grid's edges — which is the design. */

    /* ── Views sit on the design system's LAYOUT GRID ─────────────────
       `.sherpa-grid` (from @layer layout in tokens.css) is the projected track
       system: 4 columns on mobile, 8 from 768px, 12 from 1280px, with the
       gutters, padding and max width that come with each breakpoint.

       These views previously used `repeat(auto-fit, minmax(220px, 1fr))`, which
       ignores all of that — the column count came from an arbitrary pixel
       minimum rather than the grid, so nothing lined up between rows or between
       views, and a Figma column span could not be expressed at all.

       Children claim tracks with data-span, which the utility clamps to the
       current breakpoint's column count, so a 6-span wraps on mobile rather
       than overflowing. */
    .view {
      display: flex;
      flex-direction: column;
      gap: var(--sherpa-display-mode-space-xl, 24px);
      /* The grid rows own their own padding and max width, so the view itself
         only supplies the vertical rhythm between them. */
    }
    sherpa-barchart, sherpa-line-chart { min-height: 220px; }
    sherpa-donut-chart, sherpa-gauge-chart { min-height: 200px; }
    .summary {
      max-width: 1400px;
      padding: 0 var(--sherpa-display-mode-space-xl, 24px) var(--sherpa-display-mode-space-xl, 24px);
    }

    /* ── Records view: dialog form + toast region. ────────────────── */
    .form {
      display: flex;
      flex-direction: column;
      gap: var(--sherpa-display-mode-space-base, 12px);
      min-width: 380px;
    }
    .dialog-footer {
      display: flex;
      justify-content: flex-end;
      gap: var(--sherpa-display-mode-space-sm, 8px);
    }
    .toast-region {
      position: fixed;
      right: var(--sherpa-display-mode-space-lg, 16px);
      bottom: var(--sherpa-display-mode-space-lg, 16px);
      display: flex;
      flex-direction: column;
      gap: var(--sherpa-display-mode-space-sm, 8px);
      z-index: 1000;
    }

    /* ── Settings view ────────────────────────────────────────────── */
    /* Settings is a single reading column ON the grid: 8 of 12 on desktop rather
       than a hardcoded 760px, so its measure comes from the same track system as
       every other view and it re-flows at the breakpoints for free. */
    .settings {
      display: flex;
      flex-direction: column;
      gap: var(--sherpa-display-mode-space-2xl, 32px);
    }
    /* Same as .panel — the container's own box, not a hand-rolled one. */
    .section {
      background: var(--sherpa-style-surface-base, #fff);
      border: var(--sherpa-style-border-width, 0.5px) solid
        var(--sherpa-style-border-base, #b3b3c3);
      border-radius: var(--sherpa-structure-rounding-top-left, 4px);
      padding: var(--sherpa-display-mode-space-xl, 24px);
      display: flex;
      flex-direction: column;
      gap: var(--sherpa-display-mode-space-lg, 16px);
    }
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sherpa-display-mode-space-lg, 16px);
    }
    .switch-row .meta { display: flex; flex-direction: column; gap: 2px; }
    .switch-row .meta strong { font-weight: 600; font-size: 14px; }
    .switch-row .meta span {
      font-size: 13px;
      color: var(--sherpa-theme-content-body-1, #35353d);
    }
    .plan-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: var(--sherpa-display-mode-space-md, 12px);
    }

    /* ── Chat view: scrolling thread over a pinned composer. ──────── */
    .chat {
      display: grid;
      grid-template-rows: 1fr auto;
      height: 100%;
      min-height: 0;
      background: var(--sherpa-theme-surface-default-base, #fff);
    }
    .thread {
      overflow-y: auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: var(--sherpa-display-mode-space-lg, 16px);
      padding: var(--sherpa-display-mode-space-2xl, 24px);
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }
    .typing[hidden] { display: none; }
    .composer-dock {
      /* The dock's rule is a DIVIDER, so it takes the lighter border/default/+1
         at the 0.5px token width — same as sherpa-container's internal dividers. */
      border-block-start: var(--sherpa-style-border-width, 0.5px) solid
        var(--sherpa-theme-border-default-1, #e8e8f6);
      padding: var(--sherpa-display-mode-space-lg, 16px) var(--sherpa-display-mode-space-2xl, 24px);
      background: var(--sherpa-theme-surface-default-base, #fff);
    }
    .composer-inner { max-width: 920px; margin: 0 auto; }
  </style>
</head>
<body>
  <!-- ── The app-shell + nav + header live ONCE. Only the content swaps. ── -->
  <sherpa-app-shell>
    <sherpa-nav slot="nav"></sherpa-nav>

    <!-- Every header action is opt-in, so a product shows only what it wires. -->
    <sherpa-app-header slot="header"
                       data-heading="Dashboard"
                       data-icon="fa-solid fa-gauge-high"
                       data-back data-ai data-chat data-labs data-theme-toggle
                       data-account data-help data-menu data-favorite-action
                       data-notifications="4">
      <!-- app-header.populate() stamps into these empty children by slot name. -->
      <sherpa-breadcrumbs slot="breadcrumbs"></sherpa-breadcrumbs>
      <!-- data-type="view": the VIEW-level toolbar, so its action cluster gains
           the snapped [star | Save | caret] group. The records view's own
           toolbar is data type, and shows the cluster without it. -->
      <sherpa-quick-filter-toolbar slot="filters" data-type="view"></sherpa-quick-filter-toolbar>
    </sherpa-app-header>

    <!-- The per-view content is fetched + injected here by the router. -->
    <main id="view-root"></main>
  </sherpa-app-shell>

  <script type="module">
    import { installIcons } from '../dist/index.js';

    // Font Awesome must be in the DOCUMENT too, not just adopted into shadow roots:
    // the class rules reach shadow DOM via sharedStyles, but the @font-face — and any
    // light-DOM <i class="fa-…"> — need the stylesheet in <head>.
    installIcons();

    // Sentinel to prove hot-swaps stay in the SAME document (never a full reload).
    window.__sherpaAppBooted = (window.__sherpaAppBooted ?? 0) + 1;

    const VIEWS = ['dashboard', 'records', 'settings', 'chat'];
    const DEFAULT_VIEW = 'dashboard';

    const viewRoot = document.getElementById('view-root');
    const nav = document.querySelector('sherpa-app-shell sherpa-nav');

    // ── Shared nav config: the "Views" section links the 4 views. ──────
    // Icons are Font Awesome class lists (Sherpa's icon system) — never unicode
    // glyphs, which render at the wrong size and weight.
    // quickItems is left OUT so the rail shows its Figma default trio:
    // Home · Recent · Favorites.
    const navConfig = {
      product: { name: 'N-central', icon: 'fa-solid fa-cubes' },
      sections: [
        { label: 'Views', items: [
          { id: 'view-dashboard', label: 'Dashboard', icon: 'fa-solid fa-gauge-high', href: '?view=dashboard' },
          { id: 'view-records',   label: 'Records',   icon: 'fa-solid fa-table-list',  href: '?view=records' },
          { id: 'view-chat',      label: 'Assistant', icon: 'fa-solid fa-comments',    href: '?view=chat' },
        ] },
        // Nested rows use `children`, so the rail owns the depth: a parent gets the
        // Figma hasChildren chevron and starts CLOSED, its children indent to the
        // next tier and carry NO icon (the indent is what marks them as children),
        // and the whole subtree disappears in the 40px collapsed rail.
        { label: 'Monitor', items: [
          { id: 'endpoints', label: 'Endpoints', icon: 'fa-solid fa-desktop', href: '#endpoints', badge: '1284',
            children: [
              { id: 'endpoints-servers',  label: 'Servers',  href: '#endpoints-servers' },
              { id: 'endpoints-desktops', label: 'Desktops', href: '#endpoints-desktops',
                children: [
                  { id: 'endpoints-laptops', label: 'Laptops', href: '#endpoints-laptops' },
                ] },
            ] },
          { id: 'alerts', label: 'Alerts', icon: 'fa-solid fa-triangle-exclamation', href: '#alerts', badge: '37',
            // One parent starts OPEN so the nesting is visible without a click.
            expanded: true,
            children: [
              { id: 'alerts-open',     label: 'Open',     href: '#alerts-open', badge: '12' },
              { id: 'alerts-resolved', label: 'Resolved', href: '#alerts-resolved' },
            ] },
          { id: 'health', label: 'Health', icon: 'fa-solid fa-heart-pulse', href: '#health', indicator: true },
        ] },
        { label: 'Manage', items: [
          { id: 'patches', label: 'Patching', icon: 'fa-solid fa-screwdriver-wrench', href: '#patches',
            children: [
              { id: 'patch-approve', label: 'Approvals', href: '#patch-approve' },
              { id: 'patch-history', label: 'History',   href: '#patch-history',
                children: [
                  { id: 'patch-history-2024', label: '2024', href: '#patch-history-2024' },
                ] },
            ] },
          { id: 'backups',    label: 'Backups',    icon: 'fa-solid fa-database', href: '#backups' },
          { id: 'automation', label: 'Automation', icon: 'fa-solid fa-bolt', href: '#automation' },
        ] },
        { label: 'Admin', items: [
          { id: 'reports', label: 'Reports',  icon: 'fa-solid fa-chart-column', href: '#reports' },
          { id: 'users',   label: 'Users',    icon: 'fa-solid fa-users', href: '#users' },
        ] },
      ],
      // SETTINGS mode — the settings BUTTON in the nav header swaps the rail to
      // these pages. Settings is a place of its own, not a row in the product tree.
      settingsSections: [
        { label: 'Account', items: [
          { id: 'view-settings',   label: 'Preferences',  icon: 'fa-solid fa-sliders', href: '?view=settings' },
          { id: 'set-profile',     label: 'Profile',      icon: 'fa-solid fa-id-badge', href: '#set-profile' },
          { id: 'set-security',    label: 'Security',     icon: 'fa-solid fa-shield-halved', href: '#set-security',
            children: [
              { id: 'set-sessions', label: 'Sessions', href: '#set-sessions' },
              { id: 'set-api-keys', label: 'API keys', href: '#set-api-keys' },
            ] },
        ] },
        { label: 'Organisation', items: [
          { id: 'set-org',         label: 'Organisation', icon: 'fa-solid fa-building', href: '#set-org' },
          { id: 'set-members',     label: 'Members',      icon: 'fa-solid fa-user-group', href: '#set-members', badge: '48',
            children: [
              { id: 'set-roles', label: 'Roles', href: '#set-roles' },
            ] },
          { id: 'set-billing',     label: 'Billing',      icon: 'fa-solid fa-credit-card', href: '#set-billing' },
        ] },
        { label: 'Platform', items: [
          { id: 'set-integrations', label: 'Integrations', icon: 'fa-solid fa-plug', href: '#set-integrations' },
          { id: 'set-notifications', label: 'Notifications', icon: 'fa-solid fa-bell', href: '#set-notifications' },
          { id: 'set-audit',       label: 'Audit log',    icon: 'fa-solid fa-clipboard-list', href: '#set-audit' },
        ] },
      ],
    };

    // Which nav id maps to which view, and back.
    const idForView  = (v) => `view-${v}`;
    const viewForId  = (id) => (id?.startsWith('view-') ? id.slice('view-'.length) : null);

    // Read the current view from the URL (?view=<v>), defaulting to dashboard.
    const viewFromURL = () => {
      const v = new URL(location.href).searchParams.get('view');
      return VIEWS.includes(v) ? v : DEFAULT_VIEW;
    };

    // Guard against races: only the newest load may commit.
    let loadToken = 0;
    let cleanup = null;   // teardown returned by the current view's init()

    async function loadView(name) {
      const token = ++loadToken;

      // Tear down the previous view (e.g. chat's data-no-header).
      if (typeof cleanup === 'function') { try { cleanup(); } catch { /* noop */ } cleanup = null; }

      // Keep the nav active-state synced to the current view.
      nav.dataset.activeId = idForView(name);

      // The settings view lives behind the nav header's settings button, so landing
      // on it (or leaving it) switches the rail's mode — which swaps the whole
      // section list to the settings pages.
      const wantsSettings = name === 'settings';
      const inSettings = nav.dataset.navState === 'settings';
      if (wantsSettings !== inSettings) {
        nav.dataset.navState = wantsSettings ? 'settings' : 'collapsed';
        nav.dispatchEvent(new CustomEvent('nav-state-change', {
          detail: { state: nav.dataset.navState }, bubbles: true, composed: true,
        }));
      }

      // 1) Fetch the bespoke content-only markup for the view.
      const markup = await (await fetch(`/template/view/${name}`)).text();
      if (token !== loadToken) return;   // a newer navigation superseded us

      // 2) Inject into the app-shell content slot.
      viewRoot.innerHTML = markup;

      // 3) Wait for the shell chrome to define, then import + run the view module.
      await customElements.whenDefined('sherpa-app-shell');
      if (token !== loadToken) return;

      const mod = await import(`./views/${name}.js`);
      if (token !== loadToken) return;

      cleanup = await mod.init(viewRoot);
    }

    // ── Populate the shared nav once. ──────────────────────────────────
    await customElements.whenDefined('sherpa-nav');
    nav.populate(navConfig);

    // The Views nav rows render as real <a href="?view=…"> links (right-clickable,
    // deep-linkable). Intercept the click so we swap in-page instead of a full
    // reload — preventDefault must happen on the real click event, not on the
    // synthetic nav-select. A modified click (new tab / middle) is left alone.
    nav.addEventListener('click', (e) => {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      const row = e.composedPath().find((n) => n.dataset && n.dataset.id?.startsWith('view-'));
      if (!row) return;
      const view = viewForId(row.dataset.id);
      if (!VIEWS.includes(view)) return;
      e.preventDefault();
      if (view === viewFromURL() && viewRoot.children.length) return;
      history.pushState({ view }, '', `?view=${view}`);
      loadView(view);
    });

    // Back/forward → load without pushing.
    window.addEventListener('popstate', () => loadView(viewFromURL()));

    // First paint: load the view named in the URL.
    loadView(viewFromURL());
  </script>
</body>
</html>
