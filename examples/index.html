<!doctype html>
<html lang="en" data-theme="sherpa" data-mode="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sherpa-UI — example app</title>

  <!-- Design tokens (light DOM → inherit into every shadow root). -->
  <link rel="stylesheet" href="../dist/styles/tokens/tokens.css" />

</head>
<body>
  <!-- ── The app-shell + nav + header live ONCE. Only the content swaps. ── -->
  <sherpa-app-shell>
    <sherpa-nav slot="nav"></sherpa-nav>

    <!-- Every header action is opt-in, so a product shows only what it wires. -->
    <sherpa-app-header slot="header"
                       data-heading="Dashboard"
                       data-icon="fa-solid fa-gauge-high"
                       data-back data-ai data-labs data-theme-toggle
                       data-account data-help data-menu
                       data-notifications="4">
      <!-- app-header.populate() stamps into these empty children by slot name. -->
      <sherpa-breadcrumbs slot="breadcrumbs"></sherpa-breadcrumbs>
      <!-- data-type="view": the VIEW-level toolbar, so its action cluster gains
           the snapped [star | Save | caret] group. The records view's own
           toolbar is data type, and shows the cluster without it. -->
      <sherpa-quick-filter-toolbar slot="filters" data-type="view"></sherpa-quick-filter-toolbar>
    </sherpa-app-header>

    <!-- The per-view content is fetched + injected here by the router. -->
    <main id="view-root"></main>
  </sherpa-app-shell>

  <!-- The ASSISTANT, as a right-pinned overlay over the content.

       sherpa-overlay-panel is already a right-hand floating panel — a <dialog>
       opened with show() (not showModal()), so the page behind stays live and a
       person can keep working while it is open. That is what makes it the right
       home for an assistant, and it is why the Assistant NAV ITEM is gone: a
       whole page you have to navigate away to reach cannot answer a question
       about the page you left.

       It lives OUTSIDE the app-shell so a view swap cannot take it with it, and
       its content is fetched from the same chat template the view used, so the
       two can never drift apart. -->
  <sherpa-overlay-panel id="assistant"
                        data-title="Assistant"
                        data-icon="fa-solid fa-wand-magic-sparkles"
                        data-dismissible></sherpa-overlay-panel>

  <script type="module">
    import { installIcons } from '../dist/index.js';

    // Font Awesome must be in the DOCUMENT too, not just adopted into shadow roots:
    // the class rules reach shadow DOM via sharedStyles, but the @font-face — and any
    // light-DOM <i class="fa-…"> — need the stylesheet in <head>.
    installIcons();

    // Sentinel to prove hot-swaps stay in the SAME document (never a full reload).
    window.__sherpaAppBooted = (window.__sherpaAppBooted ?? 0) + 1;

    const VIEWS = ['dashboard', 'records', 'settings', 'chat'];
    const DEFAULT_VIEW = 'dashboard';

    const viewRoot = document.getElementById('view-root');
    const nav = document.querySelector('sherpa-app-shell sherpa-nav');

    // ── Shared nav config: the "Views" section links the 4 views. ──────
    // Icons are Font Awesome class lists (Sherpa's icon system) — never unicode
    // glyphs, which render at the wrong size and weight.
    // quickItems is left OUT so the rail shows its Figma default trio:
    // Home · Recent · Favorites.
    //
    // EVERY ROW LINKS TO A REAL PAGE. The rail used to carry a fuller tree —
    // Monitor / Manage / Admin, nested children, badges — to exercise the nav
    // component, but those rows pointed at `#anchor` hrefs with nothing behind
    // them. A demo that navigates nowhere teaches the wrong thing about the
    // component; the nav's own tests cover nesting, badges and indicators.
    const navConfig = {
      product: { name: 'N-central', icon: 'fa-solid fa-cubes' },
      sections: [
        { label: 'Views', items: [
          { id: 'view-dashboard', label: 'Dashboard', icon: 'fa-solid fa-gauge-high', href: '?view=dashboard' },
          { id: 'view-records',   label: 'Records',   icon: 'fa-solid fa-table-list',  href: '?view=records' },
        ] },
      ],
      // SETTINGS mode — the settings BUTTON in the nav header swaps the rail to
      // these pages. Settings is a place of its own, not a row in the product tree.
      settingsSections: [
        { label: 'Account', items: [
          { id: 'view-settings', label: 'Preferences', icon: 'fa-solid fa-sliders', href: '?view=settings' },
        ] },
      ],
    };

    // Which nav id maps to which view, and back.
    const idForView  = (v) => `view-${v}`;
    const viewForId  = (id) => (id?.startsWith('view-') ? id.slice('view-'.length) : null);

    // Read the current view from the URL (?view=<v>), defaulting to dashboard.
    const viewFromURL = () => {
      const v = new URL(location.href).searchParams.get('view');
      return VIEWS.includes(v) ? v : DEFAULT_VIEW;
    };

    // Guard against races: only the newest load may commit.
    let loadToken = 0;
    let cleanup = null;   // teardown returned by the current view's init()

    async function loadView(name) {
      const token = ++loadToken;

      // Tear down the previous view (e.g. chat's data-no-header).
      if (typeof cleanup === 'function') { try { cleanup(); } catch { /* noop */ } cleanup = null; }

      // Keep the nav active-state synced to the current view.
      nav.dataset.activeId = idForView(name);

      // The settings view lives behind the nav header's settings button, so landing
      // on it (or leaving it) switches the rail's mode — which swaps the whole
      // section list to the settings pages.
      const wantsSettings = name === 'settings';
      const inSettings = nav.dataset.navState === 'settings';
      if (wantsSettings !== inSettings) {
        nav.dataset.navState = wantsSettings ? 'settings' : 'collapsed';
        nav.dispatchEvent(new CustomEvent('nav-state-change', {
          detail: { state: nav.dataset.navState }, bubbles: true, composed: true,
        }));
      }

      // 1) Fetch the bespoke content-only markup for the view.
      const markup = await (await fetch(`/template/view/${name}`)).text();
      if (token !== loadToken) return;   // a newer navigation superseded us

      // 2) Inject into the app-shell content slot.
      viewRoot.innerHTML = markup;

      // 3) Wait for the shell chrome to define, then import + run the view module.
      await customElements.whenDefined('sherpa-app-shell');
      if (token !== loadToken) return;

      const mod = await import(`./views/${name}.js`);
      if (token !== loadToken) return;

      cleanup = await mod.init(viewRoot);
    }

    // ── Populate the shared nav once. ──────────────────────────────────
    await customElements.whenDefined('sherpa-nav');
    nav.populate(navConfig);

    // The Views nav rows render as real <a href="?view=…"> links (right-clickable,
    // deep-linkable). Intercept the click so we swap in-page instead of a full
    // reload — preventDefault must happen on the real click event, not on the
    // synthetic nav-select. A modified click (new tab / middle) is left alone.
    nav.addEventListener('click', (e) => {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      const row = e.composedPath().find((n) => n.dataset && n.dataset.id?.startsWith('view-'));
      if (!row) return;
      const view = viewForId(row.dataset.id);
      if (!VIEWS.includes(view)) return;
      e.preventDefault();
      if (view === viewFromURL() && viewRoot.children.length) return;
      history.pushState({ view }, '', `?view=${view}`);
      loadView(view);
    });

    // A BREADCRUMB click swaps in-page too. The header fires breadcrumb-click
    // with the crumb's href, so the same `?view=` hrefs the nav uses work here
    // without the page reloading. A crumb with no href is the current page and
    // carries no link at all.
    document.addEventListener('breadcrumb-click', (e) => {
      const href = e.detail?.href;
      if (!href?.startsWith('?view=')) return;
      const view = new URLSearchParams(href.slice(1)).get('view');
      if (!VIEWS.includes(view)) return;
      if (view === viewFromURL() && viewRoot.children.length) return;
      history.pushState({ view }, '', `?view=${view}`);
      loadView(view);
    });

    /* The moon button flips light ↔ dark.
       The header already FIRES theme-toggle; nothing was listening, so the button
       did nothing. The whole switch is one attribute on <html>: the display-mode
       layer owns light/dark and re-points every semantic token from there, so no
       component knows a mode exists.

       The choice is remembered in localStorage — a theme a user has to re-pick on
       every page load is not a preference. Wrapped, because storage throws in a
       private window and a failed WRITE must not stop the theme changing. */
    const MODE_KEY = 'sherpa-examples-mode';
    /* The button shows what you will GET, not what you have: a moon offers dark,
       a sun offers light. `data-mode` lives on <html>, which CSS inside the
       header's shadow root cannot select, so the glyph is set from here. */
    const syncModeIcon = (mode) => {
      const btn = document.querySelector('sherpa-app-header')?.shadowRoot
        ?.querySelector('.theme-toggle');
      btn?.setAttribute('data-icon-start',
        mode === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon');
      btn?.setAttribute('aria-label',
        mode === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    };
    const setMode = (mode) => {
      document.documentElement.dataset.mode = mode;
      syncModeIcon(mode);
      try { localStorage.setItem(MODE_KEY, mode); } catch { /* storage unavailable */ }
    };
    try {
      const saved = localStorage.getItem(MODE_KEY);
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.mode = saved;
    } catch { /* storage unavailable — the markup's own data-mode stands */ }
    // The header defines asynchronously, so the first sync waits for it.
    void customElements.whenDefined('sherpa-app-header')
      .then(() => syncModeIcon(document.documentElement.dataset.mode));

    /* Ask N-zo opens the assistant panel.
       Its markup is the CHAT template, fetched on first open and kept — a person
       re-opening the panel should find the thread they left, not a blank one. The
       chat module is imported once too, so the composer is wired the same way it
       is in the full-page view. */
    const assistant = document.getElementById('assistant');
    let assistantReady = null;
    document.addEventListener('ai-click', () => {
      assistantReady ??= (async () => {
        assistant.innerHTML = await (await fetch('/template/view/chat')).text();
        /* The chat card is sized in LAYOUT-GRID ROWS for its full-page form
           (data-rows="12"), which is a fixed height — inside a panel that made it
           944px tall in a 648px region and pushed the composer off the bottom.
           In here the panel's own grid row supplies the height, so the fixed one
           is dropped and the card fills what it is given. */
        assistant.querySelector('sherpa-container')?.removeAttribute('data-rows');
        await customElements.whenDefined('sherpa-overlay-panel');
        const mod = await import('./views/chat.js');
        // The chat view hides the app header for its full-page form; inside a
        // panel the header must stay, so its shell tweak is undone straight away.
        const cleanup = await mod.init(assistant);
        cleanup?.();
      })();
      void assistantReady.then(() => assistant.show());
    });

    document.addEventListener('theme-toggle', () => {
      setMode(document.documentElement.dataset.mode === 'dark' ? 'light' : 'dark');
    });

    // Back/forward → load without pushing.
    window.addEventListener('popstate', () => loadView(viewFromURL()));

    // First paint: load the view named in the URL.
    loadView(viewFromURL());
  </script>
</body>
</html>
