<!doctype html>
<html lang="en" data-theme="sherpa" data-mode="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sherpa-UI — example app</title>

  <!-- Design tokens in the light DOM, so they inherit into every shadow root. -->
  <link rel="stylesheet" href="../dist/styles/tokens/tokens.css" />

</head>
<body>
  <!-- THE PROVIDER: every component in the app asks it for its data, and each
       Context gives it that Context's source. docs/PROVIDER-DESIGN.md -->
  <!-- THE URL HAS ONE OWNER. A nav row, a crumb, the View chip and Back all
       REQUEST a navigation; this intercepts it and reports what changed.
       Settings opens OVER a Context, so a Settings link keeps the Context.
       TRAP T-the-router-owns-the-url -->
  <sherpa-router data-params="context=dashboard view" data-overlay="settings"></sherpa-router>
  <sherpa-provider>
  <!-- The app-shell + nav + header live ONCE. Only the content swaps. -->
  <sherpa-app-shell>
    <sherpa-nav slot="nav"></sherpa-nav>

    <!-- No data-heading / data-icon: the script copies them from the selected
         nav row on every Context load, so one hard-coded here would go stale. -->
    <sherpa-app-header slot="header"
                       data-ai data-labs data-theme-toggle
                       data-account data-help data-menu
                       data-notifications="4">
      <!-- app-header.populate() stamps into these empty children by slot name. -->
      <sherpa-breadcrumbs slot="breadcrumbs"></sherpa-breadcrumbs>
      <!-- data-type="view" gives the action cluster the snapped
           [star | Save | caret] group; the records Context's toolbar is data type.
           data-reset-on-populate: these filters belong to the CONTEXT, so the last
           Context's picks must not carry into the next. -->
      <!-- data-locked: the ★ is a REQUEST here. The favourites list lives in the
           session store and paints the nav rail, so the app answers by setting
           data-favourite back. TRAP T-the-star-reports-it-does-not-decide -->
      <sherpa-quick-filter-toolbar slot="filters" data-type="view" data-scope="view" data-locked
                                   data-reset-on-populate></sherpa-quick-filter-toolbar>
    </sherpa-app-header>

    <!-- The per-Context content is fetched + injected here by the router.

         `block-size: 100%` PASSES THE SHELL'S HEIGHT THROUGH. Without it a
         `data-rows="fit"` grid has nothing to measure against: `100%` needs an
         unbroken chain of sized ancestors, and this wrapper broke it — the
         grid resolved against its own 1809px content instead of the 900px
         area. A scrolling Context is unaffected; it overflows this box exactly as
         it overflowed the shell. TRAP T-a-fit-grid-needs-a-sized-parent -->
    <!-- THE FILTER PANEL, in the shell's own leading panel area. It lives
         here rather than in a Context template because it belongs to the app
         chrome: it survives a Context change, and the shell owns where a panel
         sits beside the content. Its Context fills it.
         TRAP T-the-shell-owns-the-panel-areas -->
    <sherpa-filter-panel slot="panel-start" id="filter-panel" data-scope="view data"
                         data-heading="Filters"></sherpa-filter-panel>

    <main id="context-root" style="min-block-size: 0"></main>

    <!-- Settings covers the header and content, beside the rail. The Context
         under it is never reloaded, so closing it puts the reader back. -->
    <sherpa-dialog slot="overlay" id="settings" data-type="overlay">
      <sherpa-app-header slot="header" data-back>
        <!-- A Settings Context is ONE page; this scrolls to one of its sections.
             Filled by contexts/settings.js from the page's section headers. -->
        <sherpa-quick-filter slot="filters" data-type="jump" data-label="Jump to"
                             data-icon-start="list" data-menu>
          <sherpa-menu slot="menu"></sherpa-menu>
        </sherpa-quick-filter>
      </sherpa-app-header>
      <!-- Sized, so a page with a footer can hold it at the bottom of the area. -->
      <div id="settings-root" style="block-size: 100%"></div>
    </sherpa-dialog>
  </sherpa-app-shell>
  </sherpa-provider>

  <!-- Outside the app shell on purpose: the menu is a popover in the top layer,
       and every header slot is NAMED, so an unslotted child there gets no
       layout at all. Fed by a DataSource below, so list and badge are two readings
       of one set. -->
  <sherpa-notifications id="notifications"></sherpa-notifications>

  <!-- SAVE VIEW, for every page: a name, and a confirm to save over or delete
       the reader's own View. TODO 15. TRAP T-a-saved-view-is-the-readers-own -->
  <sherpa-dialog id="view-name" data-heading="Save view as">
    <sherpa-input-text data-label="Name" placeholder="My view" autocomplete="off" required></sherpa-input-text>
    <sherpa-container-footer slot="footer">
      <sherpa-button>Cancel</sherpa-button>
      <sherpa-button data-look="saturated">Save</sherpa-button>
    </sherpa-container-footer>
  </sherpa-dialog>
  <sherpa-dialog id="view-confirm">
    <!-- Margin zeroed inline: the dialog body brings its own padding. -->
    <p style="margin: 0"></p>
    <sherpa-container-footer slot="footer">
      <sherpa-button>Cancel</sherpa-button>
      <sherpa-button data-look="saturated"></sherpa-button>
    </sherpa-container-footer>
  </sherpa-dialog>
  <!-- RESET ALL TO DEFAULT asks first, and can keep what is on screen under a
       name before it goes. TODO 129. TRAP T-reset-to-default-is-the-views-own -->
  <sherpa-dialog id="reset-confirm" data-heading="Reset all to default?">
    <sherpa-stack>
      <p style="margin: 0">This resets every filter, in every scope, to the View's default.</p>
      <sherpa-list>
        <sherpa-list-item data-label="Save filters before reset"
                          data-description="Keep the filters on screen as a saved View.">
          <sherpa-switch slot="trailing" id="reset-save"></sherpa-switch>
        </sherpa-list-item>
      </sherpa-list>
      <sherpa-input-text data-label="Name" placeholder="My filters" autocomplete="off" hidden></sherpa-input-text>
    </sherpa-stack>
    <sherpa-container-footer slot="footer">
      <sherpa-button>Cancel</sherpa-button>
      <sherpa-button data-look="saturated">Reset all</sherpa-button>
    </sherpa-container-footer>
  </sherpa-dialog>

  <!-- The assistant: sherpa-overlay-panel is a <dialog> opened with show(), not
       showModal(), so the page behind stays live. Outside the app-shell so a
       Context swap cannot take it, and its content is the same chat template the
       full-page Context uses. -->
  <sherpa-overlay-panel id="assistant"
                        data-heading="Assistant"
                        data-icon="wand-magic-sparkles"
                        data-dismissible></sherpa-overlay-panel>

  <!-- DETAILS: a Context fills it with its current record. Beside the assistant,
       since only one overlay panel is open at a time. TRAP T-one-overlay-panel-at-a-time -->
  <sherpa-overlay-panel id="details" data-icon="person" data-dismissible>
    <sherpa-group slot="actions">
      <sherpa-button class="details-step" data-by="-1" data-type="icon" data-size="sm"
                     data-icon-start="chevron-up" aria-label="Previous record"></sherpa-button>
      <sherpa-button class="details-step" data-by="1" data-type="icon" data-size="sm"
                     data-icon-start="chevron-down" aria-label="Next record"></sherpa-button>
    </sherpa-group>
    <sherpa-key-value-list class="details-fields" data-orientation="vertical"></sherpa-key-value-list>
  </sherpa-overlay-panel>

  <script type="module">
    import { ArrayStore, DataSource, SessionStore, loadSavedViews, spoofRemote } from '../dist/index.js';
    import { DASHBOARD_VIEWS } from '/examples/definitions/dashboard-views.js';
    import { RECORDS_VIEWS } from '/examples/definitions/records-views.js';
    // The SAME URLs the Contexts import, or each gets a store of its own. TRAP T-two-urls-are-two-modules
    import { customerStore, customersReady } from './contexts/records-data.js';
    import { confirmPrompt, namePrompt, resetPrompt } from './contexts/ask-name.js';
    import { alertStore } from './contexts/dashboard-data.js';

    // Font Awesome must be in the DOCUMENT too: sharedStyles carries the class
    // rules into shadow roots, but @font-face and light-DOM <i> need <head>.

    // Sentinel proving hot-swaps stay in the SAME document (never a full reload).
    window.__sherpaAppBooted = (window.__sherpaAppBooted ?? 0) + 1;

    /* A CONTEXT is what a nav row opens: it fills the header and the content.
       Terms: CLAUDE.md "Navigation terms". A Settings Context opens in an
       overlay ON TOP of the Context, so the URL can carry both. */
    const CONTEXTS = ['dashboard', 'records', 'chat'];
    // The Contexts with a definition in examples/definitions/.
    const DEFINED = new Set(['dashboard', 'records']);
    const SETTINGS_CONTEXTS = ['profile', 'accessibility', 'appearance', 'application'];
    const DEFAULT_CONTEXT = 'dashboard';

    // The main header, not the one inside the Settings overlay.
    const mainHeader = () => document.querySelector('sherpa-app-shell > sherpa-app-header');

    const contextRoot = document.getElementById('context-root');
    const nav = document.querySelector('sherpa-app-shell sherpa-nav');
    const router = document.querySelector('sherpa-router');

    /* App state that outlives a Context swap. Declared here because the Context
       loader reads /nav/pinned before the theme block further down runs. */
    const session = new SessionStore({
      theme: { mode: document.documentElement.dataset.mode ?? 'light', density: 'default' },
      nav: { pinned: false, favorites: [], recent: [], hierarchy: false },
      /* The width each panel AREA was dragged to, or null for its own. App
         chrome, like the nav pin. TRAP T-an-edge-resizes-its-box */
      panels: { start: null, end: null },
      /* TOOLBARS or PANEL. App chrome, like the nav pin: it survives a reload
         and a Context change, and dies with the session.
         TRAP T-panel-mode-hides-what-the-panel-answers */
      /* …and a DRAFT per View, on by default: what a reader left on a View
         comes back, for the tab and across sessions. Settings › Application.
         TRAP T-a-view-keeps-a-draft */
      filters: { mode: 'toolbars', records: null, dashboard: null, drafts: true, draftsAcross: true },
    });
    session.persist('/theme/mode');
    session.persist('/theme/density', { guard: (v) => ['compact', 'default', 'comfortable'].includes(v) });
    session.persist('/nav/pinned');
    /* The shell REPORTS a dragged width; the app keeps it and hands it back. */
    const shell = document.querySelector('sherpa-app-shell');
    for (const side of ['start', 'end']) {
      session.persist(`/panels/${side}`, { guard: (v) => v === null || (Number.isFinite(v) && v > 0) });
      const px = session.get(`/panels/${side}`);
      if (px) shell.setAttribute(`data-panel-${side}-width`, String(px));
    }
    shell.addEventListener('panel-area-resize', (e) => {
      session.set(`/panels/${e.detail.side}`, e.detail.width);
      shell.setAttribute(`data-panel-${e.detail.side}-width`, String(e.detail.width));
    });
    // "Show full view hierarchy": each Context's Views as child rows in the nav.
    session.persist('/nav/hierarchy', { guard: (v) => typeof v === 'boolean' });
    session.persist('/filters/mode', {
      guard: (v) => v === 'toolbars' || v === 'panel',
    });
    session.persist('/filters/drafts', { guard: (v) => typeof v === 'boolean' });
    session.persist('/filters/draftsAcross', { guard: (v) => typeof v === 'boolean' });
    /* The PROVIDER switches toolbars and panel for every page; the app keeps
       the reader's choice. TRAP T-the-provider-owns-the-panel-mode */
    const provider = document.querySelector('sherpa-provider');
    provider.filterMode = session.get('/filters/mode');
    provider.addEventListener('filter-mode-change', (e) => session.set('/filters/mode', e.detail.mode));
    /* A Context's FILTER ANSWERS, with the View they were made on. They survive
       a reload and a trip away and back, and die with the session.
       TRAP T-a-reload-replays-the-readers-answers */
    /* DEBUG: `?remote` makes the Records store ACT remote — slow, so every
       filter waits for Apply. `?remote=0` turns it off. Kept for the session.
       TRAP T-apply-and-discard-wait-for-a-change */
    session.persist('/debug/remote', { guard: (v) => typeof v === 'boolean' });
    // `?fail` makes every Records load FAIL, to show a card's error. TODO 58.
    session.persist('/debug/fail', { guard: (v) => typeof v === 'boolean' });
    // `?live` feeds the Dashboard's alerts from the server as they happen. TODO 14.
    session.persist('/debug/live', { guard: (v) => typeof v === 'boolean' });
    {
      const params = new URLSearchParams(location.search);
      const flag = params.get('remote');
      if (flag !== null) session.set('/debug/remote', flag !== '0');
      const fail = params.get('fail');
      if (fail !== null) session.set('/debug/fail', fail !== '0');
      const live = params.get('live');
      if (live !== null) session.set('/debug/live', live !== '0');
    }
    /* Each Context's kept Query, under its own name. TRAP T-navigating-sets-up-the-page */
    for (const context of ['records', 'dashboard']) {
      session.persist(`/filters/${context}`, {
        guard: (v) => v === null || (!!v && typeof v === 'object' && typeof v.view === 'string'),
      });
    }

    /* Favourites and Recents are STORED ROWS, not Contexts, so a stored shape this
       release cannot read must be dropped rather than stamped into the rail. */
    const isRowList = (value) => Array.isArray(value)
      && value.every((e) => e && typeof e === 'object' && typeof e.context === 'string');
    session.persist('/nav/favorites', { guard: isRowList });
    session.persist('/nav/recent', { guard: isRowList });

    /* A favourite is a VIEW (TODO 16): its `key` is `context:view`, and the FIRST
       View's is the Context alone — as the URL leaves it out. A row stored before
       had no key; it meant the Context, so it is its first View.
       Re-visiting a Context MOVES it up Recents instead of repeating it.
       TRAP T-a-favourite-is-a-view */
    const storedFavorites = session.get('/nav/favorites');
    if (Array.isArray(storedFavorites) && storedFavorites.some((r) => r && !r.key)) {
      session.set('/nav/favorites', storedFavorites.map((r) => ({ ...r, key: r.key ?? r.context })));
    }
    const favorites = session.list('/nav/favorites', { by: 'key' });
    const recents = session.list('/nav/recent', { by: 'context', max: 5, front: true });
    // Home never belongs in Recents, so one an earlier release stored is dropped.
    recents.remove({ context: DEFAULT_CONTEXT });

    // Shared nav config. An icon is a NAME from the Figma set; an `fa-*` class
    // list still resolves through the alias table. A name the set does not hold
    // prints as its own text, so it must be one that exists.
    // Home opens the dashboard, so no separate Dashboard row is needed. Every
    // row links to a REAL page; the nav's own tests cover nesting and badges.
    const navConfig = {
      product: { name: 'N-central', icon: 'group' },
      quickItems: [
        // The component's default Home carries no href — it cannot know where a
        // product's home lives — so the app supplies it.
        { id: 'home', label: 'Home', icon: 'home', href: '?context=dashboard' },
        /* Recent and Favorites are AREAS. Their children are stamped from the
           stored lists by refreshNav() below, so they start empty here. */
        { id: 'recent', label: 'Recent', icon: 'ccw-circle-arrow-w-clock' },
        { id: 'favorites', label: 'Favorites', icon: 'star' },
      ],
      sections: [
        { label: 'Customers', items: [
          { id: 'context-records', label: 'Records', icon: 'table-columns', href: '?context=records' },
        ] },
      ],
      /* The settings BUTTON in the nav header swaps the rail to these. Each
         Context's pages are Views, in its View chip. */
      settingsSections: [
        { items: [
          { id: 'settings-profile', label: 'User Profile', icon: 'person', href: '?settings=profile' },
          { id: 'settings-accessibility', label: 'Accessibility', icon: 'universal-access', href: '?settings=accessibility' },
          { id: 'settings-appearance', label: 'Appearance', icon: 'paint-roller', href: '?settings=appearance' },
          { id: 'settings-application', label: 'Application', icon: 'browser', href: '?settings=application' },
        ] },
      ],
    };

    /* Which nav row maps to which Context — read from the HREF, not from a
       `context-` id prefix, so a row named anything else (Home) still routes. */
    const hrefParam = (href, name) => (href ? new URL(href, location.href).searchParams.get(name) : null);
    const contextForHref = (href) => {
      const c = hrefParam(href, 'context');
      return CONTEXTS.includes(c) ? c : null;
    };
    const idForContext = (c) => `context-${c}`;

    /* ?context=records&settings=profile — the Settings Context rides on top. */
    const settingsForHref = (href) => {
      const s = hrefParam(href, 'settings');
      return SETTINGS_CONTEXTS.includes(s) ? s : null;
    };

    /* THE ROUTE, as the router reads the URL — with a name the app does not
       know read as none. ?context=records&view=mine&settings=application: the
       Context carries its View, and a FIRST View is left out. */
    const urlState = () => {
      const { context, view, settings } = router.route;
      return {
        context: CONTEXTS.includes(context) ? context : DEFAULT_CONTEXT,
        view,
        settings: SETTINGS_CONTEXTS.includes(settings) ? settings : null,
      };
    };
    const contextFromURL = () => urlState().context;
    const settingsFromURL = () => urlState().settings;
    const viewFromURL = () => urlState().view;
    /** A row's href: a whole route, so a middle-click opens the same place. */
    const urlFor = ({ context, view = null, settings = null }) => new URL(router.href({ context, view, settings })).search;

    /* A Context's Views: its presets, then the reader's saved ones — the set its
       View chip offers, so the nav and the chip name the same Views. */
    const PRESET_VIEWS = { dashboard: DASHBOARD_VIEWS, records: RECORDS_VIEWS };
    const viewsOf = (context) => ({ ...PRESET_VIEWS[context], ...loadSavedViews(context) });
    const firstView = (context) => Object.keys(viewsOf(context))[0] ?? null;
    /** A View's favourite key: the Context alone for its first View. */
    const favKey = (context, view) => (view && view !== firstView(context) ? `${context}:${view}` : context);

    /* Every configured row. Children are deliberately NOT walked: a Favorites
       copy of Records must not out-rank the real row. */
    const configRows = () => [
      ...(navConfig.quickItems ?? []),
      ...[...(navConfig.sections ?? []), ...(navConfig.settingsSections ?? [])]
        .flatMap((s) => s.items ?? []),
    ];
    const rowForHref = (context) => configRows().find((i) => contextForHref(i.href) === context);
    const settingsRow = (name) => name && configRows().find((i) => settingsForHref(i.href) === name);

    /* The lit row. With the hierarchy on it is the View's own row, not its Context's. */
    function syncNavCurrent() {
      const settings = settingsFromURL();
      const name = settings ?? contextFromURL();
      const row = settings ? settingsRow(settings) : rowForHref(name);
      const id = row?.id ?? idForContext(name);
      const view = settings ? null : viewFromURL() ?? firstView(name);
      nav.dataset.currentId = row && view && session.get('/nav/hierarchy') ? `${id}:${view}` : id;
    }

    /* A View row is the View chip by another door. It goes THROUGH the chip, so
       the chip stays the one owner and the page's own onViewPicked runs. */
    function pickView(header, context, id) {
      const bar = header?.querySelector('sherpa-quick-filter-toolbar[data-type="view"]');
      if (!bar || !viewsOf(context)[id] || bar.values.view?.[0] === id) return;
      bar.setChipValues('view', [id]);
      bar.report();
    }

    /* Fallback ONLY, for a Context no nav row opens (the assistant, reached from
       "Ask N-zo"). A Context with a row always takes the row's label and icon. */
    const HEADLESS_CONTEXTS = {
      chat: { label: 'Assistant' },
    };

    /** What a stored Favourite or Recent row remembers about a Context. The LABEL
     *  is copied, so a stored row still reads if the config later drops it. */
    const rowForContext = (context) => ({
      context,
      label: rowForHref(context)?.label ?? HEADLESS_CONTEXTS[context]?.label ?? context,
    });

    /** What a stored Favourite remembers: one VIEW of a Context, by its key. */
    const rowForFavourite = (context, view) => {
      const row = rowForContext(context);
      const key = favKey(context, view);
      if (key === context) return { ...row, key };
      return { ...row, view, key, label: `${row.label} › ${viewsOf(context)[view]?.label ?? view}` };
    };

    /* Write the Context's own row onto the header — from the config, not the
       rail's current row: with Settings open on top, that row is a Settings one. */
    const syncHeaderToNav = (header, context) => {
      const entry = rowForHref(context) ?? HEADLESS_CONTEXTS[context];
      if (!header || !entry) return;
      header.setAttribute('data-heading', entry.label ?? '');
      // No icon on the row → clear it: a stale glyph is worse than none.
      if (entry.icon) header.setAttribute('data-icon', entry.icon);
      else header.removeAttribute('data-icon');
    };

    // Guard against races: only the newest load may commit.
    let loadToken = 0;
    let cleanup = null;   // teardown returned by the current Context's init()
    let loadedContext = null;

    async function loadContext(name) {
      const token = ++loadToken;
      loadedContext = name;
      // Read BEFORE init: populating the header reports its first View, and the URL follows.
      const view = viewFromURL();

      // Tear down the previous Context (e.g. chat's data-no-header), and its page.
      if (typeof cleanup === 'function') { try { cleanup(); } catch { /* noop */ } cleanup = null; }
      provider.close();

      /* Settings open on top owns the rail. Otherwise: found by href, so Home
         lights up for the dashboard; and through the rail's OWN setter, so the
         app-shell's inset follows. A PINNED rail survives the swap. */
      syncNavCurrent();
      if (!settingsFromURL()) nav.state = session.get('/nav/pinned') ? 'pinned' : 'collapsed';

      // 1) Fetch the bespoke content-only markup for the Context.
      const markup = await (await fetch(`/template/context/${name}`)).text();
      if (token !== loadToken) return;   // a newer navigation superseded us

      /* NO back button: moving between Contexts is the NAV's to show, as the
         breadcrumbs are. Settings keeps its own, which leaves Settings.
         Will, 2026-09-26. */
      const header = mainHeader();

      /* Title and icon ARE the selected nav row's — one value, one owner. */
      syncHeaderToNav(header, name);

      // 2) Inject into the app-shell content slot.
      contextRoot.innerHTML = markup;

      // 3) Wait for the shell chrome to define, then import + run the Context module.
      await customElements.whenDefined('sherpa-app-shell');
      if (token !== loadToken) return;

      const mod = await import(`./contexts/${name}.js`);
      if (token !== loadToken) return;

      /* THE PAGE IS ITS DEFINITION: its source over the app's store — every
         field, scope and saved filter, the header's chips, the grid's
         configuration and the kept Query — set up HERE, on every navigation, so
         no Context can forget a step. TRAP T-a-page-is-its-definition
         TRAP T-navigating-sets-up-the-page */
      const remote = session.get('/debug/remote') === true;
      const fail = session.get('/debug/fail') === true;
      const definition = DEFINED.has(name) ? await (await fetch(`/examples/definitions/${name}.json`)).json() : null;
      // SEED FIRST: a source over an empty store has no values to offer.
      await customersReady;
      if (token !== loadToken) return;
      const source = definition ? await provider.open(definition, {
        /* `?remote` makes the records ACT remote, so every filter waits for
           Apply. TRAP T-apply-and-discard-wait-for-a-change */
        stores: {
          customers: remote || fail ? spoofRemote(customerStore, { delay: remote ? 800 : 0, fail: fail ? 1 : 0 }) : customerStore,
          alerts: alertStore,
        },
        views: PRESET_VIEWS[name], view, session,
        // Asked at each write, so a switch in Settings applies at once.
        drafts: () => (!session.get('/filters/drafts') ? 'off'
          : session.get('/filters/draftsAcross') ? 'always' : 'session'),
      }) : undefined;
      if (token !== loadToken) return;

      /* A Context gets the SESSION: filter-panel mode is app chrome and
         survives a Context change, like the nav pin.
         TRAP T-panel-mode-hides-what-the-panel-answers */
      /* …and the VIEW, so the Context opens on it itself — a pick after init
         would reset what the session kept. TRAP T-a-reload-replays-the-readers-answers */
      cleanup = await mod.init(contextRoot, { session, view, source });
      if (token !== loadToken) return;
      if (view) pickView(header, name, view);

      /* Recorded LAST, so a Context that failed to load never enters Recents. The
         list caps itself at 5 and moves a re-visit up. Home never enters it, nor
         does Settings, which opens in its overlay and never reaches here. */
      if (name !== DEFAULT_CONTEXT) recents.add(rowForContext(name));
      // The star shows whether THIS View is already a favourite.
      syncFavouriteStar(name, view);
    }

    // Populate the shared nav once.
    await customElements.whenDefined('sherpa-nav');
    /* AWAITED below: populate() defers to the component's render promise, so
       calling it is not the same as the rows existing — and the header reads its
       title off a stamped ROW. */
    /* A child row's id must be STABLE and distinct from the Context's own row, or
       starring Records would give two rows claiming id `context-records` and
       `data-current-id` would light both. */
    const childId = (area, context) => `${area}:${context}`;

    /** A stored row → a nav child. No icon: TRAP T-nav-child-rows-carry-no-icon. */
    const toChild = (parent) => (row) =>
      ({ id: childId(parent, row.key ?? row.context), label: row.label, href: urlFor({ context: row.context, view: row.view }) });

    /** A Context's Views as its child rows. Each href names its View, so a
     *  middle-click opens that View. */
    const viewRows = (row, context) => Object.entries(viewsOf(context)).map(([id, view]) => ({
      id: childId(row.id, id),
      label: view.label,
      href: urlFor({ context, view: id }),
    }));

    /* Re-stamp every parent row. A re-populate rebuilds every row, so the
       reader's OPEN Areas must be read back first and handed to the next
       config — otherwise starring a Context snaps its own branch shut. The
       branch holding the page you are on is always open, so its lit row shows. */
    function refreshNav() {
      const wasOpen = new Set(
        nav.shadowRoot?.querySelectorAll('.nav-row[data-expanded="true"]') ?? [],
      );
      const openIds = new Set([...wasOpen].map((r) => r.dataset.id));
      const here = rowForHref(contextFromURL())?.id;
      const hierarchy = session.get('/nav/hierarchy');

      for (const item of configRows()) {
        const list = { recent: recents, favorites }[item.id];
        const context = contextForHref(item.href);
        const children = list ? list.all.map(toChild(item.id))
          : hierarchy && context ? viewRows(item, context) : [];
        // A parent with no children is a plain row, not an empty expander.
        if (children.length) {
          item.children = children;
          item.expanded = openIds.has(item.id) || item.id === here;
        } else {
          delete item.children;
          delete item.expanded;
        }
      }
      return nav.populate(navConfig);
    }

    const navReady = refreshNav();

    /* Both lists paint the SAME rail, so one subscriber each and no other code
       needs to know a row was added. */
    favorites.subscribe(() => void refreshNav());
    recents.subscribe(() => void refreshNav());
    session.subscribe('/nav/hierarchy', () => { syncNavCurrent(); void refreshNav(); });

    /* ── The ★ ────────────────────────────────────────────────────────
       The toolbar is `data-locked`, so its star is a REQUEST. The app owns the
       list, answers by writing data-favourite back, and the rail follows from
       the list's own subscriber. TRAP T-the-star-reports-it-does-not-decide */
    const viewToolbar = () => mainHeader()?.querySelector('sherpa-quick-filter-toolbar[data-type="view"]');

    function syncFavouriteStar(context, view = viewFromURL()) {
      viewToolbar()?.toggleAttribute('data-favourite', favorites.has({ key: favKey(context, view) }));
    }

    // The ★ stars the VIEW on screen, not its whole Context. TODO 16
    document.addEventListener('view-favorite', () => {
      const { context, view } = urlState();
      favorites.toggle(rowForFavourite(context, view));
      syncFavouriteStar(context, view);
    });

    /* ── Save view, Save view as, Delete view — one flow, every page ─────
       The bar's buttons are REQUESTS; the provider saves. A preset is never
       saved over or deleted. TODO 15. TRAP T-a-saved-view-is-the-readers-own */
    const askViewName = namePrompt(document.querySelector('#view-name'));
    const confirmView = confirmPrompt(document.querySelector('#view-confirm'));
    const viewLabel = () => {
      const { context } = urlState();
      return viewsOf(context)[provider.view ?? firstView(context)]?.label ?? '';
    };
    // Its row in the rail follows, once it is saved (Views as rows: Settings › Application).
    const saveViewAs = async () => {
      const name = await askViewName(viewLabel());
      if (name && await provider.saveView(name)) void refreshNav();
    };
    document.addEventListener('view-save', async () => {
      if (!provider.customView) return saveViewAs();
      const label = viewLabel();
      const yes = await confirmView({
        heading: `Save over “${label}”?`, action: 'Save',
        words: `“${label}” will hold the filters on screen now.`,
      });
      if (yes && await provider.saveView()) void refreshNav();
    });
    document.addEventListener('view-save-as', saveViewAs);
    document.addEventListener('view-delete', async () => {
      const label = viewLabel();
      const yes = await confirmView({
        heading: `Delete “${label}”?`, action: 'Delete', critical: true,
        words: `“${label}” will be deleted. This cannot be undone.`,
      });
      if (yes && await provider.deleteView()) void refreshNav();
    });

    /* ── Reset all to default — it asks first ─────────────────────────────
       The bar's and the panel's menu row is a REQUEST the provider answers by
       itself; asked in CAPTURE and prevented, the app takes it over. With
       "Save filters before reset" on, what is on screen is kept as a saved
       View first, and the page stays on its own View. TODO 129.
       TRAP T-reset-to-default-is-the-views-own */
    const confirmReset = resetPrompt(document.querySelector('#reset-confirm'));
    provider.addEventListener('view-reset', async (event) => {
      event.preventDefault();
      const answer = await confirmReset();
      if (!answer) return;
      if (answer.save) {
        // Not saved, so not reset: the filters are still on screen to try again.
        if (!await provider.saveView(answer.save, { stay: true })) return;
        void refreshNav();
      }
      await provider.resetView();
    }, { capture: true });

    /* ── Settings — an overlay on the Context ─────────────────────────────
       The URL's `settings` is the ONE owner. The settings button, the back
       arrow, ESC and browser Back are intents: each writes or reads the URL,
       and syncSettings() makes the screen match it. */
    const settingsDialog = document.getElementById('settings');
    const settingsRoot = document.getElementById('settings-root');
    const settingsHeader = settingsDialog.querySelector('sherpa-app-header');
    let settingsToken = 0;
    let settingsCleanup = null;
    let openSettingsName = null;
    let lastSettings = SETTINGS_CONTEXTS[0];

    const dropSettingsContent = () => {
      if (typeof settingsCleanup === 'function') { try { settingsCleanup(); } catch { /* noop */ } }
      settingsCleanup = null;
    };

    async function openSettings(name) {
      const token = ++settingsToken;
      openSettingsName = lastSettings = name;
      dropSettingsContent();

      const row = settingsRow(name);
      nav.state = 'settings';
      syncNavCurrent();
      settingsHeader.setAttribute('data-heading', row?.label ?? '');
      if (row?.icon) settingsHeader.setAttribute('data-icon', row.icon);
      else settingsHeader.removeAttribute('data-icon');

      const markup = await (await fetch(`/template/context/${name}`)).text();
      if (token !== settingsToken) return;
      settingsRoot.innerHTML = markup;
      const mod = await import('./contexts/settings.js');
      if (token !== settingsToken) return;
      settingsCleanup = await mod.init(settingsRoot, { session, label: row?.label, header: settingsHeader });
      if (token !== settingsToken) return;

      // Shown LAST, so opening it can move focus to something inside — ESC needs that.
      await customElements.whenDefined('sherpa-dialog');
      settingsDialog.show();
    }

    function closeSettings() {
      ++settingsToken;
      openSettingsName = null;
      dropSettingsContent();
      settingsDialog.hide();
      // Back to the Context underneath — it was never unloaded.
      syncNavCurrent();
      // Left by the settings button, the rail has already moved; by anything else, move it.
      if (nav.state === 'settings') nav.state = session.get('/nav/pinned') ? 'pinned' : 'collapsed';
    }

    /** Make the screen match the URL. */
    function syncSettings() {
      const name = settingsFromURL();
      if (name && name !== openSettingsName) void openSettings(name);
      else if (!name && openSettingsName) closeSettings();
    }

    /** An intent: ask the router. The screen follows its `route-change`. */
    const goSettings = (name) => void router.go({ settings: name });

    /* The View chip is the owner of the View; the URL and the lit row follow it. */
    mainHeader().addEventListener('quick-filter-change', (e) => {
      if (e.detail?.scope && e.detail.scope !== 'bar') return;
      const context = contextFromURL();
      const id = e.detail?.values?.view?.[0];
      if (!viewsOf(context)[id]) return;
      // REPLACE: a View pick is not a step Back should undo one by one.
      void router.go({ view: id === firstView(context) ? null : id }, { replace: true });
    });

    settingsHeader.addEventListener('back-click', () => goSettings(null));
    // ESC closes the dialog itself; the URL follows.
    settingsDialog.addEventListener('dialog-close', (e) => { if (e.target === settingsDialog) goSettings(null); });

    /* The rail REPORTS its mode; the app owns whether the pin is remembered.
       Settings is a temporary detour, so only the two latching-vs-not modes
       write. `hover` is a pointer state and never touches the stored value. */
    nav.addEventListener('nav-state-change', (e) => {
      const state = e.detail.state;
      if (state === 'pinned') session.set('/nav/pinned', true);
      else if (state === 'collapsed') session.set('/nav/pinned', false);
      // The settings button is an INTENT to open or leave Settings.
      if (state === 'settings' && !openSettingsName) goSettings(lastSettings);
      else if (state !== 'settings' && openSettingsName) goSettings(null);
    });

    /* Areas open no Context (Recent, Favorites), so they never reach the router, so the
       rail's own event updates the header for both cases. */
    nav.addEventListener('nav-select', (e) => {
      const header = mainHeader();
      if (!header || nav.state === 'settings') return;
      // A row that opens a Context names the CONTEXT — a View row's label is its View's.
      const context = contextForHref(e.detail.href);
      if (context) { syncHeaderToNav(header, context); return; }
      header.setAttribute('data-heading', e.detail.label ?? '');
      if (e.detail.icon) header.setAttribute('data-icon', e.detail.icon);
      else header.removeAttribute('data-icon');
    });

    /* Notifications, through the data layer: the badge and the list are TWO
       READINGS OF ONE SET. Swapping the ArrayStore for a SocketStore is the only
       change a real app makes. */
    const notificationFeed = new ArrayStore([
      { id: 'n1', label: 'Northwind renewed', description: 'Enterprise, 3 years',
        icon: 'status-ok', time: '2m ago', unread: true },
      { id: 'n2', label: 'Contoso payment failed', description: 'Card declined',
        time: '1h ago', unread: true },
      { id: 'n3', label: 'Fabrikam raised a ticket', description: 'Priority: high',
        icon: 'ticket', time: '3h ago', unread: true },
      { id: 'n4', label: 'Tailspin trial ends Friday', description: '14-day trial',
        time: 'Yesterday', unread: true },
      { id: 'n5', label: 'Weekly report ready', description: 'Revenue and churn',
        time: '2d ago' },
    ], { key: 'id' });

    const notificationSource = new DataSource({ store: notificationFeed });
    const notifications = document.getElementById('notifications');
    // Its own reference: the `header` further up is local to the Context loader.
    const appHeader = mainHeader();

    // The LIST is bound. Rows in, and its own events out.
    notificationSource.bind(notifications);

    // The BADGE counts the SOURCE's rows, not the component's: the list fills
    // through populate(), which waits for its first render, so reading the
    // component here counts an empty list on the first pass.
    const syncBadge = () => {
      const unread = notificationSource.rows.filter((n) => n.unread).length;
      if (unread > 0) appHeader.setAttribute('data-notifications', String(unread));
      else appHeader.removeAttribute('data-notifications');
    };
    notificationSource.addEventListener('change', syncBadge);

    /* The bell opens the list, anchored to itself — and the HOST owns the
       panel, so the host tells the bell it is open.
       TRAP T-a-trigger-shows-what-it-opened */
    appHeader.addEventListener('notifications-click', () => {
      notifications.toggle(appHeader.shadowRoot?.querySelector('.notif-btn') ?? appHeader);
    });
    for (const [event, open] of [['notifications-open', true], ['notifications-close', false]]) {
      notifications.addEventListener(event, () => {
        appHeader.toggleAttribute('data-notifications-open', open);
      });
    }

    // "Mark all read" persists through the STORE, which is what makes the badge
    // follow — the list has already marked itself.
    notifications.addEventListener('notification-read', async (e) => {
      for (const id of e.detail.ids) await notificationFeed.update(id, { unread: false });
      syncBadge();
    });

    notifications.addEventListener('notification-select', (e) => {
      notificationFeed.update(e.detail.id, { unread: false }).then(syncBadge);
      notifications.hide();
    });

    notificationSource.load().then(syncBadge);

    /* EVERY NAVIGATION ENDS HERE — a nav row, a crumb, the View chip, the
       settings button, Back. Each is a real link or a `router.go()`; the router
       has already changed the URL, and this makes the screen match it. Only
       what CHANGED is touched, so leaving Settings never reloads the Context.
       TRAP T-the-router-owns-the-url */
    router.addEventListener('route-change', () => {
      const { context, view } = urlState();
      if (context !== loadedContext) loadContext(context);
      else {
        syncHeaderToNav(mainHeader(), context);
        pickView(mainHeader(), context, view ?? firstView(context));
      }
      syncSettings();
      syncNavCurrent();
      // Another View: the ★ says whether IT is a favourite.
      syncFavouriteStar(context, view);
    });

    /* The moon button flips light ↔ dark. The whole switch is one attribute on
       <html>: the display-mode layer re-points every semantic token from there,
       so no component knows a mode exists.

       The SessionStore holds it and `persist` remembers it, restoring on
       registration so there is no flash of the wrong theme. */
    /* The button shows what you will GET: a moon offers dark, a sun offers
       light. `data-mode` lives on <html>, which the header's shadow CSS cannot
       select, so the glyph is set here. ONE subscriber does both jobs, so
       anything that changes the mode, from anywhere, lands here. */
    session.subscribe('/theme/mode', (mode) => {
      document.documentElement.dataset.mode = mode;
      const btn = mainHeader()?.shadowRoot
        ?.querySelector('.theme-toggle');
      btn?.setAttribute('data-icon-start',
        mode === 'dark' ? 'sun' : 'moon');
      btn?.setAttribute('aria-label',
        mode === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    });
    /* Apply what persist() restored, then again once the header has RENDERED.
       `whenDefined` resolves when the class registers, but SherpaElement builds
       its shadow root after that, so a glyph written then lands before the
       button exists. `rendered` is the promise that means the DOM is there. */
    session.subscribe('/theme/density', (density) => {
      // `default` is NO attribute: the tokens' base values are the default density.
      if (density === 'default') delete document.documentElement.dataset.density;
      else document.documentElement.dataset.density = density;
    });
    const resync = () => {
      session.set('/theme/mode', session.get('/theme/mode'));
      session.set('/theme/density', session.get('/theme/density'));
    };
    resync();
    void customElements.whenDefined('sherpa-app-header')
      .then(() => mainHeader()?.rendered)
      .then(resync);

    /* Ask N-zo opens the assistant panel. Its markup is the CHAT template,
       fetched on first open and KEPT, so re-opening finds the thread you left. */
    const assistant = document.getElementById('assistant');
    let assistantReady = null;
    document.addEventListener('ai-click', () => {
      assistantReady ??= (async () => {
        assistant.innerHTML = await (await fetch('/template/context/chat')).text();

        /* UNWRAP the card: inside a panel the PANEL is the surface, so the chat
           Context's sherpa-container would be a box drawn inside a box. The two
           halves are re-slotted onto the panel itself. */
        const card = assistant.querySelector('sherpa-container');
        if (card) {
          const thread = card.querySelector('#thread');
          /* The COMPOSER moves across, not the card's footer around it — the
             panel already IS a sherpa-container-footer there, and a second one
             drew two dividers, the inner shrink-wrapped to half the width. */
          const composer = card.querySelector('sherpa-prompt-composer');
          if (composer) composer.setAttribute('slot', 'footer');
          card.replaceWith(...[thread, composer].filter(Boolean));
        }

        await customElements.whenDefined('sherpa-overlay-panel');
        const mod = await import('./contexts/chat.js');
        // The chat Context hides the app header for its full-page form; in a panel
        // the header must stay, so its shell tweak is undone straight away.
        const cleanup = await mod.init(assistant);
        cleanup?.();
      })();
      void assistantReady.then(() => assistant.show());
    });

    document.addEventListener('theme-toggle', () => {
      session.set('/theme/mode', session.get('/theme/mode') === 'dark' ? 'light' : 'dark');
    });

    /* First paint, AFTER the rail has stamped its rows: without this await the
       first load finds an empty rail and the header comes up blank. */
    await navReady;
    loadContext(contextFromURL());
    syncSettings();
  </script>
</body>
</html>
