<!-- Content-only markup for the "records" view.
     Served by the template server (GET /template/view/records) and injected into
     the app-shell's default (content) slot by the SPA router in index.html.
     views/records.js builds the data and populates the grid / toolbar / dialog.

     EVERY box here is a Sherpa component or the projected layout grid. There is
     no view-level CSS.

     NO section header. The APP HEADER owns the view's name (views/records.js sets
     data-heading="Customers"), so a heading here repeated it. Page actions live in
     the GRID's own toolbar, with the data they act on. -->
<div class="sherpa-grid">
  <!-- A data table always wants every column it can get. `data-rows="8"` fixes the
       card at 8 layout-grid rows tall, so the grid SCROLLS inside it rather than
       the card growing with the row count and pushing the pager off the screen.

       data-padding="none": the toolbars, the grid and the pager each carry their
       own Figma padding, so a second inset from the card would double it. -->
  <!-- A data table always wants every column it can get. `data-rows="8"` fixes the
       card at 8 layout-grid rows tall, so the grid SCROLLS inside it rather than
       the card growing with the row count and pushing the pager off the screen.

       data-padding="none" keeps the BLOCK inset at zero, so each part's own
       divider still meets both card edges; data-padding-inline="md" gives the
       content 8px of horizontal breathing room without bringing that inset back. -->
  <sherpa-container data-span="full" data-rows="8"
                    data-padding="none" data-padding-inline="md" data-fill>

    <!-- HEADER — the page-level actions for this grid's data. Add customer sits
         with the data it acts on rather than in a section header above the card.
         The toolbar brings its own padding and bottom rule, so the container
         leaves it bare (see .header ::slotted in sherpa-container.css). -->
    <sherpa-toolbar slot="header" id="grid-actions">
      <!-- A real ICON, not the literal "+" character this used to pass.
           sherpa-button accepts either (a raw glyph is back-compat), but a
           text "+" only inks about half its em, so it drew ~7px inside the
           correct 14px box and read as too small. A Font Awesome glyph fills
           the box Figma sizes with `icon-size`. -->
      <sherpa-button slot="leading" id="add-btn"
                     data-look="saturated" data-icon-start="fa-solid fa-plus">
        Add customer
      </sherpa-button>
    </sherpa-toolbar>

    <!-- CONTENT — the filter toolbar and the grid it filters, as ONE run with no
         gap: each carries its own padding and divider, so a gap between them
         would be a second, competing rhythm. -->
    <sherpa-stack data-gap="none" data-grow data-fill>
      <sherpa-quick-filter-toolbar id="qft"></sherpa-quick-filter-toolbar>
      <!-- data-grow: this is the item that takes the card's leftover height, so
           the grid scrolls INSIDE the card while the header and footer stay put. -->
      <sherpa-data-grid id="grid" data-grow data-selectable data-filterable></sherpa-data-grid>
    </sherpa-stack>

    <!-- FOOTER — the pager, pinned below the scrolling content. It carries its
         own padding and top rule, so the container leaves it bare too.
         NO data-page-size: the component defaults to 25, and naming a size here
         would override it for no reason. The source overwrites data-page and
         data-total-pages on every load, so these are only the pre-JS values. -->
    <sherpa-pagination
      slot="footer"
      id="pager"
      data-page="1"
      data-total-pages="4"
      data-rows-options="10,25,50,100"></sherpa-pagination>
  </sherpa-container>
</div>

<!-- Add / edit customer dialog. -->
<sherpa-dialog id="dialog" data-heading="Add customer">
  <sherpa-stack>
    <sherpa-input-text id="f-name" data-label="Name" placeholder="Jane Doe" required></sherpa-input-text>
    <sherpa-input-text id="f-email" data-label="Email" type="email" placeholder="jane@acme.com" required></sherpa-input-text>
    <sherpa-select-group id="f-plan" data-label="Plan"></sherpa-select-group>
  </sherpa-stack>

  <!-- The footer is a Container Footer, which brings its own 8×16 padding, its
       0.5px divider and its end alignment — the dialog's CSS already knows not to
       add a second set around a composed one. -->
  <sherpa-container-footer slot="footer">
    <sherpa-button id="cancel-btn">Cancel</sherpa-button>
    <sherpa-button id="save-btn" data-look="saturated">Save</sherpa-button>
  </sherpa-container-footer>
</sherpa-dialog>

<!-- NO toast region. sherpa-toast makes its own `.sherpa-toast-stack` in the
     top-right corner on first use (SherpaToast.success(…)), so a hand-made
     region was a second stack in a different corner. -->
