<!-- Content-only markup for the "records" Context, injected into the app-shell's
     content slot by the SPA router. contexts/records.js wires the data.
     No section header: the APP HEADER owns the Context's name. -->
<!-- data-rows="fit": every row is one metric tall and the LAST row takes the
     rest, so the Context fills the content area and nothing scrolls but the
     grid inside its own card. FIVE rows: metrics 1, charts 3, the records card
     1 — and that last one must BE the last row, or it takes a fixed 88px and
     the card stops short of the bottom.
     TRAP T-a-content-grid-has-two-row-modes -->
<sherpa-layout-grid data-rows="fit" data-row-count="5">

  <!-- SUMMARIES OF THE SAME ROWS. Each DECLARES what it needs, and its provider
       answers, so a filter set anywhere re-computes all of them. Each sparkline
       runs over the month a customer joined. TRAP T-a-component-declares-its-summary -->
  <sherpa-metric id="m-customers" data-col-span="xsmall" data-label="Customers"
                 data-aggregate="count" data-over-field="created" data-bucket="month"></sherpa-metric>
  <sherpa-metric id="m-spend" data-col-span="xsmall" data-label="Total spend"
                 data-aggregate="sum" data-field="spend" data-over-field="created" data-bucket="month"
                 data-format='{"style":"currency","currency":"USD","maximumFractionDigits":0}'></sherpa-metric>
  <sherpa-metric id="m-seats" data-col-span="xsmall" data-label="Seats"
                 data-aggregate="sum" data-field="seats" data-over-field="created" data-bucket="month"></sherpa-metric>
  <sherpa-metric id="m-tickets" data-col-span="xsmall" data-label="Open tickets"
                 data-aggregate="sum" data-field="openTickets" data-over-field="created" data-bucket="month"></sherpa-metric>

  <sherpa-container data-col-span="medium" data-row-span="3">
    <sherpa-container-header slot="header" data-heading="By status"></sherpa-container-header>
    <sherpa-barchart id="r-bar" data-legend="horizontal" data-segment-field="status">
      <sherpa-chart-legend slot="legend" id="r-bar-legend"
                           data-orientation="horizontal"></sherpa-chart-legend>
    </sherpa-barchart>
  </sherpa-container>

  <sherpa-container data-col-span="medium" data-row-span="3">
    <sherpa-container-header slot="header" data-heading="By plan"></sherpa-container-header>
    <!-- No data-label: the centre TOTALS what the ring draws, so it follows
         every filter. TRAP T-the-centre-totals-what-the-ring-draws -->
    <sherpa-radial-chart id="r-donut" data-sublabel="customers" data-segment-field="plan">
      <sherpa-chart-legend slot="legend" id="r-donut-legend"
                           data-orientation="vertical"></sherpa-chart-legend>
    </sherpa-radial-chart>
  </sherpa-container>

  <!-- The gauge's legend names its ZONES, not a series, so it is read-only. -->
  <sherpa-container data-col-span="medium" data-row-span="3">
    <sherpa-container-header slot="header" data-heading="Mean risk"></sherpa-container-header>
    <sherpa-gauge-chart
      id="r-gauge"
      data-min="0"
      data-max="100"
      data-unit="%"
      data-zones="0-20:success,20-40:warning,40-100:critical"
      data-legend="horizontal">
      <sherpa-chart-legend slot="legend" id="r-gauge-legend"
                           data-orientation="horizontal" data-readonly></sherpa-chart-legend>
    </sherpa-gauge-chart>
  </sherpa-container>

  <!-- data-grow: this card takes whatever the rows above leave, so the grid
       scrolls inside it instead of pushing the pager off screen. No data-rows
       here — the fit grid decides the height. data-padding="none" keeps the
       block inset at zero so each part's own divider meets both card edges. -->
  <sherpa-container data-col-span="full" data-grow
                    data-padding="none" data-padding-inline="md" data-fill>

    <!-- The toolbar brings its own padding and bottom rule, so the container
         leaves it bare (see .header ::slotted in sherpa-container.css). -->
    <sherpa-toolbar slot="header" id="grid-actions">
      <sherpa-button slot="leading" id="add-btn"
                     data-look="saturated" data-icon-start="plus">
        Add customer
      </sherpa-button>

      <!-- BULK ACTIONS — filled by records.js from `grid.actionsFor(count)`, so
           they cannot disagree with the row menu. Actions lead (after the CTA),
           the count trails, or it shifts the buttons on every tick. Empty here,
           not absent; CSS hides an empty container. Inline flex because a plain
           block leaves two actions flush against each other. -->
      <span slot="leading" id="bulk-actions"
            style="display: flex; align-items: center;
                   gap: var(--sherpa-display-mode-space-xs, 8px)"></span>
      <span slot="trailing" id="bulk-count" class="bulk-count" hidden></span>
    </sherpa-toolbar>

    <!-- data-gap="md": the filter toolbar has no rule of its own (Figma's
         Type=data bar binds a bottom stroke weight but paints no stroke), so at
         "none" the grid sits flush against it. -->
    <sherpa-stack data-gap="md" data-grow data-fill>
      <!-- data-saveable: this page keeps the filters a reader saves. -->
      <sherpa-quick-filter-toolbar id="qft" data-scope="data" data-saveable></sherpa-quick-filter-toolbar>
      <!-- data-grow: takes the card's leftover height, so the grid scrolls
           INSIDE the card while header and footer stay put. -->
      <sherpa-data-grid id="grid" data-scope="data" data-grow data-selectable data-column-filters></sherpa-data-grid>
    </sherpa-stack>

    <!-- The pager carries its own padding and top rule, so the container leaves
         it bare. No data-page-size — the component defaults to 25. The source
         overwrites data-page and data-total-pages, so these are pre-JS only. -->
    <sherpa-pagination
      slot="footer"
      id="pager"
      data-page="1"
      data-total-pages="4"
      data-rows-options="10,25,50,100"></sherpa-pagination>
  </sherpa-container>
</sherpa-layout-grid>

<!-- Add / edit customer dialog, in a real FORM: the browser refuses a save
     with a required field empty and points at it. The form wraps the dialog,
     because `slot="footer"` slots only a direct child. TODO 61 -->
<form id="customer-form">
<sherpa-dialog id="dialog" data-heading="Add customer">
  <sherpa-stack>
    <sherpa-input-text id="f-name" name="name" data-label="Name" placeholder="Jane Doe" required></sherpa-input-text>
    <sherpa-input-text id="f-email" name="email" data-label="Email" type="email" placeholder="jane@acme.com" required></sherpa-input-text>
    <!-- EVERY record belongs to a customer organisation. Without this the
         record was saved with no `customer` and the Customer filter — which
         only sees values the data carries — could never find it.
         TRAP T-a-chip-filters-the-values-the-data-has -->
    <sherpa-input-text id="f-customer" name="customer" data-label="Customer" data-type="select" required></sherpa-input-text>
    <sherpa-select-group id="f-plan" name="plan" data-label="Plan"></sherpa-select-group>
  </sherpa-stack>

  <!-- Container Footer brings its own padding, divider and end alignment; the
       dialog's CSS knows not to add a second set around a composed one. -->
  <sherpa-container-footer slot="footer">
    <sherpa-button id="cancel-btn">Cancel</sherpa-button>
    <sherpa-button id="save-btn" data-look="saturated">Save</sherpa-button>
  </sherpa-container-footer>
</sherpa-dialog>
</form>

<!-- A SECOND dialog, not the add/edit one re-labelled — re-use means every open
     has to undo what the last one set. data-status="critical" re-points the card
     and the Delete button from one attribute. The Context writes the message. -->
<sherpa-dialog id="confirm" data-heading="Delete customer?" data-status="critical">
  <!-- Margin zeroed inline: the dialog body already brings its padding and the
       browser's own <p> margins would add to it. -->
  <p id="confirm-text" style="margin: 0"></p>

  <sherpa-container-footer slot="footer">
    <sherpa-button id="confirm-cancel">Cancel</sherpa-button>
    <sherpa-button id="confirm-delete" data-look="saturated"
                   data-icon-start="trash">Delete</sherpa-button>
  </sherpa-container-footer>
</sherpa-dialog>

<!-- SAVE FILTER names the answered fields, kept as one saved filter. A dialog
     of its own, like the two above. TRAP T-save-packs-the-fields-into-one-chip -->
<sherpa-dialog id="save-filter" data-heading="Save filter">
  <sherpa-input-text id="save-filter-name" data-label="Name" placeholder="My filter"
                     autocomplete="off" required></sherpa-input-text>

  <sherpa-container-footer slot="footer">
    <sherpa-button id="save-filter-cancel">Cancel</sherpa-button>
    <sherpa-button id="save-filter-ok" data-look="saturated">Save</sherpa-button>
  </sherpa-container-footer>
</sherpa-dialog>

<!-- No toast region: sherpa-toast makes its own `.sherpa-toast-stack` on first
     use, so a hand-made one is a second stack in a different corner. -->
