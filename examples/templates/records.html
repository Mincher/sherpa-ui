<!-- Content-only markup for the "records" view.
     Served by the template server (GET /template/view/records) and injected into
     the app-shell's default (content) slot by the SPA router in index.html.
     views/records.js builds the data and populates the grid / toolbar / dialog. -->
<div class="view">
  <!-- Heading and table both sit on the layout grid, so their left edges align
       and the table picks up the breakpoint's padding and max width. -->
  <div class="sherpa-grid">
    <sherpa-section-header data-span="full" data-heading="Customers">
      <span slot="description">Manage customer accounts, plans and billing.</span>
      <sherpa-button slot="actions" id="add-btn" data-look="saturated" data-icon-start="&#43;">
        Add customer
      </sherpa-button>
    </sherpa-section-header>
  </div>

  <div class="sherpa-grid">
    <!-- A data table always wants every column it can get. -->
    <div class="panel" data-span="full">
      <sherpa-quick-filter-toolbar id="qft"></sherpa-quick-filter-toolbar>
      <sherpa-data-grid id="grid" data-selectable data-filterable></sherpa-data-grid>
      <sherpa-pagination
        id="pager"
        data-page="1"
        data-page-size="10"
        data-total-pages="3"
        data-rows-options="10,25,50"></sherpa-pagination>
    </div>
  </div>
</div>

<!-- Add / edit customer dialog. -->
<sherpa-dialog id="dialog" data-heading="Add customer">
  <div class="form">
    <sherpa-input-text id="f-name" data-label="Name" placeholder="Jane Doe" required></sherpa-input-text>
    <sherpa-input-text id="f-email" data-label="Email" type="email" placeholder="jane@acme.com" required></sherpa-input-text>
    <sherpa-select-group id="f-plan" data-label="Plan"></sherpa-select-group>
  </div>
  <div slot="footer" class="dialog-footer">
    <sherpa-button id="cancel-btn">Cancel</sherpa-button>
    <sherpa-button id="save-btn" data-look="saturated">Save</sherpa-button>
  </div>
</sherpa-dialog>

<!-- Toast feedback region. -->
<div class="toast-region" id="toasts"></div>
