<!-- Content-only markup for the "records" Context, injected into the app-shell's
     content slot by the SPA router. contexts/records.js wires the data.
     No section header: the APP HEADER owns the Context's name. -->
<!-- data-rows="fit": every row is one metric tall and the LAST row takes the
     rest, so the Context fills the content area and nothing scrolls but the
     grid inside its own card. Six rows: metrics 1, charts 4, the records card 1.
     TRAP T-a-content-grid-has-two-row-modes -->
<!-- data-fill: the stack takes the content area's height and hands the spare
     to the GRID, so the panel is as tall as the content beside it.
     The panel sits OUTSIDE the grid on purpose: `data-col-span="full"` is a
     hardcoded `span 12`, so a `full` child cannot know a sibling column is
     beside it. Narrowing the grid's own box is what makes `full` mean full.
     TRAP T-the-panel-is-the-toolbar-in-a-column -->
<!-- What the components cannot own: a search that HIDES a chip, and the
     field spacing between two composed stacks. Everything else — the heading
     row, the wrapping value row, the gaps — is a sherpa component's job. -->
<style>
  /* The search hides a chip; JS writes the flag, CSS owns the hiding. */
  #filter-panel .panel-value[data-filtered-out] { display: none; }

  /* CONDITION MODE REPLACES the value chips — the rows are the answer now,
     and two answers side by side is the thing this mode exists to avoid. */
  #filter-panel .panel-field[data-conditional-open] .panel-values { display: none; }

  /* A field the search emptied says so rather than showing a bare label. */
  #filter-panel .panel-field[data-no-matches] .panel-values::after {
    content: "No matches";
    font-size: var(--sherpa-font-size-body-small, 12px);
    color: var(--sherpa-theme-content-body-2, #b3b3c3);
  }

  #filter-panel .panel-field + .panel-field,
  #filter-panel sherpa-accordion + sherpa-accordion {
    margin-block-start: var(--sherpa-display-mode-space-md, 16px);
  }

  /* The BODY scrolls, not the panel — the search and the footer stay put.
     `::part` is the only way in: the body is in the panel's shadow root. */
  #filter-panel::part(body) { overflow: auto; }

  /* The search fills its row: a header's metadata strip is a flex row, and a
     field in it otherwise hugs its own content. */
  #filter-panel .panel-search { flex: 1 1 auto; }
</style>

<sherpa-stack data-direction="inline" data-gap="md" data-fill>
  <!-- THE FILTER PANEL — the same filters the toolbars hold, in a column
       instead of a row. Hidden until the toolbar's Configure button asks.
       TWO accordions, one per SCOPE; inside each, a field is a header row plus
       a wrapping row of boolean chips. ONE search and ONE footer for the whole
       panel: Apply commits every field at once.
       288px = 3 columns at the desktop breakpoint. records.js fills it. -->
  <!-- The panel's top and bottom meet the metrics and the pager beside it.
       `margin-block` matches the layout grid's own 16px inset, which the panel
       does not carry — without it the panel overshoots the content by 16 at
       each end. A FIXED box whose BODY scrolls, never one that grows with its
       content: the search and the footer must stay put. -->
  <sherpa-panel id="filter-panel" hidden
                style="flex: 0 0 auto; inline-size: 288px; box-shadow: none;
                       block-size: calc(100% - var(--sherpa-display-mode-space-md, 16px) * 2);
                       margin-block: var(--sherpa-display-mode-space-md, 16px)">
    <!-- The GENERIC header. `data-type="panel"` only paints the title
         link-blue, which is the overlay look; this is a FIXED panel. -->
    <sherpa-container-header slot="header"
                             data-heading="Filters" data-icon="filter"
                             data-dismissible>
      <!-- ONE search, across every value chip in the panel. The metadata row
           is the header's own bottom row, so it spans the full width. -->
      <sherpa-input-text slot="metadata" class="panel-search"
                         data-icon-start="magnifying-glass"
                         placeholder="Search filters" autocomplete="off"
                         aria-label="Search every filter"></sherpa-input-text>
    </sherpa-container-header>

    <!-- ONE footer. Apply commits every field; Discard reverts to the last
         Apply, which is why it is not called Cancel. -->
    <sherpa-container-footer slot="footer" data-align="end">
      <sherpa-button class="panel-discard">Discard</sherpa-button>
      <sherpa-button class="panel-apply" data-look="saturated">Apply</sherpa-button>
    </sherpa-container-footer>
  </sherpa-panel>

  <!-- data-grow: the grid takes what the panel leaves. -->
  <sherpa-layout-grid data-rows="fit" data-row-count="6" data-grow>

  <!-- SUMMARIES OF THE SAME ROWS. Every one is bound to the Context's DataSource
       with an `as` adapter, so a filter set anywhere re-computes all of them.
       Nothing here is hardcoded and nothing recounts by hand.
       records.js binds each one with `scope: 'all'`. -->
  <sherpa-metric id="m-customers" data-col-span="xsmall"></sherpa-metric>
  <sherpa-metric id="m-spend" data-col-span="xsmall"></sherpa-metric>
  <sherpa-metric id="m-seats" data-col-span="xsmall"></sherpa-metric>
  <sherpa-metric id="m-tickets" data-col-span="xsmall"></sherpa-metric>

  <sherpa-container data-col-span="medium" data-row-span="4">
    <sherpa-container-header slot="header" data-heading="By status"></sherpa-container-header>
    <sherpa-barchart id="r-bar" data-legend="horizontal">
      <sherpa-chart-legend slot="legend" id="r-bar-legend"
                           data-orientation="horizontal"></sherpa-chart-legend>
    </sherpa-barchart>
  </sherpa-container>

  <sherpa-container data-col-span="medium" data-row-span="4">
    <sherpa-container-header slot="header" data-heading="By plan"></sherpa-container-header>
    <!-- No data-label: the centre TOTALS what the ring draws, so it follows
         every filter. TRAP T-the-centre-totals-what-the-ring-draws -->
    <sherpa-radial-chart id="r-donut" data-sublabel="customers">
      <sherpa-chart-legend slot="legend" id="r-donut-legend"
                           data-orientation="vertical"></sherpa-chart-legend>
    </sherpa-radial-chart>
  </sherpa-container>

  <!-- The gauge's legend names its ZONES, not a series, so it is read-only. -->
  <sherpa-container data-col-span="medium" data-row-span="4">
    <sherpa-container-header slot="header" data-heading="Mean risk"></sherpa-container-header>
    <sherpa-gauge-chart
      id="r-gauge"
      data-min="0"
      data-max="100"
      data-unit="%"
      data-zones="0-20:success,20-40:warning,40-100:critical"
      data-legend="horizontal">
      <sherpa-chart-legend slot="legend" id="r-gauge-legend"
                           data-orientation="horizontal" data-readonly></sherpa-chart-legend>
    </sherpa-gauge-chart>
  </sherpa-container>

  <!-- data-grow: this card takes whatever the rows above leave, so the grid
       scrolls inside it instead of pushing the pager off screen. No data-rows
       here — the fit grid decides the height. data-padding="none" keeps the
       block inset at zero so each part's own divider meets both card edges. -->
  <sherpa-container data-col-span="full" data-grow
                    data-padding="none" data-padding-inline="md" data-fill>

    <!-- The toolbar brings its own padding and bottom rule, so the container
         leaves it bare (see .header ::slotted in sherpa-container.css). -->
    <sherpa-toolbar slot="header" id="grid-actions">
      <sherpa-button slot="leading" id="add-btn"
                     data-look="saturated" data-icon-start="plus">
        Add customer
      </sherpa-button>

      <!-- BULK ACTIONS — filled by records.js from `grid.actionsFor(count)`, so
           they cannot disagree with the row menu. Actions lead (after the CTA),
           the count trails, or it shifts the buttons on every tick. Empty here,
           not absent; CSS hides an empty container. Inline flex because a plain
           block leaves two actions flush against each other. -->
      <span slot="leading" id="bulk-actions"
            style="display: flex; align-items: center;
                   gap: var(--sherpa-display-mode-space-xs, 8px)"></span>
      <span slot="trailing" id="bulk-count" class="bulk-count" hidden></span>
    </sherpa-toolbar>

    <!-- data-gap="md": the filter toolbar has no rule of its own (Figma's
         Type=data bar binds a bottom stroke weight but paints no stroke), so at
         "none" the grid sits flush against it. -->
    <sherpa-stack data-gap="md" data-grow data-fill>
      <sherpa-quick-filter-toolbar id="qft"></sherpa-quick-filter-toolbar>
      <!-- data-grow: takes the card's leftover height, so the grid scrolls
           INSIDE the card while header and footer stay put. -->
      <sherpa-data-grid id="grid" data-grow data-selectable data-column-filters></sherpa-data-grid>
    </sherpa-stack>

    <!-- The pager carries its own padding and top rule, so the container leaves
         it bare. No data-page-size — the component defaults to 25. The source
         overwrites data-page and data-total-pages, so these are pre-JS only. -->
    <sherpa-pagination
      slot="footer"
      id="pager"
      data-page="1"
      data-total-pages="4"
      data-rows-options="10,25,50,100"></sherpa-pagination>
  </sherpa-container>
  </sherpa-layout-grid>
</sherpa-stack>

<!-- Add / edit customer dialog. -->
<sherpa-dialog id="dialog" data-heading="Add customer">
  <sherpa-stack>
    <sherpa-input-text id="f-name" data-label="Name" placeholder="Jane Doe" required></sherpa-input-text>
    <sherpa-input-text id="f-email" data-label="Email" type="email" placeholder="jane@acme.com" required></sherpa-input-text>
    <!-- EVERY record belongs to a customer organisation. Without this the
         record was saved with no `customer` and the Customer filter — which
         only sees values the data carries — could never find it.
         TRAP T-a-chip-filters-the-values-the-data-has -->
    <sherpa-input-text id="f-customer" data-label="Customer" data-type="select" required></sherpa-input-text>
    <sherpa-select-group id="f-plan" data-label="Plan"></sherpa-select-group>
  </sherpa-stack>

  <!-- Container Footer brings its own padding, divider and end alignment; the
       dialog's CSS knows not to add a second set around a composed one. -->
  <sherpa-container-footer slot="footer">
    <sherpa-button id="cancel-btn">Cancel</sherpa-button>
    <sherpa-button id="save-btn" data-look="saturated">Save</sherpa-button>
  </sherpa-container-footer>
</sherpa-dialog>

<!-- A SECOND dialog, not the add/edit one re-labelled — re-use means every open
     has to undo what the last one set. data-status="critical" re-points the card
     and the Delete button from one attribute. The Context writes the message. -->
<sherpa-dialog id="confirm" data-heading="Delete customer?" data-status="critical">
  <!-- Margin zeroed inline: the dialog body already brings its padding and the
       browser's own <p> margins would add to it. -->
  <p id="confirm-text" style="margin: 0"></p>

  <sherpa-container-footer slot="footer">
    <sherpa-button id="confirm-cancel">Cancel</sherpa-button>
    <sherpa-button id="confirm-delete" data-look="saturated"
                   data-icon-start="trash">Delete</sherpa-button>
  </sherpa-container-footer>
</sherpa-dialog>

<!-- No toast region: sherpa-toast makes its own `.sherpa-toast-stack` on first
     use, so a hand-made one is a second stack in a different corner. -->
