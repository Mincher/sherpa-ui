<!-- Settings › Application. One page, a section header before each set of
     settings; the header's Jump to chip lists them. -->
<sherpa-layout-grid>
  <sherpa-stack data-col-span="reading" data-gap="2xl">
    <sherpa-stack>
      <sherpa-section-header id="section-notifications" data-heading="Notifications">
        <span slot="description">What we send you, and where.</span>
      </sherpa-section-header>
      <sherpa-list>
        <sherpa-list-item data-label="Email notifications"
                          data-description="Weekly digest and mentions.">
          <sherpa-switch slot="trailing" id="notify-email" name="notify-email" checked></sherpa-switch>
        </sherpa-list-item>
        <sherpa-list-item data-label="Browser notifications"
                          data-description="Alerts while the app is open.">
          <sherpa-switch slot="trailing" id="notify-browser" name="notify-browser"></sherpa-switch>
        </sherpa-list-item>
      </sherpa-list>
    </sherpa-stack>

    <sherpa-stack>
      <sherpa-section-header id="section-filtering" data-heading="Filtering">
        <span slot="description">What happens to filters you have not saved.</span>
      </sherpa-section-header>
      <sherpa-list>
        <sherpa-list-item data-label="Keep each view's filters while I switch views"
                          data-description="Come back to a view and find the filters you left on it.">
          <sherpa-switch slot="trailing" id="filters-drafts" name="filters-drafts" checked></sherpa-switch>
        </sherpa-list-item>
        <sherpa-list-item data-label="Keep them across sessions"
                          data-description="A closed tab or a crash does not lose them.">
          <sherpa-switch slot="trailing" id="filters-drafts-across" name="filters-drafts-across" checked></sherpa-switch>
        </sherpa-list-item>
        <sherpa-list-item data-label="Limit filter options to matching rows"
                          data-description="A value your other filters rule out is greyed, and cannot be picked.">
          <sherpa-switch slot="trailing" id="filters-limit" name="filters-limit"></sherpa-switch>
        </sherpa-list-item>
      </sherpa-list>
    </sherpa-stack>

    <sherpa-stack>
      <sherpa-section-header id="section-navigation" data-heading="Navigation">
        <span slot="description">What the navigation panel lists.</span>
      </sherpa-section-header>
      <sherpa-list>
        <sherpa-list-item data-label="Show full view hierarchy"
                          data-description="List each page's preset and saved views under it.">
          <sherpa-switch slot="trailing" id="nav-hierarchy" name="nav-hierarchy"></sherpa-switch>
        </sherpa-list-item>
      </sherpa-list>
    </sherpa-stack>

    <sherpa-stack>
      <sherpa-section-header id="section-experiments" data-heading="Experiments">
        <span slot="description">Ideas on trial. They may change, or go.</span>
      </sherpa-section-header>
      <sherpa-list>
        <sherpa-list-item data-label="Compact metrics header"
                          data-description="Metrics you scroll past gather into a small header at the top.">
          <sherpa-switch slot="trailing" id="experiment-sticky-metrics" name="experiment-sticky-metrics"></sherpa-switch>
        </sherpa-list-item>
        <sherpa-list-item data-label="Keep the content while data loads"
                          data-description="A thin bar shows loading, and a banner says what went wrong. The last data stays.">
          <sherpa-switch slot="trailing" id="experiment-keep-content" name="experiment-keep-content"></sherpa-switch>
        </sherpa-list-item>
      </sherpa-list>
    </sherpa-stack>
  </sherpa-stack>
</sherpa-layout-grid>
