<!-- Settings › Accessibility. The container holds the Display View; the View chip
     swaps its children for another View's (contexts/settings-views.js). -->
<form novalidate>
  <sherpa-layout-grid>

    <sherpa-container data-col-span="reading" id="view-region">
      <sherpa-container-header slot="header"
                               data-heading="Display"
                               data-description="Make the app easier to see."></sherpa-container-header>
      <sherpa-list>
        <sherpa-list-item data-label="Increase contrast"
                          data-description="Stronger borders and text.">
          <sherpa-switch slot="trailing" name="contrast"></sherpa-switch>
        </sherpa-list-item>
        <sherpa-list-item data-label="Underline links"
                          data-description="Show links with an underline, not colour alone.">
          <sherpa-switch slot="trailing" name="underline-links"></sherpa-switch>
        </sherpa-list-item>
      </sherpa-list>
    </sherpa-container>

    <sherpa-container-footer data-col-span="reading" data-align="end">
      <sherpa-button type="button" class="cancel-btn">Cancel</sherpa-button>
      <sherpa-button type="submit" data-look="saturated">Save changes</sherpa-button>
    </sherpa-container-footer>

  </sherpa-layout-grid>
</form>
