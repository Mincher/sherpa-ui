<!-- Content-only markup for the "settings" view.
     Served by the template server (GET /template/view/settings) and injected into
     the app-shell's default (content) slot by the SPA router in index.html.
     views/settings.js populates the data-driven controls and wires events.

     EVERY box here is a Sherpa component or the projected layout grid. There is
     no view-level CSS: the grid places the cards, sherpa-container draws them,
     and sherpa-stack runs the fields down each one.

     Settings is a single reading column ON the grid: 8 of 12 on desktop rather
     than a hardcoded pixel measure, so it comes from the same track system as
     every other view and re-flows at the breakpoints for free. -->
<form id="settings-form" novalidate>
  <div class="sherpa-grid">

    <!-- ── Profile ─────────────────────────────────────────────── -->
    <sherpa-container data-span="8">
      <sherpa-container-header slot="header"
                               data-heading="Profile"
                               data-description="How you appear to your team."></sherpa-container-header>
      <sherpa-stack>
        <sherpa-input-text
          data-label="Full name"
          data-description="Shown on your profile and in comments."
          name="name"
          value="Will Mincher"
          placeholder="Your name"></sherpa-input-text>

        <sherpa-input-text
          data-label="Email"
          data-error="Enter a valid work email address."
          name="email"
          value="not-an-email"
          placeholder="you@example.com"></sherpa-input-text>

        <sherpa-input-text
          data-label="Bio"
          data-description="A short line about you (optional)."
          data-multiline
          name="bio"
          maxlength="240"
          placeholder="Tell us a little about yourself…"></sherpa-input-text>
      </sherpa-stack>
    </sherpa-container>

    <!-- ── Preferences ─────────────────────────────────────────── -->
    <sherpa-container data-span="8">
      <sherpa-container-header slot="header"
                               data-heading="Preferences"
                               data-description="Control notifications and appearance."></sherpa-container-header>
      <sherpa-stack data-gap="xl">
        <!-- A labelled row with a control on the end IS a list item: a title, a
             description under it, and a `trailing` slot. It was three hand-written
             CSS rules (a flex row, a nested column, two font sizes) re-drawing a
             component that already existed — and the type scale in those rules had
             drifted off the token scale.

             sherpa-list carries the rows so the dividers between them are the
             list's, not a border each row draws for itself. -->
        <sherpa-list>
          <sherpa-list-item data-label="Email notifications"
                            data-description="Weekly digest and mentions.">
            <sherpa-switch slot="trailing" id="sw-email" name="notify" checked></sherpa-switch>
          </sherpa-list-item>
          <sherpa-list-item data-label="Dark mode"
                            data-description="Toggle the whole app between light and dark.">
            <sherpa-switch slot="trailing" id="sw-dark" name="dark"></sherpa-switch>
          </sherpa-list-item>
          <sherpa-list-item data-label="Compact density"
                            data-description="Tighten spacing across dense views.">
            <sherpa-switch slot="trailing" id="sw-compact" name="compact" data-style="simple"></sherpa-switch>
          </sherpa-list-item>
        </sherpa-list>

        <!-- Theme radios via populate([{value,label,description}]) -->
        <sherpa-select-group
          id="theme-group"
          data-label="Colour theme"
          data-description="Applied the next time the app loads."></sherpa-select-group>

        <!-- Slider via populate({ value }) -->
        <sherpa-slider
          id="page-size"
          data-label="Items per page"
          data-show-value
          min="10" max="100" step="10"></sherpa-slider>
      </sherpa-stack>
    </sherpa-container>

    <!-- ── Plan ────────────────────────────────────────────────── -->
    <sherpa-container data-span="8">
      <sherpa-container-header slot="header"
                               data-heading="Plan features"
                               data-description="Turn optional capabilities on or off."></sherpa-container-header>
      <sherpa-select-group id="features" data-label="Included features" data-multiple>
        <!-- data-wrap: the three cards share one row on a desktop and fall to one
             per row on a phone, each floored at data-min-item. No media query and
             no grid definition — the row does it. -->
        <sherpa-stack slot="options" data-direction="inline" data-gap="lg" data-wrap>
          <sherpa-select-card
            data-select-mode="checkbox"
            data-label="Advanced analytics"
            data-description="Trend charts and exports."
            name="features" value="analytics" data-selected></sherpa-select-card>
          <sherpa-select-card
            data-select-mode="checkbox"
            data-label="API access"
            data-description="Programmatic tokens + webhooks."
            name="features" value="api"></sherpa-select-card>
          <sherpa-select-card
            data-select-mode="checkbox"
            data-label="Priority support"
            data-description="24/7 response SLA."
            name="features" value="support" data-selected></sherpa-select-card>
        </sherpa-stack>
      </sherpa-select-group>
    </sherpa-container>

    <!-- ── Note + actions ──────────────────────────────────────── -->
    <sherpa-callout data-span="8" data-status="info" data-heading="Heads up">
      Changes apply immediately for you, and roll out to your team within a few minutes.
    </sherpa-callout>

    <!-- Figma Container Footer/action-bar: Cancel is the DEFAULT look (white face,
         grey ring); only Apply takes the Saturated primary. -->
    <sherpa-container-footer data-span="8" data-align="end">
      <sherpa-button type="button" id="cancel-btn">Cancel</sherpa-button>
      <sherpa-button type="submit" id="save-btn" data-look="saturated">Save changes</sherpa-button>
    </sherpa-container-footer>

  </div>
</form>
