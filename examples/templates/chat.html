<!-- Content-only markup for the "chat" view.
     Served by the template server (GET /template/view/chat) and injected into
     the app-shell's default (content) slot by the SPA router in index.html.
     views/chat.js wires the composer/thread. The router toggles the shell's
     data-no-header for this view (chat wants a full-height content region). -->
<!-- The chat view as ONE card that fills the content region.

     data-rows="12" gives it a real height in layout-grid rows, which is what lets
     the thread scroll inside it rather than the page scrolling as a whole; the
     footer then stays pinned at the bottom because it is the CARD's footer, not
     an element the page positions.

     The composer dock was a hand-drawn `border-block-start` + padding. That IS
     sherpa-container's footer region: it already carries the 0.5px
     border/default/+1 divider and the Figma 8x16 padding.

     data-padding="none": each message carries its own spacing, so a card inset
     would be a second one. -->
<sherpa-container data-rows="12" data-padding="none">
  <!-- data-grow takes the card's spare height, data-scroll makes the overflow
       scroll here rather than moving the page, and data-measure caps the line
       length so a wide screen does not make the text hard to read. -->
  <sherpa-stack id="thread" data-gap="xl" data-grow data-scroll data-measure
                role="log" aria-live="polite" aria-label="Conversation">

    <sherpa-chat-message
      data-type="system"
      data-message="New conversation started · Assistant v4">
    </sherpa-chat-message>

    <sherpa-chat-message
      data-type="user"
      data-name="Will"
      data-timestamp="09:41"
      data-message="Hey — can you help me debounce a search input in vanilla JS?">
    </sherpa-chat-message>

    <sherpa-chat-message
      data-type="assistant"
      data-name="Assistant"
      data-timestamp="09:41"
      data-message="Sure. Debouncing waits until the user stops typing before firing the handler. Here's a small reusable helper:">
    </sherpa-chat-message>

    <sherpa-chat-message data-type="assistant" data-name="Assistant" data-timestamp="09:41">
      <sherpa-code-block
        data-language="javascript"
        data-line-numbers
        data-code="function debounce(fn, delay = 300) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
}

const search = debounce((q) => fetchResults(q), 250);
input.addEventListener('input', (e) => search(e.target.value));">
      </sherpa-code-block>
    </sherpa-chat-message>

    <sherpa-chat-message
      data-type="user"
      data-name="Will"
      data-timestamp="09:42"
      data-message="Nice. What's a sensible default delay for a type-ahead?">
    </sherpa-chat-message>

    <sherpa-chat-message
      data-type="assistant"
      data-name="Assistant"
      data-timestamp="09:42"
      data-message="200–300ms feels responsive without hammering the network. Go lower (150ms) for local filtering, higher (400ms+) if each keystroke hits an expensive API.">
    </sherpa-chat-message>

    <sherpa-chat-message
      data-type="user"
      data-name="Will"
      data-timestamp="09:43"
      data-message="Great — and should I cancel in-flight requests too?">
    </sherpa-chat-message>

    <sherpa-chat-message
      data-type="assistant"
      data-name="Assistant"
      data-timestamp="09:43"
      data-message="Yes. Pair the debounce with an AbortController so a newer query cancels the older fetch — that avoids out-of-order responses overwriting fresh results.">
    </sherpa-chat-message>

    <!-- Typing indicator — toggled via [hidden] from JS. -->
    <sherpa-loader id="typing" data-size="sm" hidden>
      <span slot="label">Assistant is typing…</span>
    </sherpa-loader>

  </sherpa-stack>

  <sherpa-container-footer slot="footer" data-align="stretch">
    <!-- The composer takes the SAME measure as the thread above it, or the
         messages sit in a centred column while the input runs edge to edge. -->
    <sherpa-prompt-composer
      id="composer"
      data-placeholder="Message the assistant… (Enter to send, Shift+Enter for a newline)">
    </sherpa-prompt-composer>
  </sherpa-container-footer>
</sherpa-container>
