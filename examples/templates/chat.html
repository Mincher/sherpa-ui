<!-- Content-only markup for the "chat" view, injected into the app-shell's
     content slot by the SPA router. views/chat.js wires the composer/thread.
     The router sets the shell's data-no-header here — chat wants full height. -->
<!-- data-row-span="12" gives the card a real height in grid rows, so the thread
     scrolls inside it instead of the page scrolling. The composer sits in the
     card's own footer region, which already carries the divider and padding.
     data-padding="none": each message carries its own spacing. -->
<sherpa-container data-row-span="12" data-padding="none">
  <!-- data-scroll keeps overflow in the card; data-measure caps line length. -->
  <sherpa-stack id="thread" data-gap="xl" data-grow data-scroll data-measure
                role="log" aria-live="polite" aria-label="Conversation">

    <sherpa-chat-message
      data-type="system"
      data-message="New conversation started · Assistant v4">
    </sherpa-chat-message>

    <sherpa-chat-message
      data-type="user"
      data-name="Will"
      data-timestamp="09:41"
      data-message="Hey — can you help me debounce a search input in vanilla JS?">
    </sherpa-chat-message>

    <sherpa-chat-message
      data-type="assistant"
      data-name="Assistant"
      data-timestamp="09:41"
      data-message="Sure. Debouncing waits until the user stops typing before firing the handler. Here's a small reusable helper:">
    </sherpa-chat-message>

    <sherpa-chat-message data-type="assistant" data-name="Assistant" data-timestamp="09:41">
      <sherpa-code-block
        data-language="javascript"
        data-line-numbers
        data-code="function debounce(fn, delay = 300) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
}

const search = debounce((q) => fetchResults(q), 250);
input.addEventListener('input', (e) => search(e.target.value));">
      </sherpa-code-block>
    </sherpa-chat-message>

    <sherpa-chat-message
      data-type="user"
      data-name="Will"
      data-timestamp="09:42"
      data-message="Nice. What's a sensible default delay for a type-ahead?">
    </sherpa-chat-message>

    <sherpa-chat-message
      data-type="assistant"
      data-name="Assistant"
      data-timestamp="09:42"
      data-message="200–300ms feels responsive without hammering the network. Go lower (150ms) for local filtering, higher (400ms+) if each keystroke hits an expensive API.">
    </sherpa-chat-message>

    <sherpa-chat-message
      data-type="user"
      data-name="Will"
      data-timestamp="09:43"
      data-message="Great — and should I cancel in-flight requests too?">
    </sherpa-chat-message>

    <sherpa-chat-message
      data-type="assistant"
      data-name="Assistant"
      data-timestamp="09:43"
      data-message="Yes. Pair the debounce with an AbortController so a newer query cancels the older fetch — that avoids out-of-order responses overwriting fresh results.">
    </sherpa-chat-message>

    <!-- Toggled via [hidden] from JS. -->
    <sherpa-loader id="typing" data-size="sm" hidden>
      <span slot="label">Assistant is typing…</span>
    </sherpa-loader>

  </sherpa-stack>

  <sherpa-container-footer slot="footer" data-align="stretch">
    <!-- Same measure as the thread, or the input runs edge to edge under a
         centred column of messages. -->
    <sherpa-prompt-composer
      id="composer"
      data-placeholder="Message the assistant… (Enter to send, Shift+Enter for a newline)">
    </sherpa-prompt-composer>
  </sherpa-container-footer>
</sherpa-container>
