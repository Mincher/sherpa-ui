<!-- Content-only markup for the "dashboard" view.
     Served by the template server (GET /template/view/dashboard) and injected
     into the app-shell's default (content) slot by the SPA router in index.html.
     The shell + nav + header live ONCE in index.html; this is JUST the content.
     views/dashboard.js populates the metrics/charts and wires events.

     EVERY box here is a Sherpa component or the projected layout grid. There is
     no view-level CSS: the grid places the cards, sherpa-container draws them,
     and each chart owns the split with its own legend. -->

<!--
  ONE GRID for the whole view.

  The metrics, the charts and the summary were three separate .sherpa-grid
  elements, which meant three independent column systems stacked on top of each
  other: a metric's left edge and a chart card's left edge only lined up because
  both happened to start at column 1. Any span that did not divide evenly would
  have drifted out of step, and the gap BETWEEN the groups was the wrapper's
  margin rather than the grid's own row gap.

  One grid puts every item on the same 12 columns, so the edges line up by
  construction and the vertical rhythm is the grid's throughout. `data-span`
  still wraps each row: 3+3+3+3 fills a row of metrics, 4+4+4 a row of charts,
  then 12 and finally full.

  NO section header. The APP HEADER owns the view's name (views/dashboard.js
  sets data-heading="Dashboard"), so a heading here repeated it a second time a
  few pixels lower. A view's content starts with its content.
-->
<div class="sherpa-grid">
  <!-- Metric tiles: 3 of 12 on desktop (so four fit a row), 4 of 8 on tablet (two
       per row), full width on mobile. The span is clamped to the breakpoint's
       column count, so nothing overflows. -->
  <sherpa-metric id="m-endpoints" data-span="3"></sherpa-metric>
  <sherpa-metric id="m-alerts" data-span="3"></sherpa-metric>
  <sherpa-metric id="m-uptime" data-span="3"></sherpa-metric>
  <sherpa-metric id="m-patch" data-span="3"></sherpa-metric>

  <!--
    Chart cards.

    `data-rows` sizes the card in LAYOUT GRID ROWS (sherpa-container reads it), so
    a card is a fixed height and its content fills it. That is what stops a card
    growing with its data, and what gives a chart a real height to draw into
    rather than hugging its own minimum and leaving the card part empty.

    The legend is SLOTTED INTO THE CHART, not placed beside it by this page: a
    categorical series is only readable if the reader can name the colours, so
    the pair is one thing and the ratio between them is the chart's business.
    Horizontal → the chart puts it below the plot; vertical → beside it.
  -->
  <sherpa-container data-span="4" data-rows="6">
    <sherpa-container-header slot="header" data-heading="Alerts by category"></sherpa-container-header>
    <sherpa-barchart id="bar" data-label="Alerts by category" data-legend="horizontal">
      <sherpa-chart-legend slot="legend" id="bar-legend" data-orientation="horizontal"></sherpa-chart-legend>
    </sherpa-barchart>
  </sherpa-container>

  <sherpa-container data-span="4" data-rows="6">
    <sherpa-container-header slot="header" data-heading="Endpoints by OS"></sherpa-container-header>
    <sherpa-donut-chart id="donut" data-label="1,284" data-sublabel="endpoints">
      <sherpa-chart-legend slot="legend" id="donut-legend" data-orientation="vertical"></sherpa-chart-legend>
    </sherpa-donut-chart>
  </sherpa-container>

  <sherpa-container data-span="4" data-rows="6">
    <sherpa-container-header slot="header" data-heading="Storage used"></sherpa-container-header>
    <!-- The gauge's legend names its ZONES rather than a data series — the bands
         are meaningless without the thresholds they stand for. READ-ONLY: a gauge
         shows one value, so there is no series to toggle off.

         A zone names its own status, and the gauge resolves that to
         `--sherpa-status-<name>-fill` / `--sherpa-status-<name>`. It needs no
         `data-palette`: a status is a MODE in that palette (sequence 1 is the
         whole green ramp), and a gauge paints several at once, so it cannot pin
         one. -->
    <sherpa-gauge-chart
      id="gauge"
      data-min="0"
      data-max="100"
      data-unit="%"
      data-caption="4.2 TB of 6 TB used"
      data-zones="0-60:success,60-85:warning,85-100:critical"
      data-legend="horizontal">
      <sherpa-chart-legend slot="legend" id="gauge-legend" data-orientation="horizontal" data-readonly></sherpa-chart-legend>
    </sherpa-gauge-chart>
  </sherpa-container>

  <!-- A time series needs horizontal room, so it takes 12 of 12. -->
  <sherpa-container data-span="12" data-rows="6">
    <sherpa-container-header slot="header" data-heading="Sessions vs. incidents"></sherpa-container-header>
    <sherpa-line-chart id="line" data-type="area" data-label="Sessions vs. incidents" data-legend="horizontal">
      <sherpa-chart-legend slot="legend" id="line-legend" data-orientation="horizontal"></sherpa-chart-legend>
    </sherpa-line-chart>
  </sherpa-container>

  <!-- Summary spans the full width, whatever the breakpoint. It has no data-rows:
       a key-value list is as tall as its content and has nothing to fill. -->
  <sherpa-container data-span="full">
    <sherpa-container-header slot="header" data-heading="Summary"></sherpa-container-header>
    <sherpa-key-value-list id="kv" data-orientation="horizontal"></sherpa-key-value-list>
  </sherpa-container>
</div>
