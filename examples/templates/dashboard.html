<!-- Content-only markup for the "dashboard" view.
     Served by the template server (GET /template/view/dashboard) and injected
     into the app-shell's default (content) slot by the SPA router in index.html.
     The shell + nav + header live ONCE in index.html; this is JUST the content.
     views/dashboard.js populates the metrics/charts and wires events. -->
<div class="view">
  <sherpa-section-header
    data-heading="Overview"
    data-size="lg">
    <span slot="description">Fleet health and endpoint activity across the last 30 days.</span>
  </sherpa-section-header>

  <!-- Metric tiles with embedded sparklines. -->
  <div class="metrics">
    <sherpa-metric id="m-endpoints"></sherpa-metric>
    <sherpa-metric id="m-alerts"></sherpa-metric>
    <sherpa-metric id="m-uptime"></sherpa-metric>
    <sherpa-metric id="m-patch"></sherpa-metric>
  </div>

  <!-- Charts grid. -->
  <div class="charts">
    <div class="panel">
      <h3>Alerts by category</h3>
      <sherpa-barchart id="bar" data-label="Alerts by category"></sherpa-barchart>
    </div>

    <div class="panel">
      <h3>Endpoints by OS</h3>
      <sherpa-donut-chart id="donut" data-label="1,284" data-sublabel="endpoints">
        <sherpa-chart-legend slot="legend" id="donut-legend" data-orientation="vertical"></sherpa-chart-legend>
      </sherpa-donut-chart>
    </div>

    <div class="panel">
      <h3>Storage used</h3>
      <sherpa-gauge-chart
        id="gauge"
        data-min="0"
        data-max="100"
        data-caption="4.2 TB of 6 TB used"
        data-zones="0-60:success,60-85:warning,85-100:critical"></sherpa-gauge-chart>
    </div>

    <div class="panel">
      <h3>Sessions vs. incidents</h3>
      <sherpa-line-chart id="line" data-variant="area" data-label="Sessions vs. incidents"></sherpa-line-chart>
      <sherpa-chart-legend id="line-legend"></sherpa-chart-legend>
    </div>
  </div>
</div>

<!-- Summary stats panel (spans below the grid). -->
<div class="summary">
  <div class="panel">
    <h3>Summary</h3>
    <sherpa-key-value-list id="kv" data-orientation="horizontal"></sherpa-key-value-list>
  </div>
</div>
