<!-- Content-only markup for the "dashboard" Context. Served by the template server
     (GET /template/context/dashboard) into the app-shell's content slot; the shell,
     nav and header live once in index.html. contexts/dashboard.js populates it. -->

<!-- ONE grid for the whole Context, so every card shares the same 12 columns and the
     vertical rhythm is the grid's own row gap. No section header: the app header
     owns the Context's name. -->
<!-- data-view-content: where a View with content of its own draws it. -->
<sherpa-layout-grid data-view-content>
  <!-- Span is clamped to the breakpoint's column count: 4 per row on desktop,
       2 on tablet, full on mobile. Each tile and chart DECLARES what it needs of
       the rows, and its provider answers. TRAP T-a-component-declares-its-summary -->
  <sherpa-metric id="m-endpoints" data-col-span="xsmall" data-label="Alerts"
                 data-aggregate="count" data-over-field="day"></sherpa-metric>
  <!-- Its OWN filter, critical only: it narrows this tile alone, and a View
       pick keeps it. TRAP T-a-component-default-outlives-a-view -->
  <sherpa-metric id="m-alerts" data-col-span="xsmall" data-label="Critical"
                 data-aggregate="count" data-over-field="day"
                 data-readings='{"severity":{"picked":["critical"]}}'></sherpa-metric>
  <sherpa-metric id="m-uptime" data-col-span="xsmall" data-label="Mean storage"
                 data-aggregate="mean" data-field="storage" data-over-field="day"
                 data-format='{"style":"unit","unit":"percent","maximumFractionDigits":0}'></sherpa-metric>
  <sherpa-metric id="m-patch" data-col-span="xsmall" data-label="Categories"
                 data-aggregate="distinct" data-field="category" data-over-field="day"></sherpa-metric>

  <!-- `data-rows` fixes the card height in layout grid rows, which gives the chart
       a real height to draw into. The legend is SLOTTED INTO the chart, not placed
       beside it here, so the chart owns the split. -->
  <sherpa-container data-col-span="medium" data-row-span="4">
    <sherpa-data-viz-header slot="header" data-heading="Alerts by category"></sherpa-data-viz-header>
    <!-- The legend reads its chart's field; a click narrows this chart alone. -->
    <sherpa-barchart id="bar" data-legend="horizontal" data-segment-field="category">
      <sherpa-chart-legend slot="legend" id="bar-legend" data-orientation="horizontal"></sherpa-chart-legend>
    </sherpa-barchart>
  </sherpa-container>

  <sherpa-container data-col-span="medium" data-row-span="4">
    <sherpa-data-viz-header slot="header" data-heading="Endpoints by OS"></sherpa-data-viz-header>
    <!-- No data-label: "1,284" was hardcoded and stayed put while the ring
         beneath it redrew. TRAP T-the-centre-totals-what-the-ring-draws -->
    <sherpa-radial-chart id="donut" data-sublabel="endpoints" data-segment-field="os">
      <sherpa-chart-legend slot="legend" id="donut-legend" data-orientation="vertical"></sherpa-chart-legend>
    </sherpa-radial-chart>
  </sherpa-container>

  <sherpa-container data-col-span="medium" data-row-span="4">
    <sherpa-data-viz-header slot="header" data-heading="Storage used"></sherpa-data-viz-header>
    <!-- The gauge's legend names its ZONES, not a series, so it is read-only. No
         `data-palette`: a zone's status is a mode in that palette and a gauge
         paints several at once, so it cannot pin one. -->
    <sherpa-gauge-chart
      id="gauge"
      data-aggregate="mean"
      data-field="storage"
      data-min="0"
      data-max="100"
      data-unit="%"
      data-caption="4.2 TB of 6 TB used"
      data-zones="0-60:success,60-85:warning,85-100:critical"
      data-legend="horizontal">
      <sherpa-chart-legend slot="legend" id="gauge-legend" data-orientation="horizontal" data-readonly></sherpa-chart-legend>
    </sherpa-gauge-chart>
  </sherpa-container>

  <!-- A time series needs horizontal room, so it takes 12 of 12. -->
  <sherpa-container data-col-span="full" data-row-span="4">
    <sherpa-data-viz-header slot="header" data-heading="Alerts by severity"></sherpa-data-viz-header>
    <sherpa-line-chart id="line" data-type="area" data-legend="horizontal"
                       data-over-field="day" data-segment-field="severity">
      <sherpa-chart-legend slot="legend" id="line-legend" data-orientation="horizontal"></sherpa-chart-legend>
    </sherpa-line-chart>
  </sherpa-container>

  <!-- No data-rows: a key-value list is as tall as its content. -->
  <sherpa-container data-col-span="full">
    <sherpa-container-header slot="header" data-heading="Summary"></sherpa-container-header>
    <sherpa-key-value-list id="kv" data-orientation="horizontal"></sherpa-key-value-list>
  </sherpa-container>
</sherpa-layout-grid>
