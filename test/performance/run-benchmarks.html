<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sherpa UI Performance Benchmarks</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/styles/index.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      background-color: #f5f5f5;
    }

    h1 {
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: #666;
      margin-bottom: 2rem;
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    button {
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      padding: 1rem;
      background: white;
      border-radius: 8px;
      margin-bottom: 2rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .status.running {
      border-left: 4px solid #2196f3;
    }

    .status.complete {
      border-left: 4px solid #4caf50;
    }

    .status.error {
      border-left: 4px solid #f44336;
    }

    .results {
      background: white;
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .result-item {
      padding: 1rem;
      margin-bottom: 1rem;
      background: #f9f9f9;
      border-radius: 4px;
      border-left: 4px solid #e0e0e0;
    }

    .result-item.passed {
      border-left-color: #4caf50;
    }

    .result-item.failed {
      border-left-color: #f44336;
    }

    .result-name {
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .result-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.5rem;
      font-size: 0.875rem;
      color: #666;
    }

    .stat {
      display: flex;
      justify-content: space-between;
    }

    .stat-label {
      font-weight: 500;
    }

    .stat-value {
      font-family: 'Monaco', 'Menlo', monospace;
    }

    .budget-check {
      margin-top: 0.5rem;
      padding: 0.5rem;
      background: white;
      border-radius: 4px;
      font-size: 0.875rem;
    }

    .budget-check.passed {
      color: #2e7d32;
    }

    .budget-check.failed {
      color: #c62828;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .summary-card {
      padding: 1.5rem;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .summary-value {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .summary-label {
      color: #666;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .console-output {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 1rem;
      border-radius: 4px;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 0.875rem;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      margin-top: 1rem;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1>⚡ Sherpa UI Performance Benchmarks</h1>
  <p class="subtitle">Measure component performance and validate against budgets</p>

  <div class="controls">
    <button id="run-all-btn">
      <i class="fa-solid fa-play"></i>
      Run All Benchmarks
    </button>
    <button id="run-quick-btn">
      <i class="fa-solid fa-forward"></i>
      Quick Test (Core Components)
    </button>
    <button id="export-btn" disabled>
      <i class="fa-solid fa-download"></i>
      Export JSON
    </button>
  </div>

  <div id="status" class="status hidden">
    <div id="status-message"></div>
  </div>

  <div id="summary" class="summary hidden"></div>

  <div id="results" class="results hidden">
    <h2>Benchmark Results</h2>
    <div id="results-container"></div>
  </div>

  <div id="console" class="console-output hidden"></div>

  <script type="module">
    import { PerformanceBenchmarks } from './benchmark-suite.js';

    const runAllBtn = document.getElementById('run-all-btn');
    const runQuickBtn = document.getElementById('run-quick-btn');
    const exportBtn = document.getElementById('export-btn');
    const statusEl = document.getElementById('status');
    const statusMessage = document.getElementById('status-message');
    const summaryEl = document.getElementById('summary');
    const resultsEl = document.getElementById('results');
    const resultsContainer = document.getElementById('results-container');
    const consoleEl = document.getElementById('console');

    let benchmarks;
    let reportData;

    // Intercept console.log for display
    const originalConsoleLog = console.log;
    console.log = function(...args) {
      originalConsoleLog.apply(console, args);
      consoleEl.classList.remove('hidden');
      consoleEl.textContent += args.join(' ') + '\n';
      consoleEl.scrollTop = consoleEl.scrollHeight;
    };

    runAllBtn.addEventListener('click', runAllBenchmarks);
    runQuickBtn.addEventListener('click', runQuickBenchmarks);
    exportBtn.addEventListener('click', exportJSON);

    async function runAllBenchmarks() {
      await runBenchmarks('full');
    }

    async function runQuickBenchmarks() {
      await runBenchmarks('quick');
    }

    async function runBenchmarks(mode = 'full') {
      // Reset UI
      runAllBtn.disabled = true;
      runQuickBtn.disabled = true;
      exportBtn.disabled = true;
      consoleEl.textContent = '';
      consoleEl.classList.remove('hidden');
      resultsContainer.innerHTML = '';
      summaryEl.innerHTML = '';
      summaryEl.classList.add('hidden');
      resultsEl.classList.add('hidden');

      showStatus('running', 'Running benchmarks...');

      benchmarks = new PerformanceBenchmarks();

      try {
        // Core component benchmarks
        await benchmarks.benchmarkInstantiation('sherpa-button', '../../components/sherpa-button/sherpa-button.js');
        await benchmarks.benchmarkShadowDOM('sherpa-button', '../../components/sherpa-button/sherpa-button.js');
        await benchmarks.benchmarkRendering('sherpa-button', '../../components/sherpa-button/sherpa-button.js', '<sherpa-button>Click Me</sherpa-button>');

        await benchmarks.benchmarkInstantiation('sherpa-input-text', '../../components/sherpa-input-text/sherpa-input-text.js');
        await benchmarks.benchmarkRendering('sherpa-input-text', '../../components/sherpa-input-text/sherpa-input-text.js', '<sherpa-input-text data-label="Name"></sherpa-input-text>');

        await benchmarks.benchmarkInstantiation('sherpa-calendar', '../../components/sherpa-calendar/sherpa-calendar.js');
        await benchmarks.benchmarkCalendarGrid();

        if (mode === 'full') {
          // Additional benchmarks for full suite
          await benchmarks.benchmarkInstantiation('sherpa-container', '../../components/sherpa-container/sherpa-container.js');
          await benchmarks.benchmarkRendering('sherpa-container', '../../components/sherpa-container/sherpa-container.js', '<sherpa-container><div>Content</div></sherpa-container>');

          // Large list rendering
          await benchmarks.benchmarkLargeList(1000);

          // Nested tree
          await benchmarks.benchmarkNestedTree(5);

          // Memory benchmarks (Chrome only)
          await benchmarks.benchmarkMemory('sherpa-button', '../../components/sherpa-button/sherpa-button.js', 100);
          await benchmarks.benchmarkMemory('sherpa-input-text', '../../components/sherpa-input-text/sherpa-input-text.js', 100);
        }

        // Generate report
        reportData = benchmarks.generateReport();

        // Display results
        displaySummary(reportData.summary);
        displayResults(reportData.budgetChecks, reportData.results);

        showStatus('complete', `Benchmarks complete! ${reportData.summary.passed}/${reportData.summary.total} passed (${reportData.summary.passRate}%)`);
        exportBtn.disabled = false;

      } catch (error) {
        console.error('Benchmark error:', error);
        showStatus('error', `Error: ${error.message}`);
      } finally {
        runAllBtn.disabled = false;
        runQuickBtn.disabled = false;
      }
    }

    function showStatus(state, message) {
      statusEl.className = `status ${state}`;
      statusEl.classList.remove('hidden');
      statusMessage.textContent = message;
    }

    function displaySummary(summary) {
      summaryEl.classList.remove('hidden');
      summaryEl.innerHTML = `
        <div class="summary-card">
          <div class="summary-value" style="color: #4caf50;">${summary.passed}</div>
          <div class="summary-label">Passed</div>
        </div>
        <div class="summary-card">
          <div class="summary-value" style="color: #f44336;">${summary.failed}</div>
          <div class="summary-label">Failed</div>
        </div>
        <div class="summary-card">
          <div class="summary-value">${summary.passRate}%</div>
          <div class="summary-label">Pass Rate</div>
        </div>
        <div class="summary-card">
          <div class="summary-value">${summary.total}</div>
          <div class="summary-label">Total Tests</div>
        </div>
      `;
    }

    function displayResults(budgetChecks, results) {
      resultsEl.classList.remove('hidden');
      resultsContainer.innerHTML = '';

      budgetChecks.forEach(check => {
        const resultKey = check.name.toLowerCase().replace(/\s+/g, '-');
        const stats = results[resultKey];

        const item = document.createElement('div');
        item.className = `result-item ${check.passed ? 'passed' : 'failed'}`;

        let statsHTML = '';
        if (stats && stats.mean !== undefined) {
          statsHTML = `
            <div class="result-stats">
              <div class="stat">
                <span class="stat-label">Mean:</span>
                <span class="stat-value">${stats.mean.toFixed(2)}ms</span>
              </div>
              <div class="stat">
                <span class="stat-label">Median:</span>
                <span class="stat-value">${stats.median.toFixed(2)}ms</span>
              </div>
              <div class="stat">
                <span class="stat-label">Min:</span>
                <span class="stat-value">${stats.min.toFixed(2)}ms</span>
              </div>
              <div class="stat">
                <span class="stat-label">Max:</span>
                <span class="stat-value">${stats.max.toFixed(2)}ms</span>
              </div>
              <div class="stat">
                <span class="stat-label">P95:</span>
                <span class="stat-value">${stats.p95.toFixed(2)}ms</span>
              </div>
              <div class="stat">
                <span class="stat-label">P99:</span>
                <span class="stat-value">${stats.p99.toFixed(2)}ms</span>
              </div>
            </div>
          `;
        }

        const status = check.passed ? '✅' : '❌';
        const budgetClass = check.passed ? 'passed' : 'failed';
        const margin = check.passed
          ? `${check.percentage.toFixed(1)}% under budget`
          : `${Math.abs(check.percentage).toFixed(1)}% over budget`;

        item.innerHTML = `
          <div class="result-name">${status} ${check.name}</div>
          ${statsHTML}
          <div class="budget-check ${budgetClass}">
            Budget: ${check.budget}ms | Actual (P95): ${check.actual.toFixed(2)}ms | ${margin}
          </div>
        `;

        resultsContainer.appendChild(item);
      });
    }

    function exportJSON() {
      const json = JSON.stringify(reportData, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `sherpa-ui-benchmarks-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
