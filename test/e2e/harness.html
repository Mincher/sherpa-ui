<!doctype html>
<html lang="en" data-theme="apex-2-core" data-mode="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sherpa-UI — Playwright test harness</title>

  <!-- Design-system tokens + global styles (light DOM). -->
  <link rel="stylesheet" href="/dist/css/styles/index.css" />

  <!-- FontAwesome (icon glyphs used by many components). -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Register every component. Specs inject elements into #root and drive them. -->
  <script type="module" src="/dist/components/index.js"></script>

  <script type="module">
    // Signal readiness once the module has registered a known element, so
    // specs can wait deterministically before injecting.
    customElements.whenDefined('sherpa-tree').then(() => {
      window.__sherpaReady = true;
      document.documentElement.setAttribute('data-sherpa-ready', '');
    });
  </script>

  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; }
    #root { padding: 16px; }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
