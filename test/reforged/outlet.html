<!doctype html>
<html lang="en" data-theme="sherpa">
<head>
  <meta charset="utf-8" />
  <title>sherpa-outlet</title>
  <link rel="stylesheet" href="/dist/styles/tokens/tokens.css" />
  <link rel="stylesheet" href="/dist/styles/tokens/page.css" />
  <script type="module">
    import '/dist/index.js';
    window.__ready = true;
  </script>
</head>
<body>
  <sherpa-router data-params="context view"></sherpa-router>
  <sherpa-provider>
    <sherpa-app-shell>
      <sherpa-nav slot="nav"></sherpa-nav>
      <sherpa-app-header slot="header"></sherpa-app-header>
      <sherpa-outlet id="context-root"></sherpa-outlet>
      <sherpa-dialog slot="overlay" id="settings" data-type="overlay">
        <sherpa-app-header slot="header" data-back></sherpa-app-header>
        <div id="settings-root"></div>
      </sherpa-dialog>
    </sherpa-app-shell>
  </sherpa-provider>
</body>
</html>
