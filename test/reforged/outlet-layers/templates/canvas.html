<!-- A canvas whose card floats beside a floating panel, as the Node Editor's page has them. TODO 823 -->

  <sherpa-layout-canvas id="cv">
    <sherpa-node-panel id="nodes" slot="panel" data-floatable></sherpa-node-panel>
