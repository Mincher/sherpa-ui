<!-- A page whose store and words are its type's alone: app.json `types`, no store the app made. Plan 960 U3 -->
<sherpa-quick-filter-toolbar id="bar" data-scope="data"></sherpa-quick-filter-toolbar>
<sherpa-data-grid id="grid" data-scope="data"></sherpa-data-grid>
<sherpa-button id="remove-bravo" commandfor="context-root" command="--device.remove" value="d2" data-label="Remove Bravo"></sherpa-button>
<sherpa-button id="tag-alpha" commandfor="context-root" command="--device.tag" value="d1" data-label="Tag Alpha"></sherpa-button>
<sherpa-button id="offline-alpha" commandfor="context-root" command="--device.tag" value="d1" data-input='{"status":"offline"}' data-label="Alpha offline"></sherpa-button>
<sherpa-button id="tag-garbled" commandfor="context-root" command="--device.tag" value="d1" data-input="offline" data-label="Garbled"></sherpa-button>
