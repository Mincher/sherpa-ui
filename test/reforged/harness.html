<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Reforged harness</title>
  <!-- Light-DOM token layer: inherits into every shadow root. -->
  <link rel="stylesheet" href="/dist/styles/tokens/tokens.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module">
    // The index registers the components; SherpaElement brings its shared sheets.
    import { settled } from '/dist/index.js';

    await Promise.all([
      customElements.whenDefined('sherpa-button'),
      customElements.whenDefined('sherpa-tag'),
      customElements.whenDefined('sherpa-container'),
      customElements.whenDefined('sherpa-input-text'),
      customElements.whenDefined('sherpa-nav'),
      customElements.whenDefined('sherpa-loader'),
      customElements.whenDefined('sherpa-switch'),
      customElements.whenDefined('sherpa-select-checkbox'),
      customElements.whenDefined('sherpa-select-radio'),
      customElements.whenDefined('sherpa-callout'),
      customElements.whenDefined('sherpa-breadcrumbs'),
      customElements.whenDefined('sherpa-section-header'),
      customElements.whenDefined('sherpa-empty-state'),
      customElements.whenDefined('sherpa-progress-bar'),
      customElements.whenDefined('sherpa-tooltip'),
      customElements.whenDefined('sherpa-key-value-list'),
      customElements.whenDefined('sherpa-list'),
      customElements.whenDefined('sherpa-list-item'),
      customElements.whenDefined('sherpa-tabs'),
      customElements.whenDefined('sherpa-pagination'),
      customElements.whenDefined('sherpa-metric'),
      customElements.whenDefined('sherpa-sparkline'),
      customElements.whenDefined('sherpa-slider'),
      customElements.whenDefined('sherpa-toast'),
      customElements.whenDefined('sherpa-container-header'),
      customElements.whenDefined('sherpa-container-footer'),
      customElements.whenDefined('sherpa-nav-item'),
      customElements.whenDefined('sherpa-nav-section'),
      customElements.whenDefined('sherpa-chat-message'),
      customElements.whenDefined('sherpa-calendar'),
      customElements.whenDefined('sherpa-select-group'),
      customElements.whenDefined('sherpa-transfer-list'),
      customElements.whenDefined('sherpa-code-block'),
      customElements.whenDefined('sherpa-app-header'),
      customElements.whenDefined('sherpa-prompt-composer'),
      customElements.whenDefined('sherpa-toolbar'),
      customElements.whenDefined('sherpa-chart-legend'),
      customElements.whenDefined('sherpa-file-upload'),
      customElements.whenDefined('sherpa-progress-step-tracker'),
      customElements.whenDefined('sherpa-quick-filter'),
      customElements.whenDefined('sherpa-menu'),
      customElements.whenDefined('sherpa-gauge-chart'),
      customElements.whenDefined('sherpa-radial-chart'),
      customElements.whenDefined('sherpa-barchart'),
      customElements.whenDefined('sherpa-line-chart'),
      customElements.whenDefined('sherpa-data-grid'),
      customElements.whenDefined('sherpa-quick-filter-toolbar'),
      customElements.whenDefined('sherpa-accordion'),
      customElements.whenDefined('sherpa-dialog'),
      customElements.whenDefined('sherpa-overlay-panel'),
      customElements.whenDefined('sherpa-panel'),
    ]);

    /*
     * …and WAIT for the fonts before saying ready — but NEVER for long.
     *
     * The BODY font is what sizes a label, and a component that MEASURES text
     * gets a different answer from fallback metrics. `sherpa-quick-filter-toolbar`
     * folded 3 chips against the fallback, then the real font arrived and it
     * needed 4 — so the bar rested overflowing and the test read it as a fold
     * bug. TRAP T-the-fold-measures-whatever-font-is-loaded
     *
     * `fonts.ready` rather than a named face: Inter is not declared by this page
     * at all when it comes from the OS, so there is nothing to `fonts.load()`.
     *
     * THE RACE IS THE POINT, and it is not defensive padding. `fonts.ready` has
     * no timeout of its own, so only a ceiling can save the harness from a slow
     * machine. Losing the race is harmless — the harness behaves as it did
     * before any of this, and only a text MEASUREMENT would notice.
     */
    const FONT_MS = 3000;
    await Promise.race([
      document.fonts.ready.catch(() => {}),
      new Promise((r) => setTimeout(r, FONT_MS)),
    ]);

    window.__reforgedReady = true;

    /**
     * Wait for the DOM to actually SETTLE, instead of guessing a duration.
     *
     * Tests were written with fixed `setTimeout(res, 20)` waits after a
     * populate() — 264 of them across the suite. A guessed duration is a race:
     * it passes on an idle machine and fails under load, and the failure is
     * always the same shape (`shadowRoot` of a not-yet-rendered child is null,
     * so reading it throws). Three tests failed that way in a loaded run while
     * passing alone.
     *
     * This waits for the real condition. Every SherpaElement exposes a
     * `rendered` promise, so:
     *   1. await every sherpa-* element currently in the tree, ANYWHERE —
     *      including inside shadow roots, which is where stamped children live;
     *   2. do it again, because resolving those can stamp more (a toolbar
     *      renders chips, each chip renders its own menu);
     *   3. settle the frame so CSS has been applied before anything is measured.
     *
     * Usage in a test:  await page.evaluate(() => window.__settled());
     */
    // The library's own: one implementation for an app and its tests.
    window.__settled = (passes = 3) => settled(document, passes);

    /**
     * MOUNT ONE COMPONENT, the way every spec was doing it by hand.
     *
     * The block below appeared 543 times across the e2e specs — create, append
     * to #root, await `rendered`, populate, settle — with four spellings of
     * "append" and an ad-hoc type cast on each. A change to how a component
     * mounts was 543 edits, so it did not get made.
     *
     * Usage:  const el = await window.__mount('sherpa-foo', data, { 'data-type': 'view' });
     *
     * `replaceChildren`, so a spec that mounts twice starts clean. Pass
     * `{ keep: true }` in the attributes to append beside what is there.
     */
    window.__mount = async function mount(tag, data, attrs) {
      const root = document.getElementById('root');
      const el = document.createElement(tag);
      const keep = attrs && attrs.keep;
      for (const [name, value] of Object.entries(attrs ?? {})) {
        if (name === 'keep') continue;
        if (value === true) el.setAttribute(name, '');
        else if (value != null) el.setAttribute(name, String(value));
      }
      if (keep) root.appendChild(el);
      else root.replaceChildren(el);
      await el.rendered;
      /* THE CHILDREN TOO. A component's own `rendered` resolves when ITS shadow
         root exists; the buttons and chips inside have shadow roots of their
         own and are still zero-width at that point. */
      const kids = [...el.shadowRoot.querySelectorAll('*')].filter((k) => k.rendered);
      await Promise.all(kids.map((k) => k.rendered));
      /* SETTLE ONLY WHAT THIS MOUNTED. A spec that populates afterwards settles
         itself, and an extra settle here is two more frames of layout before it
         does — which a bar measuring its own fold can see.
         TRAP T-the-fold-measures-whatever-font-is-loaded */
      if (data !== undefined) {
        el.populate(data);
        await window.__settled();
      }
      return el;
    };

    /**
     * A bar's answers as CLAUSES, built by the data layer's ONE builder — what
     * a source would run. A bar builds no clause of its own.
     * TRAP T-one-query-builder-in-the-data-layer
     *
     * Usage:  const clauses = await window.__clauses(bar);
     */
    window.__clauses = async function clauses(bar) {
      const { fieldState, stateClause } = await import('/dist/data.js');
      const out = {};
      for (const [field, { label, values, ...reading }] of Object.entries(bar.readings ?? {})) {
        const clause = stateClause(fieldState({ field, label, values }, reading));
        if (clause) out[field] = clause;
      }
      return out;
    };
  </script>
</body>
</html>
