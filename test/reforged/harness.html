<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Reforged harness</title>
  <!-- Light-DOM token layer: inherits into every shadow root. -->
  <link rel="stylesheet" href="/dist-reforged/styles/tokens/tokens.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module">
    // The index wires SherpaElement.sharedStyles (base reset) and registers components.
    import '/dist-reforged/index.js';
    await Promise.all([
      customElements.whenDefined('sherpa-button'),
      customElements.whenDefined('sherpa-tag'),
      customElements.whenDefined('sherpa-container'),
      customElements.whenDefined('sherpa-input-text'),
      customElements.whenDefined('sherpa-app-shell'),
      customElements.whenDefined('sherpa-nav'),
      customElements.whenDefined('sherpa-loader'),
      customElements.whenDefined('sherpa-switch'),
      customElements.whenDefined('sherpa-select-checkbox'),
      customElements.whenDefined('sherpa-select-radio'),
      customElements.whenDefined('sherpa-callout'),
      customElements.whenDefined('sherpa-breadcrumbs'),
      customElements.whenDefined('sherpa-section-header'),
      customElements.whenDefined('sherpa-empty-state'),
      customElements.whenDefined('sherpa-message'),
      customElements.whenDefined('sherpa-progress-bar'),
      customElements.whenDefined('sherpa-accordion'),
      customElements.whenDefined('sherpa-tooltip'),
      customElements.whenDefined('sherpa-key-value-list'),
      customElements.whenDefined('sherpa-list'),
      customElements.whenDefined('sherpa-list-item'),
    ]);
    window.__reforgedReady = true;
  </script>
</body>
</html>
